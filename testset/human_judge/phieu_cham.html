y attacks are prevalent, leading to dent in brand reputation and consumer trust. 7) Precision Agriculture: Sensors are prone to physical node tampering. Corrupt reading and wrong predictions are certain challenges in smart agriculture. From the above mentioned threats (as depicted in Table 5), it is evident that 5G-empowered IoT systems must maintain a standard security and meet the following requirements [75], [94], [95]: 1) Authentication 2) Access control 3) Confidentiality 4) Integrity 5) Privacy Preservation 6) Trust Management 159312 VOLUME 13, 2025"}, {"source": "A_Comprehensive_Survey_on_Pre_Versus_Post_Quantum_Security_Schemes_for_5G-Enabled_IoT_Applications", "page": 6, "text": "IoT devices may lack compatibility with 5G networks, restricting their functionality and usefulness in specific applications. This compatibility gap could impede the seamless integration of IoT technologies with 5G infrastructure, potentially limiting the scope and effectiveness of IoT deployments reliant on advanced 5G connectivity. The Internet of Things (IoT) is expected to undergo a significant transformation with the arrival of 5G. With low latency, ultra-fast data transmission, and seamless connectivity across a wide range of devices, 5G-enabled IoT is ready to serve to diverse application domains. Each smart application may offer a variety of services to enable a more intuitive environment. However, we are nowhere near exhausting the potential applications of IoT. The Internet of Things permits the combination of sensing, actuating, communication, routing, authentication, identity, and computation, as well as the provision of multiple services"}, {"source": "A_Comprehensive_Survey_on_Pre_Versus_Post_Quantum_Security_Schemes_for_5G-Enabled_IoT_Applications", "page": 7, "text": "B. Choudhury et al.: Comprehensive Survey on Pre Versus Post Quantum Security Schemes TABLE 4. Summary of 5G enabled IoT applications. keenly look for opportunities to exploit the network covertly in order to steal sensitive information or cause financial losses to a business, individual, or organization. They have found the reliability of the devices to be an attractive target because of their deployment in remote locations out of the user’s line of sight. Attackers can viably cause physical damage to the edge devices, introduce harmful software (malware) to compromise the system, or steal personal data, including identities, resulting in privacy breaches. IoT devices are resource-constrained applications. Their peculiar characteristics also poses certain challenges: 1) Large number of IoT devices: The evolution of 5G has increased the number of devices that can be connected per area. Since the number of devices connected to IoT is increasing by leaps and bounds, the task of assigning"}], "claims": ["Smart Cities and IoVT applications require 5G due to their need for significantly higher throughput rates.", "Traditional IoT applications do not demand significantly higher throughput rates.", "The predicted growth of IoT devices poses security challenges.", "5G-empowered IoT systems must maintain standard security.", "5G-empowered IoT systems must meet requirements such as authentication, access control, confidentiality, integrity, privacy preservation, and trust management."]}, {"code": "H30", "question": "In the network-centric Harvest-Now, Decrypt-Later (HNDL) model, what information besides application data is included in harvested ciphertext?", "reference": "Network-layer routing information, subscriber authentication vectors, and inter-domain trust relationships that persist in network registries and certificate transparency logs.", "answer": "I cannot find the answer in the provided documents.", "kg": null, "passages": [{"source": "harvest-now-decrypt-later-pqc-threat-model", "page": 13, "text": "These data are prime targets for HNDL attacks. 5. The Harvest Now, Decrypt Later (HNDL) Threat Model 5.1 Definition and Terminology Harvest Now, Decrypt Later (HNDL), also referred to as “store now, decrypt later” or “retrospective decryption,” describes a cybersecurity attack strategy in which an adversary: 1. Intercepts, exfiltrates, or otherwise copies encrypted data during the present day 2. Stores that encrypted data in secure archives without attempting to decrypt it immediately 3. Waits for technological advancement (specifically, quantum computers) to render decryption feasible 4. Retroactively decrypts the historical data, exploiting information that was encrypted at the time of collection HNDL differs fundamentally from traditional cybersecurity breaches in several ways: • Temporal Asymmetry: The adversary collects data when it is protected by strong encryption but decrypts it at a future point when cryptographic defenses have weakened."}, {"source": "Harvest-Now, Decrypt-Later - A Temporal Cybersecurity Risk in the Quantum Transition", "page": 3, "text": "1. Formalization of the HNDL adversarial model: We introduce the first formal model of the harvest-now, decrypt-later (HNDL) adversary, specifying its resources, collection capability, deferred decryption power, and temporal horizon, and defining the precise conditions under which confidentiality fails. This establishes a rigorous foundation for analyzing deferred decryption as a cryptographically grounded threat to communication networks. 2. Sectoral exposure quantification: We characterize confidentiality lifetimes across heterogeneous sectors and show how temporal asymmetry amplifies retrospective compromise. The analysis links data retention, migration latency, and exposure probability to operational parameters in IoT, 5G, satellite, and cloud systems. 3. Evaluation of layered countermeasures: We assess post-quantum cryptography, hybrid key exchange, forward-secure data life-cycles, and governance frameworks as"}, {"source": "harvest-now-decrypt-later-pqc-threat-model", "page": 16, "text": "• Financial Impact: Exposure of financial transactions, proprietary pricing, and strategic information enables fraud or competitive advantage • Medical Privacy: Revelation of patient data causes medical privacy violations and identity theft • Intellectual Property: Exposure of trade secrets, source code, or R&D data enables competitive copying or undermines patent protections HNDL Attack Lifecycle: Harvest Now, Decrypt Later TIME PHASE 1 HARVEST Intercept encrypted network traffic Collect TLS sessions, VPN data, emails Store ciphertext in long-term archives 2015-2026 PHASE 2 STORE & WAIT Maintain petabytes of encrypted data Monitor quantum computing progress Prepare decryption infrastructure 2020-2030 PHASE 3 DECRYPT Deploy CRQC with 4000+ logical qubits Execute Shor's algorithm on RSA/ECC Mass decryption of harvested data 2030+ Nation-state actors & APT groups active Data remains encrypted but vulnerable Retroactive breach of all harvested data"}, {"source": "The-Quantum-Security-Deadline", "page": 6, "text": "data, secure communications, and digital identities protected by RSA, ECC, or DH algorithms will  be instantly compromised (Kampanakis, 2024). This inevitability underscores the immediate need  to transition to Post-Quantum Cryptography (PQC) algorithms standardized by NIST and  supported by global cybersecurity agencies (NIST, 2022; ANSSI, 2023).    The “Harvest Now, Decrypt Later” (HNDL) Threat Model  The Harvest Now, Decrypt Later (HNDL) threat model represents one of the most insidious  quantum-era risks. Under this model, adversaries exfiltrate and store encrypted data today, fully  aware that decryption may only become possible years later when CRQCs reach maturity. This  strategy effectively weaponizes time, targeting the longevity of encryption rather than its  immediate strength (HashiCorp, 2025; Keyfactor, 2024).    HNDL attacks are particularly dangerous because they are undetectable at the time of exfiltration."}], "claims": []}, {"code": "H31", "question": "How does the Module-LWE problem underlying ML-KEM and ML-DSA relate to the basic Learning With Errors (LWE) problem in lattice-based cryptography?", "reference": "LWE asks to find a secret vector s such that A·s ≈ b (mod q) given A and b; its security comes from the difficulty of solving noisy linear systems, and together with SVP it is believed resistant to quantum algorithms, with ring variants such as Ring-LWE used for efficiency. Module-LWE adds ring/module structure: over the module R_q^k with R = Z[X]/(X^n+1), given (A, b = As + e) one must distinguish this distribution from uniform; this refinement underlies NIST's standardized ML-KEM and ML-DSA, balancing theoretical guarantees with practical efficiency.", "answer": "The Module-LWE (M-LWE) problem generalizes the basic LWE problem by introducing a ring structure. Specifically, M-LWE operates over a polynomial ring \\( R = \\mathbb{Z}[X]/(X^n + 1) \\) and a modulus \\( q \\), whereas LWE is defined over a vector space. This ring structure allows M-LWE to inherit the security properties of LWE while potentially offering efficiency improvements, making it suitable for practical deployment in schemes like ML-KEM and ML-DSA.", "kg": null, "passages": [{"source": "Post-Quantum Cryptography and Quantum-Safe Security", "page": 6, "text": "introducing ring structure [53]. For a polynomial ring 𝑅= Z[𝑋]/(𝑋𝑛+ 1) and modulus 𝑞, M-LWE is defined over the module 𝑅𝑘 𝑞as follows: M-LWE𝑛,𝑘,𝑞,𝜒: Given (𝐴, b = 𝐴s + e) with 𝐴∈𝑅𝑘×𝑘 𝑞 , s ∈𝑅𝑘 𝑞, e ←𝜒𝑘, distinguish this distribution from uniform. (2) This refinement forms the basis for NIST’s standardized schemes, the module-lattice key encapsulation mechanism (ML-KEM) and the module-lattice digital signature algorithm (ML-DSA). These constructions carefully balance rigorous theoretical guarantees with computational efficiency, making them suitable for practical deployment while inheriting the robust hardness assumptions of classical lattice problems. 2.1.2 Code-Based Security Foundations. Code-based cryptography builds upon the computational difficulty of decoding random linear error-correcting codes, a problem that has demonstrated remarkable resilience against algorithmic improvements for over four decades since its introduction"}, {"source": "Post-Quantum Cryptography and Quantum-Safe Security", "page": 6, "text": "a secret vector s ∈Z𝑛 𝑞and an error distribution 𝜒over Z𝑞, the LWE problem is defined as: LWE𝑛,𝑞,𝜒: Distinguish between distributions consisting of (a, ⟨a, s⟩+ 𝑒) and uniformly random pairs (a,𝑢), (1) where a ←Z𝑛 𝑞, 𝑒←𝜒, and 𝑢←Z𝑞. The power of lattice-based systems lies in their worst-case to average-case reductions, which connect cryptographic security to the hardness of solving general lattice problems [65]. These reductions guarantee that if an adversary can solve random LWE instances, then they could also efficiently solve the most difficult lattice problems in the worst case. This property provides rare, long-term assurances of security, reinforcing confidence in lattice-based primitives that have withstood extensive analysis for over twenty years. To further improve efficiency while preserving security, the M-LWE problem generalizes LWE by introducing ring structure [53]. For a polynomial ring 𝑅= Z[𝑋]/(𝑋𝑛+ 1) and modulus 𝑞, M-LWE is defined over the module 𝑅𝑘 𝑞as follows:"}, {"source": "Next-Generation Quantum Security - The Impact of Quantum Computing on Cybersecurity—Threats, Mitigations, and Solutions", "page": 14, "text": "5.1. Lattice-based cryptography: A pillar of post-quantum security Lattice-based cryptography relies on the computational hardness of the Shortest Vector Problem (SVP) and the Learning With  Errors (LWE) problem [184]. These problems are currently considered resistant to quantum algorithms. The LWE problem involves  determining a vector 𝑠∈Z𝑛 𝑞 such that 𝐴⋅𝑠≈𝑏(mod 𝑞), given a matrix 𝐴∈Z𝑚×𝑛 𝑞  and a vector 𝑏∈Z𝑚 𝑞. The intractability of LWE  forms the basis for its cryptographic security, as no efficient quantum algorithm exists to solve it in polynomial time. Ring-based variants such as Ring-LWE, which operate over polynomial rings, are widely used in key exchange and digital  signature schemes due to their efficiency [185]. The security of LWE stems from the difficulty of solving noisy linear systems, with  the hardness closely tied to worst-case lattice problems [186]. The carefully chosen noise distribution ensures that distinguishing"}, {"source": "harvest-now-decrypt-later-pqc-threat-model", "page": 29, "text": "Problem Family Algorithm Math Basis Key Size Sig Size Maturity Lattice (ModuleLWE) MLKEM Learning With Errors 1,184 bytes N/A Very High (NIST std) Lattice (Module) MLDSA Module-lattice 1,312 bytes 2,420 bytes Very High (NIST std) Hash-Based SLHDSA Merkle tree hash 64 bytes 17,088 bytes Very High (NIST std) Code-Based HQC Quasi-cyclic Hamming 2,400 bytes N/A High (draft 2027) Lattice (NTRU) Falcon NTRU lattice 897 bytes 666 bytes High (round-4) Code-Based BIKE Bit-flipping codes 1,292 bytes N/A Moderate 9.2 Performance Characteristics Performance varies significantly by algorithm and operation type: Metric (ms) ML-KEM ML-DSA SLH-DSA HQC Falcon Key Generation 0.3–0.5 0.5–0.8 1–2 0.5–1 0.2–0.5 Signature Generation – 0.8–1.2 50–100 – 0.1–0.2 Signature Verification 0.3–0.5 1.5–2 5–10 0.3–0.5 0.5–1 Key Encapsulation 0.3–0.5 – – 0.3–0.5 – Key Decapsulation 0.3–0.5 – – 0.3–0.5 – Observations: • ML-KEM and ML-DSA provide excellent performance, comparable to or faster than classical algorithms"}], "claims": ["The Module-LWE problem is a generalization of the basic LWE problem.", "The Module-LWE problem operates over a polynomial ring.", "The polynomial ring is defined as R = Z[X]/(X^n + 1).", "The Module-LWE problem operates over a modulus q.", "The LWE problem is defined over a vector space.", "The ring structure of Module-LWE allows it to inherit the security properties of LWE.", "The ring structure of Module-LWE potentially offers efficiency improvements.", "The Module-LWE problem is suitable for practical deployment in schemes like ML-KEM and ML-DSA."]}, {"code": "H32", "question": "How has hybrid post-quantum key agreement been deployed in Chrome, and how do hybrid PQC deployments keep backward compatibility with parties that do not support it?", "reference": "From late 2022 into 2023 Google deployed a hybrid X25519+Kyber key agreement in Chrome (with BoringSSL), and by late 2024 it was enabled for all desktop use, likely the largest PQC deployment so far, done without user disruption. In hybrid deployments, modern clients and servers support both classical and PQC algorithms and negotiate mutually supported ones, preferring hybrid; with graceful degradation they fall back to classical algorithms if hybrid is unavailable, may offer pure PQC, and eventually phase out classical-only systems.", "answer": "Chrome has deployed a hybrid X25519+Kyber key agreement, making it likely the largest post-quantum cryptography deployment ever. For backward compatibility, if hybrid PQC is unavailable, Chrome uses classical algorithms if supported, or offers pure PQC as an alternative, eventually phasing out classical-only systems.", "kg": null, "passages": [{"source": "harvest-now-decrypt-later-pqc-threat-model", "page": 38, "text": "Hybrid Solution Levels: 1. Hybrid Support in Modern Clients/Servers: Modern systems support both classical and PQC. During handshake negotiation, both parties use whichever algorithms are mutually supported, with preference for hybrid if available. 2. Graceful Degradation: If one party doesn’t support hybrid: • Use classical if hybrid unavailable (maintains backward compatibility) • Offer pure PQC as alternative • Eventually phase out classical-only systems 3. Migration Timeline: 28 Amazon Web Services (AWS). (2024). “AWS Key Management Service Post-Quantum Cryptography.” AWS Security Blog. Available: https://aws.amazon.com/blogs/security/ 29 Westerbaan, B., & Rubin, C. D. (2022). “Defending against future threats: Cloudflare goes post-quantum.” Cloudflare Blog, October 3, 2022. Available: https://blog.cloudflare.com/post-quantum-for-all/ 30 Google Chrome Team. (2023). “Chrome 116 Beta: Post-Quantum Key Agreement in TLS.” Chromium Blog. Available: https://blog.chromium.org/"}, {"source": "A Survey of Post-Quantum Cryptography Support in Cryptographic Libraries", "page": 9, "text": "already claim to be CNSA 2.0 ready for government use [45]. The upcoming support for OpenSSL is also largely driven by government and industry compliance needs [19]. Web and Internet Security (Browsers and Cloud) Perhaps the most visible real-world deployment of PQC to date is in web browsers and cloud services. In late 2022 and into 2023, Google began deploying a hybrid X25519+Kyber key agreement in Chrome (with BoringSSL). By late 2024, Chrome had this enabled for all desktop use, making it likely the largest post-quantum cryptography deployment ever [29]. This achievement, executed seamlessly without user disruption, highlights careful engineering and demonstrates the feasibility of PQC at a large scale. Likewise, Cloudflare, which handles a significant fraction of Internet traffic, announced that it “now uses post-quantum cryptography to talk to your origin server” [49]."}, {"source": "harvest-now-decrypt-later-pqc-threat-model", "page": 38, "text": "30 Google Chrome Team. (2023). “Chrome 116 Beta: Post-Quantum Key Agreement in TLS.” Chromium Blog. Available: https://blog.chromium.org/ 31 Microsoft Azure. (2024). “Azure Post-Quantum Cryptography Roadmap.” Microsoft Security Documentation. 38"}, {"source": "Are Enterprises Ready for Quantum-Safe Cybersecurity", "page": 5, "text": "gorithms, implying that technologists face an engineering challenge to achieve parity with the ubiquity of RSA/ECC [35]. Another technical challenge is ensuring interoperability and trust in the new algorithms. Standards bodies like the IETF are working on standards for PQC in protocols (e.g., RFCs for PQC in TLS, IPsec, and SSH). Likewise, the WebPKI ecosystem (browsers and Certificate Authorities) needs consensus on how to issue and handle quantum-safe certificates. As of 2025, some Certificate Authorities have begun issuing hybrid certificates (containing both classical and PQC public keys) as an intermediate step [36, 37]. These measures are indicative of a transition phase where hybrid cryptography is employed: using both a classical and a postquantum algorithm in parallel so that security holds unless both are broken. Hybrid modes are intended to provide confidence and backwards compatibility, though they add complexity and"}], "claims": ["Chrome has deployed a hybrid X25519+Kyber key agreement.", "Chrome is likely the largest post-quantum cryptography deployment ever.", "Hybrid PQC deployments use classical algorithms if hybrid PQC is unavailable.", "Hybrid PQC deployments use pure PQC as an alternative if hybrid PQC is unavailable.", "Hybrid PQC deployments will eventually phase out classical-only systems."]}, {"code": "H33", "question": "Which conventional public key cryptography methods are described as susceptible to quantum risks in the survey of pre- versus post-quantum security for 5G-enabled IoT?", "reference": "RSA, Diffie-Hellman, Secret Sharing, and Elliptic Curve Cryptography (ECC).", "answer": "The survey describes conventional public key cryptography methods such as RSA, Diffie-Hellman, Secret Sharing, and Elliptic Curve Cryptography (ECC) as susceptible to quantum risks.", "kg": null, "passages": [{"source": "A_Comprehensive_Survey_on_Pre_Versus_Post_Quantum_Security_Schemes_for_5G-Enabled_IoT_Applications", "page": 4, "text": "B. Choudhury et al.: Comprehensive Survey on Pre Versus Post Quantum Security Schemes TABLE 2. Comparative analysis of state-of-the-art surveys at a glance. 2) We summarize the emerging trend of 5G and Digital twin and emphasize their impact in the context of IoT Applications. 3) We provide a detailed review of attacks and cryptographic solutions proposed as a countermeasure while analyzing their feasibility in practical implementation and computational and communication overheads. 4) We add a new classification of solutions: traditional public key schemes and post-quantum public key schemes to secure the 5G-enabled IoT subsystems and provide a contrast between the two approaches. B. COMPOSITION OF THE SURVEY We value the time of our readers and have conscientiously crafted this survey by following an organized and systematic procedure. In the initial phases, we consulted renowned journals’ databases such as IEEE, Elsevier, Wiley, ACM Digital Library, Springer,"}, {"source": "A_Comprehensive_Survey_on_Pre_Versus_Post_Quantum_Security_Schemes_for_5G-Enabled_IoT_Applications", "page": 9, "text": "B. Choudhury et al.: Comprehensive Survey on Pre Versus Post Quantum Security Schemes FIGURE 4. Attacks in IoT Network. TABLE 5. Summary of security risks and challenges. 7) Availability 8) Resilience against quantum threats To ensure these standards in the 5G-empowered network, many researchers have carried out careful experiments and proposed cryptographic solutions. We explore the potential solutions in the subsequent sections. V. TAXONOMY OF CRYPTOGRAPHY SOLUTIONS AGAINST SECURITY BREACHES IN 5G-ENABLED IoT SYSTEMS Many potential solutions have been proposed in the field of 5G-empowered security, which requires a systematic organization for acquiring meaningful insights from these diverse research components. In the past, many researchers, [22], [23], [24], [25], [26], [27], [28], [29], [30] presented a taxonomy of solutions based on machine learning and deep learning-based approaches. These surveys did not highlight any cryptographic solutions and are limited to intrusion"}, {"source": "A_Comprehensive_Survey_on_Pre_Versus_Post_Quantum_Security_Schemes_for_5G-Enabled_IoT_Applications", "page": 3, "text": "B. Choudhury et al.: Comprehensive Survey on Pre Versus Post Quantum Security Schemes TABLE 1. List of abbreviations. • Hybrid Schemes: Hybrid schemes combining both pre and post quantum cryptography for efficient implementation and backward compatibility is yet to be standardised. • Risk Assessment Frameworks and Mitigation Measures: Thorough risk analysis and proactive steps to guarantee the resilience and reliability of 5G IoT security structures should be the default requirement of any solution. • AI Integration: Although AI is being integrated in a big way, but several challenges still remain such as the availability of 5G Specific dataset, model security, transparency through XAI and use of pretrained model. • Real Time Requirements: Many applications and core operations of 5G IoT have real time constraints. Design of PQC algorithms with complex computations running on resource constrained IoT devices for real time applications is hard to achieve."}, {"source": "A_Comprehensive_Survey_on_Pre_Versus_Post_Quantum_Security_Schemes_for_5G-Enabled_IoT_Applications", "page": 1, "text": "ABSTRACT The proliferation of 5th generation (5G) technology has catalyzed significant advancements in various application of Internet of Things (IoT) such as Intelligent Transportation Systems, Smart Energy, Industrial IoT (IIoT), Digital Twins, Autonomous Aerial Vehicles (UAVs) and Smart Health. However, with the upcoming advent of quantum computing, conventional security methods are encountering new and significant challenges, requiring the revaluation of pre and post-quantum security measures. This study provides an in-depth analysis of security measures before and after the advent of quantum computing for intelligent IoT applications enabled by 5G-connected network. The survey thoroughly analyzes the strengths and weaknesses of conventional public key cryptography methods such as RSA, Diffie-Hellman, Secret Sharing, and Elliptic Curve Cryptography (ECC), which are susceptible to quantum risks, and postquantum"}], "claims": ["The survey describes conventional public key cryptography methods.", "RSA is susceptible to quantum risks.", "Diffie-Hellman is susceptible to quantum risks.", "Secret Sharing is susceptible to quantum risks.", "Elliptic Curve Cryptography (ECC) is susceptible to quantum risks."]}, {"code": "H34", "question": "Why does Shor's algorithm threaten RSA and elliptic-curve cryptography while Grover's algorithm can be countered by larger symmetric keys, and how many noisy qubits do theoretical estimates say are needed to break 2048-bit RSA?", "reference": "Shor's algorithm efficiently factors large integers and computes discrete logarithms, the hard problems underlying RSA and ECC, so a sufficiently powerful quantum computer could break them. Grover's algorithm only gives a quadratic speed-up for brute-force search, halving the security of symmetric ciphers (AES-128 would have 64-bit security), which can be countered by doubling key sizes. Theoretical resource estimates suggest 2048-bit RSA keys could be broken with fewer than a million noisy qubits.", "answer": "Shor's algorithm threatens RSA and elliptic-curve cryptography because it can efficiently factor large numbers and solve the discrete logarithm problem, respectively, whereas Grover's algorithm provides a quadratic speedup for unstructured search problems, allowing for larger symmetric key sizes to maintain security. Theoretical estimates suggest that breaking a 2048-bit RSA key using Shor's algorithm would require about one million noisy qubits and a week of runtime on a quantum computer.", "kg": null, "passages": [{"source": "Next-Generation Quantum Security - The Impact of Quantum Computing on Cybersecurity—Threats, Mitigations, and Solutions", "page": 9, "text": "frequently encountered during cryptographic key searches [83]. Grover’s algorithm weakens symmetric encryption by reducing  the number of operations required, though it impacts public-key cryptography less than Shor’s algorithm [84]. Shor’s algorithm  and Grover’s algorithm represent the two biggest discoveries in quantum computation, having a significant impact on the field of  cryptography [85]. Grover’s algorithm achieves quadratic speedup for unstructured search problems and can potentially break some symmetric  keys like AES [86], while Shor’s algorithm can efficiently factor large numbers and break public-key encryption schemes like  RSA [87]. These quantum algorithms demonstrate the power of quantum computers, making quantum-resistant cryptographic  Computers and Electrical Engineering 128 (2025) 110649  9"}, {"source": "A Comparative Study of Classical and Post-Quantum Cryptographic Algorithms in the Era of Quantum Computing", "page": 3, "text": "logarithms in polynomial time, directly undermining the security assumptions on which most public-key cryptographic systems are based. Systems such as RSA, the Diffie–Hellman Key Exchange, Elliptic Curve Cryptography (ECC), and the Digital Signature Algorithm (DSA) are all rendered insecure by the capabilities of this quantum algorithm. What makes Shor’s algorithm particularly threatening is its ability to reduce the complexity of these problems from exponential to polynomial time, thereby enabling quantum adversaries to efficiently decrypt data or forge credentials that would otherwise be considered secure. For example, a 2048-bit RSA key—currently assumed to be robust against classical attacks—could be broken within seconds using a sufficiently large and stable quantum computer running Shor’s algorithm. This quantum advantage implies the potential for total cryptanalytic compromise of traditional public-key 3"}, {"source": "Harvest-Now, Decrypt-Later - A Temporal Cybersecurity Risk in the Quantum Transition", "page": 3, "text": "computation of discrete logarithms on a quantum computer, implying that both RSA and elliptic-curve cryptography (ECC) would collapse once scalable quantum hardware becomes available [1,2]. Recent advances in quantum resource estimation have accelerated this timeline. Notably, Google researchers reported that factoring a 2048-bit RSA modulus could require only about one million noisy qubits and a week of runtime. This is a dramatic reduction from earlier twenty-million–qubit projections [12]. Symmetric cryptography remains comparatively resilient, yet Grover’s algorithm offers a quadratic speed-up for brute-force key search, effectively halving the security margin of symmetric ciphers [13]. To compensate, doubling key lengths such as upgrading AES-128 to AES-256, preserves equivalent post-quantum strength [14]. These foundational breakthroughs underpin the HNDL paradigm: adversaries can capture encrypted data"}, {"source": "harvest-now-decrypt-later-pqc-threat-model", "page": 11, "text": "Shor’s algorithm would require only 2ˆ30 to 2ˆ40 quantum gates on a quantum computer with sufficient coherence time. Elliptic Curve Cryptography (ECC), standardized more recently (1990s-2000s) and adopted widely across digital certificates, TLS, and blockchain systems, achieves equivalent security with substantially smaller key sizes. While RSA-2048 is considered 112-bit secure, elliptic curve P-256 (corresponding to a 256-bit key) provides equivalent security. However, ECC relies on the discrete logarithm problem over elliptic curves—a problem Shor’s algorithm also solves exponentially faster than classical methods. Implications: Both RSA and ECC are vulnerable to Shor’s algorithm. All digital certificates, TLS handshakes, digital signatures, and public-key infrastructure relying on these algorithms will become insecure against quantum attack. 4.2 Symmetric Cryptography and Hash Functions Symmetric encryption (AES in particular) and cryptographic hash functions (SHA-2, SHA-3) do"}], "claims": ["Shor's algorithm can efficiently factor large numbers.", "Shor's algorithm can solve the discrete logarithm problem.", "Grover's algorithm provides a quadratic speedup for unstructured search problems.", "Larger symmetric key sizes can maintain security against Grover's algorithm.", "Breaking a 2048-bit RSA key using Shor's algorithm would require about one million noisy qubits.", "Breaking a 2048-bit RSA key using Shor's algorithm would require a week of runtime on a quantum computer."]}, {"code": "H35", "question": "In variational quantum circuits, what name is given in quantum simulation to the approach that uses parametrized random circuits of varying depth?", "reference": "It is called a \"hardware efficient ansatz\": instead of a parameterization inspired by physical domain knowledge, the circuit is a parametrized random circuit of varying depth.", "answer": "In quantum simulation, the approach that uses parametrized random circuits of varying depth is referred to as a \"hardware efficient ansatz\".", "kg": null, "passages": [{"source": "Barren plateaus in quantum neural network training landscapes", "page": 1, "text": "While the precise formulation of these methods and their domains of applicability diﬀer considerably, they typically tend to rely upon the optimization of some parameterized unitary circuit with respect to an objective function that is typically a simple sum of Pauli operators or ﬁdelity with respect to some state. This framework is reminiscent of the methodology of classical neural networks [23, 24]. As with any non-linear optimization, the choice of both the parameterization and the initial state is important. In quantum simulation, there is often a choice inspired by physical domain knowledge [3, 17, 25– 29]. However, in all domains of applicability, there have been implementations that utilize parametrized random circuits of varying depth [7, 13, 21, 23, 30]. Within quantum simulation that approach has been referred to as a “hardware eﬃcient ansatz” [13]. When little structure is known about the problem or x f(x) U(θ) ε <f>"}, {"source": "Variational quantum algorithms", "page": 1, "text": "be available in the near future. Current quantum devices have serious constraints, including limited numbers of qubits and noise processes that limit circuit depth. Variational Quantum Algorithms (VQAs), which use a classical optimizer to train a parametrized quantum circuit, have emerged as a leading strategy to address these constraints. VQAs have now been proposed for essentially all applications that researchers have envisioned for quantum computers, and they appear to the best hope for obtaining quantum advantage. Nevertheless, challenges remain including the trainability, accuracy, and eﬃciency of VQAs. Here we overview the ﬁeld of VQAs, discuss strategies to overcome their challenges, and highlight the exciting prospects for using them to obtain quantum advantage. I. INTRODUCTION Quantum computing holds promise for a number of applications that have motivated the decades-long quest to build the necessary physical hardware. For example, with"}, {"source": "A Survey of Quantum Generative Adversarial Networks", "page": 3, "text": "Quantum Eigensolver (VQE) [6] and Quantum Approximate Optimization Algorithm (QAOA) [7]. 2.2 Key Quantum Circuit Architectures Several quantum circuit architectures have emerged as particularly useful for QGAN implementations, and the choice of architecture often depends on the specific application domain, available quantum resources, and the nature of the data being modeled. Major architectures are as follows. Variational Quantum Circuits (VQCs) are parameterized quantum circuits that can be optimized through classical optimization techniques. A typical VQC consists of an initial state preparation, followed by layers of parameterized gates |ψ(θ)⟩= UL(θL) · · · U2(θ2)U1(θ1)|0⟩⊗n, (4) where each Ui(θi) represents a layer of parameterized quantum gates. VQCs are the most common architecture for QGANs due to their flexibility and trainability [8, 9]. 3"}, {"source": "A Survey of Quantum Machine Learning - Foundations,Algorithms, Frameworks, Data and Applications", "page": 8, "text": "91:8 F. Rodríguez-Díaz et al. A particularly important class of quantum circuits in the context of quantum machine learning is the Variational Quantum Circuit (VQC). The key idea behind VQCs is to construct a parameterized quantum circuit with fixed architecture but adjustable parameters (e.g., rotation angles), which are optimized to minimize a classical cost function. A VQC typically consists of three main stages. First, classical input data are encoded into quantum states using an embedding circuit or feature map. Second, a sequence of parameterized quantum gates is applied to the qubits, forming the trainable part of the circuit. These gates depend on realworld parameters that are tuned during training. Finally, quantum measurements are performed, and the resulting expectation values are used to evaluate a classical cost function, which is subsequently minimized using classical optimization algorithms."}], "claims": ["In quantum simulation, variational quantum circuits use parametrized random circuits of varying depth.", "This approach is referred to as a hardware efficient ansatz."]}, {"code": "H36", "question": "When should organizations begin post-quantum cryptography migration, and why is waiting for Q-Day an error?", "reference": "Organizations should begin PQC migration now: with Q-Day estimated at 2030 ± 5 years and migration taking 2-5 years (plus 1-3 years of supply-chain coordination), migration must start in 2025-2028 to finish before 2030-2035; legacy constraints and long data confidentiality requirements also make waiting a strategic error.", "answer": "Organizations should begin post-quantum cryptography migration now, ideally between 2025-2028, to complete before Q-Day (estimated around 2030 ± 5 years). Waiting for Q-Day is an error because it creates unnecessary risk, cost, and disruption. If Q-Day occurs before migration is complete, exposed data becomes immediately vulnerable.", "kg": "Knowledge graph entities:\n- Q-Day (CONCEPT): Estimates of when quantum computers capable of breaking encryption might realistically materialize.; Computers that can break encryption might realistically materialize on Q-Day.; Timeline for a quantum computer to becom\n- Post-Quantum Cryptography (CONCEPT): Cryptography that remains secure against quantum attacks.; Standard that targets encryption and key management.; Protects data at rest and in transit from quantum-capable adversaries.; Defense mechanism to be combined wi\n- cryptography (CONCEPT): Applications in critical fields of QML.; Cryptography is being threatened by quantum technology.; Area affected by quantum capabilities.; Field where quantum computing can outperform classical methods.; Cryptography reli\n- Quantum Cryptography (CONCEPT): Has applications in quantum cryptography.; Implication of the technique of extracting eigenvalues of unitary operators.; Previous study area focusing on secure quantum communications.; Sector that could be revolutionized\n- migration (CONCEPT): Process of transitioning to new PQC algorithms.; Five-phase technical roadmap for migration.; Process of moving to PQC standards.; Process of moving to PQC.\n- US Department of Homeland Security (ORGANIZATION): Has issued guidelines on post-quantum cryptography.\n- National Security Memorandum 10 (STANDARD): Declared the need for transitioning cryptographic systems to quantum-resistant cryptography by 2035.; U.S. government has set requirements for federal agencies to inventory their cryptographic systems and plan for a tran\n- PQC standards (STANDARD): Standards for post-quantum cryptography.; Progress in PQC standards is an internal positive factor for readiness.; NIST’s Post-Quantum Cryptography standards expected to evolve.; Standards that will be finalized for post\n\nKnowledge graph relations:\n- Q-Day -- PQC migration: If Q-Day occurs before migration, data becomes vulnerable.; Migration should begin now to avoid waiting until Q-Day.\n- Post-Quantum Cryptography -- quantum-based attacks: Migration toward post-quantum cryptography is urgent to avoid future quantum-based attacks.\n- quantum threat -- Post-Quantum Cryptography: Quantum threat necessitates migration to PQC now.\n- Post-Quantum Cryptography -- NIST’s multi-year process: PQC algorithms are evaluated and standardized by NIST’s process.\n- harvest now, decrypt later -- Post-Quantum Cryptography: Challenges PQC migration.; PQC is needed to counter HNDL threats.\n- quantum computing progress -- Post-Quantum Cryptography: Progress in quantum computing drives the need for post-quantum cryptography.\n- long-lived data -- Post-Quantum Cryptography: Organizations managing long-lived data face a strategic imperative to migrate to PQC now.\n- migration playbooks -- Post-Quantum Cryptography: Developed to address challenges.\n- Post-Quantum Cryptography -- technical debt: Organizations avoid technical debt tomorrow when transitioning.\n- Post-Quantum Cryptography -- quantum era: Post-quantum cryptography addresses challenges of the quantum era.\n- Post-Quantum Cryptography -- classical cryptography: PQC can be deployed via software updates unlike QKD.\n- Post-Quantum Cryptography -- performance optimization: Challenges include performance optimization.", "passages": [{"source": "harvest-now-decrypt-later-pqc-threat-model", "page": 63, "text": "support PQC - Coordinate with other vendors and standards bodies For Government and Regulators 78, 79: - Establish clear timelines and requirements for PQC adoption - Provide guidance and standards (NIST, NCSC, ENISA models) - Consider regulatory enforcement to ensure migration progress - Coordinate internationally on quantum-safe standards For Researchers: - Continue cryptanalysis of PQC algorithms - Develop tools for automated cryptographic discovery and management - Research PQC for constrained environments (IoT, embedded) - Investigate alternative quantum-secure paradigms 19.3 Final Statement The quantum threat is not a future event—it is a present-day risk to long-lived data. Organizations managing data with confidentiality requirements extending years or decades face a strategic imperative to migrate to post-quantum cryptography now. Waiting for quantum computers to appear before beginning migration creates unnecessary risk, cost, and disruption."}, {"source": "Post-Quantum Cryptography and Quantum-Safe Security", "page": 27, "text": "Post-Quantum Cryptography and Quantum-Safe Security: A Comprehensive Survey 27 such as zero-trust architectures, homomorphic encryption, and secure multiparty computation also warrants systematic investigation, as these fields converge in building the security foundations of a post-quantum digital ecosystem. Finally, researchers must recognize that PQC migration is not solely a technical problem but a socio-technical transition akin to the historical adoption of public-key cryptography in the late 20th century. Success will require coordination between researchers, standards bodies, policymakers, and industry stakeholders. Challenges such as “harvest now, decrypt later” threats, uneven adoption across regions, and the economic costs of retrofitting infrastructure highlight the importance of developing migration playbooks, sector-specific roadmaps, and global collaboration mechanisms. By foregrounding these systemic issues, future work can ensure that"}, {"source": "harvest-now-decrypt-later-pqc-threat-model", "page": 58, "text": "Timeline Risk 63, 64: • If Q-Day occurs before PQC migration is complete, exposed data becomes vulnerable immediately • Organizations migrating later face accelerated timelines, increased costs, and error risk • Historical example: Y2K crisis (1999-2000)—organizations that delayed faced crisisdriven hasty implementations 65 Organizational Inertia: • Cryptographic changes require coordination across many teams • Legacy systems are difficult to change • Competing priorities limit resources available for PQC • Organizational inertia slows response despite urgency Mitigation: • Board-level governance establishing quantum risk as enterprise priority • Dedicated resources and budget for PQC program • Vendor and third-party engagement to ensure supply chain readiness 63 ScienceDirect. (2025). “Complexity and the Transition to Post-Quantum Security.” Procedia Computer Science. Retrieved from https://www.sciencedirect.com/science/article/pii/S1877050925022896"}, {"source": "harvest-now-decrypt-later-pqc-threat-model", "page": 59, "text": "• Migration must begin immediately to enable orderly transition 17.2 Why Waiting for Q-Day Is a Critical Error Several factors make waiting for Q-Day appearance a strategic error: 1. Cryptographic Transition Duration: Moving entire cryptographic infrastructure to PQC requires 2-5 years for most organizations 2. Supply Chain Coordination: Vendors, cloud providers, and partners must coordinate transition (adds 1-3 years) 3. Legacy System Constraints: Some systems are difficult to upgrade and require extended transition periods 4. Data Confidentiality Requirements: Data encrypted today remains sensitive throughout cryptographic transition period Timeline Analysis: - Q-Day estimate: 2030 ± 5 years (accounting for uncertainty) - Migration duration: 2-5 years after decision - Required migration start: 2025-2028 (to complete before 2030-2035) - Current date: 2024-2025 Implication: Organizations should begin PQC migration now. Waiting until Q-Day appears"}], "claims": ["Organizations should begin post-quantum cryptography migration now.", "The ideal time for post-quantum cryptography migration is between 2025-2028.", "Q-Day is estimated to occur around 2030 ± 5 years.", "Waiting for Q-Day creates unnecessary risk.", "Waiting for Q-Day creates unnecessary cost.", "Waiting for Q-Day creates unnecessary disruption.", "If Q-Day occurs before migration is complete, exposed data becomes immediately vulnerable."]}]}</script>
<script>
if (document.getElementById("data").textContent.includes("__" + "DATA" + "__")) {  // file mẫu, chưa nhúng dữ liệu
  document.body.innerHTML = "<p style='padding:24px;font-size:17px'>Đây là file mẫu, chưa có dữ liệu. Hãy mở " +
    "<b>testset/human_judge/phieu_cham.html</b> (tạo bằng <code>python human_judge.py --make</code>).</p>";
  throw new Error("template");
}
const DATA = JSON.parse(document.getElementById("data").textContent);
const STORE = "phieu_cham_" + DATA.sheet_id;
const items = [];  // mọi ô cần chấm: {code, kind, index}
for (const c of DATA.cases) {
  c.passages.forEach((_, i) => items.push({code: c.code, kind: "useful", index: i}));
  c.claims.forEach((_, j) => items.push({code: c.code, kind: "claim", index: j}));
  items.push({code: c.code, kind: "correct", index: 0});
}
const k = (code, kind, index) => `${code}|${kind}|${index}`;
let state = {labels: {}, notes: {}, current: 0};
try { const s = JSON.parse(localStorage.getItem(STORE)); if (s && s.labels) state = {...state, ...s}; } catch (e) {}
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} };

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [a, v] of Object.entries(attrs)) {
    if (a === "class") e.className = v; else if (a.startsWith("on")) e.addEventListener(a.slice(2), v); else e.setAttribute(a, v);
  }
  for (const x of kids) e.append(x);
  return e;
}
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 2200); }

// ---- Từ khớp: chỉ để hỗ trợ đọc nhanh; trùng từ không có nghĩa là hữu ích / được hỗ trợ, vẫn phải đọc để chấm ----
const STOP = new Set(("a an the and or but if then than that this these those there their they them it its is are was " +
  "were be been being has have had do does did of in on at to for from by with without as into onto over under about " +
  "between through during before after above below up down out off again further once here when where why how all any " +
  "both each few more most other some such no nor not only own same so too very can could will would should may might " +
  "must shall also which who whom whose what while using used use based via per e.g i.e etc one two three provide " +
  "provides provided allow allows enable enables include includes including well like new different various several " +
  "many much often within across against however therefore thus because since although whether either neither").split(" "));
const norm = w => w.toLowerCase().replace(/[’']s$/, "").replace(/(?<=[a-z]{3})(es|s)$/, "");
function terms(text) {  // từ khoá: >= 3 ký tự (hoặc có chữ số / viết hoa kiểu QKD), bỏ từ phổ biến, gộp số ít / số nhiều
  const seen = new Map();
  for (const w of text.match(/[A-Za-z0-9][A-Za-z0-9\-]*[A-Za-z0-9]|[A-Za-z0-9]/g) || []) {
    const n = norm(w);
    if (STOP.has(w.toLowerCase()) || STOP.has(n)) continue;
    if (n.length < 3 && !/\d/.test(w) && !/^[A-Z]{2,}$/.test(w)) continue;
    if (!seen.has(n)) seen.set(n, w);
  }
  return seen;  // dạng chuẩn hoá -> dạng hiển thị
}
function highlight(text, wanted) {  // tô sáng các từ (dạng chuẩn hoá) trong văn bản, trả về các node DOM
  const out = [];
  let last = 0;
  for (const m of text.matchAll(/[A-Za-z0-9][A-Za-z0-9\-]*[A-Za-z0-9]|[A-Za-z0-9]/g)) {
    if (!wanted.has(norm(m[0]))) continue;
    out.push(text.slice(last, m.index), el("mark", {}, m[0]));
    last = m.index + m[0].length;
  }
  out.push(text.slice(last));
  return out;
}
function chips(label, entries) {  // entries: [{text, hit, where}]
  return el("div", {class: "terms"}, el("b", {}, label),
    ...entries.map(e => el("span", {class: "chip " + (e.hit ? "hit" : "miss"), title: e.hit ? "có" : "không thấy"},
      e.text, ...(e.where ? [el("small", {}, e.where)] : []))));
}

function chipsVsReference(c) {  // từ khoá của ground truth: có / thiếu trong câu trả lời
  const at = terms(c.answer);
  const entries = [...terms(c.reference)].map(([n, w]) => ({text: w, hit: at.has(n)})).sort((a, b) => b.hit - a.hit);
  return chips(`Từ của ground truth có trong câu trả lời (${entries.filter(e => e.hit).length}/${entries.length}; ` +
               "thiếu thì gạch ngang):", entries);
}

function caseStatus(code) {
  const its = items.filter(i => i.code === code);
  const done = its.filter(i => state.labels[k(i.code, i.kind, i.index)] !== undefined).length;
  return done === its.length ? "done" : done ? "partial" : "";
}
function progress() {
  const done = items.filter(i => state.labels[k(i.code, i.kind, i.index)] !== undefined).length;
  document.getElementById("bar").style.width = (100 * done / items.length) + "%";
  document.getElementById("ptext").textContent =
    `${done}/${items.length} ô · ${DATA.cases.filter(c => caseStatus(c.code) === "done").length}/${DATA.cases.length} câu trả lời xong`;
  return done;
}
function renderNav() {
  const ol = document.getElementById("nav"); ol.replaceChildren();
  DATA.cases.forEach((c, i) => ol.append(el("li", {}, el("button", {
    class: [caseStatus(c.code), i === state.current ? "current" : ""].join(" "),
    "aria-current": i === state.current ? "true" : "false", onclick: () => go(i)}, c.code))));
}

function labelRow(code, kind, index, question) {
  const key = k(code, kind, index), v = state.labels[key];
  const box = el("div", {class: "label" + (v !== undefined ? " set" : "")});
  const mk = (val, txt, cls) => el("button", {class: cls, "aria-pressed": String(v === val), onclick: () => {
    state.labels[key] = val; save(); refresh(false); }}, txt);
  const note = el("input", {type: "text", placeholder: "Ghi chú (không bắt buộc)", value: state.notes[key] || ""});
  note.addEventListener("change", () => { state.notes[key] = note.value; save(); });
  box.append(el("span", {class: "q"}, question), mk(1, "Có (1)", "y"), mk(0, "Không (0)", "n"), note);
  return box;
}

function renderCase() {
  const c = DATA.cases[state.current], root = document.getElementById("case");
  const scrollY = window.scrollY;
  root.replaceChildren(
    el("div", {class: "card"}, el("div", {class: "qhead"}, el("h2", {}, c.code),
      el("span", {class: "hint"}, `Câu trả lời ${state.current + 1}/${DATA.cases.length}`))),
    el("div", {class: "card"}, el("h2", {}, "Câu hỏi"), el("p", {}, c.question)),
    el("div", {class: "card"}, el("h2", {}, "Ground truth"), el("p", {}, c.reference)),
    el("div", {class: "card"}, el("h2", {}, "Câu trả lời cần chấm"), el("p", {}, ...highlight(c.answer, terms(c.reference))),
      chipsVsReference(c)));
  const ref = terms(c.reference);
  const ctx = [...(c.kg ? [["KG", c.kg]] : []), ...c.passages.map((p, i) => [`Đ${i + 1}`, p.text])];
  const ctxTerms = ctx.map(([name, t]) => [name, terms(t)]);
  if (c.kg) root.append(el("div", {class: "card kg"}, el("h2", {}, "Mô tả KG (là một phần của context)"),
    el("p", {}, ...highlight(c.kg, ref))));
  c.passages.forEach((p, i) => {
    const pt = terms(p.text);
    const entries = [...ref].map(([n, w]) => ({text: w, hit: pt.has(n)}));
    root.append(el("div", {class: "card passage"},
      el("h2", {}, `Đoạn ${i + 1}`), el("div", {class: "src"}, `${p.source} · trang ${p.page}`),
      el("p", {}, ...highlight(p.text, ref)),
      chips(`Từ của ground truth có trong đoạn (${entries.filter(e => e.hit).length}/${entries.length}):`,
            entries.sort((a, b) => b.hit - a.hit)),
      labelRow(c.code, "useful", i, `Đoạn ${i + 1} có giúp suy ra ground truth không?`)));
  });
  const claims = el("div", {class: "card"}, el("h2", {},
    c.claims.length ? "Các claim của câu trả lời: có được context hỗ trợ không?" : "Các claim của câu trả lời"));
  if (!c.claims.length) claims.append(el("p", {class: "hint"}, "Câu trả lời refuse: không có ý nào cần chấm."));
  c.claims.forEach((cl, j) => {
    const entries = [...terms(cl)].map(([n, w]) => {
      const where = ctxTerms.filter(([, t]) => t.has(n)).map(([name]) => name);
      return {text: w, hit: where.length > 0, where: where.join(" ")};
    });
    const miss = entries.filter(e => !e.hit).length;
    claims.append(el("div", {class: "claim"}, el("p", {}, `Ý ${j + 1}. ${cl}`),
      chips(miss ? `Từ của ý trong context (${miss} từ không thấy, gạch ngang):` : "Từ của ý trong context (đều có):",
            entries.sort((a, b) => a.hit - b.hit)),
      labelRow(c.code, "claim", j, `Ý ${j + 1} được context (mô tả KG nếu có + 4 đoạn) hỗ trợ?`)));
  });
  root.append(claims, el("div", {class: "card"}, el("h2", {}, "Đánh giá chung: câu trả lời có đúng so với ground truth?"),
    el("div", {class: "compare"},
      el("div", {}, el("div", {class: "src"}, "Ground truth"), el("p", {}, c.reference)),
      el("div", {}, el("div", {class: "src"}, "Câu trả lời"), el("p", {}, ...highlight(c.answer, terms(c.reference))))),
    chipsVsReference(c),
    el("p", {class: "hint"}, "Có nếu câu trả lời nêu được các ý chính của ground truth và không mâu thuẫn với nó (thêm "
      + "thông tin khác vẫn được); thiếu ý chính hoặc nói ngược lại = Không. Không cần đọc bài báo, chỉ so hai khung trên."),
    labelRow(c.code, "correct", 0, "Câu trả lời đúng so với ground truth? (refuse = 0)")));
  window.scrollTo(0, scrollY);
}
function refresh(full = true) { renderNav(); progress(); if (full) renderCase(); else renderCase(); }
function go(i) { state.current = Math.max(0, Math.min(DATA.cases.length - 1, i)); save(); renderNav(); renderCase(); window.scrollTo(0, 0); }

const hlBtn = document.getElementById("hl");
function setHl(on) {
  state.hl = on; save();
  document.body.classList.toggle("nohl", !on);
  hlBtn.setAttribute("aria-pressed", String(on));
  hlBtn.textContent = "Tô sáng từ khớp: " + (on ? "bật" : "tắt");
}
hlBtn.onclick = () => setHl(!state.hl);
setHl(state.hl !== false);
document.getElementById("prev").onclick = () => go(state.current - 1);
document.getElementById("next").onclick = () => go(state.current + 1);
document.getElementById("next-todo").onclick = () => {
  const n = DATA.cases.length;
  for (let s = 1; s <= n; s++) { const i = (state.current + s) % n; if (caseStatus(DATA.cases[i].code) !== "done") return go(i); }
  if (caseStatus(DATA.cases[state.current].code) !== "done") return go(state.current);
  toast("Đã chấm xong toàn bộ, hãy bấm Xuất JSON.");
};
document.getElementById("export").onclick = () => {
  const labels = items.map(i => ({...i, label: state.labels[k(i.code, i.kind, i.index)] ?? null,
                                  note: state.notes[k(i.code, i.kind, i.index)] || ""}));
  const done = labels.filter(l => l.label !== null).length;
  if (done < labels.length && !confirm(`Còn ${labels.length - done} ô chưa chấm. Vẫn xuất (để lưu tạm)?`)) return;
  const out = {sheet_id: DATA.sheet_id, exported_at: new Date().toISOString(), n_total: labels.length, n_done: done, labels};
  const a = el("a", {href: URL.createObjectURL(new Blob([JSON.stringify(out, null, 1)], {type: "application/json"})),
                     download: "human_labels.json"});
  document.body.append(a); a.click(); a.remove();
  toast(`Đã xuất ${done}/${labels.length} ô vào human_labels.json`);
};
document.getElementById("import").onchange = async (ev) => {
  const f = ev.target.files[0]; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (d.sheet_id !== DATA.sheet_id) { toast("File JSON không khớp phiếu này (sheet_id khác)."); return; }
    for (const l of d.labels) { const key = k(l.code, l.kind, l.index);
      if (l.label === 0 || l.label === 1) state.labels[key] = l.label; if (l.note) state.notes[key] = l.note; }
    save(); refresh(); toast(`Đã nhập ${d.labels.filter(l => l.label !== null).length} ô.`);
  } catch (e) { toast("Không đọc được file JSON."); }
  ev.target.value = "";
};
document.getElementById("guide-list").append(...DATA.guide.flatMap(([t, d]) => [el("dt", {}, t), el("dd", {}, d)]));
if (!Object.keys(state.labels).length) document.getElementById("guide").open = true;
refresh();
</script>
</body>
</html>
