time, so by repeating this experiment only O(log log r) times, we are assured of a high probability of success. In practice, assuming that quantum computation is more expensive than classical computation, it would be worthwhile to alter the above algorithm so as to perform less quantum computation and more postprocessing. First, if the observed state is |c⟩, it"}], "claims": ["Each good (c, d) pair occurs with a probability of at least 1/3r².", "Only one-twelfth of all possible c values generate a good pair."]}, {"code": "H20", "question": "What is Shor's algorithm and how does it impact the security of current cryptographic systems?", "reference": "Shor's algorithm, proposed by Peter Shor in 1994, efficiently factors large integers and computes discrete logarithms in polynomial time, which directly undermines the security assumptions of current public-key cryptographic systems.", "answer": "Shor's algorithm is a quantum algorithm that can efficiently factor large numbers, a task that is computationally infeasible for classical computers. This capability threatens the security of widely used public-key encryption schemes like RSA, which rely on the difficulty of factoring large integers. By reducing the computational complexity to polynomial time, Shor's algorithm can break these systems, making current cryptographic methods vulnerable to quantum attacks.", "kg": null, "passages": [{"source": "Next-Generation Quantum Security - The Impact of Quantum Computing on Cybersecurity—Threats, Mitigations, and Solutions", "page": 2, "text": "S. Ali et al. emerging technology introduces fundamentally new ways of processing information, enabling certain algorithms to outperform  their classical counterparts by orders of magnitude. Among the most prominent examples are Shor’s algorithm for factoring large  integers and computing discrete logarithms [5], and Grover’s algorithm for unstructured search [6], both of which have direct  implications for the foundational structures of modern cryptography. The exponential speedup offered by Shor’s algorithm threatens  to render widely used public-key encryption schemes—such as RSA and elliptic curve cryptography (ECC) obsolete [7], while  Grover’s quadratic speedup reduces the effective security of symmetric-key algorithms, including AES [8,9]. These vulnerabilities  could compromise the confidentiality, integrity, and authenticity of sensitive data across financial, governmental, military, and  civilian digital infrastructures."}, {"source": "Next-Generation Quantum Security - The Impact of Quantum Computing on Cybersecurity—Threats, Mitigations, and Solutions", "page": 9, "text": "frequently encountered during cryptographic key searches [83]. Grover’s algorithm weakens symmetric encryption by reducing  the number of operations required, though it impacts public-key cryptography less than Shor’s algorithm [84]. Shor’s algorithm  and Grover’s algorithm represent the two biggest discoveries in quantum computation, having a significant impact on the field of  cryptography [85]. Grover’s algorithm achieves quadratic speedup for unstructured search problems and can potentially break some symmetric  keys like AES [86], while Shor’s algorithm can efficiently factor large numbers and break public-key encryption schemes like  RSA [87]. These quantum algorithms demonstrate the power of quantum computers, making quantum-resistant cryptographic  Computers and Electrical Engineering 128 (2025) 110649  9"}, {"source": "Next-Generation Quantum Security - The Impact of Quantum Computing on Cybersecurity—Threats, Mitigations, and Solutions", "page": 7, "text": "Shor algorithm and RSA: RSA encryption bases its functionality on the ability to factor large numbers into their prime factors,  as described in [49]. RSA maintains its security value because factoring large composite numbers remains out of reach for classical  computers, as noted in [50]. RSA encryption faces a breakthrough due to the Shor algorithm, created in 1994, that performs  large factoring in polynomial time, as explained in [51]. The Shor algorithm uses factoring time to solve integers, whereas the  classical factoring problem increases exponentially with the number of digits, leading to a computational running time of 𝑂(log3 𝑛),  where 𝑛 represents the factored number. The Shor algorithm solves the periodicity problem associated with factoring, which  mathematically uses the quantum Fourier transform with an exponential speed-up over classical algorithms that cannot achieve"}, {"source": "A Survey of Quantum Machine Learning - Foundations,Algorithms, Frameworks, Data and Applications", "page": 12, "text": "𝜃((𝑙𝑜𝑔𝑁)2(𝑙𝑜𝑔(𝑙𝑜𝑔𝑁))(𝑙𝑜𝑔(𝑙𝑜𝑔(𝑙𝑜𝑔𝑁)))) with fast multiplication, or even 𝜃((𝑙𝑜𝑔𝑁)2(𝑙𝑜𝑔(𝑙𝑜𝑔𝑁)) using the fastest known multiplication algorithm. This is significantly faster than the general number field sieve, the most efficient classical algorithm. Cryptographic security is one of the primary applications of Shor’s algorithm. The algorithm can potentially break systems like RSA, which rely on the difficulty of factoring large numbers. This vulnerability has driven significant research and development in post-quantum cryptography, aiming at creating cryptographic systems that remain secure against quantum attacks. Additionally, the principles behind Shor’s algorithm can be applied to other optimization problems that benefit from the speedup provided by quantum computing. The ability to solve such problems more efficiently could have wide-ranging impacts across various fields that require complex computations and optimizations."}], "claims": ["Shor's algorithm is a quantum algorithm.", "Shor's algorithm can efficiently factor large numbers.", "Factoring large numbers is computationally infeasible for classical computers.", "Public-key encryption schemes like RSA rely on the difficulty of factoring large integers.", "Shor's algorithm can break public-key encryption schemes like RSA.", "Current cryptographic methods are vulnerable to quantum attacks."]}, {"code": "H21", "question": "How has hybrid post-quantum key agreement been deployed in Chrome, and how do hybrid PQC deployments keep backward compatibility with parties that do not support it?", "reference": "From late 2022 into 2023 Google deployed a hybrid X25519+Kyber key agreement in Chrome (with BoringSSL), and by late 2024 it was enabled for all desktop use, likely the largest PQC deployment so far, done without user disruption. In hybrid deployments, modern clients and servers support both classical and PQC algorithms and negotiate mutually supported ones, preferring hybrid; with graceful degradation they fall back to classical algorithms if hybrid is unavailable, may offer pure PQC, and eventually phase out classical-only systems.", "answer": "Hybrid post-quantum key agreement has been deployed in Chrome through the use of a hybrid X25519+Kyber key agreement, starting with Google's BoringSSL. This deployment ensures backward compatibility by using both classical and post-quantum algorithms in parallel, providing security even if both are broken. Hybrid approaches like this help maintain compatibility with parties that may not yet support PQC, offering a transitional solution.", "kg": "Knowledge graph entities:\n- post quantum cryptography (STANDARD): PQC is the new era of cryptography due to quantum computing.; Solution to mitigate risks posed by quantum computing.\n- PQC (ALGORITHM): Deep PQCs, or those forming 2-designs.; Post-quantum cryptographic algorithms implemented through hybrid systems.; Post-Quantum Cryptography.; Algorithms submitted in various categories for the NIST competition.; PQC sta\n- Post-Quantum Cryptography (CONCEPT): Cryptography that remains secure against quantum attacks.; Standard that targets encryption and key management.; Protects data at rest and in transit from quantum-capable adversaries.; Defense mechanism to be combined wi\n- Chrome (SYSTEM): Google's browser used in real-world experiments.; Google’s browser where BoringSSL was tested and deployed.; Uses X25519+Kyber for post-quantum cryptography.; Supports X25519Kyber768 starting in Chrome 116.\n- post-quantum cryptosystems (ALGORITHM): Innovative solution for resisting quantum attacks.; Cryptosystems designed to resist quantum computing attacks.; New generation of cryptosystems examined in the study.; This article discusses the challenges and potential\n- Parameterized Quantum Circuit (SYSTEM): U(θ) is a parameterized quantum circuit.; Integrated into the generator architecture of HQ-MolGAN.; Integrated into generator and discriminator networks.; Circuit with adjustable parameters that encodes input data into q\n- Meta (ORGANIZATION): Meta has started using hybrid post-quantum TLS.; Work helps OpenSSL and others know that PQC is viable.\n- hybrid certificate profiles (CONCEPT): Supports dual-key certificates for PQC migration.\n\nKnowledge graph relations:\n- PQC -- Chrome: PQC deployed in Chrome for post-quantum cryptography.\n- Hybrid Support in Modern Clients/Servers -- AWS Key Management Service Post-Quantum Cryptography: Supports PQC.\n- Post-Quantum Cryptography -- hybrid systems: Hybrid systems bridge the transition while PQC secures the future.\n- Post-Quantum Cryptography -- Certificate Authority: Certificate Authorities issue hybrid certificates containing PQC public keys.\n- PQC -- post-quantum blockchain security: PQC is part of the hybrid PKI approach.\n- hybrid cryptography -- Post-Quantum Cryptography: Hybrid Cryptography bridges classical and quantum-safe algorithms to counter PQC threats.; Hybrid Cryptography complements PQC.; Combining PQC algorithms and hybrid cryptography.; Hybrid cryptography is part of a roadmap\n- Post-Quantum Cryptography -- Google: Google is expected to play a leading role in early PQC adoption.\n- Post-Quantum Cryptography -- WebPKI: WebPKI needs consensus on handling PQC certificates.\n- hybrid schemes -- PQC: Hybrid schemes combine pre and post quantum cryptography algorithms.; Hybrid approaches ensure high compatibility with PQC.\n- Post-Quantum Cryptography -- hybrid deployments: Synthesize open research directions in hybrid deployments.\n- Post-Quantum Cryptography -- classical cryptography: PQC can be deployed via software updates unlike QKD.\n- collaboration mechanisms -- Post-Quantum Cryptography: Future work can ensure that PQC research translates into secure, deployable, and equitable infrastructures worldwide.", "passages": [{"source": "A Survey of Post-Quantum Cryptography Support in Cryptographic Libraries", "page": 9, "text": "already claim to be CNSA 2.0 ready for government use [45]. The upcoming support for OpenSSL is also largely driven by government and industry compliance needs [19]. Web and Internet Security (Browsers and Cloud) Perhaps the most visible real-world deployment of PQC to date is in web browsers and cloud services. In late 2022 and into 2023, Google began deploying a hybrid X25519+Kyber key agreement in Chrome (with BoringSSL). By late 2024, Chrome had this enabled for all desktop use, making it likely the largest post-quantum cryptography deployment ever [29]. This achievement, executed seamlessly without user disruption, highlights careful engineering and demonstrates the feasibility of PQC at a large scale. Likewise, Cloudflare, which handles a significant fraction of Internet traffic, announced that it “now uses post-quantum cryptography to talk to your origin server” [49]."}, {"source": "Are Enterprises Ready for Quantum-Safe Cybersecurity", "page": 5, "text": "gorithms, implying that technologists face an engineering challenge to achieve parity with the ubiquity of RSA/ECC [35]. Another technical challenge is ensuring interoperability and trust in the new algorithms. Standards bodies like the IETF are working on standards for PQC in protocols (e.g., RFCs for PQC in TLS, IPsec, and SSH). Likewise, the WebPKI ecosystem (browsers and Certificate Authorities) needs consensus on how to issue and handle quantum-safe certificates. As of 2025, some Certificate Authorities have begun issuing hybrid certificates (containing both classical and PQC public keys) as an intermediate step [36, 37]. These measures are indicative of a transition phase where hybrid cryptography is employed: using both a classical and a postquantum algorithm in parallel so that security holds unless both are broken. Hybrid modes are intended to provide confidence and backwards compatibility, though they add complexity and"}, {"source": "Post-Quantum Cryptography and Quantum-Safe Security", "page": 10, "text": "attacks exploit subtle mathematical relationships in the polynomial structure that were not apparent during initial security analysis, demonstrating how the complex algebraic structure that enables efficient multivariate operations can also create vulnerabilities that become apparent only through sophisticated cryptanalytic techniques. 3.5 Isogeny-Based Cryptography The isogeny-based approach to PQC suffered a catastrophic and unexpected setback with the July 2022 cryptanalytic breakthrough against SIDH/SIKE, which demonstrated how seemingly secure mathematical constructions can harbor subtle vulnerabilities that become apparent only through sophisticated attacks utilizing advanced mathematical techniques [25]. The attack exploits auxiliary point information included in the protocol specification, enabling classical key recovery in approximately one hour on standard hardware through mathematical techniques that do not require quantum computation."}, {"source": "A Survey of Post-Quantum Cryptography Support in Cryptographic Libraries", "page": 4, "text": "the finalists, well-optimized implementations can be efficient. Of course, network latency can dominate handshake cost; the study concluded that PQC is suitable for adoption in today’s systems from a performance perspective [28]. Another study by Google in real world settings (Chrome experiments) found that hybrid X25519+Kyber key exchanges added minimal overhead, confirming that users do not notice a difference in page load times [29]. These findings are encouraging: they suggest that libraries that enable PQC will not face insurmountable performance issues, although they must deal with larger message sizes (e.g., ∼1KB key shares instead of 32 bytes). As an example of size impact, one source notes Kyber768’s public key is ∼1088 bytes vs 32 bytes for X25519, and requires more CPU cycles (millions vs tens of thousands for X25519) [4]. But modern networks and hardware can handle this overhead, and techniques such as hybrid key exchange mitigate any single-point weakness."}], "claims": ["Hybrid post-quantum key agreement has been deployed in Chrome.", "The deployment in Chrome uses a hybrid X25519+Kyber key agreement.", "The hybrid key agreement was first implemented in Google's BoringSSL.", "The deployment ensures backward compatibility with parties that do not support it.", "Backward compatibility is achieved by using both classical and post-quantum algorithms in parallel.", "Using both classical and post-quantum algorithms in parallel provides security even if both are broken.", "Hybrid approaches like this help maintain compatibility with parties that may not yet support PQC.", "Hybrid approaches offer a transitional solution for parties that do not support PQC."]}, {"code": "H22", "question": "What accuracy does the scalable quantum convolutional neural network (QCNN) achieve on MNIST, and with how many trainable parameters?", "reference": "The scalable QCNN achieves 98.7% accuracy (98.1% on validation) using only 45 independent rotational parameters, while the baseline QCNN is trapped at 52%.", "answer": "The scalable QCNN achieves 98.7% accuracy on the MNIST dataset using only 45 independent rotational parameters (θ).", "kg": null, "passages": [{"source": "Beyond Barren Plateaus - A Scalable Quantum Convolutional Architecture for High-Fidelity Image Classification", "page": 12, "text": "required over 120, 000 trainable parameters. Our scalable QCNN achieves 98.7% accuracy utilizing only 45 independent rotational parameters (θ). This translates to an extraordinary parameter-efficiency advantage, explicitly demonstrating that the quantum circuit is learning deep, highly entangled representations of the image data rather than memorizing spatial mappings. Table 4 summarizes these pivotal metrics. 0 50 100 150 0.4 0.6 0.8 1 Epochs Accuracy (a) Training and Validation Accuracy Training Acc Validation Acc Baseline QCNN Acc 0 50 100 150 0 0.1 0.2 0.3 Epochs Mean Squared Error (MSE) (b) Training and Validation Loss Training Loss Validation Loss Figure 6: Convergence dynamics of the proposed QCNN on the MNIST dataset. (a) The classification accuracy climbs aggressively, plateauing at an empirical maximum of 98.7% on the training set and 98.1% on the validation set. The baseline QCNN is trapped at 52%. (b) The corresponding MSE loss function demonstrates smooth,"}, {"source": "Beyond Barren Plateaus - A Scalable Quantum Convolutional Architecture for High-Fidelity Image Classification", "page": 12, "text": "The training trajectory is remarkable. Unlike the unmitigated QCNN, which plateaued near 52.32% accuracy, our scalable architecture rapidly converged to a high-fidelity state. Figure 6 illustrates the training and validation metrics over 150 epochs. The empirical terminal accuracy achieved on the test dataset is 98.7%. This metric represents a paradigm shift from prior quantum machine learning literature, which often struggles to break the 90% barrier on standardized datasets without utilizing excessive classical preprocessing or feature mapping. Furthermore, it is imperative to contextualize this accuracy against the parameter count of the model. To achieve comparable fidelity (99.9%), the classical Convolutional Neural Network (CNN) referenced in our preliminary study required over 120, 000 trainable parameters. Our scalable QCNN achieves 98.7% accuracy utilizing only 45 independent rotational parameters (θ)."}, {"source": "Beyond Barren Plateaus - A Scalable Quantum Convolutional Architecture for High-Fidelity Image Classification", "page": 1, "text": "optimized QCNN achieves a classification accuracy of 98.7%, a substantial improvement over the baseline QCNN accuracy of 52.32% found in unmitigated models. Furthermore, we provide empirical evidence of a parameter-efficiency advantage, requiring O(log N) fewer trainable parameters than equivalent classical CNNs to achieve > 95% convergence. This work bridges the gap between theoretical quantum utility and practical application, providing a scalable framework for quantum computer vision tasks without succumbing to loss landscape concentration. Keywords: Quantum Convolutional Neural Networks, Barren Plateaus, Quantum Machine Learning, Tensor Networks, Variational Quantum Algorithms, Image Classification Radhakrishnan Delhibabu: rdelhibabu@vit.ac.in 1 Introduction The intersection of quantum computing and artificial intelligence has birthed Quantum Machine Learning (QML), a discipline that promises to"}, {"source": "Beyond Barren Plateaus - A Scalable Quantum Convolutional Architecture for High-Fidelity Image Classification", "page": 14, "text": "learning frameworks, while requiring exponentially fewer trainable parameters. This parameter efficiency (O(log n) scaling) points toward a tangible quantum advantage in the domain of training latency and memory overhead, particularly as dataset dimensionality scales beyond the reach of classical GPUs. Future physical deployment of this specific localcost QCNN architecture on trapped-ion or superconducting NISQ topologies will serve as the ultimate validation of this scalable framework. 5 Conclusion and Physical NISQ Deployment Considerations The fundamental proposition of this research was to demonstrate that Quantum Convolutional Neural Networks (QCNNs) can transition from mathematical curiosities to scalable, high-fidelity classifiers. By systematically dismantling the root causes of the barren plateau phenomenon, our architecture resolves the primary scalability bottleneck that has historically crippled variational quantum algorithms. The integration of"}], "claims": ["The scalable QCNN achieves 98.7% accuracy on the MNIST dataset.", "The scalable QCNN uses only 45 independent rotational parameters (θ)."]}, {"code": "H23", "question": "In variational quantum circuits, what name is given in quantum simulation to the approach that uses parametrized random circuits of varying depth?", "reference": "It is called a \"hardware efficient ansatz\": instead of a parameterization inspired by physical domain knowledge, the circuit is a parametrized random circuit of varying depth.", "answer": "I cannot find the answer in the provided documents.", "kg": "Knowledge graph entities:\n- Variational Quantum Circuits (SYSTEM): Parameterized quantum circuits that can be optimized through classical optimization techniques.; Quantum components replacing classical components in GANs.; Generator implemented via variational quantum circuits with ang\n- parametrized random circuits (SYSTEM): Utilized in implementations of varying depth.\n- simulation (ALGORITHM): Tool provided by Qiskit for simulating quantum circuits.\n- quantum simulation (ALGORITHM): Algorithm that uses the technique of extracting eigenvalues of unitary operators.; Q# offers strong support for this.; Could improve cryptanalysis and aid in evaluating cryptographic systems.; Classical simulation algori\n- circuit (SYSTEM): Quantum circuits with high fidelity are developed using quantum hardware.; The circuit is run multiple times to generate outputs.; Quantum circuit that processes information.; Quantum circuit used in computations.; Some \n- quantum circuit (SYSTEM): A sequence of quantum logic gates on qubits.; Circuit used for the generator or discriminator in hybrid quantum-classical GANs.; A system where both generator and discriminator are implemented.; A component of the Quantu\n- variational quantum simulation (ALGORITHM): Algorithm that uses derivatives of the parametrized quantum state.\n- Quantum Variational Circuits (SYSTEM): Circuits used in VQE for optimizing a cost function.; Quantum algorithm for optimization problems.\n\nKnowledge graph relations:\n- Variational Quantum Circuits -- quantum algorithm: Variational quantum circuits are a type of quantum algorithm.\n- Variational Quantum Algorithms -- parametrized quantum circuit: VQAs use a parametrized quantum circuit to be trained by a classical optimizer.; VQAs use parametrized quantum circuits.; One learns a parametrized quantum circuit using a VQA.; Parametrized quantum circuits support VQAs\n- Variational Quantum Circuits -- Variational Quantum Algorithms: Variational Quantum Circuits are used for state preparation in VQAs.\n- Variational Quantum Classification Algorithm -- Parameterized Quantum Circuit: VQCA begins with a parameterized quantum circuit.\n- Variational Quantum Algorithms -- circuit: One uses a VQA to discover the circuit.\n- quantum circuit -- Variational Quantum Circuits: Variational quantum circuits are a type of quantum circuit.\n- quantum circuit -- Variational Quantum Algorithms: Quantum circuits used to estimate C(θ) in VQA.\n- Variational Quantum Circuits -- parameterized quantum gates: VQC includes a sequence of parameterized quantum gates.\n- Variational Quantum Circuits -- Quantum Approximate Optimization Algorithm: VQCs are the most common architecture for QGANs due to their flexibility and trainability.\n- Variational Quantum Eigensolver -- Quantum Variational Circuits: VQE uses quantum circuits for optimization.\n- QSVM -- Variational Quantum Circuits: Both are algorithms resulting from applying unsupervised learning to the quantum domain.\n- Variational Quantum Circuits -- qubit: Variational quantum circuits integrate qubits.", "passages": [{"source": "A Survey of Quantum Machine Learning - Foundations,Algorithms, Frameworks, Data and Applications", "page": 5, "text": "reviewed, including application area, highlights, and limitations. 3 Foundations of Quantum Computing This section provides the essential foundations of quantum computing relevant to QML. Section 3.1 introduces core concepts such as qubits, quantum gates, and fundamental quantum operations. Section 3.2 extends this by describing quantum circuits and variational quantum circuits, which integrate classical and quantum resources for optimization and learning tasks. Section 3.3 discusses key phenomena including quantum coherence and parallelism, while Section 3.4 addresses quantum noise and error mitigation strategies critical for reliable quantum computation. 3.1 Basic Quantum Information Units and Operations A qubit, or quantum bit, is the fundamental unit of quantum information in quantum computing. Unlike classical bits, which can only be in a state of either 0 or 1, qubits utilize quantum mechanics"}, {"source": "Variational quantum algorithms", "page": 13, "text": "k≥1 ak). One then uses a VQA to discover the circuit that implements |ψ⟩L with a given hardware structure. Since the eigenstate energies are know, the ﬁdelity, F, of the discovered state can be bounded by F ≥1 −(E −EG)/a with the discovered energy E and a = min{a0, ak}. Numerical studies showed the encoding circuits for the ﬁve- and seven-qubit codes with diﬀerent noisy hardware [153]. F. Machine learning and data science Quantum machine learning (QML) generally refers to the tasks of using a quantum computer to learn patterns in quantum data with the goal of making accurate predictions on unknown, and unseen data [154]. Although an in-depth overview of QML is beyond the scope of this Review, we present several QML applications for which the VQA framework can be readily implemented. Specifically, here one learns a parametrized quantum circuit to solve a given task [80, 155]. This connection between VQAs and (typical) QML applications shows that the"}, {"source": "A Survey of Quantum Machine Learning - Foundations,Algorithms, Frameworks, Data and Applications", "page": 2, "text": "Given the above, our main contributions are as follows: (1) We provide an integration of quantum foundations and machine learning techniques. In particular, this survey thoroughly consolidates foundational quantum computing concepts, including quantum superposition, entanglement, coherence, parallelism, and variational quantum circuits, with advanced machine learning techniques. (2) A detailed examination and taxonomy of quantum algorithms in machine learning is provided, categorizing them into foundational quantum algorithms, QML algorithms, quantum deep learning, quantum reinforcement learning and quantum optimization algorithms. This analysis highlights their mechanisms, theoretical advantages and current limitations. (3) A systematic identification and categorization of the critical challenges faced in the practical implementation of QML are presented. Specifically, the survey addresses hardware constraints,"}, {"source": "Variational quantum algorithms", "page": 15, "text": "prepared by VQE, and hence diﬀerent VQAs can be used together in a complementary manner. 4. Quantum metrology Quantum metrology is a ﬁeld where one seeks the optimal setup for probing a parameter of interest (for example a magnetic ﬁeld) with minimal shot noise. In the absence of noise during the probing process, the analytical solution for the optimal probe state can be derived. However, when general physical noises are present, an analytical solution is hard to ﬁnd. Variational-state quantum metrology variationally searches for the optimal probe state [190–193]. For state preparation, variational quantum circuits are used in Refs. [190, 192, 193] whereas optical tweezer arrays are considered in Ref. [191]. More concretely, one prepares a probe state with variational parameters, probes the magnetic ﬁeld with physical noises, measures quantum Fisher information (QFI) as a cost function, and updates the parameters to maximize it. Note that since QFI cannot be eﬃciently computed, an"}], "claims": []}, {"code": "H24", "question": "What role does Quantum Random Number Generation (QRNG) play in quantum key distribution (QKD), and how far has QKD technology progressed toward real-world deployment?", "reference": "QKD relies on physics rather than computational hardness to exchange keys provably securely and to detect eavesdroppers; QRNG supports it by producing true random numbers needed for key setting and growth. Over the past five years QKD has moved from laboratory experiments to early commercial deployments, for example financial institutions in Europe and Asia piloting QKD links; combined with one-time-pad or symmetric ciphers it can provide information-theoretic security.", "answer": "Quantum Random Number Generation (QRNG) plays a crucial role in QKD by providing truly unpredictable keys, enhancing the security of cryptographic systems. QKD technology has progressed significantly, moving from theoretical concepts to practical implementations, though challenges remain, particularly in extending distances and making the technology more widely deployable.", "kg": null, "passages": [{"source": "Are Enterprises Ready for Quantum-Safe Cybersecurity", "page": 7, "text": "Notably, research continues to push QKD forward: efforts are underway to integrate QKD with telecom networks (e.g., using wavelength-division multiplexing to send quantum and classical signals in the same fiber) [5], to improve distances via quantum repeaters (not yet practical, but quantum memory and entanglement swapping might extend range without trusted nodes in the future), and to develop standardized QKD protocols and certification criteria. Also, Quantum Random Number Generators (QRNGs) – a related technology – are already being used to bolster cryptographic systems by providing truly unpredictable keys, an example of quantum technology immediately useful within classical cryptography frameworks. In summary, the technologist perspective finds that quantum-safe solutions are emerging from concept to reality. Post-quantum cryptography is at the forefront, with multiple algorithms 7"}, {"source": "Post-Quantum Cryptography and Quantum-Safe Security", "page": 22, "text": "22 Chhetri et al. 8.3 Quantum Random Number Generators (QRNGs) High-quality randomness is essential for secure cryptographic primitives. Quantum Random Number Generators (QRNGs) exploit the inherent unpredictability of quantum processes, such as photon emission or phase fluctuations, to produce entropy that is provably resistant to prediction and replication [49, 75]. Unlike classical pseudo-random generators, QRNGs provide true randomness rooted in physical laws, ensuring robustness against adversaries with full knowledge of initial system states [49, 75]. Recent advances include semi-device-independent QRNGs (semi-DI QRNGs), which reduce reliance on device trust assumptions while maintaining verifiable security guarantees [56, 97]. Similarly, source-independent QRNGs validate entropy independently of the quantum state source, thereby enhancing robustness against hardware imperfections [56, 98]. Together, these"}, {"source": "Quantum Key Distribution Networks -- Key Management - A Survey", "page": 1, "text": "Faculty of Electrical Engineering University of Sarajevo Sarajevo, Bosnia and Herzegovina miralem.mehic@ieee.org August 9, 2024 ABSTRACT Secure communication makes the widespread use of telecommunication networks and services possible. With the constant progress of computing and mathematics, new cryptographic methods are being diligently developed. Quantum Key Distribution (QKD) is a promising technology that provides an Information-Theoretically Secure (ITS) solution to the secret-key agreement problem between two remote parties. QKD networks based on trusted repeaters are built to provide service to a larger number of parties at arbitrary distances. They function as an add-on technology to traditional networks, generating, managing, distributing, and supplying ITS cryptographic keys. Since key resources are limited, integrating QKD network services into critical infrastructures necessitates"}, {"source": "QUANTUM KEY DISTRIBUTION - Bridging Theoretical Security Proofs, Practical Attacks, and Error Correction", "page": 1, "text": "QUANTUM KEY DISTRIBUTION: BRIDGING THEORETICAL SECURITY PROOFS, PRACTICAL ATTACKS, AND ERROR CORRECTION FOR QUANTUM-AUGMENTED NETWORKS Nitin Jha Department of Computer Science Kennesaw State University Marietta, GA, 30066 njha1@students.kennesaw.edu Abhishek Parakh Department of Computer Science Kennesaw State University Marietta, GA, 30066 aparakh@kennesaw.edu Mahadevan Subramaniam Department of Computer Science University of Nebraska Omaha Omaha, NE 68182 msubramaniam@unomaha.edu November 26, 2025 ABSTRACT Quantum Key Distribution (QKD) is revolutionizing cryptography by promising information-theoretic security through the immutable laws of quantum mechanics. Yet, the challenge of transforming these idealized security models into practical, resilient systems remains a pressing issue, especially as quantum computing evolves. In this review, we critically dissect and synthesize the latest advancements"}], "claims": ["Quantum Random Number Generation (QRNG) plays a crucial role in QKD.", "QRNG provides truly unpredictable keys.", "QRNG enhances the security of cryptographic systems.", "QKD technology has progressed significantly.", "QKD technology has moved from theoretical concepts to practical implementations.", "Challenges remain in extending distances.", "Challenges remain in making QKD technology more widely deployable."]}, {"code": "H25", "question": "What is Shor's algorithm and how does it impact the security of current cryptographic systems?", "reference": "Shor's algorithm, proposed by Peter Shor in 1994, efficiently factors large integers and computes discrete logarithms in polynomial time, which directly undermines the security assumptions of current public-key cryptographic systems.", "answer": "Shor's algorithm is a quantum algorithm that can efficiently factor large integers and solve the discrete logarithm problem, which are the foundations of many public-key cryptographic systems. This impacts the security of current cryptographic systems, particularly public-key cryptographic systems, by reducing the complexity of these problems from exponential to polynomial time, thus undermining the security assumptions on which these systems are based.", "kg": "Knowledge graph entities:\n- Current Cryptographic Systems (SYSTEM): Systems that could be maintained by quantum computing.; Protect data privacy and integrity through symmetric and asymmetric encryption and hashing.\n- Shor algorithm (ALGORITHM): Algorithm that performs large factoring in polynomial time.; Quantum algorithm that can compromise encryption systems.\n- cryptographic system (SYSTEM): System that includes QKD as part of its components.; Systems that organizations are upgrading or may need to rip-and-replace.; Systems facing quantum risk.; Systems designed to protect data through encryption.; System cu\n- Shor’s algorithm (ALGORITHM): Algorithm that can potentially break systems like RSA.; Algorithm used as a crucial test-bed for refining error correction techniques and improving qubit stability.; Algorithm for determining the periodicity of functions\n- security (CONCEPT): Application of quantum-enabled algorithms in security.; Protection against compromise, deletion, or modification.; Protection against unauthorized access or attacks, a key challenge in ADAS.; Key obstacles in blockchain \n- public-key cryptographic systems (SYSTEM): Systems based on security assumptions that are undermined by Shor's algorithm.\n- public key cryptography (CONCEPT): Public key cryptography tools do not fit appropriately in the IoT contex eration. To counter these threats, the  figure points to ‘‘Emerging Solutions’’, likely referring to ongoing advancements in post-quantum cryptographic algorithms (such  as lattice-based or code-based cryptography), hybrid systems, and quantum-safe protocols designed to withstand quantum attacks.  The structured layout effectively contrasts critical vulnerabilities with proactive mitigation strategies, emphasizing the need for a  transition to quantum-resistant technologies. In Table 1, we present a comprehensive overview of the impact of quantum computing on various aspects of cybersecurity,"}, {"source": "A Comparative Study of Classical and Post-Quantum Cryptographic Algorithms in the Era of Quantum Computing", "page": 3, "text": "logarithms in polynomial time, directly undermining the security assumptions on which most public-key cryptographic systems are based. Systems such as RSA, the Diffie–Hellman Key Exchange, Elliptic Curve Cryptography (ECC), and the Digital Signature Algorithm (DSA) are all rendered insecure by the capabilities of this quantum algorithm. What makes Shor’s algorithm particularly threatening is its ability to reduce the complexity of these problems from exponential to polynomial time, thereby enabling quantum adversaries to efficiently decrypt data or forge credentials that would otherwise be considered secure. For example, a 2048-bit RSA key—currently assumed to be robust against classical attacks—could be broken within seconds using a sufficiently large and stable quantum computer running Shor’s algorithm. This quantum advantage implies the potential for total cryptanalytic compromise of traditional public-key 3"}, {"source": "harvest-now-decrypt-later-pqc-threat-model", "page": 15, "text": "• Archive Infrastructure: Dedicated storage systems enable long-term retention of potentially valuable data. • Categorization: Content organized by type, source, and value. High-priority material (government communications, trade secrets) segregates from lower-value data. • Access Control: Restricted access to authorized analysts with accountability logging. • Replication: Geographic replication ensures resilience. • Security: Protection against compromise, deletion, or modification. Maintaining such archives costs significantly less than potential intelligence value. Nation-state agencies and sophisticated criminal organizations easily afford petabytes of stored ciphertext. Phase 3: Deferred Decryption Once quantum computers become available with sufficient capability, the stored encrypted data becomes decryptable: 1. Algorithm Selection: The adversary determines which quantum algorithm applies (Shor’s algorithm for asymmetric cryptography, Grover’s for symmetric)."}, {"source": "harvest-now-decrypt-later-pqc-threat-model", "page": 7, "text": "is not automatic. The quantum algorithm must exploit the structure of the problem such that: 1. Superposition allows encoding of the search space efficiently 2. Quantum operations (quantum gates) transform the probability amplitudes in ways that preserve the amplitude for the correct answer while suppressing amplitudes for incorrect answers 3. Measurement of the final quantum state yields the correct answer with high probability For most problems, quantum computers offer no advantage. For a specific category of problems— particularly those involving hidden periodicities, such as integer factorization and discrete logarithm problems underlying RSA and ECC—quantum algorithms provide exponential speedup. 3.3 Cryptographically Relevant Quantum Algorithms 3.3.1 Shor’s Algorithm and Public-Key Cryptography In 1994, Peter Shor published an algorithm for solving two problems that form the basis of essentially all modern public-key cryptography:"}], "claims": ["Shor's algorithm is a quantum algorithm.", "Shor's algorithm can efficiently factor large integers.", "Shor's algorithm can solve the discrete logarithm problem.", "The discrete logarithm problem is the foundation of many public-key cryptographic systems.", "Public-key cryptographic systems are based on the assumption that these problems are difficult to solve.", "Shor's algorithm reduces the complexity of these problems from exponential to polynomial time.", "Shor's algorithm undermines the security assumptions of public-key cryptographic systems.", "Shor's algorithm impacts the security of current cryptographic systems, particularly public-key cryptographic systems."]}, {"code": "H26", "question": "Why do Smart City and IoVT applications need 5G unlike traditional IoT applications, and what security consequences does the predicted growth of IoT devices have?", "reference": "Traditional IoT applications such as Smart Homes, industries and farming need only minimal wireless capabilities, whereas Smart Cities and IoVT require significantly higher throughput, which 5G provides. Together with concepts such as CPS, M2M and 5G, this growth leads to predictions of over 30 billion IoT devices by 2030; their number and variety create numerous security risks, and IoT devices are among the most common targets of adversaries, who can compromise data security and user privacy or disrupt networks.", "answer": "Smart City and IoVT applications require 5G due to their need for significantly higher throughput rates to deliver optimal user experiences, which 5G uniquely provides. The predicted growth of IoT devices poses security challenges, as attackers may exploit the large number of devices to steal sensitive information or cause financial losses, highlighting the need for robust security measures.", "kg": null, "passages": [{"source": "A_Comprehensive_Survey_on_Pre_Versus_Post_Quantum_Security_Schemes_for_5G-Enabled_IoT_Applications", "page": 5, "text": "a new generation of IoT devices demands higher throughput rates. As these requirements push the boundaries of existing wireless technologies, 5G emerges as a promising solution to meet these demands effectively [45]. With advancements in wireless communication technologies, 5G is becoming more and more real and has the potential to completely change the Internet of Things (IoT) landscape. Traditional IoT applications like Smart Homes, industries, and farming typically demand minimal wireless capabilities due to the limited processing power of the devices involved. However, emerging trends such as Smart Cities and IoVT necessitate 1Figures are indicative and may differ by 5–6 in count. significantly higher throughput rates to deliver optimal user experiences, a capability uniquely provided by 5G networks [3], [45], [46]. In essence, the advent of 5G technology addresses the evolving connectivity requirements"}, {"source": "A_Comprehensive_Survey_on_Pre_Versus_Post_Quantum_Security_Schemes_for_5G-Enabled_IoT_Applications", "page": 2, "text": "B. Choudhury et al.: Comprehensive Survey on Pre Versus Post Quantum Security Schemes FIGURE 1. 5G-enabled IoT Applications. of digital communication systems. The integration of 5G technology into Internet of Things (IoT) ecosystems marks a significant advancement in smart applications. 5G network offers very high speed with low latency, which are critical for the vast network of IoT devices that depend on flawless communication to operate [3]. The enhanced capabilities of 5G is accelerating the growth of IoT applications in [4], [5], [6], and [7] several fields such as healthcare (Internet of Medical Things (IoMT) [8]), intelligent vehicle monitoring (Internet of Vehicular Things (IoVT) [9]), submarines, and underwater explorations (Internet of Underwater Things (IoUT) [10]), smart home [11], grid [12], supply chain [13], and precision agriculture [14]. Figure 1 shows the Vehicle to Vehicle (V2V), Device to Everything (D2E) and Machine"}, {"source": "A_Comprehensive_Survey_on_Pre_Versus_Post_Quantum_Security_Schemes_for_5G-Enabled_IoT_Applications", "page": 6, "text": "IoT devices may lack compatibility with 5G networks, restricting their functionality and usefulness in specific applications. This compatibility gap could impede the seamless integration of IoT technologies with 5G infrastructure, potentially limiting the scope and effectiveness of IoT deployments reliant on advanced 5G connectivity. The Internet of Things (IoT) is expected to undergo a significant transformation with the arrival of 5G. With low latency, ultra-fast data transmission, and seamless connectivity across a wide range of devices, 5G-enabled IoT is ready to serve to diverse application domains. Each smart application may offer a variety of services to enable a more intuitive environment. However, we are nowhere near exhausting the potential applications of IoT. The Internet of Things permits the combination of sensing, actuating, communication, routing, authentication, identity, and computation, as well as the provision of multiple services"}, {"source": "A_Comprehensive_Survey_on_Pre_Versus_Post_Quantum_Security_Schemes_for_5G-Enabled_IoT_Applications", "page": 7, "text": "B. Choudhury et al.: Comprehensive Survey on Pre Versus Post Quantum Security Schemes TABLE 4. Summary of 5G enabled IoT applications. keenly look for opportunities to exploit the network covertly in order to steal sensitive information or cause financial losses to a business, individual, or organization. They have found the reliability of the devices to be an attractive target because of their deployment in remote locations out of the user’s line of sight. Attackers can viably cause physical damage to the edge devices, introduce harmful software (malware) to compromise the system, or steal personal data, including identities, resulting in privacy breaches. IoT devices are resource-constrained applications. Their peculiar characteristics also poses certain challenges: 1) Large number of IoT devices: The evolution of 5G has increased the number of devices that can be connected per area. Since the number of devices connected to IoT is increasing by leaps and bounds, the task of assigning"}], "claims": ["Smart City and IoVT applications require 5G for significantly higher throughput rates.", "5G uniquely provides the throughput rates required for Smart City and IoVT applications.", "The predicted growth of IoT devices poses security challenges.", "Attackers may exploit the large number of IoT devices to steal sensitive information.", "Attackers may exploit the large number of IoT devices to cause financial losses.", "Robust security measures are needed due to the predicted growth of IoT devices."]}, {"code": "H27", "question": "When should organizations begin post-quantum cryptography migration, and why is waiting for Q-Day an error?", "reference": "Organizations should begin PQC migration now: with Q-Day estimated at 2030 ± 5 years and migration taking 2-5 years (plus 1-3 years of supply-chain coordination), migration must start in 2025-2028 to finish before 2030-2035; legacy constraints and long data confidentiality requirements also make waiting a strategic error.", "answer": "Organizations should begin post-quantum cryptography (PQC) migration now, ideally in 2025-2026, to complete before Q-Day (estimated 2030 ± 5 years). Waiting for Q-Day is an error because it requires 2-5 years for most organizations to migrate their entire cryptographic infrastructure, and additional time is needed for supply chain coordination and legacy system constraints. Data encrypted today remains sensitive throughout the transition period, emphasizing the need for immediate action.", "kg": null, "passages": [{"source": "harvest-now-decrypt-later-pqc-threat-model", "page": 59, "text": "• Migration must begin immediately to enable orderly transition 17.2 Why Waiting for Q-Day Is a Critical Error Several factors make waiting for Q-Day appearance a strategic error: 1. Cryptographic Transition Duration: Moving entire cryptographic infrastructure to PQC requires 2-5 years for most organizations 2. Supply Chain Coordination: Vendors, cloud providers, and partners must coordinate transition (adds 1-3 years) 3. Legacy System Constraints: Some systems are difficult to upgrade and require extended transition periods 4. Data Confidentiality Requirements: Data encrypted today remains sensitive throughout cryptographic transition period Timeline Analysis: - Q-Day estimate: 2030 ± 5 years (accounting for uncertainty) - Migration duration: 2-5 years after decision - Required migration start: 2025-2028 (to complete before 2030-2035) - Current date: 2024-2025 Implication: Organizations should begin PQC migration now. Waiting until Q-Day appears"}, {"source": "harvest-now-decrypt-later-pqc-threat-model", "page": 62, "text": "74, 75. 5. Migration must begin immediately: Effective migration requires 2-5 years for most organizations. To complete before Q-Day, migration should begin in 2025-2026. 6. Hybrid approaches provide transition path: Combining classical and PQC cryptography enables gradual transition while maintaining security guarantees. 70 National Security Agency (NSA). (2022). “Quantum Computing and Post-Quantum Cryptography.” NSA Cybersecurity Information Sheet. Available: https://www.nsa.gov/Cybersecurity/Post-Quantum-Cybersecurity-Resources/ 71 Federal Reserve Board. (2025). “Harvest Now Decrypt Later: Examining Post-Quantum Cryptography Risk in Financial Services.” Finance and Economics Discussion Series 2025-093. Retrieved from https://www.federalreserve.gov/econres/feds/files/2025093pap.pdf 72 Gidney, C., & Ekerå, M. (2019). “How to factor 2048 bit RSA integers in 8 hours using 20 million noisy qubits.” Quantum, 5, 433. DOI: 10.22331/q-2021-04-15-433"}, {"source": "harvest-now-decrypt-later-pqc-threat-model", "page": 63, "text": "support PQC - Coordinate with other vendors and standards bodies For Government and Regulators 78, 79: - Establish clear timelines and requirements for PQC adoption - Provide guidance and standards (NIST, NCSC, ENISA models) - Consider regulatory enforcement to ensure migration progress - Coordinate internationally on quantum-safe standards For Researchers: - Continue cryptanalysis of PQC algorithms - Develop tools for automated cryptographic discovery and management - Research PQC for constrained environments (IoT, embedded) - Investigate alternative quantum-secure paradigms 19.3 Final Statement The quantum threat is not a future event—it is a present-day risk to long-lived data. Organizations managing data with confidentiality requirements extending years or decades face a strategic imperative to migrate to post-quantum cryptography now. Waiting for quantum computers to appear before beginning migration creates unnecessary risk, cost, and disruption."}, {"source": "harvest-now-decrypt-later-pqc-threat-model", "page": 42, "text": "36 QRAMM. (2024, December 23). “PQC Migration Planning: Complete Post-Quantum Cryptography Transition Guide.” Retrieved from https://qramm.org/learn/pqc-migration-planning.html 37 PQCC (Post-Quantum Cryptography Coalition). (2024, September 11). “Transitioning to Quantum-Safe Cryptography: Exploring the Role and Value for Developing and Implementing a Cryptographic Bill of Materials.” Retrieved from https://pqcc.org/transitioning-to-quantum-safe-cryptography-exploring-the-role-andvalue-for-developing-and-implementing-a-crypt 42"}], "claims": ["Organizations should begin post-quantum cryptography migration now.", "The ideal time to begin post-quantum cryptography migration is 2025-2026.", "Organizations should complete post-quantum cryptography migration before Q-Day (estimated 2030 ± 5 years).", "Waiting for Q-Day is an error.", "It takes 2-5 years for most organizations to migrate their entire cryptographic infrastructure.", "Additional time is needed for supply chain coordination.", "Additional time is needed for legacy system constraints.", "Data encrypted today remains sensitive throughout the transition period.", "Immediate action is necessary for post-quantum cryptography migration."]}, {"code": "H28", "question": "Why does Shor's algorithm threaten RSA and elliptic-curve cryptography while Grover's algorithm can be countered by larger symmetric keys, and how many noisy qubits do theoretical estimates say are needed to break 2048-bit RSA?", "reference": "Shor's algorithm efficiently factors large integers and computes discrete logarithms, the hard problems underlying RSA and ECC, so a sufficiently powerful quantum computer could break them. Grover's algorithm only gives a quadratic speed-up for brute-force search, halving the security of symmetric ciphers (AES-128 would have 64-bit security), which can be countered by doubling key sizes. Theoretical resource estimates suggest 2048-bit RSA keys could be broken with fewer than a million noisy qubits.", "answer": "Shor's algorithm threatens RSA and elliptic-curve cryptography because it can efficiently factor large integers and compute discrete logarithms, respectively, whereas Grover's algorithm can be countered by doubling key sizes for symmetric ciphers. Theoretical estimates suggest that factoring a 2048-bit RSA modulus could require only about one million noisy qubits.", "kg": "Knowledge graph entities:\n- 2048-bit RSA (ALGORITHM): Reference for transitioning from 1024-bit RSA.\n- RSA (ALGORITHM): System that relies on the difficulty of factoring large numbers.; Public-key framework used in QMLFD-RSA.; Classical cryptographic algorithm vulnerable to quantum attacks.; Cryptographic algorithm based on integer factor\n- noisy qubits (CONCEPT): Quantum hardware component.; Estimated hardware required for factoring RSA-2048.; Quantum bit with errors or noise.; Poor quality qubits in the case of the D-Wave machine.; For noisy qubits, we don’t know how to show tha\n- elliptic-curve cryptography (SYSTEM): Public-key encryption and digital signature scheme.; Compared system against Kyber for speed and energy efficiency.; Public-key cryptography system.\n- quantum search algorithm (ALGORITHM): Algorithm with π/4 prefactor reflecting its success probability.; Quantum algorithm that can achieve exponential or quadratic speedup.; Quantum search algorithm developed by Grover shows no significant acceleration in so\n- 2048 (CONCEPT): Key size for RSA-2048.\n- symmetric keys (METRIC): Parameter for symmetric key size with values 128/256 bits.; Keys with perfect correlation at the quantum layer.\n- RSA-2048 (ALGORITHM): Public-key cryptosystem that Shor’s algorithm can break.; Public-key (Classical) algorithm with 256 bytes key size.; Classical algorithm for key generation, encryption, and decryption.; A cryptographic algorithm's securi\n\nKnowledge graph relations:\n- Shor’s algorithm -- quantum computing: Threatens current cryptographic systems via quantum computational power.; Quantum computing, particularly Shor’s algorithm, threatens RSA.; Quantum computing poses a threat to RSA via Shor’s algorithm.; Shor's algorithm \n- Shor’s algorithm -- RSA-2048: Both RSA and ECC are vulnerable to Shor’s algorithm.; Shor’s algorithm breaks RSA-2048 in minutes.\n- Shor’s algorithm -- RSA: Shor's algorithm can break RSA.; Shor's algorithm threatens RSA.; Shor’s algorithm can compromise RSA.; Shor’s algorithm makes RSA insecure.; RSA is rendered insecure by Shor's algorithm.; Shor’s algorithm easily solves \n- Shor algorithm -- RSA encryption: Shor algorithm breaks RSA encryption by factoring large numbers.\n- Shor’s algorithm -- RSA security: Shor's algorithm poses a threat to RSA security by making factorization easier.\n- Shor algorithm -- RSA: Shor's algorithm can compromise RSA.\n- Grover’s algorithm -- RSA: Grover’s algorithm affects RSA through brute-force searches.\n- RSA-2048 -- ECC P-256: Both are vulnerable to quantum attacks regardless of key size increases.; Both are currently used classical cryptographic algorithms.\n- Shor’s algorithm -- elliptic-curve cryptography: Shor’s algorithm spells an eventual disaster for ECC.\n- RSA -- Diffie-Hellman: Both RSA and Diffie-Hellman are classical cryptographic algorithms vulnerable to quantum attacks.; RSA and DH are classical algorithms fundamentally flawed by quantum computers.; Both are conventional public key cryptogr\n- RSA-2048 -- AES-256: Both are currently used classical cryptographic algorithms.; RSA-2048 and AES-256 are cryptographic algorithms.; AES-256 is more efficient than RSA-2048.\n- factoring RSA-2048 -- noisy qubits: Factoring RSA-2048 could require one million noisy qubits.", "passages": [{"source": "A Survey of Post-Quantum Cryptography Support in Cryptographic Libraries", "page": 1, "text": "1 Introduction Quantum computing promises to solve certain mathematical problems far faster than classical computers, posing a serious threat to current cryptographic protocols. In particular, Shor’s algorithm, a quantum algorithm, can efficiently factor large integers and compute discrete logarithms—the hard problems that underlie RSA and elliptic-curve cryptography (ECC) [1]. This implies that a quantum computer with sufficient power has the potential to compromise all commonly used public-key encryption and digital signature schemes [2]. Grover’s algorithm, another quantum algorithm, can quadratically speed up brute force search, effectively halving the security of symmetric ciphers (for example, AES-128 would have the security of a 64-bit key) [2,3]. Although Grover’s impact can be countered by doubling key sizes, Shor’s algorithm spells an eventual disaster for RSA, ECC, Diffie-Hellman, and related schemes. The urgency is amplified by the “harvest now, decrypt later” threat:"}, {"source": "Harvest-Now, Decrypt-Later - A Temporal Cybersecurity Risk in the Quantum Transition", "page": 3, "text": "computation of discrete logarithms on a quantum computer, implying that both RSA and elliptic-curve cryptography (ECC) would collapse once scalable quantum hardware becomes available [1,2]. Recent advances in quantum resource estimation have accelerated this timeline. Notably, Google researchers reported that factoring a 2048-bit RSA modulus could require only about one million noisy qubits and a week of runtime. This is a dramatic reduction from earlier twenty-million–qubit projections [12]. Symmetric cryptography remains comparatively resilient, yet Grover’s algorithm offers a quadratic speed-up for brute-force key search, effectively halving the security margin of symmetric ciphers [13]. To compensate, doubling key lengths such as upgrading AES-128 to AES-256, preserves equivalent post-quantum strength [14]. These foundational breakthroughs underpin the HNDL paradigm: adversaries can capture encrypted data"}, {"source": "Practical Challenges in Executing Shor’s Algorithm", "page": 1, "text": "Practical Challenges in Executing Shor’s Algorithm on Existing Quantum Platforms Paul Bagourd1, Julian Jang-Jaccard∗1, Vincent Lenders1, Alain Mermoud1, Torsten Hoefler2, and Cornelius Hempel3 1armasuisse Science and Technology, Cyber-Defence Campus, Thun, Switzerland 2ETH Zurich, Department of Computer Science, Zurich, Switzerland 3Paul Scherrer Institute, ETH Zurich–PSI Quantum Computing Hub, Villigen, Switzerland Abstract Quantum computers pose a fundamental threat to widely deployed public-key cryptosystems, such as RSA and ECC, by enabling efficient integer factorization using Shor’s algorithm. Theoretical resource estimates suggest that 2048-bit RSA keys could be broken using Shor’s algorithm with fewer than a million noisy qubits. Although such machines do not yet exist, the availability of smaller, cloud-accessible quantum processors and open-source implementations of Shor’s algorithm raises the question of what key sizes can realistically be factored with today’s"}, {"source": "Next-Generation Quantum Security - The Impact of Quantum Computing on Cybersecurity—Threats, Mitigations, and Solutions", "page": 7, "text": "rapid performance on particular problems, although they currently support only a limited number of solvable problems, such as  unstructured searches and integer factorization, which threaten current cryptographic solutions. The Shor and Grover quantum  algorithms can break RSA and AES encryption, highlighting the need to develop quantum-proof cryptographic approaches due to  this vulnerability [55]. In addition, in Table 4, we provide a detailed comparison between classical and quantum computing across various parameters,  highlighting their fundamental differences. Classical computing operates on deterministic bits and relies on sequential logic, while  quantum computing utilizes qubits, enabling superposition and entanglement for parallel processing. The discussion centers on  quantum computing’s advantage of significantly accelerated problem-solving capabilities, which result from using Shor’s and"}], "claims": ["Shor's algorithm can efficiently factor large integers.", "Shor's algorithm can compute discrete logarithms.", "Grover's algorithm can be countered by doubling key sizes for symmetric ciphers.", "Factoring a 2048-bit RSA modulus could require about one million noisy qubits."]}, {"code": "H29", "question": "Why do Smart City and IoVT applications need 5G unlike traditional IoT applications, and what security consequences does the predicted growth of IoT devices have?", "reference": "Traditional IoT applications such as Smart Homes, industries and farming need only minimal wireless capabilities, whereas Smart Cities and IoVT require significantly higher throughput, which 5G provides. Together with concepts such as CPS, M2M and 5G, this growth leads to predictions of over 30 billion IoT devices by 2030; their number and variety create numerous security risks, and IoT devices are among the most common targets of adversaries, who can compromise data security and user privacy or disrupt networks.", "answer": "Smart Cities and IoVT applications require 5G due to their need for significantly higher throughput rates to deliver optimal user experiences, which traditional IoT applications do not demand. The predicted growth of IoT devices poses
