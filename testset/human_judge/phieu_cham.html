<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phiếu chấm tay</title>
<style>
:root {
  --bg: #f7f7f5; --surface: #ffffff; --surface2: #f0f0ec; --ink: #1d1d1b; --ink2: #55554f; --line: #dcdcd6;
  --accent: #1c5cab; --accent-ink: #ffffff; --yes: #1f7a4d; --yes-bg: #e3f3ea; --no: #b3261e; --no-bg: #fbe9e7;
  --todo: #fff2b3; --kg: #f3f0fa; --mark: #cfe3ff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161615; --surface: #1f1f1d; --surface2: #2a2a27; --ink: #ecece8; --ink2: #a8a8a0; --line: #3a3a36;
    --accent: #6ea2e6; --accent-ink: #0d1a2b; --yes: #6fcf97; --yes-bg: #1d3528; --no: #f28b82; --no-bg: #3d1f1c;
    --todo: #4a4220; --kg: #26222f; --mark: #24456e;
  }
}
:root[data-theme="dark"] {
  --bg: #161615; --surface: #1f1f1d; --surface2: #2a2a27; --ink: #ecece8; --ink2: #a8a8a0; --line: #3a3a36;
  --accent: #6ea2e6; --accent-ink: #0d1a2b; --yes: #6fcf97; --yes-bg: #1d3528; --no: #f28b82; --no-bg: #3d1f1c;
  --todo: #4a4220; --kg: #26222f; --mark: #24456e;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 system-ui, "Segoe UI", Roboto, sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
  padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
header h1 { font-size: 16px; margin: 0 12px 0 0; }
.progress { flex: 1 1 200px; min-width: 160px; }
.bar { height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
.bar > div { height: 100%; background: var(--accent); width: 0; transition: width .2s; }
.progress small { color: var(--ink2); }
button, .filebtn { font: inherit; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 6px; padding: 6px 12px; cursor: pointer; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button:focus-visible, .filebtn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.layout { display: grid; grid-template-columns: 200px 1fr; gap: 16px; max-width: 1200px; margin: 0 auto; padding: 16px; }
nav { position: sticky; top: 70px; align-self: start; max-height: calc(100vh - 90px); overflow: auto; }
nav ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
nav button { width: 100%; padding: 6px 0; font-size: 13px; }
nav button.done { background: var(--yes-bg); border-color: var(--yes); }
nav button.partial { background: var(--todo); }
nav button.current { outline: 2px solid var(--accent); }
main { min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-bottom: 12px; }
.card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink2); margin: 0 0 6px; }
.card p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.qhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.qhead h2 { font-size: 20px; text-transform: none; letter-spacing: 0; color: var(--ink); margin: 0; }
.kg p { background: var(--kg); padding: 10px; border-radius: 6px; font-size: 13px; max-height: 340px; overflow: auto; }
.passage .src { color: var(--ink2); font-size: 13px; margin-bottom: 6px; }
.label { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; padding: 8px 10px;
  border-radius: 6px; background: var(--todo); }
.label.set { background: var(--surface2); }
.label .q { flex: 1 1 260px; font-weight: 600; }
.label button[aria-pressed="true"].y { background: var(--yes-bg); border-color: var(--yes); color: var(--yes); font-weight: 700; }
.label button[aria-pressed="true"].n { background: var(--no-bg); border-color: var(--no); color: var(--no); font-weight: 700; }
.label input { flex: 1 1 100%; font: inherit; font-size: 13px; padding: 5px 8px; border: 1px solid var(--line);
  border-radius: 5px; background: var(--surface); color: var(--ink); }
.claim { padding: 8px 0; border-top: 1px dashed var(--line); }
.claim:first-of-type { border-top: 0; }
.pager { display: flex; justify-content: space-between; gap: 8px; margin: 16px 0 40px; flex-wrap: wrap; }
details.guide { margin-bottom: 12px; }
details.guide summary { cursor: pointer; font-weight: 600; }
details.guide dl { margin: 8px 0 0; }
details.guide dt { font-weight: 700; margin-top: 8px; }
details.guide dd { margin: 2px 0 0; color: var(--ink2); }
.hint { color: var(--ink2); font-size: 13px; }
mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 2px; }
.terms { margin-top: 8px; font-size: 13px; color: var(--ink2); display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: baseline; }
.terms b { color: var(--ink); font-weight: 600; margin-right: 2px; }
.chip { border-radius: 10px; padding: 1px 8px; border: 1px solid var(--line); background: var(--surface); white-space: nowrap; }
.chip.hit { background: var(--mark); border-color: transparent; color: var(--ink); }
.chip.miss { text-decoration: line-through; opacity: .75; }
.chip small { color: var(--ink2); margin-left: 3px; }
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 4px; }
.compare > div { background: var(--surface2); border-radius: 6px; padding: 8px 10px; }
@media (max-width: 760px) { .compare { grid-template-columns: 1fr; } }
body.nohl mark { background: none; padding: 0; }
body.nohl .terms { display: none; }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg);
  padding: 8px 14px; border-radius: 6px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
@media (max-width: 760px) {
  .layout { grid-template-columns: 1fr; }
  nav { position: static; max-height: none; }
  nav ol { grid-template-columns: repeat(6, 1fr); }
}
</style>
</head>

<script id="data" type="application/json">{"sheet_id": "673eb8409f6b", "guide": [["Mục đích", "Đối chiếu LLM-judge (llama3.1:8b) với human judge trên 36 câu trả lời của nội dung 2. Chấm độc lập: không xem điểm của judge (results/kg30) và không tìm xem câu trả lời là của hệ nào trước khi chấm xong."], ["Cách chấm", "Mỗi ô màu vàng chọn Có (1) hoặc Không (0); ô đã chấm chuyển màu xám. Có thể ghi lý do. Nhãn tự lưu trong trình duyệt này, nhưng nên bấm \"Xuất JSON\" sau mỗi buổi chấm để có bản lưu; \"Nhập JSON\" để chấm tiếp từ file đã xuất (ví dụ trên máy khác)."], ["Đoạn i hữu ích?", "Có nếu passage chứa thông tin giúp suy ra (một phần) GROUND TRUTH. Đoạn chỉ cùng chủ đề nhưng không chứa sự kiện nào của ground truth = Không. Chấm từng đoạn riêng, không phụ thuộc thứ tự."], ["Ý j được hỗ trợ?", "Có nếu ý này suy ra trực tiếp được từ CONTEXT của câu trả lời (phần \"Mô tả KG\" nếu có + 4 đoạn văn). Không nếu context nói khác hoặc không nhắc tới, kể cả khi ý đó đúng theo hiểu biết của bạn."], ["Câu trả lời đúng?", "Có nếu câu trả lời nêu được các sự kiện chính của GROUND TRUTH và không mâu thuẫn với nó; câu refuse (\"I cannot find the answer...\") = Không. Không xét context ở bước này."], ["Tô sáng từ khớp", "Từ khoá của ground truth được tô trong mô tả KG và passage; dưới mỗi ý có danh sách từ của ý và nơi xuất hiện (KG, Đ1–Đ4), từ không thấy bị gạch ngang. Chỉ để đọc nhanh: trùng từ không có nghĩa là hữu ích / được hỗ trợ (đoạn có thể nhắc từ nhưng nói ý khác), thiếu từ cũng có thể do context dùng từ đồng nghĩa. Luôn đọc rồi mới chấm. Tắt bằng nút trên thanh tiêu đề."], ["Khi xong", "Bấm \"Xuất JSON\", lưu file human_labels.json vào thư mục testset/human_judge/ của repo, rồi chạy python human_judge.py --score."], ["Ước lượng thời gian", "Khoảng 4–5 phút mỗi câu trả lời, 2,5–3 giờ cho cả phiếu."]], "cases": [{"code": "H01", "question": "How does quantum secure direct communication (QSDC) differ from quantum key distribution (QKD), and which intercity networks illustrate the development of practical QKD networks?", "reference": "QKD establishes shared secret keys between two parties (Alice and Bob) by exploiting quantum mechanics, whereas QSDC transmits the actual messages directly over a quantum channel, eliminating the need for cryptographic keys for encryption and decryption and giving confidential, near-instantaneous communication. Intercity networks such as the DARPA, Trieste and Tokyo networks illustrate the growth of practical QKD networks.", "answer": "I cannot find the answer in the provided documents.", "kg": null, "passages": [{"source": "QUANTUM KEY DISTRIBUTION - Bridging Theoretical Security Proofs, Practical Attacks, and Error Correction", "page": 1, "text": "standards of secure communications are derived from the last seven decades of information science and cryptography schemes such as public-key authentication. However, in the last three decades, the introduction of quantum computers has put the security of current communications in need of serious revision. Quantum Key Distribution (QKD) is one of the major candidates for secure communication in the age of quantum computers. QKD establishes shared secret keys between two parties, Alice and Bob, by exploiting the principles of quantum mechanics [1, 2]. Throughout the last couple of decades, the development of QKD networks has made great strides. Intercity networks such as the DARPA network [3], Trieste network [4], Tokyo network [5], etc., are prime examples of rapidly growing interest in the development of practical quantum networks. In addition to land-based arXiv:2511.20602v1 [quant-ph] 25 Nov 2025"}, {"source": "Quantum Key Distribution Networks -- Key Management - A Survey", "page": 1, "text": "Faculty of Electrical Engineering University of Sarajevo Sarajevo, Bosnia and Herzegovina miralem.mehic@ieee.org August 9, 2024 ABSTRACT Secure communication makes the widespread use of telecommunication networks and services possible. With the constant progress of computing and mathematics, new cryptographic methods are being diligently developed. Quantum Key Distribution (QKD) is a promising technology that provides an Information-Theoretically Secure (ITS) solution to the secret-key agreement problem between two remote parties. QKD networks based on trusted repeaters are built to provide service to a larger number of parties at arbitrary distances. They function as an add-on technology to traditional networks, generating, managing, distributing, and supplying ITS cryptographic keys. Since key resources are limited, integrating QKD network services into critical infrastructures necessitates"}, {"source": "Are Enterprises Ready for Quantum-Safe Cybersecurity", "page": 5, "text": "Parallel to the advances in PQC, Quantum Key Distribution offers a very different approach to secure communications. QKD uses quantum mechanics to exchange encryption keys between parties such that any eavesdropping on the quantum channel can be detected. When combined with one-time-pad encryption or with classical symmetric ciphers, QKD can theoretically provide provably secure communication, independent of an eavesdropper’s computing power [40–42]. This promise of “information-theoretic security” is enticing, especially for protecting extremely sensitive data (e.g. government or defense communications with long confidentiality requirements). Over the past five years, QKD technology has progressed from laboratory experiments to early commercial deployments. For instance, several real-world QKD networks have been demonstrated: financial institutions in Europe and Asia have piloted QKD links to secure"}, {"source": "harvest-now-decrypt-later-pqc-threat-model", "page": 41, "text": "Trust Node Problem: • QKD systems typically use “trusted nodes” at intermediate points • Each trusted node must be secured and protected from compromise • Compromised trusted node can intercept key material • Creates new insider threat and operational complexity 12.4 PQC vs QKD: Complement or Competition? The cybersecurity community has debated whether PQC and QKD are competing approaches or complementary: PQC Advantages: • Can be deployed on existing infrastructure (software implementation) • No specialized hardware required • Scales to continental/global networks easily • Mature, implementable today • Works with existing protocols (TLS, IPsec, SSH) • Cost-effective for widespread deployment QKD Advantages: 32 The Quantum Insider. (2025, March 4). “Space-Based Quantum Key Distribution: A Deep Dive Into QKD’s"}], "claims": []}, {"code": "H02", "question": "What role does Quantum Random Number Generation (QRNG) play in quantum key distribution (QKD), and how far has QKD technology progressed toward real-world deployment?", "reference": "QKD relies on physics rather than computational hardness to exchange keys provably securely and to detect eavesdroppers; QRNG supports it by producing true random numbers needed for key setting and growth. Over the past five years QKD has moved from laboratory experiments to early commercial deployments, for example financial institutions in Europe and Asia piloting QKD links; combined with one-time-pad or symmetric ciphers it can provide information-theoretic security.", "answer": "Quantum Random Number Generation (QRNG) plays a crucial role in quantum key distribution (QKD) by providing truly unpredictable keys, essential for secure cryptographic solutions. QKD technology has progressed significantly, with real-world deployments like China’s 2,000-km Quantum Key Distribution network, though challenges remain in integrating QKD with legacy systems.", "kg": "Knowledge graph entities:\n- QRNG (SYSTEM): Quantum Random Number Generators.; Source of random numbers used in cryptographic systems.\n- Quantum Key Distribution Networks (SYSTEM): Building a QKD network at scale leads to a combinatorial explosion of needed links.; China’s 2,000-km Quantum Key Distribution network.; Target of the modified PNS attack.; This modified scheme is based on weak laser pul\n- QKD (PROTOCOL): Standard for secure quantum communications.; Quantum cryptography implementations like QKD.; Quantum Key Distribution protocol for secure communications.; Protocol with technical limitations motivating the positions of v\n- Random number generation (CONCEPT): Random number generation risks are highlighted.; Random number generation techniques in QKD.\n- Quantum Random Number Generation (DEFENSE): Generation of random numbers in quantum systems.; Protocol for generating truly random numbers using quantum mechanics.; Improves cryptographic solutions by producing real random numbers.\n- Risk in quantum key distribution (CONCEPT): Quantum key distribution faces threats.\n- Quantum Key Distribution (PROTOCOL): Technology that relies on coherence for secure communication.; Technology that ensures secure state transmission.; Integrated with ML to optimize communication security.; System for quantum communication.; Methods to ens\n- quantum random number generators (SYSTEM): Technology already being used to bolster cryptographic systems.; Ensure high entropy for secure cryptographic keys.; Quantum Random Number Generators (QRNGs) exploit quantum processes to produce entropy.; Device that gen\n\nKnowledge graph relations:\n- Quantum Key Distribution -- Quantum Random Number Generation: QRNG is used for quantum key generation.\n- Quantum Key Distribution -- IoT: QKD is applied to IoT for security.\n- post-processing -- quantum random number generators: Post-processing is needed for QRNGs.\n- Quantum Key Distribution -- cryptographic system: QKD works as part of a larger cryptographic system.\n- Quantum Key Distribution -- legacy systems: QKD faces challenges in integration with conventional networks.\n- quantum random number generators -- photon emission: QRNGs exploit photon emission.\n- quantum random number generators -- truly unpredictable keys: QRNGs provide truly unpredictable keys.\n- quantum random number generators -- entropy: QRNGs produce provably resistant entropy.; Entropy measures the quality of QRNG outputs.\n- quantum random number generators -- phase fluctuations: QRNGs exploit phase fluctuations.\n- Quantum Key Distribution Networks -- Quantum Key Distribution: QKD is used in these networks for secure key distribution.; QKD is used in these networks.; QKD is used in Quantum Key Distribution Networks.\n- Quantum Key Distribution -- edge computing: QKD can enable quantum-secure communication for edge computing.\n- Post-Quantum Cryptography -- quantum random number generators: PQC addresses security concerns related to QRNGs.", "passages": [{"source": "Post-Quantum Cryptography and Quantum-Safe Security", "page": 22, "text": "22 Chhetri et al. 8.3 Quantum Random Number Generators (QRNGs) High-quality randomness is essential for secure cryptographic primitives. Quantum Random Number Generators (QRNGs) exploit the inherent unpredictability of quantum processes, such as photon emission or phase fluctuations, to produce entropy that is provably resistant to prediction and replication [49, 75]. Unlike classical pseudo-random generators, QRNGs provide true randomness rooted in physical laws, ensuring robustness against adversaries with full knowledge of initial system states [49, 75]. Recent advances include semi-device-independent QRNGs (semi-DI QRNGs), which reduce reliance on device trust assumptions while maintaining verifiable security guarantees [56, 97]. Similarly, source-independent QRNGs validate entropy independently of the quantum state source, thereby enhancing robustness against hardware imperfections [56, 98]. Together, these"}, {"source": "Post-Quantum Cryptography and Quantum-Safe Security", "page": 23, "text": "Post-Quantum Cryptography and Quantum-Safe Security: A Comprehensive Survey 23 reliability [52]. Similarly, imperfections in measurement devices directly affect the security of quantum random number generators (QRNGs). Detector noise, efficiency mismatches, and photon leakage can reduce entropy and introduce statistical biases [19]. These flaws underscore the need for rigorous calibration, continuous monitoring, and robust post-processing to maintain the quality of random outputs. Without such safeguards, QRNGs risk generating predictable sequences that undermine the cryptographic strength of dependent systems [19]. 9 Comparative Analysis and Discussion The comparative evaluation of PQC families highlights their relative strengths, limitations, and deployment readiness. This discussion synthesizes mathematical foundations, cryptanalytic track"}, {"source": "Next-Generation Quantum Security - The Impact of Quantum Computing on Cybersecurity—Threats, Mitigations, and Solutions", "page": 2, "text": "ECC (elliptic curve cryptography) through Shor’s algorithm, the weakening of hash functions and symmetric encryption via Grover’s  algorithm, and vulnerabilities in post-quantum cryptography, hash-based signatures, and multivariate polynomial systems. It also  highlights risks in quantum key distribution (QKD), cloud security, and random number generation. To counter these threats, the  figure points to ‘‘Emerging Solutions’’, likely referring to ongoing advancements in post-quantum cryptographic algorithms (such  as lattice-based or code-based cryptography), hybrid systems, and quantum-safe protocols designed to withstand quantum attacks.  The structured layout effectively contrasts critical vulnerabilities with proactive mitigation strategies, emphasizing the need for a  transition to quantum-resistant technologies. In Table 1, we present a comprehensive overview of the impact of quantum computing on various aspects of cybersecurity,"}, {"source": "Quantum key distribution through quantum machine learning - a research review", "page": 2, "text": "2024). Quantum private communication is a practical application for quantum mechanics. It enables secure communication against traditional approaches and advanced technologies such as quantum computers. There are several types of Cryptographic tasks, such as quantum private inquiry and quantum digital signatures control communication. The most basic one is quantum key distribution (QKD) (Liu et al., 2022). The QKD system utilizes physics principles rather than the computational complexity of mathematics problems to enable the provably safe exchange of cryptographic keys against eavesdropping. This fact helps make sure anyone attempting to access the key exchange process may be identiﬁed, ensuring the highest level of security possible. Quantum Random Number Generation (QRNG) improves cryptographic solutions by producing real random numbers needed for key-setting and growth processes, among other areas (Gowda et al., 2025). For quantum key generation, random numbers are used. Various"}], "claims": ["Quantum Random Number Generation (QRNG) plays a crucial role in quantum key distribution (QKD).", "QRNG provides truly unpredictable keys.", "QRNG is essential for secure cryptographic solutions.", "QKD technology has progressed significantly.", "There have been real-world deployments of QKD technology.", "China has a 2,000-km Quantum Key Distribution network.", "Challenges remain in integrating QKD with legacy systems."]}, {"code": "H03", "question": "Which conventional public key cryptography methods are described as susceptible to quantum risks in the survey of pre- versus post-quantum security for 5G-enabled IoT?", "reference": "RSA, Diffie-Hellman, Secret Sharing, and Elliptic Curve Cryptography (ECC).", "answer": "The survey describes traditional public key cryptography methods such as RSA, which is susceptible to quantum risks due to advancements in computing technology that pose threats to traditional cryptography.", "kg": "Knowledge graph entities:\n- public key cryptography (CONCEPT): Public key cryptography tools do not fit appropriately in the IoT context.; Cryptography vulnerable to Shor’s algorithm.\n- cryptography (CONCEPT): Applications in critical fields of QML.; Cryptography is being threatened by quantum technology.; Area affected by quantum capabilities.; Field where quantum computing can outperform classical methods.; Cryptography reli\n- 5G (STANDARD): 5G technology has catalyzed significant advancements in various IoT applications.; Standard for recent IoT applications.; 5G emerges as a promising solution to meet the demands of higher throughput rates.; Standard for i\n- quantum risk (CONCEPT): Working groups focused on quantum-related risks in some financial companies.; Risk associated with quantum computing.; Quantum risks can be integrated into existing security processes.; Risk treated as part of strategic \n- quantum security (CONCEPT): Security measures against threats posed by quantum computing.; A plug-in option accessible to all projects built on Komodo’s blockchain.; Security against quantum threats.\n- Post-Quantum Public Key Cryptography (PROTOCOL): Protocol exploring the solutions reported on LBC, Code-based and Multivariate Polynomials.; Cryptography essential for computer, network, and IoT security.\n- security (CONCEPT): Application of quantum-enabled algorithms in security.; Protection against compromise, deletion, or modification.; Protection against unauthorized access or attacks, a key challenge in ADAS.; Key obstacles in blockchain \n- pre-quantum cryptography (STANDARD): Current cryptographic methods used before quantum computing.\n\nKnowledge graph relations:\n- Post-Quantum Cryptography -- 5G-enabled IoT systems: Post-quantum cryptography is evaluated for 5G-enabled IoT.\n- public-key cryptography -- post-quantum security schemes: Public-key cryptography paradigms are compatible with post-quantum security schemes in resource-constrained IoT applications.\n- pre-quantum encryption -- 5G-enabled IoT systems: Pre-quantum encryption is evaluated for 5G-enabled IoT.\n- Traditional Public key Cryptography -- Post-Quantum Public Key Cryptography: We broadly classified the solutions into two categories: Traditional Public key Cryptography and Post-quantum Public key Cryptography.\n- pre quantum public key cryptographic algorithms -- postquantum cryptographic methods: Pre quantum public key cryptographic algorithms are contrasted with postquantum cryptographic methods.\n- Post-Quantum Public Key Cryptography -- 1024 bit RSA implementation: Post-Quantum Public Key Cryptography addresses threats to traditional cryptography.\n- Post-Quantum Public Key Cryptography -- 2048 bit: Increasing key size has adverse effects on computation cost.\n- Post-Quantum Public Key Cryptography -- 4096 bit: Increasing key size results in significant overhead.\n- pre-quantum cryptography -- Post-Quantum Cryptography: Hybrid cryptography integrates both for backward compatibility.\n- quantum R&D -- cryptography: Quantum technology is a specific threat to cryptography.\n- quantum risk -- PQC: Organizations upgrade cryptography towards PQC to address quantum risk.\n- lattice-based cryptography -- 5G: 5G Lattice-Based Approaches for IoT.", "passages": [{"source": "A_Comprehensive_Survey_on_Pre_Versus_Post_Quantum_Security_Schemes_for_5G-Enabled_IoT_Applications", "page": 15, "text": "with lightweight operations, error correction, identity-based encryption, and physical-layer implementations—offering scalable, secure communication solutions for increasingly interconnected IoT ecosystems. Table 9 summarizes the advances in Secret Sharing Schemes. VII. POST-QUANTUM PUBLIC KEY CRYPTOGRAPHY Public key cryptography is an essential aspect of computer, network, and IoT security. However, recent advancements in computing technology pose threats to traditional cryptography. For instance, in 2010, the 1024 bit RSA implementation was broken [144]. This has necessitated a substantial increase in the key size from 1024 bit to 2048 bit and 4096 bit [145]. Increasing the key size has an adverse effect on the computation cost and results in significant overhead. The advent of super-fast quantum computers further challenged security measures. A quantum computer can now solve factorization problems that take classical computers"}, {"source": "A_Comprehensive_Survey_on_Pre_Versus_Post_Quantum_Security_Schemes_for_5G-Enabled_IoT_Applications", "page": 2, "text": "5G-enabled IoT systems. The study will shed light on the effectiveness of security measures in reducing cyber risks in 5G-enabled IoT environments by analyzing the pros and cons of current cryptographic methods and post-quantum cryptography approaches. Moreover, we also discuss the potential solutions proposed in the recent past and analyze their pros and cons with respect to IoT security. For the ease of following, we have added the list of abbreviations used in this paper in Table 1. A. MOTIVATION, SCOPE, AND CONTRIBUTIONS Numerous benchmark surveys examining the susceptibilities of IoT systems to attacks can be found in the literature. However, current research does not provide thorough comparative assessments of security strategies before and after quantum computing, specifically designed for 5G-enabled IoT. Few studies [18], [19], [20], [21] directly evaluate the effectiveness, efficiency, and application of pre-quantum and post-quantum encryption in IoT environments, although"}, {"source": "Are Enterprises Ready for Quantum-Safe Cybersecurity", "page": 15, "text": "ation of cryptography [73, 74]. Threat actors in the lead-up might attempt to accelerate their operations to take advantage of any window of insecurity. Conversely, after PQC is deployed widely, some older threat tools (like typical phishing that relies on tricking users to install malware) won’t change; quantum doesn’t fix everything, it’s a specific threat to cryptography. In summary, the threat actor perspective reinforces that the threat is credible and growing. The timeline might be uncertain, but adversaries are not sitting idle. Nation-state attackers are almost certainly investing heavily in quantum R&D themselves – China, for instance, has publicized major investments in quantum computing and quantum communications, with strategic documents indicating their intent to lead in these fields. We can infer these states aim to both use quantum tech for offense (decryption) and defense (their own quantum-safe comms). The"}, {"source": "A_Comprehensive_Survey_on_Pre_Versus_Post_Quantum_Security_Schemes_for_5G-Enabled_IoT_Applications", "page": 9, "text": "called the public key and the private key are mathematically computed. By the term mathematically, we mean that security of the keys are based on mathematically hard problems. In asymmetric key cryptography, two keys are involved: a public key and a private key. A public key can be publicly published; however, the private key remains confidential to the creator. In AKC, first the receiver publishes the public key parameters. The sender encrypts the message with the public key published by the receiver. This encrypted message is termed as the cipher text and can be decrypted only with the private key of the receiver. In the subsequent sections VI and VII, we broadly classified the solutions into two categories: 1) Traditional Public key Cryptography mainly detailing on DH, RSA, ECC and Secret Sharing 2) Post-quantum Public key Cryptography exploring the solutions reported on LBC, Code-based and Multivariate Polynomials. Interpretation of Evaluation Criteria Now, we outline"}], "claims": ["The survey describes traditional public key cryptography methods.", "RSA is a traditional public key cryptography method.", "RSA is susceptible to quantum risks.", "Advancements in computing technology pose threats to traditional cryptography."]}, {"code": "H04", "question": "What accuracy does the scalable quantum convolutional neural network (QCNN) achieve on MNIST, and with how many trainable parameters?", "reference": "The scalable QCNN achieves 98.7% accuracy (98.1% on validation) using only 45 independent rotational al Network -- Parameterized Quantum Circuit: QCNN is a scalable version of PQC.\n- Quantum Convolutional Neural Network -- classical Convolutional Neural Networks: QCNN requires fewer parameters than equivalent classical CNNs.; QCNN and CNN are compared in terms of accuracy and parameter count.\n- Quantum Machine Learning -- Classification Accuracy: QSVMs and QCNNs outperform in classification accuracy.\n- Quantum Convolutional Neural Network -- variational architecture: QCNN circumvents the limitations of standard variational architectures.\n- Quantum convoluted neural networks -- Quantum Machine Learning: QCNN is a type of QML algorithm.\n- Quantum Convolutional Neural Network -- Symmetric depolarizing noise: QCNN maintains high accuracy despite noise.\n- Quantum Convolutional Neural Network -- Convolutional Neural Network: QCNN adapts concepts from classical CNNs.\n- Quantum Convolutional Neural Network -- optimization landscape: QCNN architecture deployed against the binary classification task.\n- QCNN -- Quantum Machine Learning: QCNNs outperform classical methods.; QSVMs and QCNNs are QML approaches.; Consolidation of existing techniques includes QCNN.; QML involves augmenting existing pipelines using quantum states.\n- parameterized unitaries -- Quantum Convolutional Neural Network: Parameterized unitaries are used in the QCNN architecture.\n- Quantum Convolutional Neural Network -- convolution operation: QCNNs use quantum gates to perform convolution operations.", "passages": [{"source": "Beyond Barren Plateaus - A Scalable Quantum Convolutional Architecture for High-Fidelity Image Classification", "page": 12, "text": "The training trajectory is remarkable. Unlike the unmitigated QCNN, which plateaued near 52.32% accuracy, our scalable architecture rapidly converged to a high-fidelity state. Figure 6 illustrates the training and validation metrics over 150 epochs. The empirical terminal accuracy achieved on the test dataset is 98.7%. This metric represents a hinges entirely on the mathematical construction of its ansatz and the geometry of its corresponding optimization landscape. As established in the preceding section, standard variational architectures applied to high-dimensional datasets inevitably fall victim to the barren plateau phenomenon, wherein the variance of the gradient vanishes exponentially with the system size. To achieve the requisite scalability and accuracy for complex image classification tasks, such as our target 98.7% benchmark on the MNIST dataset, we must rigorously define a training framework that provably circumvents this topological trap. This section formalizes the translation of classical image data into the quantum Hilbert space, details the parameterized unitaries governing the"}, {"source": "Beyond Barren Plateaus - A Scalable Quantum Convolutional Architecture for High-Fidelity Image Classification", "page": 1, "text": "However, transitioning from theoretical constructs to empirical dominance has proven exceptionally difficult. Initial studies, including our preliminary investigations, revealed a stark performance gap: classical CNNs routinely achieve accuracies exceeding 99% on standard benchmarks like MNIST, whereas naive QCNN implementations languish in the 50%–60% range. This discrepancy is not merely an artifact of immature quantum hardware; rather, it is deeply rooted in the mathematical geometry of the variational loss landscape. The editorial board of Quantum correctly highlights that variational quantum algorithms are plagued by scalability issues, most notably the barren plateau phenomenon, which often strips QCNNs of any potential quantum advantage [1]. In this paper, we directly confront the barren plateau problem in QCNNs. We argue that correctness in circuit design is insufficient for accep1 arXiv:2603.11131v1 [cs.LG] 11 Mar 2026"}], "claims": ["The scalable QCNN achieves 98.7% accuracy on the MNIST dataset.", "The scalable QCNN uses only 45 independent rotational parameters."]}, {"code": "H05", "question": "In quantum public key distribution with polarized photons (BB84), how do Alice and Bob test for eavesdropping, and how are the remaining bits used?", "reference": "They publicly compare a random subset (say one third) of the correctly received bits, sacrificing their secrecy, so that eavesdropping on more than a few photons is unlikely to escape detection. If all comparisons agree, the remaining bits sent and received in the same basis can be used as a one-time pad; when the pad is used up the protocol is repeated.", "answer": "Alice and Bob test for eavesdropping by publicly comparing some of the bits on which they think they should agree, using a random subset (about one third) of the correctly received bits. If all comparisons agree, they conclude the transmission was free of significant eavesdropping. The remaining bits that were sent and received with the same basis and agreed upon can be used as a one-time pad for secure communications.", "kg": null, "passages": [{"source": "Quantum Cryptography - Public Key Distribution and Coin Tossing", "page": 4, "text": "Alice and Bob can therefore test for eaves­ dropping by publicly comparing some of the bits on  which they think they should agree, though of course  this sacrifices the secrecy of these bits.  The bit  positions used in this comparison should be a random  subset (say one third) of the correctly received  bits, so that eavesdropping on more than a few pho­ tons is unlikely to escape detection.  If all the  comparisons agree, Alice and Bob can conclude that  the quantum transmission has been free of signifi­ cant eavesdropping; and those of the remaining bits  that were sent and received with the same basis also  agree, and can safely be used as a one time pad for  subsequent secure communications over the public  channel.  When this one-time pad is used up, the  protocol is repeated to send a new body of random  information over the quantum channel.  The following example illustrates the above proto­ col.  0  0  0  0  0  0  D  R  R  R  R  R  D  D  R  D  D  D  R  \"I.  +-+ i t"}, {"source": "Quantum Cryptography - Public Key Distribution and Coin Tossing", "page": 4, "text": "Thus Bob obtains mean­ ingful data from only half the photons he detects-­ those for which he guessed the corre'ct polarization  basis.  Bob's information is further degraded I>¥ the  fact that, realistically, some of the photons would  be lost in transit or would fail to be counted by  Bob's imperfectly-efficient detectors.  Subsequent steps of the protocol take_place  over an ordinary public communications channel, as­ sumed to be susceptible to eavesdropping but not to  the injection or alteration of messages.  Bob and  Alice first determine, by public exchange of mes­ sages, which photons were successfully received and  of these which were received with the correct basis.  If the quantum transmission has been und•isturbed,  Alice and Bob should agree on the bits encoded by  these photons, even this data has never been dis­ cussed over the public channel.  Each of these pho­ tons, in other words, presumably carries one bit of  random information (e.g. whether a rectilinear pho­"}, {"source": "Quantum Cryptography - Public Key Distribution and Coin Tossing", "page": 5, "text": "same coding scheme as before.  She sends the result­ ing train of polarized photons to Bob.  2.  Bob chooses, independently and randomly for each  photon, a sequence of reading bases.  He reads the photons accordingly, recording the results in two  tables, one of rectilinearly received photons and  one of diagonally received photons.  Because of  losses in his detectors and of the transmission  channel, some of the photons may not be received at  all, resulting in holes in his taʀles.  At this  time, Bob makes his guess as to which basis Alice  used, and announces it to Alice.  He wins if he guessed correctly, loses otherwise.  3.  Alice repor.ts to Bob whether he won, by telling  him which basis she had actually used.  She certif­ ies this information by sending Bob, over a classi­ cal channel, her entire original bit sequence used  in step 1.  ʁ  Bob verifies that no cheating has occurred by  comparing Alice's sequence ʂith both his tables."}, {"source": "Next-Generation Quantum Security - The Impact of Quantum Computing on Cybersecurity—Threats, Mitigations, and Solutions", "page": 20, "text": "as the BB84 QKD scheme allow cryptographic keys to be securely exchanged between devices without the possibility of interception,  since any eavesdropping on a quantum communications channel automatically disrupts the quantum system, and the communication  parties can detect it [233]. In mathematical terms, the quantum cryptographic key is transmitted by sending quantum states |𝜓⟩. The key exchange security  in QKD is based on the quantum no-cloning theorem, which states that an unknown quantum state cannot be perfectly cloned;  hence, eavesdropping is detectable. For example, in the BB84 protocol, Alice sends a series of quantum bits (qubits) in one of four  possible polarization states, say |±0⟩, |±1⟩, along the 𝑋 and 𝑍-bases, measuring the qubits and distilling the shared key from the  measurement outcomes. The main problem in IoT and edge computing environments is related to the limited resources of IoT devices, which have low"}], "claims": ["Alice and Bob test for eavesdropping by publicly comparing some of the bits on which they think they should agree.", "They use a random subset (about one third) of the correctly received bits.", "If all comparisons agree, they conclude the transmission was free of significant eavesdropping.", "The remaining bits that were sent and received with the same basis and agreed upon can be used as a one-time pad for secure communications."]}, {"code": "H06", "question": "How many side-channel leakage points have been reported in Kyber's decryption procedure, and how did researchers use machine learning in a side-channel attack on a Kyber implementation?", "reference": "Three side-channel leakage points were reported in Kyber's decryption procedure, and side-channel attacks were completed on Kyber hardware implementations. Researchers used machine learning to exploit a power-consumption side channel against a Kyber implementation previously believed resistant to such attacks: energy fluctuations of processor or circuit operations reveal details about the data being processed.", "answer": "Several side-channel leakage points have been reported in Kyber's decryption procedure, particularly during the Polynomial Multiplication With Masking (PWM) of ˆs ◦ˆu. Researchers used machine learning to exploit power usage patterns, successfully extracting encryption keys from Kyber implementations.", "kg": null, "passages": [{"source": "Investigating CRYSTALS-Kyber Vulnerabilities - Attack Analysis and Mitigation", "page": 7, "text": "with limited resources thanks to these strategies, which seek to maximize speed while minimizing the use of hardware resources. Even though hardware advancements have resulted in performance advantages, security is still the first priority when implementing Kyber. The identification of sidechannel attack vulnerabilities by recent research has prompted the investigation of solutions to reduce the associated dangers. Power side-channel information has been exploited, and encryption keys have been extracted from Kyber implementations using machine learning techniques [48]. Researchers have suggested recursive learning techniques and disguised implementations to counter these dangers and improve security against side-channel attacks. In addition, new developments in cryptography have been studied to fortify Kyber’s security against possible intrusions, including masked polynomial operations and improved key derivation procedures [49]. 6. Attacks against CRYSTALS-Kyber"}, {"source": "Investigating CRYSTALS-Kyber Vulnerabilities - Attack Analysis and Mitigation", "page": 7, "text": "These fluctuations can be identified and utilized to deduce details about the system or the data being processed. The side-channel attack in CRYSTALS-Kyber was successful in exposing details regarding the encryption key. This makes it possible to decrypt the data since the hacker can now determine the key using the information that was disclosed. Utilizing machine learning to teach the system to take advantage of the side channel allowed for the assault. Given that machine learning is not frequently employed in security research, this is an amazing accomplishment. It serves as a reminder that machine learning"}, {"source": "An Improved Two-Step Attack on Lattice-Based Cryptography - A Case Study of Kyber", "page": 2, "text": "access to a device which is running Kyber decryption and can only observe ciphertexts entered into the device. In addition, they can also capture the power traces of the device. Several test vector leakage assessment (TVLA) results from previous works have indicated the potential leakage points during the decryption process in Kyber [6], [7]. One critical side-channel leakage occurs during the PWM of ˆs ◦ˆu. In the clean implementation of pqm4 [11], polynomial multiplication employs 256 basemuls in Kyber-512. Moreover, each calculation of basemul is independent from the others. From Listing 1, it is clear that the result depends on two secret key coefficients, s0 and s1. All partial secret key coefficients range from (0, 3328) for Kyber. In a practical attack, suppose that the attacker aims to recover the coefficient s0. r1 can be selected as the intermediate value. A. Modified Leakage Model for CPA The Hamming weight (HW) model counts the number of"}, {"source": "Investigating CRYSTALS-Kyber Vulnerabilities - Attack Analysis and Mitigation", "page": 7, "text": "improved key derivation procedures [49]. 6. Attacks against CRYSTALS-Kyber NIST has recommended CRYSTALS-Kyber as one of the public-key algorithms for standardizing post-quantum encryption. A side-channel attack has been successfully used by researchers against an algorithm implementation that was previously believed to be resistant to these kinds of attacks. The researchers employed machine learning techniques to take advantage of this side-channel attack, which entails power usage. With the increased ease of measuring and analyzing computer hardware power usage in recent years, side-channel attacks have grown in importance as a security concern. It is well known that some processor or circuit processes can result in energy fluctuations. These fluctuations can be identified and utilized to deduce details about the system or the data being processed."}], "claims": ["Several side-channel leakage points have been reported in Kyber's decryption procedure.", "The leakage points are particularly during the Polynomial Multiplication With Masking (PWM) of ˆs ◦ˆu.", "Researchers used machine learning to exploit power usage patterns.", "Machine learning was used to successfully extract encryption keys from Kyber implementations."]}, {"code": "H07", "question": "In quantum public key distribution with polarized photons (BB84), how do Alice and Bob test for eavesdropping, and how are the remaining bits used?", "reference": "They publicly compare a random subset (say one third) of the correctly received bits, sacrificing their secrecy, so that eavesdropping on more than a few photons is unlikely to escape detection. If all comparisons agree, the remaining bits sent and received in the same basis can be used as a one-time pad; when the pad is used up the protocol is repeated.", "answer": "In BB84, Alice and Bob test for eavesdropping by performing sifting on the remaining qubits after discarding those measured in different bases. They then use these sifted qubits to determine if an eavesdropper is present. If the quantum transmission has been undisturbed, Alice and Bob should agree on the bits encoded by these photons, which are used as the fi sdropping [12]. QKD implements the uncertainty  principle described by Heisenberg, which states that measurements disturb quantum systems. The security of QKD communication  arises from the fact that any eavesdropping attempt introduces measurable errors due to the disturbance of quantum states. Bennett  and Brassard established BB84 as the most recognized QKD protocol, which uses polarized photons to transmit secret keys. In the BB84 protocol, Alice prepares randomly polarized photons, and Bob measures them using one of two selected measurement  bases [195]. Key material can be securely shared between Alice and Bob only if no eavesdropper—commonly referred to as Eve—"}, {"source": "QUANTUM KEY DISTRIBUTION - Bridging Theoretical Security Proofs, Practical Attacks, and Error Correction", "page": 4, "text": "Basis Qubit State 0 Rectilinear (+) |0⟩ 1 Rectilinear (+) |1⟩ 0 Diagonal (×) |+⟩ 1 Diagonal (×) |−⟩ Table 1: Preparation choices in BB84 protocol The following are the entire steps of the BB84 protocol, (i) Alice prepares the qubits string for a random classical bit string using preparation choices as listed in Table(1), and transmits these using the quantum channel. (ii) Bob randomly chooses a basis of measurement for each qubit. He keeps a record of both the qubit measured and the basis of choice. (iii) Bob declares his basis choice over the classical channel, and the qubits measured in different bases are discarded. (iv) Alice and Bob then choose half of the remaining qubits to determine if an eavesdropper is present by using sifting. They discard these qubits used in sifting to get the final raw key. (v) Once a raw key is established, Alice and Bob should end up with a secret key. They perform privacy"}, {"source": "QUANTUM KEY DISTRIBUTION - Bridging Theoretical Security Proofs, Practical Attacks, and Error Correction", "page": 4, "text": "Conceptual Overview: Uncertainty Based Protocols • Goal: Force any eavesdropper into a guessing basis states for measure compromise under classical cryptography."}, {"source": "Harvest-Now, Decrypt-Later - A Temporal Cybersecurity Risk in the Quantum Transition", "page": 1, "text": "quantum-safe cryptography; hybrid TLS; telecom security 1. Introduction Encryption underpins the trustworthiness of modern communications, but confidentiality guarantees are only as strong as the adversary’s horizon. In practice, attackers can harvest encrypted traffic today and defer decryption until future computational breakthroughs render current schemes obsolete [1,2]. This “harvest-now, decrypt-later” (HNDL) strategy converts long-lived ciphertext into a temporal cyberweapon, threatening not only cryptographic primitives but also the infrastructures and archives that depend on them [3,4]. The phrase HNDL has circulated in industry and policy discourse since the mid-2010s, often attributed to practitioners such as Andersen Cheng, yet it has remained largely informal in the academic literature [5]. Existing studies are piecemeal: for example, recent studies forecasts the feasibility of post-quantum cryptography (PQC) adoption under"}, {"source": "harvest-now-decrypt-later-pqc-threat-model", "page": 13, "text": "These data are prime targets for HNDL attacks. 5. The Harvest Now, Decrypt Later (HNDL) Threat Model 5.1 Definition and Terminology Harvest Now, Decrypt Later (HNDL), also referred to as “store now, decrypt later” or “retrospective decryption,” describes a cybersecurity attack strategy in which an adversary: 1. Intercepts, exfiltrates, or otherwise copies encrypted data during the present day 2. Stores that encrypted data in secure archives without attempting to decrypt it immediately 3. Waits for technological advancement (specifically, quantum computers) to render decryption feasible 4. Retroactively decrypts the historical data, exploiting information that was encrypted at the time of collection HNDL differs fundamentally from traditional cybersecurity breaches in several ways: • Temporal Asymmetry: The adversary collects data when it is protected by strong encryption but decrypts it at a future point when cryptographic defenses have weakened."}, {"source": "Harvest-Now, Decrypt-Later - A Temporal Cybersecurity Risk in the Quantum Transition", "page": 21, "text": "Telecom 2025, 6, 100 21 of 23 dentiality horizons are not overlooked during global migration. By linking cryptographic advances with network design and governance, the community can move from recognizing HNDL as a theoretical risk to operationalizing defenses at scale. Additional research directions include developing quantitative risk models with uncertainty quantification for quantum capability development, creating game-based security definitions for HNDL-resistance, investigating side-channel attacks and implementation vulnerabilities that could accelerate HNDL timelines, and conducting empirical validation through surveys and case studies of real migration efforts. 6. Conclusions Harvest-now, decrypt-later reframes confidentiality as a temporal vulnerability rather than a static property. This work formalizes the HNDL adversarial model, mapped sectoral exposure through confidentiality lifetimes, and synthesized countermeasures spanning"}], "claims": []}, {"code": "H12", "question": "What does the security of SPHINCS+ (SLH-DSA) rely on compared with the other algorithms NIST selected, how does it achieve stateless operation, and which FIPS standards correspond to Kyber, Dilithium and SPHINCS+?", "reference": "Three of the four selected algorithms use structured lattices, while SPHINCS+ derives its security solely from the collision resistance of hash functions. It combines a hierarchy of hash trees with few-time signatures: WOTS+ signs individual nodes, FORS gives few-time signatures at the leaves, and the Hypertree links them to achieve stateless operation. FIPS 203 is ML-KEM (Kyber), FIPS 204 is ML-DSA (Dilithium) and FIPS 205 is SLH-DSA (SPHINCS+).", "answer": "The security of SPHINCS+ (SLH-DSA) relies on the collision resistance of hash functions, unlike lattice-based approaches which use structured lattices. It achieves stateless operation through a hierarchical structure of hash trees combined with WOTS+ for signing individual nodes, FORS for efficient few-time signatures, and the Hypertree construction to link these components. NIST's FIPS 203, 204, and 205 drafts correspond to the standards for Kyber (Module-Lattice KEM), Dilithium (lattice signatures), and SPHINCS+ (SLH-DSA) as stateless hash signatures.", "kg": null, "passages": [{"source": "Are Enterprises Ready for Quantum-Safe Cybersecurity", "page": 4, "text": "be transmitted and processed efficiently, making it suitable as a drop-in replacement for RSA or ECC in protocols like TLS. • CRYSTALS-Dilithium (standardized as ML-DSA) and SPHINCS+ (standardized as SLHDSA) [20–23]: These are quantum-resistant digital signature algorithms. Dilithium is lattice-based, while SPHINCS+ is hash-based (using minimal security assumptions but with larger signature sizes). NIST included both a lattice-based and a hash-based signature in the initial standards, acknowledging the need for diversity in defense (SPHINCS+ serves as a stateless hash-based backup in case a flaw is found in lattice schemes). A fourth algorithm, FALCON (another lattice-based signature), is slated for standardization as an additional option (FIPS 206) by 2025 [23]. These selections have effectively set global direction – many national agencies and industry groups worldwide are aligning with the NIST choices. Some have also approved certain alternate"}, {"source": "Post-Quantum Cryptography and Quantum-Safe Security", "page": 12, "text": "the NTRU assumption-less extensively analyzed than MLWE-leaves open long-term theoretical questions, and experts caution that rejection-sampling techniques may weaken under real-world side-channel conditions [55]. 4.3 SPHINCS+ (SLH-DSA) The stateless hash-based digital signature algorithm (SLH-DSA), instantiated through SPHINCS+, has recently been standardized as FIPS 205 (see Figure 4) [4]. Unlike lattice-based approaches, SLHDSA derives its security solely from the collision resistance of hash functions, avoiding reliance on newer hardness assumptions. It achieves quantum resistance through a hierarchical structure of hash trees combined with few-time signature mechanisms. Specifically, winternitz one-time signature plus (WOTS+) is used for signing individual nodes, FORS enables efficient few-time signatures at the leaf level, and the Hypertree construction links these components together to achieve stateless operation [28]."}, {"source": "A Survey of Post-Quantum Cryptography Support in Cryptographic Libraries", "page": 2, "text": "on an entirely different hardness assumption. Notably, three of these four use structured lattices as the source of difficulty, while SPHINCS+ uses hash functions. NIST’s announcement also identified four additional algorithms for further analysis in a “Round 4”. These included candidates such as Classic McEliece (code-based encryption) and others that, while not selected in the first batch, could be standardized later for broader security [6]. Timeline of Standardization Following the selection, NIST began drafting standards for the new algorithms. By August 2024, NIST released draft versions of FIPS 203, 204, and 205. These drafts correspond to the standards for Kyber, now called Module-Lattice KEM or ML-KEM, Dilithium as lattice signatures, ML-DSA, and SPHINCS+ as stateless hash signature, SLH-DSA [19]. These drafts underwent public comment and final FIPS approval, staying on track with NIST’s earlier estimate that the standards would be finalized about “two years” after the"}, {"source": "Post-Quantum Cryptography and Quantum-Safe Security", "page": 9, "text": "3.3 Hash-Based Signatures Hash-based signature schemes provide the most mathematically conservative security foundation in PQC, relying exclusively on hash function security rather than complex mathematical assumptions that might be vulnerable to future cryptanalytic advances or unexpected algorithmic breakthroughs. SPHINCS+ (SLH-DSA), achieving standardization as FIPS 205, represents the culmination of decades of theoretical and practical research in stateless hash-based constructions [72]. The SPHINCS+ framework incorporates sophisticated mathematical innovations, including tweakable hash functions that provide domain separation and prevent certain classes of attacks, optimized few-time signature schemes that minimize computational overhead, and FORS constructions that enable efficient authentication of large message spaces while maintaining stateless operation. Unlike earlier hash-based schemes that required careful state management to prevent"}], "claims": ["The security of SPHINCS+ (SLH-DSA) relies on the collision resistance of hash functions.", "Lattice-based approaches use structured lattices.", "SPHINCS+ (SLH-DSA) achieves stateless operation through a hierarchical structure of hash trees.", "SPHINCS+ (SLH-DSA) uses WOTS+ for signing individual nodes.", "SPHINCS+ (SLH-DSA) uses FORS for efficient few-time signatures.", "SPHINCS+ (SLH-DSA) uses the Hypertree construction to link components.", "NIST's FIPS 203 corresponds to the standard for Kyber.", "NIST's FIPS 204 corresponds to the standard for Dilithium.", "NIST's FIPS 205 corresponds to the standard for SPHINCS+ (SLH-DSA).", "Kyber is a Module-Lattice KEM.", "Dilithium is a lattice signature.", "SPHINCS+ (SLH-DSA) is a stateless hash signature."]}, {"code": "H13", "question": "How do Kyber's public key and Dilithium's signature sizes compare with classical ECC, and are these post-quantum schemes considered feasible and efficient enough for IoT and mainstream applications?", "reference": "Kyber's public key (~800 bytes) is larger than an ECC public key (~32 bytes) but much smaller than Classic McEliece's (>1 MB, which can exceed IoT RAM), and Dilithium signatures are a few kilobytes versus 64 bytes for ECDSA. Efficient KEMs like Kyber are considered feasible at least at the first security level for a common IoT setup; Kyber operations are fast (comparable to RSA or faster) and Dilithium verifies thousands of signatures per second and suits fast signing when memory is sufficient, while FALCON is more memory-efficient.", "answer": "Kyber's public key is significantly larger than the classical ECC's public key, being approximately 1088 bytes compared to 32 bytes for P-256. Dilithium's signatures are much larger than ECDSA signatures but smaller than some alternatives like McEliece. Both Kyber and Dilithium are considered feasible and efficient enough for IoT and mainstream applications due to their favorable balance across security, performance, and ease of implementation. They are suitable for general-purpose deployment across various applications, including constrained environments or bandwidth-sensitive ones.", "kg": "Knowledge graph entities:\n- Kyber (ALGORITHM): Quantum-resistant cryptographic algorithm evaluated in the study.; Quantum-safe alternative recommended for full adoption before 2030.; Lattice-based key encapsulation mechanism based on Module-LWE problem.; Algorithm co\n- elliptic-curve cryptography (SYSTEM): Public-key encryption and digital signature scheme.; Compared system against Kyber for speed and energy efficiency.; Public-key cryptography system.\n- Dilithium (ALGORITHM): Quantum-resistant cryptographic algorithm evaluated in the study.; One of the digital signature schemes selected for standardization.; Digital signature scheme.; Algorithm designed with a focus on balancing efficiency an\n- ML-KEM (ALGORITHM): Module-lattice based key-encapsulation mechanism.; Post-quantum key encapsulation mechanism (Kyber) that is on the roadmap for libsodium.; KEM variant of Kyber.; Will likely come first in NIST standardization due to its \n- public key (CONCEPT): Kyber768's public key is ∼1088 bytes.; Key that can be r, Dilithium, Falcon, and SPHINCS+ are selected for transitioning to quantum-safe methods.; Both algorithms have been designed with a focus on balancing \n- hybrid schemes -- Kyber: Hybrid schemes can include Kyber for post-quantum security.\n- multivariate schemes -- Dilithium: Alternative post-quantum cryptographic scheme.\n- isogeny-based approach -- Dilithium: Alternative post-quantum cryptographic scheme.\n- Dilithium -- PQC: Dilithium is a PQC scheme.; Dilithium is a widely adopted PQC algorithm.; PQC includes algorithms like Dilithium for digital signatures.", "passages": [{"source": "A Comparative Study of Classical and Post-Quantum Cryptographic Algorithms in the Era of Quantum Computing", "page": 8, "text": "as their underlying assumptions hold true. - Key and Signature Size Overheads Post-quantum cryptography often comes with a significant price tag in terms of key and signature sizes. For instance, SPHINCS+ signatures can be 30-50 times larger than ECDSA signatures. This might be a major concern for constrained environments or bandwidth-sensitive applications that require compact data transfers. Falcon, on the other hand, provides relatively small signatures but is notoriously difficult to implement securely. - Performance and Implementation Complexity While many post-quantum cryptographic schemes perform reasonably well in software implementations, some (like SPHINCS+) are computationally intensive. Dilithium and Kyber strike a balance between efficiency and simplicity, making them suitable for general-purpose deployment across various applications. - Deployment Readiness: A Few Front-Runners Among the post-quantum candidates, Kyber and Dilithium are considered the most mature"}, {"source": "A Comparative Study of Classical and Post-Quantum Cryptographic Algorithms in the Era of Quantum Computing", "page": 12, "text": "SHA-3, exhibit a higher degree of resilience. Although Grover’s algorithm offers a quadratic speed-up in brute-force attacks against these primitives, the impact can be mitigated by increasing key and output lengths. AES-256 and SHA512, for example, provide sufficient security margins in a post-quantum context, preserving the viability of symmetric and hash-based systems under quantum threat models. Among the post-quantum candidates, Kyber and Dilithium stand out for achieving a favorable balance across security, performance, and ease of implementation. These lattice-based algorithms have been selected by NIST as standard recommendations for quantum-resistant cryptographic primitives. Their efficiency, relative simplicity, and strong theoretical underpinnings make them suitable for widespread deployment. Further specificity is observed in the comparison of Falcon and SPHINCS+. Falcon produces compact and efficient digital signatures, which is advantageous for bandwidth-constrained"}, {"source": "Post-Quantum Cryptography and Quantum-Safe Security", "page": 26, "text": "Dilithium, and SPHINCS+), the comparative evaluation of alternative schemes-particularly multivariate, code-based, and isogeny-based approaches-remains incomplete. Many existing studies rely on benchmarks under specific conditions that may not generalize to diverse environments such as embedded IoT devices, cloud-scale infrastructures, or mission-critical systems with strict latency requirements. Second, side-channel resistance and implementation security are often treated as afterthoughts in algorithmic proposals, leaving open questions about their viability in adversarial real-world contexts. Third, the literature surveyed reveals a geographic and institutional concentration of research, which may limit the diversity of perspectives on deployment models and governance frameworks. Acknowledging these limitations clarifies the scope of the current survey and signals the need for broader and deeper engagement across the PQC research ecosystem."}, {"source": "A Survey of Post-Quantum Cryptography Support in Cryptographic Libraries", "page": 6, "text": "1.0.x series, Libsodium does not include support for any of the NIST PQC finalist algorithms. The library currently provides modern public-key cryptography (Curve25519-based key exchange, Ed25519 signatures, X25519/XChaCha, etc.), but no post-quantum key exchange or signature schemes have been integrated yet. The community has shown interest and asked questions regarding PQC in libsodium. Specifically, developers have inquired about the potential addition of algorithms such as Kyber or Dilithium. The lead developer of libsodium (Frank Denis) has been cautious on this front. In a discussion thread, it was noted that “ML-KEM is on the roadmap” for libsodium, but that PQC integration is complex and has not yet been completed [37]. This implies that libsodium’s author is aware of Kyber (ML-KEM) and intends to support it eventually, but no official timeline is given. Observation: For now, if quantum readiness is required, libsodium alone is insufficient – one must integrate additional"}], "claims": ["Kyber's public key is approximately 1088 bytes.", "Classical ECC's public key is 32 bytes for P-256.", "Dilithium's signatures are larger than ECDSA signatures.", "Dilithium's signatures are smaller than McEliece's signatures.", "Kyber's public key is larger than classical ECC's public key.", "Kyber and Dilithium are feasible for IoT applications.", "Kyber and Dilithium are feasible for mainstream applications.", "Kyber and Dilithium are efficient enough for IoT and mainstream applications.", "Kyber and Dilithium are suitable for general-purpose deployment.", "Kyber and Dilithium are suitable for constrained environments.", "Kyber and Dilithium are suitable for bandwidth-sensitive environments."]}, {"code": "H14", "question": "What does the security of SPHINCS+ (SLH-DSA) rely on compared with the other algorithms NIST selected, how does it achieve stateless operation, and which FIPS standards correspond to Kyber, Dilithium and SPHINCS+?", "reference": "Three of the four selected algorithms use structured lattices, while SPHINCS+ derives its security solely from the collision resistance of hash functions. It combines a hierarchy of hash trees with few-time signatures: WOTS+ signs individual nodes, FORS gives few-time signatures at the leaves, and the Hypertree links them to achieve stateless operation. FIPS 203 is ML-KEM (Kyber), FIPS 204 is ML-DSA (Dilithium) and FIPS 205 is SLH-DSA (SPHINCS+).", "answer": "The security of SPHINCS+ (SLH-DSA) relies on the stateless approach and hash functions, distinguishing it from lattice-based algorithms like Dilithium and Kyber which depend on hard problems in lattice theory. SPHINCS+ achieves stateless operation by not requiring any state to be maintained between signature generations, making it more resilient to side-channel attacks. NIST has standardized Kyber, Dilithium, and SPHINCS+ under FIPS 203, 204, and 205, respectively.", "kg": "Knowledge graph entities:\n- SLH-DSA (ALGORITHM): Stateless hash signature.; Hash-Based Signature Algorithm for post-quantum cryptography.; Signature Generation takes 50–100 ms.; PQC standard for digital signatures.; A digital signature algorithm.; Algorithm part of SPH\n- SPHINCS+ (ALGORITHM): Hash-based digital signatures for post-quantum security.; One of the digital signature schemes selected for standardization.; Digital signature scheme.; Hash-based digital signature scheme with stateless, hash-based appr\n- FIPS (STANDARD): Focus of Crypto++'s usage.; NIST standard for PQC algorithms.; Three post-quantum algorithms were approved as FIPS.; Federal Information Processing Standard.; Standard for which ML-KEM, ML-DSA, and FN-DSA have been stand\n- SPHINCS (ALGORITHM): Signature framework.\n- NIST (ORGANIZATION): U.S. government agency standardizing post-quantum cryptography.; Launched a global competition for quantum-resistant public-key cryptographic algorithms.; Kyber has been officially selected by NIST.; Selected Falcon for \n- Dilithium ( ompared to lattice-based alternatives.\n- NIST FIPS approvals -- SLH-DSA: NIST FIPS approvals formalized a baseline for SLH-DSA.\n- SLH-DSA -- SPHINCS+: SLH-DSA is the same as SPHINCS+.; SPHINCS+ instantiated through SLH-DSA.\n- SLH-DSA -- FIPS 205: SLH-DSA standardized as FIPS 205.", "passages": [{"source": "Post-Quantum Cryptography and Quantum-Safe Security", "page": 11, "text": "systems. To this end, NIST has endorsed three signature families for widespread adoption-ML-DSA (Dilithium), SLH-DSA (SPHINCS+), and the lattice-based Falcon under a parallel track-highlighting a balance between performance efficiency and conservative security across lattice- and hash-based paradigms [4, 70, 71]. These post-quantum signature mechanisms mark a decisive move away from traditional RSA and elliptic curve digital signature algorithm (ECDSA), grounding security in problems that remain intractable even with quantum computation [57]. The selected algorithms-CRYSTALS-Dilithium (ML-DSA), Falcon (FN-DSA), and SPHINCS+ (SLH-DSA)-each bring unique trade-offs in efficiency, key and signature sizes, and assurance levels, ensuring flexibility for varied deployment requirements in the emerging quantum era [23]. 4.1 CRYSTALS-Dilithium (ML-DSA) The ML-DSA (see Figure 3), formerly known as CRYSTALS-Dilithium, is a lattice-based signature"}, {"source": "A Comparative Study of Classical and Post-Quantum Cryptographic Algorithms in the Era of Quantum Computing", "page": 5, "text": "key encapsulation mechanism, and three digital signature schemes: Dilithium, Falcon, and SPHINCS+. These selections represent a foundational step toward transitioning global cryptographic infrastructure to quantum-safe methods. Key Algorithms and Their Characteristics 3.2 Kyber (Module-LWE KEM) Kyber is a lattice-based key encapsulation mechanism grounded in the Module Learning With Errors (MLWE) problem, a problem believed to be hard even for quantum computers. It is designed to offer robust security while maintaining efficiency, making it suitable for integration into high-performance environments such as Transport Layer Security (TLS), Virtual Private Networks (VPNs), and embedded systems. Depending on the selected security level, Kyber’s key sizes range between 800 and 1500 bytes. It achieves high throughput with low latency and has been officially selected by NIST as a general-purpose post-quantum encryption and key exchange mechanism. 5"}, {"source": "A Comparative Study of Classical and Post-Quantum Cryptographic Algorithms in the Era of Quantum Computing", "page": 8, "text": "as their underlying assumptions hold true. - Key and Signature Size Overheads Post-quantum cryptography often comes with a significant price tag in terms of key and signature sizes. For instance, SPHINCS+ signatures can be 30-50 times larger than ECDSA signatures. This might be a major concern for constrained environments or bandwidth-sensitive applications that require compact data transfers. Falcon, on the other hand, provides relatively small signatures but is notoriously difficult to implement securely. - Performance and Implementation Complexity While many post-quantum cryptographic schemes perform reasonably well in software implementations, some (like SPHINCS+) are computationally intensive. Dilithium and Kyber strike a balance between efficiency and simplicity, making them suitable for general-purpose deployment across various applications. - Deployment Readiness: A Few Front-Runners Among the post-quantum candidates, Kyber and Dilithium are considered the most mature"}, {"source": "Post-Quantum_Blockchain_Security_for_the_Internet_of_Things_Survey_and_Research_Directions", "page": 6, "text": "the Winternitz one-time signature as a hash-based scheme is used to validate transactions in the IOTA cryptocurrency project [64]. However, in addition to providing a standard for KEM schemes, NIST has recently presented three postquantum signatures as future deployment standards [59]: Dilithium [65], FALCON [66], and SPHINCS+ [67]. The following is a more in-depth examination of these postquantum signature schemes: 1) CRYSTALS-Dilithium: Dilithium is a post-quantum signature that relies on the hardness of module lattice problems to provide security against chosen message attacks. Dilithium is a lattice-based signature family member with a short signature and public key that employs uniform sampling. Although Dilithium’s signature is nearly twice as large as BLISS’s (the smallest scheme among lattice-based signatures), it accomplishes a 2.5 lower public key size compared to the most effective lattice-based signature schemes [61]. It is developed"}], "claims": ["The security of SPHINCS+ (SLH-DSA) relies on the stateless approach and hash functions.", "SPHINCS+ achieves stateless operation by not requiring any state to be maintained between signature generations.", "Dilithium and Kyber depend on hard problems in lattice theory.", "NIST has standardized Kyber, Dilithium, and SPHINCS+ under FIPS 203, 204, and 205, respectively."]}, {"code": "H15", "question": "How do Kyber's public key and Dilithium's signature sizes compare with classical ECC, and are these post-quantum schemes considered feasible and efficient enough for IoT and mainstream applications?", "reference": "Kyber's public key (~800 bytes) is larger than an ECC public key (~32 bytes) but much smaller than Classic McEliece's (>1 MB, which can exceed IoT RAM), and Dilithium signatures are a few kilobytes versus 64 bytes for ECDSA. Efficient KEMs like Kyber are considered feasible at least at the first security level for a common IoT setup; Kyber operations are fast (comparable to RSA or faster) and Dilithium verifies thousands of signatures per second and suits fast signing when memory is sufficient, while FALCON is more memory-efficient.", "answer": "Kyber's public key is much smaller than Dilithium's signature size compared to classical ECC. For instance, Kyber’s public key is around 800 bytes, signifi ey ( 32 bytes) but much smaller than some alternatives like McEliece (which uses very large public keys, e.g. > 1 MB) [26–28]. These differences can impact network bandwidth and storage, especially in constrained devices. However, researchers have demonstrated that for most mainstream applications the overhead is manageable: Kyber operations are fast (comparable to RSA in software and even faster with optimized implementations), and Dilithium can verify thousands of signatures per second on a modern CPU [17]. Early performance benchmarks indicate that lattice-based algorithms can often be optimized with hardware acceleration (e.g., using vector instructions) and may even"}, {"source": "Post-Quantum_Blockchain_Security_for_the_Internet_of_Things_Survey_and_Research_Directions", "page": 7, "text": "time required to generate a key is prohibitive compared to the other two schemes. There are also some concerns about defending against timing and side-channel attacks because it employs many discrete Gaussian samplings over integers [61]. Additionally, it is noticeable that while the size of the public and private keys in Dilithium is signiﬁcantly larger than SPHINCS+, it offers a far superior signature size and speed in comparison to FALCON and SPHINCS+, as shown in Table III. However, FALCON and SPHINCS+ outperformed Dilithium in terms of memory utilization, thereby making them more suitable for devices with limited memory. IV. PQCS IN IOT DEVICES Post-quantum cryptosystems will eventually replace traditional methods in many security protocols, which impact IoT ecosystems that use these protocols. This is caused by the high memory consumption and cryptographic overhead associated with their operations and outputs, such as signing, validating,"}, {"source": "A Comparative Study of Classical and Post-Quantum Cryptographic Algorithms in the Era of Quantum Computing", "page": 11, "text": "As outlined in Table 2, the move to post-quantum algorithms entails a shift to problems
