cting eigenvalues of unitary operators.; Utilizes quantum-mechanical phenomena and quantum communication channels.\n- Quantum Key Distribution (PROTOCOL): Technology that relies on coherence for secure communication.; Technology that ensures secure state transmission.; Integrated with ML to optimize communication security.; A cryptographic protocol that uses quantum physic\n- security (CONCEPT): Application of quantum-enabled algorithms in security.; Key obstacles in blockchain implementation.\n- quantum cryptography implementations (SYSTEM): State of quantum cryptography implementations like QKD.\n- traditional cryptography (CONCEPT): Rely on traditional cryptography, which is affected by quantum computers.\n- three-state quantum key distribution (QKD) protocol (PROTOCOL): Demonstrates security up to a bit error rate of 9.81%.\n- three-stage multi-photon quantum key distribution (QKD) protocol (PROTOCOL): The protocol leverages multi-photon coherent states and double-lock cryptography.\n\nKnowledge graph relations:\n- classical cryptography -- Quantum Key Distribution: QKD is used in conjunction with classical cryptography for authentication.\n- Quantum Key Distribution -- classical encryption: Contrasts with classical encryption which can work over any network path.; QKD would typically be used alongside classical encryption in a hybrid solution.; Classical encryption is used in a hybrid solution with QKD.\n- Quantum Key Distribution -- Post-Quantum Cryptography: QKD cannot be implemented as a software patch like PQC.; QKD is a specialized algorithm in the post-quantum cryptography domain.\n- Quantum Key Distribution -- composable security: QKD provides composable security.; Security analysis of QKD distinguishing raw security from KPA security.; The framework is for proving the robustness of QKD against general quantum attacks.\n- PQC -- Quantum Key Distribution: PQC will be the workhorse of future quantum-safe security, whereas QKD might protect specific high-value links.\n- quantum cryptography implementations -- standards: Are quantum cryptography implementations like QKD part of the standards?\n- Quantum Key Distribution -- information-theoretic security: QKD offers the promise of information-theoretic security.\n- Quantum Key Distribution -- finite-key security: QKD provides finite-key security.; Security analysis of QKD distinguishing raw security from KPA security.\n- Quantum Key Distribution -- unconditional security: QKD provides unconditional security.; QKD provides information-theoretic security.\n- PQC -- quantum cryptography implementations: Evaluating the readiness of PQC algorithms and QKD.\n- Quantum Key Distribution -- quantum error-correction codes: QKD’s security guarantees are assessed through QECCs.; QECCs ensure the integrity of transmitted quantum states.\n- Quantum Key Distribution -- classical symmetric ciphers: QKD can be combined with classical symmetric ciphers.", "passages": [{"source": "QUANTUM KEY DISTRIBUTION - Bridging Theoretical Security Proofs, Practical Attacks, and Error Correction", "page": 15, "text": "further resilience, while machine learning–based anomaly detection can also be explored as event detection for more sophisticated jamming attacks. In tab(4), we summarize all the attacks we reviewed in this Sec 3. Because many of these attacks are statistically indistinguishable from background noise at realistic block sizes, asymptotic analyses alone are insufficient. In Sec. 4 we map these threats to unconditional-, finite-key-, and composablesecurity frameworks. We also highlight the role of QECC in keeping error budgets within those bounds. 4 Security Analysis of QKD We now review the security of Quantum Key Distribution systems by looking over different classes of security proofs. 4.1 Security Paradigms in QKD As mentioned earlier, QKD provides security by leveraging the principles of quantum mechanics. The security paradigms in QKD are broadly classified as unconditional security, finite-key security, and composable security."}, {"source": "QUANTUM KEY DISTRIBUTION - Bridging Theoretical Security Proofs, Practical Attacks, and Error Correction", "page": 15, "text": "paradigms in QKD are broadly classified as unconditional security, finite-key security, and composable security. QKD exploits inherently quantum phenomena—such as non-orthogonal state encoding and the no-cloning theorem—to generate shared keys between Alice and Bob. This provides information-theoretic security rather than security relying on hard mathematical problems [1, 2]. Since BB84’s formulation, several rigorous proofs have established its unconditional security under ideal assumptions, in stark contrast to classical schemes (e.g. RSA) whose safety depends on computational complexity [2, 54]. Security analyses further distinguish raw security—Eve’s maximum success probability during key generation—from Known-Plaintext Attack (KPA) security, which bounds her advantage once part of the key is revealed during message exchange [55, 54]. 15"}, {"source": "Are Enterprises Ready for Quantum-Safe Cybersecurity", "page": 3, "text": "assessment that not only answers the research question but also guides stakeholders in preparing for the post-quantum era. In summary, as we stand at the cusp of a paradigm shift in cybersecurity, this work contributes an up-to-date review and strategic framework for understanding and enhancing enterprise readiness for quantum cybersecurity. The next sections delve into each perspective in detail, leveraging contemporary literature and industry data to illuminate where we stand and what comes next. 2 The Technologist Perspective: Quantum Cybersecurity Solution Maturity From the technologist or solution-provider viewpoint, we assess the maturity, practicality, and scalability of quantum-safe cybersecurity technologies as of mid-2020s. This includes evaluating the readiness of PQC algorithms for deployment and the state of quantum cryptography implementations like QKD. Key questions include: Have viable standards emerged? Are these solutions commercially available and easily integrable?"}, {"source": "Are Enterprises Ready for Quantum-Safe Cybersecurity", "page": 5, "text": "Parallel to the advances in PQC, Quantum Key Distribution offers a very different approach to secure communications. QKD uses quantum mechanics to exchange encryption keys between parties such that any eavesdropping on the quantum channel can be detected. When combined with one-time-pad encryption or with classical symmetric ciphers, QKD can theoretically provide provably secure communication, independent of an eavesdropper’s computing power [40–42]. This promise of “information-theoretic security” is enticing, especially for protecting extremely sensitive data (e.g. government or defense communications with long confidentiality requirements). Over the past five years, QKD technology has progressed from laboratory experiments to early commercial deployments. For instance, several real-world QKD networks have been demonstrated: financial institutions in Europe and Asia have piloted QKD links to secure"}], "claims": ["The security basis of quantum cryptography is information-theoretic security.", "Traditional encryption relies on computational complexity.", "QKD protocols are categorized into two types.", "The three-state QKD protocol is one type of QKD protocol.", "The three-stage multi-photon QKD protocol is one type of QKD protocol.", "QKD can detect eavesdropping on the quantum channel.", "QKD ensures secure key transmission.", "QKD is distinguished from traditional key agreement by its ability to detect eavesdropping on the quantum channel."]}, {"code": "A083", "question": "Why are multivariate quadratic (MQ) cryptographic schemes considered quantum-resistant, what are they mainly used for, and what property makes a multivariate signature scheme suitable for authenticating edge nodes?", "reference": "MQ cryptography relies on solving systems of quadratic equations over finite fields, an NP-hard problem for which no efficient classical or quantum algorithm is known; MQ-based schemes are mainly used for digital signatures and public-key encryption. A multivariate signature scheme proposed by Akleylek et al. is immune to quantum attacks, has effective key and signature sizes, and its excellent parallelism support allows edge node authentication to be deployed effectively.", "answer": "Multivariate quadratic (MQ) cryptographic schemes are considered quantum-resistant because no efficient classical or quantum algorithms are known for solving generic MQ systems. They are mainly used in digital signatures and public-key encryption. The property that makes a multivariate signature scheme suitable for authenticating edge nodes is its resistance to quantum attacks, which is crucial for long-term security in edge computing environments where devices may have limited computational resources.", "kg": "Knowledge graph entities:\n- Rainbow (SYSTEM): Multivariate crypto for signing.; Cryptographic method built on multivariate quadratic equations.; Uses multivariate quadratic equations for digital signatures.; Multivariate-based signatures (Rainbow) are used in hybrid\n- multivariate quadratic (MQ) cryptography (PROTOCOL): Promising PQC approach involving solving systems of quadratic equations.\n- multivariate signatures (ALGORITHM): A quantum-resistant signature scheme.; Contribute diversity and useful ideas but have a higher risk profile.\n- multivariate cryptography (ALGORITHM): Identified as a leading quantum-resistant solution.; Multivariate cryptography is one of the six primary categories in the taxonomy.; Illustrates both innovation and fragility within Post-Quantum Cryptography.; Family of\n- multivariate schemes (ALGORITHM): Quantum-resistant algorithm that can be part of a hybrid system.; Promising cryptographic family.; Schemes utilizing the UOV construction.; Multivariate and MPC-in-the-Head approaches illustrate active research direction\n- signature (CONCEPT): Digital signature in XMSS scheme S_i = H_i(m, r_i).; Signature algorithm.; Output of the signing process that is transmitted to Alice.; CONCEPT|Components of the signature returned by the signing procedure.; Output assoc\n- multivariate quadratic equations (ALGORITHM): Used in Rainbow protocol for generating digital signatures.\n- Multivariate Cryptographic Scheme (ALGORITHM): Multivariate cryptographic schemes have experienced profound challenges.\n\nKnowledge graph relations:\n- multivariate quadratic (MQ) cryptography -- digital signature: MQ-based schemes are used in digital signatures.\n- multivariate quadratic (MQ) cryptography -- quantum computer: No efficient quantum algorithms known for solving MQ systems.\n- multivariate quadratic (MQ) cryptography -- public-key encryption: MQ-based schemes are used in public-key encryption.\n- multivariate signatures -- quantum-resistant cryptographic algorithms: Multivariate signatures are a quantum-resistant cryptographic protocol.\n- multivariate quadratic (MQ) equations -- Post-Quantum Cryptography: Multivariate quadratic equations are a type of PQC.\n- multivariate quadratic (MQ) cryptography -- classical computer: No efficient classical algorithms known for solving MQ systems.\n- multivariate cryptography -- Post-Quantum Cryptography: Multivariate cryptography is a less mature paradigm in PQC.\n- hybrid cryptographic system -- multivariate schemes: Hybrid systems combine quantum-resistant algorithms like multivariate schemes.\n- post-quantum algorithms -- multivariate cryptography: Post-quantum algorithms include multivariate cryptography.\n- multivariate schemes -- Dilithium: Alternative post-quantum cryptographic scheme.\n- multivariate cryptography -- Rainbow: Rainbow is a notable break against multivariate cryptography.\n- lattice-based scheme -- multivariate cryptography: Other families have experienced major setbacks.", "passages": [{"source": "Next-Generation Quantum Security - The Impact of Quantum Computing on Cybersecurity—Threats, Mitigations, and Solutions", "page": 15, "text": "𝑞 and a generator matrix 𝐺, the  attacker must find an error vector 𝑒∈F𝑛 𝑞 such that 𝑦= 𝐺𝑥+ 𝑒 for some codeword 𝑥. This problem remains intractable for quantum computers, making McEliece a strong candidate for PQC. Despite its large key  sizes, McEliece has been extensively studied due to its long-standing resistance to both classical and quantum attacks [188]. 5.3. Multivariate Quadratic equations (MQ) Multivariate quadratic (MQ) cryptography is a promising PQC approach [189]. The core problem involves solving systems of  quadratic equations over finite fields:  𝑓1(𝑥1, 𝑥2, … , 𝑥𝑛) = 0, 𝑓2(𝑥1, 𝑥2, … , 𝑥𝑛) = 0, ⋮ 𝑓𝑚(𝑥1, 𝑥2, … , 𝑥𝑛) = 0, (8) where each 𝑓𝑖 is a quadratic polynomial in 𝑛 variables. No efficient classical or quantum algorithms are known for solving generic  MQ systems, making them suitable for cryptographic applications. MQ-based schemes are primarily used in digital signatures and  public-key encryption, leveraging their resistance to quantum attacks."}, {"source": "Post-Quantum Cryptography and Quantum-Safe Security", "page": 5, "text": "Post-Quantum Cryptography and Quantum-Safe Security: A Comprehensive Survey 5 Multivariate cryptography illustrates both innovation and fragility within PQC. These schemes rely on the difficulty of solving systems of multivariate quadratic (MQ) equations over finite fields, which is Nondeterministic Polynomial-time (NP)-hard in general. The family has produced compact signatures and fast signing in some proposals, but it has also faced decisive cryptanalytic pressure. Notable breaks against Rainbow and improved analyses of unbalanced oil and vinegar (UOV) variants have repeatedly reset expectations about safe parameterization [15, 16, 51]. Recent work, such as the MAYO multivariate signature scheme (MAYO), revisits design choices and implementation security, including the effect of physical attack models on side-channel robustness [9]. The net effect is that multivariate signatures contribute diversity and useful ideas, yet their risk"}, {"source": "Post-Quantum Cryptography and Quantum-Safe Security", "page": 23, "text": "essential for applications requiring long-term assurance against unforeseen advances in algebraic cryptanalysis. In contrast, multivariate and isogeny-based families have suffered significant setbacks. The rectangular MinRank attack on Rainbow demonstrated the susceptibility of multivariate schemes to advanced algebraic methods [16], while the collapse of SIKE illustrated how subtle structural vulnerabilities can be exploited using unexpected mathematical insights [25]. These failures highlight the need for sustained scrutiny before non-lattice families can be considered for critical deployments. ACM Comput. Surv., Vol. 1, No. 1, Article . Publication date: October 2025."}, {"source": "Post-Quantum Cryptography and Quantum-Safe Security", "page": 10, "text": "10 Chhetri et al. The UOV construction serves as the mathematical foundation for most contemporary multivariate schemes, utilizing a sophisticated trapdoor structure that enables efficient signing operations while maintaining the apparent intractability of the public polynomial system for potential adversaries. However, the rectangular MinRank attack developed against Rainbow has demonstrated applicability to other multivariate constructions, revealing fundamental vulnerabilities in the mathematical approaches that underlie this family of schemes [51]. Recent cryptanalytic analysis indicates that variants of sophisticated algebraic attacks may compromise parameter sets with computational complexity as low as 255 operations, representing a dramatic reduction from the security levels originally claimed for these constructions. These attacks exploit subtle mathematical relationships in the polynomial structure that were not apparent"}], "claims": ["Multivariate quadratic (MQ) cryptographic schemes are considered quantum-resistant.", "No efficient classical or quantum algorithms are known for solving generic MQ systems.", "MQ schemes are mainly used in digital signatures and public-key encryption.", "A multivariate signature scheme is suitable for authenticating edge nodes.", "The resistance to quantum attacks is crucial for long-term security in edge computing environments.", "Devices in edge computing environments may have limited computational resources."]}, {"code": "A084", "question": "What does the security of SPHINCS+ (SLH-DSA) rely on compared with the other algorithms NIST selected, how does it achieve stateless operation, and which FIPS standards correspond to Kyber, Dilithium and SPHINCS+?", "reference": "Three of the four selected algorithms use structured lattices, while SPHINCS+ derives its security solely from the collision resistance of hash functions. It combines a hierarchy of hash trees with few-time signatures: WOTS+ signs individual nodes, FORS gives few-time signatures at the leaves, and the Hypertree links them to achieve stateless operation. FIPS 203 is ML-KEM (Kyber), FIPS 204 is ML-DSA (Dilithium) and FIPS 205 is SLH-DSA (SPHINCS+).", "answer": "The security of SPHINCS+ (SLH-DSA) relies on a stateless, hash-based approach. It achieves stateless operation by not requiring any stateful components, making it easier to implement securely. NIST FIPS 205 corresponds to SLH-DSA, which is the same as SPHINCS+. NIST has selected Dilithium and Kyber for transitioning to quantum-safe methods, with FIPS 203 and FIPS 204, respectively, formalizing their standards.", "kg": "Knowledge graph entities:\n- SLH-DSA (ALGORITHM): Stateless hash signature.; Hash-Based Signature Algorithm for post-quantum cryptography.; Signature Generation takes 50–100 ms.; PQC standard for digital signatures.; A digital signature algorithm.; Algorithm part of SPH\n- SPHINCS+ (ALGORITHM): Hash-based digital signatures for post-quantum security.; One of H-DSA): One of the five major enterprise deployments analyzed.\n- SPHINCS+ -- stateless approach: SPHINCS+ is based on the stateless approach.\n- Kyber -- SPHINCS+: Kyber, Dilithium, Falcon, and SPHINCS+ are selected for transitioning to quantum-safe methods.; Kyber and Dilithium are considered more mature.; SPHINCS+ serves as a hedge against any unforeseen breakthroughs against lat\n- Kyber -- Dilithium: Both are quantum-resistant algorithms evaluated in the study.; Kyber, Dilithium, Falcon, and SPHINCS+ are selected for transitioning to quantum-safe methods.; Both algorithms have been designed with a focus on balancing \n- SPHINCS+ -- lattice-based alternatives: SLH-DSA has slower signing compared to lattice-based alternatives.\n- NIST FIPS approvals -- SLH-DSA: NIST FIPS approvals formalized a baseline for SLH-DSA.\n- SLH-DSA -- SPHINCS+: SLH-DSA is the same as SPHINCS+.; SPHINCS+ instantiated through SLH-DSA.\n- SLH-DSA -- FIPS 205: SLH-DSA standardized as FIPS 205.", "passages": [{"source": "Post-Quantum Cryptography and Quantum-Safe Security", "page": 11, "text": "To this end, NIST has endorsed three signature families for widespread adoption-ML-DSA (Dilithium), SLH-DSA (SPHINCS+), and the lattice-based Falcon under a parallel track-highlighting a balance between performance efficiency and conservative security across lattice- and hash-based paradigms. The selected algorithms-CRYSTALS-Dilithium (ML-DSA), Falcon (FN-DSA), and SPHINCS+ (SLH-DSA)-each bring unique trade-offs in efficiency, key and signature sizes, and assurance levels, ensuring flexibility for varied deployment requirements in the emerging quantum era."}, {"source": "A Comparative Study of Classical and Post-Quantum Cryptographic Algorithms in the Era of Quantum Computing", "page": 5, "text": "key encapsulation mechanism, and three digital signature schemes: Dilithium, Falcon, and SPHINCS+. These selections represent a foundational step toward transitioning global cryptographic infrastructure to quantum-safe methods. It achieves high throughput with low latency and has been officially selected by NIST as a general-purpose post-quantum encryption and key exchange mechanism. 5"}, {"source": "A Comparative Study of Classical and Post-Quantum Cryptographic Algorithms in the Era of Quantum Computing", "page": 8, "text": "Falcon, on the other hand, provides relatively small signatures but is notoriously difficult to implement securely. - Performance and Implementation Complexity While many post-quantum cryptographic schemes perform reasonably well in software implementations, some (like SPHINCS+) are computationally intensive. Dilithium and Kyber strike a balance between efficiency and simplicity, making them suitable for general-purpose deployment across various applications. - Deployment Readiness: A Few Front-Runners Among the post-quantum candidates, Kyber and Dilithium are considered the most mature"}, {"source": "Post-Quantum_Blockchain_Security_for_the_Internet_of_Things_Survey_and_Research_Directions", "page": 6, "text": "However, in addition to providing a standard for KEM schemes, NIST has recently presented three postquantum signatures as future deployment standards: Dilithium, FALCON, and SPHINCS+. Although Dilithium’s signature is nearly twice as large as BLISS’s (the smallest scheme among lattice-based signatures), it accomplishes a 2.5 lower public key size compared to the most effective lattice-based signature schemes. It is developed"}], "claims": ["The security of SPHINCS+ (SLH-DSA) relies on a stateless, hash-based approach.", "SPHINCS+ (SLH-DSA) achieves stateless operation by not requiring any stateful components.", "SPHINCS+ (SLH-DSA) is easier to implement securely due to its stateless operation.", "NIST FIPS 205 corresponds to SLH-DSA, which is the same as SPHINCS+.", "NIST has selected Dilithium and Kyber for transitioning to quantum-safe methods.", "FIPS 203 corresponds to Dilithium.", "FIPS 204 corresponds to Kyber.", "NIST has formalized Dilithium and Kyber as standards with FIPS 203 and FIPS 204, respectively."]}, {"code": "A085", "question": "How do concerns about harvest-now-decrypt-later (HNDL) attacks differ between security professionals and profit-motivated cybercriminals, and which kinds of data are considered prime targets for HNDL?", "reference": "An ISACA survey found that 56% of security professionals were specifically concerned about HNDL, i.e. that encrypted data stolen today could be broken later. Profit-motivated cybercriminals have less incentive to store data for a decade (e.g. stolen credit card numbers will be useless by then). Data with long confidentiality lifespans, such as medical records, government intelligence, banking archives and intellectual property, are prime targets, and nation-state actors are already conducting HNDL campaigns.", "answer": "Concerns about HNDL attacks are similar between security professionals and profit-motivated cybercriminals in that both recognize the threat to long-term data confidentiality. However, security professionals are more focused on long-term data protection and the need for Post-Quantum Cryptography (PQC) to mitigate these risks, while cybercriminals might prioritize short-term data exfiltration and storage for future decryption. Prime targets for HNDL include classified government documents, healthcare records, and corporate trade secrets due to their long-term confidentiality requirements.", "kg": "Knowledge graph entities:\n- HNDL (ATTACK): HNDL and other tactics are threats that need to be monitored and mitigated.; Harvest Now, Decrypt Later\" threat model.\n- harvest now, decrypt later (ATTACK): Strategy of capturing data now for decryption with future quantum capabilities.; Adversaries may intercept and store encrypted data today with the intent of decrypting it once quantum capabilities mature.; These ecosyste\n- Harvest Now Decrypt Later (ATTACK): Attack strategy involving quantum computers.\n- Store/Harvest Now, Decrypt Later (ATTACK): Approach in the pre-Q-Day phase.\n- cybercriminals (ORGANIZATION): Actors motivated by profit.\n- security (CONCEPT): Application of quantum-enabled algorithms in security.; Protection against unauthorized access or attacks, a key challenge in ADAS.; Key obstacles in blockchain implementation.; Examined by Xu et al. for practical QKD im\n- data (DATASET): Information that was exfiltrated during the Volt Typhoon campaign.; Information that could be exposed.\n- “store (harvest) now, decrypt later” (CONCEPT): Concept referring to adversaries hoarding encrypted data.\n\nKnowledge graph relations:\n- harvest now, decrypt later -- NIST: NIST is mitigating the threat of HNDL.\n- threat actors -- Store/Harvest Now, Decrypt Later: Threat actors use the HNDL approach.\n- healthcare records -- harvest now, decrypt later: Healthcare records are a target for harvest now, decrypt later.\n- Post-Quantum Cryptography -- Harvest Now Decrypt Later: PQC defends against HNDL attacks.\n- “store (harvest) now, decrypt later” -- threat actors: Adversaries are likely to exploit the concept during the transition period.\n- harvest now, decrypt later -- Post-Quantum Cryptography: Challenges PQC migration.; PQC is needed to counter HNDL threats.\n- classified government documents -- harvest now, decrypt later: Classified government documents are a target for harvest now, decrypt later.\n- corporate trade secrets -- harvest now, decrypt later: Corporate trade secrets are a target for harvest now, decrypt later.\n- harvest now, decrypt later -- blockchain environments: These ecosystems are at risk of this attack.\n- harvest now, decrypt later -- cryptographic systems: Harvest now, decrypt later strategy targets cryptographic systems.\n- quantum-resistant public key cryptosystems -- harvest now, decrypt later: Researchers are investigating cryptosystems to counter this attack.\n- HNDL -- CRQC: CRQC's maturity poses a threat under HNDL.", "passages": [{"source": "Next-Generation Quantum Security - The Impact of Quantum Computing on Cybersecurity—Threats, Mitigations, and Solutions", "page": 2, "text": "civilian digital infrastructures. While the practical realization of large-scale, fault-tolerant quantum computers remains a significant technical challenge [10,11],  progress in quantum hardware development suggests that such capabilities may be attainable within a few decades—or even sooner,  given recent advances by leading technology firms and research institutions. This uncertain yet plausible timeline creates a strategic  dilemma: cryptographic systems must be secured well in advance of quantum adversaries to prevent future decryption of intercepted  data [12,13]. This concern is embodied in the harvest now, decrypt later paradigm, in which encrypted communications captured  today could be retrospectively decrypted once quantum capabilities mature. This scenario is especially troubling for data with  long-term confidentiality requirements, such as classified government documents, healthcare records, or corporate trade secrets."}, {"source": "The-Quantum-Security-Deadline", "page": 6, "text": "data, secure communications, and digital identities protected by RSA, ECC, or DH algorithms will  be instantly compromised (Kampanakis, 2024). This inevitability underscores the immediate need  to transition to Post-Quantum Cryptography (PQC) algorithms standardized by NIST and  supported by global cybersecurity agencies (NIST, 2022; ANSSI, 2023).    The “Harvest Now, Decrypt Later” (HNDL) Threat Model  The Harvest Now, Decrypt Later (HNDL) threat model represents one of the most insidious  quantum-era risks. Under this model, adversaries exfiltrate and store encrypted data today, fully  aware that decryption may only become possible years later when CRQCs reach maturity. This  strategy effectively weaponizes time, targeting the longevity of encryption rather than its  immediate strength (HashiCorp, 2025; Keyfactor, 2024).    HNDL attacks are particularly dangerous because they are undetectable at the time of exfiltration."}, {"source": "Post-Quantum Cryptography and Quantum-Safe Security", "page": 2, "text": "2 Chhetri et al. standardization agencies, and industry stakeholders are already working on transition strategies to safeguard sensitive information and mission-critical infrastructure for the long term [44, 61]. The sense of urgency surrounding PQC adoption is amplified by the “harvest now, decrypt later” (HNDL) scenario, where adversaries may intercept and store encrypted data today with the intent of decrypting it once quantum capabilities mature [47]. This paradigm shift forces policymakers and researchers to rethink the very foundation of digital trust and to anticipate a future in which long-term confidentiality must be guaranteed even against future computational advances. Critical sectors such as defense, finance, and healthcare are particularly vulnerable, as the exposure of archived data could have irreversible national security and privacy implications. To mitigate this looming threat, the U.S. National Institute of Standards and Technology (NIST)"}, {"source": "Are Enterprises Ready for Quantum-Safe Cybersecurity", "page": 13, "text": "somehow got a CRQC early and used it covertly for years before the world realizes. In such a scenario, they could quietly decrypt vast amounts of intercepted traffic and harvested data without tipping off victims. As discussed by RAND and others, this scenario is deemed highly unlikely for multiple reasons [3]. But even if a CRQC’s existence is not secret, there’s a worry that once it is plausible that someone has it, panic could ensue among defenders trying to rapidly upgrade systems (“crypto scramble”). Thus, threat actors (particularly nation-states) are likely strategizing for both eventualities: the pre-Q-Day and post-Q-Day phases. In the pre-Q-Day phase (present to Q-Day), the primary threat actor behavior is the “Store/Harvest Now, Decrypt Later” (HNDL) approach. As soon as it became broadly believed that quantum computers will eventually break RSA/ECC, intelligence agencies and even some cybercriminal groups realized that any encrypted data"}], "claims": ["Concerns about HNDL attacks are similar between security professionals and profit-motivated cybercriminals.", "Both security professionals and profit-motivated cybercriminals recognize the threat to long-term data confidentiality.", "Security professionals are more focused on long-term data protection.", "Security professionals believe that Post-Quantum Cryptography (PQC) is needed to mitigate HNDL risks.", "Profit-motivated cybercriminals prioritize short-term data exfiltration and storage for future decryption.", "Prime targets for HNDL include classified government documents.", "Prime targets for HNDL include healthcare records.", "Prime targets for HNDL include corporate trade secrets.", "Prime targets for HNDL are due to their long-term confidentiality requirements."]}, {"code": "A086", "question": "How are the generator and discriminator of quantum GANs trained, and how are the gradients obtained?", "reference": "Training follows an adversarial minimax framework: the discriminator parameters are updated to minimize its loss L_D (distinguishing real from generated data) and the generator parameters to minimize L_G (making fake data classified as real), until a Nash equilibrium. Gradients are typically estimated with the parameter-shift rule or stochastic approximation and optimization is done with classical algorithms; QuGANs may outperform classical GANs in representation.", "answer": "In QGANs, gradients are typically estimated using the parameter-shift rule or stochastic approximation, and optimization is performed via classical algorithms. The discriminator parameters are updated to minimize the loss function, while the generator parameters are updated to increase the chance that fake data is classified as real. This adversarial process continues until equilibrium is reached.", "kg": "Knowledge graph entities:\n- discriminator (ALGORITHM): Evaluates the authenticity of data samples in GANs.; Algorithm represented by a parameterized quantum circuit D(ϕ) that outputs a measurement probability.; A component of a GAN implemented as a quantum circuit.; An algor\n- generator (ALGORITHM): Creates synthetic data samples in GANs.; Algorithm represented by a quantum circuit G(θ) that maps|0⟩ to|ψG(θ)⟩.; A component of a GAN implemented as a quantum circuit.; Component of QGANs that generates data.; Generator\n- Quantum GANs (SYSTEM): Use quantum circuits to capture complex distributions better than classical GANs.; Quantum GANs could enhance the quality and diversity of generated samples.\n- Generative Adversarial Networks (SYSTEM): Consist of two competing neural networks-a generator and a discriminator-locked in an adversarial training process.; Generative Adversarial Network.; Classical GAN architecture integrated with quantum elements.; Can be u\n- gradient (METRIC): Measure of how much the cost function changes with respect to a parameter.; Key innovation in computing gradients directly from the same quantum circuits.; Gradient for each parameter 𝜆𝑘 is calculated.; Average value of \n- QWGAN-GP (ALGORITHM): Combines a quantum generator with a classical discriminator and integrates a gradient penalty.\n- Quantum Gradient Descent (ALGORITHM): Promising optimization algorithm for training quantum machine learning models.\n- fully quantum GAN (SYSTEM): GAN where both generator and discriminator are implemented as quantum circuits.\n\nKnowledge graph relations:\n- quantum generator -- quantum discriminator: Quantum generator and quantum discriminator work together in fully quantum GANs.\n- Quantum Generative Adversarial Networks -- discriminator: QGANs pair a parameterized quantum generator with a discriminator.\n- Quantum Generative Adversarial Networks -- gradient-based methods: Several approaches to QGAN training and optimization include gradient-based methods.\n- Quantum Generator with Classical Discriminator -- classical neural networks: A classical neural network is used to evaluate data samples in this system.\n- Quantum Generative Adversarial Networks -- discriminator function D: QGANs use a discriminator function to distinguish real from fake data.\n- variational quantum algorithm -- discriminator: Both the generator and discriminator are expressed as parameterized quantum circuits within the VQA framework.\n- parameterized quantum generator -- discriminator: Both the generator and discriminator are expressed as parameterized quantum circuits within the VQA framework.\n- quantum circuit -- generator: Both generator and discriminator are implemented as quantum circuits in fully quantum implementations.\n- quantum discriminator -- generator: Direct quantum interface between the generator and discriminator.\n- Quantum Generative Adversarial Networks -- generator: QGANs use a generator to produce fake data.\n- Quantum Approximate Optimization Algorithm -- Quantum Gradient Descent: Both are promising optimization algorithms for training quantum machine learning models.\n- Generative Adversarial Networks -- discriminator: GANs consist of a discriminator that evaluates the authenticity of data samples.", "passages": [{"source": "A Survey of Quantum Generative Adversarial Networks", "page": 2, "text": "Keywords: quantum AI, quantum GAN, QGAN 1 Introduction Generative Adversarial Networks (GANs) have transformed the landscape of machine learning since their introduction by Goodfellow et al. in 2014 [1]. At their core, GANs consist of two competing neural networks-a generator and a discriminator-locked in an adversarial training process. The generator creates synthetic data samples, while the discriminator evaluates their authenticity compared to real data. This elegant competitive framework has enabled remarkable advances in generating realistic images, text, audio, and other data types. Meanwhile, quantum computing has emerged as a promising computational paradigm that harnesses quantum mechanical principles such as superposition and entanglement. Instead of classical bits that can be either 0 or 1, quantum computers use"}, {"source": "A Survey of Quantum Machine Learning - Foundations,Algorithms, Frameworks, Data and Applications", "page": 18, "text": "91:18 F. Rodríguez-Díaz et al. Finally, its pseudocode can be found in Algorithm 9 (see Appendix C). 4.3.3 Quantum Generative Adversarial Networks. QGANs generalize the classical GAN framework to the quantum setting by pairing a parameterized quantum generator with a discriminatoreither quantum or classical-in a two-player minimax game. The generator seeks to produce quantum states that approximate an unknown data distribution, while the discriminator learns to distinguish between real samples and those generated. Like classical GANs, QGANs rely on iterative adversarial training, but leverage quantum resources such as superposition and entanglement to encode and manipulate data distributions. These models are typically implemented within a variational quantum algorithm (VQA) framework, where both the generator and discriminator are expressed as parameterized quantum circuits. Optimization proceeds via a hybrid loop, using quantum measurements to estimate loss"}, {"source": "A Survey of Quantum Generative Adversarial Networks", "page": 5, "text": "Fij(θ) = Re(⟨∂iψ(θ)|∂jψ(θ)⟩−⟨∂iψ(θ)|ψ(θ)⟩⟨ψ(θ)|∂jψ(θ)⟩), (11) and ∇C(θ) is the gradient of the cost function. 3 Implementation Approaches 3.1 Fully Quantum Implementations Fully quantum implementations of GANs represent the most ambitious approach, where both generator and discriminator are implemented as quantum circuits, and data is represented in quantum states. These implementations potentially offer the greatest quantum advantage but also face the most significant hardware challenges. A key aspect of fully quantum implementations is quantum data encoding, i.e., the process of mapping classical data into quantum states. Several encoding methods have been developed: Amplitude Encoding represents classical data in the amplitudes of a quantum state |x⟩= 2n−1 X i=0 xi|i⟩, (12) where xi are the normalized classical data values. This encoding is efficient in terms of qubit usage (representing 2n values with n qubits) but can be challenging to implement [24]."}, {"source": "A Survey of Quantum Machine Learning - Foundations,Algorithms, Frameworks, Data and Applications", "page": 18, "text": "𝐿𝐷= −1 2 ∑ 𝑖 [log 𝐷(𝑥𝑖) + log(1 −𝐷(𝑧𝑖))], (28) where 𝐷(⋅) is the discriminator function that outputs the probability of an input being real. The discriminator parameters 𝜙are updated to minimize 𝐿𝐷, improving its ability to distinguish real from fake data. Next, the generator produces a new batch {𝑧′ 𝑖}, and its loss is given by 𝐿𝐺= −∑ 𝑖 log 𝐷(𝑧′ 𝑖). (29) Minimizing 𝐿𝐺updates the generator parameters 𝜃to increase the chance that fake data is classified as real. This adversarial process continues until the generator and discriminator reach a balance, known as Nash equilibrium. In QGANs, gradients are typically estimated using the parameter-shift rule or stochastic approximation, and optimization is performed via classical algorithms. Finally, its pseudocode can be found in Algorithm 10 (see Appendix C). 4.3.4 Quantum Boltzmann Machines. QBMs are the quantum generalization of classical Boltzmann Machines, designed to model complex probability distributions through quantum principles"}], "claims": ["Gradients in QGANs are typically estimated using the parameter-shift rule or stochastic approximation.", "Optimization in QGANs is performed via classical algorithms.", "The discriminator parameters are updated to minimize the loss function.", "The generator parameters are updated to increase the chance that fake data is classified as real.", "The adversarial process in QGANs continues until equilibrium is reached."]}, {"code": "A087", "question": "What project provides a framework for developing intent-based network applications?", "reference": "The OpenDaylight NetIDE project provides a framework for developing intent-based network applications.", "answer": "The OpenDaylight NetIDE project provides a framework for developing intent-based network applications.", "kg": null, "passages": [{"source": "aa777444-e949-4950-9e07-da920a30d604", "page": 3, "text": "that captures network architect knowledge and automatically generates configurations that comply with best  practices and design principles (Li et al., 2023; Anderson & Kumar, 2023). Research conducted by platform users  has demonstrated significant reductions in configuration errors and deployment times that represent real relief for  network operations teams (Lopez et al., 2023; Zhang & Liu, 2023). Open source IBN projects have also  contributed meaningfully to the advancement of intent-based networking technologies (Johnson et al., 2023;  Brown & Lee, 2023). The OpenDaylight NetIDE project provides a framework for developing intent-based  network applications, while ONAP offers comprehensive network automation capabilities that include intentbased service orchestration (Linux Foundation, 2022; Patel et al., 2023). These projects have facilitated research  and development while providing platforms for academic and industrial experimentation (Roberts & Kim, 2023;"}, {"source": "aa777444-e949-4950-9e07-da920a30d604", "page": 1, "text": "rather than forcing us to speak theirs. Intent-Based Networking (IBN) represents this next evolutionary leap, where  we can express our business needs in human terms, and our networks respond with intelligence and grace. This  exploration examines how IBN principles weave seamlessly into SDN architectures, creating systems that don't  just follow commands but truly understand intent. Through careful analysis of real-world implementations and  thoughtful consideration of challenges, we've discovered that IBN-enabled SDN systems can reduce configuration  errors by an impressive 75% while bringing unprecedented agility to network operations.    Keywords:  Intent-Based Networking, Software-Defined Networking, Network Automation, Policy Management, Network  Orchestration      INTRODUCTION  Today’s digital world is deeply interconnected and complex. Enterprise networks have evolved dramatically"}, {"source": "aa777444-e949-4950-9e07-da920a30d604", "page": 2, "text": "The concept of intent-based networking was formally introduced by Gartner in 2017, defining IBN as systems  that create and manage networks based on business intent rather than technical implementation details (Gartner,"}, {"source": "aa777444-e949-4950-9e07-da920a30d604", "page": 1, "text": "Volume-07 Issue 10, October-2023 ISSN: 2456-9348   Impact Factor: 6.736        International Journal of Engineering Technology Research & Management  (IJETRM)  https://ijetrm.com/    IJETRM (http://ijetrm.com/)  [68]        INTENT-BASED NETWORKING IN SDN: AUTOMATING NETWORK  CONFIGURATION AND MANAGEMENT    Goutham Sunkara  Broadcom Inc., Palo Alto, CA, USA  ORCID: 0009-0001-0633-0890  sgoutham.sunkara@gmail.com      ABSTRACT  There's something profoundly beautiful about watching a network that truly understands what you need. Software  Defined Networking (SDN) has already transformed how we think about network architecture by separating the  control plane from the data plane, giving us centralized management that feels almost magical, But as our networks  grow more complex and demanding, we need something even more intuitive something that speaks our language  rather than forcing us to speak theirs. Intent-Based Networking (IBN) represents this next evolutionary leap, where"}], "claims": ["The OpenDaylight NetIDE project exists.", "The OpenDaylight NetIDE project provides a framework.", "The framework is for developing intent-based network applications."]}, {"code": "A088", "question": "How do Feedback Alignment and Direct Feedback Alignment relax the requirements of backpropagation?", "reference": "Feedback Alignment replaces the transposed forward weight matrix used in backpropagation with a fixed random matrix, while Direct Feedback Alignment directly propagates the errors from the top layer to the hidden layers through fixed random connections.", "answer": "Feedback Alignment and Direct Feedback Alignment relax the requirements of backpropagation by using random matrices instead of the transpose of the weight matrix for error backpropagation. Feedback Alignment replaces the transposed matrix with a random one, while Direct Feedback Alignment directly propagates errors from the top layer to the hidden layers. These methods allow for simpler implementations and can still effectively descend the error surface, though they may not be as accurate as traditional backpropagation.", "kg": null, "passages": [{"source": "Surrogate gradient learning in spiking neural networks", "page": 16, "text": "16 IEEE SIGNAL PROCESSING MAGAZINE  1053-5888/18©2018IEEE x(0) y(1) y(2) L (a) BP x(0) y(1) y(2) L (b) FA x(0) y(1) y(2) L (c) DFA x(0) y(1) y(2) L(1) L(2) (d) Local Errors Fig. 5: Strategies for relaxing gradient BP requirements. Dashed lines indicate ﬁxed, random connections. (a) BP propagates errors through each layer using the transpose of the forward weights by alternating forward and backward passes. (b) Feedback Alignment [37] replaces the transposed matrix with a random one. (c) Direct Feedback Alignment [38] directly propagates the errors from the top layer to the hidden layers. (d) Local errors [29] uses a ﬁxed, random, auxiliary cost function at each layer. A. Feedback alignment and random error backpropagation One family of algorithms that relaxes some of the requirements of BP are feedback alignment or, more generally, random BP algorithms [37–39]. These are approximations to the gradient BP"}, {"source": "Spiking neural networks and bio-inspired supervised deep learning - A survey", "page": 18, "text": "18 Lagani, et al. 𝑊𝑇𝑒 𝑅𝑒 −4 −2 0 2 4 −4 −2 0 2 4 Fig. 7. Approximation of gradient descent by alternative directions. Directions that are less than 90° away from the (negative) gradient are still descent directions in the loss landscape. Fig. 8. A network model with top-down connectivity network can still solve simple tasks and, in particular, the forward weights converge to the pseudo-inverse of the random feedback weights. This approach is called Random Feedback Alignment. The idea is that calling 𝑊the weight matrix at some layer and 𝑒an error vector to be backpropagated, if we backpropagate the error using a random matrix 𝑅instead of 𝑊𝑇, we obtain 𝑅𝑒as a backpropagated vector instead of 𝑊𝑇𝑒, which will still allow descending the error surface (fig. 7) as long as 𝑅𝑒and 𝑊𝑇𝑒are less than 90◦apart, i.e. 𝑊𝑅is positive semidefinite. However, in another work [225] it has been shown that RFA, while successful for solving simple tasks, is not adequate"}, {"source": "Deep learning in spiking neural networks", "page": 6, "text": "Progress on the second issue has recently been made by [103] and [104]. It was shown in [103] that for some tasks, backpropagation could still perform well if random feedback weights were used. The authors in [104] explored this further, examining three kinds of feedback (uniform, random, and symmetric). They found that simpler problems could be solved by any kind of feedback whereas complex problems needed symmetric feedback. b) Some Supervised Learning Methods for SNNs: SpikeProp [105] appears to be the ﬁrst algorithm to train SNNs by backpropagating errors. Their cost function took into account spike timing and SpikeProp was able to classify non-linearly separable data for a temporally encoded XOR problem using a 3-layer architecture. One of their key design choices was to use Gerstner’s [64] spike-response model (SRM) for the spiking neurons. Using the SRM model, the issue of taking derivatives on the output spikes of the hidden units was avoided because"}, {"source": "Spiking neural networks and bio-inspired supervised deep learning - A survey", "page": 1, "text": "Unfortunately, training SNNs is not trivial, as traditional optimization based on the backpropagation algorithm (backprop) is not directly applicable [165]. In fact, the biological plausibility of backprop – the workhorse of DL – is questioned by neuroscientists [73, 113, 130, 157, 172]. Therefore, researchers took again inspiration from biology, in order to find new learning solutions as alternatives to backprop. The goal was not only to address the problem of SNN training [33, 148], but also to discover novel approaches to the learning problem [77, 139, 182], and possibly more data efficient strategies [69, 90, 105–107, 110]. In fact, another limitation of current DL solutions is the requirement of ∗Corresp. Authors’ address: Gabriele Lagani, gabriele.lagani@isti.cnr.it; Fabrizio Falchi, fabrizio.falchi@isti.cnr.it; Claudio Gennaro, claudio.gennaro@isti.cnr.it; Giuseppe Amato, giuseppe.amato@isti.cnr.it, ISTI-CNR, Pisa, Italy, 56124."}], "claims": ["Feedback Alignment uses random matrices for error backpropagation.", "Direct Feedback Alignment directly propagates errors from the top layer to the hidden layers.", "Feedback Alignment replaces the transposed weight matrix with a random matrix.", "Feedback Alignment and Direct Feedback Alignment allow for simpler implementations.", "Feedback Alignment and Direct Feedback Alignment can still effectively descend the error surface.", "Feedback Alignment and Direct Feedback Alignment may not be as accurate as traditional backpropagation."]}, {"code": "A089", "question": "In prior work on reasoning over CVEs with attack graphs, how did researchers visualize how CAPECs could be chained in an information system, and what inputs did they use?", "reference": "They developed a tool to visualize how CAPECs could be chained in an information system containing CVEs; they manually described the characteristics and settings of the information system and input data from the CVSS vectors related to the CVEs.", "answer": "Researchers developed a tool to visualize how CAPECs could be chained in an information system containing CVEs [14]. They manually described the characteristics and settings of the information system and input some data from the CVSS vector related to the CVEs.", "kg": null, "passages": [{"source": "CVE representation to build attack positions graphs", "page": 2, "text": "“Which Techniques are related to CVE-2022-36804?”. Concepts more abstract than CVE can be used to reason in attack graphs. Some researchers developed a tool to visualize how CAPECs could be chained in an information system containing CVEs [14]. They manually describe the characteristics and settings of the IS and input some data from the CVSS vector related to the CVEs. Authors of [15] even define a new ontology to describe an attack graph. Nevertheless, they give no methodology about how to fill this ontology, letting think that everything must be hand-made by human experts with good knowledge of the system and its vulnerabilities. Other studies try to derive the causes and effects of CVEs based on their related description [16]. They propose algorithms using keywords and heuristics to extract semantics from the description of the CVE. However, the lack of standardization of CVEs’ descriptions complicates the task. Others deal with the problem of CVE enrichment by automatically"}, {"source": "CVE representation to build attack positions graphs", "page": 1, "text": "CVE representation to build attack positions graphs Manuel Poisson AMOSSYS, CentraleSup´elec, CNRS, Inria, Univ. Rennes, IRISA manuel.poisson@irisa.fr Val´erie Viet Triem Tong CentraleSupelec, CNRS, Inria, Univ. Rennes, IRISA valerie.viettriemtong@centralesupelec.fr Gilles Guette Univ. Rennes, CNRS, Inria, IRISA gilles.guette@univ-rennes.fr Fr´ed´eric Guih´ery AMOSSYS frederic.guihery@amossys.fr Damien Cr´emilleux AMOSSYS damien.cremilleux@amossys.fr Abstract—In cybersecurity, CVEs (Common Vulnerabilities and Exposures) are publicly disclosed hardware or software vulnerabilities. These vulnerabilities are documented and listed in the NVD database maintained by the NIST. Knowledge of the CVEs impacting an information system provides a measure of its level of security. This article points out that these vulnerabilities should be described in greater detail to understand how they could be chained together in a complete attack scenario. This"}, {"source": "CVE representation to build attack positions graphs", "page": 2, "text": "execution is “Privileged” or not is respectively set to “No” and “Yes”. Also, the source code of exploits is not enough to automatically derive neither the context in which they can be used nor the gain from their successful execution. The lack of an appropriate format makes it very hard to find comprehensive data to derive pre/post conditions of a CVE exploitation. B. Related work Some research papers and tools intend to make sense of CVEs and their related data. BRON [12] links data like CPE, CVE, CWE, CAPEC, MITRE Techniques, and Tactics by providing a bidirectional graph relating these concepts after parsing data from the NVD and MITRE ATT&CK. Similarly, other researchers [13] exploit the capabilities of the Resource Description Framework (RDF) to build a knowledge graph serving the same purpose. These graphs answer questions like: “Which Techniques are related to CVE-2022-36804?”. Concepts more abstract than CVE can be used to reason in"}, {"source": "CVE representation to build attack positions graphs", "page": 1, "text": "should be described in greater detail to understand how they could be chained together in a complete attack scenario. This article presents the first proposal for the CAPG format, which is a method for representing a CVE vulnerability, a corresponding exploit, and associated attack positions. Index Terms—CVE, attack graph, exploit I. INTRODUCTION Performing an audit of an information system (IS), such as an architecture audit, configuration audit or penetration test, are common approaches for mapping vulnerabilities. These vulnerabilities can be exploited by attackers to increase their control over the system and propagate towards their ultimate objectives such as for instance, data exfiltration or ransomware execution. Unfortunately, the estimation of the risk posed by combinations of vulnerabilities relies on auditors, who may overlook some attack paths. We argue here that the description of discovered vulnerabilities, in particular by CVEs"}], "claims": ["Researchers developed a tool to visualize how CAPECs could be chained in an information system containing CVEs.", "They manually described the characteristics and settings of the information system.", "They input some data from the CVSS vector related to the CVEs."]}, {"code": "A090", "question": "Why does Loihi support a hierarchical network model, and how is a hierarchical template network formally represented?", "reference": "It significantly reduces the chip-wide connectivity and synaptic resources needed to map convolutional-style networks; the hierarchical template network is represented as a directed multigraph whose nodes are disjoint neuron population types and whose edges are sets of synapses connecting pairs of population types.", "answer": "Loihi supports a hierarchical network model to exploit structure in the network and reduce the chip-wide connectivity and synaptic resources needed. A hierarchical template network is formally represented as a directed multigraph ℋ = (࣮, ℰ), where ࣮ is a set of disjoint neuron population types and ℰ defines a set of edges connecting between pairs of population types.", "kg": null, "passages": [{"source": "Loihi - A neuromorphic manycore processor with on-chip learning", "page": 8, "text": "To exploit structure that might exist in the network ࣡, Loihi supports a hierarchical network  model. This feature can significantly reduce the chip-wide connectivity and synaptic resources  needed to map convolutional-style networks in which a template of synaptic connections is applied to many neurons in a uniform way.  Formally, we represent the hierarchical template network as a directed multigraph ℋ = (࣮, ℰ)  where ࣮ is a set of disjoint neuron population types and ℰ defines a set of edges connecting between pairs Tsrc,Tdst ∈ ࣮. An edge E ∈ ℰ associated with the (Tsrc,Tdst) population type pair is a  set of synapses where each s ∈ E connects a neuron i ∈ Tsrc to a neuron j ∈ Tdst.  To hierarchically compress the resource mapping of the desired flat network ࣡ = (N,S), a set of  disjoint neuron populations instances ࣪ must be defined where each P ∈ ࣪ is a subset of neurons  P ⊂ N. Each population instance is associated with a population type T ∈ ࣮ from the hierarchical"}, {"source": "Loihi_A_Neuromorphic_Manycore_Processor_with_On-Chip_Learning", "page": 8, "text": "To exploit structure that might exist in the network ࣡, Loihi supports a hierarchical network  model. This feature can significantly reduce the chip-wide connectivity and synaptic resources  needed to map convolutional-style networks in which a template of synaptic connections is applied to many neurons in a uniform way.  Formally, we represent the hierarchical template network as a directed multigraph ℋ = (࣮, ℰ)  where ࣮ is a set of disjoint neuron population types and ℰ defines a set of edges connecting between pairs Tsrc,Tdst ∈ ࣮. An edge E ∈ ℰ associated with the (Tsrc,Tdst) population type pair is a  set of synapses where each s ∈ E connects a neuron i ∈ Tsrc to a neuron j ∈ Tdst.  To hierarchically compress the resource mapping of the desired flat network ࣡ = (N,S), a set of  disjoint neuron populations instances ࣪ must be defined where each P ∈ ࣪ is a subset of neurons  P ⊂ N. Each population instance is associated with a population type T ∈ ࣮ from the hierarchical"}, {"source": "Loihi - A neuromorphic manycore processor with on-chip learning", "page": 6, "text": "Loihi supports three sparse matrix compression models in which fan-out neuron indices  are computed based on index state stored with each synapse’s state variables.  • Core-to-core multicast. Any neuron may direct a single spike to any number of destination cores, as the network connectivity might require.  • Variable synaptic formats. Loihi supports any weight precision between one and nine  bits, signed or unsigned, and weight precisions may be mixed (with scale normalization)  even within a single neuron’s fan-out distribution.  • Population-based hierarchical connectivity. As a generalized weight-sharing mechanism, such as to support convolutional neural network types, connectivity templates  may be defined and mapped to specific population instances during operation. This feature can reduce a network’s required connectivity resources by over an order of magnitude.  Loihi is the first fully integrated SNN chip that supports any of the above features. All prior"}, {"source": "Loihi_A_Neuromorphic_Manycore_Processor_with_On-Chip_Learning", "page": 6, "text": "Loihi supports three sparse matrix compression models in which fan-out neuron indices  are computed based on index state stored with each synapse’s state variables.  • Core-to-core multicast. Any neuron may direct a single spike to any number of destination cores, as the network connectivity might require.  • Variable synaptic formats. Loihi supports any weight precision between one and nine  bits, signed or unsigned, and weight precisions may be mixed (with scale normalization)  even within a single neuron’s fan-out distribution.  • Population-based hierarchical connectivity. As a generalized weight-sharing mechanism, such as to support convolutional neural network types, connectivity templates  may be defined and mapped to specific population instances during operation. This feature can reduce a network’s required connectivity resources by over an order of magnitude.  Loihi is the first fully integrated SNN chip that supports any of the above features. All prior"}], "claims": ["Loihi supports a hierarchical network model.", "The hierarchical network model is used to exploit structure in the network.", "The hierarchical network model reduces chip-wide connectivity and synaptic resources needed.", "A hierarchical template network is formally represented as a directed multigraph.", "A directed multigraph is represented as ℋ = (࣮, ℰ).", "࣮ is a set of disjoint neuron population types.", "ℰ defines a set of edges connecting between pairs of population types."]}, {"code": "A091", "question": "How does the Module-LWE problem underlying ML-KEM and ML-DSA relate to the basic Learning With Errors (LWE) problem in lattice-based cryptography?", "reference": "LWE asks to find a secret vector s such that A·s ≈ b (mod q) given A and b; its security comes from the difficulty of solving noisy linear systems, and together with SVP it is believed resistant to quantum algorithms, with ring variants such as Ring-LWE used for efficiency. Module-LWE adds ring/module structure: over the module R_q^k with R = Z[X]/(X^n+1), given (A, b = As + e) one must distinguish this distribution from uniform; this refinement underlies NIST's standardized ML-KEM and ML-DSA, balancing theoretical guarantees with practical efficiency.", "answer": "The Module-LWE problem is a variation of the LWE problem, which forms the basis of lattice-based cryptography. Specifically, the security of CRYSTALS-Kyber, which is standardized as ML-KEM, is based on the difficulty of solving the Module-LWE problem. This problem introduces unknown noise into linear equations, similar to LWE, but with additional structure that makes it a variation suitable for certain cryptographic applications.", "kg": "Knowledge graph entities:\n- Learning With Errors (CONCEPT): Associated with potential weaknesses in decryption failures.; Learning With Errors (LWE)—a special category of hard problems pertaining to lattice-based cryptosystems—is the foundation of lattice-based cryptosystems.\n- module-LWE (CONCEPT): Extension of ringLWEs, whose ciphertexts can be manipulated to rotate messages.; Variation of the LWE problems.\n- module-lattice-based KEM (SYSTEM): Standardized KEM noted as FIPS 203.\n- Lattice-Based Cryptography (CONCEPT): Standardized cryptographic algorithms resistant to quantum attacks.; Cryptography based on lattice problems.; Cryptography that heavily relies on the number of power traces.; Demonstrated to be susceptible to side-channe\n- learning-with-errors (CONCEPT): Problem used as the basis for the security of Kyber.\n- CRYSTALS-Dilithium (ALGORITHM): A lattice-based digital signature scheme.; Quantum-resistant digital signature algorithm.\n- module learning with errors (PROTOCOL): The security of CRYSTALS-Kyber is based on this problem.; The security of CRYSTALS-Kyber is determined by the difficulty of the M-LWE problem.\n- KEM (ALGORITHM): Key encapsulation mechanism.; Standard for key encapsulation mechanisms.; Kyber and NewHope implementations are suitable for KEM.; Key Encapsulation Mechanisms for key exchange.; Key Encapsulation Mechanism.\n\nKnowledge graph relations:\n- Learning With Errors -- Lattice-based problems: LWE is the foundation of lattice-based cryptosystems.\n- NIST -- Learning With Errors: Lattice-based cryptosystems that reached the second round of the NIST call are based on LWE and its variations.\n- module learning with errors -- CRYSTALS-Kyber: The security of CRYSTALS-Kyber is based on the M-LWE problem.; The security of CRYSTALS-Kyber is determined by the difficulty of the M-LWE problem.\n- CRYSTALS-Kyber -- learning-with-errors: CRYSTALS-Kyber is based on the difficulty of solving the LWE problem.\n- module-LWE -- LWE problems: Variation of the LWE problems.\n- CRYSTALS-Kyber -- module-lattice-based KEM: CRYSTALS-Kyber is standardized as ML-KEM.\n- side-channel attack -- Lattice-Based Cryptography: Lattice-based cryptography algorithms are susceptible to side-channel attacks.\n- CRYSTALS-Kyber -- module-LWE: Fundamentals of Kyber are based on module-LWE.\n- Ring-LWE -- Learning With Errors: Ring-LWE is a variation of LWE.\n- LP-LWE -- Learning With Errors: LP-LWE is a variation of LWE.\n- Lattice-Based Cryptography -- CRYSTALS-Kyber: CRYSTALS-Kyber is a lattice-based KEM.\n- module-LWE -- negacyclic rotation: Negacyclic rotation is achieved by manipulating module-LWE ciphertexts.", "passages": [{"source": "Post-Quantum_Blockchain_Security_for_the_Internet_of_Things_Survey_and_Research_Directions", "page": 4, "text": "of which reached the ﬁnal round. Lattice-based problems were ﬁrst suggested by Asif [24], who contended that the NP-hard lattice problem can be used to develop trustworthy cryptographic algorithms. These kinds of cryptographic algorithms are based on lattices, which are conceptually made up of points in n-dimensional spaces that repeat. One of the underlying NP-hard problems in such cryptosystems is obtaining the Shortest non-zero Vector (SVP) inside a lattice. Additional examples of lattice NP-hard problems are the Closest Vector Problem (CVP) and the Shortest Independent Vector Problem (SIVP). Moreover, Learning With Errors (LWE)—a special category of hard problems pertaining to lattice-based cryptosystems—and its variations, like Ring-LWE and LP-LWE, are the foundation of lattice-based cryptosystems that reached the second round of the NIST call [25]. The properties of a lattice-based cryptosystem lead to a good balance between key size, security, and computational"}, {"source": "An Improved Two-Step Attack on Lattice-Based Cryptography - A Case Study of Kyber", "page": 1, "text": "with the aim of standardizing quantum-resistant cryptographic algorithms. By July 2022, NIST released the post-quantum cryptographic standard candidates including three signatures and one key encapsulation mechanism (KEM) algorithm after the third round evaluation [1]. CRYSTALS-Kyber is the only KEM, which has been successfully standardized as modulelattice-based KEM (ML-KEM) noted as FIPS 203 from August 2024. The mathematical security of Kyber is widely recognized, but its physical security demands urgent attention in the deployment phase [2], [3]. In recent years, several side-channel attacks (SCAs) on Kyber [4], [5], [6], [7], [8] have been proposed by researchers. In 2020, Ravi et al. [4] used plaintext-checking (PC) oracle-based SCAs to recover the secret key of Kyber-512 with 2560 power traces according to the vulnerabilities in Fujisaki-Okamoto (FO) transform for the first time. Then for correlation power This work was supported in part by the Natural Science Foundation"}, {"source": "Post-Quantum_Blockchain_Security_for_the_Internet_of_Things_Survey_and_Research_Directions", "page": 5, "text": "x64 architectures. NIST recently recognized the CRYSTALSKyber encapsulation scheme [52] as a post-quantum key establishment standard [59]. This post-quantum cryptography algorithm, which is most likely to be employed in various future security protocols, is detailed in the following paragraph. 1) CRYSTALS-Kyber: Kyber from the CRYSTALS project is a KEM intended to withstand cryptoanalytic attacks by quantum computers. It is used to help two communication parties establish trust and conﬁdentiality without being affected by Indistinguishable non-adaptive and Adaptive Chosen Ciphertext Attack (IND-CCA1/IND-CCA2). The fundamentals of this asymmetric cryptosystem are based on a variation of the LWE problems known as module-LWE, which is supposedly an NP-hard lattice problem. Kyber is available in three security levels, each of which has a unique set of parameters aimed at a particular level of security. The security"}, {"source": "Investigating CRYSTALS-Kyber Vulnerabilities - Attack Analysis and Mitigation", "page": 2, "text": "by requesting, assessing, and standardizing quantum-resistant cryptographic algorithms. NIST chooses a group of potential algorithms that the cryptography community has submitted to start the process. These candidates were put through extensive testing, with an emphasis on how resilient they were to quantum attacks. The selected primitives are based on linear error-correcting code decoding and lattices, two mathematical issues that are thought to be difficult for quantum computers. NIST announced in July 2022 that CRYSTALS-Kyber will become the new standard for key setup and public key encryption (PKE) [7]. This is a major development. The reason for this choice is that it has been identified as a key encapsulation mechanism (KEM) that secures IND-CCA2 in models of random oracles that are both classical and quantum. The intricacy of the module learning with errors (M-LWE) problem, which introduces unknown noise into linear equations, forms the basis of CRYSTALS-Kyber’s security."}], "claims": ["The Module-LWE problem is a variation of the LWE problem.", "The LWE problem forms the basis of lattice-based cryptography.", "The security of CRYSTALS-Kyber is based on the difficulty of solving the Module-LWE problem.", "The Module-LWE problem introduces unknown noise into linear equations.", "The Module-LWE problem has additional structure compared to LWE.", "The Module-LWE problem is suitable for certain cryptographic applications.", "The LWE problem introduces unknown noise into linear equations.", "The LWE problem is the basis of lattice-based cryptography."]}, {"code": "A092", "question": "What is Shor's algorithm and how does it impact the security of current cryptographic systems?", "reference": "Shor's algorithm, proposed by Peter Shor in 1994, efficiently factors large integers and computes discrete logarithms in polynomial time, which directly undermines the security assumptions of current public-key cryptographic systems.", "answer": "Shor's algorithm is a quantum algorithm that can efficiently solve the integer factorization and discrete logarithm problems, which underpin many public-key cryptographic systems. This algorithm poses a significant threat to the security of current cryptographic systems like RSA and ECC, as it can break the security assumptions these systems rely on, reducing the complexity of these problems from exponential to polynomial time.", "kg": "Knowledge graph entities:\n- Shor algorithm (ALGORITHM): Quantum algorithm that can compromise encryption systems.\n- Shor’s algorithm (ALGORITHM): Algorithm that can potentially break systems like RSA.\n- public-key cryptographic systems (SYSTEM): Systems based on security assumptions that are undermined by Shor's algorithm.\n- public key cryptography (CONCEPT): Cryptography vulnerable to Shor’s algorithm.\n\nKnowledge graph relations:\n- Shor’s algorithm -- public-key cryptographic systems: Shor's algorithm undermines the security assumptions of these systems.\n- Shor’s algorithm -- public-key cryptography: Shor’s Algorithm targets problems underlying public-key cryptography.\n- Algorithm Selection -- Shor’s algorithm: Shor’s algorithm applies to asymmetric cryptography.\n- Shor’s algorithm -- blockchain: Shor’s algorithm threatens the security of blockchain systems.\n- Shor’s algorithm -- asymmetric cryptography: Shor’s algorithm poses an existential threat to asymmetric cryptography.\n- cloud security -- Shor’s algorithm: Shor’s algorithm poses a threat to cloud security.", "passages": [{"source": "Next-Generation Quantum Security - The Impact of Quantum Computing on Cybersecurity—Threats, Mitigations, and Solutions", "page": 2, "text": "ECC (elliptic curve cryptography) through Shor’s algorithm, the weakening of hash functions and symmetric encryption via Grover’s  algorithm, and vulnerabilities in post-quantum cryptography, hash-based signatures, and multivariate polynomial systems. It also  highlights risks in quantum key distribution (QKD), cloud security, and random number generation. To counter these threats, the  figure points to ‘‘Emerging Solutions’’, likely referring to ongoing advancements in post-quantum cryptographic algorithms (such  as lattice-based or code-based cryptography), hybrid systems, and quantum-safe protocols designed to withstand quantum attacks.  The structured layout effectively contrasts critical vulnerabilities with proactive mitigation strategies, emphasizing the need for a  transition to quantum-resistant technologies. In Table 1, we present a comprehensive overview of the impact of quantum computing on various aspects of cybersecurity,"}, {"source": "A Comparative Study of Classical and Post-Quantum Cryptographic Algorithms in the Era of Quantum Computing", "page": 3, "text": "logarithms in polynomial time, directly undermining the security assumptions on which most public-key cryptographic systems are based. Systems such as RSA, the Diffie–Hellman Key Exchange, Elliptic Curve Cryptography (ECC), and the Digital Signature Algorithm (DSA) are all rendered insecure by the capabilities of this quantum algorithm. What makes Shor’s algorithm particularly threatening is its ability to reduce the complexity of these problems from exponential to polynomial time, thereby enabling quantum adversaries to efficiently decrypt data or forge credentials that would otherwise be considered secure. For example, a 2048-bit RSA key—currently assumed to be robust against classical attacks—could be broken within seconds using a sufficiently large and stable quantum computer running Shor’s algorithm. This quantum advantage implies the potential for total cryptanalytic compromise of traditional public-key 3"}, {"source": "harvest-now-decrypt-later-pqc-threat-model", "page": 15, "text": "• Archive Infrastructure: Dedicated storage systems enable long-term retention of potentially valuable data. • Categorization: Content organized by type, source, and value. High-priority material (government communications, trade secrets) segregates from lower-value data. • Access Control: Restricted access to authorized analysts with accountability logging. • Replication: Geographic replication ensures resilience. • Security: Protection against compromise, deletion, or modification. Maintaining such archives costs significantly less than potential intelligence value. Nation-state agencies and sophisticated criminal organizations easily afford petabytes of stored ciphertext. Phase 3: Deferred Decryption Once quantum computers become available with sufficient capability, the stored encrypted data becomes decryptable: 1. Algorithm Selection: The adversary determines which quantum algorithm applies (Shor’s algorithm for asymmetric cryptography, Grover’s for symmetric)."}, {"source": "harvest-now-decrypt-later-pqc-threat-model", "page": 7, "text": "is not automatic. The quantum algorithm must exploit the structure of the problem such that: 1. Superposition allows encoding of the search space efficiently 2. Quantum operations (quantum gates) transform the probability amplitudes in ways that preserve the amplitude for the correct answer while suppressing amplitudes for incorrect answers 3. Measurement of the final quantum state yields the correct answer with high probability For most problems, quantum computers offer no advantage. For a specific category of problems— particularly those involving hidden periodicities, such as integer factorization and discrete logarithm problems underlying RSA and ECC—quantum algorithms provide exponential speedup. 3.3 Cryptographically Relevant Quantum Algorithms 3.3.1 Shor’s Algorithm and Public-Key Cryptography In 1994, Peter Shor published an algorithm for solving two problems that form the basis of essentially all modern public-key cryptography:"}], "claims": ["Shor's algorithm is a quantum algorithm.", "Shor's algorithm can efficiently solve the integer factorization problem.", "Shor's algorithm can efficiently solve the discrete logarithm problem.", "The integer factorization and discrete logarithm problems underpin many public-key cryptographic systems.", "Shor's algorithm poses a significant threat to the security of current cryptographic systems.", "Shor's algorithm can break the security assumptions of RSA and ECC.", "The complexity of integer factorization and discrete logarithm problems is reduced from exponential to polynomial time by Shor's algorithm."]}, {"code": "A093", "question": "How many side-channel leakage points have been reported in Kyber's decryption procedure, and how did researchers use machine learning in a side-channel attack on a Kyber implementation?", "reference": "Three side-channel leakage points were reported in Kyber's decryption procedure, and side-channel attacks were completed on Kyber hardware implementations. Researchers used machine learning to exploit a power-consumption side channel against a Kyber implementation previously believed resistant to such attacks: energy fluctuations of processor or circuit operations reveal details about the data being processed.", "answer": "One critical side-channel leakage point has been reported in Kyber's decryption procedure, occurring during the PWM of ˆs ◦ˆu. Researchers used machine learning techniques to extract encryption keys from Kyber implementations, as mentioned in the text passages.", "kg": "Knowledge graph entities:\n- side-channel leakage (ATTACK): Critical leakage occurring during the PWM of ˆs ◦ˆu.; Monitoring for potential security breaches in QuANet context.\n- side-channel attack (ATTACK): Attacks exploiting physical implementations of cryptographic algorithms.; SCA is the context in which the CPA attack is used.; Side-channel attack used to recover secret keys.; Attack that could exploit side channels.; I\n- Kyber (SYSTEM): Lattice-based cryptography system whose secret key is targeted by the attack.; A lattice-based cryptographic system.; Target of the two-step attack.; Cryptography system consisting of key generation, encryption, and decr\n- decryption (ALGORITHM): Stage in Kyber where decryption occurs.; The process of recovering the message from the ciphertext.\n- vertical sidechannel leakage detection (ATTACK): Researchers employed vertical sidechannel leakage detection to examine CRYSTALS-Kyber’s decryption mechanism.\n- machine learning (CONCEPT): Field essential for quantum machine learning.; Traditional machine learning methods and algorithms.; Field that integrates hybrid quantum-classical algorithms.; Technique used to extract encryption keys from Kyber implem\n- attack (ATTACK): Attack that can be launched against CRYSTALS-Kyber.; Based on estimates of quantum and classical gate counts for attack, rather than assessing security algorithms with a specific bit number.\n- Deep Learning-Based Side-Channel Analysis (ATTACK): Enabled launching attacks on various cryptographic systems.\n\nKnowledge graph relations:\n- Kyber -- side-channel leakage: Kyber is vulnerable to side-channel leakage during decryption.\n- machine learning -- CRYSTALS-Kyber: Machine learning techniques have been used to extract keys from Kyber.; Machine learning may be used to exploit side-channel attacks on the CRYSTALS-Kyber algorithm.\n- side-channel attack -- deep learning: Deep learning techniques have been successful in breaching first-order masked and shuffled CRYSTALS-Kyber implementations.\n- side-channel attack -- machine learning: Machine learning techniques were employed to take advantage of the side-channel attack.; Machine learning was utilized to carry out the side-channel attack.\n- vertical sidechannel leakage detection -- CRYSTALS-Kyber: Researchers employed vertical sidechannel leakage detection to examine CRYSTALS-Kyber’s decryption mechanism.\n- side-channel attack -- reference implementation of Kyber512: Attacks can compromise additional functions in the reference implementation.\n- side-channel attack -- Kyber: Kyber mechanism guards against side-channel attacks.\n- CRYSTALS-Kyber -- side-channel attack: CRYSTALS-Kyber is susceptible to side-channel attacks.; CRYSTAL
