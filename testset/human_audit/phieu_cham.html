BUTION - Bridging Theoretical Security Proofs, Practical Attacks, and Error Correction", "page": 4, "text": "Goal: Force any eavesdropper into a guessing basis states for measurement using non-commuting bases. Loophole: Practical photon sources sometimes emit multi-photon pulses, which makes them more susceptible to undetected PNS attacks. Key Fix: Decoy-state methods interweave different intensities to detect tampering via statistical anomalies. 2.1 Bennett-Brassard 1984 (BB84) Protocol The BB84 is the foundation for all Quantum Key Distribution protocols. Bit Value Basis Qubit State 0 Rectilinear (+) |0⟩ 1 Rectilinear (+) |1⟩ 0 Diagonal (×) |+⟩ 1 Diagonal (×) |−⟩ Table 1: Preparation choices in BB84 protocol"}, {"source": "QUANTUM KEY DISTRIBUTION - Bridging Theoretical Security Proofs, Practical Attacks, and Error Correction", "page": 4, "text": "Basis Qubit State 0 Rectilinear (+) |0⟩ 1 Rectilinear (+) |1⟩ 0 Diagonal (×) |+⟩ 1 Diagonal (×) |−⟩ Table 1: Preparation choices in BB84 protocol The following are the entire steps of the BB84 protocol, (i) Alice prepares the qubits string for a random classical bit string using preparation choices as listed in Table(1), and transmits these using the quantum channel. (ii) Bob randomly chooses a basis of measurement for each qubit. (iii) Bob declares his basis choice over the classical channel, and the qubits measured in different bases are discarded. (iv) Alice and Bob then choose half of the remaining qubits to determine if an eavesdropper is present by using sifting."}, {"source": "Next-Generation Quantum Security - The Impact of Quantum Computing on Cybersecurity—Threats, Mitigations, and Solutions", "page": 16, "text": "The security of QKD communication arises from the fact that any eavesdropping attempt introduces measurable errors due to the disturbance of quantum states. Bennett and Brassard established BB84 as the most recognized QKD protocol, which uses polarized photons to transmit secret keys. In the BB84 protocol, Alice prepares randomly polarized photons, and Bob measures them using one of two selected measurement bases."}, {"source": "Quantum Cryptography - Public Key Distribution and Coin Tossing", "page": 4, "text": "original basis only after he has performed his measurement, can yield more than 1/2 expected bits of information aboďt the key bit encoded by that photon; and that any such measurement yielding b bits of expected information (b s 1/2) must induce a disagreement with probability at least b/2 if the measured photon, or an attempted forgery of it, is later re-measured in its original basis. (This opti_mum tradeoff occurs, for example, when the ea­ vesdropper measures and retransmits all intercepted photons in the rectilinear basis, thereby learning the correct polarizations of half the photons and inducing disagreements in 1/4 of those that are lat­ er re-measured in the original basis.) Alice and Bob can therefore test for eaves­ dropping by publicly comparing some of the bits on which they think they should agree, though of course"}], "claims": ["An eavesdropper who measures and resends all photons in the rectilinear basis induces an error rate of 1/4 in BB84.", "Decoy-state QKD detection events are contributed to by decoy-state methods.", "Decoy-state QKD detection events are contributed to by quantum error correction codes."]}, {"code": "A057", "question": "How does WAF-A-MoLE manage its payload pool during the mutation-based evasion algorithm?", "reference": "The payload pool is a priority queue Q, prioritized by the confidence value returned by the WAF's classifier; initially it contains only the initial payload p0, and payloads are mutated until one falls below the threshold t under which it is considered harmless.", "answer": "WAF-A-MoLE manages its payload pool using a priority queue Q. Payloads are prioritized based on the confidence value returned by the WAF's classification algorithm. Initially, the pool contains the starting payload. During each iteration, the payload with the lowest confidence value is selected, mutated, and re-evaluated. The new payload is then added back to the queue, maintaining its priority based on the updated confidence value. This process continues until a payload with a confidence value below the rejection threshold is found.", "kg": null, "passages": [{"source": "WAF-A-MoLE - Evading Web Application Firewalls through Adversarial Machine Learning", "page": 1, "text": "WAF. Our approach starts from a target malicious payload that the WAF correctly detects. Then, by iteratively applying a set of mutation operators, we generate new payloads. Since mutation operators are semantics-preserving, the new payloads are equivalent from the point of view of the adversary. However, they gradually reduce the confidence of the WAF classification algorithm. Eventually, this process converges to a payload classified below the rejection threshold. To evaluate the effectiveness of our methodology we implemented a working prototype, called WAF-A-MoLE. Then we applied WAF-A-MoLE to different ML-based WAFs, and evaluated their robustness against our technique. Contributions of the paper. The main contributions of this work are summarized as follows: (i) we develop a tool for producing adversarial examples against WAFs by leveraging on a set of syntactical mutations, (ii) we produce a dataset of both sane and injection arXiv:2001.01952v1 [cs.CR] 7 Jan 2020"}, {"source": "WAF-A-MoLE - Evading Web Application Firewalls through Adversarial Machine Learning", "page": 3, "text": "mitigate the potential, exponential blow-up of the mutation tree (see Section 3.3). On the negative side, each branch of the mutation tree only evolves monotonically which might result in the algorithm stagnating on local minima. However, our experiments show that this does not prevent our algorithm from finding an injectable payload (see Section 5). 4 WAF TRAINING AND BENCHMARKING Our technique applies to an input model represent ture space, an initial payload p0 and a threshold t, i.e., a confidence value under which a payload is considered harmless. WAF-A-MoLE implements the payload pool (see Section 3.3) as a priority queue Q (line 1). The payloads in Q are prioritized according to the confidence value returned by the classification algorithm, namely classify, associated to m. The classification algorithm assigns to each payload an x ∈X, by extracting a feature vector, and computes m(x). Initially, Q only contains p0 (lines 2–3). The main loop (lines 4–7)"}], "claims": ["WAF-A-MoLE manages its payload pool using a priority queue Q.", "Payloads are prioritized based on the confidence value returned by the WAF's classification algorithm.", "The payload pool initially contains the starting payload.", "During each iteration, the payload with the lowest confidence value is selected.", "The selected payload is mutated and re-evaluated.", "The new payload is added back to the queue.", "The priority of the new payload is based on the updated confidence value.", "This process continues until a payload with a confidence value below the rejection threshold is found."]}, {"code": "A058", "question": "Does Libsodium support any NIST PQC finalist algorithms as of its latest release in the 1.0.x series?", "reference": "As of the latest release in the 1.0.x series, Libsodium does not include support for any of the NIST PQC finalist algorithms.", "answer": "No, as of the 1.0.x series, Libsodium does not include support for any of the NIST PQC finalist algorithms. The library's lead developer has noted that ML-KEM is on the roadmap but no official timeline has been given for its integration.", "kg": "Knowledge graph entities:\n- libsodium (SYSTEM): Cryptographic open-source library.; Popular cryptographic library with a consistent API.; Cryptographic library that does not include support for NIST PQC finalist algorithms.; Library insufficient for quantum readiness \n- NIST PQC algorithms (ALGORITHM): Suite of algorithms spanning different families of mathematical problems.; Algorithms based on criteria mentioned in previous section.; NIST Post-Quantum Cryptography algorithms.; Standard post-quantum cryptography algor\n- NIST (ORGANIZATION): U.S. government agency standardizing post-quantum cryptography.; Launched a global competition for quantum-resistant public-key cryptographic algorithms.; Kyber has been officially selected by NIST.; Selected Falcon for \n- PQC (ALGORITHM): Deep PQCs, or those forming 2-designs.; Post-quantum cryptographic algorithms implemented through hybrid systems.; Post-Quantum Cryptography.; Algorithms submitted in various categories for the NIST competition.; PQC sta\n- NIST PQC finalists (ALGORITHM): NIST-selected algorithms for post-quantum cryptography.; NIST's post-quantum cryptography finalist algorithms including Kyber, Dilithium, FALCON, SPHINCS+.; Post-quantum key exchange or signature schemes that are not yet\n- post quantum cryptography (STANDARD): PQC is the new era of cryptography due to quantum computing.; Solution to mitigate risks posed by quantum computing.\n- PQC finalists of NIST (DATASET): NIST's post-quantum cryptography finalists for comparison.\n- post-quantum cryptosystems (ALGORITHM): Innovative solution for resisting quantum attacks.; Cryptosystems designed to resist quantum computing attacks.; New generation of cryptosystems examined in the study.; This article discusses the challenges and potential\n\nKnowledge graph relations:\n- libsodium -- NIST PQC finalists: libsodium does not include support for any of the NIST PQC finalist algorithms.\n- liboqs -- NIST PQC algorithms: OQS supports many PQC algorithms including Kyber, Dilithium, Falcon, and SPHINCS+.\n- LibreSSL -- NIST PQC finalists: LibreSSL supports some of the NIST PQC finalist algorithms.\n- OpenSSL -- NIST PQC algorithms: OpenSSL has signaled that support for NIST PQC algorithms is forthcoming.; OpenSSL has not included these algorithms in its official release.\n- OpenSSL -- NIST finalists: OpenSSL does not support any NIST finalist algorithms.\n- OpenSSL Foundation -- NIST PQC algorithms: Plans to implement support for these algorithms in OpenSSL.\n- NIST PQC algorithms -- Dilithium: NIST PQC algorithms include Dilithium.\n- libsodium -- PQC: libsodium has not yet embraced PQC.\n- MbedTLS -- NIST PQC algorithms: MbedTLS does not have NIST PQC algorithms implemented.\n- Crypto++ -- NIST PQC finalists: Crypto++ does not include the NIST PQC finalists in its mainline distribution.\n- PQC solutions -- NIST: NIST is leading standardization efforts for PQC algorithms.\n- open-source libraries -- PQC: Libraries support PQC algorithms.", "passages": [{"source": "A Survey of Post-Quantum Cryptography Support in Cryptographic Libraries", "page": 6, "text": "OpenSSL has not included NIST PQC algorithms in its official release, but has signaled that support is forthcoming now that standards are finalized [19]. In September 2024, the OpenSSL Foundation announced plans to implement the NIST PQC finalists (Kyber, Dilithium, Falcon, SPHINCS+) in a future release, stating: “We intend to implement support for these algorithms in our providers in a future version of OpenSSL” [19]. This came after NIST published the FIPS draft standards (ML-KEM, ML-DSA, SLH-DSA), which OpenSSL was awaiting to avoid integrating pre-standard algorithms. As of early 2025, integration is underway (targeting OpenSSL 3.5), but not yet released. Meanwhile, since early 2022, the Open Quantum Safe (OQS) project has offered PQC support for OpenSSL 3 via its provider architecture [34]. Maintained by openquantumsafe.org, the OQS provider allowed experimentation with many PQC algorithms across TLS 1.3 and X.509 [19], serving as a “test vehicle” for"}, {"source": "A Survey of Post-Quantum Cryptography Support in Cryptographic Libraries", "page": 6, "text": "1.0.x series, Libsodium does not include support for any of the NIST PQC finalist algorithms. The library currently provides modern public-key cryptography (Curve25519-based key exchange, Ed25519 signatures, X25519/XChaCha, etc.), but no post-quantum key exchange or signature schemes have been integrated yet. The community has shown interest and asked questions regarding PQC in libsodium. Specifically, developers have inquired about the potential addition of algorithms such as Kyber or Dilithium. The lead developer of libsodium (Frank Denis) has been cautious on this front. In a discussion thread, it was noted that “ML-KEM is on the roadmap” for libsodium, but that PQC integration is complex and has not yet been completed [37]. This implies that libsodium’s author is aware of Kyber (ML-KEM) and intends to support it eventually, but no official timeline is given. Observation: For now, if quantum readiness is required, libsodium alone is insufficient – one must integrate additional"}, {"source": "A Survey of Post-Quantum Cryptography Support in Cryptographic Libraries", "page": 6, "text": "official timeline is given. Observation: For now, if quantum readiness is required, libsodium alone is insufficient – one must integrate additional tools. This gap highlights that not all libraries have moved at the same pace; ease-of-use libraries such as libsodium may take a bit longer to incorporate cutting-edge PQC algorithms. 5.3 MbedTLS MbedTLS (now part of Arm’s Open-Source Security), ranked third on our list and widely used in embedded/IoT, currently has no NIST PQC algorithms implemented in its official release, but it is on their roadmap. The maintainers explicitly stated that they plan to add post-quantum cryptography now that standards are available. A forum query in March 2024 asked about Dilithium/Kyber support, and the response from an Mbed TLS developer was: \"Yes, eventually, we will add standard post-quantum algorithms. We don’t know when yet, and we are not going to anticipate NIST standardization. Kyber (as ML-KEM) will likely come first since KEM is more urgent"}, {"source": "A Survey of Post-Quantum Cryptography Support in Cryptographic Libraries", "page": 11, "text": "and Botan have moved aggressively to implement NIST’s postquantum algorithms, providing developers with ready-to-use tools for quantum-resistant encryption and signatures. wolfSSL, Bouncy Castle integrate Kyber and Dilithium into their TLS stack today, and Botan offers a rich PQC suite in its C++ API [56,60]. On the other end, libsodium, has yet to embrace PQC, reflecting caution and the challenges of adding these complex schemes to a minimalist library [37]. Similarly, PQC support for Crypto++ and LibreSSL is either not yet on their roadmap, or for MbedTLS the conversation has just started. OpenSSL2, the most critical library for Internet security, is in a transitional phase: it does not officially support PQC as of early 2025, but clear plans and ongoing work signal that Kyber, Dilithium, and others will be integrated in the near future [19]. In the meantime, OpenSSL users must rely on external providers such as liboqs for PQC capabilities. BoringSSL (Google’s fork),"}], "claims": ["Libsodium does not include support for any of the NIST PQC finalist algorithms as of the 1.0.x series.", "The library's lead developer has noted that ML-KEM is on the roadmap.", "No official timeline has been given for the integration of ML-KEM."]}, {"code": "A059", "question": "Why do modern attack landscapes call for adaptive honeypots, and what challenges do AI-powered honeypots face?", "reference": "Studies found modern attack landscapes are dominated by IoT-based malware and keylogging campaigns, which underscores the need for adaptive defenses, and cyber deception has moved from static honeypots to dynamic systems. AI-powered honeypots integrate machine learning, behavioral analytics and automated response, but face computational overhead, model training complexity and adversarial AI attacks in which attackers manipulate the ML models, requiring robust countermeasures.", "answer": "Modern attack landscapes, dominated by IoT-based malware and keylogging campaigns, necessitate adaptive honeypots to effectively counter these threats. AI-powered honeypots face challenges such as computational overhead, model training complexities, and potential adversarial AI attacks that could manipulate the models through adversarial inputs.", "kg": null, "passages": [{"source": "AI-Powered Honeypots - Enhancing Deception Technologies for Cyber Defense", "page": 3, "text": "crucial component in modern cybersecurity strategies. While traditional honeypots remain  valuable, their limitations in dealing with sophisticated adversaries highlight the need for AIenhanced deception technologies. This research demonstrates that AI-powered honeypots  offer a proactive approach to cyber defense, enabling organizations to detect and neutralize  threats more effectively. However, challenges such as adversarial AI attacks and  computational requirements must be addressed to ensure the long-term viability of these  systems. Future research should focus on refining AI models for deception technologies,  enhancing real-time adaptability, and integrating honeypots with broader cybersecurity  frameworks. The continuous evolution of cyber threats necessitates the development of  intelligent, resilient, and adaptive security mechanisms, with AI-powered honeypots playing  a pivotal role in safeguarding digital assets.  Reference"}, {"source": "Advancing Cybersecurity with Honeypots and Deception Strategies", "page": 4, "text": "were examined in a study, revealing that modern attack landscapes are dominated by IoT-based malware and keylogging campaigns, which underscores the need for adaptive defense mechanisms [22]. Honeypot classifications were thoroughly analyzed, highlighting their benefits and drawbacks, including ethical issues and evasion tactics employed by advanced attackers [23]. The efficacy of honeypots in intercepting hacker communications and collecting intelligence was also emphasized, underscoring their significance in proactive security strategies [24]. Cyber deception encompasses strategies such as obscuring genuine network assets and disseminating misleading information to bewilder opponents. In 2018, the progression of cyber deception was researched, highlighting its transition from static systems such as conventional honeypots to dynamic, adaptive techniques that use computational game theory and machine learning [25]. Another team of researchers has shown that dynamic"}, {"source": "AI-Powered Honeypots - Enhancing Deception Technologies for Cyber Defense", "page": 3, "text": "tactics. Despite their advantages, AI-powered honeypots also present certain challenges,  including computational overhead, model training complexities, and potential adversarial AI  attacks. Skilled attackers may attempt to manipulate machine learning models through  adversarial inputs, necessitating robust countermeasures to maintain the integrity of AIdriven deception technologies.  Conclusion  AI-powered honeypots represent a significant advancement in deception-based cybersecurity  defenses. By integrating machine learning, behavioral analytics, and automated response  mechanisms, these systems enhance threat detection, deception accuracy, and attack  attribution. The ability of AI-driven honeypots to adapt to evolving threats makes them a  crucial component in modern cybersecurity strategies. While traditional honeypots remain"}, {"source": "AI-Powered Honeypots - Enhancing Deception Technologies for Cyber Defense", "page": 3, "text": "research adheres to responsible cybersecurity practices while evaluating deceptive security  mechanisms.  Results and Discussion  The findings of this research indicate that AI-powered honeypots offer significant advantages  over traditional deception technologies. One of the primary benefits is their ability to  dynamically adapt to evolving attack patterns. Unlike static honeypots, AI-driven systems  utilize machine learning algorithms to analyze attacker behavior in real time and adjust their  responses accordingly. This adaptability enhances the deception process, making it more  difficult for adversaries to identify and bypass honeypot defenses. Additionally, AI-powered  honeypots improve the accuracy of threat detection by minimizing false positives and  identifying sophisticated attack techniques that may evade traditional security measures. The  integration of deep learning models enables these systems to recognize complex attack"}], "claims": ["Modern attack landscapes are dominated by IoT-based malware and keylogging campaigns.", "Adaptive honeypots are necessary to effectively counter these threats.", "AI-powered honeypots face computational overhead.", "AI-powered honeypots face model training complexities.", "AI-powered honeypots face potential adversarial AI attacks that could manipulate the models through adversarial inputs."]}, {"code": "A060", "question": "What type of honeypots are designed to simulate the behavior of a human and analyze how attackers exploit vulnerabilities in client programs such as browsers?", "reference": "Client honeypots are designed to simulate the behavior of a human and analyze how such behavior is exploited by an attacker.", "answer": "Client honeypots are designed to simulate the behavior of a human and analyze how attackers exploit vulnerabilities in client programs such as browsers.", "kg": null, "passages": [{"source": "Use of Deception to Improve Client Honeypot Detection of Drive-by-Download Attacks", "page": 2, "text": "cracker, the traps used to lure and detect him, and the chroot “Jail” the researchers  built to watch his activities [6].  Types of honeypots can be differentiated by their ability to interact with an attacker. Systems that emulate vulnerabilities and allow limited interaction with the  attacker are low-interaction honeypots. Systems that are vulnerable and allow interaction with the attacker at all levels are high-interaction honeypots [7]. Another differentiation is between physical honeypots, which run on physical machines, and virtual  honeypots, which run on virtual machines [2].  As a result of attackers exploiting vulnerabilities in client programs (such as  browsers), honeypots have evolved to simulate the behavior of a human and analyze  how such behavior is exploited by an attacker [2].  2.1 Client Honeypots"}, {"source": "Use of Deception to Improve Client Honeypot Detection of Drive-by-Download Attacks", "page": 4, "text": "mechanisms that allow the locations of honeypots to be unpredictable, continuously  changing, and disguised within a server pool, from which a subset of servers provides  services and the rest of the server pool is idle and acts as honeypots [19].  Client honeypots simulate the behavior of a human and actively search for attacks  and malicious content on the Internet [2]. The level of interaction between client  honeypots with servers can be low or high. Low-interaction client honeypots use a  simulated client in place of a browser and assess the malicious nature of a server via  static analysis such as signatures. High-interaction client honeypots interact with  servers and assess the malicious nature of the server based on state changes [7]."}, {"source": "Advancing Cybersecurity with Honeypots and Deception Strategies", "page": 4, "text": "systems by generating immutable records of identified threats and developing more robust defense mechanisms [18]. Virtual honeypots have been used to design and simulate intrusion detection systems. These systems analyze extensive datasets and find cybersecurity vulnerabilities, establishing them as critical assets for network security [19]. Researchers have also assessed the influence of various honeypot configurations on attacker behavior using cognitive models. Studying decisions made by adversaries in different scenarios can improve the effectiveness of honeypot systems [20]. Academic and research institutions have increasingly adopted honeypots for collecting cyberattack data and enhancing security education. These deployments offer critical insights into attack patterns, and significant contributions are made to prepare future"}, {"source": "Advancing Cybersecurity with Honeypots and Deception Strategies", "page": 7, "text": "to cybersecurity. 4. Honeypot Types Honeypots are critical tools for acquiring reliable insights into the evolving landscape of cyber threats. They provide detailed intelligence on attack vectors, exploits, and malware, aiding in identifying and mitigating emerging risks. Attackers continually refine unauthorized access methods, while honeypots detect and document these developments, which play a pivotal role in a cybersecurity strategy. Additionally, honeypots identify and capture insider threats, allowing for a broader spectrum of potential vulnerabilities to be addressed. Various honeypot categories are present, each designed to address specific threat types. The classification and interpretation of honeypots are determined by the nature of the threat being mitigated, with each category contributing uniquely to an effective and comprehensive cybersecurity strategy. For example, fictitious email addresses are deployed"}], "claims": ["Client honeypots are designed to simulate the behavior of a human.", "Client honeypots analyze how attackers exploit vulnerabilities in client programs such as browsers."]}, {"code": "A061", "question": "Why are multivariate quadratic (MQ) cryptographic schemes considered quantum-resistant, what are they mainly used for, and what property makes a multivariate signature scheme suitable for authenticating edge nodes?", "reference": "MQ cryptography relies on solving systems of quadratic equations over finite fields, an NP-hard problem for which no efficient classical or quantum algorithm is known; MQ-based schemes are mainly used for digital signatures and public-key encryption. A multivariate signature scheme proposed by Akleylek et al. is immune to quantum attacks, has effective key and signature sizes, and its excellent parallelism support allows edge node authentication to be deployed effectively.", "answer": "Multivariate quadratic (MQ) cryptographic schemes are considered quantum-resistant because solving systems of multivariate quadratic equations in finite fields is believed to be intractable for quantum computers, making them resistant to quantum attacks. They are mainly used for public key encryption and digital signatures. A multivariate signature scheme is suitable for authenticating edge nodes due to its ability to efficiently handle large volumes of data and its resilience to quantum computing threats, which is crucial for resource-constrained IoT devices.", "kg": "Knowledge graph entities:\n- signature (CONCEPT): CONCEPT|Components of the signature returned by the signing procedure.; Output associated with the signing operation of post-quantum algorithms.; Part of the post-quantum distributed ledger platforms.; Signature algorith\n- quantum-resistant cryptographic algorithms (ALGORITHM): Quantum-resistant algorithms requested, assessed, and standardized by NIST PQC.; NIST chooses a group of potential algorithms that the cryptography community has submitted.\n- quantum-resistant signature scheme (ALGORITHM): Proposing quantum-resistant signature schemes for verifying transactions.\n- quantum-resistant algorithms (ALGORITHM): Judged to be more cost-effective and maintainable by the U.S. NSA.; Like CRYSTALS-Kyber or SABER.; Many post-quantum schemes, such as lattice-based.\n- Quantum-resistant ZKPs (PROTOCOL): Proposed for use in PQB.\n- Rainbow (ALGORITHM): Most well-known scheme in the multivariate-based cryptosystems family.\n- NTRU (ALGORITHM): Polynomials f and g are chosen from a discrete Gaussian distribution to compute F and G.; The study demonstrated the superior performance of lattice-based post-quantum cryptography techniques, such as NTRU.; Based for as\n- post-quantum signature (DEFENSE): Ideal for resource-constrained IoT devices.; Most recent post-quantum signature suggestions.; A digital signature scheme resistant to quantum computer attacks.; Solutions to increase blockchain’s scalability from a crypt\n\nKnowledge graph relations:\n- multivariate-based cryptosystem -- finite field: Solving multivariate equations in finite fields makes them resistant to quantum computers.\n- quantum-resistant cryptographic algorithms -- quantum computer: These algorithms are designed to withstand attacks from quantum computers.\n- quantum-resistant algorithms -- PQC deployment: Quantum-resistant algorithms are a barrier to PQC deployment.\n- PQC -- quantum-resistant architectures: PQC algorithms can be applied to quantum-resistant architectures.\n- PQC -- quantum-resistant blockchain: PQC algorithms are used in quantum-resistant blockchains.\n- NIST PQC algorithms -- quantum-resistant cryptographic algorithms: NIST PQC aims to standardize these algorithms.\n- quantum-resistant signature scheme -- digital signature: Proposing quantum-resistant signature schemes for verifying transactions.\n- quantum attacks -- quantum-resistant cryptographic algorithms: The algorithms were tested for their resilience to quantum attacks.\n- quantum-resistant cryptographic algorithms -- NIST: NIST chooses a group of potential quantum-resistant cryptographic algorithms.\n- Hybrid Cryptography -- quantum-resistant algorithms: Hybrid cryptography combines both key establishment methods.\n- lattice-based cryptosystems -- post-quantum signature: Lattice-based cryptosystems are best suited for low-resource devices.\n- quantum-safe cryptography -- quantum-resistant algorithms: Quantum-safe cryptography is recommended over quantum-resistant algorithms by the U.S. NSA.", "passages": [{"source": "Investigating CRYSTALS-Kyber Vulnerabilities - Attack Analysis and Mitigation", "page": 2, "text": "Cryptography 2024, 8, 15 2 of 13 Aware of this difficulty, post-quantum cryptosystems that can safely and successfully withstand quantum attacks must be developed and put into use [4,5]. With the development of quantum computing, conventional asymmetric methods like RSA could not be adequate to protect private data. The way that quantum technology is developing has prompted an ongoing endeavor to design resilient post-quantum systems [6]. The National Institute of Standards and Technology (NIST) initiated the Post-Quantum Cryptography Standardization Initiative (NIST PQC) in 2016 in response to the changing threat scenario provided by quantum computers. NIST PQC’s main objective is to provide strong cryptographic algorithm standards that can withstand attacks from quantum computers. The goal of the project is to secure sensitive data in the post-quantum computing age by requesting, assessing, and standardizing quantum-resistant cryptographic algorithms."}, {"source": "Investigating CRYSTALS-Kyber Vulnerabilities - Attack Analysis and Mitigation", "page": 2, "text": "by requesting, assessing, and standardizing quantum-resistant cryptographic algorithms. NIST chooses a group of potential algorithms that the cryptography community has submitted to start the process. These candidates were put through extensive testing, with an emphasis on how resilient they were to quantum attacks. The selected primitives are based on linear error-correcting code decoding and lattices, two mathematical issues that are thought to be difficult for quantum computers. NIST announced in July 2022 that CRYSTALS-Kyber will become the new standard for key setup and public key encryption (PKE) [7]. This is a major development. The reason for this choice is that it has been identified as a key encapsulation mechanism (KEM) that secures IND-CCA2 in models of random oracles that are both classical and quantum. The intricacy of the module learning with errors (M-LWE) problem, which introduces unknown noise into linear equations, forms the basis of CRYSTALS-Kyber’s security."}, {"source": "Post-Quantum_Blockchain_Security_for_the_Internet_of_Things_Survey_and_Research_Directions", "page": 7, "text": "coefﬁcients of the polynomials f and g ∈z[x] are chosen at random from a discrete Gaussian distribution, after which it computes F and G ∈z[x] that fulﬁll the equation of NTRU fG −gF = q : mod : φ. Consequently, the polynomial elements f, g, F, and G are known as secret elements. The signing procedure takes a message m and a private key sk as inputs and returns a signature with two components r and s. To verify a signed message, it requires the public key h and the signed message m. The digital signature scheme is proposed at two security levels, and its features are listed in Table III. FALCON offers relatively small public and private key sizes as well as an exceptionally small signature size. The FALCON veriﬁcation step can also be completed quickly and easily by a hash function and NTT operations, whereas the time required to generate a key is prohibitive compared to the other two schemes. There are also some concerns about"}, {"source": "The-Quantum-Security-Deadline", "page": 15, "text": "Addressing these gaps will necessitate coordinated efforts between standardization bodies,  vendors, and enterprises to ensure seamless PQC deployment across heterogeneous IT landscapes.    Performance and Implementation Overheads  A significant barrier to widespread PQC adoption is the performance and computational overhead  associated with quantum-resistant algorithms. Many post-quantum schemes, such as lattice-based"}], "claims": ["Solving systems of multivariate quadratic equations in finite fields is intractable for quantum computers.", "Multivariate quadratic (MQ) cryptographic schemes are resistant to quantum attacks.", "MQ schemes are mainly used for public key encryption.", "MQ schemes are mainly used for digital signatures.", "Multivariate signature schemes can efficiently handle large volumes of data.", "Multivariate signature schemes are resilient to quantum computing threats.", "Resource-constrained IoT devices are vulnerable to quantum computing threats.", "Multivariate signature schemes are suitable for authenticating edge nodes in IoT devices."]}, {"code": "A062", "question": "What machine learning algorithm does the second layer of ADL-WAF use to classify anomalies?", "reference": "The second layer employs Support Vector Machine (SVM) to classify these anomalies as either threat anomalies or benign anomalies.", "answer": "The second layer of ADL-WAF employs Support Vector Machine (SVM) to classify anomalies as either threat anomalies or benign anomalies.", "kg": null, "passages": [{"source": "Adaptive Dual-Layer Web Application Firewall (ADL-WAF) Leveraging Machine Learning for Enhanced Anomaly and Threat Detection", "page": 1, "text": "layer employs a Decision Tree (DT) algorithm to detect anomalies by  identifying traffic deviations from established normal patterns. The  second layer employs Support Vector Machine (SVM) to classify  these anomalies as either threat anomalies or benign anomalies. Our  “Adaptive  Dual-Layer  WAF  (ADL-WAF)”  incorporates  comprehensive data pre-processing and feature engineering  techniques and has been thoroughly evaluated using five large  benchmark datasets. Evaluation using these datasets shows that  ADL-WAF achieves a detection accuracy of 99.88% and a precision  of 100%, significantly enhancing anomaly detection and reducing  false positives. These findings suggest that integrating machine  learning techniques into WAFs can substantially improve web  application security by providing more accurate and efficient threat  detection.   Keywords-Web Application Firewall (WAF), Machine Learning  (ML), Decision Tree (DT), Support Vector Machines (SVM),"}, {"source": "Adaptive Dual-Layer Web Application Firewall (ADL-WAF) Leveraging Machine Learning for Enhanced Anomaly and Threat Detection", "page": 3, "text": "machine learning techniques to enhance detection accuracy and  reduce false positives and negatives.    Figure 1: Traditional Web Application Firewall Build.  1- Proposed Model Architecture and Logic  The Adaptive Dual-Layer WAF (ADL-WAF) uses a two-layer  approach, via Machine Learning (ML), that overcomes the  shortcomings typically associated with traditional WAFs:  Anomaly Detection (Layer 1) and Threat Detection (Layer 2).  In turn, this significantly improves the accuracy and efficacy of  WAF which is one with fewer false positives and false  negatives, by using these layers in conjunction with each other  (see Figure 2).    Figure 2: The Adaptive Dual-Layer WAF Build  In Fig.3 shows how The Adaptive Dual-Layer WAF’s logic  works and operates on different user data inputs differentiating  between the legal traffic, benign inputs like human typo or error  and the real threats. In the first scenario the user enters his first"}, {"source": "Adaptive Dual-Layer Web Application Firewall (ADL-WAF) Leveraging Machine Learning for Enhanced Anomaly and Threat Detection", "page": 1, "text": "Adaptive Dual-Layer Web Application Firewall (ADL-WAF) Leveraging Machine  Learning for Enhanced Anomaly and Threat Detection  Ahmed Sameh1 and Sahar Selim1  Center for Informatics Science (CIS), School of Information Technology and Computer Science, Nile University, 26th of  July Corridor, Sheikh Zayed City 12588, Egypt     Abstract—Web Application Firewalls are crucial for protecting web  applications against a wide range of cyber threats. Traditional Web  Application Firewalls (WAFs) often struggle to effectively  distinguish between malicious and legitimate traffic, leading to  limited efficacy in threat detection. To overcome these limitations,  this paper proposes an Adaptive Dual-Layer WAF (ADL-WAF)  employing a two-layered Machine Learning (ML) model designed to  enhance the accuracy of anomaly and threat detection. The first  layer employs a Decision Tree (DT) algorithm to detect anomalies by  identifying traffic deviations from established normal patterns. The"}, {"source": "Adaptive Dual-Layer Web Application Firewall (ADL-WAF) Leveraging Machine Learning for Enhanced Anomaly and Threat Detection", "page": 5, "text": "ADL-WAF's effectiveness in distinguishing between  legitimate and malicious web traffic.  4. EXPERIMENTS AND RESULTS    1- Experimental Environment  WAF model implemented in an Anaconda environment using  Python 3.1. The multi layered model has been deployed over a  real-time reverse proxy setup written in Python scripting  language, which listens on port 8080 to capture, process, and  inspect the incoming traffic in real time.    2- Experiments  The objective was to enhance traditional WAFs by integrating  machine learning within a two-layer framework to detect  anomalies and threats. The experiments conducted include the  implementation and assessment of three different machine  learning models at first: Decision Tree and Naïve Bayes model  for Anomaly detection and Support Vector Machine SVM for  threat detection.  In the Anomaly Detection Layer, Decision Tree shows best"}], "claims": ["The second layer of ADL-WAF uses Support Vector Machine (SVM) to classify anomalies.", "The second layer of ADL-WAF classifies anomalies as either threat anomalies or benign anomalies."]}, {"code": "A063", "question": "How does quantum secure direct communication (QSDC) differ from quantum key distribution (QKD), and which intercity networks illustrate the development of practical QKD networks?", "reference": "QKD establishes shared secret keys between two parties (Alice and Bob) by exploiting quantum mechanics, whereas QSDC transmits the actual messages directly over a quantum channel, eliminating the need for cryptographic keys for encryption and decryption and giving confidential, near-instantaneous communication. Intercity networks such as the DARPA, Trieste and Tokyo networks illustrate the growth of practical QKD networks.", "answer": "Quantum Secure Direct Communication (QSDC) involves sharing messages directly without the need to establish secret keys, whereas Quantum Key Distribution (QKD) focuses on securely exchanging encryption keys. Intercity networks like the DARPA network, Trieste network, and Tokyo network illustrate the development of practical QKD networks.", "kg": "Knowledge graph entities:\n- QKD network (SYSTEM): Building a QKD network at scale leads to a combinatorial explosion of needed links.; China’s 2,000-km Quantum Key Distribution network.; Target of the modified PNS attack.; This modified scheme is based on weak laser pul\n- Quantum Secure Direct Communication (CONCEPT): Sharing messages directly without the need to establish secret keys.; Three-stage protocol can be used for secure direct communication.\n- Quantum Key Distribution (PROTOCOL): Technology that relies on coherence for secure communication.; Technology that ensures secure state transmission.; Integrated with ML to optimize communication security.; A cryptographic protocol that uses quantum physic\n- three-state quantum key distribution (QKD) protocol (PROTOCOL): Demonstrates security up to a bit error rate of 9.81%.\n- QKD deployments (SYSTEM): Quantum Key Distribution systems.\n- three-stage multi-photon quantum key distribution (QKD) protocol (PROTOCOL): The protocol leverages multi-photon coherent states and double-lock cryptography.\n- quantum channel (SYSTEM): Connects Alice and Bob in the QKD scenario.; The channel used for transmitting qubits.; Channel used for quantum key distribution.; Channel used for quantum communication between Alice and Bob.; Subject to eavesdropping \n- QKD devices (SYSTEM): Devices that implement quantum key distribution.\n\nKnowledge graph relations:\n- Quantum Key Distribution -- telecom networks: QKD is being integrated with telecom networks.\n- defense -- Quantum Key Distribution: Defense might use QKD for secure communications.\n- Tokyo network -- Quantum Key Distribution: Tokyo network is an example of QKD networks.\n- PQC -- Quantum Key Distribution: PQC will be the workhorse of future quantum-safe security, whereas QKD might protect specific high-value links.\n- government -- Quantum Key Distribution: Government might use QKD for secure communications.; Governments are likely early adopters of QKD.\n- Quantum Key Distribution -- quantum error-correction codes: QKD’s security guarantees are assessed through QECCs.; QECCs ensure the integrity of transmitted quantum states.\n- Quantum Key Distribution -- unconditional security: QKD provides unconditional security.; QKD provides information-theoretic security.\n- Quantum Key Distribution -- information-theoretic security: QKD offers the promise of information-theoretic security.\n- Quantum Key Distribution -- Denial-of-Service: QKD makes communications fragile, allowing an attacker to force the system to fail.\n- NCSC -- Quantum Key Distribution: NCSC cautions against relying on QKD for business-critical networks.\n- Quantum Key Distribution -- quantum cybersecurity solutions: QKD is part of quantum cybersecurity solutions.\n- DARPA network -- Quantum Key Distribution: DARPA network is an example of QKD networks.", "passages": [{"source": "Are Enterprises Ready for Quantum-Safe Cybersecurity", "page": 5, "text": "Parallel to the advances in PQC, Quantum Key Distribution offers a very different approach to secure communications. QKD uses quantum mechanics to exchange encryption keys between parties such that any eavesdropping on the quantum channel can be detected. When combined with one-time-pad encryption or with classical symmetric ciphers, QKD can theoretically provide provably secure communication, independent of an eavesdropper’s computing power [40–42]. This promise of “information-theoretic security” is enticing, especially for protecting extremely sensitive data (e.g. government or defense communications with long confidentiality requirements). Over the past five years, QKD technology has progressed from laboratory experiments to early commercial deployments. For instance, several real-world QKD networks have been demonstrated: financial institutions in Europe and Asia have piloted QKD links to secure"}, {"source": "QUANTUM KEY DISTRIBUTION - Bridging Theoretical Security Proofs, Practical Attacks, and Error Correction", "page": 1, "text": "standards of secure communications are derived from the last seven decades of information science and cryptography schemes such as public-key authentication. However, in the last three decades, the introduction of quantum computers has put the security of current communications in need of serious revision. Quantum Key Distribution (QKD) is one of the major candidates for secure communication in the age of quantum computers. QKD establishes shared secret keys between two parties, Alice and Bob, by exploiting the principles of quantum mechanics [1, 2]. Throughout the last couple of decades, the development of QKD networks has made great strides. Intercity networks such as the DARPA network [3], Trieste network [4], Tokyo network [5], etc., are prime examples of rapidly growing interest in the development of practical quantum networks. In addition to land-based arXiv:2511.20602v1 [quant-ph] 25 Nov 2025"}, {"source": "Are Enterprises Ready for Quantum-Safe Cybersecurity", "page": 2, "text": "These include lattice-based key encapsulation (e.g., CRYSTALS-Kyber) and digital signatures (e.g., CRYSTALS-Dilithium and SPHINCS+), which are built on mathematical problems believed to be quantum-resistant. The second category is quantum cryptography, particularly quantum key distribution (QKD), which leverages quantum physics (e.g. the properties of photons) to exchange encryption keys with theoretical information-theoretic security. QKD has seen experimental deployments in specialized networks (for example, financial institutions and government labs) and a growing number of vendors offer QKD products [5]. Together, these approaches form the backbone of “quantum cybersecurity solutions” that could protect data against quantum-enabled adversaries. However, the mere availability of PQC algorithms or QKD devices does not guarantee that enterprises are prepared to implement them [6,7]. True enterprise readiness spans technological,"}, {"source": "Are Enterprises Ready for Quantum-Safe Cybersecurity", "page": 7, "text": "Notably, research continues to push QKD forward: efforts are underway to integrate QKD with telecom networks (e.g., using wavelength-division multiplexing to send quantum and classical signals in the same fiber) [5], to improve distances via quantum repeaters (not yet practical, but quantum memory and entanglement swapping might extend range without trusted nodes in the future), and to develop standardized QKD protocols and certification criteria. Also, Quantum Random Number Generators (QRNGs) – a related technology – are already being used to bolster cryptographic systems by providing truly unpredictable keys, an example of quantum technology immediately useful within classical cryptography frameworks. In summary, the technologist perspective finds that quantum-safe solutions are emerging from concept to reality. Post-quantum cryptography is at the forefront, with multiple algorithms 7"}], "claims": ["QSDC involves sharing messages directly without the need to establish secret keys.", "QKD focuses on securely exchanging encryption keys.", "The DARPA network is an example of a practical QKD network.", "The Trieste network is an example of a practical QKD network.", "The Tokyo network is an example of a practical QKD network."]}, {"code": "A064", "question": "How are technology service providers using quantum resilience as a selling point?", "reference": "Certain VPN and secure communications products advertise that they are 'quantum-safe' by integrating PQC, and cloud companies like AWS, IBM and Microsoft have released tools for experimenting with PQC on their platforms.", "answer": "Technology service providers are using quantum resilience as a selling point by integrating Post-Quantum Cryptography (PQC) into their products. For example, certain Virtual Private Network (VPN) and secure communications products advertise their quantum-safe capabilities. Cloud companies like AWS, IBM, and Microsoft have also released tools for experimenting with PQC in their platforms.", "kg": null, "passages": [{"source": "Are Enterprises Ready for Quantum-Safe Cybersecurity", "page": 9, "text": "it signals that by the late 2020s, not having a plan will be deemed irresponsible. Another factor is client and market expectations: as large enterprises (e.g., global banks, cloud providers) start boasting of “quantum-resistant security” in their offerings, it may spur others to follow to avoid being seen as the weak link. Already, some technology service providers use quantum-resilience as a selling point; for example, certain VPN and secure communications products advertise that they are “quantum-safe” by integrating PQC, and cloud companies like AWS, IBM, and Microsoft have released tools for experimenting with PQC in their platforms. 3.2 Key Challenges in Implementation and Integration Even once an enterprise decides to act on quantum security, they encounter several practical challenges that can slow progress. Key among these are: (a) the complexity of identifying and upgrading legacy systems, (b) resource constraints (both budget and skilled personnel), (c)"}, {"source": "The-Quantum-Security-Deadline", "page": 9, "text": "European Journal of Computer Science and Information Technology, 13(52),35-52, 2025       Print ISSN: 2054-0957 (Print)   Online ISSN: 2054-0965 (Online)   Website: https://www.eajournals.org/   Publication of the European Centre for Research Training and Development -UK  43    A higher R(t) indicates greater quantum resilience. In practical terms, enterprises should target an  R(t)>0. (on a 0–1 scale) before the estimated Cryptographically Relevant Quantum Computer  (CRQC) horizon—currently projected around 2032 (Mosca, 2021; NIST, 2024).  The Quantum-Resilience Index, R(t), serves as a key performance metric for enterprise  adaptability in post-quantum environments. A higher R(t) indicates greater enterprise quantum  resilience, reflecting superior agility, automation, and cryptographic readiness against quantumera threats.    BUILDING THE FOUNDATION FOR QUANTUM-RESILIENT SECURITY  Quantum resilience requires a holistic, enterprise-wide approach that integrates discovery,"}, {"source": "Next-Generation Quantum Security - The Impact of Quantum Computing on Cybersecurity—Threats, Mitigations, and Solutions", "page": 1, "text": "transitioning to quantum-resilient frameworks. By synthesizing interdisciplinary research, this  work emphasizes the need for global collaboration, standardization, and innovation to safeguard  data integrity and privacy in the impending quantum era, making it a pivotal resource for  researchers, practitioners, and policymakers. 1. Introduction Quantum computing represents a paradigm shift in computational science, leveraging the principles of quantum mechanics— such as superposition and entanglement to solve problems that are computationally infeasible for classical systems [1–4]. This  ∗Corresponding author. E-mail addresses: sijjadali2021@email.szu.edu.cn (S. Ali), shuaib@lutar.my (S.A. Wadho), talpurkazim@utm.my (K.R. Talpur), talpurba@tcd.ie  (B.A. Talpur), ksalshudukhi@ju.edu.sa (K.S. Alshudukhi), mamoona.humayun@roehampton.ac.uk (M. Humayun), samartalpur@gmail.com (S.R. Talpur),"}, {"source": "Are Enterprises Ready for Quantum-Safe Cybersecurity", "page": 3, "text": "assessment that not only answers the research question but also guides stakeholders in preparing for the post-quantum era. In summary, as we stand at the cusp of a paradigm shift in cybersecurity, this work contributes an up-to-date review and strategic framework for understanding and enhancing enterprise readiness for quantum cybersecurity. The next sections delve into each perspective in detail, leveraging contemporary literature and industry data to illuminate where we stand and what comes next. 2 The Technologist Perspective: Quantum Cybersecurity Solution Maturity From the technologist or solution-provider viewpoint, we assess the maturity, practicality, and scalability of quantum-safe cybersecurity technologies as of mid-2020s. This includes evaluating the readiness of PQC algorithms for deployment and the state of quantum cryptography implementations like QKD. Key questions include: Have viable standards emerged? Are these solutions commercially available and easily integrable?"}], "claims": ["Technology service providers are using quantum resilience as a selling point.", "They are doing this by integrating Post-Quantum Cryptography (PQC) into their products.", "Certain Virtual Private Network (VPN) and secure communications products advertise their quantum-safe capabilities.", "Cloud companies like AWS, IBM, and Microsoft have released tools for experimenting with PQC in their platforms."]}, {"code": "A065", "question": "How does higher-order masking, used to protect Kyber implementations against side-channel attacks, split a sensitive variable into shares, and how does threshold secret sharing split a secret among participants?", "reference": "In ω-order masking a sensitive variable x is split into ω+1 shares combined by arithmetic addition (arithmetic masking) or XOR (Boolean masking); random masks x1..xω are drawn and the last share is x − (x1 + ... + xω) or x ⊕ x1 ⊕ ... ⊕ xω, and operations are done on the shares so x is never used directly and does not leak. In threshold secret sharing each participant receives a value f(xi) of a random polynomial of degree t−1 whose constant term is the secret S; any t or more participants can reconstruct S by Lagrange interpolation, while fewer than t learn nothing.", "answer": "Higher-order masking splits a sensitive variable into many partially randomized shares to hide the underlying arithmetic behavior of cryptographic algorithms. Threshold secret sharing partitions a secret into N shares that can only be decrypted in the presence of k keys, enhancing security by distributing the secret across different entities.", "kg": "Knowledge graph entities:\n- masking (DEFENSE): Countermeasure to lessen side-channel attacks.; Countermeasure used to protect against side-channel attacks.; Technique to shield CRYSTALS-Kyber from side-channel attacks.; Countermeasure to strengthen cryptographic syst\n- secret (CONCEPT): Secret value split into shares for masking.\n- Kyber (SYSTEM): Lattice-based cryptography system whose secret key is targeted by the attack.; A lattice-based cryptographic system.; Target of the two-step attack.; Cryptography system consisting of key generation, encryption, and decr\n- share (CONCEPT): A part of the sensitive variable in masking techniques.; A component of the secret or polynomial that is shared.; Implementation of the cryptographic system with varying degrees of security.\n- secret sharing (CONCEPT): Cryptographic method of sharing the concept of security across different entities.; Partitions a secret into N shares that can only be decrypted in the presence of k keys.; A method for distributing a secret amongst a gr\n- side-channel attack (ATTACK): Attacks exploiting physical implementations of cryptographic algorithms.; SCA is the context in which the CPA attack is used.; Side-channel attack used to recover secret keys.; Attack that could exploit side channels.; I\n- Threshold (METRIC): Logical error threshold for key acceptance.; If the observed error rate exceeds it, the key is discarded.\n- higher-order masked Kyber implementation (SYSTEM): Implementation of CRYSTALS-Kyber that was not easily breached using conventional AI techniques.\n\nKnowledge graph relations:\n- CRYSTALS-Kyber -- higher-order masked Kyber implementation: Higher-order masked Kyber implementations are more secure against conventional AI techniques.\n- masking -- CRYSTALS-KYBER specification: Masking is used to shield CRYSTALS-KYBER from side-channel attacks.\n- side-channel attack -- deep learning: Deep learning techniques have been successful in breaching first-order masked and shuffled CRYSTALS-Kyber implementations.\n- CRYSTALS-Kyber -- side-channel attack: CRYSTALS-Kyber is susceptible to side-channel attacks.; CRYSTALS-Kyber implementations have been found vulnerable to side-channel attacks.; Side-channel attacks pose a threat to Kyber.; Masking is used to defend CRYSTALS\n- masking -- CRYSTALS-Kyber: Masking will be utilized to shield CRYSTALS-Kyber from side-channel attacks.; Masking is a countermeasure to strengthen CRYSTALS-Kyber.\n- secret sharing -- threshold signatures: Secret sharing and threshold signatures are two cryptographic methods of sharing security.; Secret sharing and threshold signature schemes are two cryptographic methods of sharing security.; Both can improve security by \n- masking -- secret: Masking involves splitting a secret into many partially randomized shares.\n- Boolean masking -- Kyber: Boolean masking has been used to improve Kyber’s performance.\n- side-channel attack -- Kyber: Kyber mechanism guards against side-channel attacks.\n- Kyber -- side-channel leakage: Kyber is vulnerable to side-channel leakage during decryption.\n- Boolean masking -- share: Operations on shares are carried out independently in Boolean masking.\n- Kyber -- lattice attack: Lattice attack can recover secret key coefficients for Kyber.; 38/39 results are sufficient for Kyber.", "passages": [{"source": "Investigating CRYSTALS-Kyber Vulnerabilities - Attack Analysis and Mitigation", "page": 6, "text": "carefully prepared ciphertexts are now required [40]. 4. Masking Masking will be utilized to shield CRYSTALS-Kyber from side-channel attacks. In order to hide the underlying arithmetic behavior of the cryptographic algorithms, a countermeasure known as masking involves splitting a secret into many partially randomized shares (where fifth-order refers to the secret split five times). We will employ a technique called masking to fortify CRYSTALS-Kyber against side-channel attacks [41]. A common defense against power and electromagnetic side-channel investigation is masking. Fundamentally, masking entails dividing a hidden value into several shares at random. The algorithm processes these shares independently at each stage, recombining the results to yield the desired result. Working inside the masking domain stops sensitive variable, which depends on x information from leaking out because it is never"}, {"source": "Investigating CRYSTALS-Kyber Vulnerabilities - Attack Analysis and Mitigation", "page": 10, "text": "receive identical input data. Such a technique has the following advantages over masking: zero clock cycle overhead, immunity to glitches, universal coverage, and higher resilience to repetition assaults. 8. Conclusions The suggested key encapsulation system, CRYSTALS-Kyber, is confronting increasing difficulties due to advanced side-channel attacks. Current studies reveal weaknesses even in cases with strong security, necessitating ongoing defensive enhancements. Masking and shuffling are two countermeasures that are essential to strengthening cryptographic systems. The need to assess algorithms for both mathematical strength and resilience to outside attacks increases as we approach the post-quantum era. Instead of totally undermining a new wave of encryption, AI is a useful tool for handling noisy data and identifying their flaws. A power side-channel assault and a straight cryptography breach are very different from one another. Surprisingly, few traces"}, {"source": "Investigating CRYSTALS-Kyber Vulnerabilities - Attack Analysis and Mitigation", "page": 8, "text": "Cryptography 2024, 8, 15 8 of 13 can be abused and that businesses need to be mindful of the possible security threats it may provide. We should not be overly concerned about the security of the CRYSTALS-Kyber algorithm because this assault does not imply that it is “ruined” or “broken.” It seems doubtful that this kind of side-channel assault will be employed in actual attacks. We should be aware of the possible security threats that machine learning may provide, as it may be used to exploit these kinds of attacks. The algorithm remains safe, and corporations should not worry too much about it despite the attack against CRYSTALS-Kyber. Prior research has utilized artificial intelligence (AI) to breach first-, second-, and thirdorder masked Kyber implementations. However, it was very hard to break any higherorder masked implementations using conventional AI training and profiling techniques. By employing a new kind of deep learning and rotations on the intercepted message to raise"}, {"source": "Investigating CRYSTALS-Kyber Vulnerabilities - Attack Analysis and Mitigation", "page": 1, "text": "Abstract: Significant advancements have been achieved in the field of quantum computing in recent years. If somebody ever creates a sufficiently strong quantum computer, many of the public-key cryptosystems in use today might be compromised. Kyber is a post-quantum encryption technique that depends on lattice problem hardness, and it was recently standardized. Despite extensive testing by the National Institute of Standards and Technology (NIST), new investigations have demonstrated the effectiveness of CRYSTALS-Kyber attacks and their applicability in non-controlled environments. We investigated CRYSTALS-Kyber’s susceptibility to side-channel attacks. In the reference implementation of Kyber512, additional functions can be compromised by employing the selected ciphertext. The implementation of the selected ciphertext allows the attacks to succeed. Real-time recovery of the entire secret key is possible for all assaults."}], "claims": ["A sensitive variable is split into many partially randomized shares by higher-order masking.", "Higher-order masking is used to protect Kyber implementations against side-channel attacks.", "Threshold secret sharing partitions a secret into N shares.", "A secret can only be decrypted in the presence of k keys when using threshold secret sharing.", "Threshold secret sharing enhances security by distributing the secret across different entities.", "A secret is split among participants by threshold secret sharing."]}, {"code": "A066", "question": "How does the classical Hebbian learning rule update synaptic weights, and how does Spike-Time-Dependent Plasticity (STDP) take spike timing into account?", "reference": "The Hebbian rule ('cells that fire together wire together') updates a weight as the learning rate times the pre- and post-synaptic activities; for spike trains this is a dot product of binary activity vectors over time, which captures co-activation but not precise timing. STDP makes the update depend on the time difference between post- and pre-synaptic spikes with exponentially decaying terms: the weight is strengthened when the pre-synaptic spike likely caused the post-synaptic spike (correlated) and weakened when the pre-synaptic spike comes right after the post-synaptic one (anti-correlated).", "answer": "Classical Hebbian learning updates synaptic weights based on the coincident activity of pre- and post-synaptic neurons, as given by the formula: ∆wi j = η · xi · yj, where xi and yj represent the spike activities of the pre- and post-synaptic neurons, respectively, and η is a learning rate.\n\nSpike-Time-Dependent Plasticity (STDP) takes spike timing into account by adjusting synaptic weights according to the relative timing of pre- and post-synaptic spikes. Specifically, STDP strengthens weights when a pre-synaptic spike precedes a post-synaptic one, and weakens them when the order is reversed, as described by the formula: Δ𝑤= 𝜂+ 𝑒−|Δ𝑡|/𝜏+ if Δ𝑡> 0, and Δ𝑤= 𝜂−𝑒−|Δ𝑡|/𝜏− otherwise, where Δ𝑡 is the time difference between the spikes, and 𝜂+, 𝜂−, 𝜏+ and 𝜏− are learning rate parameters and time constants.", "kg": null, "passages": [{"source": "Spike Agreement Dependent Plasticity - A scalable Bio-Inspired learning paradigm for Spiking Neural Networks", "page": 4, "text": "classical STDP across multiple encoding schemes and network configurations. 2. Related research 2.1. Background of Hebbian Learning The Hebbian learning rule, often summarized as ”cells that fire together wire together” [15], updates synaptic weights based on the coincident activity of pre- and post-synaptic neurons. In its classical form, Hebbian plasticity updates the synaptic weight wi j as: ∆wi j = η · xi · yj, where xi and yj represent the spike activities (or rates) of the pre- and post-synaptic neurons, respectively, and η is a learning rate. When applied to temporally extended spike trains, this corresponds to a dot product of binary activity vectors over time: ∆wi j = η T X t=1 xi(t)y j(t) (1) which captures raw co-activation but not the precise timing or structure of spike trains. Several extensions of Hebbian learning have been proposed, including: 1. Oja’s rule [16]: A normalized variant to prevent runaway growth of weights."}, {"source": "Spiking neural networks and bio-inspired supervised deep learning - A survey", "page": 10, "text": "10 Lagani, et al. reverse order). Specifically, a possible STDP rule can be expressed as follows: Δ𝑤=   𝜂+ 𝑒−|Δ𝑡|/𝜏+ if Δ𝑡> 0 𝜂−𝑒−|Δ𝑡|/𝜏− otherwise (5) where 𝑤is the weight, Δ𝑡is the time difference between the post-synaptic and the pre-synaptic spike, 𝜂+ and 𝜂−are learning rate parameters (𝜂+ > 0 and 𝜂−< 0) and 𝜏+ and 𝜏−are time constants. Weight strengthening occurs when a pre-synaptic spike has been a likely cause for a post-synaptic spike, hence pre-synaptic and post-synaptic activations are correlated. If, instead, a pre-synaptic spike occurred right after a post-synaptic one, then the two activations are anti-correlated and a weight decrease occurs. Figure 5 shows the profile of a possible function that determines the dependency between Δ𝑤and Δ𝑡according to the STDP weight update rule. In this perspective, STDP realizes the Hebbian principle in the context of spiking neurons."}, {"source": "Deep learning in spiking neural networks", "page": 4, "text": "of bio-plausible learning rule that cannot be directly replicated in non-spiking networks. Neuroscientists have identiﬁed many variants of this learning rule that falls under the umbrella term spike-timing-dependent plasticity (STDP). Its key feature is that the weight (synaptic efﬁcacy) connecting a pre- and post-synaptic neuron is adjusted according to their relative spike times within an interval of roughly tens of milliseconds in length [74]. The information used to perform the weight adjustment is both local to the synapse and local in time. The following subsections describe common learning mechanisms in SNNs, both unsupervised and supervised. 1) Unsupervised Learning via STDP: As stated above, unsupervised learning in SNNs often involves STDP as part of the learning mechanism [74], [75]. The most common form of biological STDP has a very intuitive interpretation. If a presynaptic neuron ﬁres brieﬂy (e.g., ≈10 ms) before the postsynaptic neuron,"}, {"source": "Spike Agreement Dependent Plasticity - A scalable Bio-Inspired learning paradigm for Spiking Neural Networks", "page": 4, "text": "Several extensions of Hebbian learning have been proposed, including: 1. Oja’s rule [16]: A normalized variant to prevent runaway growth of weights. 2. BCM theory [17]: Introduces a sliding threshold for long-term potentiation (LTP) vs depression. 3. Rate-based Hebbian rules [18]: Widely used in continuous neural models but often lacking biological spike timing fidelity. Despite their simplicity and efficiency (linear-time updates, no spike-pair matching), Hebbian rules have several limitations in the context of neuromorphic and event-driven systems. However, most variants of Hebbian learning are designed for digital ratebased models and lack compatibility with device-level synaptic dynamics. 2.2. Background of STDP Spike-Timing-Dependent Plasticity (STDP) represents a fundamental mechanism of synaptic modification in the brain, characterized as a temporally asymmetric form of Hebbian learning. This process precisely adjusts the strength of connections between 4"}], "claims": ["Hebbian learning updates synaptic weights based on the coincident activity of pre- and post-synaptic neurons.", "The Hebbian learning rule is given by the formula: ∆wi j = η · xi · yj.", "xi represents the spike activity of the pre-synaptic neuron.", "yj represents the spike activity of the post-synaptic neuron.", "η is a learning rate.", "Spike-Time-Dependent Plasticity (STDP) takes spike timing into account.", "STDP adjusts synaptic weights according to the relative timing of pre- and post-synaptic spikes.", "STDP strengthens weights when a pre-synaptic spike precedes a post-synaptic one.", "STDP weakens weights when the order of spikes is reversed.", "STDP is described by the formula: Δ𝑤= 𝜂+ 𝑒−|Δ𝑡|/𝜏+ if Δ𝑡> 0.", "STDP is described by the formula: Δ𝑤= 𝜂−𝑒−|Δ𝑡|/𝜏− if Δ𝑡< 0.", "Δ𝑡 is the time difference between the spikes.", "𝜂+, 𝜏+ are learning rate parameters and time constants for strengthening weights.", "𝜂−, 𝜏− are learning rate parameters and time constants for weakening weights."]}, {"code": "A067", "question": "How does cyber deception affect attackers' behaviour, and what did evaluations of bidirectional deception and honeynets find?", "reference": "Deception increases attackers' cognitive burden, slowing attack progression, increasing operational mistakes and forcing more cautious, time-consuming and detectable approaches. Bidirectional deception, which camouflages authentic systems as honeypots alongside conventional honeypots, was found to increase attackers' uncertainty and improve defensive outcomes, and honeynets with many honeypots further confuse adversaries' ability to distinguish decoys from genuine systems.", "answer": "Cyber deception can significantly affect attackers' behavior by increasing their uncertainty and operational risk, slowing attack progression, and increasing the likelihood of mistakes. Evaluations found that honeypots and bidirectional deception techniques can achieve high detection rates, such as 67% in one study, with low false positive rates. Another study measured the cognitive load on attackers interacting with cyber deception, indicating that such strategies can effectively manipulate attacker perceptions and actions.", "kg": null, "passages": [{"source": "A Systematic Meta-Survey of Cyber Deception - Unified Taxonomy and Research Directions", "page": 9, "text": "cognitive burden slows attack progression, increases the likelihood of operational mistakes, and forces adversaries to adopt more cautious (and therefore likely more time-consuming and detectable) approaches [44, 66]. 3.2 Cyber-Deception Techniques Different cyber-deception techniques excel at achieving specific objectives, though many provide multiple benefits simultaneously. 3.2.1 Honeypots and Honeynets. Honeypots are functional, but decoy systems intentionally configured with apparent vulnerabilities to attract and engage attackers [60]. They range from low-interaction honeypots that simulate limited services (such as SSH or HTTP servers responding to basic commands) to high-interaction honeypots that provide complete operating systems and applications for attackers to explore. Honeynets extend this concept by creating entire networks of interconnected honeypot systems that simulate realistic organizational infrastructure [61]."}, {"source": "A Systematic Meta-Survey of Cyber Deception - Unified Taxonomy and Research Directions", "page": 3, "text": "2 Mongardini et al. the deliberate introduction of false, misleading, or ambiguous information and resources to manipulate attacker perceptions, decisions, and actions [13, 37]. The cyber-deception landscape spans a diverse array of techniques serving distinct strategic objectives. Honey tokens [8] and other fake credentials, database entries, or API keys act as high-fidelity tripwires for detection; interactive honeypots [60] and honeynets [61] provide controlled environments to observe and analyze adversary behavior [72]; tarpits deliberately slow connection attempts to exhaust automated scanning tools and botnets [3]; and Moving Target Defense (MTD) strategies dynamically alter the attack surface, invalidating reconnaissance data and forcing adversaries to re-scan and re-target systems [13, 55]. Beyond these technical mechanisms, advanced deception strategies exploit human cognitive biases through breadcrumbing [47], signaling [18], and psychological manipulation to guide attacker"}, {"source": "A Systematic Meta-Survey of Cyber Deception - Unified Taxonomy and Research Directions", "page": 9, "text": "8 Mongardini et al. 3.1.4 Increasing Attacker Uncertainty and Operational Risk. Perhaps the most strategic benefit of cyber-deception is its ability to fundamentally undermine attacker confidence and decision-making. When adversaries cannot reliably distinguish between genuine and deceptive resources, their reconnaissance data becomes suspect, their situational awareness degrades, and every action carries the risk of revealing their presence to defenders [55, 75]. This uncertainty compounds throughout the attack lifecycle. Attackers must question whether discovered vulnerabilities are real or honeypots, whether stolen credentials will provide access or trigger alerts, whether exfiltrated data is genuine or fabricated, and whether observed system configurations reflect reality or deliberate misdirection. This cognitive burden slows attack progression, increases the likelihood of operational mistakes, and forces adversaries to"}, {"source": "Evaluating Deception and Moving Target Defense with Network Attack Simulation", "page": 6, "text": "can incorporate honeypots. Other works rely on experiments with human subjects acting as attackers, such as Han et al., who evaluated web based decoys resulting in a detection rate of 67% of the 150 participants with a low rate of false positives [11] or Ferguson-Walter et al., who used a psychological approach to evaluate deception by measuring the cognitive load on human penetration testers while interacting with cyber deception [7]. Bensalem et al. considered deception as a defense against masquerade attacks, in which attackers pose as legitimate users, e.g. in identity theft [3]. Their method of deception consisted of monitored honeyfiles acting as a IDS. The evaluation was done by conducting scenario-based user studies, in which computer science students were tasked to play the role of a disgruntled employee, leveraging physical access to a co-workers workstation"}], "claims": ["Cyber deception can increase attackers' uncertainty and operational risk.", "Cyber deception can slow down attackers' attack progression.", "Cyber deception can increase the likelihood of attackers' mistakes.", "Honeypots can achieve high detection rates.", "Bidirectional deception techniques can achieve high detection rates.", "Bidirectional deception techniques can have low false positive rates.", "Cyber deception can effectively manipulate attackers' perceptions and actions.", "The cognitive load on attackers interacting with cyber deception can be high."]}, {"code": "A068", "question": "What does the VECTOR framework integrate into existing eviction methods to improve cache compression?", "reference": "VECTOR integrates reconstructability-aware approximation into existing eviction methods, extending binary retain/evict decisions into retention, approximation and eviction under the same memory budget.", "answer": "The VECTOR framework integrates reconstructability-aware approximation into existing eviction methods to improve cache compression.", "kg": null, "passages": [{"source": "A simple plug-in for improving eviction-based kv cache compression", "page": 3, "text": "• Empirical gains under strict memory budgets. Experiments on long-context benchmarks show that adding VECTOR to existing eviction baselines improves downstream performance in highcompression regimes across our evaluated settings. 2 Related Works KV Cache Compression Existing methods fall into three families. Eviction-based methods score tokens by importance and permanently discard low-scoring entries [5, 9, 10, 20, 11]. They are effective but operate as binary keep-or-drop policies, causing irreversible information loss under tight budgets. Quantization methods reduce bit-width across all cached entries [18, 21, 19, 14]. They are less destructive but bounded in compression ratio and often require hardware support. Approximation methods reconstruct KV representations through low-rank projection or residual modeling [22, 16, 17, 15]. Recent multi-state designs such as ARKV and D2O show that non-binary allocation increasingly matters under aggressive compression [12, 13]."}, {"source": "A simple plug-in for improving eviction-based kv cache compression", "page": 9, "text": "memory budgets: rather than merely shifting average scores upward, VECTOR changes the failure pattern from large contiguous low-score regions to more localized difficult cells, indicating improved robustness under challenging retrieval conditions. 6 Conclusion We propose VECTOR, a lightweight three-way allocation framework that integrates reconstructabilityaware approximation into existing eviction methods. By separating token importance from reconstructability, VECTOR extends binary retain/evict decisions into retention, approximation, and eviction under the same memory budget. The design is practical: value approximation is implemented with offline OLS calibration and does not require model retraining. Theoretical discussions are provided to connect the OLS R2 with the compression performance. Empirically, augmenting representative baselines with VECTOR improves long-context performance in most high-compression"}, {"source": "A simple plug-in for improving eviction-based kv cache compression", "page": 3, "text": "allocation increasingly matters under aggressive compression [12, 13]. Exploiting K–V Subspace Redundancy Since K and V are both projected from the same hidden state, their shared structure can be exploited for compression. MLA compresses token memory into a shared latent representation [23]. AQUA-KV and EliteKV leverage K/V dependency through residual quantization and joint low-rank projection, respectively [14, 15]. These works support the view that K–V asymmetry is a practically exploitable property. Relation to Our Method VECTOR is a plug-and-play augmentation for eviction-based pipelines, not a standalone compression method. Unlike approximation-oriented approaches [22, 16], it requires no architectural modification or retraining and preserves full compatibility with existing eviction backbones. Within the eviction family, VECTOR extends binary retain/evict decisions by introducing"}, {"source": "A simple plug-in for improving eviction-based kv cache compression", "page": 2, "text": "enables online value reconstruction from the stored keys, with low inference-time overhead. • A plug-and-play upgrade for eviction baselines. VECTOR can be attached to representative token-importance eviction methods (e.g., attention-score-based and key-geometry-based) with minimal integration adaptations. 2"}], "claims": ["The VECTOR framework integrates reconstructability-aware approximation.", "The VECTOR framework integrates this into existing eviction methods.", "The VECTOR framework integrates this to improve cache compression.", "The VECTOR framework improves cache compression."]}, {"code": "A069", "question": "In Shor's quantum algorithm for discrete logarithms, with what probability is each good (c, d) pair generated, and what fraction of the possible
