ong term, quantum simulation using quantum computers has great potential to wield a broad inﬂuence on the world [48, 49, 50]. Advances in quantum chemistry, facilitated by quantum computing, might precipitate the design of new pharmaceuticals,"}, {"source": "Quantum Computing in the NISQ era and beyond", "page": 13, "text": "Advances in quantum chemistry, facilitated by quantum computing, might precipitate the design of new pharmaceuticals, and new catalysts that improve the eﬃciency of nitrogen ﬁxation or carbon capture. New materials arising from quantum simulations might lead to more eﬀective power transmission or improved collection of solar energy. We probably lack the imagination to anticipate the most transformative discoveries which will ﬂow from more powerful quantum simulators. But this promise is not so likely to be fulﬁlled in the NISQ era, because quantum algorithms for accurately simulating large molecules and exotic materials may be too expensive to succeed without error correction. Classical computers are especially bad at simulating quantum dynamics — that is, predicting how a highly-entangled quantum state will change with time. Quantum computers have a big advantage for that task, and physicists hope to learn interesting things about"}], "claims": ["Quantum computers can handle highly entangled quantum states.", "Classical computers struggle with highly entangled quantum states.", "The precision of quantum state manipulation could potentially give quantum computers more power than classical computers.", "The precision of quantum state manipulation is currently uncertain.", "The exact precision required for quantum computers to outperform classical computers is not yet clear.", "It is not yet clear which architectures can achieve the required precision for quantum computers to outperform classical computers."]}, {"code": "A026", "question": "How has research on quantum machine learning for quantum key distribution evolved, and what risk do QML-based applications themselves face in 6G networks?", "reference": "Research on eavesdropping detection and security analysis of QKD protocols with QML has increased significantly since 2010, aiming at more robust and intelligent cryptographic applications. Despite their learning capabilities, QML-based applications face several emerging security threats, including adversarial threats, which motivates studying QML for 6G network intelligence and its attacks.", "answer": "Research has integrated machine learning with quantum key distribution protocols to optimize communication security. However, QML-based applications in 6G networks face adversarial attacks, making them vulnerable.", "kg": "Knowledge graph entities:\n- machine learning (CONCEPT): Field essential for quantum machine learning.; Machine learning processes are accelerated by quantum hardw\n- Quantum Key Distribution (PROTOCOL): Integrated with ML to optimize communication security.; System for quantum communication.; Methods to ens\n- QML-based 6G resource allocation (DEFENSE): Quantum Machine Learning for 6G resource allocation.\n- key QML algorithms (ALGORITHM): Key algorithms in quantum machine learning.\n\nKnowledge graph relations:\n- security risks -- Quantum Machine Learning: Security risks exist in QML algorithms for 6G networks.\n- Quantum Machine Learning -- 6G networks: QML-based applications benefit from 6G networks.; QML assists 6G network services.\n- Quantum Machine Learning -- 6G: QML can enhance 6G applications.\n- Quantum Key Distribution -- Quantum Machine Learning: Integrated ML with quantum key distribution protocols.; QML algorithms improve the key generation of QKD.\n- Quantum Machine Learning -- adversarial attacks: QML-based 6G core functions and applications are vulnerable to adversarial attacks.\n- Quantum Machine Learning -- quantum hardware: Current quantum hardware has limitations for QML.; Advancements in quantum hardware capacity benefit QML.", "passages": [{"source": "Quantum Machine Learning for 6G Network", "page": 2, "text": "However, the security risks in the QML algorithms for AI-aided network core functions and related applications beyond QKD are not discussed. Unlike prior studies on secure quantum communications and classical security in quantum-hybrid machine learning,, this work focuses on adversarial attacks against QML-based 6G core functions and applications. The next section provides a brief overview of QML’s role in 6G networks and details its potential vulnerabilities with relevant application examples. A GLANCE OF QML FOR 6G NETWORK INTELLIGENCE AND STANDARDIZATION EFFORTS"}, {"source": "A Survey of Quantum Machine Learning - Foundations,Algorithms, Frameworks, Data and Applications", "page": 25, "text": "In addition, and explored parametrized quantum circuit models and quantum algorithms to improve the interpretability and efficiency of machine learning models. Rana et al. and Li et al. applied QSVM and QNN to handwritten character recognition and supervised classification tasks, respectively, showing improvements in accuracy and efficiency. integrated ML with quantum key distribution protocols to optimize communication security, while the authors of, developed frameworks for blind QML, guaranteeing privacy in ML task delegation."}, {"source": "Quantum Machine Learning for Cybersecurity", "page": 2, "text": "The taxonomy of QML algorithms for the domain of cybersecuerity have been summarized in Figure 1. The combined capabilities highlighted above show how QML plays a key role in future advancements in cybersecurity. This review aims to critically evaluate the real-world impacts of QML in closing gaps in cyber-threat detection, incident response, and system resilience, covering supervised, unsupervised, as well as hybrid quantum-classical modes. This review also discusses practical limitations that arise from things such as noise and scaling issues in current quantum hardware, the overhead caused by feature-mapping processes,"}, {"source": "Quantum Machine Learning for Cybersecurity", "page": 2, "text": "Generative models based on quantum computing can simulate realistic attack traces and counterfactual scenarios, making them excellent for red-team training and pre-deployment stress testing. QML approaches are not only good at detection but also at combinatorial and stochastic optimisation, such as key-rotation scheduling and attack-graph path forecasting."}], "claims": ["Research has integrated machine learning with quantum key distribution protocols.", "QML-based applications in 6G networks face adversarial attacks.", "QML-based applications in 6G networks are vulnerable."]}, {"code": "A027", "question": "For the encrypted traffic classification approach that converts each packet into a normalized byte sequence fed to a 1-D CNN and stacked auto-encoders, how well did it perform on VPN and on Tor traffic?", "reference": "It categorized unencrypted and VPN traffic well (around 93-94% average recall) without time-related features, but on the unencrypted vs. Tor dataset average recall dropped to 57% and average precision to 44%.", "answer": "For the unencrypted vs. VPN traffic, the approach performed well with 94% average recall and 93% average precision. However, for the unencrypted vs. Tor traffic, there was a significant drop in performance, with average recall down to 57% and average precision down to 44%.", "kg": null, "passages": [{"source": "End-to-end Encrypted Traffic Classification with One-dimensional Convolution Neural Networks", "page": 6, "text": "the effectiveness of our proposed end-to-end encrypted  traffic classification method with 1D-CNN.  V. DISCUSSION  Our proposed end-to-end encrypted traffic classification  method can leave out traditional steps, such as feature  design, features extraction and features selection which are  commonly used in traditional divide-and-conquer method. It  uses 1D-CNN to automatically learn more representative  features of encrypted traffic. The experiment results obtain  better performance than the state-of-the-art method. There  are three problems to be further studied in the future work.  Firstly, about traffic representation, we use the first 748  bytes of each session as raw traffic. Because different  classes of traffic have different types of packets, the more  appropriate byte number needs to be further studied.  Secondly, about model training, the current training data is  imbalanced which has a great effect on experiment  performance. For example, VPN-VoIP traffic has 6000"}, {"source": "Encrypted Internet Traffic Classification Using a Supervised Spiking Neural Network", "page": 2, "text": "the former containing both VPN and unencrypted trafﬁc, and the latter containing both Tor and unencrypted trafﬁc. In [25] each packet (header and payload) is converted to a normalized byte sequence and used as an input for a 1-D convolutional neural network and a set of stacked auto-encoders. Both are trained with unencrypted and VPN-encrypted trafﬁc. Surprisingly, the resulting networks can categorize trafﬁc for both unencrypted and VPN trafﬁc without using time-related features (but size). Performance is quite good with 94% average recall and 93% average recall. Unfortunately, for the unencrypted vs. Tor dataset, there is an important drop in average recall (down to 57%) and average precision (down to 44%). The Flowpic approach [10] uses all spatial and temporal information contained in a trafﬁc ﬂow without looking at its content."}, {"source": "Encrypted internet traffic classification using a supervised spik¬ing neural network", "page": 2, "text": "the former containing both VPN and unencrypted trafﬁc, and the latter containing both Tor and unencrypted trafﬁc. In [25] each packet (header and payload) is converted to a normalized byte sequence and used as an input for a 1-D convolutional neural network and a set of stacked auto-encoders. Both are trained with unencrypted and VPN-encrypted trafﬁc. Surprisingly, the resulting networks can categorize trafﬁc for both unencrypted and VPN trafﬁc without using time-related features (but size). Performance is quite good with 94% average recall and 93% average recall. Unfortunately, for the unencrypted vs. Tor dataset, there is an important drop in average recall (down to 57%) and average precision (down to 44%). The Flowpic approach [10] uses all spatial and temporal information contained in a trafﬁc ﬂow without looking at its content."}, {"source": "Enhancing encrypted HTTPS traffic classification based on stacked deep ensembles models", "page": 3, "text": "93.31%, respectively. The results outperformed state-of-the-art methods, demonstrating that packet block image  representation combined with CNNs is an effective approach for encrypted traffic classification in VPN and TLS  contexts. Shi et al.17 recognized the shortcomings of existing encrypted traffic classification methods, where traditional  ML depends heavily on feature engineering, deep learning approaches often require large amounts of labeled  data, and pretrained models overlook local traffic features. To address these gaps, they proposed the BERT-based  Byte-level Feature Convolutional Network (BFCN), which integrates global and local traffic representations. The  model consists of two modules: a BERT-based packet encoder that captures global features through attention  mechanisms, and a CNN module that extracts byte-level local features. These representations are concatenated to"}], "claims": ["The approach performed well on unencrypted vs. VPN traffic.", "The approach had 94% average recall on unencrypted vs. VPN traffic.", "The approach had 93% average precision on unencrypted vs. VPN traffic.", "The approach had a significant drop in performance on unencrypted vs. Tor traffic.", "The approach had 57% average recall on unencrypted vs. Tor traffic.", "The approach had 44% average precision on unencrypted vs. Tor traffic."]}, {"code": "A028", "question": "How is the trojan gate attack on quantum circuit models for 6G resource allocation constructed, and why is it stealthy?", "reference": "Adversarial perturbations are inserted as subcircuits into regions of the quantum circuit model with limited error detection; the natural noise and decoherence of quantum systems mask these perturbations, making errors hard to attribute to malicious interference.", "answer": "The trojan gate attack on the quantum circuit model for 6G resource allocation is constructed by embedding a trojan gate in subcircuits with limited error detection capabilities. This makes it difficult to attribute errors to malicious interference, enhancing the stealthiness of the attack.", "kg": "Knowledge graph entities:\n- Trojan gate (ATTACK): Trojan gate is embedded in low-error-detection regions by the proposed adversarial attack.\n- quantum circuit model (SYSTEM): Model with trojan gate and adversarial perturbation.\n- Resource allocation (ALGORITHM): Potential application in 6G that can be enhanced with quantum computing and QML algorithms.\n- attack (ATTACK): Based on estimates of quantum and classical gate counts for attack, rather than assessing security algorithms with a sp\n\nKnowledge graph relations:\n- QML-based 6G resource allocation -- Trojan gate: QML-based 6G resource allocation is vulnerable to Trojan gate attacks.\n- quantum circuit model -- Trojan gate: Trojan gate is integrated into the quantum circuit model.\n- Quantum Key Distribution -- Trojan-horse attack: QKD systems can be attacked through Trojan-horse attacks.\n- Quantum Key Distribution -- Trojan-horse injection: QKD can be vulnerable to Trojan-horse injections.\n- Trojan-horse attack -- BKM07 semi-quantum key distribution protocol: BKM07 protocol is targeted by Trojan-horse attack.\n- quantum circuit -- intrusion and anomaly detection: Maps VQCs to core cybersecurity tasks.", "passages": [{"source": "Quantum Machine Learning for 6G Network", "page": 4, "text": "implemented on open-source quantum-inspired real-time optimization techniques for 6G networks [1]. Accordingly, the quantum circuit model is poised with a trojan gate, adversarial perturbation in subcircuits integrated into regions of the model with limited error detection capabilities. The natural presence of noise and decoherence in quantum systems masks these perturbations, making it difﬁcult to attribute errors to malicious interference and enhancing the stealthiness of the attack. The original QML model for resource allocation uses deep reinforcement learning (DRL) with a variational quantum eigensolver (VQE) and parametrized quantum policies. It incorporates Hamiltonian components and leverages a Qiskit runtime estimator to enhance prediction accuracy in classical optimizers. The dataset is derived from the source provided in [14]. The quantum superposition state space ρ includes"}, {"source": "Quantum Machine Learning for Cybersecurity", "page": 1, "text": "Quantum Circuits (VQCs), and Quantum Generative Adversarial Networks (QGANs), and discusses the contributions of this paper in relation to existing research in the field and how it improves over them. It also maps these methods across supervised, unsupervised, and generative learning paradigms, and to core cybersecurity tasks, including intrusion and anomaly detection, malware and botnet classification, and encrypted-traffic analytics. It also discusses their application in the domain of cloud computing security, where QML can enhance secure and scalable operations. Many limitations of QML in the domain of cybersecurity have also been discussed, along with the directions for addressing them. I. INTRODUCTION Digital infrastructure has expanded rapidly in the last decade. While this has led to better connectivity and delivery of service, it has also resulted in increased exposure to complex cyber threats. In modern economies, various systems such"}, {"source": "Quantum Machine Learning for 6G Network", "page": 4,
