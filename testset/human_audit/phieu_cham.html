for 6G resource allocation.", "The trojan gate attack is constructed by embedding a trojan gate in subcircuits.", "The subcircuits have limited error detection capabilities.", "It is difficult to attribute errors to malicious interference.", "The trojan gate attack is stealthy.", "The stealthiness of the attack is enhanced by the limited error detection capabilities."]}, {"code": "A029", "question": "Which layers make up the spiking convolutional encoder in SCNNTraffic?", "reference": "The encoder applies Conv1d, then BatchNorm, then a LIF spiking neuron, then MaxPool to the embedded packet payload vector: encoder(p) = MaxPool(LIF(BatchNorm(Conv1d(p)))).", "answer": "The spiking convolutional encoder in SCNNTraffic primarily consists of two 3×1 1D CNNs.", "kg": null, "passages": [{"source": "SCNNTraffic - A lightweight and energy-efficient traffic classification method based on spiking convolution neural networks", "page": 3, "text": "power usage. Inspired by these advancements, this study incorpo­ rates spiking neurons, leveraging their inherent character­ istics–such as event-driven processing and sparse temporal  coding–to improve model performance and reduce power  consumption. 3  Method As depicted in Fig. 1, SCNNTraffic framework primarily  comprises four key components: a convolutional encoder, a  spiking convolutional encoder, a cross-gating unit based on  spiking neurons, and a classifier. In the following sections,  this paper will provide a detailed introduction to the model’s  principles and functionalities. 3.1  Traffic representation Network traffic is composed of one-dimensional byte  streams, where bytes, packets, sessions, and entire flows  correspond to characters, words, sentences, and documents  in NLP, respectively. Therefore, we adopt a text-based for­ mat as the input representation for packets. Encrypted net­ work traffic exhibits significant variability depending on the"}, {"source": "SCNNTraffic A lightweight and energy-efficient traffic classification method based on spiking convolution neural networks", "page": 3, "text": "power usage. Inspired by these advancements, this study incorpo­ rates spiking neurons, leveraging their inherent character­ istics–such as event-driven processing and sparse temporal  coding–to improve model performance and reduce power  consumption. 3  Method As depicted in Fig. 1, SCNNTraffic framework primarily  comprises four key components: a convolutional encoder, a  spiking convolutional encoder, a cross-gating unit based on  spiking neurons, and a classifier. In the following sections,  this paper will provide a detailed introduction to the model’s  principles and functionalities. 3.1  Traffic representation Network traffic is composed of one-dimensional byte  streams, where bytes, packets, sessions, and entire flows  correspond to characters, words, sentences, and documents  in NLP, respectively. Therefore, we adopt a text-based for­ mat as the input representation for packets. Encrypted net­ work traffic exhibits significant variability depending on the"}, {"source": "Deep learning in spiking neural networks", "page": 10, "text": "spiking CNNs. A convolutional/pooling layer trained by a local spike-based representation learning algorithm is shown in Fig. 5. Hand-crafted convolutional kernels have been used in the ﬁrst layer of a number of spiking CNNs that have obtained high classiﬁcation performance [59], [84], [60], [169], [170]. Difference-of-Gaussian (DoG) is a common hand-crafted ﬁlter that is used to extract features in the early layers of SNNs. This choice is biomotivated to mimic inputs to the mammalian primary visual cortex. A recent study has used a layer of DoG ﬁlters as input layer of an SNN that is followed by more convolutional/pooling layers trained by STDP [170]. This network architecture extracted visual features that were sent to an SVM classiﬁer, yielding accuracy of 98.4% on MNIST. To train convolutional ﬁlters, layerwise spiking representation learning approaches have been implemented in recent spiking CNNs [171], [172], [173], [174]. Tavanaei et al. (2017) [171], [172] used"}, {"source": "SCNNTraffic - A lightweight and energy-efficient traffic classification method based on spiking convolution neural networks", "page": 4, "text": "through the convolutional encoder, L × d are the byte  length and embedding dimension, and Conv1d is composed  of two 3×1 1D CNNs. 3.3  Spiking Convolutional Encoder The payload consists of randomized, encrypted data that  exhibits significant inter-byte correlations. Since spiking  neurons are particularly adept at handling time-varying  sequences and can produce more spikes in response to pay­ load data with substantial variations, this paper employs a  spiking convolutional encoder for the downsampling and  encoding of payload data. 3.3.1  Spiking neurons The spiking neuron model serves as a mathematical repre­ sentation of biological neuronal behavior. In this study, we  1 3 52  Page 4 of 17"}], "claims": ["The spiking convolutional encoder in SCNNTraffic primarily consists of two 3×1 1D CNNs."]}, {"code": "A030", "question": "Which conventional public key cryptography methods are described as susceptible to quantum risks in the survey of pre- versus post-quantum security for 5G-enabled IoT?", "reference": "RSA, Diffie-Hellman, Secret Sharing, and Elliptic Curve Cryptography (ECC).", "answer": "The survey describes conventional public key cryptography methods such as RSA, Diffie-Hellman, Secret Sharing, and Elliptic Curve Cryptography (ECC) as susceptible to quantum risks.", "kg": null, "passages": [{"source": "A_Comprehensive_Survey_on_Pre_Versus_Post_Quantum_Security_Schemes_for_5G-Enabled_IoT_Applications", "page": 4, "text": "B. Choudhury et al.: Comprehensive Survey on Pre Versus Post Quantum Security Schemes TABLE 2. Comparative analysis of state-of-the-art surveys at a glance. 2) We summarize the emerging trend of 5G and Digital twin and emphasize their impact in the context of IoT Applications. 3) We provide a detailed review of attacks and cryptographic solutions proposed as a countermeasure while analyzing their feasibility in practical implementation and computational and communication overheads. 4) We add a new classification of solutions: traditional public key schemes and post-quantum public key schemes to secure the 5G-enabled IoT subsystems and provide a contrast between the two approaches. B. COMPOSITION OF THE SURVEY We value the time of our readers and have conscientiously crafted this survey by following an organized and systematic procedure. In the initial phases, we consulted renowned journals’ databases such as IEEE, Elsevier, Wiley, ACM Digital Library, Springer,"}, {"source": "A_Comprehensive_Survey_on_Pre_Versus_Post_Quantum_Security_Schemes_for_5G-Enabled_IoT_Applications", "page": 9, "text": "B. Choudhury et al.: Comprehensive Survey on Pre Versus Post Quantum Security Schemes FIGURE 4. Attacks in IoT Network. TABLE 5. Summary of security risks and challenges. 7) Availability 8) Resilience against quantum threats To ensure these standards in the 5G-empowered network, many researchers have carried out careful experiments and proposed cryptographic solutions. We explore the potential solutions in the subsequent sections. V. TAXONOMY OF CRYPTOGRAPHY SOLUTIONS AGAINST SECURITY BREACHES IN 5G-ENABLED IoT SYSTEMS Many potential solutions have been proposed in the field of 5G-empowered security, which requires a systematic organization for acquiring meaningful insights from these diverse research components. In the past, many researchers, [22], [23], [24], [25], [26], [27], [28], [29], [30] presented a taxonomy of solutions based on machine learning and deep learning-based approaches. These surveys did not highlight any cryptographic solutions and are limited to intrusion"}, {"source": "A_Comprehensive_Survey_on_Pre_Versus_Post_Quantum_Security_Schemes_for_5G-Enabled_IoT_Applications", "page": 3, "text": "B. Choudhury et al.: Comprehensive Survey on Pre Versus Post Quantum Security Schemes TABLE 1. List of abbreviations. • Hybrid Schemes: Hybrid schemes combining both pre and post quantum cryptography for efficient implementation and backward compatibility is yet to be standardised. • Risk Assessment Frameworks and Mitigation Measures: Thorough risk analysis and proactive steps to guarantee the resilience and reliability of 5G IoT security structures should be the default requirement of any solution. • AI Integration: Although AI is being integrated in a big way, but several challenges still remain such as the availability of 5G Specific dataset, model security, transparency through XAI and use of pretrained model. • Real Time Requirements: Many applications and core operations of 5G IoT have real time constraints. Design of PQC algorithms with complex computations running on resource constrained IoT devices for real time applications is hard to achieve."}, {"source": "A_Comprehensive_Survey_on_Pre_Versus_Post_Quantum_Security_Schemes_for_5G-Enabled_IoT_Applications", "page": 1, "text": "ABSTRACT The proliferation of 5th generation (5G) technology has catalyzed significant advancements in various application of Internet of Things (IoT) such as Intelligent Transportation Systems, Smart Energy, Industrial IoT (IIoT), Digital Twins, Autonomous Aerial Vehicles (UAVs) and Smart Health. However, with the upcoming advent of quantum computing, conventional security methods are encountering new and significant challenges, requiring the revaluation of pre and post-quantum security measures. This study provides an in-depth analysis of security measures before and after the advent of quantum computing for intelligent IoT applications enabled by 5G-connected network. The survey thoroughly analyzes the strengths and weaknesses of conventional public key cryptography methods such as RSA, Diffie-Hellman, Secret Sharing, and Elliptic Curve Cryptography (ECC), which are susceptible to quantum risks, and postquantum"}], "claims": ["The survey describes conventional public key cryptography methods.", "RSA is susceptible to quantum risks.", "Diffie-Hellman is susceptible to quantum risks.", "Secret Sharing is susceptible to quantum risks.", "Elliptic Curve Cryptography (ECC) is susceptible to quantum risks."]}, {"code": "A031", "question": "How does ZoMBI improve Bayesian optimization on needle-in-a-haystack problems compared with standard Bayesian optimization?", "reference": "ZoMBI zooms the search bounds inward and prunes redundant memory points, so the needle-like optimum region is resolved accurately aligned with the true target, whereas standard Bayesian optimization does not progress significantly after 10 additional experiments.", "answer": "ZoMBI improves Bayesian optimization on needle-in-a-haystack problems by iteratively zooming into the search bounds based on the m best performing previously sampled points, thus converging quickly to narrow and sharp optima. It also prunes low-performing historical experiments to speed up computation, leading to faster convergence compared to standard methods like MiP-EGO, TuRBO, and HEBO.", "kg": null, "passages": [{"source": "Fast bayesian optimization of needle-in-a-haystack problems using zooming memory-based initialization (zombi)", "page": 15, "text": "Fast Bayesian Optimization of Needle-in-a-Haystack Problems using Zooming Memory-Based Initialization 5 Summary & Conclusions In this paper, we proposed the [Zo]oming [M]emory-[B]ased [I]nitialization (ZoMBI) algorithm that builds on the principles of Bayesian optimization to accelerate the optimization of Needle-in-a-Haystack problems by two-fold, ﬁrstly by requiring fewer experiments to achieve better optimum faster than existing MiP-EGO [45], TuRBO [39], and HEBO [50] on a variety of real-world applications, and secondly by pruning the memory of low-performing historical experiments to speed-up compute time. The ZoMBI algorithm convergences onto narrow and sharp optima quickly in Needle-in-a-Haystack datasets by (1) using the values of the m best performing previously sampled memory points to iteratively zoom in the search bounds of the manifold uniquely on each dimension and (2) implementing two"}, {"source": "Fast bayesian optimization of needle-in-a-haystack problems using zooming memory-based initialization (zombi)", "page": 4, "text": "Fast Bayesian Optimization of Needle-in-a-Haystack Problems using Zooming Memory-Based Initialization Figure 2: Accelerated Convergence to True Target using ZoMBI. Using a standard Bayesian optimization procedure, the discovery of a Needle-in-a-Haystack condition does not progress signiﬁcantly after 10 additional experiments from the initial GP guess. However, using ZoMBI to zoom the bounds inward and prune redundant memory points, the needle-like optimum region is resolved to be accurately aligned with the true target. (a) The true target to optimize, which is a slice from the 6D Poisson’s Ratio dataset, (b) The initial guess of the target function using a GP surrogate with 20 randomly sampled experiments, (c) (top) The estimated target resolved by standard BO after 10 additional experiments sampled using a greedy LCB acquisition function (β = 0.1); (bottom) the estimated target resolved by"}, {"source": "Fast bayesian optimization of needle-in-a-haystack problems using zooming memory-based initialization (zombi)", "page": 1, "text": "FAST BAYESIAN OPTIMIZATION OF NEEDLE-IN-A-HAYSTACK PROBLEMS USING ZOOMING MEMORY-BASED INITIALIZATION (ZOMBI) Alexander E. Siemenn∗ Department of Mechanical Engineering Massachusetts Institute of Technology Cambridge, MA 02139, USA asiemenn@mit.edu Zekun Ren Department of Electrical and Computer Engineering Singapore-MIT Alliance for Research and Technology Singapore 138602, Singapore Xinterra Singapore 139949, Singapore Qianxiao Li Department of Mathematics National University of Singapore Singapore 138602, Singapore Tonio Buonassisi Department of Mechanical Engineering Massachusetts Institute of Technology Cambridge, MA 02139, USA ABSTRACT Needle-in-a-Haystack problems exist across a wide range of applications including rare disease prediction, ecological resource management, fraud detection, and material property optimization. A Needle-in-a-Haystack problem arises when there is an extreme imbalance of optimum conditions"}, {"source": "Fast bayesian optimization of needle-in-a-haystack problems using zooming memory-based initialization (zombi)", "page": 5, "text": "Fast Bayesian Optimization of Needle-in-a-Haystack Problems using Zooming Memory-Based Initialization it is located within a narrow and steep basin of attraction. Precisely, the needle optimum for each problem has a value of y = 0 for the Ackley function (minimization), y = −1.7 for Poisson’s ratio dataset (minimization), y = 1.9 for the thermoelectric merit dataset (maximization), and y = −12 for the wildﬁre detection dataset (minimization). To extend the applicability of ZoMBI optimization performance results to a wider array of applications, additional stress tests are conducted on 174 analytical datasets. First, a set of 144 analytical datasets are optimized to assess the failure and success conditions of ZoMBI on problems with extremely narrow optima and few initialization data points. Then, in the Supplemental Information, a set of 30 analytical datasets are optimized to assess the failure and success conditions"}], "claims": ["ZoMBI improves Bayesian optimization on needle-in-a-haystack problems.", "ZoMBI iteratively zooms into the search bounds based on the m best performing previously sampled points.", "ZoMBI converges quickly to narrow and sharp optima.", "ZoMBI prunes low-performing historical experiments to speed up computation.", "ZoMBI leads to faster convergence compared to standard methods like MiP-EGO, TuRBO, and HEBO."]}, {"code": "A032", "question": "What technique can be used in a blockchain-IoT environment to obscure the information of the sender transferring coins?", "reference": "Ring signatures, which let a signer sign on behalf of a ring of members so the verifier can validate the signature without knowing which member signed (as used in Monero), obscuring the sender's information.", "answer": "Monero can be used to obscure the information of the sender transferring coins using ring signatures in a blockchain-IoT environment.", "kg": "Knowledge graph entities:\n- Blockchain-IoT (SYSTEM): A new blockchain-based concept called Blockchain-IoT (BCIoT) emerged from utilizing blockchain in the IoT context.; BCIoT is the intersection of blockchain and IoT.; System that integrates blockchain with IoT ecosystem.;\n- blockchain (SYSTEM): Technology for ensuring digital trust.; Distributed ledger technology.; Technologies that can address security concerns.; Infrastructure providing trustless security mechanisms.; Used in IoT ecosystems.; A technology use\n- Monero (SYSTEM): Information of the sender(signer) transferring coins is obscured using ring signatures.\n- IoT networks (SYSTEM): Identity-based post-quantum signatures can be used for blockchain-based identity management in IoT networks.\n- eavesdropper (ATTACK): Motivated Gupta et al. to propose a blockchain-based scheme.; Could potentially clone the quantum state and obtain the key.; Eve can perform an attack on either or both of the channels to gain maximum knowledge.; Force a\n- quantum-resistance blockchain (SYSTEM): Technique to integrate into IoT ecosystems for post-quantum security.\n- blockchain-based identity management (DEFENSE): Identity-based post-quantum signatures can be used for blockchain-based identity management in IoT networks.\n- post-quantum blockchain-based IoT scheme (SYSTEM): Table IX compares details of post-quantum blockchain-based IoT schemes.; System that integrates post-quantum cryptography with IoT devices.\n\nKnowledge graph relations:\n- blockchain -- privacy-preserving: Privacy-preserving attention along with transparency is needed for blockchain in IoT.\n- post-quantum blockchain-based IoT scheme -- IoT: The proposed method is intended for IoT environments.\n- post-quantum blockchain-based IoT scheme -- Bitcoin: The proposed method is compared to Bitcoin for efficiency.\n- blockchain -- IoT security: Blockchain can address IoT security challenges.\n- blockchain -- IoT environments: Blockchains are examined in IoT environments.\n- blockchain -- eavesdropping: Blockchain can reduce the impact of eavesdropping attacks.\n- blockchain -- IoT: Blockchain can be implemented in the IoT.; Blockchain is usable in many applications in IoT networks.; Blockchain applications can be used in the IoT field.; Blockchain can be used in IoT contexts with inadequate resourc\n- post-quantum blockchain-based IoT scheme -- blockchain: The scheme defends the blockchain’s transactions against quantum attacks.\n- Blockchain-IoT -- smart city: Blockchain can serve smart cities as an end-to-end application.\n- Post-Quantum Cryptography -- blockchain: PQC algorithms can be used to secure IoT networks.\n- blockchain -- Fog and Cloud IoT: Blockchain is used in Fog and Cloud IoT applications.\n- Blockchain-IoT -- industrial IoT: Blockchain can serve industrial IoT as an end-to-end application.", "passages": [{"source": "Post-Quantum_Blockchain_Security_for_the_Internet_of_Things_Survey_and_Research_Directions", "page": 17, "text": "applications, in which a novel post-quantum PoW algorithm was proposed for the security of its ecosystem. Meanwhile, a quantum-safe identity-based signature is incorporated into the transaction process to provide lightweight transactions and defend the blockchain’s transactions against potential quantum attacks. Compared to Bitcoin, the proposed method is more efﬁcient and executes three times as many transactions per second because of the shorter block interval generation. However, there are some concerns regarding the scalability and high computational costs of PoW mechanisms for implementation in IoT environments. Table IX provides additional information about this and other proposals. It brieﬂy compares the details of post-quantum blockchain-based IoT schemes. It distinguishes the IoT application, data ledger structure, type, and subtype of post-quantum signatures employed in each of these studies, along with their contributions and overlooked aspects."}, {"source": "Post-Quantum_Blockchain_Security_for_the_Internet_of_Things_Survey_and_Research_Directions", "page": 20, "text": "blockchains to play an authority role [25]. These cryptosystems can be a good choice for distributed authentication in IoT contexts with inadequate resources. Currently, identitybased post-quantum signatures have been presented that can be used for blockchain-based identity management in IoT networks [190], [191]. E. Privacy vs. Transparency Blockchain makes transactions transparent in its network, and secondary information can be seen by participant nodes like sender, recipient or data value. This makes some applications, like banking, more reliable. Even though blockchain transparency builds trust in the network, the IoT involves enough conﬁdential information that needs privacy-preserving attention along with transparency. An IoT system gathers data using a variety of sensors and devices to perform actions in accordance with speciﬁc needs. This makes IoT ecosystems simple targets to compromise privacy in different ways, involving data collection, exchange, and processing."}, {"source": "Post-Quantum_Blockchain_Security_for_the_Internet_of_Things_Survey_and_Research_Directions", "page": 9, "text": "numerous IoT domains [7], [64], [100]. Therefore, it would be helpful to grasp the main aspects of BCIoT to comprehend some potential blockchain applications in IoT domains and enhance their security against quantum computers. A. Blockchain-IoT Layers There are four layers in each IoT environment [101] as depicted on the left side of Figure 3. Numerous sensors and actuators are used in the ﬁrst layer to perform actions and perceive the required data. The second layer, which is on top of the ﬁrst layer, uses communication infrastructure to transport the gathered data. The third layer, referred to as the middleware layer, is used by the majority of developing IoT applications to serve as a link between the communication and application layers. The fourth (highest) layer is related to numerous IoT-based end-to-end applications such as smart cities and industrial IoT. When the blockchain is integrated with the IoT ecosystem, as shown in Figure 3, it serves as"}, {"source": "Post-Quantum_Blockchain_Security_for_the_Internet_of_Things_Survey_and_Research_Directions", "page": 9, "text": "securing data transactions and guaranteeing the integrity of processed and stored data in the cloud. This creates a security layer that can be designed or adapted according to the security requirements of speciﬁc applications. In the edge-based IoT, where devices process data locally, blockchains can facilitate secure peer-to-peer transactions and enable a distributed ledger at the edge. This decentralized approach minimizes reliance on the central authority and enhances the resilience of the system. Moreover, the blockchain architecture ensures reliable and efﬁcient operation thanks to its tamper-proof nature. These characteristics create opportunities to overcome IoT challenges. Many businesses and researchers have been attracted to the intersection of blockchain and IoT, which has led to implementation, solutions, and initiatives across numerous IoT domains [7], [64], [100]. Therefore, it would be helpful to grasp the main aspects of BCIoT to comprehend"}], "claims": ["Monero can be used in a blockchain-IoT environment.", "Monero can obscure the information of the sender transferring coins.", "Ring signatures are used by Monero to obscure the information of the sender transferring coins."]}, {"code": "A033", "question": "How does the decision logic of the Adaptive Dual-Layer WAF (ADL-WAF) differ from the way conventional rule-based WAFs detect SQL injection?", "reference": "ADL-WAF uses a first ML layer to flag anomalies and a second layer that checks anomalies against threat models: a benign anomaly such as a mistyped '&' is allowed, while injected SQL code flagged as an anomaly and identified as an attack is blocked. Conventional rule-based WAFs extract request fields and match them against rules, often regular expressions scanning URL parameters or bodies for SQL keywords; on a match they block, log or challenge the request (e.g. CAPTCHA), otherwise they forward it.", "answer": "The ADL-WAF uses a two-layer approach with machine learning to detect anomalies and threats, whereas conventional rule-based WAFs rely on predefined rules. The ADL-WAF's first layer detects anomalies, and the second layer determines if they are actual threats, potentially blocking SQL injections that might be missed by rule-based systems.", "kg": null, "passages": [{"source": "Adaptive Dual-Layer Web Application Firewall (ADL-WAF) Leveraging Machine Learning for Enhanced Anomaly and Threat Detection", "page": 3, "text": "between the legal traffic, benign inputs like human typo or error  and the real threats. In the first scenario the user enters his first  and last name correctly in the form field. These entries are  inserted in the URL parameters and adhere to the first layer of  detection. No anomaly is detected, and the user is allowed. The  second scenario user mistakenly enters the character “&” which  triggers an anomaly by the first layer, however the second layer  checks it against the threat models and verifies it is not a threat.  The third scenario is an attacker injecting SQL code into a  parameter. The first layer ML identifies it as an anomaly and  the second layer identifies it as an attack and it is blocked.    Figure 3: The Adaptive Dual-Layer WAF’s decision logic.  From the previous we can determine The Adaptive Dual-Layer  WAF (ADL-WAF) decision logic as follows:  •  Allow if (L1 = 0): Normal Traffic  •  Allow if (L1 = 1) AND (L2 = 0): Anomaly, But NOT Attack  •"}, {"source": "Adaptive Dual-Layer Web Application Firewall (ADL-WAF) Leveraging Machine Learning for Enhanced Anomaly and Threat Detection", "page": 3, "text": "machine learning techniques to enhance detection accuracy and  reduce false positives and negatives.    Figure 1: Traditional Web Application Firewall Build.  1- Proposed Model Architecture and Logic  The Adaptive Dual-Layer WAF (ADL-WAF) uses a two-layer  approach, via Machine Learning (ML), that overcomes the  shortcomings typically associated with traditional WAFs:  Anomaly Detection (Layer 1) and Threat Detection (Layer 2).  In turn, this significantly improves the accuracy and efficacy of  WAF which is one with fewer false positives and false  negatives, by using these layers in conjunction with each other  (see Figure 2).    Figure 2: The Adaptive Dual-Layer WAF Build  In Fig.3 shows how The Adaptive Dual-Layer WAF’s logic  works and operates on different user data inputs differentiating  between the legal traffic, benign inputs like human typo or error  and the real threats. In the first scenario the user enters his first"}, {"source": "Adaptive Dual-Layer Web Application Firewall (ADL-WAF) Leveraging Machine Learning for Enhanced Anomaly and Threat Detection", "page": 1, "text": "layer employs a Decision Tree (DT) algorithm to detect anomalies by  identifying traffic deviations from established normal patterns. The  second layer employs Support Vector Machine (SVM) to classify  these anomalies as either threat anomalies or benign anomalies. Our  “Adaptive  Dual-Layer  WAF  (ADL-WAF)”  incorporates  comprehensive data pre-processing and feature engineering  techniques and has been thoroughly evaluated using five large  benchmark datasets. Evaluation using these datasets shows that  ADL-WAF achieves a detection accuracy of 99.88% and a precision  of 100%, significantly enhancing anomaly detection and reducing  false positives. These findings suggest that integrating machine  learning techniques into WAFs can substantially improve web  application security by providing more accurate and efficient threat  detection.   Keywords-Web Application Firewall (WAF), Machine Learning  (ML), Decision Tree (DT), Support Vector Machines (SVM),"}, {"source": "Adaptive Dual-Layer Web Application Firewall (ADL-WAF) Leveraging Machine Learning for Enhanced Anomaly and Threat Detection", "page": 3, "text": "WAF (ADL-WAF) decision logic as follows:  •  Allow if (L1 = 0): Normal Traffic  •  Allow if (L1 = 1) AND (L2 = 0): Anomaly, But NOT Attack  •  Block if (L1 = 1) AND (L2 = 1): Anomaly and Attack.    2- Feature engineering    I.  Layer 1: Anomaly Detection  The first layer is responsible for the detection of anomalies in  incoming web traffic. Using features extracted from HTTP  requests, it identifies deviations from normal behavior. This  model extracts 4 primary features simply from HTTP requests:  HTTP method, absolute URL (route), body and headers, these  features are then fed into calculating specific metrics on which  the model classifies.  •  Alphanumeric Character Ratio: This feature  simply counts the ratio of alpha-numeric characters  in a payload. Regular requests have a higher ratio  of numeric and alphabetic characters compared to  special symbols. As a result, this feature tends to  have more value in normal requests than those from  an attack.  •"}], "claims": ["The ADL-WAF uses a two-layer approach.", "The ADL-WAF uses machine learning.", "The ADL-WAF detects anomalies.", "The ADL-WAF determines if anomalies are actual threats.", "Conventional rule-based WAFs rely on predefined rules.", "Conventional rule-based WAFs may miss SQL injections.", "The ADL-WAF's first layer detects anomalies.", "The ADL-WAF's second layer determines if anomalies are actual threats.", "The ADL-WAF can block SQL injections that might be missed by rule-based systems."]}, {"code": "A034", "question": "What are the advantages and the main challenge of NV centers in diamond as a qubit technology?", "reference": "NV centers encode qubits in the spin of a lattice defect and offer long coherence times and room-temperature operation, but scaling them to large, controllable registers is difficult because of the difficulty of precise and reliable manufacturing.", "answer": "Advantages of NV centers in diamond include long coherence times and the ability to operate at room temperature. The main challenge is scaling them to large, controllable registers due to the difficulty of precise and reliable manufacturing.", "kg": null, "passages": [{"source": "Practical Challenges in Executing Shor’s Algorithm", "page": 3, "text": "High accuracy and stability; qubits identical by nature; very long coherence times Energy efficient; builds on some telecom-industry matured photonic technologies Main Challenges Qubit uniformity; limited cooling power and wiring; high sensitivity to noise; fast classical-electronics requirements Complex laser-based control that is hard to scale Photon loss and detection; entanglement preparation; often non-deterministic operation slowing clock speeds * indicates the highest TRL modalities at the time of writing overheads in principle. Yet, their experimental realization remains difficult and has not been conclusively demonstrated. NV centers in diamond use electronic or nuclear spin associated with a lattice defect to encode qubit states. They offer long coherence times and can operate at room-temperature, but scaling them to large, controllable registers is difficult, due to the difficulty of precise and reliable manufacturing."}, {"source": "Practical Challenges in Executing Shor’s Algorithm", "page": 3, "text": "Table 1: Quantum computing with different qubit technologies and their characteristics. Synthetic Qubits Natural Qubits Atom-based Light-based Type Superconducting circuits*, Quantum dots, Topological qubits, NV centers in diamonds Trapped-Ion*, Neutral Atom* Photon Examples of Commercial Providers IBM, Google, Rigetti, IQM, Microsoft, Intel, Diraq, Quantum Brilliance IonQ, Quantinuum, AQT, QuEra, Pasqal, planqc, Atom Computing, Infleqtion Xanadu, PsiQuantum, Quandela Overall Processing Speed Fast Slow Fast Qubit Connectivity Low High Low Coherence Times Low High High Cooling Requirement Extreme cryogenics (∼10 mK) Room temperature but often standard cryogenics (∼4 K) Room temperature with detectors requiring standard cryogenics (4 K) Main Advantages Circuits can be designed with the desired topology; highly scalable in some approaches High accuracy and stability; qubits identical by nature; very long coherence times Energy efficient; builds on some telecom-industry matured photonic"}, {"source": "Practical Challenges in Executing Shor’s Algorithm", "page": 13, "text": "developing specialized quantum systems. Table 4 illustrates selected quantum computing roadmaps announced by industrial players, grouped by qubit technology. Hardware architectures Superconducting-qubit efforts, led by IBM, Google and others, emphasize scaling and fault tolerance through surface-code-like QEC. IBM was the first to surpass 1,000 qubits on a single chip and continues to pursue large scale architectures with a recent focus on modularity. Google has articulated a roadmap targeting around one million physical qubits by 2029, with the explicit goal of achieving fault-tolerant quantum computation through QEC. Trapped-ion providers such as IonQ and Quantinuum focus on saller but higher-fidelity systems. In 2024, Quantinuum introduced a 56-qubit system that uses ion shuttling across a chip to perform operations pushing system level benchmarks such as quantum volume (QV) [34, 35] to new record"}, {"source": "Practical Challenges in Executing Shor’s Algorithm", "page": 2, "text": "performance characteristics. 2.A Quantum Computers with Synthetic Qubits Superconducting qubits, widely used by companies such as IBM, Google, and Rigetti, encode information in oscillating electrical currents in superconducting circuits cooled to millikelvin temperatures. They offer fast gate operations and benefit from mature microwave control and fabrication ecosystems. However, they suffer from relatively short coherence times, variability across the chip, and significant sensitivity to noise, all of which increase the burden on error mitigation and QEC. Quantum dots, which confine electrons in semiconductor nanostructures, are attractive due to their compatiblity with existing semiconductor technology and their potential for high-density integration. Their main challenges include short coherence times, tight fabrication tolerances, and complex control requirements. The availability of ultra-pure silicon-28 as raw material can provide further limitations."}], "claims": ["NV centers in diamond have long coherence times.", "NV centers in diamond can operate at room temperature.", "Scaling NV centers in diamond to large, controllable registers is difficult.", "Precise and reliable manufacturing of NV centers in diamond is challenging."]}, {"code": "A035", "question": "How do Loihi's synaptic density and neuron density compare with TrueNorth?", "reference": "Loihi provides 2.1 million unique synaptic variables per mm2, over three times higher than TrueNorth, but its maximum neuron density of 2,184 per mm2 is marginally worse than TrueNorth's (a 2x reduction when process-normalized).", "answer": "Loihi's synaptic density is over three times higher than TrueNorth's with 2.1 million unique synaptic variables per mm², while its neuron density of 2,184 per mm² is marginally worse than TrueNorth's. This represents a 2× reduction in the design's neuron density compared to TrueNorth, which is seen as the cost of Loihi's expanded feature set.", "kg": null, "passages": [{"source": "Loihi - A neuromorphic manycore processor with on-chip learning", "page": 14, "text": "Loihi includes a total of 16 MB of synaptic memory. With its densest 1-bit synapse format, this  provides a total of 2.1 million unique synaptic variables per mm2, over three times higher than  TrueNorth, the previously most dense SNN chip.11 This does not consider Loihi’s hierarchical  network support that can significantly boost its effective synaptic density. On the other hand,  Loihi’s maximum neuron density of 2,184 per mm2 is marginally worse than TrueNorth’s. Process normalized, this represents a 2× reduction in the design’s neuron density, which may be interpreted as the cost of Loihi’s greatly expanded feature set, an intentional design choice.            95 January/February 2018 www.computer.org/micro Authorized licensed use limited to: CERN. Downloaded on July 21,2020 at 12:07:18 UTC from IEEE Xplore. Restrictions apply."}, {"source": "Loihi_A_Neuromorphic_Manycore_Processor_with_On-Chip_Learning", "page": 14, "text": "Loihi includes a total of 16 MB of synaptic memory. With its densest 1-bit synapse format, this  provides a total of 2.1 million unique synaptic variables per mm2, over three times higher than  TrueNorth, the previously most dense SNN chip.11 This does not consider Loihi’s hierarchical  network support that can significantly boost its effective synaptic density. On the other hand,  Loihi’s maximum neuron density of 2,184 per mm2 is marginally worse than TrueNorth’s. Process normalized, this represents a 2× reduction in the design’s neuron density, which may be interpreted as the cost of Loihi’s greatly expanded feature set, an intentional design choice.            95 January/February 2018 www.computer.org/micro Authorized licensed use limited to: Hanoi University of Science & Technology. Downloaded on March 29,2026 at 00:38:29 UTC from IEEE Xplore. Restrictions apply."}, {"source": "Loihi - A neuromorphic manycore processor with on-chip learning", "page": 6, "text": "Loihi supports three sparse matrix compression models in which fan-out neuron indices  are computed based on index state stored with each synapse’s state variables.  • Core-to-core multicast. Any neuron may direct a single spike to any number of destination cores, as the network connectivity might require.  • Variable synaptic formats. Loihi supports any weight precision between one and nine  bits, signed or unsigned, and weight precisions may be mixed (with scale normalization)  even within a single neuron’s fan-out distribution.  • Population-based hierarchical connectivity. As a generalized weight-sharing mechanism, such as to support convolutional neural network types, connectivity templates  may be defined and mapped to specific population instances during operation. This feature can reduce a network’s required connectivity resources by over an order of magnitude.  Loihi is the first fully integrated SNN chip that supports any of the above features. All prior"}, {"source": "Loihi_A_Neuromorphic_Manycore_Processor_with_On-Chip_Learning", "page": 6, "text": "Loihi supports three sparse matrix compression models in which fan-out neuron indices  are computed based on index state stored with each synapse’s state variables.  • Core-to-core multicast. Any neuron may direct a single spike to any number of destination cores, as the network connectivity might require.  • Variable synaptic formats. Loihi supports any weight precision between one and nine  bits, signed or unsigned, and weight precisions may be mixed (with scale normalization)  even within a single neuron’s fan-out distribution.  • Population-based hierarchical connectivity. As a generalized weight-sharing mechanism, such as to support convolutional neural network types, connectivity templates  may be defined and mapped to specific population instances during operation. This feature can reduce a network’s required connectivity resources by over an order of magnitude.  Loihi is the first fully integrated SNN chip that supports any of the above features. All prior"}], "claims": ["Loihi's synaptic density is over three times higher than TrueNorth's.", "Loihi has 2.1 million unique synaptic variables per mm².", "Loihi's neuron density of 2,184 per mm² is marginally worse than TrueNorth's.", "Loihi has a 2× reduction in the design's neuron density compared to TrueNorth.", "TrueNorth has a higher neuron density than Loihi.", "Loihi's expanded feature set is the cost of its reduced neuron density compared to TrueNorth."]}, {"code": "A036", "question": "How is the state of a qubit defined in terms of probability amplitudes?", "reference": "A qubit is in a superposition state alpha|0> + beta|1>, where alpha and beta are complex probability amplitudes satisfying |alpha|^2 + |beta|^2 = 1.", "answer": "The state of a qubit is defined in terms of probability amplitudes α and β, where the qubit is represented as |ψ⟩ = α|0⟩ + β|1⟩. These amplitudes must satisfy the constraint |α|² + |β|² = 1, ensuring the total probability is conserved.", "kg": null, "passages": [{"source": "A Survey of Quantum Machine Learning - Foundations,Algorithms, Frameworks, Data and Applications", "page": 7, "text": "the system. Mathematically, a mixed state is represented by a density matrix 𝜌, which is a convex combination of pure state projectors: 𝜌= ∑ 𝑖 p𝑖|𝜓𝑖⟩⟨𝜓𝑖|, (8) where p𝑖are the probabilities (with ∑𝑖p𝑖= 1). For example, consider a qubit that is in a mixed state with a probability p of being in the state |0⟩and a probability 1 - p of being in the state |1⟩. The density matrix for this mixed state can be written as follows: 𝜌= p|0⟩⟨0|+(1 −p)|1⟩⟨1|. (9) Then, the density matrix 𝜌can be written as 𝜌= p (1 0 0 0) + (1 −p) (0 0 0 1) = (p 0 0 1 −p) . (10) For this mixed state, the trace of the density matrix is as follows: 𝑇𝑟(𝜌) = p + (1 −p) = 1. (11) 3.2 Quantum Circuits To exploit the potential of quantum computing, classical data, typically represented as binary bits, must first be encoded into quantum states, known as qubits. This process, referred to as data encoding, embedding, or feature mapping, is a fundamental step in developing quantum and"}, {"source": "Next-Generation Quantum Security - The Impact of Quantum Computing on Cybersecurity—Threats, Mitigations, and Solutions", "page": 6, "text": "S. Ali et al. Fig. 2. Roadmap of the review article. Table 3 Preliminary table of mathematical symbols and descriptions.  Symbol Type Description    𝑏 Bit Classical binary bit that can be in state 0 or 1    |𝜓⟩ Qubit Quantum bit (qubit) in superposition state 𝛼|0⟩+ 𝛽|1⟩    𝛼, 𝛽 Complex numbers Probability amplitudes in qubit state, where |𝛼|2 + |𝛽|2 = 1    |0⟩, |1⟩ Basis states Orthogonal basis states of a qubit    |𝜓𝑒𝑛𝑡𝑎𝑛𝑔𝑙𝑒𝑑⟩ Entangled state Bell state representing quantum entanglement 1 √ 2 (|00⟩+ |11⟩)   𝑁 Integer Composite number to be factored (in RSA) 𝑁= 𝑝⋅𝑞    𝑝, 𝑞 Prime numbers Large primes used in RSA key generation    𝑒, 𝑑 Integers Public and private exponents in RSA cryptosystem    𝜑(𝑛) Euler’s totient 𝜑(𝑛) = (𝑝−1)(𝑞−1) for RSA modulus 𝑛    𝐺 Point Generator point on elliptic curve (for ECC)    𝑘 Integer Private key in ECC (𝑄= 𝑘⋅𝐺)    𝐻(𝑀) Hash function Cryptographic hash of message 𝑀    𝐀, 𝐬, 𝐞 Matrix/Vectors Components in LWE problem: 𝐀⋅𝐬+ 𝐞= 𝐛    𝑓𝑖(𝑥1, … , 𝑥𝑛)"}, {"source": "A Survey of Quantum Machine Learning - Foundations,Algorithms, Frameworks, Data and Applications", "page": 6, "text": "91:6 F. Rodríguez-Díaz et al. where 𝛼and 𝛽are complex probability amplitudes. Additionally, 𝛼and 𝛽must satisfy the constraint given in Equation (2): |𝛼|2 + |𝛽|2 = 1. (2) This equation indicates that the total of the squared probabilities must sum up to one. The quantum states of a qubit system can be represented in the Hilbert space, a specialized vector space endowed with an inner product, represented by ⟨𝜙|𝜓⟩. This concept is essential for studying vector spaces in quantum mechanics, offering a mathematical structure to describe the properties and dynamics of quantum systems. This space can be illustrated using the Bloch sphere, as shown in Figure 1 (see Appendix B). The Bloch sphere is a visual tool that allows for the representation of all possible pure states of a qubit on the surface of a unit sphere. However, not all quantum states can be represented in the Bloch sphere, particularly when dealing with systems comprising more"}, {"source": "A Survey of Quantum Machine Learning - Foundations,Algorithms, Frameworks, Data and Applications", "page": 5, "text": "Unlike classical bits, which can only be in a state of either 0 or 1, qubits utilize quantum mechanics to exist in a superposition of both states simultaneously. This unique property allows quantum computers to perform multiple calculations at once, potentially solving certain problems much more efficiently than classical computers. The mathematical representation of a qubit is shown in Equation (1): |𝜓⟩= 𝛼|0⟩+ 𝛽|1⟩, (1) ACM Comput. Surv., Vol. 58, No. 4, Article 91. Publication date: October 2025."}], "claims": ["The state of a qubit is defined in terms of probability amplitudes α and β.", "A qubit is represented as |ψ⟩ = α|0⟩ + β|1⟩.", "The amplitudes α and β must satisfy the constraint |α|² + |β|² = 1.", "The constraint |α|² + |β|² = 1 ensures the total probability is conserved."]}, {"code": "A037", "question": "What does the stacked deep ensembles approach for encrypted HTTPS traffic classification contribute?", "reference": "A deployment-oriented, leakage-controlled recipe for flow-level encrypted HTTPS classification: a standardized pipeline, probability-level stacked ensembling, a like-for-like comparison of deep architectures under identical data, splits, preprocessing, imbalance handling and training budget, state-of-the-art results on the HTTPS/CESNET family, and a released codebase for reproducibility.", "answer": "The stacked deep ensembles approach contributes by exploiting the multi-scale structure of encrypted traffic, combining the strengths of different deep learning models to improve robustness, interpretability, and efficiency in classifying encrypted HTTPS traffic.", "kg": null, "passages": [{"source": "Enhancing encrypted HTTPS traffic classification based on stacked deep ensembles models", "page": 1, "text": "Enhancing encrypted HTTPS traffic  classification based on stacked  deep ensembles models Ahmed M. Elshewey 1 & Ahmed M. Osman2 The classification of encrypted HTTPS traffic is a critical task for network management and security,  where traditional port or payload-based methods are ineffective due to encryption and evolving  traffic patterns. This study addresses the challenge using the public Kaggle dataset (145,671 flows, 88  features, six traffic categories: Download, Live Video, Music, Player, Upload, Website). An automated  preprocessing pipeline is developed to detect the label column, normalize classes, perform a stratified  70/15/15 split into training, validation, and testing sets, and apply imbalance-aware weighting.  Multiple deep learning architectures are benchmarked, including DNN, CNN, RNN, LSTM, and GRU,  capturing different spatial and temporal patterns of traffic features. Experimental results show that"}, {"source": "Enhancing encrypted HTTPS traffic classification based on stacked deep ensembles models", "page": 5, "text": "Additionally, the study standardizes the tabular flow setting for HTTPS application categories and makes  the stacked-probability protocol explicit and leakage-free. This addresses a gap in literature for reproducible,  operations-ready pipelines for encrypted traffic without payloads, where consistent performance on minority  classes and transparent comparisons matter more than architectural novelty. Table 1 summarizes some studies  related to HTTPS traffic classification and relation with this work. Encrypted traffic exposes multi-scale structure: short-range bursts in packet size and timing, mediumrange ordering of segments, and global rate/ratio aggregates at the flow level. Single architectures emphasize  different parts of this structure (e.g., CNNs capture local burst motifs; GRU/LSTM learn sequence order and  duration; DNN/MLP models non-linear interactions among aggregates). Stacked ensembling exploits this"}, {"source": "Enhancing encrypted HTTPS traffic classification based on stacked deep ensembles models", "page": 4, "text": "robustness, interpretability, and efficiency. This paper distinguishes itself from prior studies by systematically  benchmarking multiple deep learning models and introducing an ensemble framework specifically tailored for  encrypted HTTPS traffic classification. Using the publicly available Kaggle HTTPS Traffic Classification dataset  (145,671 flows, 88 features, and six classes: Download, Live Video, Music, Player, Upload, Website), the pipeline  first automates preprocessing, including label detection, normalization, stratified splitting, and imbalance-aware  weighting. Unlike studies that focus on single architecture or specialized tasks (e.g., DoH detection, Tor traffic, or  activity inference), this work evaluates DNN, CNN, RNN, LSTM, and GRU models under a unified framework,"}, {"source": "Enhancing encrypted HTTPS traffic classification based on stacked deep ensembles models", "page": 2, "text": "ensure transparency and reproducibility, the full codebase is released on GitHub, providing the community with  a ready-to-use framework for HTTPS traffic analytics and a baseline for future research on encrypted traffic  classification. Our contribution is a deployment-oriented, leakage-controlled recipe for flow-level encrypted HTTPS  classification, standardizing the entire pipeline, implementing probability-level stacked ensembling, conducting a  like-for-like comparison of deep architectures under the same dataset, splits, preprocessing, imbalance handling,  and training budget, achieving state-of-the-art results on the same HTTPS/CESNET family, and emphasizing  reproducibility and deployment. The remainder of this paper is organized as follows. Section 2 reviews related work on encrypted traffic  classification and the role of machine and deep learning in modern network analytics. Section 3 describes the"}], "claims": ["The stacked deep ensembles approach exploits the multi-scale structure of encrypted traffic.", "The stacked deep ensembles approach combines the strengths of different deep learning models.", "The stacked deep ensembles approach improves robustness in classifying encrypted HTTPS traffic.", "The stacked deep ensembles approach improves interpretability in classifying encrypted HTTPS traffic.", "The stacked deep ensembles approach improves efficiency in classifying encrypted HTTPS traffic."]}, {"code": "A038", "question": "Why is quantum key distribution (QKD) considered provably secure against eavesdropping?", "reference": "QKD relies on principles of physics rather than the computational complexity of mathematical problems, so anyone attempting to access the key exchange can be detected.", "answer": "Quantum key distribution (QKD) is considered provably secure against eavesdropping because it leverages the principles of quantum mechanics, specifically the Heisenberg uncertainty principle. Any eavesdropping attempt introduces measurable errors due to the disturbance of quantum states, which can be detected by the communicating parties. This ensures that the security of QKD communication arises from the inherent properties of quantum systems, providing information-theoretic security.", "kg": "Knowledge graph entities:\n- QKD (PROTOCOL): Quantum cryptography implementations like QKD.; Quantum Key Distribution protocol for secure communications.; Protocol with technical limitations motivating the positions of various agencies.; Quantum Key Distribution ty\n- Quantum Key Distribution Networks (SYSTEM): Building a QKD network at scale leads to a combinatorial explosion of needed links.; China’s 2,000-km Quantum Key Distribution network.; Target of the modified PNS attack.; This modified scheme is based on weak laser pul\n- eavesdropping (ATTACK): Attempts introduce measurable errors due to the disturbance of quantum states.; Any eavesdropping attempt 𝐸 causes detectable disturbances in QKD.; Disrupts the quantum system and can be detected.; Quantum channels are h\n- Quantum Key Distribution (PROTOCOL): Technology that relies on coherence for secure communication.; Technology that ensures secure state transmission.; Integrated with ML to optimize communication security.; A cryptographic protocol that uses quantum physic\n- Risk in quantum key distribution (CONCEPT): Quantum key distribution faces threats.\n- Information-Theoretically Secure (METRIC): Secret keys established by QKD are secure.\n- three-state quantum key distribution (QKD) protocol (PROTOCOL): Demonstrates security up to a bit error rate of 9.81%.\n- quantum eavesdropping attack (ATTACK): An attack that QKD protects against.\n\nKnowledge graph relations:\n- Quantum Key Distribution -- eavesdropper: Eavesdroppers can exploit the security offered by QKD.\n- Quantum Key Distribution -- eavesdropping detection capability: QKD includes eavesdropping detection capability.\n- Quantum Key Distribution -- information-theoretic security: QKD offers the promise of information-theoretic security.\n- Quantum Key Distribution -- eavesdropping detection: Eavesdropping detection enables secure state transmission in quantum key distribution.; QKD protocols are analyzed for security with eavesdropping detection.; Eavesdropping detection is a process in QKD.; Eavesdropping d\n- Quantum Key Distribution -- Information-Theoretically Secure: QKD established keys are ITS.\n- Quantum Key Distribution -- eavesdropping: Eavesdropping attempts introduce measurable errors in QKD communication.; QKD can detect eavesdropping attempts.\n- Quantum Key Distribution -- quantum attacks: QKD provides security against quantum attacks.\n- Quantum Key Distribution -- Heisenberg uncertainty principle: QKD security arises from the disturbance of quantum states due to eavesdropping.\n- quantum-resistant algorithms -- Quantum Key Distribution: QKD is a secure communication approach that uses quantum mechanics to protect against quantum eavesdropping attacks.\n- Quantum Key Distribution -- Quantum Secure Communication: QKD is a part of secure communication.\n- Quantum Key Distribution -- unconditional security: QKD provides unconditional security.; QKD provides information-theoretic security.\n- Quantum Key Distribution -- finite-key security: QKD provides finite-key security.; Security analysis of QKD distinguishing raw security from KPA security.", "passages": [{"source": "Next-Generation Quantum Security - The Impact of Quantum Computing on Cybersecurity—Threats, Mitigations, and Solutions", "page": 16, "text": "According to quantum key distribution (QKD) principles, encryption keys are generated between two parties using quantum  mechanics to ensure secure communication while allowing the detection of eavesdropping [12]. QKD implements the uncertainty  principle described by Heisenberg, which states that measurements disturb quantum systems. The security of QKD communication  arises from the fact that any eavesdropping attempt introduces measurable errors due to the disturbance of quantum states. Bennett  and Brassard established BB84 as the most recognized QKD protocol, which uses polarized photons to transmit secret keys. In the BB84 protocol, Alice prepares randomly polarized photons, and Bob measures them using one of two selected measurement  bases [195]. Key material can be securely shared between Alice and Bob only if no eavesdropper—commonly referred to as Eve—"}, {"source": "Next-Generation Quantum Security - The Impact of Quantum Computing on Cybersecurity—Threats, Mitigations, and Solutions", "page": 19, "text": "until quantum-safe algorithms mature [190]. Quantum key distribution (QKD) can further enhance blockchain security by enabling eavesdropping-resistant key exchange between nodes [223]. QKD’s ability to detect eavesdropping ensures secure key reestablishment, preventing unauthorized access [224].  Mathematically, the QKD key exchange can be represented as:  𝐾shared = 𝑓(𝐀, 𝐁) (14) Here, 𝐾shared is the shared secret key derived from the quantum states 𝐀 (Alice) and 𝐁 (Bob), with any eavesdropping attempt  𝐸 causing detectable disturbances. Integrating QKD with blockchain networks provides a quantum-secure communication layer. In conclusion, blockchain protocols must adopt quantum-resistant solutions like lattice-based cryptography and hash-based signatures to counter future quantum threats [225]. Hybrid cryptographic approaches can provide interim security while transitioning"}, {"source": "QUANTUM KEY DISTRIBUTION - Bridging Theoretical Security Proofs, Practical Attacks, and Error Correction", "page": 15, "text": "further resilience, while machine learning–based anomaly detection can also be explored as event detection for more sophisticated jamming attacks. In tab(4), we summarize all the attacks we reviewed in this Sec 3. Because many of these attacks are statistically indistinguishable from background noise at realistic block sizes, asymptotic analyses alone are insufficient. In Sec. 4 we map these threats to unconditional-, finite-key-, and composablesecurity frameworks. We also highlight the role of QECC in keeping error budgets within those bounds. 4 Security Analysis of QKD We now review the security of Quantum Key Distribution systems by looking over different classes of security proofs. 4.1 Security Paradigms in QKD As mentioned earlier, QKD provides security by leveraging the principles of quantum mechanics. The security paradigms in QKD are broadly classified as unconditional security, finite-key security, and composable security."}, {"source": "QUANTUM KEY DISTRIBUTION - Bridging Theoretical Security Proofs, Practical Attacks, and Error Correction", "page": 15, "text": "paradigms in QKD are broadly classified as unconditional security, finite-key security, and composable security. QKD exploits inherently quantum phenomena—such as non-orthogonal state encoding and the no-cloning theorem—to generate shared keys between Alice and Bob. This provides information-theoretic security rather than security relying on hard mathematical problems [1, 2]. Since BB84’s formulation, several rigorous proofs have established its unconditional security under ideal assumptions, in stark contrast to classical schemes (e.g. RSA) whose safety depends on computational complexity [2, 54]. Security analyses further distinguish raw security—Eve’s maximum success probability during key generation—from Known-Plaintext Attack (KPA) security, which bounds her advantage once part of the key is revealed during message exchange [55, 54]. 15"}], "claims": ["Quantum key distribution (QKD) is considered provably secure against eavesdropping.", "QKD leverages the principles of quantum mechanics.", "The Heisenberg uncertainty principle is a principle of quantum mechanics used by QKD.", "Any eavesdropping attempt introduces measurable errors.", "Eavesdropping attempts disturb quantum states.", "The communicating parties can detect eavesdropping attempts.", "The security of QKD communication arises from the inherent properties of quantum systems.", "QKD provides information-theoretic security."]}, {"code": "A039", "question": "What reasons suggest that quantum computers can outperform classical computers, and what role does the precision of quantum state manipulation play?", "reference": "Describing the correlations of a few hundred qubits may need more bits than there are atoms in the visible universe, but this complexity alone does not make quantum computers more powerful; a key reason is that quantum algorithms solve problems believed hard for classical computers, the best known being factoring large integers. If precision grows polynomially with the input size, quantum computers appear to be a more powerful type of computer; the achievable precision is dictated by materials and architecture rather than fundamental physical laws.", "answer": "Quantum computers can outperform classical computers due to their ability to handle highly entangled quantum states, which are difficult for classical computers to simulate accurately. The precision of quantum state manipulation, while not fundamentally limited by physical laws, is crucial for achieving quantum speedup. If quantum computers can achieve sufficient precision, they can solve certain problems faster than classical computers, as evidenced by the potential for polynomial-time algorithms in quantum computing that outperform classical counterparts for specific tasks.", "kg": "Knowledge graph entities:\n- quantum computer (SYSTEM): Hardware capable of performing quantum computations.\n- Classical simulation algorithms (ALGORITHM): Traditional methods potentially outperformed by quantum circuits in simulating quantum systems.\n- NISQ computers (SYSTEM): NISQ computers will likely play an important role in understanding the foundations of quantum mechanics.\n- quantum-to-classical (DEFENSE): Quantum circuits perform feature extraction while classical components handle final predictions.\n\nKnowledge graph relations:\n- quantum computer -- classical systems: Quantum computers process information more efficiently than classical systems.\n- quantum computer -- classical computer: Quantum computers handle information fundamentally differently from classical computers.\n- quantum computer -- quantum speedup: Quantum computer solves the problem faster than classical computers.\n- quantum computer -- digital computer: Quantum computers outperform digital computers on quantum physics problems.\n- Berthiaume and Brassard -- classical computer: These papers showed problems that quantum computers can solve more efficiently than classical computers.\n- Deutsch and Jozsa -- classical computer: These papers showed problems that quantum computers can solve more efficiently than classical computers.", "passages": [{"source": "Polynomial-Time Algorithms for Prime Factorization and Discrete Logarithms on a Quantum Computer", "page": 3, "text": "Allowing the same polynomial growth in precision does not appear to confer extra computing power to classical mechanics, although allowing exponential growth in precision does [Hartmanis and Simon 1974, Vergis et al. 1986]. As far as we know, what precision is possible in quantum state manipulation is dictated not by fundamental physical laws but by the properties of the materials and the architecture with which a quantum computer is built. If the precision of a quantum computer is large enough to make it more powerful than a classical"}, {"source": "Quantum Computing in the NISQ era and beyond", "page": 7, "text": "(Arguably, though, quantum technology might be preferred even if classical supercomputers run faster, if for example the quantum hardware has lower cost and lower power consumption.) In any case, we should recognize that the power of classical computers will continue to increase, with exascale systems (surpassing 1018 FLOPS) expected to be available in a few years. Quantum computers are striving to catch up with a moving target, as both classical hardware and classical algorithms continually improve."}, {"source": "Quantum Computing in the NISQ era and beyond", "page": 13, "text": "6.9 Quantum simulation As I have already emphasized, we expect quantum computers to be very well suited for studying the properties of highly entangled systems of many particles. Thus, as Feynman argued, the simulation of highly entangled quantum matter is the natural arena where quantum computers seem to have a clear advantage over classical ones. In the long term, quantum simulation using quantum computers has great potential to wield a broad inﬂuence on the world."}, {"source": "Quantum Computing in the NISQ era and beyond", "page": 13, "text": "But this promise is not so likely to be fulﬁlled in the NISQ era, because quantum algorithms for accurately simulating large molecules and exotic materials may be too expensive to succeed without error correction. Classical computers are especially bad at simulating quantum dynamics — that is, predicting how a highly-entangled quantum state will change with time. Quantum computers have a big advantage for that task, and physicists hope to learn interesting things about"}], "claims": ["Quantum computers can handle highly entangled quantum states.", "Classical computers have difficulty simulating entangled quantum states accurately.", "The precision of quantum state manipulation is crucial for achieving quantum speedup.", "Quantum computers are not fundamentally limited by physical laws in terms of precision.", "Quantum computers can solve certain problems faster than classical computers if they can achieve sufficient precision.", "Quantum computing has the potential for polynomial-time algorithms that outperform classical counterparts for specific tasks."]}, {"code": "A040", "question": "When should organizations begin post-quantum cryptography migration, and why is waiting for Q-Day an error?", "reference": "Organizations should begin PQC migration now: with Q-Day estimated at 2030 ± 5 years and migration taking 2-5 years (plus 1-3 years of supply-chain coordination), migration must start in 2025-2028 to finish before 2030-2035; legacy constraints and long data confidentiality requirements also make waiting a strategic error.", "answer": "Organizations should begin post-quantum cryptography migration now, ideally between 2025-2028, to avoid becoming vulnerable when Q-Day arrives. Waiting for Q-Day to occur before starting migration creates unnecessary risk, cost, and disruption.", "kg": "Knowledge graph entities:\n- Q-Day (CONCEPT): Estimates of when quantum computers capable of breaking encryption might realistically materialize.; Computers that can break encryption might realistically materi istorical adoption of public-key cryptography in the late 20th century."}, {"source": "harvest-now-decrypt-later-pqc-threat-model", "page": 58, "text": "If Q-Day occurs before PQC migration is complete, exposed data becomes vulnerable immediately Organizations migrating later face accelerated timelines, increased costs, and error risk Cryptographic changes require coordination across many teams Board-level governance establishing quantum risk as enterprise priority Vendor and third-party engagement to ensure supply chain readiness 63 ScienceDirect. (2025). “Complexity and the Transition to Post-Quantum Security.” Procedia Computer Science. Retrieved from"}, {"source": "harvest-now-decrypt-later-pqc-threat-model", "page": 59, "text": "Migration must begin immediately to enable orderly transition 17.2 Why Waiting for Q-Day Is a Critical Error Several factors make waiting for Q-Day appearance a strategic error: 1. Data Confidentiality Requirements: Data encrypted today remains sensitive throughout cryptographic transition period Timeline Analysis: - Q-Day estimate: 2030 ± 5 years (accounting for uncertainty) - Migration duration: 2-5 years after decision - Required migration start: 2025-2028 (to complete before 2030-2035) - Current date: 2024-2025 Implication: Organizations should begin PQC migration now. Waiting until Q-Day appears"}], "claims": ["Organizations should begin post-quantum cryptography migration now.", "The ideal time for post-quantum cryptography migration is between 2025-2028.", "Waiting for Q-Day to occur before starting migration creates unnecessary risk.", "Waiting for Q-Day to occur before starting migration creates unnecessary cost.", "Waiting for Q-Day to occur before starting migration creates unnecessary disruption."]}, {"code": "A041", "question": "Which states are used in the Vacuum+Weak decoy-state method for quantum key distribution, and what do Alice and Bob gain by measuring the decoy states?", "reference": "Only a few states are used: th
