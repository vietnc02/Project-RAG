 using OTDR and spectral transmittance for Trojan Horse attacks. Jamming Attack 2017 Boche et al [51]. Analyzes secrecy capacity for channels under jamming and eavesdropping with super-activation effects. 2019 Daschner et al [50]. Exploits the Faraday effect to disrupt QKD, increasing QBER and halting key exchange. 2019 Boche et al [52]. Derives capacity regions for compound and AVQCs, demonstrating simultaneous classical-quantum transmission. 2023 Simmons et al [53]. Explores line-of-sight and reflective jamming on satellite QKD, improving SIR with SPAD arrays. 16"}, {"source": "QUANTUM KEY DISTRIBUTION - Bridging Theoretical Security Proofs, Practical Attacks, and Error Correction", "page": 13, "text": "[48] and wavelength-dependent leaks in isolators and SPADs [49, 47]. While techniques such as narrow-band filtering, random phase modulation, decoy-state defenses, and SPAD arrays can significantly limit Eve’s information gain or detect intrusion, open challenges remain. Future work should aim to develop unified security models that incorporate non-Gaussian probes and realistic device imperfections, extend countermeasures to emerging platforms (e.g. integrated photonics and free-space links), and explore active anomaly-detection schemes to detect and mitigate possible quantum-Trojan horse attacks. 3.3 Jamming Attack Similar to classical communication scenarios eavesdropper can perform jamming attacks to quantum communication. A jamming attack is a denial-of-service (DoS) strategy. The main idea is for the eavesdropper to introduce enough noise in the system to disrupt the quantum key distribution protocols or to reduce their efficiency."}, {"source": "QUANTUM KEY DISTRIBUTION - Bridging Theoretical Security Proofs, Practical Attacks, and Error Correction", "page": 15, "text": "further resilience, while machine learning–based anomaly detection can also be explored as event detection for more sophisticated jamming attacks. In tab(4), we summarize all the attacks we reviewed in this Sec 3. Because many of these attacks are statistically indistinguishable from background noise at realistic block sizes, asymptotic analyses alone are insufficient. In Sec. 4 we map these threats to unconditional-, finite-key-, and composablesecurity frameworks. We also highlight the role of QECC in keeping error budgets within those bounds. 4 Security Analysis of QKD We now review the security of Quantum Key Distribution systems by looking over different classes of security proofs. 4.1 Security Paradigms in QKD As mentioned earlier, QKD provides security by leveraging the principles of quantum mechanics. The security paradigms in QKD are broadly classified as unconditional security, finite-key security, and composable security."}], "claims": ["In a 2019 jamming attack against QKD, the Faraday effect was exploited.", "This attack increased the quantum bit-error rate (QBER) by 7.6%", "The attack effectively halted key exchange."]}, {"code": "A014", "question": "How are synaptic input currents usually modelled in spiking neural networks trained with surrogate gradients, and what does the amplitude of a postsynaptic current depend on according to Neuronal Dynamics?", "reference": "In SNNs the input current is generated by synaptic currents triggered by presynaptic spikes (spike trains written as sums of Dirac delta functions), and a common first-order approximation models their time course as an exponential decay. In Neuronal Dynamics, a spike generates a postsynaptic current whose amplitude is proportional to the difference between the membrane potential u0 and the synaptic reversal potential Esyn, so the postsynaptic response depends on the neuron's momentary state, especially for inhibitory synapses.", "answer": "In spiking neural networks trained with surrogate gradients, synaptic currents are typically modeled as exponentially decaying currents following each presynaptic spike. According to Neuronal Dynamics, the amplitude of a postsynaptic current depends on the difference between the membrane potential and the reversal potential of the synapse.", "kg": null, "passages": [{"source": "Surrogate gradient learning in spiking neural networks", "page": 4, "text": "are shown as points at the top. During the ﬁrst 0.4 s the dynamics are strictly “sub-threshold” and individual postsynaptic potentials (PSPs) are clearly discernible. Only when multiple PSPs start to sum up, the neuronal ﬁring threshold (dashed) is reached and output spikes are generated. In SNNs, the input current is typically generated by synaptic currents triggered by the arrival of presynaptic spikes S(l) j (t). When working with differential equations, it is convenient to denote a spike train S(l) j (t) as a sum of Dirac delta functions S(l) j (t) = \u001f s∈C (l) j δ(t −s) where s runs over the ﬁring times C(l) j of neuron j in layer l. Synaptic currents follow speciﬁc temporal dynamics themselves. A common ﬁrst-order approximation is to model their time course as an exponentially decaying current following each presynaptic spike. Moreover, we assume that synaptic currents sum linearly. The dynamics of these operations are given by dI(l) i dt = −I(l) i (t) τsyn \u001e \u001d\u001c \u001b exp. decay + \u001a"}, {"source": "Deep learning in spiking neural networks", "page": 3, "text": "is to encode the analog input data into the spike trains using either a rate based method [64], [15], some form of temporal coding [66], [67], or population coding [68]. As stated earlier, a biological neuron in the brain (and similarly in a simulated spiking neuron) receives synaptic inputs form other neurons in the neural network. Biological neural networks have both action potential generation dynamics and network dynamics. In comparison to true biological networks, the network dynamics of artiﬁcial SNNs are highly simpliﬁed. In this context, it is useful to assume that the modeled spiking neurons have pure threshold dynamics (in contrast to, e.g., refractoriness, hysteresis, resonance dynamics, or post-inhibitory rebound properties). The activity of pre-synaptic neurons modulates the membrane potential of postsynaptic neurons, generating an action potential or spike when the membrane potential crosses a threshold. Hodgkin and Huxley were the ﬁrst to model this phenomenon [16]."}, {"source": "Neuronal Dynamics", "page": 30, "text": "j towards the synapse of a postsynaptic neuron i. When we introduced in Fig. 1.5 the postsynaptic potential that is generated after the arrival of the spike at the synapse, its shape and amplitude did not depend on the state of the postsynaptic neuron i. This is of course a simpliﬁcation and reality is somewhat more complicated. In Chapter 3 we will discuss detailed neuron models that describe synaptic input as a change of the membrane conductance. Here we simply summarize the major phenomena. In Fig. 1.11 we have sketched schematically an experiment where the neuron is driven by a constant current I0. We assume that I0 is too weak to evoke ﬁring so that, after some relaxation time, the membrane potential settles at a constant value u0. At t = t(f) one of the presynaptic neurons emits a spike so that shortly afterwards the action potential arrives at the synapse and provides additional stimulation of the postsynaptic neuron. More"}, {"source": "Neuronal Dynamics", "page": 30, "text": "at the synapse and provides additional stimulation of the postsynaptic neuron. More precisely, the spike generates a current pulse at the postsynaptic neuron (postsynaptic current, PSC) with amplitude PSC ∝ [u0 −Esyn] (1.33) where u0 is the membrane potential and Esyn is the ‘reversal potential’ of the synapse. Since the amplitude of the current input depends on u0, the response of the postsynaptic potential does so as well. Reversal potentials are systematically introduced in Chapter 2; models of synaptic input are discussed in Chapter 3.1. Example: Shunting inhibition The dependence of the postsynaptic response upon the momentary state of the neuron is most pronounced for inhibitory synapses. The reversal potential of inhibitory synapses Esyn is below, but usually close to the resting potential. Input spikes thus have hardly any eﬀect on the membrane potential if the neuron is at rest; cf. Fig. 1.11A. However, if the membrane"}], "claims": ["Synaptic currents are typically modeled as exponentially decaying currents following each presynaptic spike in spiking neural networks trained with surrogate gradients.", "The amplitude of a postsynaptic current depends on the difference between the membrane potential and the reversal potential of the synapse according to Neuronal Dynamics."]}, {"code": "A015", "question": "How could a community-run tarpit infrastructure help clean up IoT botnets, and what tool could attackers use to detect and avoid network tarpits?", "reference": "The tarpit feasibility study argues that, given enough participating devices (few enough for a community project), democratized botnet cleanup with tarpits could contain and eliminate the botnet threat, and it releases an open-source turn-key honeypot/tarpit that organizations and volunteers can run. Network tarpits masquerade as many fake hosts to deceive scanners, but Degreaser, an active probing detector based on packet fingerprinting, can detect tarpits and could be used by attackers for that purpose.", "answer": "A community-run tarpit infrastructure could help clean up IoT botnets by leveraging spare devices to run a honeypot/tarpit solution, potentially containing and eliminating the threat. Attackers could use the detection methodology suggested in the paper to automatically skip tarpits, gaining immunity to their effects.", "kg": null, "passages": [{"source": "Could you clean up the Internet with a Pit of Tar - Investigating tarpit feasibility on Internet worms", "page": 1, "text": "Could you clean up the Internet with a Pit of Tar? Investigating tarpit feasibility on Internet worms Harm Griffioen Hasso Plattner Institute University of Potsdam, Germany harm.griffioen@hpi.de Christian Doerr Hasso Plattner Institute University of Potsdam, Germany chrisitan.doerr@hpi.de Abstract—Botnets often spread through massive Internet-wide scanning, identifying and infecting vulnerable Internet-facing devices to grow their network. Taking down these networks is often hard for law enforcement, and some people have proposed tarpits as a defensive method because it does not require seizing infrastructure or rely on device owners to make sure their devices are well-configured and protected. These tarpits are network services that aim to keep a malware-infected device busy and slow down or eradicate the malicious behavior. This paper identifies a network-based tarpit vulnerability in stateless-scanning malware and develops a tarpitting exploit."}, {"source": "Could you clean up the Internet with a Pit of Tar - Investigating tarpit feasibility on Internet worms", "page": 13, "text": "the software to lock up. Combined with our tarpit at scale, such vulnerabilities would further amplify our impact. Given a permanent vulnerability, even a tarpit infrastructure of trivial size could scale a botnet down. The easiest route forward – and the one that malware authors could not adapt to – would be to democratize botnet cleanup. Given that enough devices participate – where the required number is low enough that this could be done as a community project –, it will be possible to contain and eliminate this threat platform that has significantly heightened the Internet threat landscape in the past years. We release a flexible, turn-key honeypot/tarpit solution as open-source to leverage this insight. Organizations and individual volunteers can run their part of a botnet sinkhole on spare devices, requiring minimal resources from the hardware and the network. We provide this platform as part of this work, and we invite"}, {"source": "Uncovering Network Tarpits with Degreaser", "page": 10, "text": "we can only assume that as malicious scanning tools evolve, they will become more resilient to the eﬀects of tarpits. Furthermore, we believe that our detection methodology could easily be incorporated into operating system TCP stacks in order to automatically skip tarpits, providing immunity to all network applications (abusive or otherwise). Due to the negative eﬀect these tarpitting subnets have on a variety of legitimate network scans, we suggest more explicit distribution of known-tarpits among whitehat communities in conjunction with using techniques developed in degreaser. Further, we presented avenues for future research into making tarpits more resilient to detecting and more believable to adversaries. We thus hope this work serves to raise awareness of a particular form of network deception that is popular in the wild, and its present-day implications. Acknowledgments We thank Mark Gondree, kc claﬀy, John Heidemann, and"}, {"source": "Could you clean up the Internet with a Pit of Tar - Investigating tarpit feasibility on Internet worms", "page": 12, "text": "Reducing the speed of infection spread. Walla and Rossow note that a tarpit can be very effective in slowing down infection spread from a device [40]. While one device can be significantly impaired and therefore be slowed down, the effects of such slowdowns on the entire ecosystem are not yet known. We simulate a botnet scenario where 1% of the vulnerable population is infected at the start and a tarpit is active, aiming to disrupt the botnet from spreading through the network. We find that in practice, the effect of this slowdown is marginal as a botnet grows exponentially, and a device has to be observed by the tarpit network first before the slowdown occurs. Suppose the number of vulnerable devices is larger than the size of the tarpit. In that case, infected devices have a higher chance of finding and infecting a new device than ending up in the tarpit, keeping the infection spread alive. In our simulations, we find that when using a tarpit network"}], "claims": ["A community-run tarpit infrastructure can help clean up IoT botnets.", "Spare devices can be used to run a honeypot/tarpit solution.", "A honeypot/tarpit solution can contain and eliminate the threat of IoT botnets.", "Attackers can use a detection methodology to automatically skip tarpits.", "Using a detection methodology can give attackers immunity to the effects of tarpits."]}, {"code": "A016", "question": "In the streaming question-answering evaluation, how does StreamingLLM compare with dense attention and window attention?", "reference": "Dense attention runs out of memory; window attention is efficient but has low accuracy (random outputs) once the input exceeds the cache size; StreamingLLM handles the streaming format efficiently and matches the one-shot, sample-by-sample baseline accuracy.", "answer": "In the streaming question-answering evaluation, StreamingLLM outperforms both dense attention and window attention. Dense attention results in Out-of-Memory errors, while window attention provides low accuracy due to random outputs when the input length exceeds the cache size. Conversely, StreamingLLM efficiently handles the streaming format and maintains reasonable accuracy even as input lengths approach 120K tokens.", "kg": null, "passages": [{"source": "Efficient streaming language models with attention sinks", "page": 8, "text": "position using an exact match criterion. As table 5 indicates, dense attention results in Out-of-Memory (OOM) errors, showing it unsuitable for this setting. While the window attention method works efficiently, it exhibits low accuracy due to random outputs when the input length exceeds the cache size. Conversely, StreamingLLM excels by efficiently handling the streaming format, aligning with the one-shot, sample-by-sample baseline accuracy. Highlighting a more fitting scenario for StreamingLLM, we introduce a dataset, StreamEval, inspired by the LongEval (Li et al., 2023) benchmark. As depicted in Figure 8, diverging from LongEval’s single query over a long-span setup, we query the model every 10 lines of new information. Each query’s answer is consistently 20 lines prior, reflecting real-world instances where questions typically pertain to recent information. As illustrated in Figure 9, LLMs employing StreamingLLM maintain"}, {"source": "Efficient streaming language models with attention sinks", "page": 4, "text": "Published as a conference paper at ICLR 2024 Dense Attention Window Attention Sliding Window  w/ Re-computation StreamingLLM Figure 3: Language modeling perplexity on texts with 20K tokens across various LLM. Observations reveal consistent trends: (1) Dense attention fails once the input length surpasses the pre-training attention window size. (2) Window attention collapses once the input length exceeds the cache size, i.e., the initial tokens are evicted. (3) StreamingLLM demonstrates stable performance, with its perplexity nearly matching that of the sliding window with re-computation baseline. Improving LLMs’ Utilization of Long Text optimizes LLMs to better capture and employ the content within the context rather than merely taking them as inputs. As highlighted by Liu et al. and Li et al., success in the previously mentioned two directions does not necessarily translate to competent utilization of lengthy contexts. Addressing this effective usage of prolonged contexts"}, {"source": "Efficient streaming language models with attention sinks", "page": 8, "text": "(Figure 2), shows early-layer local attention and deeper-layer focus on initial tokens. In contrast, models trained with a sink token consistently concentrate on the sink across layers and heads, indicating an effective attention offloading mechanism. This strong focus on the sink, with reduced attention to other initial tokens, explains the sink token’s efficacy in enhancing model’s streaming performance. 4.3 RESULTS ON STREAMING QUESTION ANSWERING WITH INSTRUCTION-TUNED MODELS To show StreamingLLM’s real-world applicability, we emulate multi-round question-answering using instruction-tuned LLMs, commonly used in real-world scenarios. We first concatenate all question-answer pairs from the ARC-[Challenge, Easy] datasets, feed the continuous stream to Llama-2-[7,13,70]B-Chat models, and assess model completions at each answer position using an exact match criterion. As table 5 indicates, dense attention results in Out-of-Memory"}, {"source": "Efficient streaming language models with attention sinks", "page": 8, "text": "pertain to recent information. As illustrated in Figure 9, LLMs employing StreamingLLM maintain reasonable accuracy even as input lengths approach 120K tokens. In contrast, both dense and window attention fail at the pre-training text length and the KV cache size, respectively. Additionally, we utilize two context-extended models, LongChat-7b-v1.5-32k (Li et al., 2023) and Llama-2-7B-32KInstruct (Together, 2023), to show that StreamingLLM can complement context extension techniques. Within StreamingLLM, context extension means broadening the maximum cache size of streaming LLMs, enabling the capture of broader local information. 8"}], "claims": ["Dense attention results in Out-of-Memory errors.", "Window attention provides low accuracy due to random outputs when the input length exceeds the cache size.", "StreamingLLM efficiently handles the streaming format.", "StreamingLLM maintains reasonable accuracy even as input lengths approach 120K tokens.", "StreamingLLM outperforms both dense attention and window attention."]}, {"code": "A017", "question": "How do the best reported quantum gate error rates compare with those of classical transistors, and what limitations did a quantum error correction demonstration with a Toffoli gate on superconducting qubits have?", "reference": "The best reported error rates (trapped ions) are about 10^-7 for single-qubit and 10^-5 for two-qubit gates, but effective rates in multi-qubit systems are closer to 10^-4 and 10^-2, whereas digital transistors reach 10^-23, so fault-tolerant computation depends on effective QEC. In the superconducting demonstration the Toffoli gate reached 85% (classical action) and 78% (quantum process) fidelity and QEC reduced the error rate quadratically, but it was limited by coherence times (T1 = 0.7-1.3 µs), gate fidelity insufficient for large-scale fault tolerance, and only two error models.", "answer": "The best reported quantum gate error rates are higher than those of modern digital transistors. Quantum systems, including superconducting qubits, have much higher error rates compared to the low error rates of modern digital transistors. A quantum error correction demonstration with a Toffoli gate on superconducting qubits had limitations such as being constrained by the coherence times of superconducting qubits, implementing only two error models, and not being sufficient for large-scale fault-tolerant quantum computing.", "kg": "Knowledge graph entities:\n- Toffoli gate (ALGORITHM): Toffoli gate achieved 85% fidelity for classical action and 78% for quantum process action.; Two universal gates for reversible computation.; Toffoli and Fredkin gates are used to simulate non-reversible gates.\n- gate error rate (METRIC): Measure of the accuracy of quantum gate operations.; Error rate during quantum gate operations.; Measure of the reliability of a quantum gate.; Measure of accuracy in quantum gates.; Error rates that need to be reduced f\n- superconducting qubit (SYSTEM): Scientists developed superconducting qubits.; Quantum hardware platform based on Josephson junctions.; Superconducting qubits are manufactured using standard lithographic techniques.; A qubit that uses energy eigenstates\n- quantum bits (HARDWARE): Quantum bits (qubits) serve as the basic physical component of quantum hardware units.; Basic physical component of quantum hardware units.; IBM Osprey is the most powerful quantum computer ever built and has just 433 qu\n- error rates (METRIC): Critical challenges such as error rates.; Error rates are decreasing.; Measure of machine fidelity with high and fluctuating values.; Measure of the probability of a quantum operation failing.; Error rates for single and\n- error correction (DEFENSE): A practical challenge addressed in the study, which can affect the performance of quantum systems.; Techniques used to refine and improve the stability of qubits.; Algorithm for reducing errors in quantum systems.; Metho\n- quantum error correction (DEFENSE): Technique to mitigate errors in quantum computations.; Methods to protect quantum information from errors.; Technique to advance the practical application of QSVM by mitigating quantum errors.; Supports applications in q\n- quantum gate (ALGORITHM): Not explicitly stated in the passage, but implied as a core concept.; Validating the correct operation of quantum gates.; Pedagogical tools for quantum gates are introduced.; Basic unit of computation in QNNs.; Quantum g\n\nKnowledge graph relations:\n- Toffoli gate -- quantum error correction: The QEC protocol showcases the effectiveness of the correction mechanism for the Toffoli gate.\n- gate error rate -- quantum gate: Lower gate error rates improve the accuracy of quantum gates.\n- quantum hardware -- quantum gate accuracy: Lower gate error rates will allow for more accurate gates.\n- gate error rate -- fault-tolerant quantum computing: Lower gate error rates reduce the overhead cost of quantum error correction.\n- error rates -- quantum gate: Error rate measures the accuracy of quantum gates.\n- quantum error correction -- quantum gate accuracy: Improved quantum gate accuracy will lower the overhead cost of quantum error correction.\n- quantum error correction -- gate error rate: Quantum error correction imposes a heavy overhead cost in gate error rate.\n- modern digital transistors -- error rates: Modern digital transistors have much lower error rates than quantum systems.\n- topological quantum computing -- gate error rate: Topological quantum computing relies on reducing gate error rates.\n- physical qubit -- gate error rate: Physical qubits are subject to gate errors.\n- superconducting qubit -- gate fidelity: Improving gate fidelities is a challenge for superconducting qubits.\n- quantum gate -- fully fault-tolerant quantum computing: Striving for more accurate quantum gates is a step toward fully fault-tolerant quantum computing.", "passages": [{"source": "QUANTUM KEY DISTRIBUTION - Bridging Theoretical Security Proofs, Practical Attacks, and Error Correction", "page": 28, "text": "the Toffoli gate achieved 85% fidelity for classical action and 78% fidelity for quantum process action. The QEC protocol reduced the error rate quadratic to the single-qubit error rate, showcasing the effectiveness of the correction mechanism. There are few limitations of this work, • The implementation is constrained by the coherence times of superconducting qubits, with lifetimes around T1 = 0.7 −1.3µs. • The gate fidelity, while significant, might not be sufficient for large-scale fault-tolerant quantum computing. • Only two error models are implemented; more complex error models such as amplitude damping, dephasing errors, etc. This work serves as a quite detailed work implementing the simplest form of QECC, and can be important for future works on implementing more complex QECCs on superconducting qubits."}, {"source": "Quantum Computing in the NISQ era and beyond", "page": 14, "text": "of bits long) using fault-tolerant quantum computing is not likely to happen for a while, because of the large number of physical qubits needed. To run algorithms involving thousands of protected qubits we’ll need a number of physical qubits which is in the millions, or more [56]. That’s a very large leap from where we will be for the next few years, with of order a hundred qubits. Crossing the “quantum chasm,” from hundreds of physical qubits to millions of physical qubits, is going to take some time, but we’ll get there eventually. Throughout the NISQ era it will remain important to strive for lower gate error rates in the various quantum platforms. With more accurate quantum gates, quantum computers operating without error correction will be able to go further by executing larger circuits. Better gates will also lower the overhead cost of doing quantum error correction when we eventually move on to fault-tolerant quantum computing in the future. (Microsoft’s"}, {"source": "Quantum Computing in the NISQ era and beyond", "page": 15, "text": "ones. We should continue to focus on building quantum hardware with lower gate error rates. Improved quantum gate accuracy will lower the overhead cost of quantum error correction when it is eventually implemented. In the nearer term, more accurate gates will allow us to execute larger quantum circuits, and so extend the power of NISQ technology. NISQ is not likely to change the world all by itself. Instead, the primary goal for nearterm quantum platforms should be to pave the way for bigger payoﬀs which will be realized by more advanced quantum devices down the road. Accepted in Quantum 2018-07-30, click title to verify 15"}, {"source": "Practical Challenges in Executing Shor’s Algorithm", "page": 14, "text": "the open-source PennyLane platform to support hybrid quantum-classical algorithm design. System scale, error rates and error correction For context, earlier resource estimates suggest that factoring a 2048-bit RSA modulus using a relatively direct implementation of Shor’s algorithm would require on the order of 8.4 million physical qubits [40], assuming that they can be operated with sufficiently low error rates and long coherence times. More recent analyses, which incorporate algorithmic improvements and more efficient QEC pipelines, reduce this requirement but still call for very large, high-quality devices [21, 22, 23]. It is important to emphasize that qubit count alone is an incomplete measure of progress. For Shor’s algorithm and many other applications, critical parameters include gate and measurement error rates, clock speed, qubit connectivity, and the overhead of the chosen QEC code."}], "claims": ["The best reported quantum gate error rates are higher than those of modern digital transistors.", "Quantum systems, including superconducting qubits, have much higher error rates compared to the low error rates of modern digital transistors.", "A quantum error correction demonstration with a Toffoli gate on superconducting qubits was constrained by the coherence times of superconducting qubits.", "The quantum error correction demonstration with a Toffoli gate on superconducting qubits implemented only two error models.", "The quantum error correction demonstration with a Toffoli gate on superconducting qubits was not sufficient for large-scale fault-tolerant quantum computing."]}, {"code": "A018", "question": "What is the status of Kyber and Dilithium support in the MbedTLS and Crypto++ libraries, and why are Kyber and Dilithium considered suitable for general-purpose deployment?", "reference": "MbedTLS does not yet implement Kyber or Dilithium (it supports LMS signatures) but intends to add Kyber soon and Dilithium later, which matters because it runs on millions of IoT devices. Crypto++ (version 8.9) has no NIST PQC finalists in its mainline, but a third-party fork (cryptopp-pqc) adds CRYSTALS-Kyber, CRYSTALS-Dilithium, SABER and FrodoKEM. Kyber and Dilithium strike a balance between efficiency and simplicity and are considered the most mature post-quantum candidates.", "answer": "MbedTLS plans to add Kyber and Dilithium, with Kyber (as ML-KEM) likely coming first due to its urgency. MbedTLS does not yet have these algorithms implemented but has strong intent to add them. Crypto++ does not include NIST PQC finalists in its mainline distribution as of version 8.9, but a fork has added CRYSTALS-Kyber and CRYSTALS-Dilithium. Kyber and Dilithium are considered suitable for general-purpose deployment due to their quantum-resistance and balanced efficiency, making them attractive for secure communication protocols like TLS.", "kg": "Knowledge graph entities:\n- MbedTLS (SYSTEM): Cryptographic open-source library.; Library that can support post-quantum cryptography.; Library widely used in embedded/IoT that currently lacks NIST PQC algorithms.; Cryptographic library supporting LMS.; Needs to impl\n- Kyber (ALGORITHM): Quantum-resistant cryptographic algorithm evaluated in the study.; Quantum-safe alternative recommended for full adoption before 2030.; Lattice-based key encapsulation mechanism based on Module-LWE problem.; Algorithm co\n- Dilithium (ALGORITHM): Quantum-resistant cryptographic algorithm evaluated in the study.; One of the digital signature schemes selected for standardization.; Digital signature scheme.; Algorithm designed with a focus on balancing efficiency an\n- ML-KEM (ALGORITHM): Module-lattice based key-encapsulation mechanism.; Post-quantum key encapsulation mechanism (Kyber) that is on the roadmap for libsodium.; KEM variant of Kyber.; Will likely come first in NIST standardization due to its \n- Lattice-based encryption schemes (SYSTEM): Novel approaches to data protection intended to withstand attacks from quantum computers.; Lattice-based encryption (Kyber) is used in hybrid systems.; Encryption schemes based on the Learning With Errors (LWE) problem.;\n- Crypto++ (SYSTEM): Cryptographic open-source library.; A widely used C++ library known for its broad set of crypto-primitives.; Cryptographic library.; Popular C++ library missing native PQC support as of 2025.; Library that supports NIST \n- side-channel attack (ATTACK): Dilithium offers protection against this.; Risk of side-channel attacks requires mitigation strategies.; Need to develop efficient countermeasures against.; Still need to be well considered for Kyber's implementation.; R\n- libraries (CONCEPT): Part of cryptographic assets.\n\nKnowledge graph relations:\n- MbedTLS -- Kyber: Mbed TLS plans to add Kyber as ML-KEM.; MbedTLS needs to implement Kyber for quantum safety.; MbedTLS does not yet have Kyber implemented.; MbedTLS will use Kyber in TLS transport.\n- MbedTLS -- Dilithium: MbedTLS does not yet have Dilithium implemented.; MbedTLS can be used with LMS for embedded devices.\n- MbedTLS -- CRYSTALS-Kyber: MbedTLS supports CRYSTALS-Kyber.\n- MbedTLS -- CRYSTALS-Dilithium: MbedTLS supports CRYSTALS-Dilithium.\n- ML-KEM -- MbedTLS: Kyber will be implemented first in MbedTLS.\n- Dilithium -- TLS: Dilithium is particularly attractive for secure communication protocols like TLS.; Dilithium is considered for integration into TLS.; Dilithium is being considered for replacement in TLS.\n- Dilithium -- crypto-agile: Dilithium can be implemented in a crypto-agile manner.\n- CRYSTALS-Dilithium -- Kyber: Security analysis compared CRYSTALS-DILITHIUM against Kyber.\n- SPHINCS+ -- Dilithium: Kyber and Dilithium are considered more mature.; Dilithium’s performance compared to SPHINCS+.; Both are post-quantum cryptographic algorithms.; NIST has presented Dilithium and SPHINCS+ as postquantum signature standard\n- Kyber -- Dilithium: Both are quantum-resistant algorithms evaluated in the study.; Kyber, Dilithium, Falcon, and SPHINCS+ are selected for transitioning to quantum-safe methods.; Both algorithms have been designed with a focus on balancing \n- Crypto++ -- CRYSTALS-Dilithium: Crypto++ supports CRYSTALS-Dilithium.; Fork of Crypto++ added CRYSTALS-Dilithium.\n- PQC integration -- Dilithium: Experiments embedding CRYSTALS-Kyber and Dilithium into TLS and VPN frameworks.", "passages": [{"source": "A Survey of Post-Quantum Cryptography Support in Cryptographic Libraries", "page": 7, "text": "Preprint – A Survey of Post-Quantum Cryptography Support in Cryptographic Libraries 7 Observation: MbedTLS does not yet have Kyber, Dilithium, Falcon, or SPHINCS+ implemented, but supports LMS for signatures, and has strong intent to add Kyber soon, followed by Dilithium eventually. This will be a major development because MbedTLS is used in millions of IoT devices (everything from small appliances to sensors). 5.4 Crypto++ Crypto++ is a widely used C++ library known for its broad set of crypto-primitives. We rank it fourth in our list. Historically, Crypto++ has been cautious in adopting cutting-edge algorithms until standards stabilize. As of version 8.9 (late 2023), it does not include the NIST PQC finalists in its mainline distribution. However, third-party efforts have emerged: from 2020–2022, Finnish researchers (J. Hekkala et al.) created a fork adding CRYSTALS-Kyber, CRYSTALS-Dilithium, SABER, and later FrodoKEM [40,41]. This fork (cryptopp-pqc)"}, {"source": "A Survey of Post-Quantum Cryptography Support in Cryptographic Libraries", "page": 6, "text": "official timeline is given. Observation: For now, if quantum readiness is required, libsodium alone is insufficient – one must integrate additional tools. This gap highlights that not all libraries have moved at the same pace; ease-of-use libraries such as libsodium may take a bit longer to incorporate cutting-edge PQC algorithms. 5.3 MbedTLS MbedTLS (now part of Arm’s Open-Source Security), ranked third on our list and widely used in embedded/IoT, currently has no NIST PQC algorithms implemented in its official release, but it is on their roadmap. The maintainers explicitly stated that they plan to add post-quantum cryptography now that standards are available. A forum query in March 2024 asked about Dilithium/Kyber support, and the response from an Mbed TLS developer was: \"Yes, eventually, we will add standard post-quantum algorithms. We don’t know when yet, and we are not going to anticipate NIST standardization. Kyber (as ML-KEM) will likely come first since KEM is more urgent"}, {"source": "A Survey of Post-Quantum Cryptography Support in Cryptographic Libraries", "page": 2, "text": "libraries have implemented support for the NIST-selected postquantum algorithms (specifically the NIST PQC finalists and standards). Our definition of a cryptographic open-source library includes any specific software implementation of modern cryptographic primitives and algorithms completed by the opensource community. There are more than 15 such open-source libraries integrated into projects that require cryptographic primitives [7]. For this survey, we focus only on nine that include OpenSSL [8], wolfSSL [9], BoringSSL [10], LibreSSL [11], Bouncy Castle [12], libsodium [13], Crypto++ [14], Botan [15], and MbedTLS [16] given their wide adoption in software and systems. The focus is confined to NIST PQC finalist algorithms, specifically those chosen for standardization in 2022: CRYSTALS-Kyber (a KEM based on lattices), CRYSTALSDilithium (a lattice-based digital signature), FALCON (signature using lattice techniques), and SPHINCS+ (a signature"}, {"source": "A Survey of Post-Quantum Cryptography Support in Cryptographic Libraries", "page": 11, "text": "and Botan have moved aggressively to implement NIST’s postquantum algorithms, providing developers with ready-to-use tools for quantum-resistant encryption and signatures. wolfSSL, Bouncy Castle integrate Kyber and Dilithium into their TLS stack today, and Botan offers a rich PQC suite in its C++ API [56,60]. On the other end, libsodium, has yet to embrace PQC, reflecting caution and the challenges of adding these complex schemes to a minimalist library [37]. Similarly, PQC support for Crypto++ and LibreSSL is either not yet on their roadmap, or for MbedTLS the conversation has just started. OpenSSL2, the most critical library for Internet security, is in a transitional phase: it does not officially support PQC as of early 2025, but clear plans and ongoing work signal that Kyber, Dilithium, and others will be integrated in the near future [19]. In the meantime, OpenSSL users must rely on external providers such as liboqs for PQC capabilities. BoringSSL (Google’s fork),"}], "claims": ["MbedTLS plans to add Kyber and Dilithium.", "MbedTLS does not yet have Kyber and Dilithium implemented.", "MbedTLS has strong intent to add Kyber and Dilithium.", "Crypto++ does not include NIST PQC finalists in its mainline distribution.", "A fork of Crypto++ has added CRYSTALS-Kyber and CRYSTALS-Dilithium.", "Kyber and Dilithium are quantum-resistant.", "Kyber and Dilithium are balanced in efficiency.", "Kyber and Dilithium are suitable for general-purpose deployment.", "Kyber and Dilithium are attractive for secure communication protocols like TLS.", "Kyber is likely to be implemented first due to its urgency.", "ML-KEM is Kyber."]}, {"code": "A019", "question": "What type of neural network is used for end-to-end encrypted traffic classification that learns features directly from raw traffic?", "reference": "A one-dimensional convolutional neural network (1D-CNN), which learns features from raw traffic layer by layer and feeds high-level features to a softmax layer that directly outputs the predicted labels.", "answer": "One-dimensional convolution neural networks (1D-CNN) are used for end-to-end encrypted traffic classification, learning features directly from raw traffic.", "kg": null, "passages": [{"source": "End-to-end Encrypted Traffic Classification with One-dimensional Convolution Neural Networks", "page": 3, "text": "B. End-to-end Framework Overview  Figure 2 shows the overview of our proposed end-to-end  encrypted traffic classification method, consisting of  preprocess phase, training phase and test phase. Compared  with the traditional machine learning methods using divideand-conquer, this framework does not contain these  independent modules such as feature extraction, feature  selection and classifier. In fact these modules are integrated  into the CNN model. The features are automatically learned  and the traffic is directly classified through the softmax  layer, and then the nonlinear relationship between the raw  input and the expected output are determined, achieving the  goal of end-to-end learning.  ISCX Dataset ( Raw Traffic ) Test Traffic Labels Training Traffic Idx1Files Idx3 Files Idx3 Files Preprocess Phase CNN Model Mini-batch SGD Training Fine-tuned CNN Model Predict Labels Training Phase Test Phase   Fig. 2. End-to-end Framework Overview"}, {"source": "End-to-end Encrypted Traffic Classification with One-dimensional Convolution Neural Networks", "page": 2, "text": "commonly used in deep learning technology. Instead of  dividing a complex problem into sub-problems, it can  directly learn the nonlinear relationship between the raw  traffic input and the expected output label. Compared with  the divide-and-conquer strategy, end-to-end strategy has a  natural synergistic effect [9] and it is more likely to get the  global optimal solution.  The contributions of our work are as follows. Firstly, we  propose an end-to-end encrypted traffic classification  method with 1D-CNN, and to the best of our knowledge,  this is the first time to apply an end-to-end method to the  encrypted traffic classification domain. Secondly, we  determine the best representation type of encrypted traffic  and the best 1D-CNN model architecture by contrasting  various experiments. Finally, our study yields significant  improvements to the state-of-the-art method on a public  ISCX VPN-nonVPN (ISCX) traffic dataset [10]. Besides, all"}, {"source": "End-to-end Encrypted Traffic Classification with One-dimensional Convolution Neural Networks", "page": 1, "text": "classification method with one-dimensional convolution neural  networks. This method integrates feature extraction, feature  selection and classifier into a unified end-to-end framework,  intending to automatically learning nonlinear relationship  between raw input and expected output. To the best of our  knowledge, it is the first time to apply an end-to-end method to  the encrypted traffic classification domain. The method is  validated with the public ISCX VPN-nonVPN traffic dataset.  Among all of the four experiments, with the best traffic  representation and the fine-tuned model, 11 of 12 evaluation  metrics of the experiment results outperform the state-of-theart method, which indicates the effectiveness of the proposed  method.  Keywords—encrypted traffic classification; end-to-end; onedimensional convolutional neural networks  I.   INTRODUCTION  Traffic classification is the task of associating network  traffic to a specific class according to the requirements,"}, {"source": "End-to-end Encrypted Traffic Classification with One-dimensional Convolution Neural Networks", "page": 2, "text": "hand, the disadvantage is also obvious. The optimal solution  of sub-problem does not mean the optimal solution of the  global problem, and the optimal solution of each step does  not mean the optimal solution of the whole process.  In this paper, we propose an end-to-end method of  encrypted  traffic  classification  with  one-dimensional  convolution neural networks [8] (1D-CNN). This method is  based on deep learning which is a representative technology  in representation learning domain. 1D-CNN is applied as  learning algorithm, and it directly learns features from raw  traffic automatically. The traffic features are learned layer  by layer, and the high level features are as the input of  softmax layer. Finally the 1D-CNN directly outputs the  predicted labels. Figure 1b shows the procedure described  above. That strategy is the end-to-end strategy, which is  commonly used in deep learning technology. Instead of  dividing a complex problem into sub-problems, it can"}], "claims": ["One-dimensional convolution neural networks (1D-CNN) are used for end-to-end encrypted traffic classification.", "1D-CNN learns features directly from raw traffic."]}, {"code": "A020", "question": "What is Shor's algorithm and how does it impact the security of current cryptographic systems?", "reference": "Shor's algorithm, proposed by Peter Shor in 1994, efficiently factors large integers and computes discrete logarithms in polynomial time, which directly undermines the security assumptions of current public-key cryptographic systems.", "answer": "Shor's algorithm is a quantum algorithm that can efficiently factor large numbers, a task that is computationally infeasible for classical computers. This capability threatens the security of widely used public-key encryption schemes like RSA, which rely on the difficulty of factoring large integers. By reducing the computational complexity to polynomial time, Shor's algorithm can break these systems, making current cryptographic methods vulnerable to quantum attacks.", "kg": null, "passages": [{"source": "Next-Generation Quantum Security - The Impact of Quantum Computing on Cybersecurity—Threats, Mitigations, and Solutions", "page": 2, "text": "S. Ali et al. emerging technology introduces fundamentally new ways of processing information, enabling certain algorithms to outperform  their classical counterparts by orders of magnitude. Among the most prominent examples are Shor’s algorithm for factoring large  integers and computing discrete logarithms [5], and Grover’s algorithm for unstructured search [6], both of which have direct  implications for the foundational structures of modern cryptography. The exponential speedup offered by Shor’s algorithm threatens  to render widely used public-key encryption schemes—such as RSA and elliptic curve cryptography (ECC) obsolete [7], while  Grover’s quadratic speedup reduces the effective security of symmetric-key algorithms, including AES [8,9]. These vulnerabilities  could compromise the confidentiality, integrity, and authenticity of sensitive data across financial, governmental, military, and  civilian digital infrastructures."}, {"source": "Next-Generation Quantum Security - The Impact of Quantum Computing on Cybersecurity—Threats, Mitigations, and Solutions", "page": 9, "text": "frequently encountered during cryptographic key searches [83]. Grover’s algorithm weakens symmetric encryption by reducing  the number of operations required, though it impacts public-key cryptography less than Shor’s algorithm [84]. Shor’s algorithm  and Grover’s algorithm represent the two biggest discoveries in quantum computation, having a significant impact on the field of  cryptography [85]. Grover’s algorithm achieves quadratic speedup for unstructured search problems and can potentially break some symmetric  keys like AES [86], while Shor’s algorithm can efficiently factor large numbers and break public-key encryption schemes like  RSA [87]. These quantum algorithms demonstrate the power of quantum computers, making quantum-resistant cryptographic  Computers and Electrical Engineering 128 (2025) 110649  9"}, {"source": "Next-Generation Quantum Security - The Impact of Quantum Computing on Cybersecurity—Threats, Mitigations, and Solutions", "page": 7, "text": "Shor algorithm and RSA: RSA encryption bases its functionality on the ability to factor large numbers into their prime factors,  as described in [49]. RSA maintains its security value because factoring large composite numbers remains out of reach for classical  computers, as noted in [50]. RSA encryption faces a breakthrough due to the Shor algorithm, created in 1994, that performs  large factoring in polynomial time, as explained in [51]. The Shor algorithm uses factoring time to solve integers, whereas the  classical factoring problem increases exponentially with the number of digits, leading to a computational running time of 𝑂(log3 𝑛),  where 𝑛 represents the factored number. The Shor algorithm solves the periodicity problem associated with factoring, which  mathematically uses the quantum Fourier transform with an exponential speed-up over classical algorithms that cannot achieve"}, {"source": "A Survey of Quantum Machine Learning - Foundations,Algorithms, Frameworks, Data and Applications", "page": 12, "text": "𝜃((𝑙𝑜𝑔𝑁)2(𝑙𝑜𝑔(𝑙𝑜𝑔𝑁))(𝑙𝑜𝑔(𝑙𝑜𝑔(𝑙𝑜𝑔𝑁)))) with fast multiplication, or even 𝜃((𝑙𝑜𝑔𝑁)2(𝑙𝑜𝑔(𝑙𝑜𝑔𝑁)) using the fastest known multiplication algorithm. This is significantly faster than the general number field sieve, the most efficient classical algorithm. Cryptographic security is one of the primary applications of Shor’s algorithm. The algorithm can potentially break systems like RSA, which rely on the difficulty of factoring large numbers. This vulnerability has driven significant research and development in post-quantum cryptography, aiming at creating cryptographic systems that remain secure against quantum attacks. Additionally, the principles behind Shor’s algorithm can be applied to other optimization problems that benefit from the speedup provided by quantum computing. The ability to solve such problems more efficiently could have wide-ranging impacts across various fields that require complex computations and optimizations."}], "claims": ["Shor's algorithm is a quantum algorithm.", "Shor's algorithm can efficiently factor large numbers.", "Factoring large numbers is computationally infeasible for classical computers.", "Public-key encryption schemes like RSA rely on the difficulty of factoring large integers.", "Shor's algorithm can break public-key encryption schemes like RSA.", "Current cryptographic methods are vulnerable to quantum attacks."]}, {"code": "A021", "question": "How does lateral inhibition implement Winner-Takes-All competition among neurons, and what problem does Independent Component Analysis (ICA) address beyond PCA?", "reference": "In Winner-Takes-All the neuron most similar to the input is chosen as winner and, by lateral inhibition, is the only one allowed to update its weights, so different neurons specialize on different clusters; lateral connections with a nonlinearity create competition in which activations below a threshold are suppressed and those above inhibit the others. PCA finds maximally decorrelated directions of maximum variance, while ICA seeks maximally independent variables, removing higher-order correlations, and is related to Blind Source Separation.", "answer": "Lateral inhibition implements Winner-Takes-All (WTA) competition by allowing only the neuron with the strongest similarity to a given input to update its weights, while inhibiting others. ICA addresses the problem of finding data representations into a set of maximally independent variables, going beyond PCA by considering higher-order statistical moments for decorrelation.", "kg": null, "passages": [{"source": "Spiking neural networks and bio-inspired supervised deep learning - A survey", "page": 6, "text": "such as Winner-Takes-All (WTA) [67, 178]: in this case, the neuron with strongest similarity to a given input is chosen as the winner, and it is the only one allowed to perform a weight update, by virtue of lateral inhibition [55]. In this way, if a similar input will be presented again in the future, the same neuron will be more likely to win again, and different neurons will specialize on different clusters. Other forms of lateral interaction can also enable a group of neurons to extract further principal components form the input (subspace learning) [15, 93, 180]. As a further extension of PCA-based learning methods, Independent Component Analysis (ICA) aims at removing higher-order correlations from data [3, 17, 74, 85, 91, 162]. Sparse Coding (SC) [154] is another principle, strictly related to ICA [153], from which biologically plausible HaH feature learning networks can be derived, as in the Locally Competitive Algorithm (LCA) [175]."}, {"source": "Synaptic plasticity models and bio-inspired unsupervised deep learning - A survey", "page": 16, "text": "place among neurons. Indeed, it can be noticed that the nonlinearity, together with the lateral connections, induces a competitive interaction, where activations below a threshold are suppressed, while activations above a threshold inhibit the others. 4.6 Independent Component Analysis (ICA) PCA looks for directions in the data space along have maximum variance while being maximally decorrelated. This idea can be generalized also to higher-order statistical moments. In particular, a stronger condition than decorrelation is represented by independence. Independent Component Analysis (ICA) [98] addresses the problem of finding data representations into a set of maximally independent variables. ICA has strong relationships with the Blind Source Separation (BSS) problem [110]. In BSS, data are assumed to be generated by a mixing process as in Fig. 10. A mixer generates data samples x from source variables s = (𝑠1, ...,𝑠𝑁)𝑇(sampled from a problem-dependent distribution)"}, {"source": "Synaptic plasticity models and bio-inspired unsupervised deep learning - A survey", "page": 9, "text": "Bio-Inspired Deep Learning 9 to a WTA layer, the neuron whose weight vector is closest to the current input (e.g. in terms of angular or euclidean distance) is elected as winner. Only the winner is allowed to perform a weight update, according to Eq. 3, thus moving its weight vector closer to the current input (Fig. 5). If a similar input will be presented again in the future, the same neuron will be more likely to win again. Competitive interaction between neurons is biologically motivated by the lateral inhibition mechanisms [72] that we have previously highlighted. This strategy allows a group of neurons to align their weight vectors towards the centroids of distinct clusters formed by the data points (Fig. 5), which shows another connection between a neuroscience-inspired learning theory, and a data analytic operation, namely clustering. The following equation gives a mathematical description of Hebbian WTA learning: Δ𝑤𝑖,𝑗= 𝜂𝑟𝑗(𝑥𝑖−𝑤𝑖,𝑗) (14)"}, {"source": "Synaptic plasticity models and bio-inspired unsupervised deep learning - A survey", "page": 5, "text": "the neuron. We can already outline a first connection between the neuroscientific Hebbian learning theory and data science, specifically Principal Component Analysis (PCA): if multiple inputs are presented to a neuron, assuming that the activation function is linear and that the inputs have zero means, it can be shown [79, 177] that Eq. 1 induces the weight vector to align towards the principal component of the data distribution. The problem with Eq. 1 is that there are no mechanisms to prevent the weights from growing unbounded, thus leading to possible instability. This issue can be counteracted by adding a weight decay term 𝛾(w, x) to the learning rule: Δ𝑤𝑖= 𝜂𝑦𝑥𝑖−𝛾(w, x) (2) In particular, with an appropriate choice for this term, i.e. 𝛾(w, x) = 𝜂𝑦(w, x) 𝑤𝑖, we obtain a learning rule that has been widely applied to the context of competitive learning (which will be discussed more in detail later) [84, 120, 207]: Δ𝑤𝑖= 𝜂𝑦𝑥𝑖−𝜂𝑦𝑤𝑖= 𝜂𝑦(𝑥𝑖−𝑤𝑖) (3)"}], "claims": ["Lateral inhibition allows only the neuron with the strongest similarity to a given input to update its weights.", "Lateral inhibition inhibits other neurons.", "ICA addresses the problem of finding data representations into a set of maximally independent variables.", "ICA goes beyond PCA by considering higher-order statistical moments for decorrelation.", "PCA only considers second-order statistical moments for decorrelation."]}, {"code": "A022", "question": "What does the security of SPHINCS+ (SLH-DSA) rely on compared with the other algorithms NIST selected, how does it achieve stateless operation, and which FIPS standards correspond to Kyber, Dilithium and SPHINCS+?", "reference": "Three of the four selected algorithms use structured lattices, while SPHINCS+ derives its security solely from the collision resistance of hash functions. It combines a hierarchy of hash trees with few-time signatures: WOTS+ signs individual nodes, FORS gives few-time signatures at the leaves, and the Hypertree links them to achieve stateless operation. FIPS 203 is ML-KEM (Kyber), FIPS 204 is ML-DSA (Dilithium) and FIPS 205 is SLH-DSA (SPHINCS+).", "answer": "The security of SPHINCS+ (SLH-DSA) relies on a stateless approach, distinguishing it from other algorithms. It achieves stateless operation by not requiring any stateful components, making it easier to implement securely. NIST's FIPS 203–205 standards correspond to Kyber (a KEM), Dilithium (ML-DSA), and SPHINCS+ (SLH-DSA).", "kg": "Knowledge graph entities:\n- SLH-DSA (ALGORITHM): Hash-Based Signature Algorithm for post-quantum cryptography.; Algorithm part of SPH\n- SPHINCS+ (ALGORITHM): Hash-based digital signatures for post-quantum security.\n- FIPS (STANDARD): NIST standard for PQC algorithms.; Standard for which ML-KEM, ML-DSA, and FN-DSA have been stand\n- SPHINCS (ALGORITHM): Signature framework.\n\nKnowledge graph relations:\n- SPHINCS+ -- Dilithium: NIST has presented Dilithium and SPHINCS+ as postquantum signature standard\n- SPHINCS+ -- NIST 2022 press release: SPHINCS+ is one of the algorithms chosen by NIST.\n- NIST -- stateless hash-based backup: NIST included SPHINCS+ as a stateless hash-based backup.\n- U.S. Federal Government -- NIST’s finalized post-quantum cryptography standards (FIPS 203–205: ML-KEM, ML-DSA, SLH-DSA): One of the five major enterprise deployments analyzed.\n- IBM Quantum Safe -- NIST’s finalized post-quantum cryptography standards (FIPS 203–205: ML-KEM, ML-DSA, SLH-DSA): One of the five major enterprise deployments analyzed.\n- SPHINCS+ -- stateless approach: SPHINCS+ is based on the stateless approach.", "passages": [{"source": "Post-Quantum Cryptography and Quantum-Safe Security", "page": 11, "text": "To this end, NIST has endorsed three signature families for widespread adoption-ML-DSA (Dilithium), SLH-DSA (SPHINCS+), and the lattice-based Falcon under a parallel track-highlighting a balance between performance efficiency and conservative security across lattice- and hash-based paradigms. The selected algorithms-CRYSTALS-Dilithium (ML-DSA), Falcon (FN-DSA), and SPHINCS+ (SLH-DSA)-each bring unique trade-offs in efficiency, key and signature sizes, and assurance levels, ensuring flexibility for varied deployment requirements in the emerging quantum era."}, {"source": "A Comparative Study of Classical and Post-Quantum Cryptographic Algorithms in the Era of Quantum Computing", "page": 5, "text": "key encapsulation mechanism, and three digital signature schemes: Dilithium, Falcon, and SPHINCS+. These selections represent a foundational step toward transitioning global cryptographic infrastructure to quantum-safe methods. It achieves high throughput with low latency and has been officially selected by NIST as a general-purpose post-quantum encryption and key exchange mechanism. 5"}, {"source": "A Comparative Study of Classical and Post-Quantum Cryptographic Algorithms in the Era of Quantum Computing", "page": 8, "text": "Falcon, on the other hand, provides relatively small signatures but is notoriously difficult to implement securely. - Performance and Implementation Complexity While many post-quantum cryptographic schemes perform reasonably well in software implementations, some (like SPHINCS+) are computationally intensive. Dilithium and Kyber strike a balance between efficiency and simplicity, making them suitable for general-purpose deployment across various applications. - Deployment Readiness: A Few Front-Runners Among the post-quantum candidates, Kyber and Dilithium are considered the most mature"}, {"source": "Post-Quantum_Blockchain_Security_for_the_Internet_of_Things_Survey_and_Research_Directions", "page": 6, "text": "However, in addition to providing a standard for KEM schemes, NIST has recently presented three postquantum signatures as future deployment standards: Dilithium, FALCON, and SPHINCS+. Although Dilithium’s signature is nearly twice as large as BLISS’s (the smallest scheme among lattice-based signatures), it accomplishes a 2.5 lower public key size compared to the most effective lattice-based signature schemes. It is developed"}], "claims": ["The security of SPHINCS+ (SLH-DSA) relies on a stateless approach.", "SPHINCS+ (SLH-DSA) achieves stateless operation by not requiring any stateful components.", "NIST's FIPS 203–205 standards correspond to Kyber (a KEM).", "NIST's FIPS 203–205 standards correspond to Dilithium (ML-DSA).", "NIST's FIPS 203–205 standards correspond to SPHINCS+ (SLH-DSA)."]}, {"code": "A023", "question": "In side-channel attacks on Kyber with an imperfect plaintext-checking oracle, how much of the Kyber-512 secret key was recovered by applying the CPA attack twice, and with how many power traces?", "reference": "About 60% of the Kyber-512 secret key was recovered using about 1619 power traces, leaving 40% erroneous coefficients.", "answer": "The CPA attack applied twice could recover 60% of the Kyber-512 secret key at the cost of about 1619 power traces, according to the provided context.", "kg": null, "passages": [{"source": "An Improved Two-Step Attack on Lattice-Based Cryptography - A Case Study of Kyber", "page": 1, "text": "(FO) transform for the first time. Then for correlation power This work was supported in part by the Natural Science Foundation of Jiangsu Province of China under Grant BK20243038, in part by the Key Research Plan of Jiangsu Province of China under Grant BE2022098, and in part by the Young Elite Scientists Sponsorship Program by the China Association for Science and Technology under Grant 2023QNRC001. (Corresponding author: Jing Tian.) The authors are with the School of Integrated Circuits, Nanjing University, Suzhou, 215163, China (e-mail: tianjing@nju.edu.cn). analysis (CPA), Ueno et al. [5] proposed the side-channel leakage in re-encryption as a PC oracle, utilizing 3072 power traces to recover the key. The work in [6] deals with imperfect PC oracle SCAs by using the CPA attack twice to recover 60% secret key of Kyber-512 at the cost of about 1619 power traces, but there are still 40% error coefficients. Contrast to previous"}, {"source": "An Improved Two-Step Attack on Lattice-Based Cryptography - A Case Study of Kyber", "page": 5, "text": "heavily relies on the number of power traces, while the CPA is almost unchanged although the trace number is doubled. The main reason could be the different utilization ratios of the multi-threading server. Note that the CPA computations are independently executed with the different power traces while the trial computations of the lattice attack of SK-128 are executed in serial. Table I presents the time of implementing the proposed attacks on Kyber at different security levels, using 15 power traces across twenty experiments. Kyber-512, -768, and -1024 have 4, 6, and 8 SK-128s, respectively, with each SK-128 being independent of the others. This allows us to recover the different SK-128s in parallel. The attack method we propose can recover the full secret key on different security levels of Kyber, with the success rate remaining consistent. The reason for the slight increase in time taken at the high security level is the high parallelism of Step1 and the duration of Step2"}, {"source": "An Improved Two-Step Attack on Lattice-Based Cryptography - A Case Study of Kyber", "page": 1, "text": "secret key of Kyber-512 at the cost of about 1619 power traces, but there are still 40% error coefficients. Contrast to previous works, in [7], Yang et al. tried to carry out a random ciphertext CPA attack on the reference implementation of Kyber-512, successfully recovering two coefficients of secret key using 20 or more power traces. Nevertheless, they had to repeat the attack 256 times to recover the entire secret key of Kyber-512. So, they at least need 5120 power traces for a key. In [8], Yen-Ting Kuo and Atsushi Takayasu presented a two-step attack on Kyber by integrating the random ciphertext CPA attack with the lattice attack. They adopted the CPA attack to recover part of the coefficients of a key and then directly solved the rest coefficients by using a low-dimension equation of the M-LWE problem. The correctness was verified by using computer simulations. In this brief, we take the idea of [8] as the starting point and develop an improved two-step attack"}, {"source": "An Improved Two-Step Attack on Lattice-Based Cryptography - A Case Study of Kyber", "page": 2, "text": "access to a device which is running Kyber decryption and can only observe ciphertexts entered into the device. In addition, they can also capture the power traces of the device. Several test vector leakage assessment (TVLA) results from previous works have indicated the potential leakage points during the decryption process in Kyber [6], [7]. One critical side-channel leakage occurs during the PWM of ˆs ◦ˆu. In the clean implementation of pqm4 [11], polynomial multiplication employs 256 basemuls in Kyber-512. Moreover, each calculation of basemul is independent from the others. From Listing 1, it is clear that the result depends on two secret key coefficients, s0 and s1. All partial secret key coefficients range from (0, 3328) for Kyber. In a practical attack, suppose that the attacker aims to recover the coefficient s0. r1 can be selected as the intermediate value. A. Modified Leakage Model for CPA The Hamming weight (HW) model counts the number of"}], "claims": ["The CPA attack was applied twice on Kyber with an imperfect plaintext-checking oracle.", "60% of the Kyber-512 secret key was recovered.", "The CPA attack was applied twice.", "The cost of the attack was about 1619 power traces.", "The attack was on Kyber-512."]}, {"code": "A024", "question": "When do experts expect cryptographically relevant quantum computers (CRQCs) able to break 2048-bit RSA, and what post-quantum algorithms has NIST standardized in response?", "reference": "Industry experts estimate that CRQCs capable of breaking 2048-bit RSA keys could emerge within the next decade, potentially sooner given exponential R&D investment, because integer factorization and elliptic curve discrete logarithms are efficiently solvable on a CRQC. After a multi-year process NIST standardized a first set of PQC algorithms, including lattice-based key encapsulation (CRYSTALS-Kyber) and digital signatures.", "answer": "Experts expect CRQCs capable of breaking 2048-bit RSA to develop by the 2030s, according to the RAND Corporation. In response, NIST has standardized a set of post-quantum algorithms for which it selected its first cohort in July 2022.", "kg": "Knowledge graph entities:\n- CRQC (CONCEPT): Noted by RAND Corporation as unlikely to be developed until at least the 2030s.; Belief that a CRQC is unlikely much before 2035.; Defense against quantum computing threats.; Quantum computer used for covert decryption.;\n- post-quantum algorithms (ALGORITHM): New cryptographic constructions that are still being scrutinized.; Cryptographic algorithms resistant to quantum computer attacks.; Other researchers have analyzed the use of a certain type of post-quantum algorithm in I\n- algorithms (ALGORITHM): Multiple algorithms are part of post-quantum cryptography.; Stable set of cryptographic algorithms like RSA/ECC.; Part of cryptographic assets.\n- 2048-bit RSA (ALGORITHM): Reference for transitioning from 1024-bit RSA.\n- Cryptographically Relevant Quantum Computers (CONCEPT): Quantum computers relevant to cryptography.; Hardware that can efficiently solve the problems on which classical public-key systems depend.; Quantum systems capable of executing algorithms that can efficiently break clas\n- cryptanalytically relevant quantum computers (CONCEPT): Quantum computers capable of breaking current cryptographic systems.; A quantum computer capable of breaking classical cryptography.\n- NIST (ORGANIZATION): United States National Institute of Standards and Technology.; A U.S. organization that has standardized a set of PQC algorithms.; Selected its first cohort of PQC algorithms for standardization in July 2022.; Standardiz\n- quantum algorithms (ALGORITHM): Quantum algorithms in machine learning.; Key focus in the survey, applied in various fields.; Algorithm that exploits quantum mechanics to solve problems more efficiently than classical algorithms.; The complexity of the\n\nKnowledge graph relations:\n- Post-Quantum Cryptography -- NIST: NIST selected its first cohort of PQC algorithms for standardization.; NIST initiated a process to establish a new PQC standard.; NIST standardizes PQC algorithms.; NIST is progressing toward defining standardized PQC al\n- Post-Quantum Cryptography -- 2048-bit RSA: Transitioning from 1024-bit RSA to 2048-bit RSA is a past crypto transition.\n- Post-Quantum Cryptography -- NIST’s PQC algorithms: NIST’s PQC algorithms are robust standards for post-quantum cryptography.\n- quantum algorithms -- CRQC: Quantum algorithms are relevant to the maturity of CRQC.\n- NIST’s PQC algorithms -- 2048-bit RSA: Transitioning from 1024-bit RSA to 2048-bit RSA is a past crypto transition.\n- cryptanalytically relevant quantum computers -- Post-Quantum Cryptography: CRQC poses a threat to PQC.\n- Post-Quantum Cryptography -- Cryptographically Relevant Quantum Computers: PQC aims to secure against CRQC.\n- Grover’s algorithm -- Cryptographically Relevant Quantum Computers: Grover’s algorithm is an algorithm that can be executed by CRQCs.\n- NIST process -- post-quantum algorithms: The NIST process is for selecting post-quantum cryptographic algorithms.\n- Cryptographically Relevant Quantum Computers -- quantum hardware: CRQCs are defined as quantum systems.\n- quantum-resistant cryptographic algorithms -- NIST: NIST chooses a group of potential quantum-resistant cryptographic algorithms.\n- Shor’s algorithm -- Cryptographically Relevant Quantum Computers: Shor's algorithm demonstrates that a CRQC can efficiently solve integer factorization and discrete logarithms.; A CRQC can efficiently solve the problems on which classical public-key systems depend.; Shor’s algorithm is", "passages": [{"source": "Are Enterprises Ready for Quantum-Safe Cybersecurity", "page": 19, "text": "readiness gap. In 2025, overall enterprise readiness can be characterized as nascent and lagging behind the pace of technological and threat developments. From the technology perspective, we conclude that readiness of solutions is not the primary bottleneck. Post-quantum cryptography has advanced to the point of practicality: robust standards (e.g., NIST’s PQC algorithms) are in place and reference implementations exist [4]. Transitioning to these algorithms is a challenge but a manageable one, akin to past crypto transitions (such as from SHA-1 to SHA-256, or from 1024-bit RSA to 2048-bit RSA) albeit on a larger scale. QKD remains specialized; its adoption will likely be limited to governments and select industries in the near term. So, enterprises do not lack tools – they lack adoption of those tools. In other words, the technology has (or shortly will) reach enterprise-grade maturity, but enterprise utilization is lagging."}, {"source": "The-Quantum-Security-Deadline", "page": 5, "text": "European Journal of Computer Science and Information Technology, 13(52),35-52, 2025       Print ISSN: 2054-0957 (Print)   Online ISSN: 2054-0965 (Online)   Website: https://www.eajournals.org/   Publication of the European Centre for Research Training and Development -UK  39      Flowchart 2 : PQC Migration and Crypto-Agility Flow: CBOM, Hybrid, and CLM Integration    THE POST-QUANTUM URGENCY    Cryptographically Relevant Quantum Computers (CRQCs)  The development of Cryptographically Relevant Quantum Computers (CRQCs) marks a pivotal  turning point in cybersecurity. CRQCs are defined as quantum systems capable of executing  algorithms—such as Shor’s algorithm and Grover’s algorithm—that can efficiently break classical  cryptographic primitives. While fully fault-tolerant, large-scale quantum computers do not yet  exist, progress in quantum hardware scalability, error correction, and logical qubit stability has  been accelerating steadily (Mosca & Piani, 2021; NIST, 2024)."}, {"source": "The-Quantum-Security-Deadline", "page": 6, "text": "data, secure communications, and digital identities protected by RSA, ECC, or DH algorithms will  be instantly compromised (Kampanakis, 2024). This inevitability underscores the immediate need  to transition to Post-Quantum Cryptography (PQC) algorithms standardized by NIST and  supported by global cybersecurity agencies (NIST, 2022; ANSSI, 2023).    The “Harvest Now, Decrypt Later” (HNDL) Threat Model  The Harvest Now, Decrypt Later (HNDL) threat model represents one of the most insidious  quantum-era risks. Under this model, adversaries exfiltrate and store encrypted data today, fully  aware that decryption may only become possible years later when CRQCs reach maturity. This  strategy effectively weaponizes time, targeting the longevity of encryption rather than its  immediate strength (HashiCorp, 2025; Keyfactor, 2024).    HNDL attacks are particularly dangerous because they are undetectable at the time of exfiltration."}, {"source": "The-Quantum-Security-Deadline", "page": 2, "text": "The Quantum Threat Landscape  The quantum threat landscape is defined by the dual trajectory of technological progress and  adversarial preparation. As quantum hardware continues to scale in qubit count, coherence, and  error correction, quantum algorithms optimized for specific cryptanalytic purposes are being  refined in parallel (Kampanakis, 2024). These developments underscore the urgency of mitigating  risks before CRQCs achieve operational maturity.    Among the most pressing concerns is the “Harvest Now, Decrypt Later (HNDL)” threat model,  wherein attackers intercept and store encrypted data today, anticipating future decryption once  quantum capabilities emerge (HashiCorp, 2025; Cloudflare, 2024). The danger is especially acute  for data with long confidentiality lifespans—such as medical records, classified communications,  intellectual property, and blockchain transactions (The Quantum Insider, 2025).Governments and"}], "claims": ["Experts expect CRQCs capable of breaking 2048-bit RSA to develop by the 2030s.", "The RAND Corporation expects CRQCs capable of breaking 2048-bit RSA to develop by the 2030s.", "NIST has standardized a set of post-quantum algorithms.", "NIST selected its first cohort of post-quantum algorithms in July 2022.", "The first cohort of post-quantum algorithms selected by NIST was in July 2022."]}, {"code": "A025", "question": "What reasons suggest that quantum computers can outperform classical computers, and what role does the precision of quantum state manipulation play?", "reference": "Describing the correlations of a few hundred qubits may need more bits than there are atoms in the visible universe, but this complexity alone does not make quantum computers more powerful; a key reason is that quantum algorithms solve problems believed hard for classical computers, the best known being factoring large integers. If precision grows polynomially with the input size, quantum computers appear to be a more powerful type of computer; the achievable precision is dictated by materials and architecture rather than fundamental physical laws.", "answer": "Quantum computers can outperform classical computers due to their ability to handle highly entangled quantum states, which classical computers struggle with. The precision of quantum state manipulation, while currently uncertain, could potentially give quantum computers more power than classical computers if it is large enough. However, the exact precision required and which architectures can achieve this are not yet clear.", "kg": "Knowledge graph entities:\n- quantum computer (SYSTEM): Hardware capable of performing quantum computations.\n- Classical simulation algorithms (ALGORITHM): Traditional methods potentially outperformed by quantum circuits in simulating quantum systems.\n- NISQ computers (SYSTEM): NISQ computers will likely play an important role in understanding the foundations of quantum mechanics.\n- quantum-to-classical (DEFENSE): Quantum circuits perform feature extraction while classical components handle final predictions.\n\nKnowledge graph relations:\n- quantum computer -- classical systems: Quantum computers process information more efficiently than classical systems.\n- quantum computer -- classical computer: Quantum computers handle information fundamentally differently from classical computers.\n- quantum computer -- quantum speedup: Quantum computer solves the problem faster than classical computers.\n- quantum computer -- digital computer: Quantum computers outperform digital computers on quantum physics problems.\n- Berthiaume and Brassard -- classical computer: These papers showed problems that quantum computers can solve more efficiently than classical computers.\n- Deutsch and Jozsa -- classical computer: These papers showed problems that quantum computers can solve more efficiently than classical computers.", "passages": [{"source": "Polynomial-Time Algorithms for Prime Factorization and Discrete Logarithms on a Quantum Computer", "page": 3, "text": "computer that cannot also be computed in polynomial time on a classical computer with a random number generator. However, if we let the precision grow polynomially in the input size (that is, we let the number of bits of precision grow logarithmically in the input size), we appear to obtain a more powerful type of computer. Allowing the same polynomial growth in precision does not appear to confer extra computing power to classical mechanics, although allowing exponential growth in precision does [Hartmanis and Simon 1974, Vergis et al. 1986]. As far as we know, what precision is possible in quantum state manipulation is dictated not by fundamental physical laws but by the properties of the materials and the architecture with which a quantum computer is built. It is currently not clear which architectures, if any, will give high precision, and what this precision will be. If the precision of a quantum computer is large enough to make it more powerful than a classical"}, {"source": "Quantum Computing in the NISQ era and beyond", "page": 7, "text": "At least in the near term quantum computers are likely to be special purpose devices, which most users will access via the cloud. When we speak of a quantum speedup, we typically mean that the quantum computer solves the problem faster than competing classical computers using the best available hardware and running the best algorithm which performs the same task. (Arguably, though, quantum technology might be preferred even if classical supercomputers run faster, if for example the quantum hardware has lower cost and lower power consumption.) In any case, we should recognize that the power of classical computers will continue to increase, with exascale systems (surpassing 1018 FLOPS) expected to be available in a few years. Quantum computers are striving to catch up with a moving target, as both classical hardware and classical algorithms continually improve. A few years ago I spoke enthusiastically about quantum supremacy as an impending"}, {"source": "Quantum Computing in the NISQ era and beyond", "page": 13, "text": "for semideﬁnite programs might be within reach of NISQ technology. 6.9 Quantum simulation As I have already emphasized, we expect quantum computers to be very well suited for studying the properties of highly entangled systems of many particles. As Laughlin and Pines [8] emphasized in the statement I quoted earlier, we think that simulating such “strongly correlated” matter is a diﬃcult computational problem, because many very good physicists have tried to solve it for decades and have not succeeded. Thus, as Feynman argued [9], the simulation of highly entangled quantum matter is the natural arena where quantum computers seem to have a clear advantage over classical ones. In the l
