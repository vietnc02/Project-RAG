se where Alice will pick an inﬁnite number of possible intensities for decoy states. Let us imagine that Alice varies over all non-negative values of µ randomly and independently for"}, {"source": "Decoy State Quantum Key Distribution", "page": 1, "text": "method for the ﬁrst time makes most of the long distance QKD experiments reported in the literature unconditionally secure. Our method has the advantage that it can be implemented with essentially the current hardware. So, unlike prior art solutions based on single-photon sources, our method does not require daunting experimental developments. Our method is based on the decoy state idea ﬁrst proposed by Hwang [12]. While the idea of Hwang was highly innovative, his security analysis was heuristic. The key point of the decoy state idea is that Alice prepares a set of additional states—decoy states, in addition to standard BB84 states. Those decoy states are used for the purpose of detecting eavesdropping attacks only, whereas the standard BB84 states are used for key generation only. The only diﬀerence between the decoy state and the standard BB84 states is their intensities (i.e., their photon number distributions). By measuring the yields and QBER of decoy states, we"}, {"source": "Decoy State Quantum Key Distribution", "page": 2, "text": "to avoid being detected, the eavesdropper, Eve, has very limited options in her eavesdropping attack. In summary, the ability for Alice and Bob to verify experimentally the values of Yn and en’s in the decoy state method greatly strengthens their power in detecting eavesdropping, thus leading to a dramatic improvement in the performance of their QKD system. The decoy state method allows Alice and Bob to detect deviations from the normal behavior due to eavesdropping attacks. Therefore, in what follows, we will consider normal behavior (i.e., the case of no eavesdropping). Details of QKD set-up model can be seen in [17]. Yield Let us discuss the yields, Yn’s, in a realistic set-up. (a) The case n = 0. In the absence of eavesdropping, Y0 is simply given by the background detection event rate pdark of the system. (b) The case n ≥1. For n ≥1, yield Yn comes from two sources, i) the detection of signal photons ηn, and ii) the background event pdark. The combination gives,"}], "claims": ["Alice uses a vacuum state in the Vacuum+Weak decoy-state method for quantum key distribution.", "Alice uses a weak decoy state with a very small number of photons in the Vacuum+Weak decoy-state method for quantum key distribution.", "By measuring the yields of the decoy states, Alice and Bob can obtain reliable bounds to ensure the security of their quantum key distribution.", "By measuring the QBER of the decoy states, Alice and Bob can obtain reliable bounds to ensure the security of their quantum key distribution."]}, {"code": "A042", "question": "On what is the security of quantum key distribution (QKD) based, why are practical QKD experiments with attenuated lasers potentially insecure, and how can quantum machine learning help detect eavesdroppers?", "reference": "Unlike conventional cryptography, which relies on unproven computational assumptions, QKD security is based on the fundamental laws of physics. In practice, highly attenuated lasers sometimes emit signals with more than one photon, so experiments can be insecure due to such real-life imperfections. Quantum machine learning algorithms such as quantum support vector machines (QSVM) and quantum convolutional neural networks (QCNN) can be leveraged for eavesdropping detection.", "answer": "The security of QKD is based on the principles of quantum mechanics, offering information-theoretic security. Practical QKD experiments with highly attenuated lasers can be insecure due to the potential for generating multi-photon signals, which can be exploited by eavesdroppers. Quantum machine learning can help detect eavesdroppers by enhancing eavesdropping detection capabilities and optimizing security analysis in QKD protocols.", "kg": "Knowledge graph entities:\n- QKD (PROTOCOL): Standard for secure quantum communications.; Quantum cryptography implementations like QKD.; Quantum Key Distribution protocol for secure communications.; Protocol with technical limitations motivating the positions of v\n- Quantum Key Distribution Networks (SYSTEM): Building a QKD network at scale leads to a combinatorial explosion of needed links.; China’s 2,000-km Quantum Key Distribution network.; Target of the modified PNS attack.; This modified scheme is based on weak laser pul\n- Quantum Key Distribution (PROTOCOL): Technology that relies on coherence for secure communication.; Technology that ensures secure state transmission.; Integrated with ML to optimize communication security.; System for quantum communication.; Methods to ens\n- Risk in quantum key distribution (CONCEPT): Quantum key distribution faces threats.\n- machine learning (CONCEPT): Field essential for quantum machine learning.; Traditional machine learning methods and algorithms.; Field that integrates hybrid quantum-classical algorithms.; Machine learning processes are accelerated by quantum hardw\n- Quantum Machine Learning (CONCEPT): Field that combines quantum mechanics and machine learning.; Promising field combining quantum mechanics with machine learning.; Quantum Machine Learning, an integration of quantum foundations and machine learning techni\n- security (CONCEPT): Application of quantum-enabled algorithms in security.; Protection against compromise, deletion, or modification.; Protection against unauthorized access or attacks, a key challenge in ADAS.; Key obstacles in blockchain \n- lasers (HARDWARE): Used to control ions in trapped-ion quantum computing.\n\nKnowledge graph relations:\n- Quantum Key Distribution -- eavesdropping detection: Eavesdropping detection enables secure state transmission in quantum key distribution.; QKD protocols are analyzed for security with eavesdropping detection.; Eavesdropping detection is a process in QKD.; Eavesdropping d\n- Quantum Key Distribution -- Quantum Machine Learning: Integrated ML with quantum key distribution protocols.; QML protocols enhance QKD security.; QML algorithms improve the key generation of QKD.; QML algorithms are used for detection in QKD.; QML has been integrated into \n- Quantum Key Distribution -- eavesdropping detection capability: QKD includes eavesdropping detection capability.\n- Quantum Key Distribution -- eavesdropping: Eavesdropping attempts introduce measurable errors in QKD communication.; QKD can detect eavesdropping attempts.\n- machine learning–based anomaly detection -- Quantum Key Distribution: Can be used for event detection in QKD.\n- Quantum Key Distribution -- eavesdropper: Eavesdroppers can exploit the security offered by QKD.\n- quantum-resistant algorithms -- Quantum Key Distribution: QKD is a secure communication approach that uses quantum mechanics to protect against quantum eavesdropping attacks.\n- highly attenuated lasers -- Quantum Key Distribution: Sources used in QKD can produce multi-photon signals.\n- Quantum Key Distribution -- edge computing: QKD can enable quantum-secure communication for edge computing.\n- Quantum Key Distribution -- quantum attacks: QKD provides security against quantum attacks.\n- Quantum Cryptography -- Quantum Key Distribution: QKD and quantum-resistant encryption schemes provide secure communication.; QKD is a quantum cryptographic technique.; QKD is a protocol in QC.; QC utilizes QKD to develop secure communication systems.\n- Quantum Key Distribution -- information-theoretic security: QKD offers the promise of information-theoretic security.", "passages": [{"source": "Quantum key distribution through quantum machine learning - a research review", "page": 5, "text": "participants’ private data. This protocol relies on unitary operations and a pre-shared key, while entanglement swapping remains optional (Gong et al., 2025). Two prominent ﬁelds of quantum technology, QML and quantum cryptography (QC) hold immense potential for future advancements. While research at the intersection of QML and QC is still in its early stages, the outlook is promising as both areas continue to evolve. The integration of QML and QC could pave the way for more secure communication systems in the quantum era, as hardware capabilities and practical applications progress. 3.1 Prospects and constraints of quantum machine learning in QKD, eavesdropping detection and security analysis of QKD protocols QKD is a fundamental aspect of quantum cryptography, and integrating QML with QKD can signiﬁcantly enhance the performance of quantum cryptographic systems. Once keys are successfully generated in QKD, detecting eavesdropping becomes"}, {"source": "Quantum key distribution through quantum machine learning - a research review", "page": 5, "text": "signiﬁcantly enhance the performance of quantum cryptographic systems. Once keys are successfully generated in QKD, detecting eavesdropping becomes a critical step in ensuring the security of quantum communication channels. Strengthening QKD protocols remains a vital frontier, representing the convergence of quantum communication and quantum computing. The Table 1 provides a summary of recent QML protocols applied in QKD, highlighting current research gaps and potential future directions. 4 Discussion This article discusses advancements in QML for quantum cryptography, especially with a focus on QKD, eavesdropping detection, and security analysis. Recent studies are reviewed, and their prospects and constraints are summarized in a tabular format. Key research gaps include optimization challenges due to the lack of dedicated QML models, practical implementation and real-time testing limitations, hybrid quantum-classical tradeoffs,"}, {"source": "Quantum key distribution through quantum machine learning - a research review", "page": 4, "text": "key aspects of both QML and Quantum Cryptography (QC), highlighting how advancements in quantum mechanics and computing enhance classical cryptography and machine learning, leading to the evolution of quantum cryptography and QML. As shown in the ﬁgure, integrating QML with quantum cryptography enhances security, optimizes cryptographic processes, and improves vulnerability detection. The rest of the article explores the fundamental aspects of quantum cryptography, the role of QML in Quantum cryptography, and three major research areas: quantum key distribution, eavesdropping detection, and the security analysis of QKD protocols with advancements in QML algorithms. Additionally, it highlights current research gaps and future developments in the domain in detail. 2 Quantum cryptography Quantum cryptography utilizes quantum mechanics to develop secure communication systems that differ from conventional methods. Quantum cryptography’s security depends on physics"}, {"source": "Quantum key distribution through quantum machine learning - a research review", "page": 1, "text": "detection by leveraging various QML algorithms. KEYWORDS quantum cryptography (QC), quantum machine learning (QML), quantum key distribution (QKD), quantum convoluted neural networks (QCNN), quantum support vector machine (QSVM), eavesdropping detection, quantum secure direct communication (QSDC) 1 Introduction Beyond the constraints of classical encryption, the ﬁeld of quantum cryptography (QC) provides a revolutionary method of secure communication. Despite traditional cryptography methods, QC protocols offer veriﬁable security assurances by utilizing the concepts of quantum mechanics (Goyal, 2024). Quantum teleportation (QT), quantum secret sharing (QSS), quantum secure direct communication (QSDC), and quantum key distribution (QKD) represent the four fundamental branches of quantum cryptography protocols. Unlike QKD, which is primarily concerned with the secure negotiation of cryptographic keys, QSDC introduces a novel communication paradigm that provides a"}], "claims": ["The security of QKD is based on the principles of quantum mechanics.", "QKD offers information-theoretic security.", "Practical QKD experiments with highly attenuated lasers can be insecure.", "Highly attenuated lasers in QKD experiments can generate multi-photon signals.", "Eavesdroppers can exploit multi-photon signals in QKD experiments.", "Quantum machine learning can enhance eavesdropping detection capabilities in QKD.", "Quantum machine learning can optimize security analysis in QKD protocols."]}, {"code": "A043", "question": "Which optimization method is used to approximate the functional contribution of the brain's optimization processes when training recurrent spiking neural networks such as LSNNs?", "reference": "Backpropagation through time (BPTT), combined with a rewiring algorithm that optimizes the network architecture.", "answer": "Backpropagation through time (BPTT) is used to approximate the functional contribution of the brain's optimization processes when training recurrent spiking neural networks such as LSNNs.", "kg": null, "passages": [{"source": "Surrogate gradient learning in spiking neural networks", "page": 2, "text": "2 IEEE SIGNAL PROCESSING MAGAZINE  1053-5888/18©2018IEEE between RNNs and networks of spiking leaky integrate-and-ﬁre (LIF) neurons which are widely used in computational neuroscience [2–5]. RNNs are typically trained using an optimization procedure in which the parameters or weights are adjusted to minimize a given objective function. Efﬁciently training large-scale RNNs is challenging due to a variety of extrinsic factors, such as noise and non-stationarity of the data, but also due to the inherent difﬁculties of optimizing functions with long-range temporal and spatial dependencies. In SNNs and binary RNNs, these difﬁculties are compounded by the nondifferentiable dynamics implied by the binary nature of their outputs. While a considerable body of work has successfully demonstrated training of two-layer SNNs [6–8] without hidden units, and networks with recurrent synaptic connections [9, 10], the ability to train deeper SNNs with"}, {"source": "NeurIPS-2018-long-short-term-memory-and-learning-to-learn-in-networks-of-spiking-neurons-Paper", "page": 1, "text": "experience. Details of these optimization processes are largely unknown. But their functional contribution can be approximated through powerful optimization methods, such as backpropagation through time (BPTT). A second major mismatch between RSNNs in the brain and models is that the latter only show a small fraction of the dynamics of neurons and synapses in the brain. We include neurons in our RSNN model that reproduce one prominent dynamical process of biological neurons that takes place at the behaviourally relevant time scale of seconds: neuronal adaptation. We denote these networks as LSNNs because of their Long short-term memory. The inclusion of adapting neurons drastically increases the computing and learning capability of RSNNs if they are trained and conﬁgured by deep learning (BPTT combined with a rewiring algorithm that optimizes the network architecture). In fact, the computational performance of these RSNNs approaches for the ﬁrst time that of LSTM networks."}, {"source": "Surrogate gradient learning in spiking neural networks", "page": 1, "text": "can be trained on real, domain speciﬁc data. However, their training requires overcoming a number of challenges linked to their binary and dynamical nature. This article elucidates stepby-step the problems typically encountered when training spiking neural networks, and guides the reader through the key concepts of synaptic plasticity and data-driven learning in the spiking setting. To that end, it gives an overview of existing approaches and provides an introduction to surrogate gradient methods, speciﬁcally, as a particularly ﬂexible and efﬁcient method to overcome the aforementioned challenges. I. INTRODUCTION Biological spiking neural networks (SNNs) are evolution’s highly efﬁcient solution to the problem of signal processing. Therefore, taking inspiration from the brain is a natural approach to engineering more efﬁcient computing architectures. In the area of machine learning, recurrent neural networks (RNNs), a class of stateful neural networks whose internal state evolves with"}, {"source": "Deep learning in spiking neural networks", "page": 2, "text": "in using artiﬁcial SNNs in applications that brains are good at, such as pattern recognition [49]. Bio-inspired SNNs, in principle, have higher representation power and capacity than traditional rate-coded networks [50]. Furthermore, SNNs allow a type of bio-inspired learning (weight modiﬁcation) that depends on the relative timing of spikes between pairs of directly connected neurons in which the information required for weight modiﬁcation is locally available. This local learning resembles the remarkable learning that occurs in many areas of the brain [51], [52], [53], [54], [55]. The spike trains are represented formally by sums of Dirac delta functions and do not have derivatives. This makes it difﬁcult to use derivative-based optimization for training SNNs, although very recent work has explored the use of various types of substitute or approximate derivatives [56], [57]. This raises a question: How are neural networks in the brain trained if derivative-based"}], "claims": ["Backpropagation through time (BPTT) is used to approximate the functional contribution of the brain's optimization processes", "BPTT is used to train recurrent spiking neural networks such as LSNNs"]}, {"code": "A044", "question": "What role does Quantum Random Number Generation (QRNG) play in quantum key distribution (QKD), and how far has QKD technology progressed toward real-world deployment?", "reference": "QKD relies on physics rather than computational hardness to exchange keys provably securely and to detect eavesdroppers; QRNG supports it by producing true random numbers needed for key setting and growth. Over the past five years QKD has moved from laboratory experiments to early commercial deployments, for example financial institutions in Europe and Asia piloting QKD links; combined with one-time-pad or symmetric ciphers it can provide information-theoretic security.", "answer": "Quantum Random Number Generation (QRNG) plays a crucial role in quantum key distribution (QKD) by providing truly unpredictable keys, essential for secure cryptographic solutions. QKD technology has progressed significantly, with real-world deployments like China’s 2,000-km Quantum Key Distribution network demonstrating its feasibility. However, challenges remain, such as integrating QKD with legacy systems and addressing technical limitations.", "kg": "Knowledge graph entities:\n- QRNG (SYSTEM): Quantum Random Number Generators.; Source of random numbers used in cryptographic systems.\n- Quantum Key Distribution Networks (SYSTEM): Building a QKD network at scale leads to a combinatorial explosion of needed links.; China’s 2,000-km Quantum Key Distribution network.; Target of the modified PNS attack.; This modified scheme is based on weak laser pul\n- QKD (PROTOCOL): Quantum cryptography implementations like QKD.; Quantum Key Distribution protocol for secure communications.; Protocol with technical limitations motivating the positions of various agencies.; Quantum Key Distribution ty\n- Random number generation (CONCEPT): Random number generation risks are highlighted.; Random number generation techniques in QKD.\n- Quantum Random Number Generation (DEFENSE): Generation of random numbers in quantum systems.; Protocol for generating truly random numbers using quantum mechanics.; Improves cryptographic solutions by producing real random numbers.\n- Quantum Key Distribution (PROTOCOL): Technology that relies on coherence for secure communication.; Technology that ensures secure state transmission.; Integrated with ML to optimize communication security.; um-Safe Security", "page": 22, "text": "22 Chhetri et al. 8.3 Quantum Random Number Generators (QRNGs) High-quality randomness is essential for secure cryptographic primitives. Quantum Random Number Generators (QRNGs) exploit the inherent unpredictability of quantum processes, such as photon emission or phase fluctuations, to produce entropy that is provably resistant to prediction and replication [49, 75]. Unlike classical pseudo-random generators, QRNGs provide true randomness rooted in physical laws, ensuring robustness against adversaries with full knowledge of initial system states [49, 75]. Recent advances include semi-device-independent QRNGs (semi-DI QRNGs), which reduce reliance on device trust assumptions while maintaining verifiable security guarantees [56, 97]. Similarly, source-independent QRNGs validate entropy independently of the quantum state source, thereby enhancing robustness against hardware imperfections [56, 98]. Together, these"}, {"source": "Next-Generation Quantum Security - The Impact of Quantum Computing on Cybersecurity—Threats, Mitigations, and Solutions", "page": 2, "text": "ECC (elliptic curve cryptography) through Shor’s algorithm, the weakening of hash functions and symmetric encryption via Grover’s  algorithm, and vulnerabilities in post-quantum cryptography, hash-based signatures, and multivariate polynomial systems. It also  highlights risks in quantum key distribution (QKD), cloud security, and random number generation. To counter these threats, the  figure points to ‘‘Emerging Solutions’’, likely referring to ongoing advancements in post-quantum cryptographic algorithms (such  as lattice-based or code-based cryptography), hybrid systems, and quantum-safe protocols designed to withstand quantum attacks.  The structured layout effectively contrasts critical vulnerabilities with proactive mitigation strategies, emphasizing the need for a  transition to quantum-resistant technologies. In Table 1, we present a comprehensive overview of the impact of quantum computing on various aspects of cybersecurity,"}, {"source": "Quantum key distribution through quantum machine learning - a research review", "page": 2, "text": "2024). Quantum private communication is a practical application for quantum mechanics. It enables secure communication against traditional approaches and advanced technologies such as quantum computers. There are several types of Cryptographic tasks, such as quantum private inquiry and quantum digital signatures control communication. The most basic one is quantum key distribution (QKD) (Liu et al., 2022). The QKD system utilizes physics principles rather than the computational complexity of mathematics problems to enable the provably safe exchange of cryptographic keys against eavesdropping. This fact helps make sure anyone attempting to access the key exchange process may be identiﬁed, ensuring the highest level of security possible. Quantum Random Number Generation (QRNG) improves cryptographic solutions by producing real random numbers needed for key-setting and growth processes, among other areas (Gowda et al., 2025). For quantum key generation, random numbers are used. Various"}, {"source": "Quantum Key Distribution Networks -- Key Management - A Survey", "page": 23, "text": "or key relay, including combining or splitting where lengths are not appropriate. The necessity for secure key storage has been acknowledged from the outset, owing to the unique characteristics of the QKD process. As a result, existing approaches studied in this article include this fundamental requirement of the key manager. Merely stating that keys will be stored is insufficient; the manner in which they are stored is equally crucial, as it greatly influences the effectiveness of key servicing capabilities. Table 3 provides a tabular comparison of existing key managers from the perspective of key storage realization and closely related techniques associated with this functionality. An in-depth analysis of existing approaches has uncovered several prevailing key storage designs, alongside numerous shortcomings that require attention and resolution. To address the inefficiencies in key delivery identified within the"}], "claims": ["Quantum Random Number Generation (QRNG) plays a crucial role in quantum key distribution (QKD).", "QRNG provides truly unpredictable keys.", "QRNG is essential for secure cryptographic solutions.", "QKD technology has progressed significantly.", "Real-world deployments of QKD technology have been made.", "China has a 2,000-km Quantum Key Distribution network.", "Challenges remain in integrating QKD with legacy systems.", "Technical limitations of QKD need to be addressed."]}, {"code": "A045", "question": "What are the two distinct RAG techniques that HybridRAG integrates, and how do they complement each other?", "reference": "HybridRAG integrates VectorRAG and GraphRAG. VectorRAG provides broad, similarity-based retrieval of relevant information, while GraphRAG contributes structured, relationship-rich contextual information.", "answer": "HybridRAG integrates VectorRAG and GraphRAG. VectorRAG provides broad, similarity-based retrieval of relevant information, while GraphRAG contributes structured, relationship-rich data. Together, they leverage the strengths of both approaches to enhance response quality, accuracy, and comprehensiveness.", "kg": null, "passages": [{"source": "HybridRAG - Integrating Knowledge Graphs and Vector Retrieval Augmented Generation for Efficient Information Extraction", "page": 4, "text": "Sarmah et al. contextual data. This combined context is then utilized as input for a LLM to generate the final responses. Details on the implementation of the HybridRAG will be provided in Section 4.4. 2.4 Evaluation Metrics To assess the efficacy of this integrated approach, we conducted a comparative analysis among the three approaches in a controlled experimental set up: VectorRAG, GraphRAG and HybridRAG. The responses generated using the combined VectorRAG and GraphRAG contexts were juxtaposed against those produced individually by VectorRAG and GraphRAG. This comparative evaluation aimed to discern potential improvements in response quality, accuracy, and comprehensiveness that might arise from the synergistic integration of these two RAG methodologies. To objectively evaluate different RAG approaches (VectorRAG and GraphRAG in their case), Ref. [22] utilized metrics such as comprehensiveness (i.e., the amount of details the answer provides"}, {"source": "HybridRAG - Integrating Knowledge Graphs and Vector Retrieval Augmented Generation for Efficient Information Extraction", "page": 7, "text": "framework RAGAS[30] to evaluate the three RAG pipelines in the present work where we have modified them a bit to make more precise comparisons. The results of our comparative analysis reveal notable differences in performance among VectorRAG, GraphRAG, and HybridRAG approaches as summarized in Table 5. In terms of Faithfulness, GraphRAG and HybridRAG demonstrated superior performance, both achieving a score of 0.96, while VectorRAG trailed slightly with a score of 0.94. Answer relevancy scores varied across the methods, with HybridRAG outperforming the others at 0.96, followed by VectorRAG at 0.91, and GraphRAG at 0.89. Context precision was highest for GraphRAG at 0.96, significantly surpassing VectorRAG (0.84) and HybridRAG (0.79). However, in context recall, both VectorRAG and HybridRAG achieved perfect scores of 1, while GraphRAG lagged behind at 0.85."}, {"source": "HybridRAG - Integrating Knowledge Graphs and Vector Retrieval Augmented Generation for Efficient Information Extraction", "page": 3, "text": "is given in Figure 2. Here we first write a prompt to clean the data and then write another prompt in the second stage to create knowledge triplets along with metadata. It will be covered in more detail in section 4.1 Figure 2: A schematic diagram describing knowledge graph creation process of GraphRAG. 2.3.1 HybridRAG. For the HybridRAG technique, we propose to integrate the aforementioned two distinct RAG techniques: VectorRAG and GraphRAG. This integration involves a systematic combination of contextual information retrieved from both the traditional vector-based retrieval mechanism and the KG-based retrieval system, the latter of which was constructed specifically for this study. The amalgamation of these two contexts allows us to leverage the strengths of both approaches. The VectorRAG component provides a broad, similarity-based retrieval of relevant information, while the GraphRAG element contributes structured, relationship-rich"}, {"source": "HybridRAG - Integrating Knowledge Graphs and Vector Retrieval Augmented Generation for Efficient Information Extraction", "page": 7, "text": "falls back to VectorRAG to generate the answer. VectorRAG GraphRAG HybridRAG F 0.94 0.96 0.96 AR 0.91 0.89 0.96 CP 0.84 0.96 0.79 CR 1 0.85 1 Table 5: Performance Metrics for Different RAG Pipelines. Here, F, AR, CP and CR refer to Faithfulness, Answer Relevence, Context Precision and Context Recall. 6 CONCLUSION AND FUTURE DIRECTIONS Among the current approaches to mitigate issues regarding information extraction from external documents that were not part of"}], "claims": ["HybridRAG integrates VectorRAG and GraphRAG.", "VectorRAG provides broad, similarity-based retrieval of relevant information.", "GraphRAG contributes structured, relationship-rich data.", "HybridRAG leverages the strengths of VectorRAG and GraphRAG to enhance response quality.", "HybridRAG leverages the strengths of VectorRAG and GraphRAG to enhance response accuracy.", "HybridRAG leverages the strengths of VectorRAG and GraphRAG to enhance response comprehensiveness."]}, {"code": "A046", "question": "How is the Multi-Layer Perceptron (MLP) described in the overview of deep learning for encrypted traffic classification, and what is its main drawback?", "reference": "An MLP has an input layer, an output layer and several hidden layers of densely connected neurons, each applying a non-linear activation to a weighted sum; a deep enough MLP can approximate any function, but its huge number of parameters makes it complex, inefficient and hard to train.", "answer": "Multi-Layer Perceptron (MLP) is described as consisting of an input layer, an output layer, and several hidden layers of neurons. Each layer has several neurons densely connected to adjacent layers. The main drawback of MLP is that due to the huge number of parameters it needs to learn, the model is usually very complex, inefficient, and hard to train.", "kg": null, "passages": [{"source": "Deep learning for encrypted traffic classification - An overview", "page": 3, "text": "laws prohibit accessing or storing packet content which limit the use of payload features. III. DEEP LEARNING TECHNIQUES In this section, we brieﬂy introduce some recent papers for each deep learning method, the summary of which is shown in Table I. Then, we complete our 7-step framework by explaining the model selection and evaluation in detail. A. Multi-Layer Perceptron Multi-layer perceptron (MLP) is the ﬁrst neural network architecture and consists of an input layer, an output layer and several hidden layers of neurons. Each layer has several neurons which are densely connected to adjacent layers, as shown in Fig. 2(a). A neuron takes a weighted sum of its inputs and passes through a non-linear activation function to produce an output. Theoretically, a dense and deep enough MLP can estimate any arbitrary function. However, due to the huge number of parameters that a model need to learn, this model is usually very complex, inefﬁcient and hard to train for"}, {"source": "Deep learning for encrypted traffic classification - An overview", "page": 6, "text": "classical machine learning algorithms. Payload+Header: In current encrypted trafﬁcs, the ﬁrst few packets that contain handshake information are typically unencrypted and they have been successfully used for classiﬁcation. Due to the high dimensionality of the input (large number of bytes in payload), classical ML methods and MLP do not work well. In such cases, CNN or combination of CNN and LSTM are reported to have high accuracy [7],[6],[11],[9]. It is possible to also use time series features alongside payload information to slightly improve accuracy, but this barely changes the input dimension or the choice of model. Statistical Features: The number of statistical features, and consequently the input dimension, is limited. Hence, most papers used classical ML methods or in rare cases MLP for these features. Although most studies obtained statistical features by observing the entire ﬂow, it has been shown that obtaining statistical features from the ﬁrst 10 to 180 packets,"}, {"source": "Enhancing encrypted HTTPS traffic classification based on stacked deep ensembles models", "page": 1, "text": "Keywords  HTTPS traffic classification, Encrypted traffic, Network security, Network traffic classification,  Deep learning, Ensemble learning, Cyber security, CNN, DNN Modern traffic classification has outgrown traditional port or payload inspection techniques because widespread  encryption renders packet contents opaque and application ports dynamic. Recent surveys emphasize that,  despite encryption, flow-level features and machine-learning pipelines can still characterize and classify traffic  accurately. These works position machine learning (ML) as the practical path for encrypted traffic analysis,  outlining end-to-end procedures and state-of-the-art methods that operate without decrypting content1–3. In parallel, research in software-defined networking (SDN) highlights how separating control and data  planes creates a programmable substrate where ML-based classifiers can improve quality of service, automate"}, {"source": "Deep learning for encrypted traffic classification - An overview", "page": 3, "text": "huge number of parameters that a model need to learn, this model is usually very complex, inefﬁcient and hard to train for an arbitrary complicated problem. Although the use of deep MLP alone has been declined, a few layers of fully-connected neurons, which can be considered as a MLP, is still used as small part of other models. For network trafﬁc classiﬁcation, pure multi-layer perceptron (MLP) has been rarely used due to its complexity and low accuracy. In [6], many deep learning methods are compared with random forest (RF) algorithm to show the performance gap. They use 3 mobile datasets with different number of labels. Many deep learning methods outperform RF in two of the datasets. However, the experiment settings are not completely fair and equal because the input features used for RF, MLP and other deep learning methods are different. Hence, the results should not be considered as a comprehensive comparison of ML methods. B. Convolutional Neural Networks"}], "claims": ["A Multi-Layer Perceptron (MLP) consists of an input layer.", "A Multi-Layer Perceptron (MLP) consists of an output layer.", "A Multi-Layer Perceptron (MLP) consists of several hidden layers of neurons.", "Each layer of a Multi-Layer Perceptron (MLP) has several neurons.", "Each layer of a Multi-Layer Perceptron (MLP) has neurons densely connected to adjacent layers.", "The main drawback of a Multi-Layer Perceptron (MLP) is that it has a huge number of parameters to learn.", "A Multi-Layer Perceptron (MLP) is usually very complex.", "A Multi-Layer Perceptron (MLP) is usually inefficient.", "A Multi-Layer Perceptron (MLP) is hard to train."]}, {"code": "A047", "question": "Why do Smart City and IoVT applications need 5G unlike traditional IoT applications, and what security consequences does the predicted growth of IoT devices have?", "reference": "Traditional IoT applications such as Smart Homes, industries and farming need only minimal wireless capabilities, whereas Smart Cities and IoVT require significantly high ugh conﬁdential information that needs privacy-preserving attention along with transparency. This makes IoT ecosystems simple targets to compromise privacy in different ways, involving data collection, exchange, and processing."}, {"source": "Post-Quantum_Blockchain_Security_for_the_Internet_of_Things_Survey_and_Research_Directions", "page": 9, "text": "In the edge-based IoT, where devices process data locally, blockchains can facilitate secure peer-to-peer transactions and enable a distributed ledger at the edge. Moreover, the blockchain architecture ensures reliable and efﬁcient operation thanks to its tamper-proof nature. These characteristics create opportunities to overcome IoT challenges. Many businesses and researchers have been attracted to the intersection of blockchain and IoT, which has led to implementation, solutions, and initiatives across numerous IoT domains,,."}, {"source": "Post-Quantum_Blockchain_Security_for_the_Internet_of_Things_Survey_and_Research_Directions", "page": 9, "text": "Therefore, it would be helpful to grasp the main aspects of BCIoT to comprehend some potential blockchain applications in IoT domains and enhance their security against quantum computers. A. Blockchain-IoT Layers There are four layers in each IoT environment as depicted on the left side of Figure 3. The third layer, referred to as the middleware layer, is used by the majority of developing IoT applications to serve as a link between the communication and application layers. When the blockchain is integrated with the IoT ecosystem, as shown in Figure 3, it serves as"}], "claims": ["Monero can be used in a blockchain-IoT environment.", "Monero can obscure the information of the sender transferring coins.", "Ring signatures are used by Monero to obscure the information of the sender transferring coins."]}, {"code": "A049", "question": "Why do Smart City and IoVT applications need 5G unlike traditional IoT applications, and what security consequences does the predicted gr ph relations:\n- Blockchain-IoT -- smart city: Blockchain can serve smart cities as an end-to-end application.\n- PQC -- IoT devices: PQC can be deployed in IoT devices.\n- blockchain -- IoT security: Blockchain can address IoT security challenges.\n- privacy-preserving -- IoT: Privacy-preserving attention along with transparency is needed for IoT systems.\n- PQC standards -- IoT devices: PQC standards can be implemented and operated on current limited-resource IoT devices.\n- industrial IoT applications -- consensus mechanisms: A latency of 100 ms or less is necessary in industrial IoT applications to ensure smooth and seamless communication.\n- cloud servers -- IoT devices: Cloud servers support majority of IoT applications.\n- IoT devices -- adversary: Adversaries can compromise data security and user privacy or cause network disruption.; Adversaries can compromise data security and user privacy.; Adversaries can cause network disruption.\n- lattice-based methods -- IoT devices: Lattice-based schemes can be implemented and operated on current limited-resource IoT devices.\n- blockchain -- smart city: Blockchain can be utilized in smart city domains.; Blockchain is applicable for creating smart cities.\n- blockchain -- Fog and Cloud IoT: Blockchain is used in Fog and Cloud IoT applications.\n- post-quantum cryptosystems -- IoT devices: Feasibility of post-quantum cryptosystems in IoT devices is assessed.", "passages": [{"source": "Post-Quantum_Blockchain_Security_for_the_Internet_of_Things_Survey_and_Research_Directions", "page": 1, "text": "metropolitan areas, where they are employed to monitor and manage trafﬁc and notify residents about weather status and air quality in different districts [2]. Such extensive acceptance, on the one hand, and the growth of new concepts for IoT like Cyber-Physical Systems (CPS), Machine-to-Machine (M2M) communications and 5G technology, on the other hand, have led to the prediction of over 30 billion IoT devices in use by 2030 [3]. Moreover, the large number and variety of devices, along with their different deployment architectures in broad applications, lead to numerous security risks and challenges. Therefore, IoT devices are one of the most common devices targeted by adversaries, which can compromise data security and user privacy or cause network disruption. Currently, the majority of IoT applications are supported by publish-subscriber architectures that connect to cloud servers through the Internet. The cloud provides a centralized approach that has some advantages, such as"}, {"source": "Post-Quantum_Blockchain_Security_for_the_Internet_of_Things_Survey_and_Research_Directions", "page": 9, "text": "on speed, network overhead, and memory in this section were not performed on a speciﬁc device, which makes it difﬁcult to draw deﬁnitive conclusions about choosing the optimal signature and KEM algorithm for IoT devices. Nevertheless, it can generally be concluded that post-quantum cryptographic schemes can be implemented and operated on current limitedresource devices in different IoT applications. Furthermore, it can be observed that lattice-based schemes perform better than other types in terms of speed, memory, and energy consumption. Hence, it can be inferred that each PQC standard has its advantages and disadvantages. This means that each use case, like IoT and blockchain environments, needs a careful plan regarding requirements and restrictions to ensure that the best and most efﬁcient scheme is used. V. BLOCKCHAIN-BASED IOT The term “blockchain” often refers to the underpinning technology of a digital currency known as Bitcoin, created"}, {"source": "Post-Quantum_Blockchain_Security_for_the_Internet_of_Things_Survey_and_Research_Directions", "page": 2, "text": "the use of blockchains in IoT applications [19]. This paper proposed a solid review of recent state-of-the-art developments in blockchain for Fog and Cloud IoT in various applications, including eHealth. It also provides a comprehensive explanation of blockchain’s fundamentals. However, despite the fact that it contains a lot of highly relevant information, the use of blockchain in some important applications, such as industrial IoT, is not covered in this article. In addition to these works, several studies have also reviewed the use of blockchain in only one particular IoT application. For instance, the authors in [20] touched on the speciﬁcations of smart homes, as well as the key obstacles pertaining to security and interoperability protocols for implementing blockchain, which may not be common with other IoT applications. Moreover, the use of blockchain in a speciﬁc ﬁeld of IoT can be found in [21], where Makani et al. examined the utilization"}, {"source": "Post-Quantum_Blockchain_Security_for_the_Internet_of_Things_Survey_and_Research_Directions", "page": 9, "text": "numerous IoT domains [7], [64], [100]. Therefore, it would be helpful to grasp the main aspects of BCIoT to comprehend some potential blockchain applications in IoT domains and enhance their security against quantum computers. A. Blockchain-IoT Layers There are four layers in each IoT environment [101] as depicted on the left side of Figure 3. Numerous sensors and actuators are used in the ﬁrst layer to perform actions and perceive the required data. The second layer, which is on top of the ﬁrst layer, uses communication infrastructure to transport the gathered data. The third layer, referred to as the middleware layer, is used by the majority of developing IoT applications to serve as a link between the communication and application layers. The fourth (highest) layer is related to numerous IoT-based end-to-end applications such as smart cities and industrial IoT. When the blockchain is integrated with the IoT ecosystem, as shown in Figure 3, it serves as"}], "claims": ["Smart cities and IoVT applications require 5G for faster speeds and lower latency.", "Faster speeds and lower latency are crucial for seamless communication and real-time data processing.", "The predicted growth of IoT devices poses numerous security risks.", "IoT devices are common targets for adversaries.", "IoT devices can potentially compromise data security and user privacy.", "IoT devices can cause network disruptions."]}, {"code": "A050", "question": "What approach was proposed to characterize encrypted and VPN traffic using time-related features, and what dataset was published?", "reference": "A flow-based classification method that uses only time-related features (with low computational complexity) to characterize encrypted and VPN traffic; the authors also published a labeled encrypted traffic dataset with 14 labels (7 regular encrypted, 7 VPN).", "answer": "The paper proposes a flow-based classification method using only time-related features to characterize encrypted and VPN traffic. They published an extensive labeled dataset with 14 different labels, 7 for regular encrypted traffic and 7 for VPN traffic.", "kg": null, "passages": [{"source": "Characterization of Encrypted and VPN Traffic using Time-related Features", "page": 1, "text": "Characterization of Encrypted and VPN Trafﬁc using Time-related Features Gerard Draper-Gil, Arash Habibi Lashkari, Mohammad Saiful Islam Mamun and Ali A. Ghorbani University of New Brunswick, Fredericton NB E3B 5A3, New Brunswick, Canada Keywords: Trafﬁc Classiﬁcation, Encrypted Trafﬁc Characterization, Flow Time-based Features, VPN Trafﬁc Characterization, Flow Timeout Value. Abstract: Trafﬁc characterization is one of the major challenges in today’s security industry. The continuous evolution and generation of new applications and services, together with the expansion of encrypted communications makes it a difﬁcult task. Virtual Private Networks (VPNs) are an example of encrypted communication service that is becoming popular, as method for bypassing censorship as well as accessing services that are geographically locked. In this paper, we study the effectiveness of ﬂow-based time-related features to detect VPN trafﬁc"}, {"source": "Characterization of Encrypted and VPN Traffic using Time-related Features", "page": 7, "text": "which means that time-related features are good classiﬁers to characterize encrypted and VPN trafﬁc. 5.2 Analysis of Scenario B In this Scenario all encrypted and VPN trafﬁc are mixed together in one dataset, and the objective is to characterize the trafﬁc without previously dividing VPN from Non-VPN trafﬁc, therefore we will have 14 types of trafﬁc: 7 encrypted and 7 VPN trafﬁc categories. The results are shown in Figure 3 (parts e,f,g,h). In this case, we cannot see the pattern ’shorter timeout - better accuracy’ as clear as in the previous scenario (5.1). For example using the C4.5 algorithm the Pr of VPN-Browsing, VPN-Mail, and Mail with 15 sec is 0.771, 0.739, 0.671 respectively, values lower than the 0.809, 0.786, 0.79 obtained with 120 sec. The KNN results are similar, the Pr of VPN-Browsing, VPN-Chat, and VPN-Mail trafﬁc categories is (0.691, 0.501, 0.688) for 15s. ftm, smaller than the Pr obtained with 120 sec (0.743,"}, {"source": "Characterization of Encrypted and VPN Traffic using Time-related Features", "page": 2, "text": "tion of VPN trafﬁc is a challenging task that remains to be solved. VPN tunnels are used to maintain the privacy of data shared over the physical network connection holding packet-level encryption, therefore making very difﬁcult to identify the applications running through these VPN services. Our Contribution in this paper is twofold. First, we propose a ﬂow-based classiﬁcation method to characterize encrypted and VPN trafﬁc using only time-related features. Moreover, we reduce the computational overhead by reducing the set of features to a set that can be extracted with low computational complexity (Kim et al., 2008; Li et al., 2009). And second, we generate and publish an extensive labeled dataset of encrypted trafﬁc, with 14 different labels (7 for regular encrypted trafﬁc and 7 for VPN trafﬁc). We choose only time-related features to expedite the efﬁciency and to ensure an encryption independent trafﬁc classiﬁer."}, {"source": "Characterization of Encrypted and VPN Traffic using Time-related Features", "page": 1, "text": "circumvented by encapsulated, encrypted, or obfuscated trafﬁc that precludes payload analysis. Selecting effective and reliable features for trafﬁc analysis is still a serious challenge. Generally speaking the classiﬁcation of network trafﬁc falls mainly into two categories: ﬂow-based classiﬁcation, using properties such as ﬂow bytes per second, duration per ﬂow, etc. and packet-based classiﬁcation, using properties such as size, inter-packet duration of the ﬁrst (or n) packets, etc. In this paper, we focus on analyzing regular encrypted trafﬁc and encrypted trafﬁc tunneled through a Virtual Private Network (VPN). The characterizaDraper-Gil, G., Lashkari, A., Mamun, M. and Ghorbani, A. Characterization of Encrypted and VPN Trafﬁc using Time-related Features. DOI: 10.5220/0005740704070414 In Proceedings of the 2nd International Conference on Information Systems Security and Privacy (ICISSP 2016), pages 407-414 ISBN: 978-989-758-167-0 Copyright c"}], "claims": ["A flow-based classification method was proposed.", "The method uses only time-related features.", "The method is to characterize encrypted and VPN traffic.", "An extensive labeled dataset was published.", "The dataset has 14 different labels.", "7 labels are for regular encrypted traffic.", "7 labels are for VPN traffic."]}, {"code": "A051", "question": "How does the spiking neuromorphic transformer use STDP to compute Query-Key similarity in memory, and on what information does STDP base its synaptic weight updates?", "reference": "The Q-K similarity is not computed and stored separately; it is embedded in the synapse through STDP-driven plasticity, so both computation and storage happen locally in synaptic hardware, which is the principle of in-memory computing (each synapse acts as both compute and storage element). STDP adjusts the weight between a pre- and post-synaptic neuron according to their relative spike times within roughly tens of milliseconds, using information local to the synapse and local in time.", "answer": "STDP in the Spiking STDP Transformer (S2TDPT) embeds query–key correlations in synaptic weights, allowing the computation of query-key similarity through spike-timing-dependent plasticity. Synaptic weight updates in STDP base on the timing of pre-synaptic and post-synaptic spikes, reflecting the temporal coding of information in biological neural circuits.", "kg": null, "passages": [{"source": "Attention via synaptic plasticity is all you need - A biologically inspired spiking neuromorphic transformer", "page": 1, "text": "from neural circuits, Transformer attention relies on dot-product similarity to weight elements in the input sequence. Neuromorphic computing, especially spiking neural networks (SNNs), offers a brain-inspired path to energy-efficient intelligence. Despite recent work on attention-based spiking Transformers, the core attention layer remains non-neuromorphic. Current spiking attention (i) relies on dot-product or element-wise similarity suited to floating-point operations, not eventdriven spikes; (ii) keeps attention matrices that suffer from the von Neumann bottleneck, limiting in-memory computing; and (iii) still diverges from brain-like computation. To address these issues, we propose the Spiking STDP Transformer (S2TDPT), a neuromorphic Transformer that implements self-attention through spike-timing-dependent plasticity (STDP), embedding query– key correlations in synaptic weights. STDP, a core mechanism of memory and learning in the"}, {"source": "Attention via synaptic plasticity is all you need - A biologically inspired spiking neuromorphic transformer", "page": 15, "text": "successfully replicate both symmetric and anti-symmetric Hebbian and anti-Hebbian STDP rules [57]. Percolating Ag-islands and nanowires also shows synaptic behaviour for neuromrophic computing [58, 59]. Even standard bulk-silicon CMOS transistors, can exhibit neuronal and synaptic behaviors [60]. Recent work shows in-memory computing, memristor crossbars, and phase-change memory can drastically cut transformer attention energy while preserving accuracy [61, 62, 63]. Thus, several neuromorphic materials and devices can potentially emulate the characteristics of an attention layer proposed in this work. 5 Conclusion This work presents the Spiking STDP Transformer (S2TDPT), a foundational contribution toward truly neuromorphic Transformer architectures that integrate attention computation with the physics of synaptic plasticity. By reimagining the self-attention mechanism through spike-timing-dependent"}, {"source": "Attention via synaptic plasticity is all you need - A biologically inspired spiking neuromorphic transformer", "page": 1, "text": "key correlations in synaptic weights. STDP, a core mechanism of memory and learning in the brain and widely studied in neuromorphic devices, naturally enables in-memory computing and supports non-von Neumann hardware. On CIFAR-10 and CIFAR-100, our model achieves 94.35% and 78.08% accuracy with only four timesteps and 0.49 mJ on CIFAR-100, an 88.47% energy reduction compared to a standard ANN Transformer. Grad-CAM shows that the model attends to semantically relevant regions, enhancing interpretability. Overall, S2TDPT illustrates how biologically inspired attention can yield energy-efficient, hardware-friendly, and explainable neuromorphic models. Keywords: Attention, Neuromorphic Transformer, Large Language models (LLMs), Spiking STDP Attention, Bio-inspired Computing, Energy efficient AI, Explainable AI 1 Introduction Attention is the central cognitive activity to focus on selected information from the noise of thoughts."}, {"source": "Attention via synaptic plasticity is all you need - A biologically inspired spiking neuromorphic transformer", "page": 5, "text": "matrices that has limitations of von Neumann memory bottleneck, and (iii) remain weakly grounded in biological mechanisms. In this work, we revisit and try to solve the Transformer architecture through a neuromorphic lens, introducing a biologically plausible Spiking Transformer in which the attention mechanism emerges entirely from spike-timing-dependent plasticity (STDP), temporal coding, and simple additive operations-eliminating the need for softmax. The beauty of STDP is that it is the basis of memory, learning and intelligence in biological brain, and is widely studied in neuromorphic materials and devices. By grounding the attention computation in spike timing rather than magnitude, our framework moves beyond existing SNN-based Transformers and aligns more closely with the computational principles observed in real neural circuits. Our main contributions are as follows: 1. This work replaces the conventional attention weight calculation between the query and key"}], "claims": ["STDP in the Spiking STDP Transformer (S2TDPT) embeds query–key correlations in synaptic weights.", "The computation of query-key similarity in memory uses spike-timing-dependent plasticity.", "Synaptic weight updates in STDP are based on the timing of pre-synaptic and post-synaptic spikes.", "STDP reflects the temporal coding of information in biological neural circuits."]}, {"code": "A052", "question": "What is Shor's algorithm and how does it impact the security of current cryptographic systems?", "reference": "Shor's algorithm, proposed by Peter Shor in 1994, efficiently factors large integers and computes discrete logarithms in polynomial time, which directly undermines the security assumptions of current public-key cryptographic systems.", "answer": "Shor's algorithm is a quantum algorithm that performs large factoring in polynomial time, posing a significant threat to current cryptographic systems, particularly those relying on RSA and ECC. It can compromise systems like AES and NTRUEncrypt, but hash-based cryptographic schemes remain resistant to it. The algorithm undermines data privacy and digital signature systems, making current cryptographic systems vulnerable as quantum computing matures.", "kg": "Knowledge graph entities:\n- Current Cryptographic Systems (SYSTEM): Systems that could be maintained by quantum computing.; Protect data privacy and integrity through symmetric and asymmetric encryption and hashing.\n- public key cryptography (SYSTEM): Cryptography vulnerable to Shor’s algorithm.\n- cryptographic systems (SYSTEM): System that includes QKD as part of its components.; Systems that organizations are upgrading or may need to rip-and-replace.; Systems designed to protect data through encryption.; System currently deployed and potential\n- Shor algorithm (ALGORITHM): Algorithm that performs large factoring in polynomial time.; Quantum algorithm that can compromise encryption systems.\n- Shor’s algorithm (ALGORITHM): Algorithm that can potentially break systems like RSA.; Algorithm used as a crucial test-bed for refining error correction techniques and improving qubit stability.; Algorithm for determining the periodicity of functions\n- security (CONCEPT): Application of quantum-enabled algorithms in security.; Protection against unauthorized access or attacks, a key challenge in ADAS.; Key obstacles in blockchain implementation.; Examined by Xu et al. for practical QKD im\n- system (DEFENSE): Formal multi-stage threat models can be used to design certified defenses.; Coupled to the environment.\n- Shor-like circuits (ALGORITHM): Circuits used in some works for factorization.\n\nKnowledge graph relations:\n- Shor’s algorithm -- blockchain: Shor’s algorithm threatens the security of blockchain systems.\n- Shor’s algorithm -- cryptographic key sizes: Practical attacks on standard cryptographic key sizes remain out of reach.\n- cloud security -- Shor’s algorithm: Shor’s algorithm poses a threat to cloud security.\n- code-based cryptography -- Shor’s algorithm: Code-based cryptography is a solution to Shor’s algorithm.\n- Shor’s algorithm -- RSA security: Shor's algorithm poses a threat to RSA security by making factorization easier.\n- Shor algorithm -- AES: Shor's algorithm can compromise AES.\n- hash-based cryptographic schemes -- Shor’s algorithm: Hash-based cryptographic schemes are resistant to Shor’s algorithm.\n- Shor’s algorithm -- quantum threat landscape: Shor's algorithm undermines data privacy and digital signature systems.\n- cryptographically relevant integer -- Shor’s algorithm: Requires factoring of such integers.\n- quantum computing system -- Shor’s algorithm: Shor's algorithm poses a threat to quantum computing systems.\n- Shor’s algorithm -- Kyber: Shor’s algorithm cannot effectively address the security of Kyber.\n- Shor’s algorithm -- NTRUEncrypt: Shor’s algorithm can compromise NTRUEncrypt.", "passages": [{"source": "Next-Generation Quantum Security - The Impact of Quantum Computing on Cybersecurity—Threats, Mitigations, and Solutions", "page": 5, "text": "threats and the justification of defensive mechanisms and novel technological developments that maintain digital security. The main  objectives of this paper are: 1. Exploring the Quantum Threat Landscape: We analyze how quantum computing can potentially maintain current cryptographic  systems. In addition, we review the implications of quantum algorithms such as Shor and Grover algorithms on widely used  encryption methods and protocols. The paper examines how quantum computing could undermine data privacy, authentication, and  digital signature systems, highlighting the vulnerabilities that organizations and individuals face as quantum computing matures. 2. Evaluation of mitigation and countermeasures: We study post-quantum cryptography (PQC) because it develops cryptographic  algorithms with quantum resistance to counter the growing threat posed by quantum computing. This article presents a summary of"}, {"source": "Next-Generation Quantum Security - The Impact of Quantum Computing on Cybersecurity—Threats, Mitigations, and Solutions", "page": 2, "text": "ECC (elliptic curve cryptography) through Shor’s algorithm, the weakening of hash functions and symmetric encryption via Grover’s  algorithm, and vulnerabilities in post-quantum cryptography, hash-based signatures, and multivariate polynomial systems. It also  highlights risks in quantum key distribution (QKD), cloud security, and random number generation. To counter these threats, the  figure points to ‘‘Emerging Solutions’’, likely referring to ongoing advancements in post-quantum cryptographic algorithms (such  as lattice-based or code-based cryptography), hybrid systems, and quantum-safe protocols designed to withstand quantum attacks.  The structured layout effectively contrasts critical vulnerabilities with proactive mitigation strategies, emphasizing the need for a  transition to quantum-resistant technologies. In Table 1, we present a comprehensive overview of the impact of quantum computing on various aspects of cybersecurity,"}, {"source": "Practical Challenges in Executing Shor’s Algorithm", "page": 15, "text": "numbers that were demonstrated on much smaller quantum systems over two decades ago. Although many theoretical advances have improved quantum factoring algorithms in recent years, progress in practical quantum hardware remains comparatively limited. This indicates that concerns about Shor’s algorithm posing an immediate or near-term threat to currently deployed cryptographic systems are, at present, premature. Building quantum computing systems with on the order of a million physical qubits will require substantial advancements over the next 10 to 15 years, combining fundamental research with largescale engineering efforts. While many companies are exploring architectures that promise lower error rates and improved connectivity, the field still faces numerous technical hurdles. Within published roadmaps and milestones, these challenges are often not fully or openly acknowledged, making independent, evidence-based analysis crucial."}, {"source": "Next-Generation Quantum Security - The Impact of Quantum Computing on Cybersecurity—Threats, Mitigations, and Solutions", "page": 17, "text": "protect the information even if attackers manage to compromise a first layer of security (e.g., using Shor’s algorithm to factorize  RSA keys). The implementation of quantum-resistant communication protocols starts with NTRUEncrypt and Rainbow, as well as other cryptographic methods built on lattice-based and multivariate quadratic equations [198–200]. These solutions represent an optimistic  path toward quantum-secure communication systems. A quantum-resistant system like Kyber and other lattice-based encryption  schemes relies on the Module Learning With Errors (MLWE) problem, a computational challenge involving the identification of  short vectors in high-dimensional lattices—a task that Shor’s algorithm cannot effectively address [201]. Key exchange operations  in cyberspace utilize polynomial rings to enable secure secret exchanges between two parties, while the ring-LWE problem provides"}], "claims": ["Shor's algorithm is a quantum algorithm.", "Shor's algorithm performs large factoring in polynomial time.", "Shor's algorithm poses a significant threat to current cryptographic systems.", "Shor's algorithm compromises RSA and ECC systems.", "Shor's algorithm can compromise AES and NTRUEncrypt systems.", "Hash-based cryptographic schemes are resistant to Shor's algorithm.", "Shor's algorithm undermines data privacy.", "Shor's algorithm undermines digital signature systems.", "Current cryptographic systems are vulnerable to Shor's algorithm as quantum computing matures."]}, {"code": "A053", "question": "What accuracy does the scalable quantum convolutional neural network (QCNN) achieve on MNIST, and with how many trainable parameters?", "reference": "The scalable QCNN achieves 98.7% accuracy (98.1% on validation) using only 45 independent rotational parameters, while the baseline QCNN is trapped at 52%.", "answer": "The scalable QCNN achieves 98.7% accuracy on the MNIST dataset using only 45 independent rotational parameters.", "kg": "Knowledge graph entities:\n- Quantum convoluted neural networks (ALGORITHM): Type of QML algorithm.; Quantum convolutional neural networks used in QKD.\n- QCNN (SYSTEM): Quantum Convolutional Neural Network.; QCNN was applied to satellite images.; demonstrated that QCNN outperforms CNN.; Implements quantum convolutional neural networks.; Quantum Convolutional Neural Network with a tree-l\n- Quantum Convolutional Network (SYSTEM): Quantum analogues of classical convolutional neural networks.; Apply local unitary operations similar to convolutional filters in classical CNNs.; Optimized parameter seeds θseed for QCNN.; System that uses quantum convo\n- Quantum Convolutional Neural Network (SYSTEM): A representative family of QDL.; Quantum circuit architectures inspired by classical CNNs.; Can process classical inputs via appropriate encoding.; Theoretical paradigm for quantum machine learning.; Achieves high classi\n- accuracy (METRIC): QSVM achieved 94.67% accuracy in detecting anomalies.; The QGAN framework achieved an accuracy of 0.937.; Performance metric for classifier evaluation.; Training objectives should target accuracy.; Precision in decision-\n- MNIST (DATASET): Researchers have successfully trained QGANs to generate simplified MNIST.; Standard benchmark used in MosaiQ evaluations.; Dataset used to demonstrate MosaiQ's performance.; Dataset used for training QCNN.; Used as an ex\n- Proposed QCNN (SYSTEM): Achieves 98.7% test accuracy.; Quantum Convolutional Neural Network architecture.\n- 98.7% accuracy (METRIC): The accuracy achieved by the scalable QCNN.\n\nKnowledge graph relations:\n- 98.7% accuracy -- scalable quantum convolutional architecture: The scalable QCNN achieves 98.7% accuracy utilizing only 45 independent rotational parameters.\n- Quantum Convolutional Neural Network -- Parameterized Quantum Circuit: QCNN is a scalable version of PQC.\n- Quantum Convolutional Neural Network -- classical Convolutional Neural Networks: QCNN requires fewer parameters than equivalent classical CNNs.; QCNN and CNN are compared in terms of accuracy and parameter count.\n- Quantum Machine Learning -- Classification Accuracy: QSVMs and QCNNs outperform in classification accuracy.\n- Quantum Convolutional Neural Network -- variational architecture: QCNN circumvents the limitations of standard variational architectures.\n- Quantum convoluted neural networks -- Quantum Machine Learning: QCNN is a type of QML algorithm.\n- Quantum Convolutional Neural Network -- Symmetric depolarizing noise: QCNN maintains high accuracy despite noise.\n- Quantum Convolutional Neural Network -- Convolutional Neural Network: QCNN adapts concepts from classical CNNs.\n- Quantum Convolutional Neural Network -- optimization landscape: QCNN architecture deployed against the binary classification task.\n- QCNN -- Quantum Machine Learning: QCNNs outperform classical methods.; QSVMs and QCNNs are QML approaches.; Consolidation of existing techniques includes QCNN.; QML involves augmenting existing pipelines using quantum states.\n- parameterized unitaries -- Quantum Convolutional Neural Network: Parameterized unitaries are used in the QCNN architecture.\n- Quantum Convolutional Neural Network -- convolution operation: QCNNs use quantum gates to perform convolution operations.", "passages": [{"source": "Beyond Barren Plateaus - A Scalable Quantum Convolutional Architecture for High-Fidelity Image Classification", "page": 12, "text": "The training trajectory is remarkable. Unlike the unmitigated QCNN, which plateaued near 52.32% accuracy, our scalable architecture rapidly converged to a high-fidelity state. Figure 6 illustrates the training and validation metrics over 150 epochs. The empirical terminal accuracy achieved on the test dataset is 98.7%. This metric represents a paradigm shift from prior quantum machine learning literature, which often struggles to break the 90% barrier on standardized datasets without utilizing excessive classical preprocessing or feature mapping. Furthermore, it is imperative to contextualize this accuracy against the parameter count of the model. To achieve comparable fidelity (99.9%), the classical Convolutional Neural Network (CNN) referenced in our preliminary study required over 120, 000 trainable parameters. Our scalable QCNN achieves 98.7% accuracy utilizing only 45 independent rotational parameters (θ)."}, {"source": "Quantum Machine Learning for Cybersecurity", "page": 3, "text": "× × [11] Intelligent Firewall with QML Hybrid behavioral analysis + QML + GNNs; improved malware detection Application-specific; limited taxonomy and inconsistent evaluation ✓ × ✓ ✓ Our paper Comprehensive Review of QML for Cybersecurity Taxonomy of QML (QSVM, QNN, QCNN, QGAN); hybrid models; privacy, interpretability, scalability; cross-domain synthesis Empirical deployments left for future work ✓ ✓ ✓ ✓ Note: ✓= fully addressed; ◦= partially addressed; × = not addressed. Hybrid = inclusion of hybrid Quantum–Classical models; Tax. = presence of structured taxonomy; Apps. = application diversity across cybersecurity domains; Bench. = benchmarking or experimental validation. approaches, namely QSVMs and Quantum Convolutional Neural Networks (QCNNs), outperform classical machine learning methods in classification accuracy. However, their study was limited to a single cybersecurity use case and could not explore the domain of cybersecurity as a whole, with its"}, {"source": "Beyond Barren Plateaus - A Scalable Quantum Convolutional Architecture for High-Fidelity Image Classification", "page": 4, "text": "this architecture on physical NISQ processors. 2 Theoretical Framework: Mitigating Barren Plateaus via Localized Cost Functions and Unitary Design The successful deployment of a Quantum Convolutional Neural Network (QCNN) hinges entirely on the mathematical construction of its ansatz and the geometry of its corresponding optimization landscape. As established in the preceding section, standard variational architectures applied to high-dimensional datasets inevitably fall victim to the barren plateau phenomenon, wherein the variance of the gradient vanishes exponentially with the system size. To achieve the requisite scalability and accuracy for complex image classification tasks, such as our target 98.7% benchmark on the MNIST dataset, we must rigorously define a training framework that provably circumvents this topological trap. This section formalizes the translation of classical image data into the quantum Hilbert space, details the parameterized unitaries governing the"}, {"source": "Beyond Barren Plateaus - A Scalable Quantum Convolutional Architecture for High-Fidelity Image Classification", "page": 1, "text": "However, transitioning from theoretical constructs to empirical dominance has proven exceptionally difficult. Initial studies, including our preliminary investigations, revealed a stark performance gap: classical CNNs routinely achieve accuracies exceeding 99% on standard benchmarks like MNIST, whereas naive QCNN implementations languish in the 50%–60% range. This discrepancy is not merely an artifact of immature quantum hardware; rather, it is deeply rooted in the mathematical geometry of the variational loss landscape. The editorial board of Quantum correctly highlights that variational quantum algorithms are plagued by scalability issues, most notably the barren plateau phenomenon, which often strips QCNNs of any potential quantum advantage [1]. In this paper, we directly confront the barren plateau problem in QCNNs. We argue that correctness in circuit design is insufficient for accep1 arXiv:2603.11131v1 [cs.LG] 11 Mar 2026"}], "claims": ["The scalable QCNN achieves 98.7% accuracy on the MNIST dataset.", "The scalable QCNN uses only 45 independent rotational parameters."]}, {"code": "A054", "question": "In side-channel attacks on Kyber with an imperfect plaintext-checking oracle, how much of the Kyber-512 secret key was recovered by applying the CPA attack twice, and with how many power traces?", "reference": "About 60% of the Kyber-512 secret key was recovered using about 1619 power traces, leaving 40% erroneous coefficients.", "answer": "The CPA attack was used twice to recover 60% of the secret key of Kyber-512 at the cost of about 1619 power traces, but there were still 40% error coefficients.", "kg": "Knowledge graph entities:\n- side-channel attack (ATTACK): Dilithium offers protection against this.; Risk of side-channel attacks requires mitigation strategies.; Need to develop efficient countermeasures against.; Still need to be well considered for Kyber's implementation.; R\n- Kyber-512 (ALGORITHM): Post-quantum cryptographic algorithm for key generation, encryption, and decryption.; Parameter set in Kyber corresponding to AES-128 security level.; Reference implementation deployed on the target board.; Cryptographic\n- selected plaintext attack (ATTACK): Plaintext attack used in Kyber.\n- Kyber (ALGORITHM): Quantum-resistant cryptographic algorithm evaluated in the study.; Quantum-safe alternative recommended for full adoption before 2030.; Lattice-based key encapsulation mechanism based on Module-LWE problem.; Algorithm co\n- power traces (DATASET): Used in the attack to recover s.; Data used for analysis.; Measure of the attack's resource usage.; Traces used in the CPA attack.; Data captured from the device's power consumption.; The number of traces used in CPA to \n- CPA Attack (ATTACK): Step 1 of the two-step attack.; CPA Attack is the first step of the two-step attack.\n- CPA (ATTACK): A metric used in the evaluation of the unprotected scheme.; Cryptographic attack analysis.; An attack method used i le the spiking network performs local, biologically inspired learning on temporally encoded representations. Importantly, the introduction of a pretrained CNN does not alter the locality of learning within the"}, {"source": "Supervised spike agreement dependent plasticity for fast local learning in spiking neural networks", "page": 15, "text": "reward modulation, or teacher forcing. This establishes agreement-driven plasticity as a viable and scalable alternative for supervised SNN training. • A principled sensory front-end for scalable spike-based learning. The integration of a CNN-based feature extractor as a frozen sensory front-end provides a principled solution for extending local spike-based learning to visually complex data. Convolutional preprocessing transforms raw sensory inputs into structured, semantically meaningful representations, which are then converted into spike trains suitable for agreement-driven plasticity. More broadly, these results highlight a necessary paradigm shift in spike-based learning: complex perceptual tasks cannot be addressed by relying solely on brightness-driven or na¨ıve spike generation schemes. Expecting a spiking network to discover rich semantic structure from unstructured intensity-based spike trains places an unrealistic burden on"}, {"source": "Supervised spike agreement dependent plasticity for fast local learning in spiking neural networks", "page": 3, "text": "preserving the locality of synaptic updates. Several studies have demonstrated that synchronydependent rules can accelerate feature learning and facilitate pattern recognition in SNNs, particularly under noisy conditions [1]. 2.3 Spike Agreement-Dependent Plasticity (SADP) Building upon these insights, Spike Agreement-Dependent Plasticity (SADP) was recently proposed as a fast, local, and biologically inspired learning rule [48, 1]. Unlike STDP and SSDP, SADP measures the statistical agreement between pre- and post-synaptic spike trains over extended temporal windows using chance-corrected metrics such as Cohen’s κ. SADP eliminates the need for precise spike-pair evaluation, reducing computational complexity to linear time and making it highly compatible with hardware implementations. Empirical studies have shown that unsupervised SADP improves the speed and stability of learning in SNNs, enabling efficient feature extraction and robust"}, {"source": "Supervised spike agreement dependent plasticity for fast local learning in spiking neural networks", "page": 4, "text": "retains the efficiency benefits of population-based plasticity while enabling task-driven learning in multilayer SNNs. 3 Supervised Spike Agreement–Dependent Plasticity 3.1 Input Representation and Encoding 3.1.1 Poisson Spike Encoding Normalized input features are converted into stochastic spike trains of length T using independent Bernoulli sampling. For sample b, feature i, and timestep t, S(b) in (t, i) ∼Bernoulli \u0010 x(b) i \u0011 . This produces a binary spike tensor S(b) in ∈{0, 1}T ×Nin, which serves as the input to the spiking neural network. 4"}], "claims": ["The CNN-based feature extractor is a sensory front-end.", "The CNN-based feature extractor transforms raw sensory inputs.", "The CNN-based feature extractor transforms raw sensory inputs into structured, semantically meaningful representations.", "The features extracted by the CNN-based feature extractor provide diversity and structure.", "The features extracted by the CNN-based feature extractor provide the necessary diversity and structure for spike agreement-dependent plasticity.", "The features extracted by the CNN-based feature extractor provide the necessary diversity and structure for spike agreement-dependent plasticity to reinforce class-relevant neuronal assemblies."]}, {"code": "A056", "question": "What error rate does an eavesdropper who measures and resends all photons in the rectilinear basis induce in BB84, and which two sources contribute to detection events in decoy-state
