S-Kyber implementations have been found vulnerable to side-channel attacks.; Side-channel attacks pose a threat to Kyber.; Masking is used to defend CRYSTALS\n- side-channel attack -- Paul Kocher: Side-channel attacks were first identified by Paul Kocher in 1996.\n- recursive learning -- side-channel attack: Recursive learning techniques are suggested to counter side-channel attacks.\n- basemul -- side-channel leakage: Side-channel leakage can be exploited through basemul calculations.\n- side-channel attack -- cryptographic device: Side-channel attacks make use of data disclosed by a cryptographic device.", "passages": [{"source": "Investigating CRYSTALS-Kyber Vulnerabilities - Attack Analysis and Mitigation", "page": 7, "text": "with limited resources thanks to these strategies, which seek to maximize speed while minimizing the use of hardware resources. Even though hardware advancements have resulted in performance advantages, security is still the first priority when implementing Kyber. The identification of sidechannel attack vulnerabilities by recent research has prompted the investigation of solutions to reduce the associated dangers. Power side-channel information has been exploited, and encryption keys have been extracted from Kyber implementations using machine learning techniques [48]. Researchers have suggested recursive learning techniques and disguised implementations to counter these dangers and improve security against side-channel attacks. In addition, new developments in cryptography have been studied to fortify Kyber’s security against possible intrusions, including masked polynomial operations and improved key derivation procedures [49]. 6. Attacks against CRYSTALS-Kyber"}, {"source": "An Improved Two-Step Attack on Lattice-Based Cryptography - A Case Study of Kyber", "page": 2, "text": "access to a device which is running Kyber decryption and can only observe ciphertexts entered into the device. In addition, they can also capture the power traces of the device. Several test vector leakage assessment (TVLA) results from previous works have indicated the potential leakage points during the decryption process in Kyber [6], [7]. One critical side-channel leakage occurs during the PWM of ˆs ◦ˆu. In the clean implementation of pqm4 [11], polynomial multiplication employs 256 basemuls in Kyber-512. Moreover, each calculation of basemul is independent from the others. From Listing 1, it is clear that the result depends on two secret key coefficients, s0 and s1. All partial secret key coefficients range from (0, 3328) for Kyber. In a practical attack, suppose that the attacker aims to recover the coefficient s0. r1 can be selected as the intermediate value. A. Modified Leakage Model for CPA The Hamming weight (HW) model counts the number of"}, {"source": "Investigating CRYSTALS-Kyber Vulnerabilities - Attack Analysis and Mitigation", "page": 1, "text": "Abstract: Significant advancements have been achieved in the field of quantum computing in recent years. If somebody ever creates a sufficiently strong quantum computer, many of the public-key cryptosystems in use today might be compromised. Kyber is a post-quantum encryption technique that depends on lattice problem hardness, and it was recently standardized. Despite extensive testing by the National Institute of Standards and Technology (NIST), new investigations have demonstrated the effectiveness of CRYSTALS-Kyber attacks and their applicability in non-controlled environments. We investigated CRYSTALS-Kyber’s susceptibility to side-channel attacks. In the reference implementation of Kyber512, additional functions can be compromised by employing the selected ciphertext. The implementation of the selected ciphertext allows the attacks to succeed. Real-time recovery of the entire secret key is possible for all assaults."}, {"source": "Investigating CRYSTALS-Kyber Vulnerabilities - Attack Analysis and Mitigation", "page": 8, "text": "Cryptography 2024, 8, 15 8 of 13 can be abused and that businesses need to be mindful of the possible security threats it may provide. We should not be overly concerned about the security of the CRYSTALS-Kyber algorithm because this assault does not imply that it is “ruined” or “broken.” It seems doubtful that this kind of side-channel assault will be employed in actual attacks. We should be aware of the possible security threats that machine learning may provide, as it may be used to exploit these kinds of attacks. The algorithm remains safe, and corporations should not worry too much about it despite the attack against CRYSTALS-Kyber. Prior research has utilized artificial intelligence (AI) to breach first-, second-, and thirdorder masked Kyber implementations. However, it was very hard to break any higherorder masked implementations using conventional AI training and profiling techniques. By employing a new kind of deep learning and rotations on the intercepted message to raise"}], "claims": ["One critical side-channel leakage point has been reported in Kyber's decryption procedure.", "The side-channel leakage point occurs during the PWM of ˆs ◦ˆu.", "Researchers used machine learning techniques to extract encryption keys from Kyber implementations."]}, {"code": "A094", "question": "How do Kyber's public key and Dilithium's signature sizes compare with classical ECC, and are these post-quantum schemes considered feasible and efficient enough for IoT and mainstream applications?", "reference": "Kyber's public key (~800 bytes) is larger than an ECC public key (~32 bytes) but much smaller than Classic McEliece's (>1 MB, which can exceed IoT RAM), and Dilithium signatures are a few kilobytes versus 64 bytes for ECDSA. Efficient KEMs like Kyber are considered feasible at least at the first security level for a common IoT setup; Kyber operations are fast (comparable to RSA or faster) and Dilithium verifies thousands of signatures per second and suits fast signing when memory is sufficient, while FALCON is more memory-efficient.", "answer": "Kyber's public key is very large compared to classical ECC, while Dilithium's signatures are much larger than ECDSA signatures but smaller than some alternatives like McEliece. These post-quantum schemes are considered feasible and efficient enough for IoT and mainstream applications, though they may require more memory and have higher cryptographic overhead.", "kg": "Knowledge graph entities:\n- Dilithium (ALGORITHM): Future work will apply the method to this algorithm.; Another lattice-based PQC using single-point PWM.; Lattice-based PQC that employs single-point PWM and is more vulnerable to similar attacks.; A lattice-based cryptog\n- public key (CONCEPT): Public key used in the encryption process.; Component of the encryption process in Kyber.; Very large in code-based systems, often by orders of magnitude compared to lattice-based designs.; HQC offers practical range of \n- Lattice-based encryption schemes (SYSTEM): Novel approaches to data protection intended to withstand attacks from quantum computers.; Lattice-based encryption (Kyber) is used in hybrid systems.; Encryption schemes based on the Learning With Errors (LWE) problem.;\n- ECC (ALGORITHM): Not directly described but implied as a comparison to other algorithms.; Algorithm that has been vetted for decades.; Cryptographic algorithm.; Determine if ECC is quantum-vulnerable.; Cryptographic approach useful for e\n- signature (CONCEPT): Digital signature in XMSS scheme S_i = H_i(m, r_i).; Signature algorithm.; Output of the signing process that is transmitted to Alice.; CONCEPT|Components of the signature returned by the signing procedure.; Output assoc\n- lattice (CONCEPT): Another mathematical issue that is thought to be difficult for quantum computers.; Kyber algorithm based on Module-LWE.; Accumulate the same security mileage as multivariate signatures.; Mathematical foundation based on \n- post-quantum digital signatures (SYSTEM): Can achieve computational efficiency comparable to or exceeding classical alternatives.\n- post-quantum blind signature (ALGORITHM): offered a more effective post-quantum blind signature than earlier schemes.; Post-quantum blind signatures based on lattices and isogenies can be employed in blockchain-IoT contexts.\n\nKnowledge graph relations:\n- Dilithium signature -- Kyber’s public key: Dilithium signatures are much larger than ECDSA signatures but smaller than some alternatives like McEliece.\n- CRYSTALS-Kyber -- CRYSTALS-Dilithium: Both are approved algorithms.; Both are candidate algorithms for post-quantum cryptography.\n- Dilithium -- SPHINCS+: Both are post-quantum cryptographic algorithms.; NIST has presented Dilithium and SPHINCS+ as postquantum signature standards.; Dilithium outperforms SPHINCS+ in terms of signature size and speed.\n- lattice -- Post-Quantum Cryptography: Kyber is a PQC algorithm.\n- CRYSTALS-Kyber -- SPHINCS+: All three are approved algorithms.; All three are candidate algorithms for post-quantum cryptography.\n- Kyber -- Dilithium: Both are lattice-based cryptographic systems.; Both are PQC designs.\n- multivariate schemes -- Dilithium: Alternative post-quantum cryptographic scheme.\n- isogeny-based approach -- Dilithium: Alternative post-quantum cryptographic scheme.\n- Dilithium -- PQC: Dilithium is a widely adopted PQC algorithm.; PQC includes algorithms like Dilithium for digital signatures.\n- Dilithium -- private key: Dilithium employs many discrete Gaussian samplings over integers.\n- signature -- post-quantum blockchain: Signature algorithms are central to postquantum blockchain transitions.\n- Dilithium -- FALCON: NIST has presented Dilithium and FALCON as postquantum signature standards.; Dilithium outperforms FALCON in terms of signature size and speed.; FALCON offers the fastest validation speed while Dilithium provides the fas", "passages": [{"source": "Post-Quantum_Blockchain_Security_for_the_Internet_of_Things_Survey_and_Research_Directions", "page": 7, "text": "time required to generate a key is prohibitive compared to the other two schemes. There are also some concerns about defending against timing and side-channel attacks because it employs many discrete Gaussian samplings over integers [61]. Additionally, it is noticeable that while the size of the public and private keys in Dilithium is signiﬁcantly larger than SPHINCS+, it offers a far superior signature size and speed in comparison to FALCON and SPHINCS+, as shown in Table III. However, FALCON and SPHINCS+ outperformed Dilithium in terms of memory utilization, thereby making them more suitable for devices with limited memory. IV. PQCS IN IOT DEVICES Post-quantum cryptosystems will eventually replace traditional methods in many security protocols, which impact IoT ecosystems that use these protocols. This is caused by the high memory consumption and cryptographic overhead associated with their operations and outputs, such as signing, validating,"}, {"source": "Post-Quantum Cryptography and Quantum-Safe Security", "page": 26, "text": "Dilithium, and SPHINCS+), the comparative evaluation of alternative schemes-particularly multivariate, code-based, and isogeny-based approaches-remains incomplete. Many existing studies rely on benchmarks under specific conditions that may not generalize to diverse environments such as embedded IoT devices, cloud-scale infrastructures, or mission-critical systems with strict latency requirements. Second, side-channel resistance and implementation security are often treated as afterthoughts in algorithmic proposals, leaving open questions about their viability in adversarial real-world contexts. Third, the literature surveyed reveals a geographic and institutional concentration of research, which may limit the diversity of perspectives on deployment models and governance frameworks. Acknowledging these limitations clarifies the scope of the current survey and signals the need for broader and deeper engagement across the PQC research ecosystem."}, {"source": "The-Quantum-Security-Deadline", "page": 11, "text": "Management (CLM) platforms streamline issuance, renewal, and revocation through REST APIs  and policy engines (Keyfactor, 2024).  Automation supports large-scale PQC rollout by minimizing human error and ensuring certificates  remain compliant with updated standards. AI-driven CLM tools can even predict certificate  expirations and enforce organization-wide cryptographic policies in real time.    2. Integration with PQC Algorithms  Modern CLM frameworks are evolving to support quantum-safe certificates, integrating  algorithms such as Dilithium for digital signatures and Kyber for key encapsulation (NIST, 2024).  By supporting hybrid certificates—embedding both RSA/ECC and PQC keys—enterprises can  maintain backward compatibility during phased adoption (Entrust, 2025).  This integration ensures consistent cryptographic trust continuity, where identity verification  remains valid even as underlying algorithms evolve.    Supply Chain PQC Compliance"}, {"source": "Post-Quantum Cryptography and Quantum-Safe Security", "page": 3, "text": "(KEM) and signatures [53, 70, 71]. Beyond the standards themselves, the ecosystem already includes hardware and algorithmic optimizations for signing and verification, such as low-latency Dilithium pipelines on field-programmable gate arrays (FPGAs), graphics processing unit (GPU) accelerated ML-DSA servers, and Fourier-based engineering for compact signatures in FALCON [33, 84, 88]. These gains come with real-world challenges. Implementers must handle subtle issues such as discrete Gaussian sampling, rejection behavior, and microarchitectural leakage, and recent work continues to refine both attack surfaces and countermeasures for Kyber and Dilithium style designs 1Awesome PQC repository: https://github.com/gauravfs-14/awesome-pqc ACM Comput. Surv., Vol. 1, No. 1, Article . Publication date: October 2025."}], "claims": ["Kyber's public key is very large compared to classical ECC.", "Dilithium's signatures are much larger than ECDSA signatures.", "Dilithium's signatures are smaller than some alternatives like McEliece.", "These post-quantum schemes are considered feasible for IoT and mainstream applications.", "These post-quantum schemes are considered efficient enough for IoT and mainstream applications.", "These post-quantum schemes may require more memory.", "These post-quantum schemes have higher cryptographic overhead."]}, {"code": "A095", "question": "What is the status of CRYSTALS-Dilithium support in cryptographic libraries such as OpenSSL and Botan, and which industry players have adopted Dilithium?", "reference": "Botan offers a rich PQC suite in its C++ API, and wolfSSL and Bouncy Castle already integrate Kyber and Dilithium into their TLS stacks, whereas OpenSSL did not officially support PQC as of early 2025 but plans to integrate Kyber, Dilithium and others. Dilithium is expected to be the default signature in most deployments, and Kyber and Dilithium have seen early adoption by Cloudflare, Amazon Web Services and IBM.", "answer": "OpenSSL does not natively support CRYSTALS-Dilithium, but it does support CRYSTALS-Dilithium through prototypes. Botan, on the other hand, supports CRYSTALS-Dilithium in its recent versions. Industry players like Botan and OpenSSL are adopting Dilithium for post-quantum cryptography.", "kg": "Knowledge graph entities:\n- CRYSTALS-Dilithium (ALGORITHM): Lattice-based signature scheme.; NIST PQC finalist lattice-based digital signature.\n- Dilithium (ALGORITHM): Quantum-resistant cryptographic algorithm evaluated in the study.\n- Botan (SYSTEM): Cryptographic open-source library.; C++ microservice might use Botan to ensure quantum-safe ci\n- OpenSSL (SYSTEM): Vendor supporting various cryptographic algorithms.; Library that can support post-quantum cryptography.\n\nKnowledge graph relations:\n- OpenSSL -- CRYSTALS-Dilithium: OpenSSL supports CRYSTALS-Dilithium.\n- Dilithium -- OpenSSL: Dilithium has been integrated into OpenSSL prototypes.; OpenSSL does not support Dilithium.\n- Botan -- CRYSTALS-Dilithium: Botan supports CRYSTALS-Dilithium.\n- Crypto++ -- CRYSTALS-Dilithium: Crypto++ supports CRYSTALS-Dilithium.; Fork of Crypto++ added CRYSTALS-Dilithium.\n- FPGA-based platforms -- CRYSTALS-Dilithium: Supports CRYSTALS-Dilithium.\n- CRYSTALS-Kyber -- CRYSTALS-Dilithium: Selected by NIST for post-quantum cryptography.; Similar story for CRYSTALS-Dilithium as for CRYSTALS-Kyber.", "passages": [{"source": "A Survey of Post-Quantum Cryptography Support in Cryptographic Libraries", "page": 2, "text": "libraries have implemented support for the NIST-selected postquantum algorithms (specifically the NIST PQC finalists and standards). Our definition of a cryptographic open-source library includes any specific software implementation of modern cryptographic primitives and algorithms completed by the opensource community. There are more than 15 such open-source libraries integrated into projects that require cryptographic primitives [7]. For this survey, we focus only on nine that include OpenSSL [8], wolfSSL [9], BoringSSL [10], LibreSSL [11], Bouncy Castle [12], libsodium [13], Crypto++ [14], Botan [15], and MbedTLS [16] given their wide adoption in software and systems. The focus is confined to NIST PQC finalist algorithms, specifically those chosen for standardization in 2022: CRYSTALS-Kyber (a KEM based on lattices), CRYSTALSDilithium (a lattice-based digital signature), FALCON (signature using lattice techniques), and SPHINCS+ (a signature"}, {"source": "A Survey of Post-Quantum Cryptography Support in Cryptographic Libraries", "page": 7, "text": "Preprint – A Survey of Post-Quantum Cryptography Support in Cryptographic Libraries 7 Observation: MbedTLS does not yet have Kyber, Dilithium, Falcon, or SPHINCS+ implemented, but supports LMS for signatures, and has strong intent to add Kyber soon, followed by Dilithium eventually. This will be a major development because MbedTLS is used in millions of IoT devices (everything from small appliances to sensors). 5.4 Crypto++ Crypto++ is a widely used C++ library known for its broad set of crypto-primitives. We rank it fourth in our list. Historically, Crypto++ has been cautious in adopting cutting-edge algorithms until standards stabilize. As of version 8.9 (late 2023), it does not include the NIST PQC finalists in its mainline distribution. However, third-party efforts have emerged: from 2020–2022, Finnish researchers (J. Hekkala et al.) created a fork adding CRYSTALS-Kyber, CRYSTALS-Dilithium, SABER, and later FrodoKEM [40,41]. This fork (cryptopp-pqc)"}, {"source": "A Survey of Post-Quantum Cryptography Support in Cryptographic Libraries", "page": 8, "text": "Preprint – A Survey of Post-Quantum Cryptography Support in Cryptographic Libraries 8 of PQC, Botan has made significant progress and supports the NIST PQC finalists in recent versions. By late 2023, Botan had added implementations of CRYSTALS-Kyber and CRYSTALSDilithium to its library [47]. It also implemented SPHINCS+ in an earlier release [47]. According to the PQC matrix, Botan supports Kyber, Dilithium, SPHINCS+, and has XMSS already (that was added around Botan 2.x [31]. Falcon was not yet supported at the time of the update [31]. However, Botan has it on the roadmap for later use. Botan is also considering incorporating support for Classic McEliece. The PQC matrix marks McEliece as planned, implying that the project maintainers are contemplating its inclusion, possibly pending a decision from NIST [31]. Additionally, Botan developers were active in standardization; the lead maintainer Jack Lloyd often tracks NIST drafts. For example, in Botan’s release notes, they mention"}, {"source": "Post-Quantum Cryptography and Quantum-Safe Security", "page": 11, "text": "systems. To this end, NIST has endorsed three signature families for widespread adoption-ML-DSA (Dilithium), SLH-DSA (SPHINCS+), and the lattice-based Falcon under a parallel track-highlighting a balance between performance efficiency and conservative security across lattice- and hash-based paradigms [4, 70, 71]. These post-quantum signature mechanisms mark a decisive move away from traditional RSA and elliptic curve digital signature algorithm (ECDSA), grounding security in problems that remain intractable even with quantum computation [57]. The selected algorithms-CRYSTALS-Dilithium (ML-DSA), Falcon (FN-DSA), and SPHINCS+ (SLH-DSA)-each bring unique trade-offs in efficiency, key and signature sizes, and assurance levels, ensuring flexibility for varied deployment requirements in the emerging quantum era [23]. 4.1 CRYSTALS-Dilithium (ML-DSA) The ML-DSA (see Figure 3), formerly known as CRYSTALS-Dilithium, is a lattice-based signature"}], "claims": ["OpenSSL does not natively support CRYSTALS-Dilithium.", "OpenSSL supports CRYSTALS-Dilithium through prototypes.", "Botan supports CRYSTALS-Dilithium in its recent versions.", "Botan has adopted Dilithium for post-quantum cryptography.", "OpenSSL has adopted Dilithium for post-quantum cryptography."]}, {"code": "A096", "question": "Why are multivariate quadratic (MQ) cryptographic schemes considered quantum-resistant, what are they mainly used for, and what property makes a multivariate signature scheme suitable for authenticating edge nodes?", "reference": "MQ cryptography relies on solving systems of quadratic equations over finite fields, an NP-hard problem for which no efficient classical or quantum algorithm is known; MQ-based schemes are mainly used for digital signatures and public-key encryption. A multivariate signature scheme proposed by Akleylek et al. is immune to quantum attacks, has effective key and signature sizes, and its excellent parallelism support allows edge node authentication to be deployed effectively.", "answer": "Multivariate quadratic (MQ) cryptographic schemes are considered quantum-resistant because no efficient quantum algorithms are known for solving generic MQ systems, making them suitable for cryptographic applications. They are mainly used in digital signatures and public-key encryption. Multivariate signature schemes, like multivariate quadratic cryptography, are suitable for authenticating edge nodes due to their quantum-resistance, which ensures security against potential quantum computer attacks.", "kg": "Knowledge graph entities:\n- multivariate quadratic (MQ) cryptography (PROTOCOL): Promising PQC approach involving solving systems of quadratic equations.\n- multivariate signatures (ALGORITHM): A quantum-resistant signature scheme.; Contribute diversity and useful ideas but have a higher risk profile.\n- multivariate based techniques (ALGORITHM): Postquantum cryptographic method providing quantum resistance.\n- multivariate polynomial cryptography (ALGORITHM): A type of post-quantum-resistant encryption.\n\nKnowledge graph relations:\n- multivariate quadratic (MQ) cryptography -- digital signature: MQ-based schemes are used in digital signatures.\n- multivariate quadratic (MQ) cryptography -- quantum computer: No efficient quantum algorithms known for solving MQ systems.\n- multivariate quadratic (MQ) cryptography -- public-key encryption: MQ-based schemes are used in public-key encryption.\n- multivariate signatures -- quantum-resistant cryptographic algorithms: Multivariate signatures are a quantum-resistant cryptographic protocol.\n- multivariate quadratic (MQ) equations -- Post-Quantum Cryptography: Multivariate quadratic equations are a type of PQC.\n- multivariate quadratic (MQ) cryptography -- classical computer: No efficient classical algorithms known for solving MQ systems.", "passages": [{"source": "Next-Generation Quantum Security - The Impact of Quantum Computing on Cybersecurity—Threats, Mitigations, and Solutions", "page": 15, "text": "This problem remains intractable for quantum computers, making McEliece a strong candidate for PQC. Multivariate Quadratic equations (MQ) Multivariate quadratic (MQ) cryptography is a promising PQC approach. No efficient classical or quantum algorithms are known for solving generic MQ systems, making them suitable for cryptographic applications. MQ-based schemes are primarily used in digital signatures and public-key encryption, leveraging their resistance to quantum attacks."}, {"source": "Post-Quantum Cryptography and Quantum-Safe Security", "page": 5, "text": "Post-Quantum Cryptography and Quantum-Safe Security: A Comprehensive Survey 5 Multivariate cryptography illustrates both innovation and fragility within PQC. These schemes rely on the difficulty of solving systems of multivariate quadratic (MQ) equations over finite fields, which is Nondeterministic Polynomial-time (NP)-hard in general. Recent work, such as the MAYO multivariate signature scheme (MAYO), revisits design choices and implementation security, including the effect of physical attack models on side-channel robustness."}, {"source": "Post-Quantum Cryptography and Quantum-Safe Security", "page": 23, "text": "essential for applications requiring long-term assurance against unforeseen advances in algebraic cryptanalysis. The rectangular MinRank attack on Rainbow demonstrated the susceptibility of multivariate schemes to advanced algebraic methods, while the collapse of SIKE illustrated how subtle structural vulnerabilities can be exploited using unexpected mathematical insights."}, {"source": "Post-Quantum Cryptography and Quantum-Safe Security", "page": 10, "text": "The UOV construction serves as the mathematical foundation for most contemporary multivariate schemes, utilizing a sophisticated trapdoor structure that enables efficient signing operations while maintaining the apparent intractability of the public polynomial system for potential adversaries. However, the rectangular MinRank attack developed against Rainbow has demonstrated applicability to other multivariate constructions, revealing fundamental vulnerabilities in the mathematical approaches that underlie this family of schemes."}], "claims": ["Multivariate quadratic (MQ) cryptographic schemes are considered quantum-resistant.", "No efficient quantum algorithms are known for solving generic MQ systems.", "Multivariate quadratic (MQ) cryptographic schemes are mainly used in digital signatures and public-key encryption.", "Multivariate signature schemes are suitable for authenticating edge nodes.", "The quantum-resistance of multivariate signature schemes ensures security against potential quantum computer attacks."]}, {"code": "A097", "question": "Why do large post-quantum keys and signatures cause problems for 5G network slices and handovers, and how large is the handshake overhead of hash-based signature schemes?", "reference": "In eMBB slices, the per-packet size increase from PQC can add substantial aggregate bandwidth and cause fragmentation; latency-critical alerting with sub-10 ms bounds can only use schemes with very low processing latency; and handovers require repeated authentication and key establishment, so larger PQC handshake messages can worsen signalling congestion. Hash-based signature schemes are especially costly: their large signatures cause handshake overheads of 245% to 890% relative to classical algorithms, mainly because signatures must be sent over multiple packets.", "answer": "Large post-quantum keys and signatures cause problems for 5G network slices and handovers due to increased resource consumption and potential delays. The handshake overhead of hash-based signature schemes ranges from 245% to 890% relative to classical algorithms, primarily due to the need to transmit signatures over multiple packets.", "kg": null, "passages": [{"source": "Post-Quantum Cryptography and Quantum-Safe Security", "page": 16, "text": "16 Chhetri et al. Hash-based signature schemes are particularly challenging in this regard: their large signature sizes lead to handshake overheads ranging from 245% to 890% relative to classical algorithms, primarily due to the need to transmit signatures over multiple packets. 5.3 Implementation Security and Side-Channel Considerations While post-quantum algorithms offer strong theoretical guarantees, their practical security critically depends on robust implementations. Side-channel attacks-exploiting power consumption, electromagnetic emissions, timing variations, and similar physical leakages-pose a significant risk to PQC deployments [96]. Empirical assessments such as test vector leakage assessment (TVLA) have revealed exploitable leakage across several PQC families, underscoring the need for comprehensive mitigation strategies. Developing countermeasures requires a trade-off between security strength and computational"}, {"source": "Next-Generation Quantum Security - The Impact of Quantum Computing on Cybersecurity—Threats, Mitigations, and Solutions", "page": 16, "text": "and verifying the signature through the hashes along the Merkle tree path. Since hash-based signatures depend on collision-resistant  hash functions, quantum algorithms face significant difficulty in finding two messages with identical hash values. 5.5. Obstacles to the integration of post-quantum cryptography The Post-quantum cryptographic (PQC) systems can achieve widespread adoption, academia and industry must address several  substantial challenges. One of the primary concerns with PQC algorithms is performance. Lattice-based schemes, such as Kyber and  NTRU, are significantly less efficient than classical cryptographic methods in terms of key sizes and ciphertext lengths [191]. These  systems often require key sizes ranging from thousands to even millions of bytes, creating resource-intensive conditions—particularly  problematic for Internet of Things (IoT) devices and other constrained environments [79,192]."}, {"source": "A_Comprehensive_Survey_on_Pre_Versus_Post_Quantum_Security_Schemes_for_5G-Enabled_IoT_Applications", "page": 9, "text": "B. Choudhury et al.: Comprehensive Survey on Pre Versus Post Quantum Security Schemes FIGURE 4. Attacks in IoT Network. TABLE 5. Summary of security risks and challenges. 7) Availability 8) Resilience against quantum threats To ensure these standards in the 5G-empowered network, many researchers have carried out careful experiments and proposed cryptographic solutions. We explore the potential solutions in the subsequent sections. V. TAXONOMY OF CRYPTOGRAPHY SOLUTIONS AGAINST SECURITY BREACHES IN 5G-ENABLED IoT SYSTEMS Many potential solutions have been proposed in the field of 5G-empowered security, which requires a systematic organization for acquiring meaningful insights from these diverse research components. In the past, many researchers, [22], [23], [24], [25], [26], [27], [28], [29], [30] presented a taxonomy of solutions based on machine learning and deep learning-based approaches. These surveys did not highlight any cryptographic solutions and are limited to intrusion"}, {"source": "Post-Quantum Cryptography and Quantum-Safe Security", "page": 15, "text": "7,245 14,421 Note: KeyGen, Enc/Sign, Dec/Ver in ms.. milliseconds even for the highest security parameters, demonstrating that post-quantum digital signatures can achieve computational efficiency comparable to or exceeding classical alternatives. Hash-based signatures exhibit fundamentally different performance characteristics that reflect their conservative security approach and mathematical structure. SLH-DSA signing operations require substantially longer execution times, ranging from 120ms to 650ms, depending on the security level, primarily due to the complex tree-based computations and multiple hash evaluations required for each signature generation. 5.1 Hardware Acceleration and Implementation Optimization Hardware acceleration represents a critical enabler for practical PQC deployment, with lattice-based schemes demonstrating exceptional potential for performance improvements through specialized"}], "claims": ["Large post-quantum keys and signatures cause problems for 5G network slices and handovers.", "The problems are due to increased resource consumption and potential delays.", "The handshake overhead of hash-based signature schemes is significant.", "The handshake overhead of hash-based signature schemes ranges from 245% to 890% relative to classical algorithms.", "The increased handshake overhead is primarily due to the need to transmit signatures over multiple packets."]}, {"code": "A098", "question": "Why is quantum key distribution (QKD) considered provably secure against eavesdropping?", "reference": "QKD relies on principles of physics rather than the computational complexity of mathematical problems, so anyone attempting to access the key exchange can be detected.", "answer": "Quantum key distribution (QKD) is considered provably secure against eavesdropping because it leverages the principles of quantum mechanics, specifically the Heisenberg uncertainty principle. Any eavesdropping attempt introduces measurable errors due to the disturbance of quantum states, which can be detected by the communicating parties. This ensures that the security of the communication is information-theoretic and unconditional.", "kg": "Knowledge graph entities:\n- QKD (PROTOCOL): Standard for secure quantum communications.; Quantum cryptography implementations like QKD.; Quantum Key Distribution protocol for secure communications.; Protocol with technical limitations motivating the positions of v\n- Quantum Key Distribution Networks (SYSTEM): Building a QKD network at scale leads to a combinatorial explosion of needed links.; China’s 2,000-km Quantum Key Distribution network.; Target of the modified PNS attack.; This modified scheme is based on weak laser pul\n- Quantum Key Distribution (PROTOCOL): Technology that relies on coherence for secure communication.; Technology that ensures secure state transmission.; Integrated with ML to optimize communication security.; System for q ics to protect against quantum eavesdropping attacks.\n- Quantum Key Distribution -- Quantum Secure Communication: QKD is a part of secure communication.\n- Quantum Key Distribution -- unconditional security: QKD provides unconditional security.; QKD provides information-theoretic security.\n- Quantum Key Distribution -- finite-key security: QKD provides finite-key security.; Security analysis of QKD distinguishing raw security from KPA security.", "passages": [{"source": "Next-Generation Quantum Security - The Impact of Quantum Computing on Cybersecurity—Threats, Mitigations, and Solutions", "page": 16, "text": "According to quantum key distribution (QKD) principles, encryption keys are generated between two parties using quantum mechanics to ensure secure communication while allowing the detection of eavesdropping. QKD implements the uncertainty principle described by Heisenberg, which states that measurements disturb quantum systems. The security of QKD communication arises from the fact that any eavesdropping attempt introduces measurable errors due to the disturbance of quantum states."}, {"source": "Next-Generation Quantum Security - The Impact of Quantum Computing on Cybersecurity—Threats, Mitigations, and Solutions", "page": 19, "text": "Quantum key distribution (QKD) can further enhance blockchain security by enabling eavesdropping-resistant key exchange between nodes. QKD’s ability to detect eavesdropping ensures secure key reestablishment, preventing unauthorized access. Mathematically, the QKD key exchange can be represented as: 𝐾shared = 𝑓(𝐀, 𝐁) (14) Here, 𝐾shared is the shared secret key derived from the quantum states 𝐀 (Alice) and 𝐁 (Bob), with any eavesdropping attempt 𝐸 causing detectable disturbances. Integrating QKD with blockchain networks provides a quantum-secure communication layer."}, {"source": "QUANTUM KEY DISTRIBUTION - Bridging Theoretical Security Proofs, Practical Attacks, and Error Correction", "page": 15, "text": "Because many of these attacks are statistically indistinguishable from background noise at realistic block sizes, asymptotic analyses alone are insufficient. In Sec. 4 Security Analysis of QKD We now review the security of Quantum Key Distribution systems by looking over different classes of security proofs. 4.1 Security Paradigms in QKD As mentioned earlier, QKD provides security by leveraging the principles of quantum mechanics. The security paradigms in QKD are broadly classified as unconditional security, finite-key security, and composable security."}, {"source": "QUANTUM KEY DISTRIBUTION - Bridging Theoretical Security Proofs, Practical Attacks, and Error Correction", "page": 15, "text": "paradigms in QKD are broadly classified as unconditional security, finite-key security, and composable security. QKD exploits inherently quantum phenomena—such as non-orthogonal state encoding and the no-cloning theorem—to generate shared keys between Alice and Bob. Security analyses further distinguish raw security—Eve’s maximum success probability during key generation—from Known-Plaintext Attack (KPA) security, which bounds her advantage once part of the key is revealed during message exchange. 15"}], "claims": ["Quantum key distribution (QKD) is considered provably secure against eavesdropping.", "QKD leverages the principles of quantum mechanics.", "The Heisenberg uncertainty principle is used in QKD.", "Eavesdropping attempts introduce measurable errors.", "Eavesdropping attempts disturb quantum states.", "The communicating parties can detect eavesdropping attempts.", "The security of QKD is information-theoretic.", "The security of QKD is unconditional."]}, {"code": "A099", "question": "Which quantum mechanisms allow Shor's algorithm to factor large integers efficiently, and why does this threaten RSA?", "reference": "Shor's algorithm uses entanglement to exploit quantum parallelism, and at its core the Quantum Fourier Transform implements key subroutines exponentially faster than classical counterparts, so it factors large integers in polynomial time. RSA's security rests on the difficulty of factoring large numbers into their prime factors, so Shor's algorithm threatens RSA (and ECC).", "answer": "Shor's algorithm efficiently factors large integers by leveraging quantum mechanics principles such as superposition and entanglement, allowing it to perform complex calculations in parallel. This capability threatens RSA because RSA's security relies on the computational difficulty of factoring large integers, which classical computers find infeasible for sufficiently large numbers. However, Shor's algorithm can factor these large integers in polynomial time on a quantum computer, thus compromising RSA's security.", "kg": "Knowledge graph entities:\n- integers (CONCEPT): Number to be factored by Shor’s algorithm.; Composite number to be factored (in RSA) 𝑁= 𝑝⋅𝑞.; Public and private exponents in RSA cryptosystem.; Private key in ECC (𝑄= 𝑘⋅𝐺).; Numbers represented in binary.\n- RSA (ALGORITHM): System that relies on the difficulty of factoring large numbers.; Public-key framework used in QMLFD-RSA.; Not directly described but implied as a comparison to other algorithms.; Algorithm that has been vetted for decad\n- Shor algorithm for integer factorization (ALGORITHM): Quantum algorithm to solve the integer factorization problem.\n- Shor’s Factoring Algorithm (ALGORITHM): Quantum algorithm developed by Peter Shor for finding prime factors of an integer.\n- Shor algorithm (ALGORITHM): Algorithm that performs large factoring in polynomial time.; Quantum algorithm that can compromise encryption systems.\n- Shor’s algorithm (ALGORITHM): Algorithm that can potentially break systems like RSA.; Algorithm used as a crucial test-bed for refining error correction techniques and improving qubit stability.; Algorithm for determining the periodicity of functions\n- large integer (CONCEPT): Integer that classical computers would require impractical amounts of time to factor.\n- quantum factoring algorithm (ALGORITHM): Algorithm improved in recent years for quantum systems.; The bottleneck in the quantum factoring algorithm is the modular exponentiation problem.; Our quantum factoring algorithm for factoring an integer n.\n\nKnowledge graph relations:\n- quantum computing -- Shor’s algorithm: Quantum computing, particularly Shor’s algorithm, threatens RSA.; Quantum computing poses a threat to RSA via Shor’s algorithm.; Shor's algorithm is used in quantum computing.; Shor’s algorithm is part of quantum computi\n- Shor’s Factoring Algorithm -- quantum computer: On a quantum computer, Shor’s algorithm can factor a number N in polynomial time.\n- Shor’s algorithm -- Cryptographically Relevant Quantum Computers: Shor's algorithm demonstrates that a CRQC can efficiently solve integer factorization and discrete logarithms.; A CRQC can efficiently solve the problems on which classical public-key systems depend.; Shor’s algorithm is\n- Shor’s algorithm -- RSA security: Shor's algorithm poses a threat to RSA security by making factorization easier.\n- Shor algorithm for integer factorization -- RSA encryption: Shor’s algorithm can efficiently decrypt RSA numbers.\n- quantum computing system -- Shor’s algorithm: Shor's algorithm poses a threat to quantum computing systems.\n- Shor’s algorithm -- Classical integer factorization algorithms: Breaks RSA, DSA, and DH by factoring large integers efficiently.\n- Shor’s algorithm -- quantum factoring algorithm: Shor's algorithm is an example of a quantum factoring algorithm.\n- quantum-resistant algorithms -- Shor’s algorithm: Quantum computers can compromise classical components by breaking quantum-resistant algorithms using Shor’s algorithm.; Quantum-resistant protocols protect information even if Shor’s algorithm is used to compromise a fir\n- quantum computer -- Shor’s algorithm: Quantum computers can efficiently solve problems using Shor’s algorithm.; Shor’s algorithm poses a threat from quantum computers.; Shor’s algorithm can be executed on quantum computers.; Investigated on several cloud-bas\n- Shor algorithm -- RSA encryption: Shor algorithm breaks RSA encryption by factoring large numbers.\n- PKI -- Shor’s algorithm: Quantum computers threaten this model by using Shor’s algorithm.", "passages": [{"source": "Practical Challenges in Executing Shor’s Algorithm", "page": 15, "text": "numbers that were demonstrated on much smaller quantum systems over two decades ago. Although many theoretical advances have improved quantum factoring algorithms in recent years, progress in practical quantum hardware remains comparatively limited. This indicates that concerns about Shor’s algorithm posing an immediate or near-term threat to currently deployed cryptographic systems are, at present, premature. Building quantum computing systems with on the order of a million physical qubits will require substantial advancements over the next 10 to 15 years, combining fundamental research with largescale engineering efforts. While many companies are exploring architectures that promise lower error rates and improved connectivity, the field still faces numerous technical hurdles. Within published roadmaps and milestones, these challenges are often not fully or openly acknowledged, making independent, evidence-based analysis crucial."}, {"source": "A Survey of Quantum Machine Learning - Foundations,Algorithms, Frameworks, Data and Applications", "page": 12, "text": "91:12 F. Rodríguez-Díaz et al. 4.1.3 Shor’s Factoring Algorithm. This is a quantum algorithm developed in 1994 by Peter Shor for finding the prime factors of an integer. It is one of the few quantum algorithms with significant potential applications and strong evidence of a superpolynomial speedup compared to the bestknown classical algorithms. However, factoring numbers of practical importance requires more qubits than will be available in the near future, and the correction of quantum errors adds further complexity. Shor also proposed algorithms for solving the discrete logarithm problem and the period-finding problem. Generally, “Shor’s algorithm” refers to the factoring algorithm, but it may also encompass any of these methods. On a quantum computer, Shor’s algorithm can factor a number N in polynomial time, specifically 𝜃((𝑙𝑜𝑔𝑁)2(𝑙𝑜𝑔(𝑙𝑜𝑔𝑁))(𝑙𝑜𝑔(𝑙𝑜𝑔(𝑙𝑜𝑔𝑁)))) with fast multiplication, or even 𝜃((𝑙𝑜𝑔𝑁)2(𝑙𝑜𝑔(𝑙𝑜𝑔𝑁))"}, {"source": "Next-Generation Quantum Security - The Impact of Quantum Computing on Cybersecurity—Threats, Mitigations, and Solutions", "page": 7, "text": "rapid performance on particular problems, although they currently support only a limited number of solvable problems, such as  unstructured searches and integer factorization, which threaten current cryptographic solutions. The Shor and Grover quantum  algorithms can break RSA and AES encryption, highlighting the need to develop quantum-proof cryptographic approaches due to  this vulnerability [55]. In addition, in Table 4, we provide a detailed comparison between classical and quantum computing across various parameters,  highlighting their fundamental differences. Classical computing operates on deterministic bits and relies on sequential logic, while  quantum computing utilizes qubits, enabling superposition and entanglement for parallel processing. The discussion centers on  quantum computing’s advantage of significantly accelerated problem-solving capabilities, which result from using Shor’s and"}, {"source": "Next-Generation Quantum Security - The Impact of Quantum Computing on Cybersecurity—Threats, Mitigations, and Solutions", "page": 7, "text": "quantum computing’s advantage of significantly accelerated problem-solving capabilities, which result from using Shor’s and  Grover’s algorithms. A comprehensive assessment of hardware demands, together with error correction methods is provided, along  with an overview of vulnerabilities that quantum systems pose to classical encryption methods like RSA and AES, as presented in  the table. The analysis includes a discussion of scalability difficulties, noise levels, and gate fidelity problems that affect quantum  systems. Computers and Electrical Engineering 128 (2025) 110649  7"}], "claims": ["Shor's algorithm leverages quantum mechanics principles such as superposition.", "Shor's algorithm leverages quantum mechanics principles such as entanglement.", "Shor's algorithm can perform complex calculations in parallel.", "RSA's security relies on the computational difficulty of factoring large integers.", "Classical computers find it infeasible to factor large integers for sufficiently large numbers.", "Shor's algorithm can factor large integers in polynomial time on a quantum computer.", "Shor's algorithm compromises RSA's security."]}, {"code": "A100", "question": "What method does AutoPen employ to obtain more relevant and accurate responses from the LLM?", "reference": "AutoPen employs techniques such as Retrieval-Augmented Generation (RAG), chain-of-thought reasoning, and structured output to obtain more relevant and accurate responses from the LLM.", "answer": "AutoPen employs techniques such as Retrieval-Augmented Generation (RAG), chain-of-thought reasoning, and structured output to obtain more relevant and accurate responses from the LLM.", "kg": null, "passages": [{"source": "AutoPen - Towards Autonomous Penetration Testing Using LLM-Powered Agents", "page": 5, "text": "AutoPen: Towards Autonomous Penetration Testing Using LLM-Powered Agents CSAE 2025, October 19–21, 2025, Shanghai, China additional dedicated error-correction module could itself malfunction, potentially leading to an infinite loop of error correction. To minimize the possibility of the IA producing erroneous results on critical issues, we integrated the Multi-Agent approach directly into its reflection process to enhance reliability. Specifically, we initiate a separate LLM session dedicated to “prompt variation.\" This session mutates the original input prompt into multiple versions that are semantically equivalent but phrased differently. These varied prompts are then dispatched simultaneously to multiple independent sessions. The final response is derived by synthesizing the answers from all these sessions. This method of generating and consolidating diverse responses helps to average out inconsistencies and mitigate the impact of hallucinations from any single LLM instance."}, {"source": "AutoPen - Towards Autonomous Penetration Testing Using LLM-Powered Agents", "page": 1, "text": "propose AutoPen, a method designed to autonomously conduct penetration testing without human intervention. AutoPen employs techniques such as Retrieval-Augmented Generation (RAG), chainof-thought reasoning, and structured output to obtain more relevant and accurate responses from the LLM. Furthermore, it incorporates a carefully designed penetration testing workflow with task decomposition and specialized agents to ensure efficient and autonomous operation. We conducted penetration testing experiments on various vulnerable hosts from VulnHub. The results demonstrate that AutoPen performs automated penetration testing with high stability and exhibits significantly superior capability compared to open-source methods and other approaches described in related literature. CCS Concepts • Computing methodologies →Multi-agent systems; • Security and privacy →Penetration testing; • Networks →Network security. Keywords Large language models, LLM, RAG, LLM agent, penetration testing"}, {"source": "AutoPen - Towards Autonomous Penetration Testing Using LLM-Powered Agents", "page": 2, "text": "to successfully complete tests—we employ techniques including Retrieval-Augmented Generation , chain-of-thought reasoning, and structured output to enhance the LLMs’ generative performance. We also propose a multi-agent integration approach to mitigate generation errors, ensuring in-depth testing of the target host can be conducted. • We implemented the proposed method and constructed a specific experimental environment to validate its effectiveness. The results demonstrate that AutoPen can effectively complete penetration testing tasks with high stability, exhibiting superior performance compared to similar methods. 2 METHODOLOGY 2.1 System Overview Given the limited context window of large language models, prolonged operation would lead to the loss of early-stage information, making it infeasible to complete the entire penetration testing process within a single session. Adopting a role-based agent design approach, we established three distinct modules within the large"}, {"source": "AutoPen - Towards Autonomous Penetration Testing Using LLM-Powered Agents", "page": 3, "text": "AutoPen: Towards Autonomous Penetration Testing Using LLM-Powered Agents CSAE 2025, October 19–21, 2025, Shanghai, China Figure 1: Overview of the proposed AutoPen. to the agents throughout the system workflow. These instructions include detailed descriptions of the task and role, alongside bypassing the safety policies. For each specific task, the chain-of-thought technique is employed to guide the large language model in following logical steps to solve problems, significantly enhancing its reasoning capability for complex tasks. For particular tasks, structured output techniques are utilized by specifying the output format and providing comprehensive examples, directing the model to generate outputs in a fixed schema. This ensures seamless integration with subsequent tasks and execution. These precise instructions collectively help mitigate hallucinations in the large language model. 2.3 Vulnerability Analysis Upon receiving the target system information provided by the IA,"}], "claims": ["AutoPen employs Retrieval-Augmented Generation (RAG) to obtain more relevant and accurate responses from the LLM.", "AutoPen employs chain-of-thought reasoning to obtain more relevant and accurate responses from the LLM.", "AutoPen employs structured output to obtain more relevant and accurate responses from the LLM."]}]}</script>

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [a, v] of Object.entries(attrs)) {
    if (a === "class") e.className = v; else if (a.startsWith("on")) e.addEventListener(a.slice(2), v); else e.setAttribute(a, v);

const STOP = new Set(("a an the and or but if then than that this these those there their they them it its is are was " +

const norm = w => w.toLowerCase().replace(/[’']s$/, "").replace(/(?<=[a-z]{3})(es|s)$/, "");

  let last = 0;
  for (const m of text.matchAll(/[A-Za-z0-9][A-Za-z0-9\-]*[A-Za-z0-9]|[A-Za-z0-9]/g)) {
    if (!wanted.has(norm(m[0]))) continue;
    out.push(text.slice(last, m.index), el("mark", {}, m[0]));
    last = m.index + m[0].length;
  }
  out.push(text.slice(last));
  return out;
}
function chips(label, entries) {  // entries: [{text, hit, where}]
  return el("div", {class: "terms"}, el("b", {}, label),
    ...entries.map(e => el("span", {class: "chip " + (e.hit ? "hit" : "miss"), title: e.hit ? "có" : "không thấy"},
      e.text, ...(e.where ? [el("small", {}, e.where)] : []))));
}

function chipsVsReference(c) {  // từ khoá của ground truth: có / thiếu trong câu trả lời
  const at = terms(c.answer);
  const entries = [...terms(c.reference)].map(([n, w]) => ({text: w, hit: at.has(n)})).sort((a, b) => b.hit - a.hit);
  return chips(`Từ của ground truth có trong câu trả lời (${entries.filter(e => e.hit).length}/${entries.length}; ` +
               "thiếu thì gạch ngang):", entries);
}

function caseStatus(code) {
  const its = items.filter(i => i.code === code);
  const done = its.filter(i => state.labels[k(i.code, i.kind, i.index)] !== undefined).length;
  return done === its.length ? "done" : done ? "partial" : "";
}
function progress() {
  const done = items.filter(i => state.labels[k(i.code, i.kind, i.index)] !== undefined).length;
  document.getElementById("bar").style.width = (100 * done / items.length) + "%";
  document.getElementById("ptext").textContent =
    `${done}/${items.length} ô · ${DATA.cases.filter(c => caseStatus(c.code) === "done").length}/${DATA.cases.length} câu trả lời xong`;
  return done;
}
function renderNav() {
  const ol = document.getElementById("nav"); ol.replaceChildren();
  DATA.cases.forEach((c, i) => ol.append(el("li", {}, el("button", {
    class: [caseStatus(c.code), i === state.current ? "current" : ""].join(" "),
    "aria-current": i === state.current ? "true" : "false", onclick: () => go(i)}, c.code))));
}

function labelRow(code, kind, index, question, opts = [[1, "Có (1)", "y"], [0, "Không (0)", "n"]]) {
  const key = k(code, kind, index), v = state.labels[key];
  const box = el("div", {class: "label" + (v !== undefined ? " set" : "")});
  const mk = (val, txt, cls) => el("button", {class: cls, "aria-pressed": String(v === val), onclick: () => {
    state.labels[key] = val; save(); refresh(false); }}, txt);
  const note = el("input", {type: "text", placeholder: "Ghi chú (không bắt buộc)", value: state.notes[key] || ""});
  note.addEventListener("change", () => { state.notes[key] = note.value; save(); });
  box.append(el("span", {class: "q"}, question), ...opts.map(o => mk(...o)), note);
  return box;
}

function renderCase() {
  const c = DATA.cases[state.current], root = document.getElementById("case");
  const scrollY = window.scrollY;
  root.replaceChildren(
    el("div", {class: "card"}, el("div", {class: "qhead"}, el("h2", {}, c.code),
      el("span", {class: "hint"}, `Câu trả lời ${state.current + 1}/${DATA.cases.length}`))),
    el("div", {class: "card"}, el("h2", {}, "Câu hỏi"), el("p", {}, c.question)),
    el("div", {class: "card"}, el("h2", {}, "Ground truth"), el("p", {}, c.reference)),
    el("div", {class: "card"}, el("h2", {}, "Câu trả lời cần chấm"), el("p", {}, ...highlight(c.answer, terms(c.reference))),
      chipsVsReference(c)));
  const ref = terms(c.reference);
  const ctx = [...(c.kg ? [["KG", c.kg]] : []), ...c.passages.map((p, i) => [`Đ${i + 1}`, p.text])];
  const ctxTerms = ctx.map(([name, t]) => [name, terms(t)]);
  if (c.kg) root.append(el("div", {class: "card kg"}, el("h2", {}, "Mô tả KG (là một phần của context)"),
    el("p", {}, ...highlight(c.kg, ref))));
  c.passages.forEach((p, i) => {
    const pt = terms(p.text);
    const entries = [...ref].map(([n, w]) => ({text: w, hit: pt.has(n)}));
    root.append(el("div", {class: "card passage"},
      el("h2", {}, `Đoạn ${i + 1}`), el("div", {class: "src"}, `${p.source} · trang ${p.page}`),
      el("p", {}, ...highlight(p.text, ref)),
      chips(`Từ của ground truth có trong đoạn (${entries.filter(e => e.hit).length}/${entries.length}):`,
            entries.sort((a, b) => b.hit - a.hit)),
      ...(USEFUL ? [labelRow(c.code, "useful", i, `Đoạn ${i + 1} có giúp suy ra ground truth không?`)] : [])));
  });
  const claims = el("div", {class: "card"}, el("h2", {},
    c.claims.length ? "Các claim của câu trả lời: có được context hỗ trợ không?" : "Các claim của câu trả lời"));
  if (!c.claims.length) claims.append(el("p", {class: "hint"}, "Câu trả lời refuse: không có ý nào cần chấm."));
  c.claims.forEach((cl, j) => {
    const entries = [...terms(cl)].map(([n, w]) => {
      const where = ctxTerms.filter(([, t]) => t.has(n)).map(([name]) => name);
      return {text: w, hit: where.length > 0, where: where.join(" ")};
    });
    const miss = entries.filter(e => !e.hit).length;
    claims.append(el("div", {class: "claim"}, el("p", {}, `Ý ${j + 1}. ${cl}`),
      chips(miss ? `Từ của ý trong context (${miss} từ không thấy, gạch ngang):` : "Từ của ý trong context (đều có):",
            entries.sort((a, b) => a.hit - b.hit)),
      labelRow(c.code, "claim", j, `Ý ${j + 1} được context (mô tả KG nếu có + các đoạn) hỗ trợ?`, CLAIM_OPTS)));
  });
  root.append(claims, el("div", {class: "card"}, el("h2", {}, "Đánh giá chung: câu trả lời có đúng so với ground truth?"),
    el("div", {class: "compare"},
      el("div", {}, el("div", {class: "src"}, "Ground truth"), el("p", {}, c.reference)),
      el("div", {}, el("div", {class: "src"}, "Câu trả lời"), el("p", {}, ...highlight(c.answer, terms(c.reference))))),
    chipsVsReference(c),
    el("p", {class: "hint"}, "Có nếu câu trả lời nêu được các ý chính của ground truth và không mâu thuẫn với nó (thêm "
      + "thông tin khác vẫn được); thiếu ý chính hoặc nói ngược lại = Không. Không cần đọc bài báo, chỉ so hai khung trên."),
    labelRow(c.code, "correct", 0, "Câu trả lời đúng so với ground truth? (refuse = 0)")));
  window.scrollTo(0, scrollY);
}
function refresh(full = true) { renderNav(); progress(); if (full) renderCase(); else renderCase(); }
function go(i) { state.current = Math.max(0, Math.min(DATA.cases.length - 1, i)); save(); renderNav(); renderCase(); window.scrollTo(0, 0); }

const hlBtn = document.getElementById("hl");
function setHl(on) {
  state.hl = on; save();
  document.body.classList.toggle("nohl", !on);
  hlBtn.setAttribute("aria-pressed", String(on));
  hlBtn.textContent = "Tô sáng từ khớp: " + (on ? "bật" : "tắt");
}
hlBtn.onclick = () => setHl(!state.hl);
setHl(state.hl !== false);
document.getElementById("prev").onclick = () => go(state.current - 1);
document.getElementById("next").onclick = () => go(state.current + 1);
document.getElementById("next-todo").onclick = () => {
  const n = DATA.cases.length;
  for (let s = 1; s <= n; s++) { const i = (state.current + s) % n; if (caseStatus(DATA.cases[i].code) !== "done") return go(i); }
  if (caseStatus(DATA.cases[state.current].code) !== "done") return go(state.current);
  toast("Đã chấm xong toàn bộ, hãy bấm Xuất JSON.");
};
document.getElementById("export").onclick = () => {
  const labels = items.map(i => ({...i, label: state.labels[k(i.code, i.kind, i.index)] ?? null,
                                  note: state.notes[k(i.code, i.kind, i.index)] || ""}));
  const done = labels.filter(l => l.label !== null).length;
  if (done < labels.length && !confirm(`Còn ${labels.length - done} ô chưa chấm. Vẫn xuất (để lưu tạm)?`)) return;
  const out = {sheet_id: DATA.sheet_id, exported_at: new Date().toISOString(), n_total: labels.length, n_done: done, labels};
  const a = el("a", {href: URL.createObjectURL(new Blob([JSON.stringify(out, null, 1)], {type: "application/json"})),
                     download: "human_labels.json"});
  document.body.append(a); a.click(); a.remove();
  toast(`Đã xuất ${done}/${labels.length} ô vào human_labels.json`);
};
document.getElementById("import").onchange = async (ev) => {
  const f = ev.target.files[0]; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (d.sheet_id !== DATA.sheet_id) { toast("File JSON không khớp phiếu này (sheet_id khác)."); return; }
    for (const l of d.labels) { const key = k(l.code, l.kind, l.index);
      if (l.label === 0 || l.label === 1 || l.label === 2) state.labels[key] = l.label; if (l.note) state.notes[key] = l.note; }
    save(); refresh(); toast(`Đã nhập ${d.labels.filter(l => l.label !== null).length} ô.`);
  } catch (e) { toast("Không đọc được file JSON."); }
  ev.target.value = "";
};
document.getElementById("guide-list").append(...DATA.guide.flatMap(([t, d]) => [el("dt", {}, t), el("dd", {}, d)]));
if (!Object.keys(state.labels).length) document.getElementById("guide").open = true;
refresh();
</script>
</body>
