c values belong to a good pair?", "reference": "Each good (c, d) pair is generated with probability at least 1/(20q²), and at least a twelfth of the possible c's are in a good (c, d) pair.", "answer": "Each good (c, d) pair is generated with a probability of at least 1/(20q2). At least a twelfth of the possible c’s are in a good (c, d) pair.", "kg": "Knowledge graph entities:\n- good (c, d) pair (CONCEPT): Pair generated with probability at least 1/(20q2).\n- discrete logarithm (CONCEPT): Algorithm used in ECC-P256 that is broken by Shor.; Mathematical problem intractable for classical computers.; Computation of discrete logarithms on a quantum computer.; Related math problem that modern cryptography reli\n- quantum algorithm (ALGORITHM): Quantum algorithms in machine learning.; Key focus in the survey, applied in various fields.; Algorithm that exploits quantum mechanics to solve problems more efficiently than classical algorithms.; The complexity of the\n- probability (METRIC): Probability that a qubit is either one or zero, defined as|⟨0|𝜓⟩|2 for X=0 and|⟨1|𝜓⟩|2 for X=1.; Can be affected by noise such that their sum does not equal exactly 1.; Probability that we observe a state is proportional\n- finding discrete logarithms (ALGORITHM): Eﬃcient randomized algorithms are given for these two problems on a hypothetical quantum computer.\n- Shor’s quantum algorithm for integer factorization of N (Shor(N)) (ALGORITHM): Quantum algorithm for integer factorization of N.\n- Polynomial-Time Algorithms for Prime Factorization and Discrete Logarithms on a Quantum Computer (ALGORITHM): Algorithm that can find discrete logarithms over fields like Zpα.\n- fraction (CONCEPT): used to approximate c/q.; Close fraction to d/r.; Fraction qd/r that the numbers close to c might approximate.\n\nKnowledge graph relations:\n- discrete logarithm -- superposition of 0 and 1, can exist in multiple states: Quantum computers can solve discrete logarithms faster.\n- algorithm for factoring -- good (c, d) pair: Each good (c, d) pair is generated with probability at least 1/(20q2).\n- Shor’s quantum algorithm for integer factorization of N (Shor(N)) -- SLH-DSA: Shor(N) threatens SLH-DSA.\n- Shor’s algorithm -- Cryptographically Relevant Quantum Computers: Shor's algorithm demonstrates that a CRQC can efficiently solve integer factorization and discrete logarithms.; A CRQC can efficiently solve the problems on which classical public-key systems depend.; Shor’s algorithm is\n- Shor’s algorithm -- quantum state: Shor’s algorithm employs quantum states.\n- quantum computation -- discrete logarithm: Quantum computation aims to solve discrete logarithm.; Quantum computation can solve discrete logarithms.\n- Shor’s quantum algorithm for integer factorization of N (Shor(N)) -- Module-Lattice-Based Digital Signature Algorithm: Shor(N) threatens ML-DSA.\n- discrete logarithm -- quantum order-finding algorithm: Discrete logarithm algorithm generalizes the order-finding algorithm.\n- Shor’s algorithm -- discrete logarithm: Shor's Algorithm breaks Discrete Logarithm.; Shor's algorithm solves discrete logarithm.\n- quantum algorithm -- Shor’s algorithm: Shor’s algorithm is a type of quantum algorithm.; Quantum algorithms fundamentally break the security assumption.; Shor’s algorithm is a quantum algorithm.\n- good (c, d) pair -- c/q: Good c’s are mapped from c/q to c′/(p −1) by rounding.\n- Polynomial-Time Algorithms -- finding discrete logarithms: Eﬃcient randomized algorithms are given for these two problems on a hypothetical quantum computer.", "passages": [{"source": "Polynomial-Time Algorithms for Prime Factorization and Discrete Logarithms on a Quantum Computer", "page": 23, "text": "FACTORING WITH A QUANTUM COMPUTER 23 algorithm for factoring. If we knew the remainder of r modulo all prime powers dividing p −1, we could use the Chinese remainder theorem to recover r in polynomial time. We will only be able to prove that we can ﬁnd this remainder for primes larger than 18, but with a little extra work we will still be able to recover r. Recall that each good (c, d) pair is generated with probability at least 1/(20q2), and that at least a twelfth of the possible c’s are in a good (c, d) pair. From equation (6.19), it follows that these c’s are mapped from c/q to c′/(p −1) by rounding to the nearest integral multiple of 1/(p −1). Further, the good c’s are exactly those in which c/q is close to c′/(p −1). Thus, each good c corresponds with exactly one c′. We would like to show that for any prime power pαi i dividing p −1, a random good c′ is unlikely to contain pi. If we are willing to accept a large constant for our algorithm, we can just"}, {"source": "Polynomial-Time Algorithms for Prime Factorization and Discrete Logarithms on a Quantum Computer", "page": 19, "text": "quantum computation and more postprocessing. First, if the observed state is |c⟩, it would be wise to also try numbers close to c such as c ± 1, c ± 2, . . ., since these also have a reasonable chance of being close to a fraction qd/r. Second, if c/q ≈d/r, and d and r have a common factor, it is likely to be small. Thus, if the observed value of c/q is rounded oﬀto d′/r′ in lowest terms, for a candidate r one should consider not only r′ but also its small multiples 2r′, 3r′, . . . , to see if these are the actual order of x. Although the ﬁrst technique will only reduce the expected number of trials required to ﬁnd r by a constant factor, the second technique will reduce the expected number of trials for the hardest n from O(log log n) to O(1) if the ﬁrst (log n)1+ǫ multiples of r′ are considered [Odylzko 1995]. A third technique is, if two candidate r’s have been found, say r1 and r2, to test the least common multiple of r1 and r2 as a candidate r. This third"}, {"source": "Next-Generation Quantum Security - The Impact of Quantum Computing on Cybersecurity—Threats, Mitigations, and Solutions", "page": 7, "text": "quantum algorithms possible because it enables the creation of highly parallelized quantum states that solve complex problems  faster than traditional computers [45]. It is through entanglement that Shor’s algorithm employs quantum parallelism to rapidly  factor large integers, since classical computers would require impractical amounts of time [46]. 3.1.2. Why quantum systems can break classical encryption? Quantum computers obtain their exceptional computational speed through their ability to handle superposition and interference  phenomena, among other processes [47]. The treatment involves breaking the RSA and ECC encryption protocols, despite their basis  on number-theoretic problems that classical computers find difficult [48]. Shor algorithm and RSA: RSA encryption bases its functionality on the ability to factor large numbers into their prime factors,"}, {"source": "harvest-now-decrypt-later-pqc-threat-model", "page": 64, "text": "Appendix Mathematical Notation Notation Definition Ld Data confidentiality lifetime; the duration for which encrypted data must remain confidential from time of encryption until obsolescence or regulatory expiration Ha Attacker decryption horizon; the estimated calendar date at which adversaries obtain practical capability to decrypt classical public-key cryptography T_qday “Q-Day”; the estimated date at which cryptographically-relevant quantum computers become operationally feasible P(X) Probability of event X RSA-n RSA public-key encryption using an n-bit modulus (e.g., RSA-2048) ECC-p Elliptic curve cryptography defined over a finite field of size p bits Shor(N) Shor’s quantum algorithm for integer factorization of N Grover(f) Grover’s quantum search algorithm for preimage search of function f ML-KEM Module-Lattice-Based Key-Encapsulation Mechanism (NIST FIPS 203) ML-DSA Module-Lattice-Based Digital Signature Algorithm (NIST FIPS 204) SLH-DSA"}], "claims": ["Each good (c, d) pair is generated with a probability of at least 1/(20q2).", "At least a twelfth of the possible c’s are in a good (c, d) pair."]}, {"code": "A070", "question": "Why are FPGAs considered an ideal platform for SNN hardware accelerators, and what is the key challenge?", "reference": "FPGAs offer flexible hardware reconfigurability and parallel computing, with low latency, high efficiency and good power control; the key challenge is their limited resources, which makes balancing inference speed, power consumption and accuracy difficult.", "answer": "FPGAs are considered an ideal platform for SNN hardware accelerators due to their flexible hardware reconfigurability and parallel computing capabilities. The key challenge is balancing inference speed, power consumption, and model accuracy with the limited resources of FPGAs.", "kg": null, "passages": [{"source": "Hardware implementation of FPGA-based spiking attention neural network accelerator", "page": 3, "text": "Field programmable gate arrays (FPGAs) represent an ideal platform for implementing SNN hardware accelerators (Han et al., 2020) due to their ﬂexible hardware reconﬁgurability and parallel computing capabilities (Brown et al., 2012; Kulkarni et al., 2019; Bhattacharjee et al., 2024). FPGAs offer numerous advantages in neural network acceleration, including low latency, high efﬁciency, and effective power consumption control. However, FPGAs have limited resources, and balancing inference speed, power consumption, and model accuracy with these constraints remains a key challenge. While GPU architectures demonstrate limitations in harnessing the intrinsic sparsity of SNNs during training phases (Cong et al., 2018), their fundamental mismatch with temporal accumulation-dominant computations further restricts efﬁcient implementation. Recent advances in neuromorphic computing have yielded specialized ASIC solutions"}, {"source": "Hardware implementation of FPGA-based spiking attention neural network accelerator", "page": 5, "text": "work addresses these challenges. Several research teams have made signiﬁcant progress in implementing SNN hardware accelerators on FPGAs, but existing approaches face critical limitations that our work speciﬁcally addresses. Khodamoradi, Denolf & Kastner (2021) proposed an FPGA-based accelerator design for SNNs, which employs a spiking accumulation mechanism to reduce redundant transmission of spiking data and optimizes inference speed through resource reuse and hardware pipelining techniques. While this approach achieves high inference speed in low-power environments, it suffers from limited network accuracy improvement and lacks sophisticated feature selection mechanisms. Our SeaSNN addresses this limitation by introducing the SECA mechanism, which enhances accuracy while maintaining the energy efﬁciency advantages of spike accumulation. Similarly, Liu, Yenamachintala & Li (2019) designed a sparsiﬁed storage and"}, {"source": "Hardware implementation of FPGA-based spiking attention neural network accelerator", "page": 19, "text": "performance and energy consumption. Table 4 compares several SNN accelerators proposed in recent years. The results indicate that the proposed SeaSNN accelerator is highly competitive among FPGA-based accelerators. Notably, the accelerator demonstrates signiﬁcant advantages in terms of throughput and power consumption compared to ASIC-based solutions. Speciﬁcally, the proposed design is thousands of times more efﬁcient in power consumption and performance than other designs. These results highlight the superiority of the SeaSNN accelerator in both performance and resource utilization. CONCLUSION This article presents a low-power, high-precision FPGA-based system for accelerating spiking neural networks (SNNs) in handwritten digit recognition tasks. To mitigate accuracy degradation due to hardware constraints in existing SNN accelerators, a simple and efﬁcient four-layer network, “SeaSNN,” is proposed, incorporating a pulse channel"}, {"source": "Hardware implementation of FPGA-based spiking attention neural network accelerator", "page": 5, "text": "attention in many ﬁelds due to their bio-inspired and low-power characteristics, especially in applications such as the Internet of Things (IoT) (Huh, Cho & Kim, 2017), embedded systems (Kaelbling, 1993), and edge computing (Shi et al., 2016). SNNs achieve more energy-efﬁcient information processing mechanisms by mimicking the impulsive communication of biological neurons, and thus have an advantage over traditional CNNs (O’Shea, 2015). However, hardware implementations of SNNs face a number of challenges, particularly how to optimize accelerator performance while balancing inference speed, accuracy and hardware power consumption (Maguire et al., 2007). This section reviews important recent work on FPGA-based SNN accelerators, attention mechanisms in SNNs, and hardware optimization strategies, speciﬁcally analyzing their limitations and how our work addresses these challenges. Several research teams have made signiﬁcant progress in implementing SNN hardware"}], "claims": ["FPGAs are considered an ideal platform for SNN hardware accelerators.", "FPGAs have flexible hardware reconfigurability.", "FPGAs have parallel computing capabilities.", "The key challenge is balancing inference speed, power consumption, and model accuracy.", "FPGAs have limited resources."]}, {"code": "A071", "question": "In ML-empowered eBPF/XDP packet processing for intrusion detection, how much do integer-arithmetic-only NN and decision tree classifiers in kernel space reduce inference time compared with floating-point versions in user space?", "reference": "The integer-only NN reduces inference time to 15.3% and the DT to 1.6% of the floating-point user-space versions, with little degradation in classification performance.", "answer": "The integer-arithmetic-only NN classifier in the kernel space reduces inference time to 13.8% of the floating-point version in user space, while the decision tree (DT) classifier reduces it to 1.7%.", "kg": null, "passages": [{"source": "On_Practicality_of_Kernel_Packet_Processing_Empowered_by_Lightweight_Neural_Network_and_Decision_Tree", "page": 9, "text": "ﬂow-based intrusion detection system (IDS). As for the kernel packet processing, we have focused on extended Berkeley Packet Filter (eBPF) and eXpress Data Path (XDP). Inspired by the existing decision tree (DT) empowered eBPF program, we have newly proposed a lightweight neural network (NN) applicable to eBPF/XDP programs. More speciﬁcally, we have trained the NN with high accuracy and quantized the learned model to obtain the lightweight NN in the user space. We have further implemented the quantized ﬁxed point NN, so as to realize the fast packet processing with integer-arithmeticonly inference in the kernel space. Through the experiments for binary classiﬁcation and multiclass one, we have demonstrated that the integer-arithmeticonly lightweight NN and DT classiﬁers drastically reduce the inference time to 13.8% and 1.7% while suppressing the inference performance degradation compared with the ﬂoatingpoint ones in the user space, with the help of the ﬁxed-point"}, {"source": "On_Practicality_of_Kernel_Packet_Processing_Empowered_by_Lightweight_Neural_Network_and_Decision_Tree", "page": 1, "text": "the inference time to 15.3% (resp. 1.6%) while suppressing degradation of classiﬁcation performance, (2) the lightweight NN classiﬁer can improve the inference performance in case of multiclass classiﬁcation, and (3) the kernel-based method with NN (resp. DT) classiﬁer can process received packets in a real-time manner under a certain transmission rate, i.e., 300,000 pps (resp. 450,000 pps). Index Terms—Kernel packet processing, extended Berkeley Packet Filter (eBPF), eXpress Data Path (XDP), intrusion detection system (IDS), machine learning (ML), quantization, ﬁxedpoint neural network (NN). I. INTRODUCTION The extended Berkeley Packet Filter (eBPF) framework can control a Linux kernel through an arbitrary program [1]. This technology not only improves the observability of kernel logs but also enables faster packet processing on the kernel [2]. In eBPF-based networking, when a new packet arrives at a network interface, the eBPF can process it according to"}, {"source": "On_Practicality_of_Kernel_Packet_Processing_Empowered_by_Lightweight_Neural_Network_and_Decision_Tree", "page": 2, "text": "proportional to packet arrival rate). In this paper, we quantitatively reveal the potential of ML-empowered eBPF/XDP packet processing for IDS, in terms of packet processing speed, resource efﬁciency, and detection performance. Experimental results will show that (1) the integerarithmetic-only NN (resp. DT) classiﬁer running on the kernel space can reduce the inference time to 15.3% (resp. 1.6%) while suppressing degradation of classiﬁcation performance compared with the ﬂoating-point NN (resp. DT) running on the user space, and (2) the kernel-based method with NN (resp. DT) classiﬁer can process received packets in a realtime manner under a certain transmission rate, i.e., 300,000 pps (resp. 450,000 pps). 1 The rest of the manuscript is organized as follows. Section II gives the related work. In Section III, we introduce some preliminaries. In Section IV, we propose the NN-empowered eBPF for packet processing. Section V shows the fundamental"}, {"source": "On_Practicality_of_Kernel_Packet_Processing_Empowered_by_Lightweight_Neural_Network_and_Decision_Tree", "page": 1, "text": "evaluation of both packet processing and detection performance has not been conducted sufﬁciently. In addition, to ensure the kernel stability and safety, the eBPF program must process packets under strict constraints such as prohibition of ﬂoatingpoint number, which is usually used in neural networks (NNs). In this paper, we examine the possibility of NN-empowered eBPF/XDP based packet processing. More speciﬁcally, we ﬁrst train a ﬂoating-point NN and quantize it as a ﬁxed-point NN using 8-bit integers in the user space. Then, we implement the lightweight NN in the eBPF/XDP program to achieve fast packet processing with integer-arithmetic-only inference in the kernel space. Experimental results show that (1) the integerarithmetic-only NN (resp. DT) classiﬁer can drastically reduce the inference time to 15.3% (resp. 1.6%) while suppressing degradation of classiﬁcation performance, (2) the lightweight NN"}], "claims": ["The integer-arithmetic-only NN classifier in the kernel space reduces inference time to 13.8% of the floating-point version in user space.", "The decision tree (DT) classifier in the kernel space reduces inference time to 1.7% of the floating-point version in user space."]}, {"code": "A072", "question": "In differentiable plasticity, how is a synapse's weight composed, and which parts are meta-learned?", "reference": "The weight is w = w_BP + zeta * w_H, the sum of a backprop part and a Hebbian part scaled by a weighting factor zeta; the backprop part and the weighting constant are meta-learned.", "answer": "In differentiable plasticity, a synapse's weight is composed of two parts: the backprop part (𝑤𝐵𝑃) and the Hebbian part (𝑤𝐻). The weighting factor (𝜁) determines their balance. The backprop part and the weighting constant are meta-learned to exploit general information from the Hebbian part for specific tasks.", "kg": null, "passages": [{"source": "Spiking neural networks and bio-inspired supervised deep learning - A survey", "page": 22, "text": "22 Lagani, et al. weight. A weighting factor also determines the balance between the two contributions. The weight on a differentiable plasticity-based synapse can be written as: 𝑤= 𝑤𝐵𝑃+ 𝜁𝑤𝐻 (27) where 𝑤𝐵𝑃is the backprop part of the weight, 𝑤𝐻is the Hebbian part, and 𝜁is the weighting factor. The backprop part and the weighting constant are meta-learned, so that they learn to exploit the general information extracted from the Hebbian part for the specific task. The vanilla Hebbian plasticity model is used in this case, but still, the experimental analysis showed promising results on metalearning benchmarks. A related approach proposes Hebbian fast weights [145] in a melalearning context, i.e. Hebbian learning in the inner loop and backprop-based metalearning in the outer loop of the learning-to-learn process. Other researchers proposed to leverage the learning-to-learn paradigm"}, {"source": "The expressive leaky memory neuron - an efficient and expressive phenomenological neuron model can solve long-horizon tasks", "page": 4, "text": "the ws need to be learnable, as they are responsible for weighting the sum and cannot be absorbed in the MLP later. Despite the biological inspiration, the MLP and synapses are only intended to capture the neuron analogous plasticity and dendritic nonlinearity, and cannot give a mechanistic explanation of these phenomena in neuron. Finally, incorporating previous memory units mt−1 into the integration process, the ELM can accommodate state-dependent synaptic integration and related computations Hodgkin & Huxley (1952); Gasparini & Magee (2006); Bicknell & Häusser (2021), and enables the relationships among memory units m to be fully learnable. The range of the m values is controlled by λ, and the mixing of the proposal values by the parameter km (for details on parameters see Appendix Section A). Crucially, our approach sidesteps the need for expert-designed and pre-determined differential equations typical in phenomenological neuron modeling. The output dynamics."}, {"source": "Spiking neural networks and bio-inspired supervised deep learning - A survey", "page": 4, "text": "4 Lagani, et al. 3 BIOLOGICAL NEURONS AND SYNAPTIC PLASTICITY This Section is devoted to introducing the fundamental aspects of neuron biology, and the mechanisms of synaptic plasticity underlying the learning behavior of biological brains. From this it will be possible to draw relationships between the computational learning mechanisms that we are going to discuss in the following, and the biological substrate that supports such mechanisms. In the following, we start with an introduction on neural cell biology in subsection 3.1, then we move to synaptic plasticity models based on the Hebbian principle in subsection 3.2, highlighting the relationships between such models and emerging unsupervised pattern discovery mechanisms (such as clustering and subspace learning). 3.1 Background on Neural Cells Neural cells are characterized by a central body, the soma, which receives electric input stimuli through ramified"}, {"source": "Synaptic plasticity models and bio-inspired unsupervised deep learning - A survey", "page": 4, "text": "3 SYNAPTIC PLASTICITY MODELS AND HEBBIAN LEARNING IN A SINGLE NEURON Throughout life, our brain is continually subject to modifications in order to incorporate knowledge from the environment and adapt to new tasks. This adaptation process is referred to as plasticity. The most prominent form of plasticity occurs in synapses, in the form of strengthening of synaptic efficacy, a.k.a. Long Term Potentiation (LTP), or weakening, a.k.a. Long Term Depression (LTD) [18, 79]. Given the crucial role that synaptic plasticity plays in neural systems, we begin this review by discussing synaptic plasticity models, starting from the simplest formulation of Hebbian plasticity, and then moving to more complex models that also recently found applications in DNN training. One of the challenges of formulating biologically plausible models of synaptic plasticity is the necessity to define local learning rules, i.e."}], "claims": ["A synapse's weight in differentiable plasticity is composed of two parts.", "The two parts are the backprop part (𝑤𝐵𝑃) and the Hebbian part (𝑤𝐻).", "The weighting factor (𝜁) determines the balance between the backprop part and the Hebbian part.", "The backprop part is meta-learned.", "The weighting constant is meta-learned.", "The backprop part and the weighting constant are meta-learned to exploit general information from the Hebbian part for specific tasks."]}, {"code": "A073", "question": "How does the O(1) LFU cache algorithm organize its data structures when the first element is inserted, and what is the insertion complexity?", "reference": "The cache starts as an empty hash map and an empty frequency list. On the first insertion, a hash map entry pointing to the new element is created and a frequency node with value 1 is added to the frequency list; the element's node points back to its frequency node. Insertion runs in O(1).", "answer": "When the first element is inserted into the O(1) LFU cache, it enters with a usage count of 1 and is placed in the appropriate position in the min heap based on this count. The insertion complexity is O(log n) due to the heap operation required to maintain the heap property.", "kg": null, "passages": [{"source": "An o(1) algorithm for implementing the lfu cache eviction scheme", "page": 3, "text": "eviction algorithm dectates) item from the cache 4 The currently best known complexity of the LFU algorithm As of this writing, the best known runtimes for each of the operations mentioned above for an LFU cache eviction strategy are as follows: • Insert: O(log n) • Lookup: O(log n) • Delete: O(log n) These complexity values folllow directly from the complexity of the binomial heap implementation and a standard collision free hash table. An LFU caching strategy can be easily and eﬃciently implemented using a min heap data structure and a hash map. The min heap is created based on the usage count (of the item) and the hash table is indexed via the element’s key. All operations on a collision free hash table are of order O(1), so the runtime of the LFU cache is governed by the runtime of operations on the min heap [[5, 6, 9, 1, 2]]. When an element is inserted into the cache, it enters with a usage count of 1 and since insertion into a min heap costs O(log n), inserts into the LFU cache"}, {"source": "An o(1) algorithm for implementing the lfu cache eviction scheme", "page": 1, "text": "LRU algorithm is is preferred over the LFU algorithm because of its lower run time complexity of O(1) versus O(log n). We present here an LFU cache eviction algorithm that has a runtime complexity of O(1) for all of its operations, which include insertion, access and deletion(eviction). 1 arXiv:2110.11602v1 [cs.DS] 22 Oct 2021"}, {"source": "An o(1) algorithm for implementing the lfu cache eviction scheme", "page": 3, "text": "1 and since insertion into a min heap costs O(log n), inserts into the LFU cache take O(log n) time [[3]]. When an element is looked up, it is found via a hashing function which hashes the key to the actual element. Simultaneously, the usage count (the count in the max heap) is incremented by one, which results in the reorganization of the min 3"}, {"source": "An o(1) algorithm for implementing the lfu cache eviction scheme", "page": 4, "text": "heap and the element moves away from the root. Since the element can move down up to log n levels at any stage, this operation too takes time O(log n). When an element is selected for eviction and then eventually removed from the heap, it can cause signiﬁcant reorganization of the heap data structure. The element with the least usage count is present at the root of the min heap. Deleting the root of the min heap involves replacing the root node with the last leaf node in the heap, and bubbling this node down to its correct position. This operation too has a runtime complexity of O(log n). 5 The proposed LFU algorithm The proposed LFU algorithm has a runtime complexity of O(1) for each of the dictionary operations (insertion, lookup and deletion) that can be performed on an LFU cache. This is achieved by maintaining 2 linked lists; one on the access frequency and one for all elements that have the same access frequency."}], "claims": ["The O(1) LFU cache algorithm uses a min heap to store its data.", "The min heap is ordered by the usage count of the elements.", "When the first element is inserted, it enters with a usage count of 1.", "The first element is placed in the appropriate position in the min heap based on its usage count.", "The insertion complexity of the O(1) LFU cache algorithm is O(log n) due to the heap operation required to maintain the heap property."]}, {"code": "A074", "question": "How does VulnBot represent the dependencies among penetration testing tasks?", "reference": "As a Penetration Task Graph: a directed graph where an edge from T1 to T2 means T2 depends on T1, and these dependencies determine task execution order; each task has an id, dependencies, an instruction and an action (e.g., Shell).", "answer": "VulnBot represents dependencies among penetration testing tasks through a Penetration Task Graph (PTG), which ensures logical task execution across the reconnaissance, scanning, and exploitation phases.", "kg": null, "passages": [{"source": "VulnBot - Autonomous Penetration Testing for A Multi-Agent Collaborative Framework", "page": 1, "text": "to simulate the collaborative workflow of human penetration testing teams through a multi-agent system. To address the inefficiencies and reliance on manual intervention in traditional penetration testing methods, VulnBot decomposes complex tasks into three specialized phases: reconnaissance, scanning, and exploitation. These phases are guided by a penetration task graph (PTG) to ensure logical task execution. Key design features include role specialization, penetration path planning, inter-agent communication, and generative penetration behavior. Experimental results demonstrate that VulnBot outperforms baseline models such as GPT-4 and Llama3 in automated penetration testing tasks, particularly showcasing its potential in fully autonomous testing on real-world machines. 1 Introduction Penetration testing is a critical methodology for proactively identifying network vulnerabilities and mitigating potential"}, {"source": "VulnBot - Autonomous Penetration Testing for A Multi-Agent Collaborative Framework", "page": 5, "text": "abled by the Generator and Executor modules (Section 3.5). 3.1 Overview The overall architecture of VulnBot is illustrated in Figure 2. VulnBot is an autonomous penetration testing framework designed to emulate the collaborative and strategic workflows of human penetration testing teams. The system is built around five core modules—Planner, Memory Retriever, Generator, Executor, and Summarizer—which collectively automate the three primary phases of penetration testing: Reconnaissance, Scanning, and Exploitation. This design addresses the complexities of automating penetration testing tasks while ensuring adaptability to unforeseen challenges, thereby maintaining robustness across diverse testing scenarios. 3.2 Specialization of Roles Drawing from Takeaways 1 and 4, we employ a specialization of roles mechanism. Clear role specialization is a cornerstone"}, {"source": "VulnBot - Autonomous Penetration Testing for A Multi-Agent Collaborative Framework", "page": 13, "text": "inefficiencies and manual dependencies inherent in traditional penetration testing methodologies. By decomposing complex tasks into specialized phases—reconnaissance, scanning, and exploitation—and utilizing a PTG to ensure logical task execution, VulnBot demonstrates significant advancements in automating penetration testing workflows. Our experimental results underscore VulnBot’s superior performance relative to baseline models such as GPT-4 and Llama3. Incorporating RAG further augments VulnBot’s capabilities, enabling it to execute end-to-end penetration tasks autonomously without human intervention. These findings highlight the potential of VulnBot to revolutionize the field of penetration testing by enhancing efficiency, scalability, and autonomy. 13"}, {"source": "VulnBot - Autonomous Penetration Testing for A Multi-Agent Collaborative Framework", "page": 1, "text": "methods predominantly depend on the GPT-4 model [2], making it challenging to execute complex tasks using open-source models. In this paper, we present VulnBot, an autonomous, multiagent penetration testing framework based on LLMs, designed to emulate the collaborative workflows of human penetration testing teams. By integrating specialized modules that focus on different phases of penetration testing, VulnBot aims to automate and streamline the process of identifying vulnerabilities in target systems. The framework incorporates distinct roles, such as reconnaissance, scanning, and exploitation, along with a Penetration Task Graph (PTG)-based approach 1 arXiv:2501.13411v1 [cs.SE] 23 Jan 2025"}], "claims": ["VulnBot represents dependencies among penetration testing tasks.", "VulnBot uses a Penetration Task Graph (PTG) to represent dependencies.", "The PTG ensures logical task execution.", "The PTG covers the reconnaissance phase.", "The PTG covers the scanning phase.", "The PTG covers the exploitation phase."]}, {"code": "A075", "question": "What problem with encoding classical data into quantum states does the data re-uploading strategy address, and what accuracy did a hybrid model with quantum-enhanced embeddings achieve for botnet detection?", "reference": "Amplitude encoding requires a prohibitively large number of qubits, while simpler angle encoding may give insufficient representational capacity; the data re-uploading strategy demonstrated by Pérez-Salinas et al. significantly improves data representation within quantum circuits. A hybrid model that mapped classical features into quantum states with quantum embeddings achieved up to 94.7% accuracy for botnet detection, significantly outperforming classical baselines.", "answer": "The data re-uploading strategy addresses optimization issues in encoding classical data into quantum states. A hybrid model with quantum-enhanced embeddings achieved up to 94.7% accuracy in botnet detection.", "kg": "Knowledge graph entities:\n- hybrid model (SYSTEM): Can be broadly categorized based on the direction and depth of information flow between quantum and classical components.; Achieved up to 94.7% accuracy in botnet detection.; Models that combine classical and quantum tec\n- botnet detection (CONCEPT): Effective application of quantum-enhanced embeddings and circuit designs.\n- quantum-enhanced embeddings (CONCEPT): Enabled mapping of classical features into quantum state representations.\n- data re-uploading (ALGORITHM): Optimization method that improved runtime efficiency.; Possible solution to optimisation issues.; Solution that introduces additional computation.; Different way of embedding classical data into quantum states.\n- quantum state (CONCEPT): State prepared by the quantum generator or observed by the quantum discriminator.; State used to encode probability distributions.; A state represented by a quantum circuit.; Unknown quantum state to be learned by HQuGAN\n- state (CONCEPT): Quantum state resulting from the transformation of classical features.; Current state in reinforcement learning.; Entities with ties to certain criminal organizations.; CONCEPT|Quantum state to be teleported, represented\n- data re-uploading strategy (ALGORITHM): Recent advance that shows significant improvements in data representation.\n- accuracy (METRIC): QSVM achieved 94.67% accuracy in detecting anomalies.; The QGAN framework achieved an accuracy of 0.937.; Performance metric for classifier evaluation.; Training objectives should target accuracy.; Precision in decision-\n\nKnowledge graph relations:\n- quantum-enhanced embeddings -- hybrid model: Enabled the hybrid model to achieve high accuracy.\n- botnet -- instantaneous quantum polynomial (IQP) embeddings: Botnets are difficult to identify using quantum feature encoding techniques.\n- data re-uploading -- variational classiﬁcation: Different ways of embedding classical data into quantum states.\n- data re-uploading strategy -- quantum circuit: Data re-uploading strategy shows improvements in quantum circuits.\n- data re-uploading -- Quantum Machine Learning: Data re-uploading is a solution for QML.\n- quantum state -- Quantum Machine Learning: Output from a quantum network in quantum machine learning is a quantum state.\n- quantum convolutional architecture -- quantum state: Quantum states obfuscate raw classical data.\n- Quantum Cryptography -- quantum state: Quantum cryptography utilizes quantum states.\n- amplitude encoding -- quantum state: Amplitude Encoding represents classical data in the amplitudes of a quantum state.; Quantum states are used in Amplitude Encoding.\n- BB84 -- quantum state: BB84 uses quantum states for encoding.\n- Quantum Key Distribution -- quantum state: QKD uses quantum states by Alice and Bob.; Alice and Bob exchange quantum states over an unauthenticated channel.\n- quantum matrix inversion algorithm -- quantum state: Algorithm operates on quantum states|b⟩ and|A−1b⟩.", "passages": [{"source": "Quantum Machine Learning for Cybersecurity", "page": 6, "text": "embeddings, which enabled the mapping of classical features into quantum state representations. They concluded that quantum-enhanced embeddings and circuit designs are especially effective for botnet detection and broader cybersecurity analytics. Tehrani et al. used a QHTC for detecting domain generation algorithm botnets. They employed a hybrid approach that utilised both quantum and classical methods to enhance the accuracy and efficiency of real-time detection in network environments."}, {"source": "Variational quantum algorithms", "page": 13, "text": "diﬀerent ways of embedding classical data into quantum states (such as data re-uploading), and with Ref. showing an experimental demonstration of variational classiﬁcation. Moreover, as shown in Refs., instead of using a parameterized unitary U(θ) one can use products of quantum feature vectors ⟨ψ0|V †(x′)V (x)|ψ0⟩to perform a kernel method. Finally, the quantum kernel trick, which means that the dimensions of the quantumenhanced feature space are larger than the number of data sets, has been demonstrated experimentally by using an ensemble nuclear spins. 2. As a quantum analog, Ref. introduced a VQA for quantum autoencoding, with the goal of compressing quantum data."}, {"source": "Quantum Machine Learning for Cybersecurity", "page": 12, "text": "All these factors lead to low circuit stability, low model precision, and undermined threat detection reliability. In their Systematic Mapping Study (SMS), Khanalet al. analysed these challenges for supervised quantum machine learning (QML), evaluated on widely used datasets such as MNIST and IRIS. Optimization challenges & barren plateaus QML models used in cybersecurity, such as QNNs and VQCs, suffer optimisation issues. Suryotrisongkoet al. and Barruéet al. discuss possible solutions such as data re-uploading and sparse parameterisation, but these solutions"}, {"source": "Next-Generation Quantum Security - The Impact of Quantum Computing on Cybersecurity—Threats, Mitigations, and Solutions", "page": 21, "text": "Bob receives Alice’s classical measurement results, through which he applies an appropriate unitary operation to transform his entangled pair into the precise state |𝜓⟩. Alice has a quantum state |𝜓⟩= 𝛼|0⟩+ 𝛽|1⟩ to be teleported and an entangled pair in the Bell state |𝛷+⟩: |𝛷+⟩= 1 √ 2 (|00⟩+ |11⟩) (16) 2. Bob, however, applies the unitary transformation 𝑈 (such as the Pauli-X or Pauli-Z gates) to his half of the entangled state using the measurement information sent to him through a classical channel by Alice, resulting in the recovery of the original state |𝜓⟩."}], "claims": ["The data re-uploading strategy addresses optimization issues in encoding classical data into quantum states.", "A hybrid model with quantum-enhanced embeddings achieved up to 94.7% accuracy in botnet detection."]}, {"code": "A076", "question": "How do quantum generative adversarial networks (QGANs) work, and how does EQGAN improve their training?", "reference": "A QGAN pairs a parameterized quantum generator with a quantum or classical discriminator in a two-player minimax game, using superposition and entanglement to encode data distributions; it is usually built as a variational quantum algorithm and trained in a hybrid loop where quantum measurements estimate the loss. EQGAN uses quantum circuits as generators and classical neural networks as discriminators, treats training targets as mutation operations and uses a fitness evaluation to select optimal generator configurations across generations, giving faster, more stable training at lower cost.", "answer": "Quantum generative adversarial networks (QGANs) work by using quantum circuits or hybrid quantum-classical architectures to implement GANs, leveraging quantum advantages for more efficient training and better representation of complex probability distributions. EQGAN improves QGAN training by enhancing performance and stability, achieving faster and more stable training compared to standard QGANs.", "kg": "Knowledge graph entities:\n- Quantum Generative Adversarial Networks (SYSTEM): Surveyed for their development and practical quantum advantage.; A type of GAN implemented using quantum circuits or hybrid architectures.; Networks that operate on the principle of adversarial training between two neura\n- EQGAN (SYSTEM): Introduced as a novel framework that enhances standard QGAN performance.; Quantum-enhanced GAN that achieves faster and more stable training.\n- Generative Adversarial Networks (SYSTEM): Consist of two competing neural networks-a generator and a discriminator-locked in an adversarial training process.; Generative Adversarial Network.; Classical GAN architecture integrated with quantum elements.; Can be u\n- evolutionary strategies (ALGORITHM): Incorporated in EQGAN to leverage multiple adversarial training targets as mutation operations.; Foundation of EQNAS, a quantum neural architecture search method.\n- Quantum Neural Networks (SYSTEM): Adversarial vulnerability in QNNs is a critical concern.; Quantum algorithms utilized in machine learning.; Quantum architectures for neural networks.; Quantum analog of a classical neural network.; Quantum Machine Learn\n- standard QGANs (ALGORITHM): Algorithm for quantum machine learning.\n- Quantum Hamiltonian Generative Adversarial Network (SYSTEM): Identifies software defects using probabilistic thresholding.\n- Quantum GANs (SYSTEM): Use quantum circuits to capture complex distributions better than classical GANs.; Quantum GANs could enhance the quality and diversity of generated samples.\n\nKnowledge graph relations:\n- training -- Quantum Generative Adversarial Networks: QGANs can enhance training efficiency.\n- Quantum Generative Adversarial Networks -- education: QGANs have shown potential in education.\n- Quantum Generative Adversarial Networks -- generative accuracy: Generative accuracy is improved in QGANs.\n- Quantum Generative Adversarial Networks -- training stability: QGANs face challenges in training stability.\n- Quantum Generative Adversarial Networks -- gradient-based methods: Several approaches to QGAN training and optimization include gradient-based methods.\n- Quantum Generative Adversarial Networks -- quantum processor: QGANs could play a central role with improved quantum processors.\n- Quantum Generative Adversarial Networks -- insider threat: The QGAN framework can maintain stable training while balancing accuracy and realism.\n- Quantum Generative Adversarial Networks -- conditional QGANs: Future work will likely focus on conditional QGANs.\n- Quantum Generative Adversarial Networks -- optimization convergence: QGANs face challenges in optimization convergence.\n- Quantum Generative Adversarial Networks -- Physics Simulations: QGANs are used for modeling physical systems.\n- Quantum Generative Adversarial Networks -- quantum ansatz optimization via language models: QGANs use quantum ansatz optimization via language models.\n- Quantum Generative Adversarial Networks -- hybrid configurations: QGAN aims to overcome limitations in hybrid configurations.", "passages": [{"source": "A Survey of Quantum Generative Adversarial Networks", "page": 21, "text": "the diverse range of QGAN architectures, from hybrid quantum-classical frameworks to fully quantum circuits implemented on near-term hardware. Across domains including medical imaging, materials science, software reliability, and education, QGANs have shown potential for enhancing data generation tasks, improving performance, and introducing novel design strategies such as quantum ansatz optimization via language models. Despite promising early results, several challenges remain before QGANs can achieve widespread practical deployment. These include limitations in quantum hardware scalability, optimization convergence, and training stability, as well as the need for standardized benchmarks across quantum platforms. Nonetheless, the flexibility of QGAN architectures, their capacity to encode complex data distributions, and ongoing improvements in quantum processors point toward a future where QGANs could play a central role in quantum machine learning."}, {"source": "A Survey of Quantum Generative Adversarial Networks", "page": 2, "text": "quantum bits or “qubits” that can exist in superpositions of states [2]. This fundamental difference gives quantum computers the potential to solve certain problems more efficiently than their classical counterparts. As quantum hardware advances beyond the noisy intermediate-scale quantum (NISQ) era, the potential of quantum computing to enhance machine learning algorithms has attracted growing attention [3]. QGANs represent the intersection of these two cutting-edge fields. By implementing GANs using quantum circuits or hybrid quantum-classical architectures, quantum advantages can be leveraged to enhance generative modeling capabilities [4, 5]. The potential benefits include more efficient training, better representation of complex probability distributions, and novel applications across various domains. This review aims to provide researchers and practitioners with a clear understanding of the current state of QGAN research and to highlight promising avenues for"}, {"source": "A Survey of Quantum Generative Adversarial Networks", "page": 21, "text": "improvements in quantum processors point toward a future where QGANs could play a central role in quantum machine learning. Future work will likely focus on conditional QGANs, improved variational circuit design, robust error mitigation strategies, the generation of genuinely quantum data, as well as algorithmic quantum fairness [91]. As quantum technologies continue to evolve, QGANs stand as a compelling candidate for demonstrating early quantum advantage in real-world applications. Acknowledgements. F.O. acknowledges Tokyo International University Personal Research Fund. Declarations • Funding: Tokyo International University Personal Research Fund. • Conflict of interest/Competing interests: Not applicable. • Ethics approval and consent to participate: Not applicable. • Consent for publication: Not applicable. • Data availability: No data is generated in this work. • Materials availability: Not applicable. • Code availability: Not applicable."}, {"source": "Quantum key distribution through quantum machine learning - a research review", "page": 5, "text": "processing large real-time data, has gained popularity with the development of quantum generative models. Several variants of Generative Adversarial Networks (GANs) with advanced computing capabilities have been introduced. Recently, a hybrid quantum-classical Generative Adversarial Network (GAN) has been developed for image generation, leveraging QML to overcome quantum hardware constraints (Zhou et al., 2023). With the advancement of artiﬁcial intelligence and machine learning, traditional optimization techniques struggle to handle complex, nonlinear, and systemic problems. Advanced algorithms such as ant colony optimization, bat optimization, simulated annealing, genetic optimization, fruit ﬂy optimization, particle swarm optimization (PSO), and the gravitational search method, combined with effective preprocessing techniques, offer more robust solutions. Among these, PSO, a nature-inspired metaheuristic algorithm, stands out due to its fewer control parameters, faster search rate,"}], "claims": ["Quantum generative adversarial networks (QGANs) use quantum circuits or hybrid quantum-classical architectures to implement GANs.", "QGANs leverage quantum advantages for more efficient training.", "QGANs can better represent complex probability distributions.", "EQGAN improves QGAN training by enhancing performance.", "EQGAN improves QGAN training by enhancing stability.", "EQGAN achieves faster training compared to standard QGANs.", "EQGAN achieves more stable training compared to standard QGANs."]}, {"code": "A077", "question": "How are technology service providers using quantum resilience as a selling point?", "reference": "Certain VPN and secure communications products advertise that they are 'quantum-safe' by integrating PQC, and cloud companies like AWS, IBM and Microsoft have released tools for experimenting with PQC on their platforms.", "answer": "Technology service providers are using quantum-resilience as a selling point by integrating Post-Quantum Cryptography (PQC) into their products, such as certain VPN and secure communications offerings. For example, cloud companies like AWS, IBM, and Microsoft are also leveraging PQC in their platforms to advertise quantum-safe security.", "kg": "Knowledge graph entities:\n- quantum resilience (CONCEPT): Achieving security against quantum attacks.\n- quantum-resilience (DEFENSE): A selling point for technology service providers.\n- quantum-resilient (DEFENSE): Building quantum-resilient infrastructures are strategic imperatives.\n- quantum-resilient security (CONCEPT): The proposed user authentication framework offers quantum-resilient security with minimal computational overhead.\n\nKnowledge graph relations:\n- quantum-resistant security -- quantum-resilience: Security measures are used as a selling point for quantum-resilience.\n- quantum safety -- software vendors: Software vendors are expected to handle the heavy lifting.\n- quantum computing -- Attack Resilience: Quantum Computing demonstrates superior performance in this attribute.\n- quantum safety -- cloud service providers: Cloud service providers are expected to handle the heavy lifting.\n- Quantum-Resilience Index, R -- enterprise: A higher R(t) indicates greater quantum resilience for enterprises.\n- quantum-resilience -- PQC: Quantum-resilience involves integrating PQC.", "passages": [{"source": "Are Enterprises Ready for Quantum-Safe Cybersecurity", "page": 9, "text": "it signals that by the late 2020s, not having a plan will be deemed irresponsible. Another factor is client and market expectations: as large enterprises (e.g., global banks, cloud providers) start boasting of “quantum-resistant security” in their offerings, it may spur others to follow to avoid being seen as the weak link. Already, some technology service providers use quantum-resilience as a selling point; for example, certain VPN and secure communications products advertise that they are “quantum-safe” by integrating PQC, and cloud companies like AWS, IBM, and Microsoft have released tools for experimenting with PQC in their platforms. 3.2 Key Challenges in Implementation and Integration Even once an enterprise decides to act on quantum security, they encounter several practical challenges that can slow progress. Key among these are: (a) the complexity of identifying and upgrading legacy systems, (b) resource constraints (both budget and skilled personnel), (c)"}, {"source": "The-Quantum-Security-Deadline", "page": 9, "text": "European Journal of Computer Science and Information Technology, 13(52),35-52, 2025       Print ISSN: 2054-0957 (Print)   Online ISSN: 2054-0965 (Online)   Website: https://www.eajournals.org/   Publication of the European Centre for Research Training and Development -UK  43    A higher R(t) indicates greater quantum resilience. In practical terms, enterprises should target an  R(t)>0. (on a 0–1 scale) before the estimated Cryptographically Relevant Quantum Computer  (CRQC) horizon—currently projected around 2032 (Mosca, 2021; NIST, 2024).  The Quantum-Resilience Index, R(t), serves as a key performance metric for enterprise  adaptability in post-quantum environments. A higher R(t) indicates greater enterprise quantum  resilience, reflecting superior agility, automation, and cryptographic readiness against quantumera threats.    BUILDING THE FOUNDATION FOR QUANTUM-RESILIENT SECURITY  Quantum resilience requires a holistic, enterprise-wide approach that integrates discovery,"}, {"source": "Harvest-Now, Decrypt-Later - A Temporal Cybersecurity Risk in the Quantum Transition", "page": 17, "text": "Telecom 2025, 6, 100 17 of 23 This key size parameterization enables network operators to evaluate both short-term mitigations (key size increases) and long-term solutions (PQC migration) within the unified HNDL temporal risk framework. These results demonstrate that confidentiality risk in telecommunication systems is not uniform but scales with both data longevity and migration readiness. Long-retention networks such as medical record systems, satellite telemetry archives, and government communications are the most vulnerable under delayed transition. Hybrid cryptography and forward-secure lifecycle policies substantially compress the exposure window, illustrating that practical migration strategies can meaningfully mitigate HNDL risk even before full PQC deployment. The analysis reinforces that quantum resilience in communication networks is determined as much by timing and key management as by cryptographic strength."}, {"source": "Harvest-Now, Decrypt-Later - A Temporal Cybersecurity Risk in the Quantum Transition", "page": 4, "text": "risk prioritization, and adoption of crypto-agile architectures [4,25]. Across these initiatives, consensus has emerged that standardization alone is insufficient. Sustained progress depends on practical migration frameworks, hybrid deployment models, and cross-sector coordination to achieve quantum resilience well before the anticipated “Q-Day” [17,19]. 2.3. Temporal Security and Long-Term Confidentiality Models The HNDL threat has reshaped how confidentiality is understood across time. Classical models such as perfect forward secrecy in TLS address short-term key compromise but do not account for the long-term algorithmic degradation that may emerge years or even decades later [26]. Recent work instead frames confidentiality as an explicitly temporal requirement, where an encryption scheme must remain secure for the full lifetime of the data it protects [18]. Bernstein and colleagues highlighted this archival exposure by noting that"}], "claims": ["Technology service providers are using quantum-resilience as a selling point.", "They are integrating Post-Quantum Cryptography (PQC) into their products.", "PQC is being integrated into VPN and secure communications offerings.", "Cloud companies like AWS, IBM, and Microsoft are leveraging PQC in their platforms.", "They are advertising quantum-safe security."]}, {"code": "A078", "question": "What technique does SCNNTraffic use to achieve effective classification while reducing parameters and energy consumption?", "reference": "SCNNTraffic uses a Spiking Convolutional Encoder to downsample and encode text-form inputs and a Spiking Cross-Gating Module for feature fusion; using spiking neurons reduces parameters and energy consumption, enabling deployment on edge devices.", "answer": "SCNNTraffic uses spiking convolution neural networks (SCNNs) to capture the time-varying characteristics of network traffic, facilitating smooth and stable feature extraction. Additionally, it introduces a cross-gating module based on spiking neurons that aids in feature fusion and further decreases power usage, achieving effective classification while significantly reducing both the number of network parameters and energy consumption.", "kg": null, "passages": [{"source": "SCNNTraffic - A lightweight and energy-efficient traffic classification method based on spiking convolution neural networks", "page": 1, "text": "SCNNTraffic. SCNNTraffic employs SCNNs to capture the time-varying characteristics of network traffic, facilitating  smooth and stable feature extraction. This approach achieves effective classification while significantly reducing energy  consumption, highlighting its advantages in resource-constrained environments. Moreover, we introduce a cross-gating  module based on spiking neurons that facilitates feature fusion and further decreases power usage. Our experimental  results demonstrate that the proposed model significantly reduces both the number of network parameters and energy  consumption, achieving accuracy of 98.65% and 92.51% on the ISCX-VPN and Non-VPN datasets, respectively. Keywords  Encrypted traffic classification · Spiking neural networks · User behavior Received: 17 July 2025 / Accepted: 12 February 2026 / Published online: 25 February 2026 © The Author(s) 2026 SCNNTraffic: A lightweight and energy-efficient traffic classification"}, {"source": "SCNNTraffic A lightweight and energy-efficient traffic classification method based on spiking convolution neural networks", "page": 1, "text": "SCNNTraffic. SCNNTraffic employs SCNNs to capture the time-varying characteristics of network traffic, facilitating  smooth and stable feature extraction. This approach achieves effective classification while significantly reducing energy  consumption, highlighting its advantages in resource-constrained environments. Moreover, we introduce a cross-gating  module based on spiking neurons that facilitates feature fusion and further decreases power usage. Our experimental  results demonstrate that the proposed model significantly reduces both the number of network parameters and energy  consumption, achieving accuracy of 98.65% and 92.51% on the ISCX-VPN and Non-VPN datasets, respectively. Keywords  Encrypted traffic classification · Spiking neural networks · User behavior Received: 17 July 2025 / Accepted: 12 February 2026 © The Author(s) 2026 SCNNTraffic: A lightweight and energy-efficient traffic classification  method based on spiking convolution neural networks"}, {"source": "SCNNTraffic - A lightweight and energy-efficient traffic classification method based on spiking convolution neural networks", "page": 1, "text": "© The Author(s) 2026 SCNNTraffic: A lightweight and energy-efficient traffic classification  method based on spiking convolution neural networks Qin Zeng1 · Dan Qu1,2 · Hao Zhang1 · Yaqi Chen1 · Wenlin Zhang1,2 1 3"}, {"source": "SCNNTraffic A lightweight and energy-efficient traffic classification method based on spiking convolution neural networks", "page": 1, "text": "© The Author(s) 2026 SCNNTraffic: A lightweight and energy-efficient traffic classification  method based on spiking convolution neural networks Qin Zeng1 · Dan Qu1,2 · Hao Zhang1 · Yaqi Chen1 · Wenlin Zhang1,2 1 3"}], "claims": ["SCNNTraffic uses spiking convolution neural networks (SCNNs) to capture the time-varying characteristics of network traffic.", "SCNNTraffic uses a cross-gating module based on spiking neurons for feature fusion.", "The cross-gating module in SCNNTraffic decreases power usage.", "SCNNTraffic achieves effective classification.", "SCNNTraffic significantly reduces the number of network parameters.", "SCNNTraffic significantly reduces energy consumption."]}, {"code": "A079", "question": "How has hybrid post-quantum key agreement been deployed in Chrome, and how do hybrid PQC deployments keep backward compatibility with parties that do not support it?", "reference": "From late 2022 into 2023 Google deployed a hybrid X25519+Kyber key agreement in Chrome (with BoringSSL), and by late 2024 it was enabled for all desktop use, likely the largest PQC deployment so far, done without user disruption. In hybrid deployments, modern clients and servers support both classical and PQC algorithms and negotiate mutually supported ones, preferring hybrid; with graceful degradation they fall back to classical algorithms if hybrid is unavailable, may offer pure PQC, and eventually phase out classical-only systems.", "answer": "Chrome has deployed a hybrid X25519+Kyber key agreement, which allows it to maintain compatibility with parties that do not support PQC by falling back to classical algorithms during the handshake negotiation process. This ensures that the system remains usable even when not all parties support the new hybrid approach.", "kg": null, "passages": [{"source": "harvest-now-decrypt-later-pqc-threat-model", "page": 38, "text": "Hybrid Solution Levels: 1. Hybrid Support in Modern Clients/Servers: Modern systems support both classical and PQC. During handshake negotiation, both parties use whichever algorithms are mutually supported, with preference for hybrid if available. 2. Graceful Degradation: If one party doesn’t support hybrid: • Use classical if hybrid unavailable (maintains backward compatibility) • Offer pure PQC as alternative • Eventually phase out classical-only systems 3. Migration Timeline: 28 Amazon Web Services (AWS). (2024). “AWS Key Management Service Post-Quantum Cryptography.” AWS Security Blog. Available: https://aws.amazon.com/blogs/security/ 29 Westerbaan, B., & Rubin, C. D. (2022). “Defending against future threats: Cloudflare goes post-quantum.” Cloudflare Blog, October 3, 2022. Available: https://blog.cloudflare.com/post-quantum-for-all/ 30 Google Chrome Team. (2023). “Chrome 116 Beta: Post-Quantum Key Agreement in TLS.” Chromium Blog. Available: https://blog.chromium.org/"}, {"source": "A Survey of Post-Quantum Cryptography Support in Cryptographic Libraries", "page": 9, "text": "already claim to be CNSA 2.0 ready for government use [45]. The upcoming support for OpenSSL is also largely driven by government and industry compliance needs [19]. Web and Internet Security (Browsers and Cloud) Perhaps the most visible real-world deployment of PQC to date is in web browsers and cloud services. In late 2022 and into 2023, Google began deploying a hybrid X25519+Kyber key agreement in Chrome (with BoringSSL). By late 2024, Chrome had this enabled for all desktop use, making it likely the largest post-quantum cryptography deployment ever [29]. This achievement, executed seamlessly without user disruption, highlights careful engineering and demonstrates the feasibility of PQC at a large scale. Likewise, Cloudflare, which handles a significant fraction of Internet traffic, announced that it “now uses post-quantum cryptography to talk to your origin server” [49]."}, {"source": "harvest-now-decrypt-later-pqc-threat-model", "page": 38, "text": "30 Google Chrome Team. (2023). “Chrome 116 Beta: Post-Quantum Key Agreement in TLS.” Chromium Blog. Available: https://blog.chromium.org/ 31 Microsoft Azure. (2024). “Azure Post-Quantum Cryptography Roadmap.” Microsoft Security Documentation. 38"}, {"source": "Are Enterprises Ready for Quantum-Safe Cybersecurity", "page": 5, "text": "gorithms, implying that technologists face an engineering challenge to achieve parity with the ubiquity of RSA/ECC [35]. Another technical challenge is ensuring interoperability and trust in the new algorithms. Standards bodies like the IETF are working on standards for PQC in protocols (e.g., RFCs for PQC in TLS, IPsec, and SSH). Likewise, the WebPKI ecosystem (browsers and Certificate Authorities) needs consensus on how to issue and handle quantum-safe certificates. As of 2025, some Certificate Authorities have begun issuing hybrid certificates (containing both classical and PQC public keys) as an intermediate step [36, 37]. These measures are indicative of a transition phase where hybrid cryptography is employed: using both a classical and a postquantum algorithm in parallel so that security holds unless both are broken. Hybrid modes are intended to provide confidence and backwards compatibility, though they add complexity and"}], "claims": ["Chrome has deployed a hybrid X25519+Kyber key agreement.", "The hybrid key agreement allows Chrome to maintain compatibility with parties that do not support PQC.", "Chrome falls back to classical algorithms during the handshake negotiation process.", "The system remains usable even when not all parties support the new hybrid approach.", "The handshake negotiation process allows for backward compatibility with parties that do not support PQC."]}, {"code": "A080", "question": "Why is quantum key distribution (QKD) considered provably secure against eavesdropping?", "reference": "QKD relies on principles of physics rather than the computational complexity of mathematical problems, so anyone attempting to access the key exchange can be detected.", "answer": "Quantum Key Distribution (QKD) is considered provably secure against eavesdropping because it leverages principles of quantum mechanics, such as the no-cloning theorem, which ensures that any eavesdropping attempt introduces detectable disturbances. This makes retrospective cryptanalysis impossible, and in real-time, an eavesdropper must attack the communication in progress.", "kg": "Knowledge graph entities:\n- Quantum Key Distribution (PROTOCOL): Technology that relies on coherence for secure communication.; Technology that ensures secure state transmission.; Integrated with ML to optimize communication security.; A cryptographic protocol that uses quantum physic\n- three-state quantum key distribution (QKD) protocol (PROTOCOL): Demonstrates security up to a bit error rate of 9.81%.\n- eavesdropping detection (DEFENSE): Detection mechanism in quantum key distribution.\n- eavesdropping (ATTACK): The most well-known physical layer attack.\n- three-stage multi-photon quantum key distribution (QKD) protocol (PROTOCOL): The protocol leverages multi-photon coherent states and double-lock cryptography.\n- QKD devices (SYSTEM): Devices that implement quantum key distribution.\n- QKD deployments (SYSTEM): Quantum Key Distribution systems.\n- quantum cryptography implementations (SYSTEM): State of quantum cryptography implementations like QKD.\n\nKnowledge graph relations:\n- Quantum Key Distribution -- information-theoretic security: QKD offers the promise of information-theoretic security.\n- eavesdropper -- Quantum Key Distribution: Eavesdropper must attack in real time.; Eavesdroppers can exploit the security offered by QKD.\n- Quantum Key Distribution -- unconditional security: QKD provides unconditional security.; QKD provides information-theoretic security.\n- Quantum Key Distribution -- finite-key security: QKD provides finite-key security.; Security analysis of QKD distinguishing raw security from KPA security.\n- Quantum Key Distribution -- composable security: QKD provides composable security.; Security analysis of QKD distinguishing raw security from KPA security.; The framework is for proving the robustness of QKD against general quantum attacks.\n- Quantum Key Distribution -- Threshold: Because QKD’s security relies on the threshold for logical errors.; If the observed error rate exceeds it, the key is discarded.\n- QKD channel -- Quantum Key Distribution: A QKD channel might drop due to spurious events.; QKD can alert to eavesdropping but also makes QKD channels fragile.\n- defense -- Quantum Key Distribution: Defense might use QKD for secure communications.\n- PQC -- Quantum Key Distribution: PQC will be the workhorse of future quantum-safe security, whereas QKD might protect specific high-value links.\n- Quantum Key Distribution -- secret key rate: If secret key rate surpasses a threshold, QKD becomes vulnerable.\n- government -- Quantum Key Distribution: Government might use QKD for secure communications.; Governments are likely early adopters of QKD.\n- Quantum Key Distribution -- National Security Agency: NSA notes the limitations of QKD security.", "passages": [{"source": "QUANTUM KEY DISTRIBUTION - Bridging Theoretical Security Proofs, Practical Attacks, and Error Correction", "page": 15, "text": "further resilience, while machine learning–based anomaly detection can also be explored as event detection for more sophisticated jamming attacks. In tab(4), we summarize all the attacks we reviewed in this Sec 3. Because many of these attacks are statistically indistinguishable from background noise at realistic block sizes, asymptotic analyses alone are insufficient. In Sec. 4 we map these threats to unconditional-, finite-key-, and composablesecurity frameworks. We also highlight the role of QECC in keeping error budgets within those bounds. 4 Security Analysis of QKD We now review the security of Quantum Key Distribution systems by looking over different classes of security proofs. 4.1 Security Paradigms in QKD As mentioned earlier, QKD provides security by leveraging the principles of quantum mechanics. The security paradigms in QKD are broadly classified as unconditional security, finite-key security, and composable security."}, {"source": "QUANTUM KEY DISTRIBUTION - Bridging Theoretical Security Proofs, Practical Attacks, and Error Correction", "page": 15, "text": "paradigms in QKD are broadly classified as unconditional security, finite-key security, and composable security. QKD exploits inherently quantum phenomena—such as non-orthogonal state encoding and the no-cloning theorem—to generate shared keys between Alice and Bob. This provides information-theoretic security rather than security relying on hard mathematical problems [1, 2]. Since BB84’s formulation, several rigorous proofs have established its unconditional security under ideal assumptions, in stark contrast to classical schemes (e.g. RSA) whose safety depends on computational complexity [2, 54]. Security analyses further distinguish raw security—Eve’s maximum success probability during key generation—from Known-Plaintext Attack (KPA) security, which bounds her advantage once part of the key is revealed during message exchange [55, 54]. 15"}, {"source": "Are Enterprises Ready for Quantum-Safe Cybersecurity", "page": 5, "text": "Parallel to the advances in PQC, Quantum Key Distribution offers a very different approach to secure communications. QKD uses quantum mechanics to exchange encryption keys between parties such that any eavesdropping on the quantum channel can be detected. When combined with one-time-pad encryption or with classical symmetric ciphers, QKD can theoretically provide provably secure communication, independent of an eavesdropper’s computing power [40–42]. This promise of “information-theoretic security” is enticing, especially for protecting extremely sensitive data (e.g. government or defense communications with long confidentiality requirements). Over the past five years, QKD technology has progressed from laboratory experiments to early commercial deployments. For instance, several real-world QKD networks have been demonstrated: financial institutions in Europe and Asia have piloted QKD links to secure"}, {"source": "QUANTUM KEY DISTRIBUTION - Bridging Theoretical Security Proofs, Practical Attacks, and Error Correction", "page": 3, "text": "observed error rate; if it exceeds a threshold, the key is discarded and the protocol restarts. Because QKD’s security arises from physics rather than computational assumptions, an eavesdropper must attack in real time; retrospective cryptanalysis is impossible. Figure 1: A schematic representation of a general QKD scenario. Alice is the sender, Bob is the receiver, and Eve is the eavesdropper present in the setup. A two-way classical communication channel and a quantum channel connect Alice and Bob. Eve can perform an eavesdropper attack on either or both of the channels to gain maximum knowledge without getting exposed. The no-cloning theorem ensures (1) any eavesdropper introduces detectable disturbances, and (2) Alice and Bob can bound Eve’s information to determine the amount of privacy amplification needed [16]. While this gives unconditional security in theory, real devices suffer side channels and implementation flaws that Eve can exploit."}], "claims": ["Quantum Key Distribution (QKD) is considered provably secure against eavesdropping.", "QKD leverages principles of quantum mechanics.", "The no-cloning theorem is a principle of quantum mechanics.", "The no-cloning theorem ensures that any eavesdropping attempt introduces detectable disturbances.", "Any eavesdropping attempt makes retrospective cryptanalysis impossible.", "An eavesdropper must attack the communication in progress in real-time."]}, {"code": "A081", "question": "How do Quantum Gaussian Mixture Models (QGMMs) and Quantum Boltzmann Machines (QBMs) differ in how they represent probability distributions?", "reference": "QGMMs are quantum extensions of Gaussian mixture models for density estimation and clustering; they use quantum states to model the likelihood that data belong to different Gaussian distributions and are used for tasks such as image segmentation and pattern recognition. QBMs describe the target distribution as a quantum thermal (Gibbs) state of a parameterized Hamiltonian with classical energy terms plus transverse-field quantum fluctuations, allowing them to capture distributions intractable for classical models.", "answer": "Quantum Gaussian Mixture Models (QGMMs) represent probability distributions using quantum states to model the likelihood, whereas Quantum Boltzmann Machines (QBMs) describe the target distribution as a quantum thermal state derived from a parameterized Hamiltonian. QBMs use quantum Hamiltonians to define energy functions, allowing them to capture correlations and distributions that are intractable for classical models.", "kg": "Knowledge graph entities:\n- Quantum Gaussian Mixture Models (SYSTEM): Quantum extensions of classical Gaussian mixture models used for density estimation and clustering.\n- Gaussian mixture model (CONCEPT): Classical Gaussian mixture models extended to the quantum domain.\n- quantum Boltzmann machine (SYSTEM): Quantum versions of classical Boltzmann machines.; Not explicitly detailed in the passage.; Req\n- quantum models (SYSTEM): Models used in quantum machine learning for tasks like state discrimination and process learning.\n\nKnowledge graph relations:\n- Quantum Gaussian Mixture Models -- Gaussian probability density function: QGMMS use quantum states to model the likelihood.\n- Quantum Gaussian Mixture Models -- Gaussian mixture model: QGMMS are quantum extensions of classical Gaussian mixture models.\n- classical Boltzmann machine -- quantum Boltzmann machine: QBM contrasts with classical BM in representing probability distributions.\n- Quantum Gaussian Mixture Models -- customer segmentation: QGMMS performed customer segmentation.\n- quantum Boltzmann machine -- quantum Hamiltonian: QBMs use quantum Hamiltonians to define energy functions.\n- quantum circuit Born machines -- quantum Boltzmann machine: QCBMs and QBMs are both quantum systems.", "passages": [{"source": "A Survey of Quantum Machine Learning - Foundations,Algorithms, Frameworks, Data and Applications", "page": 18, "text": "While classical BMs represent probability distributions via stochastic neural networks trained through sampling, QBMs describe the target distribution as a quantum thermal state derived from a parameterized Hamiltonian. This formalism allows QBMs to capture correlations and distributions that are intractable for classical models. Mathematically, a QBM is governed by a Hamiltonian 𝐻(𝜆) = 𝐻𝑍+ 𝐻𝑋, where 𝐻𝑍encodes classical energy terms (e.g., pairwise interactions between visible and hidden nodes), and 𝐻𝑋 introduces quantum fluctuations via off-diagonal elements, typically modeled as transverse fields."}, {"source": "A Survey of Quantum Generative Adversarial Networks", "page": 4, "text": "Quantum Circuit Born Machines (QCBMs) are quantum circuits designed to generate samples from a probability distribution encoded in the amplitudes of a quantum state. Quantum Boltzmann Machines (QBMs) are quantum versions of classical Boltzmann machines, leveraging quantum effects for potentially more efficient sampling. QBMs use quantum Hamiltonians to define energy functions H(θ) = X i hi(θ)Zi + X i,j Jij(θ)ZiZj +..., (6) where Zi represents the Pauli-Z operator acting on qubit i."}, {"source": "Quantum_Machine_Learning_A_Survey", "page": 7, "text": "Quantum Phase Transitions Algorithms Description: Quantum phase transition algorithms study the quantum analogue of thermal phase transitions, which can provide insights into the learning dynamics of quantum systems. Use Cases: Used in the study of quantum systems to understand their thermodynamic properties and learning mechanisms. QPTAs use quantum states to study phase transitions in quantum systems. Phase transition probability: P(x)=exp(−BJ(x)), where (J(x)) is the magnetization Quantum Gaussian Mixture Models (QGMMS) Description: Quantum Gaussian Mixture Models are quantum extensions of classical Gaussian mixture models,"}, {"source": "A Survey of Quantum Machine Learning - Foundations,Algorithms, Frameworks, Data and Applications", "page": 19, "text": "A Survey of QML: Foundations, Algorithms, Frameworks, Data and Applications 91:19 where 𝛽is the inverse temperature controlling the distribution’s sharpness. Unlike classical Boltzmann Machines, which rely on sampling methods like Gibbs or contrastive divergence, QBMs require access to quantum thermal states, which can be prepared using quantum annealing or variational thermalization techniques. Their ability to capture quantum correlations makes them suitable for modeling physical systems and learning from quantum data."}], "claims": ["Quantum Gaussian Mixture Models (QGMMs) represent probability distributions using quantum states to model the likelihood.", "Quantum Boltzmann Machines (QBMs) describe the target distribution as a quantum thermal state derived from a parameterized Hamiltonian.", "QBMs use quantum Hamiltonians to define energy functions.", "QBMs can capture correlations and distributions that are intractable for classical models."]}, {"code": "A082", "question": "How does the security basis of quantum cryptography differ from traditional encryption, what are the two main categories of QKD protocols, and what practical requirement distinguishes QKD from traditional key agreement?", "reference": "Traditional encryption relies on the computational complexity of mathematical problems, whereas quantum cryptography relies on principles of quantum physics. QKD protocols are divided into Continuous Variable (CV) and Discrete Variable (DV) protocols, the latter producing discrete outcomes, e.g. from the polarization of single photons. QKD's keys are information-theoretically secure, but QKD requires specialized hardware; it has been tested for over two decades and only recently used commercially.", "answer": "The security basis of quantum cryptography, particularly QKD, differs from traditional encryption by offering information-theoretic security, whereas traditional methods rely on computational complexity. QKD protocols are mainly categorized into two types: three-state QKD protocol and three-stage multi-photon QKD protocol. A practical requirement distinguishing QKD from traditional key agreement is that QKD can detect eavesdropping on the quantum channel, ensuring secure key transmission.", "kg": "Knowledge graph entities:\n- cryptography (CONCEPT): Applications in critical fields of QML.; Cryptography is being threatened by quantum technology.\n- quantum cryptography (CONCEPT): Has applications in quantum cryptography.; Implication of the technique of extra
