pment -UK  43    A higher R(t) indicates greater quantum resilience. In practical terms, enterprises should target an  R(t)>0. (on a 0–1 scale) before the estimated Cryptographically Relevant Quantum Computer  (CRQC) horizon—currently projected around 2032 (Mosca, 2021; NIST, 2024).  The Quantum-Resilience Index, R(t), serves as a key performance metric for enterprise  adaptability in post-quantum environments. A higher R(t) indicates greater enterprise quantum  resilience, reflecting superior agility, automation, and cryptographic readiness against quantumera threats.    BUILDING THE FOUNDATION FOR QUANTUM-RESILIENT SECURITY  Quantum resilience requires a holistic, enterprise-wide approach that integrates discovery,\n\n[Đoạn 3] Harvest-Now, Decrypt-Later - A Temporal Cybersecurity Risk in the Quantum Transition · trang 17\nTelecom 2025, 6, 100 17 of 23 This key size parameterization enables network operators to evaluate both short-term mitigations (key size increases) and long-term solutions (PQC migration) within the unified HNDL temporal risk framework. These results demonstrate that confidentiality risk in telecommunication systems is not uniform but scales with both data longevity and migration readiness. Long-retention networks such as medical record systems, satellite telemetry archives, and government communications are the most vulnerable under delayed transition. Hybrid cryptography and forward-secure lifecycle policies substantially compress the exposure window, illustrating that practical migration strategies can meaningfully mitigate HNDL risk even before full PQC deployment. The analysis reinforces that quantum resilience in communication networks is determined as much by timing and key management as by cryptographic strength.\n\n[Đoạn 4] Harvest-Now, Decrypt-Later - A Temporal Cybersecurity Risk in the Quantum Transition · trang 4\nrisk prioritization, and adoption of crypto-agile architectures [4,25]. Across these initiatives, consensus has emerged that standardization alone is insufficient. Sustained progress depends on practical migration frameworks, hybrid deployment models, and cross-sector coordination to achieve quantum resilience well before the anticipated “Q-Day” [17,19]. 2.3. Temporal Security and Long-Term Confidentiality Models The HNDL threat has reshaped how confidentiality is understood across time. Classical models such as perfect forward secrecy in TLS address short-term key compromise but do not account for the long-term algorithmic degradation that may emerge years or even decades later [26]. Recent work instead frames confidentiality as an explicitly temporal requirement, where an encryption scheme must remain secure for the full lifetime of the data it protects [18]. Bernstein and colleagues highlighted this archival exposure by noting that"}, {"key": "gt:0:A", "group": "Ý 1 của ground truth", "text": "Ý 1. Certain VPN and secure communications products advertise that they are 'quantum-safe'.", "prompt": "Câu trả lời A: ý này có trong câu trả lời A? có trong context A?", "options": [[3, "Context và câu trả lời (3)", "y"], [2, "Chỉ context (2)", ""], [1, "Chỉ câu trả lời (1)", ""], [0, "Không có (0)", "n"]]}, {"key": "gt:0:B", "group": "Ý 1 của ground truth", "prompt": "Câu trả lời B: ý này có trong câu trả lời B? có trong context B?", "options": [[3, "Context và câu trả lời (3)", "y"], [2, "Chỉ context (2)", ""], [1, "Chỉ câu trả lời (1)", ""], [0, "Không có (0)", "n"]]}, {"key": "gt:1:A", "group": "Ý 2 của ground truth", "text": "Ý 2. They integrate PQC.", "prompt": "Câu trả lời A: ý này có trong câu trả lời A? có trong context A?", "options": [[3, "Context và câu trả lời (3)", "y"], [2, "Chỉ context (2)", ""], [1, "Chỉ câu trả lời (1)", ""], [0, "Không có (0)", "n"]]}, {"key": "gt:1:B", "group": "Ý 2 của ground truth", "prompt": "Câu trả lời B: ý này có trong câu trả lời B? có trong context B?", "options": [[3, "Context và câu trả lời (3)", "y"], [2, "Chỉ context (2)", ""], [1, "Chỉ câu t  effect -- line-of-sight and reflective jamming: Exploited to disrupt QKD through various jamming techniques.\n- jamming attack -- Quantum Key Distribution: A jamming attack can disrupt quantum key distribution protocols.\n- Quantum Key Distribution -- pulse-power manipulation: QKD systems can be attacked through pulse-power manipulations.\n- Quantum Key Distribution -- jamming: Simmons et al. examine jamming threats to free-space QKD.", "kind": "kg"}, {"title": "Context A: các đoạn văn", "text": "[Đoạn 1] QUANTUM KEY DISTRIBUTION - Bridging Theoretical Security Proofs, Practical Attacks, and Error Correction · trang 14\n3.3.1 Related works on Jamming attacks We will go over some of the works related to jamming attacks in quantum communications scenarios. (i) Daschner et al. demonstrate a jamming attack on BB84 QKD leveraging the Faraday effect. In standard telecom fiber (λ = 1550 nm, V ≈0.53 rad T−1m−1), this rotation degrades the Bell-inequality parameter to S′ = S \f\fcos(2β) \f\f (24) and induces a quantum bit-error rate of QBERind = 1 −cos2(β). The attack is less potent in free-space links (lower atmospheric V ) and its success depends critically on fiber proximity and lack of magnetic shielding.\n\n[Đoạn 2] QUANTUM KEY DISTRIBUTION - Bridging Theoretical Security Proofs, Practical Attacks, and Error Correction · trang 16\nJamming Attack 2017 Boche et al. Analyzes secrecy capacity for channels under jamming and eavesdropping with super-activation effects. 2019 Daschner et al. Exploits the Faraday effect to disrupt QKD, increasing QBER and halting key exchange. 2019 Boche et al. Explores line-of-sight and reflective jamming on satellite QKD, improving SIR with SPAD arrays. 16\n\n[Đoạn 3] QUANTUM KEY DISTRIBUTION - Bridging Theoretical Security Proofs, Practical Attacks, and Error Correction · trang 13\n3.3 Jamming Attack Similar to classical communication scenarios eavesdropper can perform jamming attacks to quantum communication. A jamming attack is a denial-of-service (DoS) strategy. The main idea is for the eavesdropper to introduce enough noise in the system to disrupt the quantum key distribution protocols or to reduce their efficiency.\n\n[Đoạn 4] QUANTUM KEY DISTRIBUTION - Bridging Theoretical Security Proofs, Practical Attacks, and Error Correction · trang 15\nfurther resilience, while machine learning–based anomaly detection can also be explored as event detection for more sophisticated jamming attacks. 4 Security Analysis of QKD We now review the security of Quantum Key Distribution systems by looking over different classes of security proofs. 4.1 Security Paradigms in QKD As mentioned earlier, QKD provides security by leveraging the principles of quantum mechanics. The security paradigms in QKD are broadly classified as unconditional security, finite-key security, and composable security."}, {"title": "Câu trả lời B", "text": "In a 2019 jamming attack against QKD, the Faraday effect was exploited. This attack increased the quantum bit-error rate (QBER) by 7.6%, effectively halting key exchange."}, {"title": "Context B: mô tả KG", "text": "Knowledge graph entities:\n- jamming attack (ATTACK): Practical attack on the QKD system.; Denial-of-service (DoS) strategy to disrupt quantum key distribution protocols.; Demonstrated on BB84 QKD leveraging the Faraday effect.; Sophisticated attacks that can be detected by\n- jamming (ATTACK): Disrupting quantum communications by jamming.; The most well-known physical layer attack.; Active jamming in the context of quantum channels.; Both quantum jamming attacks and classical jamming attacks can cause DoS.\n- Quantum Key Distribution Networks (SYSTEM): Building a QKD network at scale leads to a combinatorial explosion of needed links.; China’s 2,000-km Quantum Key Distribution network.; Target of the modified PNS attack.; This modified scheme is based on weak laser pul\n- QKD (PROTOCOL): Standard for secure quantum communications.; Quantum cryptography implementations like QKD.; Quantum Key Distribution protocol for secure communications.; Protocol with technical limitations motivating the positions of v\n- Jamming / DoS Attacks (ATTACK): Examples of QKD attacks targeting the network.; None\n- attack (ATTACK): Opportunities to exploit the network covertly.; Attack that can be launched against CRYSTALS-Kyber.; Based on estimates of quantum and classical gate counts for attack, rather than assessing security algorithms with a sp\n- Risk in quantum key distribution (CONCEPT): Quantum key distribution faces threats.\n- Transmitter & receiver devices (ATTACK): Examples of QKD attacks targeting the devices.\n\nKnowledge graph relations:\n- jamming attack -- Faraday effect: The Faraday effect is used in the jamming attack.; Exploited to disrupt QKD through jamming.\n- jamming -- QKD systems: Jamming is a likely tactic to disrupt QKD systems.\n- Faraday effect -- line-of-sight and reflective jamming: Exploited to disrupt QKD through various jamming techniques.\n- jamming attack -- Quantum Key Distribution: A jamming attack can disrupt quantum key distribution protocols.\n- Quantum Key Distribution -- pulse-power manipulation: QKD systems can be attacked through pulse-power manipulations.\n- Quantum Key Distribution -- jamming: Simmons et al. examine jamming threats to free-space QKD.\n- QKD -- coherent-state attacks: QKD is vulnerable to coherent-state attacks.\n- jamming attack -- BB84 QKD scheme: A jamming attack is demonstrated on BB84 QKD.\n- adversary -- QKD: An adversary could intentionally induce conditions to block quantum communication.; QKD provides security against attacks by adversaries.; QKD's security is based on the inability of adversaries to read quantum informati\n- PNS attack -- Quantum Key Distribution Networks: Modified PNS attack targets the QKD network.\n- jamming attack -- machine learning–based anomaly detection: Can be detected by anomaly detection.\n- quantum bit-error rate -- jamming attack: The jamming attack induces a quantum bit-error rate.", "kind": "kg"}, {"title": "Context B: các đoạn văn", "text": "[Đoạn 1] QUANTUM KEY DISTRIBUTION - Bridging Theoretical Security Proofs, Practical Attacks, and Error Correction · trang 14\n3.3.1 Related works on Jamming attacks We will go over some of the works related to jamming attacks in quantum communications scenarios. (i) Daschner et al. [50] demonstrate a jamming attack on BB84 QKD leveraging the Faraday effect. An external magnetic field B0 rotates photon polarization by β = V B0 L, (23) where, • V : Verdet constant (material and wavelength dependent), • B0: Magnetic field strength, • L: Length of the medium through which light propagates. In standard telecom fiber (λ = 1550 nm, V ≈0.53 rad T−1m−1), this rotation degrades the Bell-inequality parameter to S′ = S \f\fcos(2β) \f\f (24) and induces a quantum bit-error rate of QBERind = 1 −cos2(β). (25) They show that β = 12.4◦lowers S from 2.37 to 2.15 (confidence drops from 4σ to 1.7σ), and β = 16◦ increases QBER by 7.6%, effectively denying service. The attack is less potent in free-space links (lower atmospheric V ) and its success depends critically on fiber proximity and lack of magnetic shielding.\n\n[Đoạn 2] QUANTUM KEY DISTRIBUTION - Bridging Theoretical Security Proofs, Practical Attacks, and Error Correction · trang 16\nmitigates it using photon beam splitters and wavelength filters. 2024 Sushchev et al [47]. Defines bounds on fidelity using OTDR and spectral transmittance for Trojan Horse attacks. Jamming Attack 2017 Boche et al [51]. Analyzes secrecy capacity for channels under jamming and eavesdropping with super-activation effects. 2019 Daschner et al [50]. Exploits the Faraday effect to disrupt QKD, increasing QBER and halting key exchange. 2019 Boche et al [52]. Derives capacity regions for compound and AVQCs, demonstrating simultaneous classical-quantum transmission. 2023 Simmons et al [53]. Explores line-of-sight and reflective jamming on satellite QKD, improving SIR y leveraging the principles of quantum mechanics. The security paradigms in QKD are broadly classified as unconditional security, finite-key security, and composable security."}, {"key": "gt:0:A", "group": "Ý 1 của ground truth", "text": "Ý 1. A 2019 jamming attack against QKD exploited the Faraday effect.", "prompt": "Câu trả lời A: ý này có trong câu trả lời A? có trong context A?", "options": [[3, "Context và câu trả lời (3)", "y"], [2, "Chỉ context (2)", ""], [1, "Chỉ câu trả lời (1)", ""], [0, "Không có (0)", "n"]]}, {"key": "gt:0:B", "group": "Ý 1 của ground truth", "prompt": "Câu trả lời B: ý này có trong câu trả lời B? có trong context B?", "options": [[3, "Context và câu trả lời (3)", "y"], [2, "Chỉ context (2)", ""], [1, "Chỉ câu trả lời (1)", ""], [0, "Không có (0)", "n"]]}, {"key": "gt:1:A", "group": "Ý 2 của ground truth", "text": "Ý 2. The Faraday effect disrupts QKD.", "prompt": "Câu trả lời A: ý này có trong câu trả lời A? có trong context A?", "options": [[3, "Context và câu trả lời (3)", "y"], [2, "Chỉ context (2)", ""], [1, "Chỉ câu trả lời (1)", ""], [0, "Không có (0)", "n"]]}, {"key": "gt:1:B", "group": "Ý 2 của ground truth", "prompt": "Câu trả lời B: ý này có trong câu trả lời B? có trong context B?", "options": [[3, "Context và câu trả lời (3)", "y"], [2, "Chỉ context (2)", ""], [1, "Chỉ câu trả lời (1)", ""], [0, "Không có (0)", "n"]]}, {"key": "gt:2:A", "group": "Ý 3 của ground truth", "text": "Ý 3. The Faraday effect increases the QBER.", "prompt": "Câu trả lời A: ý này có trong câu trả lời A? có trong context A?", "options": [[3, "Context và câu trả lời (3)", "y"], [2, "Chỉ context (2)", ""], [1, "Chỉ câu trả lời (1)", ""], [0, "Không có (0)", "n"]]}, {"key": "gt:2:B", "group": "Ý 3 của ground truth", "prompt": "Câu trả lời B: ý này có trong câu trả lời B? có trong context B?", "options": [[3, "Context và câu trả lời (3)", "y"], [2, "Chỉ context (2)", ""], [1, "Chỉ câu trả lời (1)", ""], [0, "Không có (0)", "n"]]}, {"key": "gt:3:A", "grou ntage."}, {"title": "Context A: mô tả KG", "text": "Knowledge graph entities:\n- NISQ devices (HARDWARE): Particularly well-suited to VQC.; Near-term quantum processors with hardware limitations.; Current devi\n- Variational Quantum Algorithms (ALGORITHM): Framework where both generator and discriminator are expressed as parameterized quantum circuits.\n- Near-Term Intermediate Scale Quantum (ORGANIZATION): NISQ devices suffer from limited coherence times and gate infidelities.\n- NISQ (CONCEPT): Imperfect performance quantum devices.; Current era of quantum computing.\n\nKnowledge graph relations:\n- Variational Quantum Algorithms -- NISQ devices: VQAs are used to achieve quantum advantage on NISQ devices.\n- Variational Quantum Algorithms -- accuracy: VQAs face challenges in accuracy.\n- Variational Quantum Algorithms -- quantum hardware: VQAs will beneﬁt from better quantum hardware.\n- Variational Quantum Algorithms -- qubit: VQAs address constraints of current quantum devices with limited qubits.\n- Variational Quantum Algorithms -- near-term quantum advantage: VQAs may be the key to obtaining near-term quantum advantage.\n- Variational Quantum Algorithms -- error mitigation: VQAs can benefit from error mitigation techniques.", "kind": "kg"}, {"title": "Context A: các đoạn văn", "text": "[Đoạn 1] Variational quantum algorithms · trang 1\nMoreover, VQAs leverage the toolbox of classical optimization, since VQAs use parametrized quantum circuits to be run on the quantum computer, and then outsource the parameter optimization to a classical optimizer. Although they may be the key to obtaining near-term quantum advantage, VQAs still face important challenges, including their trainability, accuracy, and eﬃ\n\n[Đoạn 2] Variational quantum algorithms · trang 3\nkeep the circuit depth and ancilla requirements small. This is due to the fact that NISQ devices are prone to gate errors, have limited qubit counts, and that these qubits have short decoherence times. Hence the construction of eﬃcient cost evaluation circuits is an important aspect of VQA research. B. Ansatzes Another important aspect of a VQA is its ansatz. However, some ansatz architectures are generic and ‘problem-agnostic’, meaning that they can be used even when no relevant information is readily available.\n\n[Đoạn 3] Variational quantum algorithms · trang 1\nThe key technological question is therefore how to make best use of today’s NISQ devices to achieve quantum advantage. Any such strategy must account for: limited numbers of qubits, limited connectivity of the qubits, and coherent and incoherent errors that limit quantum circuit depth. Variational Quantum Algorithms (VQAs) have emerged as the leading strategy to obtain quantum advantage on NISQ devices. Accounting for all of the constraints imposed by NISQ computers with a single strategy requires an optimization-based or learningbased approach, precisely what VQAs use.\n\n[Đoạn 4] Variational quantum algorithms · trang 23\nThe future will also see better quantum hardware become available, both in terms of qubit count and noise levels. VQAs will certainly beneﬁt from such improved hardware. These implementations will incorporate multiple state-ofthe-art strategies for enhancing VQA performance. Combining strategies for improving the accuracy, trainability, and eﬃciency of VQAs will test their ultimate capabilities and will push the boundaries of NISQ devices, with the grand vision of obtaining quantum advantage."}, {"title": "Câu trả lời B", "text": "Variational quantum algorithms (VQAs) are considered the leading strategy for NISQ devices because they can operate with the limited qubits and noisy environment of current quantum hardware, leveraging classical optimization techniques. They must account for constraints such as limited numbers of qubits, limited connectivity, and coherent and incoherent errors that limit quantum circuit depth. Improving gate accuracy matters for near-term platforms because it directly impacts the reliability and performance of VQAs, enabling more complex and accurate computations on NISQ devices."}, {"title": "Context B: mô tả KG", "text": "Knowledge graph entities:\n- NISQ devices (HARDWARE): Particularly well-suited to VQC.; Devices on which QFT's limitations complicate its implementation.; Near-term quantum processors with hardware limitations.; Devices emphasized for executing QML algorithms.; Current devi\n- Variational Quantum Algorithms (ALGORITHM): Framework where both generator and discriminator are expressed as parameterized quantum circuits.; Suggests QCNN as a scalable framework.; Plagued by scalability issues, notably the barren plateau phenomenon.; Algorithms\n- Near-Term Intermediate Scale Quantum (ORGANIZATION): NISQ devices suffer from limited coherence times and gate infidelities.\n- NISQ (CONCEPT): Imperfect performance quantum devices.; Current era of quantum computing.\n- quantum algorithm (ALGORITHM): Quantum algorithms in machine learning.; Key focus in the survey, applied in various fields.; Algorithm that exploits quantum mechanics to solve problems more efficiently than classical algorithms.; The complexity of the\n- Noisy Intermediate-Scale Quantum (CONCEPT): Quantum hardware in an intermediate stage of development.; Devices used in the MosaiQ framework.; Quantum computers with 50-100 qubits may perform tasks surpassing classical computers.; Describes the impending new era in\n- algorithms (ALGORITHM): Multiple algorithms are part of post-quantum cryptography.; Stable set of cryptographic algorithms like RSA/ECC.; Algorithms that need to be rotated rapidly as part of crypto-agility.; Part of cryptographic assets.\n- gate (ALGORITHM): Gates are rotations and permutations used in quantum algorithms.; The algorithm executed perfectly in the noiseless setting.; Unit of a circuit that can potentially introduce errors.\n\nKnowledge graph relations:\n- Variational Quantum Algorithms -- NISQ devices: VQAs are used to achieve quantum advantage on NISQ devices.; VQAs account for constraints imposed by NISQ computers.; VQA research is important for mitigating issues with NISQ devices.\n- Variational Quantum Algorithms -- accuracy: VQAs face challenges in accuracy.\n- Variational Quantum Algorithms -- quantum hardware: VQAs will beneﬁt from better quantum hardware.\n- Variational Quantum Algorithms -- qubit: VQAs address constraints of current quantum devices with limited qubits.\n- Variational Quantum Algorithms -- near-term quantum advantage: VQAs may be the key to obtaining near-term quantum advantage.\n- Variational Quantum Algorithms -- eﬃ: VQAs face challenges in eﬃ.\n- state-of-the-art strategies -- Variational Quantum Algorithms: Strategies will be combined to enhance VQA performance.\n- Variational Quantum Algorithms -- circuit depth: VQAs can optimize circuit structure to reduce depth.; Strategies address challenges like keeping circuit depth shallow.\n- Variational Quantum Algorithms -- Near-Term Intermediate Scale Quantum (NISQ) processors: Validation of variational algorithms lies in their successful deployment on NISQ processors.\n- Variational Quantum Algorithms -- error mitigation: VQAs can benefit from error mitigation techniques.\n- Variational Quantum Algorithms -- quantum advantage: VQAs appear to be the best hope for obtaining quantum advantage.\n- Variational Quantum Algorithms -- quantum algorithm: VQAs are competitors to quantum algorithms developed for the fault-tolerant era.", "kind": "kg"}, {"title": "Context B: các đoạn văn", "text": "[Đoạn 1] Variational quantum algorithms · trang 1\nVQAs are arguably the quantum analog of highly successful machine-learning methods, such as neural networks. Moreover, VQAs leverage the toolbox of classical optimization, since VQAs use parametrized quantum circuits to be run on the quantum computer, and then outsource the parameter optimization to a classical optimizer. This approach has the added advantage of keeping the quantum circuit depth shallow and hence mitigating noise, in contrast to quantum algorithms developed for the fault-tolerant era. VQAs have already been considered for a plethora of applications (see Figure 3), covering essentially all of the applications that researchers had envisioned for quantum computers. Although they may be the key to obtaining near-term quantum advantage, VQAs still face important challenges, including their trainability, accuracy, and eﬃarXiv:2012.09265v2 [quant-ph] 4 Oct 2021\n\n[Đoạn 2] Variational quantum algorithms · trang 3\nkeep the circuit depth and ancilla requirements small. This is due to the fact that NISQ devices are prone to gate errors, have limited qubit counts, and that these qubits have short decoherence times. Hence the construction of eﬃcient cost evaluation circuits is an important aspect of VQA research. B. Ansatzes Another important aspect of a VQA is its ansatz. Generically speaking the form of the ansatz dictates what the parameters θ are, and hence, how they can be trained to minimize the cost. The speciﬁc structure of an ansatz will generally depend on the task at hand, as in many cases one can use information about the problem to tailor an ansatz. These are the so-called ‘problem-inspired ansatze’. However, some ansatz architectures are generic and ‘problem-agnostic’, meaning that they can be used even when no relevant information is readily available. For the cost function in Eq. (3), the parameters θ can\n\n[Đoạn 3] Variational quantum algorithms · trang 1\nspeedup for practical applications, which is often called quantum advantage, has yet to be realized. Moreover, the availability of fault-tolerant quantum computers appears ∗e-mail: cerezo@lanl.gov † e-mail: pcoles@lanl.gov to still be many years, or even decades, away. The key technological question is therefore how to make best use of today’s NISQ devices to achieve quantum advantage. Any such strategy must account for: limited numbers of qubits, limited connectivity of the qubits, and coherent and incoherent errors that limit quantum circuit depth. Variational Quantum Algorithms (VQAs) have emerged as the leading strategy to obtain quantum advantage on NISQ devices. Accounting for all of the constraints imposed by NISQ computers with a single strategy requires an optimization-based or learningbased approach, precisely what VQAs use. VQAs are arguably the quantum analog of highly successful machine-learning methods, such as neural networks. Moreover, VQAs leverage the toolbox of\n\n[Đoạn 4] Variational quantum algorithms · trang 23\n23 cloud-based quantum computing platforms, to allow uses to obtain accurate results with ease. The future will also see better quantum hardware become available, both in terms of qubit count and noise levels. VQAs will certainly beneﬁt from such improved hardware. Moreover, VQAs will play a central role in benchmarking the capabilities of these new platforms. In the near future, VQAs will likely see a shift from the proposal and development phase to the implementation phase. Researchers will aim to implement larger, more realistic problems with VQAs instead of toy problems. These implementations will incorporate multiple state-ofthe-art strategies for enhancing VQA performance. Combining strategies for improving the accuracy, trainability, and eﬃciency of VQAs will test their ultimate capabilities and will push the boundaries of NISQ devices, with the grand vision of obtaining quantum advantage. In the more distant future, VQAs will even ﬁnd use"}, {"key": "gt:0:A", "group": "Ý 1 của ground truth", "text": "Ý 1. Fault-tolerant quantum computers are still years or decades away.", "prompt": "Câu trả lời A: ý này có trong câu trả lời A? có trong context A?", "options": [[3, "Context và câu trả lời (3)", "y"], [2, "Chỉ context (2)", ""], [1, "Chỉ câu trả lời (1)", ""], [0, "Không có (0)", "n"]]}, {"key": "gt:0:B", "group": "Ý 1 của ground truth", "prompt": "Câu trả lời B: ý này có trong câu trả lời rả lời A? có trong context A?", "options": [[3, "Context và câu trả lời (3)", "y"], [2, "Chỉ context (2)", ""], [1, "Chỉ câu trả lời (1)", ""], [0, "Không có (0)", "n"]]}, {"key": "gt:7:B", "group": "Ý 8 của ground truth", "prompt": "Câu trả lời B: ý này có trong câu trả lời B? có trong context B?", "options": [[3, "Context và câu trả lời (3)", "y"], [2, "Chỉ context (2)", ""], [1, "Chỉ câu trả lời (1)", ""], [0, "Không có (0)", "n"]]}, {"key": "gt:8:A", "group": "Ý 9 của ground truth", "text": "Ý 9. More accurate gates lower the overhead of quantum error correction later.", "prompt": "Câu trả lời A: ý này có trong câu trả lời A? có trong context A?", "options": [[3, "Context và câu trả lời (3)", "y"], [2, "Chỉ context (2)", ""], [1, "Chỉ câu trả lời (1)", ""], [0, "Không có (0)", "n"]]}, {"key": "gt:8:B", "group": "Ý 9 của ground truth", "prompt": "Câu trả lời B: ý này có trong câu trả lời B? có trong context B?", "options": [[3, "Context và câu trả lời (3)", "y"], [2, "Chỉ context (2)", ""], [1, "Chỉ câu trả lời (1)", ""], [0, "Không có (0)", "n"]]}]}, {"code": "C30", "title": "câu hỏi 30/30", "blocks": [{"title": "Câu hỏi", "text": "How is the trojan gate attack on quantum circuit models for 6G resource allocation constructed, and why is it stealthy?"}, {"title": "Ground truth", "text": "Adversarial perturbations are inserted as subcircuits into regions of the quantum circuit model with limited error detection; the natural noise and decoherence of quantum systems mask these perturbations, making errors hard to attribute to malicious interference."}, {"title": "Câu trả lời A", "text": "The trojan gate attack on the quantum circuit model for 6G resource allocation is constructed by embedding it in low-error-detection regions of the model. This makes it difficult to attribute errors to malicious interference, enhancing the stealthiness of the attack. The natural presence of noise and decoherence in quantum systems further masks these perturbations."}, {"title": "Con antum Machine Learning for Cybersecurity · trang 1\nQuantum Circuits (VQCs), and Quantum Generative Adversarial Networks (QGANs), and discusses the contributions of this paper in relation to existing research in the field and how it improves over them. It also maps these methods across supervised, unsupervised, and generative learning paradigms, and to core cybersecurity tasks, including intrusion and anomaly detection, malware and botnet classification, and encrypted-traffic analytics. It also discusses their application in the domain of cloud computing security, where QML can enhance secure and scalable operations. While this has led to better connectivity and delivery of service, it has also resulted in increased exposure to complex cyber threats.\n\n[Đoạn 3] Quantum Machine Learning for 6G Network · trang 4\nThe quantum superposition state space ρ includes CQI(Channel Quality Information), PMI(Precoding Matrix Indicator), CRI(CSI-RS Resource Indicator), SSBRI(SS/PBCH Resource Block Indicator), CSI-RS-ResourceList, CSI-RSResourceMapping. PRB Requests QML-based 6G resource allocation 𝑅𝑥(𝛼4) Trojan gate Wrong RBs assignment Qubit User 1 User 4 User 2 User 3 Action X Perturbated signals/ requests Attack trigger Reinforcement learning agent Task environment Policy gradient algorithm Reward Update Quantum learning design State Fig. 4: An illustration of a simple QML architecture shows classical features being transformed into quantum states\n\n[Đoạn 4] Quantum Computing in the NISQ era and beyond · trang 9\nNaively one might expect that, for a generic circuit with G gates, a single fault anywhere in the circuit could cause the computation to fail; if so, then we cannot execute the circuit reliably if the error rate per gate is much larger than 1/G. In particular, for some of the quantum simulation algorithms of interest to physicists, there are only a relatively small number of circuit locations where a faulty gate can cause the computation to fail badly. This feature ỉ context (2)", ""], [1, "Chỉ câu trả lời (1)", ""], [0, "Không có (0)", "n"]]}, {"key": "gt:3:B", "group": "Ý 4 của ground truth", "prompt": "Câu trả lời B: ý này có trong câu trả lời B? có trong context B?", "options": [[3, "Context và câu trả lời (3)", "y"], [2, "Chỉ context (2)", ""], [1, "Chỉ câu trả lời (1)", ""], [0, "Không có (0)", "n"]]}]}]}</script>
<script>
// Khuôn phiếu chung: mỗi mục (case) gồm các khung chỉ đọc (sections) và các ô cần chấm (items, mỗi ô một nhóm nút).
// DATA = {sheet_id, title, file, guide: [[tiêu đề, mô tả]], cases: [{code, title, blocks: [...]}]}; block là khung đọc
// {title, text, kind} hoặc ô chấm {key, prompt, group, text, options: [[giá trị, nhãn, "y"|"n"|""]]}, hiện theo thứ tự.
if (document.getElementById("data").textContent.includes("__" + "DATA" + "__")) {
  document.body.innerHTML = "<p style='padding:24px;font-size:17px'>Đây là file mẫu, chưa có dữ liệu.</p>";
  throw new Error("template");
}
const DATA = JSON.parse(document.getElementById("data").textContent);
if (DATA.title) { document.getElementById("title").textContent = DATA.title; document.title = DATA.title; }
const STORE = "phieu_" + DATA.sheet_id;
const items = DATA.cases.flatMap(c => c.blocks.filter(b => b.key).map(it => ({code: c.code, key: it.key, options: it.options})));
const k = (code, key) => `${code}|${key}`;
let state = {labels: {}, notes: {}, current: 0};
try { const s = JSON.parse(localStorage.getItem(STORE)); if (s && s.labels) state = {...state, ...s}; } catch (e) {}
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} };

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [a, v] of Object.entries(attrs)) {
    if (a === "class") e.className = v; else if (a.startsWith("on")) e.addEventListener(a.slice(2), v); else e.setAttribute(a, v);
  }
  for (const x of kids) e.append(x);
  return e;
}
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 2200); }
function caseStatus(code) {
  const its = items.filter(i => i.code === code);
  const done = its.filter(i => state.labels[k(i.code, i.key)] !== undefined).length;
  return done === its.length ? "done" : done ? "partial" : "";
}
function progress() {
  const done = items.filter(i => state.labels[k(i.code, i.key)] !== undefined).length;
  document.getElementById("bar").style.width = (100 * done / items.length) + "%";
  document.getElementById("ptext").textContent =
    `${done}/${items.length} ô · ${DATA.cases.filter(c => caseStatus(c.code) === "done").length}/${DATA.cases.length} mục xong`;
}
function renderNav() {
  const ol = document.getElementById("nav"); ol.replaceChildren();
  DATA.cases.forEach((c, i) => ol.append(el("li", {}, el("button", {
    class: [caseStatus(c.code), i === state.current ? "current" : ""].join(" "),
    "aria-current": i === state.current ? "true" : "false", onclick: () => go(i)}, c.code))));
}
function labelRow(code, it) {
  const key = k(code, it.key), v = state.labels[key];
  const box = el("div", {class: "label" + (v !== undefined ? " set" : "")});
  const note = el("input", {type: "text", placeholder: "Ghi chú (không bắt buộc)", value: state.notes[key] || ""});
  note.addEventListener("change", () => { state.notes[key] = note.value; save(); });
  box.append(el("span", {class: "q"}, it.prompt),
    ...it.options.map(([val, txt, cls]) => el("button", {class: cls || "", "aria-pressed": String(v === val),
      onclick: () => { state.labels[key] = val; save(); refresh(); }}, txt)), note);
  return box;
}
function renderCase() {
  const c = DATA.cases[state.current], root = document.getElementById("case"), y = window.scrollY;
  root.replaceChildren(el("div", {class: "card"}, el("div", {class: "qhead"}, el("h2", {}, c.code + (c.title ? " · " + c.title : "")),
    el("span", {class: "hint"}, `Mục ${state.current + 1}/${DATA.cases.length}`))));
  let card = null, group = null;
  for (const it of c.blocks) {
    if (!it.key) {
      root.append(el("div", {class: "card" + (it.kind ? " " + it.kind : "")}, el("h2", {}, it.title), el("p", {}, it.text)));
      card = null; continue;
    }
    if (!card || it.group !== group) {
      group = it.group; card = el("div", {class: "card"}, ...(group ? [el("h2", {}, group)] : [])); root.append(card);
    }
    if (it.text) card.append(el("p", {class: "claim"}, it.text));
    card.append(labelRow(c.code, it));
  }
  window.scrollTo(0, y);
}
function refresh() { renderNav(); progress(); renderCase(); }
function go(i) { state.current = Math.max(0, Math.min(DATA.cases.length - 1, i)); save(); refresh(); window.scrollTo(0, 0); }
document.getElementById("prev").onclick = () => go(state.current - 1);
document.getElementById("next").onclick = () => go(state.current + 1);
document.getElementById("next-todo").onclick = () => {
  const n = DATA.cases.length;
  for (let s = 1; s <= n; s++) { const i = (state.current + s) % n; if (caseStatus(DATA.cases[i].code) !== "done") return go(i); }
  if (caseStatus(DATA.cases[state.current].code) !== "done") return go(state.current);
  toast("Đã chấm xong toàn bộ, hãy bấm Xuất JSON.");
};
document.getElementById("export").onclick = () => {
  const labels = items.map(i => ({code: i.code, key: i.key, label: state.labels[k(i.code, i.key)] ?? null,
                                  note: state.notes[k(i.code, i.key)] || ""}));
  const done = labels.filter(l => l.label !== null).length;
  if (done < labels.length && !confirm(`Còn ${labels.length - done} ô chưa chấm. Vẫn xuất (để lưu tạm)?`)) return;
  const out = {sheet_id: DATA.sheet_id, exported_at: new Date().toISOString(), n_total: labels.length, n_done: done, labels};
  const a = el("a", {href: URL.createObjectURL(new Blob([JSON.stringify(out, null, 1)], {type: "application/json"})),
                     download: DATA.file || "human_labels.json"});
  document.body.append(a); a.click(); a.remove();
  toast(`Đã xuất ${done}/${labels.length} ô`);
};
document.getElementById("import").onchange = async (ev) => {
  const f = ev.target.files[0]; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (d.sheet_id !== DATA.sheet_id) { toast("File JSON không khớp phiếu này (sheet_id khác)."); return; }
    const valid = new Map(items.map(i => [k(i.code, i.key), new Set(i.options.map(o => o[0]))]));
    for (const l of d.labels) { const key = k(l.code, l.key);
      if (valid.get(key)?.has(l.label)) state.labels[key] = l.label; if (l.note) state.notes[key] = l.note; }
    save(); refresh(); toast(`Đã nhập ${d.labels.filter(l => l.label !== null).length} ô.`);
  } catch (e) { toast("Không đọc được file JSON."); }
  ev.target.value = "";
};
document.getElementById("guide-list").append(...DATA.guide.flatMap(([t, d]) => [el("dt", {}, t), el("dd", {}, d)]));
if (!Object.keys(state.labels).length) document.getElementById("guide").open = true;
refresh();
</script>
