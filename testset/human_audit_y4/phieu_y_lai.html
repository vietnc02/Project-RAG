<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phiếu chấm tay</title>
<style>
:root {
  --bg: #f7f7f5; --surface: #ffffff; --surface2: #f0f0ec; --ink: #1d1d1b; --ink2: #55554f; --line: #dcdcd6;
  --accent: #1c5cab; --accent-ink: #ffffff; --yes: #1f7a4d; --yes-bg: #e3f3ea; --no: #b3261e; --no-bg: #fbe9e7;
  --todo: #fff2b3; --kg: #f3f0fa; --mark: #cfe3ff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161615; --surface: #1f1f1d; --surface2: #2a2a27; --ink: #ecece8; --ink2: #a8a8a0; --line: #3a3a36;
    --accent: #6ea2e6; --accent-ink: #0d1a2b; --yes: #6fcf97; --yes-bg: #1d3528; --no: #f28b82; --no-bg: #3d1f1c;
    --todo: #4a4220; --kg: #26222f; --mark: #24456e;
  }
}
:root[data-theme="dark"] {
  --bg: #161615; --surface: #1f1f1d; --surface2: #2a2a27; --ink: #ecece8; --ink2: #a8a8a0; --line: #3a3a36;
  --accent: #6ea2e6; --accent-ink: #0d1a2b; --yes: #6fcf97; --yes-bg: #1d3528; --no: #f28b82; --no-bg: #3d1f1c;
  --todo: #4a4220; --kg: #26222f; --mark: #24456e;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 system-ui, "Segoe UI", Roboto, sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
  padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
header h1 { font-size: 16px; margin: 0 12px 0 0; }
.progress { flex: 1 1 200px; min-width: 160px; }
.bar { height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
.bar > div { height: 100%; background: var(--accent); width: 0; transition: width .2s; }
.progress small { color: var(--ink2); }
button, .filebtn { font: inherit; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 6px; padding: 6px 12px; cursor: pointer; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button:focus-visible, .filebtn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.layout { display: grid; grid-template-columns: 200px 1fr; gap: 16px; max-width: 1200px; margin: 0 auto; padding: 16px; }
nav { position: sticky; top: 70px; align-self: start; max-height: calc(100vh - 90px); overflow: auto; }
nav ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
nav button { width: 100%; padding: 6px 0; font-size: 13px; }
nav button.done { background: var(--yes-bg); border-color: var(--yes); }
nav button.partial { background: var(--todo); }
nav button.current { outline: 2px solid var(--accent); }
main { min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-bottom: 12px; }
.card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink2); margin: 0 0 6px; }
.card p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.qhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.qhead h2 { font-size: 20px; text-transform: none; letter-spacing: 0; color: var(--ink); margin: 0; }
.kg p { background: var(--kg); padding: 10px; border-radius: 6px; font-size: 13px; max-height: 340px; overflow: auto; }
.passage .src { color: var(--ink2); font-size: 13px; margin-bottom: 6px; }
.label { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; padding: 8px 10px;
  border-radius: 6px; background: var(--todo); }
.label.set { background: var(--surface2); }
.label .q { flex: 1 1 260px; font-weight: 600; }
.label button[aria-pressed="true"].y { background: var(--yes-bg); border-color: var(--yes); color: var(--yes); font-weight: 700; }
.label button[aria-pressed="true"].n { background: var(--no-bg); border-color: var(--no); color: var(--no); font-weight: 700; }
.label input { flex: 1 1 100%; font: inherit; font-size: 13px; padding: 5px 8px; border: 1px solid var(--line);
  border-radius: 5px; background: var(--surface); color: var(--ink); }
.claim { padding: 8px 0 0; border-top: 1px dashed var(--line); margin-top: 10px; }
.claim:first-of-type { border-top: 0; }
.pager { display: flex; justify-content: space-between; gap: 8px; margin: 16px 0 40px; flex-wrap: wrap; }
details.guide { margin-bottom: 12px; }
details.guide summary { cursor: pointer; font-weight: 600; }
details.guide dl { margin: 8px 0 0; }
details.guide dt { font-weight: 700; margin-top: 8px; }
details.guide dd { margin: 2px 0 0; color: var(--ink2); }
.hint { color: var(--ink2); font-size: 13px; }
mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 2px; }
.terms { margin-top: 8px; font-size: 13px; color: var(--ink2); display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: baseline; }
.terms b { color: var(--ink); font-weight: 600; margin-right: 2px; }
.chip { border-radius: 10px; padding: 1px 8px; border: 1px solid var(--line); background: var(--surface); white-space: nowrap; }
.chip.hit { background: var(--mark); border-color: transparent; color: var(--ink); }
.chip.miss { text-decoration: line-through; opacity: .75; }
.chip small { color: var(--ink2); margin-left: 3px; }
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 4px; }
.compare > div { background: var(--surface2); border-radius: 6px; padding: 8px 10px; }
@media (max-width: 760px) { .compare { grid-template-columns: 1fr; } }
body.nohl mark { background: none; padding: 0; }
body.nohl .terms { display: none; }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg);
  padding: 8px 14px; border-radius: 6px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
@media (max-width: 760px) {
  .layout { grid-template-columns: 1fr; }
  nav { position: static; max-height: none; }
  nav ol { grid-template-columns: repeat(6, 1fr); }
}
</style>

ggest transitioning away from RSA in favor of Kyber.\n- Kyber -- SABER: Kyber outperformed SABER based on RAM usage and code size.; Both algorithms perform key generation, encapsulation, and decapsulation.\n- RSA-2048 -- Kyber-1024: RSA-2048 is less efficient than Kyber-1024.\n- Kyber -- hash-based signatures: Kyber is a quantum-resistant key exchange algorithm.\n- Kyber -- crypto-agile: Kyber can be implemented in a crypto-agile manner.\n- Shor’s algorithm -- Kyber: Shor’s algorithm cannot effectively address the security of Kyber.\n- Hybrid cryptographic deployments -- Kyber: Hybrid deployments combine existing classical schemes with quantum-resistant algorithms like Kyber.\n- Diffie-Hellman Key Exchange -- RSA: Shares vulnerabilities due to dependence on discrete logarithms.\n- Kyber -- TLS 1.3: Kyber has been tested in TLS 1.3 handshakes.; Kyber is used in TLS 1.3 in Apache.\n- factoring -- RSA: Breaking RSA on a quantum computer could be asymptotically faster than encrypting with RSA on a classical computer.", "kind": "kg"}, {"title": "Context A: các đoạn văn", "text": "[Đoạn 1] A Comparative Study of Classical and Post-Quantum Cryptographic Algorithms in the Era of Quantum Computing · trang 11\nAs outlined in Table 2, the move to post-quantum algorithms entails a shift to problems presumed hard even for quantum computers. However, these assumptions are less mature, and long-term cryptanalysis remains crucial. 5.4 Implementation Considerations In real-world deployment, factors like hardware support, implementation maturity, susceptibility to side-channel attacks, and ease of integration into existing protocols play an equally important role. For instance, Kyber and Dilithium have been successfully integrated into OpenSSL prototypes and tested in TLS 1.3 handshakes, proving their compatibility with current infrastructures. 5.5 Summary of Practical Trade-offs • Performance: Post-quantum algorithms like Kyber outperform RSA in key exchange speed but may lag in signing tasks compared to ECC. • Bandwidth: Signature and key sizes remain major limitations for postquantum algorithms in resource-constrained environments.\n\n[Đoạn 2] A Comparative Study of Classical and Post-Quantum Cryptographic Algorithms in the Era of Quantum Computing · trang 2\n1.1 RSA (Rivest–Shamir–Adleman): Introduced in 1978, RSA is a public-key cryptosystem that relies on the difficulty of factoring large composite numbers. [17]. It supports key encapsulation, digital signatures, and plays a crucial role in certificate authorities and TLS handshakes. [3]. However, Shor’s algorithm makes RSA insecure by efficiently solving integer factorization. [11]. Current guidelines suggest transitioning away from RSA for sensitive data as early as 2025, with full adoption of quantum-safe alternatives like Kyber recommended before 2030. [12]. 1.2 Elliptic Curve Cryptography (ECC): ECC uses elliptic curves over finite fields to provide security equivalent to RSA but with smaller key sizes. [1]. It is prevalent in mobile devices and blockchain systems. [28]. Like RSA, ECC is vulnerable to Shor’s algorithm due to its dependence on the Elliptic Curve Discrete Logarithm Problem. [19]. Given its widespread use, migration away from ECC should be prioritized before 2030.\n\n[Đoạn 3] Next-Generation Quantum Security - The Impact of Quantum Computing on Cybersecurity—Threats, Mitigations, and Solutions · trang 18\nStrong privacy; hard to scale.    Global PQ frameworks Coordinate international PQ crypto standards. Promotes collaboration; slow to align.   quantum computers less effective against the commonly used RSA or ECC Mailbox Procedures by implementing Shor’s algorithmlinked frameworks [206], which break large integers and discrete logarithms using polynomial-time factoring. Hybrid cryptographic  strategies represent a solution to deal with the transition to quantum-resistant methods by combining quantum-resistant encryption  with existing traditional encryption systems unti aph relations:\n- Harvest-Now, Decrypt-Later -- quantum-safe cryptography: HNDL converts long-lived ciphertext into a threat to quantum-safe schemes.\n- harvest now, decrypt later -- quantum computer: HNDL attack model relies on quantum computers.; Technological advancement that renders decryption feasible.\n- quantum capabilities -- Harvest-Now, Decrypt-Later: HNDL becomes vulnerable if adversaries can harvest data today and decrypt it later.\n- post-quantum cryptography standardization -- harvest-now, decrypt-later threat: Standardization efforts address the HNDL threat.\n- harvest now, decrypt later -- government classified data: Government classified data are 95–100% exposed to HNDL.\n- Harvest-Now, Decrypt-Later -- Post-Quantum Cryptography: HNDL poses a threat to the adoption of PQC.; PQC offers protection against HNDL but migration delays preserve exposure.\n- harvest now decrypt later -- cloud environments: The window for protecting long-lived data is now, not when quantum computers arrive.\n- quantum computer -- Harvest-Now-Decrypt-Later: Quantum computers pose a threat to HNDL.; Quantum computers will break the security of HNDL.\n- harvest now, decrypt later -- healthcare records: Healthcare records are 98–100% exposed to HNDL.; Healthcare records are a target for harvest now, decrypt later.\n- harvest now, decrypt later -- NIST: NIST is mitigating the threat of HNDL.\n- Harvest-Now, Decrypt-Later -- confidentiality lifetime of data: HNDL vulnerability driven by data's confidentiality lifetime.\n- quantum-resistant cryptography -- harvest now, decrypt later: Quantum-resistant cryptography aims to counter \"harvest now, decrypt later\" attacks.", "kind": "kg"}, {"title": "Context A: các đoạn văn", "text": "[Đoạn 1] harvest-now-decrypt-later-pqc-threat-model · trang 1\nHarvest Now, Decrypt Later: A Time-Dependent Threat Model and Migration Framework for Post-Quantum Cryptography Yazan Ghayad January 2026 Abstract Quantum computers capable of breaking RSA-2048 are projected to arrive by 2030 ± 3 years. Our analysis of 100+ primary sources shows that 98–100% of healthcare records and 95–100% of government classified data encrypted today face certain retroactive decryption under the “Harvest Now, Decrypt Later” (HNDL) attack model—where adversaries collect encrypted data now and wait for quantum computers to break it later. This paper introduces a formal time-dependent risk model quantifying exposure as a function of data confidentiality lifetime (Ld) and attacker decryption horizon (Ha). Using the vulnerability condition Ld > Ha, we evaluate sector-specific risk across healthcare, finance, government, and cloud environments, demonstrating that long-lived sensitive data faces near-certain compromise under classical cryptography.\n\n[Đoạn 2] harvest-now-decrypt-later-pqc-threat-model · trang 13\nThese data are prime targets for HNDL attacks. 5. The Harvest Now, Decrypt Later (HNDL) Threat Model 5.1 Definition and Terminology Harvest Now, Decrypt Later (HNDL), also referred to as “store now, decrypt later” or “retrospective decryption,” describes a cybersecurity attack strategy in which an adversary: 1. Intercepts, exfiltrates, or otherwise copies encrypted data during the present day 2. Stores that encrypted data in secure archives without attempting to decrypt it immediately 3. Waits for technological advancement (specifically, quantum computers) to render decryption feasible 4. Retroactively decrypts the historical data, exploiting information that was encrypted at the time of collection HNDL differs fundamentally from traditional cybersecurity breaches in several ways: • Temporal Asymmetry: The adversary collects data when it is protected by strong encryption but decrypts it at a future point when cryptographic defenses have weakened.\n\n[Đoạn 3] Harvest-Now, Decrypt-Later - A Temporal Cybersecurity Risk in the Quantum Transition · trang 1\nquantum-safe cryptography; hybrid TLS; telecom security 1. Introduction Encryption underpins the trustworthiness of modern communications, but confidentiality guarantees are only as strong as the adversary’s horizon. In practice, attackers can harvest encrypted traffic today and defer decryption until future computational breakthroughs render current schemes obsolete [1,2]. This “harvest-now, decrypt-later” (HNDL) strategy converts long-lived ciphertext into a temporal cyberweapon, threatening not only cryptographic primitives but also the infrastructures and archives that depend on them [3,4]. The phrase HNDL has circulated in industry and policy discourse since the mid-2010s, often attributed to practitioners such as Andersen Cheng, yet it has remained largely informal in the academic literature [5]. Existing studies are piecemeal: for example, recent studies forecasts the feasibility of post-quantum cryptography (PQC) adoption under\n\n[Đoạn 4] Harvest-Now, Decrypt-Later - A Temporal Cybersecurity Risk in the Quantum Transition · trang 5\nwith optimistic, median, and pessimistic scenarios, which allows financial institutions to estimate HNDL exposure across multiple timelines instead of relying on point predictions [27]. This probabilistic treatment aligns with broader industry and academic views that quantum-break timelines carry deep uncertainty and should be represented through scenario distributions rather than deterministic dates [16,22]. Within these models, the central driver of HNDL vulnerability is the confidentiality lifetime of data. Financial institutions retain sensitive records for long periods, often seven to ten years or more due to regulatory requirements. This creates a large exposure window: any encrypted data that must remain secret for a decade becomes vulnerable if adversaries can harvest it today and decrypt it once quantum capability arrives within that horizon. Literature consistently notes that data requiring confidentiality beyond roughly ten years"}, {"title": "Câu trả lời B", "text": "Under the Harvest-Now, Decrypt-Later (HNDL) model, encrypted data transmitted or stored today without quantum resistance faces a significant threat. Adversaries can harvest this data now and wait until quantum computers can decrypt it, making the data vulnerable even if it was encrypted securely at the time of transmission or storage."}, {"title": "Context B: mô tả KG", "text": "Knowledge graph entities:\n- harvest now decrypt later (CONCEPT): The window for protecting long-lived data is now, not when quantum computers arrive.\n- harvest now, decrypt later (ATTACK): Attack where data is captured and decrypted once quantum capabilities are available.\n- Harvest-Now-Decrypt-Later (PROTOCOL): Protocol for protecting data against quantum computing threats.\n- harvest-now, decrypt-later (HNDL) adversary (ATTACK): Adversary model that harvests data now and decrypts it later.\n\nKnowledge graph relations:\n- Harvest-Now, Decrypt-Later -- quantum-safe cryptography: HNDL converts long-lived ciphertext into a threat to quantum-safe schemes.\n- harvest now, decrypt later -- quantum computer: HNDL attack model relies on quantum computers.; Technological advancement that renders decryption feasible.\n- quantum capabilities -- Harvest-Now, Decrypt-Later: HNDL becomes vulnerable if adversaries can harvest data today and decrypt it later.\n- post-quantum cryptography standardization -- harvest-now, decrypt-later threat: Standardization efforts address the HNDL threat.\n- Harvest-Now, Decrypt-Later -- Post-Quantum Cryptography: PQC offers protection against HNDL but migration delays preserve exposure.\n- Harvest-Now, Decrypt-Later -- confidentiality lifetime of data: HNDL vulnerability driven by data's confidentiality lifetime.", "kind": "kg"}, {"title": "Context B: các đoạn văn", "text": "[Đoạn 1] harvest-now-decrypt-later-pqc-threat-model · trang 1\nHarvest Now, Decrypt Later: A Time-Dependent Threat Model and Migration Framework for Post-Quantum Cryptography Yazan Ghayad January 2026 Abstract Quantum computers capable of breaking RSA-2048 are projected to arrive by 2030 ± 3 years. Our analysis of 100+ primary sources shows that 98–100% of healthcare records and 95–100% of government classified data encrypted today face certain retroactive decryption under the “Harvest Now, Decrypt Later” (HNDL) attack model—where adversaries collect encrypted data now and wait for quantum computers to break it later.\n\n[Đoạn 2] harvest-now-decrypt-later-pqc-threat-model · trang 13\nThe Harvest Now, Decrypt Later (HNDL) Threat Model 5.1 Definition and Terminology Harvest Now, Decrypt Later (HNDL), also referred to as “store now, decrypt later” or “retrospective decryption,” describes a cybersecurity attack strategy in which an adversary: 1. Intercepts, exfiltrates, or otherwise copies encrypted data during the present day 2. Waits for technological advancement (specifically, quantum computers) to render decryption feasible 4. Retroactively decrypts the historical data, exploiting information that was encrypted at the time of collection HNDL differs fundamentally from traditional cybersecurity breaches in several ways:\n\n[Đoạn 3] Harvest-Now, Decrypt-Later - A Temporal Cybersecurity Risk in the Quantum Transition · trang 1\nIn practice, attackers can harvest encrypted traffic today and defer decryption until future computational breakthroughs render current schemes obsolete. This “harvest-now, decrypt-later” (HNDL) strategy converts long-lived ciphertext into a temporal cyberweapon, threatening not only cryptographic primitives but also the infrastructures and archives that depend on them. Existing studies are piecemeal: for example, recent studies forecasts the feasibility of post-quantum cryptography (PQC) adoption under\n\n[Đoạn 4] Harvest-Now, Decrypt-Later - A Temporal Cybersecurity Risk in the Quantum Transition · trang 5\nwith optimistic, median, and pessimistic scenarios, which allows financial institutions to estimate HNDL exposure across multiple timelines instead of relying ats beyond cryptography.; Quantum computers can run quantum algorithms.; Quantum algorithms for simulating quantum dynamics may be too expensive to succeed without error correcti\n- quantum computer -- approximate optimization: Quantum computers might have an advantage for approximate optimization.\n- quantum computer -- strongly correlated matter: Quantum computers seem to have a clear advantage over classical ones in simulating strongly correlated matter.\n- Deutsch and Jozsa -- classical computer: These papers showed problems that quantum computers can solve more efficiently than classical computers.", "kind": "kg"}, {"title": "Context A: các đoạn văn", "text": "[Đoạn 1] Polynomial-Time Algorithms for Prime Factorization and Discrete Logarithms on a Quantum Computer · trang 3\ncomputer that cannot also be computed in polynomial time on a classical computer with a random number generator. However, if we let the precision grow polynomially in the input size (that is, we let the number of bits of precision grow logarithmically in the input size), we appear to obtain a more powerful type of computer. Allowing the same polynomial growth in precision does not appear to confer extra computing power to classical mechanics, although allowing exponential growth in precision does [Hartmanis and Simon 1974, Vergis et al. 1986]. As far as we know, what precision is possible in quantum state manipulation is dictated not by fundamental physical laws but by the properties of the materials and the architecture with which a quantum computer is built. It is currently not clear which architectures, if any, will give high precision, and what this precision will be. If the precision of a quantum computer is large enough to make it more powerful than a classical\n\n[Đoạn 2] Quantum Computing in the NISQ era and beyond · trang 7\nAt least in the near term quantum computers are likely to be special purpose devices, which most users will access via the cloud. When we speak of a quantum speedup, we typically mean that the quantum computer solves the problem faster than competing classical computers using the best available hardware and running the best algorithm which performs the same task. (Arguably, though, quantum technology might be preferred even if classical supercomputers run faster, if for example the quantum hardware has lower cost and lower power consumption.) In any case, we should recognize that the power of classical computers will continue to increase, with exascale systems (surpassing 1018 FLOPS) expected to be available in a few years. Quantum computers are striving to catch up with a moving target, as both classical hardware and classical algorithms continually improve. A few years ago I spoke enthusiastically about quantum supremacy as an impending\n\n[Đoạn 3] Quantum Computing in the NISQ era and beyond · trang 13\nfor semideﬁnite programs might be within reach of NISQ technology. 6.9 Quantum simulation As I have already emphasized, we expect quantum computers to be very well suited for studying the properties of highly entangled systems of many particles. As Laughlin and Pines [8] emphasized in the statement I quoted earlier, we think that simulating such “strongly correlated” matter is a diﬃcult computational problem, because many very good physicists have tried to solve it for decades and have not succeeded. Thus, as Feynman argued [9], the simulation of highly entangled quantum matter is the natural arena where quantum computers seem to have a clear advantage over classical ones. In the long term, quantum simulation using quantum computers has great potential to wield a broad inﬂuence on the world [48, 49, 50]. Advances in quantum chemistry, facilitated by quantum computing, might precipitate the design of new pharmaceuticals,\n\n[Đoạn 4] Quantum Computing in the NISQ era and beyond · trang 13\nAdvances in quantum chemistry, facilitated by quantum computing, might precipitate the design of new pharmaceuticals, and new catalysts that improve the eﬃciency of nitrogen ﬁxation or carbon capture. New materials arising from quantum simulations might lead to more eﬀective power transmission or improved collection of solar energy. We probably lack the imagination to anticipate the most transformative discoveries which will ﬂow from more powerful quantum simulators. But this promise is not so likely to be fulﬁlled in the NISQ era, because quantum algorithms for accurately simulating large molecules and exotic materials may be too expensive to succeed without error correction. Classical computers are especially bad at simulating quantum dynamics — that is, predicting how a highly-entangled quantum state will change with time. Quantum computers have a big advantage for that task, and physicists hope to learn interesting things about"}, {"title": "Câu trả lời B", "text": "Quantum computers can outperform classical computers due to their ability to handle highly entangled quantum states, which are difficult for classical computers to simulate accurately. The precision of quantum state manipulation, while not fundamentally limited by physical laws, is crucial for achieving quantum speedup. If quantum computers can achieve sufficient precision, they can solve certain problems faster than classical computers, as evidenced by the potential for polynomial-time algorithms in quantum computing that outperform classical counterparts for specific tasks."}, {"title": "Context B: mô tả KG", "text": "Knowledge graph entities:\n- quantum computer (SYSTEM): Hardware capable of performing quantum computations.\n- Classical simulation algorithms (ALGORITHM): Traditional methods potentially outperformed by quantum circuits in simulating quantum systems.\n- NISQ computers (SYSTEM): NISQ computers will likely play an important role in understanding the foundations of quantum mechanics.\n- quantum-to-classical (DEFENSE): Quantum circuits perform feature extraction while classical components handle final predictions.\n\n y that any attempt to measure a quantum state will disturb it, alerting the communicating parties to potential eavesdropping. Practical QKD experiments with attenuated lasers can be insecure because the weak signals can be intercepted and measured without detection, leading to potential eavesdropping. Quantum machine learning can help detect eavesdroppers by analyzing patterns and anomalies in the quantum states, enhancing the eavesdropping detection capability of QKD."}, {"title": "Context A: mô tả KG", "text": "Knowledge graph entities:\n- QKD (PROTOCOL): Quantum cryptography implementations like QKD.; Quantum Key Distribution protocol for secure communications.\n- Quantum Key Distribution Networks (SYSTEM): Building a QKD network at scale leads to a combinatorial explosion of needed links.\n- Quantum Key Distribution (PROTOCOL): Integrated with ML to optimize communication security.; System for quantum communication.; Methods to ens\n- Risk in quantum key distribution (CONCEPT): Quantum key distribution faces threats.\n\nKnowledge graph relations:\n- Quantum Key Distribution -- Quantum Machine Learning: Integrated ML with quantum key distribution protocols.; QML algorithms are used for detection in QKD.\n- Quantum Key Distribution -- eavesdropping detection capability: QKD includes eavesdropping detection capability.\n- Quantum Key Distribution -- eavesdropping: QKD can detect eavesdropping attempts.\n- machine learning–based anomaly detection -- Quantum Key Distribution: Can be used for event detection in QKD.\n- Quantum Key Distribution -- eavesdropper: Eavesdroppers can exploit the security offered by QKD.\n- quantum-resistant algorithms -- Quantum Key Distribution: QKD is a secure communication approach that uses quantum mechanics to protect against quantum eavesdropping attacks.", "kind": "kg"}, {"title": "Context A: các đoạn văn", "text": "[Đoạn 1] Quantum key distribution through quantum machine learning - a research review · trang 5\nTwo prominent ﬁelds o he comparative evaluation of alternative schemes-particularly multivariate, code-based, and isogeny-based approaches-remains incomplete. Many existing studies rely on benchmarks under specific conditions that may not generalize to diverse environments such as embedded IoT devices, cloud-scale infrastructures, or mission-critical systems with strict latency requirements. Second, side-channel resistance and implementation security are often treated as afterthoughts in algorithmic proposals, leaving open questions about their viability in adversarial real-world contexts. Third, the literature surveyed reveals a geographic and institutional concentration of research, which may limit the diversity of perspectives on deployment models and governance frameworks. Acknowledging these limitations clarifies the scope of the current survey and signals the need for broader and deeper engagement across the PQC research ecosystem.\n\n[Đoạn 4] A Survey of Post-Quantum Cryptography Support in Cryptographic Libraries · trang 6\n1.0.x series, Libsodium does not include support for any of the NIST PQC finalist algorithms. The library currently provides modern public-key cryptography (Curve25519-based key exchange, Ed25519 signatures, X25519/XChaCha, etc.), but no post-quantum key exchange or signature schemes have been integrated yet. The community has shown interest and asked questions regarding PQC in libsodium. Specifically, developers have inquired about the potential addition of algorithms such as Kyber or Dilithium. The lead developer of libsodium (Frank Denis) has been cautious on this front. In a discussion thread, it was noted that “ML-KEM is on the roadmap” for libsodium, but that PQC integration is complex and has not yet been completed [37]. This implies that libsodium’s author is aware of Kyber (ML-KEM) and intends to support it eventually, but no official timeline is given. Observation: For now, if quantum readiness is required, libsodium alone is insufficient – one must  algorithms (still running on classical computers) designed to be resistant to quantum attacks. These include lattice-based key encapsulation (e.g., CRYSTALS-Kyber) and digital signatures\n\n[Đoạn 3] A Hardware-Friendly Shuffling Countermeasure Against Side-Channel Attacks for Kyber · trang 1\nthree rounds, CRYSTALS-Kyber (Kyber) was chosen as the only key-encapsulation mechanism (KEM) protocol. Recently, NIST issued FIPS 203, a standard for module-latticebased key-encapsulation mechanism (ML-KEM) based on CRYSTALS-Kyber. Nevertheless, during the impending shift from existing conventional cryptographic algorithms to ML-KEM/Kyber, it is equally crucial to assess their security against physical attacks, particularly side-channel attacks (SCAs) and fault injection attacks (FIAs).\n\n[Đoạn 4] A_Comprehensive_Survey_on_Pre_Versus_Post_Quantum_Security_Schemes_for_5G-Enabled_IoT_Applications · trang 18\nChoudhury et al.: Comprehensive Survey on Pre Versus Post Quantum Security Schemes Dilithium, optimizing polynomial multiplication via Number Theoretic Transform (NTT) on resource-constrained platforms. Implemented on an Artix-7 FPGA, their accelerator achieves a speed-up of up to 34.16× for Kyber and 9.6× for Dilithium, with a corresponding 44%–96% improvement in area-timeproduct. These results highlight the suitability of their design for secure, low-latency IoT and embedded applications resistant to quantum and side-channel attacks. CRYSTALS-Kyber has seen significant deployment"}, {"title": "Câu trả lời B", "text": "In CRYSTALS-Kyber, the shared key K is derived during the encapsulation process and then re-encapsulated. This shared key is extracted in the decapsulation process and re-encapsulated to establish a shared symmetric key between Alice and Bob in a key establishment scenario."}, {"title": "Context B: mô tả KG", "text": "Knowledge graph entities:\n- CRYSTALS-Kyber (SYSTEM): Standardized as the only KEM scheme by NIST.; Key-encapsulation mechanism (KEM) protoco urity assumptions. Kyber\n\n[Đoạn 2] Are Enterprises Ready for Quantum-Safe Cybersecurity · trang 2\ncould factor RSA keys and break elliptic-curve cryptography, rendering today’s encryption and authentication fundamentally insecure [3]. The prospect of such a cryptanalytically relevant quantum computer (CRQC) has elevated an urgent question for organizations worldwide: Are enterprises ready for cybersecurity solutions based on quantum computing? This question encompasses both opportunity – the emergence of new quantum-enabled security tools – and threat – the looming “quantum apocalypse” for classical cryptography. Quantum-secure solutions have emerged in two main forms. The first is post-quantum cryptography (PQC) – new algorithms (still running on classical computers) designed to be resistant to quantum attacks. After a rigorous multi-year process, the U.S. National Institute of Standards and Technology (NIST) has recently standardized a first set of PQC algorithms [4]. These include lattice-based key encapsulation (e.g., CRYSTALS-Kyber) and digital signatures\n\n[Đoạn 3] A Hardware-Friendly Shuffling Countermeasure Against Side-Channel Attacks for Kyber · trang 1\nthree rounds, CRYSTALS-Kyber (Kyber) was chosen as the only key-encapsulation mechanism (KEM) protocol [1]. Recently, NIST issued FIPS 203, a standard for module-latticebased key-encapsulation mechanism (ML-KEM) based on CRYSTALS-Kyber. As of now, research on the efficient hardware implementations of ML-KEM/Kyber has attained a relatively mature stage [2], [3]. Nevertheless, during the impending shift from existing conventional cryptographic algorithms to ML-KEM/Kyber, it is equally crucial to assess their security against physical attacks, particularly side-channel attacks (SCAs) and fault injection attacks (FIAs). SCAs recover keys by acquiring power consumption or electromagnetic emanations from cryptographic devices, and typically employ countermeasures such as hiding or masking to defend against t tistical learning. It can deliver high-dimensional inference and optimisation under strict time and resource budgets. It doesn’t propose entirely novel pipelines. Rather, QML involves augmenting existing pipelines using quantum states to represent and transform data through parameterised unitaries that use superposition and entanglement. The representations generated by QML can lead to learning procedures difficult to emulate using traditional methods under specific assumptions about data structure and access models. In practical applications, QML is generally coupled with classical methods in a hybrid quantum–classical design. Steps\n\n[Đoạn 3] Quantum Machine Learning for Cybersecurity · trang 8\n8 THREAT DETECTION DGA BOTNET DETECTION ANOMALY DETECTION DATA HANDLING AND PRIVACY ADVERSARIAL ATTACKS MALWARE ANALYSIS 1 3 2 5 6 4 APPLICATIONS Figure 3: Application landscape of Quantum Machine Learning in cybersecurity. anomaly detection methods. This subsection also highlights their practical applications in cybersecurity. With their advent, QML models have shown impressive performance in terms of accuracy and latency. Hossain et al. [1] integrated QNNs and QSVMs in a hybrid pipeline for real-time monitoring of network traffic. The QNN achieved 96% accuracy in anomaly detection, and the QSVM achieved 93% accuracy, with the average alerting latency being near-instant at 10 ms. Exploring further, Noah et al. [25] ventured in QML for cybersecurity in 5G networks. They used hybrid simulations using the IBM Qiskit and TensorFlow Quantum frameworks. Their quantum-assisted intrusion detection system, based on QNNs, achieved 96.8% accuracy, whereas the classical\n\n[Đoạn 4] Quantum Machine Learning for Cybersecurity · trang 14\n14 X. CONCLUSIONS QML gives new hope for cybersecurity by combining quantum computation with machine learning. QML can improve detection accuracy, expose hidden anomalies, adapt to evolving threats in real time, improving much over rule-based and traditional machine learning based systems. In this review, applications of QML across healthcare, malware and botnet detection, and telecommunication security have been surveyed. QSVMs, QNNs, VQCs, and QGANs based frameworks were shown to excel in both supervised and unsupervised settings. Although hybrid qunatum-classical models, in the current NISQ era, have hardware constraints, strong potential still surfaced across studies. These findings highlight rapid progress of the field towards maturity. Limited qubit lifetimes, gaps in the interpretability of models, optimization bottlenecks, and limited hardware remain problems, but the pace of current research indicate progress toward practical and high-fidelity deployment"}, {"title": "Câu trả lời B", "text": "In healthcare, QNNs are not specifically highlighted in the provided documents. In cybersecurity, QNNs are used for intrusion detection, achieving 96.8% accuracy in a quantum-assisted system as per Noah et al.'s work."}, {"title": "Context B: mô tả KG", "text": "Knowledge graph entities:\n- Quantum Neural Networks (SYSTEM): Quantum algorithms utilized in machine learning.; Quantum architectures for neural networks.\n- Quantum Random Neural Network (SYSTEM): Applied in financial forecasting, weather prediction, and bioinformatics.\n- Quantum Machine Learning for Cybersecurity (SYSTEM): The system being discussed.; Framework using quantum models for enhanced intrusion detection.\n- Quantum Recurrent Neural Networks (SYSTEM): A type of QNN used in natural language processing and pattern recognition.\n\nKnowledge graph relations:\n- Quantum Neural Networks -- malware analysis: QNNs are used for malware analysis.\n- Quantum Neural Networks -- intrusion detection: QNNs are used for intrusion detection.\n- Quantum Neural Networks -- communication networks: QNN is applied in communication networks.\n- quantum computing -- Quantum Neural Networks: Quantum computing techniques enable QNNs.\n- Quantum Neural Networks -- resou : "Which states are used in the Vacuum+Weak decoy-state method for quantum key distribution, and what do Alice and Bob gain by measuring the decoy states?"}, {"title": "Ground truth", "text": "Only a few states are used: the vacuum, a weak decoy state with mean photon number µ_decoy ≪ 1 and a signal state with µ = O(1). By measuring the yields and QBER of the decoy states, Alice and Bob obtain reliable bounds on the single-photon parameters (Ω and e1), surpassing prior results."}, {"title": "Câu trả lời A", "text": "In the Vacuum+Weak decoy-state method for quantum key distribution, Alice uses vacuum states and weak decoy states along with standard BB84 states. By measuring the yields and QBER of these decoy states, Alice and Bob can obtain reliable bounds to detect eavesdropping attacks, surpassing prior art results and improving the security of their quantum key distribution system."}, {"title": "Context A: mô tả KG", "text": "Knowledge graph entities:\n- decoy state (SYSTEM): Used in extending the approach to real-world QKD implementations.; Additional states prepared by Alice for detecting eavesdropping attacks.; Idea used to estimate QBER.; State used to estimate QBER without revealing key \n- Alice and Bob (CONCEPT): Legitimate parties sharing a communication channel.; Parties sharing Bell states in the Lo-Chau Security Proof.; Perform error correction and privacy amplification.; Parties involved in the quantum key distribution.; Sha\n- Alice (ORGANIZATION): Prepares randomly polarized photons in the BB84 protocol.; Party involved in secure communication.; Party initiating the quantum teleportation process.; Recipient of the signed message and signature.; Parties involved in\n- Quantum Key Distribution (PROTOCOL): Technology that relies on coherence for secure communication.; Technology that ensures secure state transmission.; Integrated with ML to optimize communication security.; System for quantum communication.; Methods to ens\n- Decoy State Quantum Key Di ber, n, but not which distribution (decoy or signal) the state is from. We emphasize that the essence of the decoy state idea can be summarized by the following two equations: Yn(signal) = Yn(decoy) = Yn (4) en(signal) = en(decoy) = en. (5) While a few decoy states are suﬃcient, for ease of discussion, we will for the moment consider the case where Alice will pick an inﬁnite number of possible intensities for decoy states. Let us imagine that Alice varies over all non-negative values of µ randomly and independently for\n\n[Đoạn 3] Decoy State Quantum Key Distribution · trang 1\nmethod for the ﬁrst time makes most of the long distance QKD experiments reported in the literature unconditionally secure. Our method has the advantage that it can be implemented with essentially the current hardware. So, unlike prior art solutions based on single-photon sources, our method does not require daunting experimental developments. Our method is based on the decoy state idea ﬁrst proposed by Hwang [12]. While the idea of Hwang was highly innovative, his security analysis was heuristic. The key point of the decoy state idea is that Alice prepares a set of additional states—decoy states, in addition to standard BB84 states. Those decoy states are used for the purpose of detecting eavesdropping attacks only, whereas the standard BB84 states are used for key generation only. The only diﬀerence between the decoy state and the standard BB84 states is their intensities (i.e., their photon number distributions). By measuring the yields and QBER of decoy states, we\n\n[Đoạn 4] Decoy State Quantum Key Distribution · trang 2\nto avoid being detected, the eavesdropper, Eve, has very limited options in her eavesdropping attack. In summary, the ability for Alice and Bob to verify experimentally the values of Yn and en’s in the decoy state method greatly strengthens their power in detecting eavesdropping, thus leading to a dramatic improvement in the performance of their QKD system. The decoy st "Chỉ context (2)", ""], [1, "Chỉ câu trả lời (1)", ""], [0, "Không có (0)", "n"]]}]}, {"code": "C17", "title": "câu hỏi 17/30", "blocks": [{"title": "Câu hỏi", "text": "Which quantum mechanisms allow Shor's algorithm to factor large integers efficiently, and why does this threaten RSA?"}, {"title": "Ground truth", "text": "Shor's algorithm uses entanglement to exploit quantum parallelism, and at its core the Quantum Fourier Transform implements key subroutines exponentially faster than classical counterparts, so it factors large integers in polynomial time. RSA's security rests on the difficulty of factoring large numbers into their prime factors, so Shor's algorithm threatens RSA (and ECC)."}, {"title": "Câu trả lời A", "text": "Shor's algorithm allows efficient factorization of large integers on a quantum computer by leveraging the Quantum Fourier Transform and polynomial time complexity, specifically 𝜃((𝑙𝑜𝑔𝑁)2(𝑙𝑜𝑔(𝑙𝑜𝑔𝑁))(𝑙𝑜𝑔(𝑙𝑜𝑔(𝑙𝑜𝑔𝑁)))), which is much faster than classical algorithms. This capability threatens RSA because RSA's security relies on the difficulty of integer factorization, and Shor's algorithm can break RSA encryption by efficiently factoring the large composite numbers used in RSA keys."}, {"title": "Context A: mô tả KG", "text": "Knowledge graph entities:\n- integers (CONCEPT): Number to be factored by Shor’s algorithm.; Composite number to be factored (in RSA) 𝑁= 𝑝⋅𝑞.; Public and private exponents in RSA cryptosystem.; Private key in ECC (𝑄= 𝑘⋅𝐺).; Numbers represented in binary.\n- RSA (ALGORITHM): System that relies on the difficulty of factoring large numbers.; Public-key framework used in QMLFD-RSA.; Classical cryptographic algorithm vulnerable to quantum attacks.; Cryptographic algorithm based on integer factor\n- quantum factoring (ALGORITHM): Threat that will make RSA-2048 keys protecting TLS 1.3 handshakes vulnerable.; Algorithm improved in recent years for quantum systems.; Process of factoring integers using quantum computers.; Algorithm that factors RSA i\n- Shor algorithm for integer factorization (ALGORITHM): Quantum algorithm to solve the integer factorization problem.\n- Shor’s Factoring Algorithm (ALGORITHM): Quantum algorithm developed by Peter Shor for finding prime factors of an integer.\n- Shor algorithm (ALGORITHM): Algorithm that performs large factoring in polynomial time.; Quantum algorithm that can compromise encryption systems.\n- integer factorization (CONCEPT): Problem solved by Shor’s algorithm.; Enabled by the Quantum Fourier Transform.; Specific task that can be solved using quantum computing.; Algorithm used in RSA-2048 that is broken by Shor.; Mathematical problem intracta\n- Shor’s quantum algorithm for integer factorization of N (Shor(N)) (ALGORITHM): Quantum algorithm for integer factorization of N.\n\nKnowledge graph relations:\n- Shor’s algorithm -- quantum computing: Threatens current cryptographic systems via quantum computational power.; Quantum computing, particularly Shor’s algorithm, threatens RSA.; Quantum computing poses a threat to RSA via Shor’s algorithm.; Shor's algorithm \n- Shor’s quantum algorithm for integer factorization of N (Shor(N)) -- SLH-DSA: Shor(N) threatens SLH-DSA.\n- Shor’s Factoring Algorithm -- quantum computer: On a quantum computer, Shor’s algorithm can factor a number N in polynomial time.\n- Shor’s algorithm -- Cryptographically Relevant Quantum Computers: Shor's algorithm demonstrates that a CRQC can efficiently solve integer factorization and discrete logarithms.; A CRQC can efficiently solve the problems on which classical public-key systems depend.; Shor’s algorithm is\n- Shor’s quantum algorithm for integer factorization of N (Shor(N)) -- Module-Lattice-Based Digital Signature Algorithm: Shor(N) threatens ML-DSA.\n- Shor’s algorithm -- quantum factoring: Shor's algorithm is an example of a quantum factoring algorithm.; Shor's algorithm is used for quantum factoring.\n- Shor algorithm for integer factorization -- RSA encryption: Shor’s algorithm can efficiently decrypt RSA numbers.\n- Shor’s quantum algorithm for integer factorization of N (Shor(N)) -- Module-Lattice-Based Key-Encapsulation Mechanism: Shor(N) threatens ML-KEM.\n- Shor algorithm -- RSA encryption: Shor algorithm breaks RSA encryption by factoring large numbers.\n- Shor’s Factoring Algorithm -- quantum errors: The correction of quantum errors adds further complexity.\n- factoring -- RSA: Breaking RSA on a quantum computer could be asymptotically faster than encrypting with RSA on a classical computer.\n- Shor algorithm -- RSA: Shor's algorithm can compromise RSA.", "kind": "kg"}, {"title": "Context A: các đoạn văn", "text": "[Đoạn 1] A Survey of Quantum Machine Learning - Foundations,Algorithms, Frameworks, Data and Applications · trang 12\n91:12 F. Rodríguez-Díaz et al. 4.1.3 Shor’s Factoring Algorithm. This is a quantum algorithm developed in 1994 by Peter Shor for finding the prime factors of an integer. It is one of the few quantum algorithms with significant potential applications and strong evidence of a superpolynomial speedup compared to the bestknown classical algorithms. However, factoring numbers of practical importance requires more qubits than will be available in the near future, and the correction of quantum errors adds further complexity. Shor also proposed algorithms for solving the discrete logarithm problem and the period-finding problem. Generally, “Shor’s algorithm” refers to the factoring algorithm, but it may also encompass any of these methods. On a quantum computer, Shor’s algorithm can factor a number N in polynomial time, specifically 𝜃((𝑙𝑜𝑔𝑁)2(𝑙𝑜𝑔(𝑙𝑜𝑔𝑁))(𝑙𝑜𝑔(𝑙𝑜𝑔(𝑙𝑜𝑔𝑁)))) with fast multiplication, or even 𝜃((𝑙𝑜𝑔𝑁)2(𝑙𝑜𝑔(𝑙𝑜𝑔𝑁))\n\n[Đoạn 2] harvest-now-decrypt-later-pqc-threat-model · trang 64\nAppendix Mathematical Notation Notation Definition Ld Data confidentiality lifetime; the duration for which encrypted data must remain confidential from time of encryption until obsolescence or regulatory expiration al-time monitoring of network traffic.\n- accuracy (METRIC): QSVM achieved 94.67% accuracy in detecting anomalies.; The QGAN framework achieved an accuracy of 0.937.\n- QML classifiers (ALGORITHM): Can differentiate normal network fluctuations from early-stage intrusions using flow-level features.\n\nKnowledge graph relations:\n- hybrid pipeline -- QSVM: Integrated QNNs and QSVMs for real-time monitoring.\n- hybrid pipeline -- Quantum Neural Networks: Integrated QNNs and QSVMs for real-time monitoring.\n- Quantum Neural Networks -- QSVM: Quantum neural networks can incorporate QSVM concepts.; showing 3-7% improvements in accuracy over QNN.\n- Quantum Machine Learning -- anomaly detection: Explores QNN, QSVM, and QPCA for anomaly detection.; QML enables real-time anomaly detection.\n- QSVM -- classical algorithm: QSVMs aim to deliver more efficient and accurate threat detection pipelines compared to classical methods.\n- Quantum Neural Networks -- Feature map: Feature map is used in the data loading process of QNN.", "kind": "kg"}, {"title": "Context A: các đoạn văn", "text": "[Đoạn 1] Quantum Machine Learning for Cybersecurity · trang 8\nWith their advent, QML models have shown impressive performance in terms of accuracy and latency. Hossain et al. integrated QNNs and QSVMs in a hybrid pipeline for real-time monitoring of network traffic. The QNN achieved 96% accuracy in anomaly detection, and the QSVM achieved 93% accuracy, with the average alerting latency being near-instant at 10 ms. Exploring further, Noah et al. ventured in QML for cybersecurity in 5G networks.\n\n[Đoạn 2] Quantum Machine Learning for Cybersecurity · trang 3\nexisting techniques, such as QSVM, QNN, QCNN, QGAN, and hybrid quantum–classical models, with a structured taxonomy while also identifying practical gaps, challenges in scalability, interpretability, and hardware dependence. III. It can deliver high-dimensional inference and optimisation under strict time and resource budgets. Rather, QML ork to the quantum setting by pairing a parameterized quantum generator with a discriminatoreither quantum or classical-in a two-player minimax game. The generator seeks to produce quantum states that approximate an unknown data distribution, while the discriminator learns to distinguish between real samples and those generated. Like classical GANs, QGANs rely on iterative adversarial training, but leverage quantum resources such as superposition and entanglement to encode and manipulate data distributions. These models are typically implemented within a variational quantum algorithm (VQA) framework, where both the generator and discriminator are expressed as parameterized quantum circuits. Optimization proceeds via a hybrid loop, using quantum measurements to estimate loss\n\n[Đoạn 2] A Survey of Quantum Generative Adversarial Networks · trang 2\nKeywords: quantum AI, quantum GAN, QGAN 1 Introduction Generative Adversarial Networks (GANs) have transformed the landscape of machine learning since their introduction by Goodfellow et al. in 2014 [1]. At their core, GANs consist of two competing neural networks-a generator and a discriminator-locked in an adversarial training process. The generator creates synthetic data samples, while the discriminator evaluates their authenticity compared to real data. This elegant competitive framework has enabled remarkable advances in generating realistic images, text, audio, and other data types. Meanwhile, quantum computing has emerged as a promising computational paradigm that harnesses quantum mechanical principles such as superposition and entanglement. Instead of classical bits that can be either 0 or 1, quantum computers use\n\n[Đoạn 3] A Survey of Quantum Generative Adversarial Networks · trang 5\nFij(θ) = Re(⟨∂iψ(θ)|∂jψ(θ)⟩−⟨∂iψ(θ)|ψ(θ)⟩⟨ψ(θ)|∂jψ(θ)⟩), (11) and ∇C(θ) is the gradient of the cost function. 3 Implementation Approaches 3.1 Fully Quantum Implementations Fully quantum implementations of GANs represent the most ambitious approach, where both generator and discriminator are implemented as quantum circuits, and data is represented in quantum states. These implementations potentially offer the greatest quantum advantage but also face the most significant hardware challenges. A key aspect of fully quantum implementations is quantum data encoding, i.e., the process of mapping classical data into quantum states. Several encoding methods have been developed: Amplitude Encoding represents classical data in the amplitudes of a quantum state |x⟩= 2n−1 X i=0 xi|i⟩, (12) where xi are the normalized classical data values. This encoding is efficient in terms of qubit usage (representing 2n values with n qubits) but can be challenging to implement [24].\n\n[Đoạn 4] A Survey of Quantum Machine Learning - Foundations,Algorithms, Frameworks, Data and Applications · trang 18\n𝐿𝐷= −1 2 ∑ 𝑖 [log 𝐷(𝑥𝑖) + log(1 −𝐷(𝑧𝑖))], (28) where 𝐷(⋅) is the discriminator function that outputs the probability of an input being real. The discriminator parameters 𝜙are updated to minimize 𝐿𝐷, improving its ability to distinguish real from fake data. Next, the generator produces a new batch {𝑧′ 𝑖}, and its loss is given by 𝐿𝐺= −∑ 𝑖 log 𝐷(𝑧′ 𝑖). (29) Minimizing 𝐿𝐺updates the generator parameters 𝜃to increase the chance that fake data is classified as real. This adversarial process continues until the generator and discriminator reach a balance, known as Nash equilibrium. In QGANs, gradients are typically estimated using the parameter-shift rule or stochastic approximation, and optimization is performed via classical algorithms. Finally, its pseudocode can be found in Algorithm 10 (see Appendix C). 4.3.4 Quantum Boltzmann Machines. QBMs are the quantum generalization of classical Boltzmann Machines, designed to model complex probability distributions through quantum principles"}, {"title": "Câu trả lời B", "text": "In QGANs, the generator and discriminator are trained through an adversarial process similar to classic  mentioned in previous section.; NIST Post-Quantum Cryptography algorithms.\n- NIST PQC finalists (ALGORITHM): NIST's post-quantum cryptography finalist algorithms including Kyber, Dilithium, FALCON, SPHINCS+.\n- PQC finalists of NIST (DATASET): NIST's post-quantum cryptography finalists for comparison.\n\nKnowledge graph relations:\n- libsodium -- NIST PQC finalists: libsodium does not include support for any of the NIST PQC finalist algorithms.\n- liboqs -- NIST PQC algorithms: OQS supports many PQC algorithms including Kyber, Dilithium, Falcon, and SPHINCS+.\n- LibreSSL -- NIST PQC finalists: LibreSSL supports some of the NIST PQC finalist algorithms.\n- OpenSSL -- NIST PQC algorithms: OpenSSL has signaled that support for NIST PQC algorithms is forthcoming.\n- OpenSSL -- NIST finalists: OpenSSL does not support any NIST finalist algorithms.\n- NIST PQC algorithms -- Dilithium: NIST PQC algorithms include Dilithium.", "kind": "kg"}, {"title": "Context A: các đoạn văn", "text": "[Đoạn 1] A Survey of Post-Quantum Cryptography Support in Cryptographic Libraries · trang 6\nOpenSSL has not included NIST PQC algorithms in its official release, but has signaled that support is forthcoming now that standards are finalized. In September 2024, the OpenSSL Foundation announced plans to implement the NIST PQC finalists (Kyber, Dilithium, Falcon, SPHINCS+) in a future release, stating: “We intend to implement support for these algorithms in our providers in a future version of OpenSSL”. Maintained by openquantumsafe.org, the OQS provider allowed experimentation with many PQC algorithms across TLS 1.3 and X.509, serving as a “test vehicle” for\n\n[Đoạn 2] A Survey of Post-Quantum Cryptography Support in Cryptographic Libraries · trang 6\n1.0.x series, Libsodium does not include support for any of the NIST PQC finalist algorithms. The community has shown interest and asked questions regarding PQC in libsodium. In a discussion thread, it was noted that “ML-KEM is on the roadmap” for libsodium, but that PQC integration is complex and has not yet been completed. This implies that libsodium’s author is aware of Kyber (ML-KEM) and intends to support it eventually, but no official timeline is given.\n\n[Đoạn 3] A Survey of Post-Quantum Cryptography Support in Cryptographic Libraries · trang 6\nObservation: For now, if quantum readiness is required, libsodium alone is insufficient – one must integrate additional tools. This gap highlights that not all libraries have moved at the same pace; ease-of-use libraries such as libsodium may take a bit longer to incorporate cutting-edge PQC algorithms. 5.3 MbedTLS MbedTLS (now part of Arm’s Open-Source Security), ranked third on our list and widely used in embedded/IoT, currently has no NIST PQC algorithms implemented in its official release, but it is on their roadmap. A forum query in March 2024 asked about Dilithium/Kyber support, and the response from an Mbed TLS developer was: \"Yes, eventually, we will add standard post-quantum algorithms.\n\n[Đoạn 4] A Survey of Post-Quantum Cryptography Support in Cryptographic Libraries · trang 11\nand Botan have moved aggressively to implement NIST’s postquantum algorithms, providing developers with ready-to-use tools for quantum-resistant encryption and signatures. wolfSSL, Bouncy Castle integrate Kyber and Dilithium into their TLS stack today, and Botan offers a rich PQC suite in its C++ API. On the other end, libsodium, has yet to embrace PQC, reflecting caution and the challenges of adding these complex schemes to a minimalist library. Similarly, PQC support for Crypto++ and LibreSSL is either not yet on their roadmap, or for MbedTLS the conversation has just started."}, {"title": "Câu trả lời B", "text": "No, as of the 1.0.x series, Libsodium does not include support for any of the NIST PQC finalist algorithms. The library's lead developer has noted that ML-KEM is on the roadmap but no official timeline has been given for its integration."}, {"title": "Context B: mô tả KG", "text": "Knowledge graph entities:\n- libsodium (SYSTEM): Cryptographic open-source library.; Popular cryptographic library with a consistent API.; Cryptographic library that does not include support for NIST PQC finalist algorithms.; Library insufficient for quantum readiness \n- NIST PQC algorithms (ALGORITHM): Suite of algorithms spanning different families of mathematical problems.; Algorithms based on criteria mentioned in previous section.; NIST Post-Quantum Cryptography algorithms.; Standard post-quantum cryptography algor\n- NIST (ORGANIZATION): U.S. government agency standardizing post-quantum cryptography.; Launched a global competition for quantum-resistant public-key cryptographic algorithms.; Kyber has been officially selected by NIST.; Selected Falcon for \n- PQC (ALGORITHM): Deep PQCs, or those forming 2-designs.; Post-quantum cryptographic algorithms implemented through hybrid systems.; Post-Quantum Cryptography.; Algorithms submitted in various categories for the NIST competition.; PQC sta\n- NIST PQC finalists (ALGORITHM): NIST-selected algorithms for post-quantum cryptography.; NIST's post-quantum cryptography finalist algorithms including Kyber, Dilithium, FALCON, SPHINCS+.; Post-quantum key exchange or signature schemes that are not yet\n- post quantum cryptography (STANDARD): PQC is the new era of cryptography due to quantum computing.; Solution to mitigate risks posed by quantum computing.\n- PQC finalists of NIST (DATASET): NIST's post-quantum cryptography finalists for comparison.\n- post-quantum cryptosystems (ALGORITHM): Innovative solution for resisting quantum attacks.; Cryptosystems designed to resist quantum computing attacks.; New generation of cryptosystems examined in the study.; This article discusses the challenges and potential\n\nKnowledge graph relations:\n- libsodium -- NIST PQC finalists: libsodium does not include support for any of the NIST PQC finalist algorithms.\n- liboqs -- NIST PQC algorithms: OQS supports many PQC algorithms including Kyber, Dilithium, Falcon, and SPHINCS+.\n- LibreSSL -- NIST PQC finalists: LibreSSL supports some of the NIST PQC finalist algorithms.\n- OpenSSL -- NIST PQC algorithms: OpenSSL has signaled that support for NIST PQC algorithms is forthcoming.; OpenSSL has not included these algorithms in its official release.\n- OpenSSL -- NIST finalists: OpenSSL does not support any NIST finalist algorithms.\n- OpenSSL Foundation -- NIST PQC algorithms: Plans to implement support for these algorithms in OpenSSL.\n- NIST PQC algorithms -- Dilithium: NIST PQC algorithms include Dilithium.\n- libsodium -- PQC: libsodium has not yet embraced PQC.\n- MbedTLS -- NIST PQC algorithms: MbedTLS does not have NIST PQC algorithms implemented.\n- Crypto++ -- NIST PQC finalists: Crypto++ does not include the NIST PQC finalists in its mainline distribution.\n- PQC solutions -- NIST: NIST is leading standardization efforts for PQC algorithms.\n- open-source libraries -- PQC: Libraries support PQC algorithms.", "kind": "kg"}, {"title": "Context B: các đoạn văn", "text": "[Đoạn 1] A Survey of Post-Quantum Cryptography Support in Cryptographic Libraries · trang 6\nOpenSSL has not included NIST PQC algorithms in its official release, but has signaled that support is forthcoming now that standards are finalized [19]. In September 2024, the OpenSSL Foundation announced plans to implement the NIST PQC finalists (Kyber, Dilithium, Falcon, SPHINCS+) in a future release, stating: “We intend to implement support for these algorithms in our providers in a future version of OpenSSL” [19]. This came after NIST published the FIPS draft standards (ML-KEM, ML-DSA, SLH-DSA), which OpenSSL was awaiting to avoid integrating pre-standard algorithms. As of early 2025, integration is underway (targeting OpenSSL 3.5), but not yet released. Meanwhile, since early 2022, the Open Quantum Safe (OQS) project has offered PQC support for OpenSSL 3 via its provider architecture [34]. Maintained by openquantumsafe.org, the OQS provider allowed experimentation with many PQC algorithms across TLS 1.3 and X.509 [19], serving as a “test vehicle” for\n\n[Đoạn 2] A Survey of Post-Quantum Cryptography Support in Cryptographic Libraries · trang 6\n1.0.x series, Libsodium does not include support for any of the NIST PQC finalist algorithms. The library currently provides modern public-key cryptography (Curve25519-based key exchange, Ed25519 signatures, X25519/XChaCha, etc.), but no post-quantum key exchange or signature schemes have been integrated yet. The community has shown interest and asked questions regarding PQC in libsodium. Specifically, developers have inquired about the potential addition of algorithms such as Kyber or Dilithium. The lead developer of libsodium (Frank Denis) has been cautious on this front. In a discussion thread, it was noted that “ML-KEM is on the roadmap” for libsodium, but that PQC integration is complex and has not yet been completed [37]. This implies that libsodium’s author is aware of Kyber (ML-KEM) and intends to support it eventually, but no official timeline is given. Observation: For now, if quantum readiness is required, libsodium alone is insufficient – one must integrate additional\n\n[Đoạn 3] A Survey of Post-Quantum Cryptography Support in Cryptographic Libraries · trang 6\nofficial timeline is given. Observation: For now, if quantum readiness is required, libsodium alone is insufficient – one must integrate additional tools. This gap highlights that not all libraries have moved at the same pace; ease-of-use libraries such as libsodium may take a bit longer to incorporate cutting-edge PQC algorithms. 5.3 MbedTLS MbedTLS (now part of Arm’s Open-Source Security), ranked third on our list and widely used in embedded/IoT, currently has no NIST PQC algorithms implemented in its official release, but it is on their roadmap. The maintainers explicitly stated that they plan to add post-quantum cryptography now that standards are available. A forum query in March 2024 asked about Dilithium/Kyber support, and the response from an Mbed TLS developer was: \"Yes, eventually, we will add standard post-quantum algorithms. We don’t know when yet, and we are not going to anticipate NIST standardization. Kyber (as ML-KEM) will likely come first since KEM is more urgent\n\n[Đoạn 4] A Survey of Post-Quantum Cryptography Support in Cryptographic Libraries · trang 11\nand Botan have moved aggressively to implement NIST’s postquantum algorithms, providing developers with ready-to-use tools for quantum-resistant encryption and signatures. wolfSSL, Bouncy Castle integrate Kyber and Dilithium into their TLS stack today, and Botan offers a rich PQC suite in its C++ API [56,60]. On the other end, libsodium, has yet to embrace PQC, reflecting caution and the challenges of adding these complex schemes to a minimalist library [37]. Similarly, PQC support for Crypto++ and LibreSSL is either not yet on their roadmap, or for MbedTLS the conversation has just started. OpenSSL2, the most critical library for Internet security, is in a transitional phase: it does not officially support PQC as of early 2025, but clear plans and ongoing work signal that Kyber, Dilithium, and others will be integrated in the near future [19]. In the meantime, OpenSSL users must rely on external providers such as liboqs for PQC capabilities. BoringSSL (Google’s fork),"}, {"key": "gt:0:A", "group": "Ý 1 của ground truth", "text": "Ý 1. As of the latest release in the 1.0.x series, Libsodium does not include support for any NIST PQC finalist algorithms.", "prompt": "Câu trả lời A: ý này có trong câu trả lời A? có trong context A?", "options": [[3, "Context và câu trả lời (3)", "y"], [2, "Chỉ context (2)", ""], [1, "Chỉ câu trả lời (1)", ""], [0, "Không có (0)", "n"]]}, {"key": "gt:0:B", "group": "Ý 1 của ground truth", "prompt": "Câu trả lời B: ý này có trong câu trả lời B? có trong context B?", "options": [[3, "Context và câu trả lời (3 as issued guidelines on post-quantum cryptography.\n- National Security Memorandum 10 (STANDARD): Declared the need for transitioning cryptographic systems to quantum-resistant cryptography by 2035.\n- PQC standards (STANDARD): Standards for post-quantum cryptography.; NIST’s Post-Quantum Cryptography standards expected to evolve.\n\nKnowledge graph relations:\n- Q-Day -- PQC migration: Migration should begin now to avoid waiting until Q-Day.\n- Post-Quantum Cryptography -- quantum-based attacks: Migration toward post-quantum cryptography is urgent to avoid future quantum-based attacks.\n- quantum threat -- Post-Quantum Cryptography: Quantum threat necessitates migration to PQC now.\n- Post-Quantum Cryptography -- NIST’s multi-year process: PQC algorithms are evaluated and standardized by NIST’s process.\n- harvest now, decrypt later -- Post-Quantum Cryptography: Challenges PQC migration.; PQC is needed to counter HNDL threats.\n- migration playbooks -- Post-Quantum Cryptography: Developed to address challenges.", "kind": "kg"}, {"title": "Context A: các đoạn văn", "text": "[Đoạn 1] harvest-now-decrypt-later-pqc-threat-model · trang 63\nOrganizations managing data with confidentiality requirements extending years or decades face a strategic imperative to migrate to post-quantum cryptography now. Waiting for quantum computers to appear before beginning migration creates unnecessary risk, cost, and disruption.\n\n[Đoạn 2] Post-Quantum Cryptography and Quantum-Safe Security · trang 27\nPost-Quantum Cryptography and Quantum-Safe Security: A Comprehensive Survey 27 such as zero-trust architectures, homomorphic encryption, and secure multiparty computation also warrants systematic investigation, as these fields converge in building the security foundations of a post-quantum digital ecosystem. Finally, researchers must recognize that PQC migration is not solely a technical problem but a socio-technical transition akin to the historical adoption of public-key cryptography in the late 20th century.\n\n[Đoạn 3] harvest-now-decrypt-later-pqc-threat-model · trang 58\nIf Q-Day occurs before PQC migration is complete, exposed data becomes vulnerable immediately Organizations migrating later face accelerated timelines, increased costs, and error risk Cryptographic changes require coordination across many teams Board-level governance establishing quantum risk as enterprise priority Vendor and third-party engagement to ensure supply chain readiness 63 ScienceDirect. (2025). “Complexity and the Transition to Post-Quantum Security.” Procedia Computer Science. Retrieved from\n\n[Đoạn 4] harvest-now-decrypt-later-pqc-threat-model · trang 59\nMigration must begin immediately to enable orderly transition 17.2 Why Waiting for Q-Day Is a Critical Error Several factors make waiting for Q-Day appearance a strategic error: 1. Data Confidentiality Requirements: Data encrypted today remains sensitive throughout cryptographic transition period Timeline Analysis: - Q-Day estimate: 2030 ± 5 years (accounting for uncertainty) - Migration duration: 2-5 years after decision - Required migration start: 2025-2028 (to complete before 2030-2035) - Current date: 2024-2025 Implication: Organizations should begin PQC migration now. Waiting until Q-Day appears"}, {"title": "Câu trả lời B", "text": "Organizations should begin post-quantum cryptography migration now, ideally between 2025-2028, to complete before 2030-2035. Waiting for Q-Day is an error because it creates unnecessary risk, cost, and disruption. If Q-Day occurs before migration is complete, exposed data becomes immediately vulnerable."}, {"title": "Context B: mô tả KG", "text": "Knowledge graph entities:\n- Q-Day (CONCEPT): Estimates of when quantum computers capable of breaking encryption might realistically materialize.; Computers that can break encryption might realistically materialize on Q-Day.; Timeline for a quantum computer to becom\n- Post-Quantum Cryptography (CONCEPT): Cryptography that remains secure against quantum attacks.; Standard that targets encryption and key management.; Protects data at rest and in transit from quantum-capable adversaries.; Defense mechanism to be combined wi\n- cryptography (CONCEPT): Applications in critical fields of QML.; Cryptography is being threatened by quantum technology.; Area affected by quantum capabilities.; Field where quantum computing can outperform classical methods.; Cryptography reli\n- Quantum Cryptography (CONCEPT): Has applications in quantum cryptography.; Implication of the technique of extracting eigenvalues of unitary operators.; Previous study area focusing on secure quantum communications.; Sector that could be revolutionized\n- migration (CONCEPT): Process of transitioning to new PQC algorithms.; Five-phase technical roadmap for migration.; Process of moving to PQC standards.; Process of moving to PQC.\n- US Department of Homeland Security (ORGANIZATION): Has issued guidelines on post-quantum cryptography.\n- National Security Memorandum 10 (STANDARD): Declared the need for transitioning cryptographic systems to quantum-resistant cryptography by 2035.; U.S. government has set requirements for federal agencies to inventory their cryptographic systems and plan for a tran\n- PQC standards (STANDARD): Standards for post-quantum cryptography.; Progress in PQC standards is an internal positive factor for readiness.; NIST’s Post-Quantum Cryptography standards expected to evolve.; Standards that will be finalized for post\n\nKnowledge graph relations:\n- Q-Day -- PQC migration: If Q-Day occurs before migration, data becomes vulnerable.; Migration should begin now to avoid waiting until Q-Day.\n- Post-Quantum Cryptography -- quantum-based attacks: Migration toward post-quantum cryptography is urgent to avoid future quantum-based attacks.\n- quantum threat -- Post-Quantum Cryptography: Quantum threat necessitates migration to PQC now.\n- Post-Quantum Cryptography -- NIST’s multi-year process: PQC algorithms are ucts, such as certain VPN and secure communications solutions. This highlights their commitment to offering security against potential quantum attacks, which can give them an edge in the market and reassure clients, especially large enterprises, about their security posture."}, {"title": "Context A: mô tả KG", "text": "Knowledge graph entities:\n- quantum resilience (CONCEPT): Achieving security against quantum attacks.\n- quantum-resilience (DEFENSE): A selling point for technology service providers.\n- quantum-resilient (DEFENSE): Building quantum-resilient infrastructures are strategic imperatives.\n- quantum-resilient security (CONCEPT): The proposed user authentication framework offers quantum-resilient security with minimal computational overhead.\n\nKnowledge graph relations:\n- quantum-resistant security -- quantum-resilience: Security measures are used as a selling point for quantum-resilience.\n- quantum safety -- software vendors: Software vendors are expected to handle the heavy lifting.\n- quantum computing -- Attack Resilience: Quantum Computing demonstrates superior performance in this attribute.\n- quantum safety -- cloud service providers: Cloud service providers are expected to handle the heavy lifting.\n- Quantum-Resilience Index, R -- enterprise: A higher R(t) indicates greater quantum resilience for enterprises.\n- quantum-resilience -- PQC: Quantum-resilience involves integrating PQC.", "kind": "kg"}, {"title": "Context A: các đoạn văn", "text": "[Đoạn 1] Are Enterprises Ready for Quantum-Safe Cybersecurity · trang 9\nAnother factor is client and market expectations: as large enterprises (e.g., global banks, cloud providers) start boasting of “quantum-resistant security” in their offerings, it may spur others to follow to avoid being seen as the weak link. Already, some technology service providers use quantum-resilience as a selling point; for example, certain VPN and secure communications products advertise that they are “quantum-safe” by integrating PQC, and cloud companies like AWS, IBM, and Microsoft have released tools for experimenting with PQC in their platforms.\n\n[Đoạn 2] The-Quantum-Security-Deadline · trang 9\nThe Quantum-Resilience Index, R(t), serves as a key performance metric for enterprise adaptability in post-quantum environments. A higher R(t) indicates greater enterprise quantum resilience, reflecting superior agility, automation, and cryptographic readiness against quantumera threats. BUILDING THE FOUNDATION FOR QUANTUM-RESILIENT SECURITY Quantum resilience requires a holistic, enterprise-wide approach that integrates discovery,\n\n[Đoạn 3] Harvest-Now, Decrypt-Later - A Temporal Cybersecurity Risk in the Quantum Transition · trang 17\nTelecom 2025, 6, 100 17 of 23 This key size parameterization enables network operators to evaluate both short-term mitigations (key size increases) and long-term solutions (PQC migration) within the unified HNDL temporal risk framework. The analysis reinforces that quantum resilience in communication networks is determined as much by timing and key management as by cryptographic strength.\n\n[Đoạn 4] Harvest-Now, Decrypt-Later - A Temporal Cybersecurity Risk in the Quantum Transition · trang 4\nrisk prioritization, and adoption of crypto-agile architectures. Sustained progress depends on practical migration frameworks, hybrid deployment models, and cross-sector coordination to achieve quantum resilience well before the anticipated “Q-Day”. 2.3. Temporal Security and Long-Term Confidentiality Models The HNDL threat has reshaped how confidentiality is understood across time. Classical models such as perfect forward secrecy in TLS address short-term key compromise but do not account for the long-term algorithmic degradation that may emerge years or even decades later."}, {"title": "Câu trả lời B", "text": "Technology service providers are using quantum-resilience as a selling point, for example, certain VPN and secure communications products advertise tha
