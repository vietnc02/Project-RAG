<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phiếu chấm tay</title>
<style>
:root {
  --bg: #f7f7f5; --surface: #ffffff; --surface2: #f0f0ec; --ink: #1d1d1b; --ink2: #55554f; --line: #dcdcd6;
  --accent: #1c5cab; --accent-ink: #ffffff; --yes: #1f7a4d; --yes-bg: #e3f3ea; --no: #b3261e; --no-bg: #fbe9e7;
  --todo: #fff2b3; --kg: #f3f0fa; --mark: #cfe3ff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161615; --surface: #1f1f1d; --surface2: #2a2a27; --ink: #ecece8; --ink2: #a8a8a0; --line: #3a3a36;
    --accent: #6ea2e6; --accent-ink: #0d1a2b; --yes: #6fcf97; --yes-bg: #1d3528; --no: #f28b82; --no-bg: #3d1f1c;
    --todo: #4a4220; --kg: #26222f; --mark: #24456e;
  }
}
:root[data-theme="dark"] {
  --bg: #161615; --surface: #1f1f1d; --surface2: #2a2a27; --ink: #ecece8; --ink2: #a8a8a0; --line: #3a3a36;
  --accent: #6ea2e6; --accent-ink: #0d1a2b; --yes: #6fcf97; --yes-bg: #1d3528; --no: #f28b82; --no-bg: #3d1f1c;
  --todo: #4a4220; --kg: #26222f; --mark: #24456e;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 system-ui, "Segoe UI", Roboto, sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
  padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
header h1 { font-size: 16px; margin: 0 12px 0 0; }
.progress { flex: 1 1 200px; min-width: 160px; }
.bar { height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
.bar > div { height: 100%; background: var(--accent); width: 0; transition: width .2s; }
.progress small { color: var(--ink2); }
button, .filebtn { font: inherit; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 6px; padding: 6px 12px; cursor: pointer; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button:focus-visible, .filebtn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.layout { display: grid; grid-template-columns: 200px 1fr; gap: 16px; max-width: 1200px; margin: 0 auto; padding: 16px; }
nav { position: sticky; top: 70px; align-self: start; max-height: calc(100vh - 90px); overflow: auto; }
nav ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
nav button { width: 100%; padding: 6px 0; font-size: 13px; }
nav button.done { background: var(--yes-bg); border-color: var(--yes); }
nav button.partial { background: var(--todo); }
nav button.current { outline: 2px solid var(--accent); }
main { min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-bottom: 12px; }
.card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink2); margin: 0 0 6px; }
.card p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.qhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.qhead h2 { font-size: 20px; text-transform: none; letter-spacing: 0; color: var(--ink); margin: 0; }
.kg p { background: var(--kg); padding: 10px; border-radius: 6px; font-size: 13px; max-height: 340px; overflow: auto; }
.passage .src { color: var(--ink2); font-size: 13px; margin-bottom: 6px; }
.label { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; padding: 8px 10px;
  border-radius: 6px; background: var(--todo); }
.label.set { background: var(--surface2); }
.label .q { flex: 1 1 260px; font-weight: 600; }
.label button[aria-pressed="true"].y { background: var(--yes-bg); border-color: var(--yes); color: var(--yes); font-weight: 700; }
.label button[aria-pressed="true"].n { background: var(--no-bg); border-color: var(--no); color: var(--no); font-weight: 700; }
.label input { flex: 1 1 100%; font: inherit; font-size: 13px; padding: 5px 8px; border: 1px solid var(--line);
  border-radius: 5px; background: var(--surface); color: var(--ink); }
.claim { padding: 8px 0 0; border-top: 1px dashed var(--line); margin-top: 10px; }
.claim:first-of-type { border-top: 0; }
.pager { display: flex; justify-content: space-between; gap: 8px; margin: 16px 0 40px; flex-wrap: wrap; }
details.guide { margin-bottom: 12px; }
details.guide summary { cursor: pointer; font-weight: 600; }
details.guide dl { margin: 8px 0 0; }
details.guide dt { font-weight: 700; margin-top: 8px; }
details.guide dd { margin: 2px 0 0; color: var(--ink2); }
.hint { color: var(--ink2); font-size: 13px; }
mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 2px; }
.terms { margin-top: 8px; font-size: 13px; color: var(--ink2); display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: baseline; }
.terms b { color: var(--ink); font-weight: 600; margin-right: 2px; }
.chip { border-radius: 10px; padding: 1px 8px; border: 1px solid var(--line); background: var(--surface); white-space: nowrap; }
.chip.hit { background: var(--mark); border-color: transparent; color: var(--ink); }
.chip.miss { text-decoration: line-through; opacity: .75; }
.chip small { color: var(--ink2); margin-left: 3px; }
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 4px; }
.compare > div { background: var(--surface2); border-radius: 6px; padding: 8px 10px; }
@media (max-width: 760px) { .compare { grid-template-columns: 1fr; } }
body.nohl mark { background: none; padding: 0; }
body.nohl .terms { display: none; }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg);
  padding: 8px 14px; border-radius: 6px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
@media (max-width: 760px) {
  .layout { grid-template-columns: 1fr; }
  nav { position: static; max-height: none; }
  nav ol { grid-template-columns: repeat(6, 1fr); }
}
</style>
</head>
<body>
<header>
  <h1 id="title">Phiếu chấm tay</h1>
  <div class="progress"><div class="bar"><div id="bar"></div></div><small id="ptext"></small></div>
  <button id="next-todo">Tới mục chưa chấm</button>
  <label class="filebtn">Nhập JSON<input id="import" type="file" accept="application/json,.json" hidden></label>
  <button id="export" class="primary">Xuất JSON</button>
</header>
<div class="layout">
  <nav aria-label="Danh sách mục"><ol id="nav"></ol></nav>
  <main>
    <details class="guide" id="guide"><summary>Hướng dẫn chấm</summary><dl id="guide-list"></dl></details>
    <div id="case"></div>
    <div class="pager"><button id="prev">← Mục trước</button><button id="next">Mục sau →</button></div>
  </main>
</div>

9)\nwhere τrot is the key rotation interval. For sectors with W > 1 year, forward-secure\nmechanisms cap exposure at one year per compromised key epoch."}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q002", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What does the survey by García and Ullah focus more on, and what may limit its utility for those seeking a deep understanding of specific algorithms or implementation challenges?"}, {"title": "Đáp án chuẩn", "text": "The survey by García and Ullah focuses more on high-level concepts and emerging perspectives than on providing detailed technical analyses, which may limit its utility to those seeking a deep understanding of specific algorithms or implementation challenges."}, {"title": "Bài", "text": "A Survey of Quantum Machine Learning - Foundations,Algorithms, Frameworks, Data and Applications"}, {"title": "Đoạn gốc (trang 4)", "text": "91:4\nF. Rodríguez-Díaz et al.\n2.2\nApplication-specific Surveys\nIn the healthcare domain, [73] examines how QML can address complex biomedical challenges,\nsuch as genomic analysis, medical imaging, and drug discovery. The survey analyzes the potential\nof QML to improve diagnostic accuracy and facilitate personalized medicine. However, it may\nnot extensively cover the technical implementation details of quantum algorithms. García and\nUllah [117] explore the transformative potential of QML in healthcare systems. The survey focuses\nmore on high-level concepts and emerging perspectives than on providing detailed technical\nanalyses, which may limit its utility to those seeking a deep understanding of specific algorithms or\nimplementation challenges. The review by [129] provides an overview of the intersection between\nquantum-enabled algorithms and medical image processing, highlighting applications in disease"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q003", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What algorithm was developed after the variational quantum eigensolver in the context of quantum simulation to address hard optimization problems?"}, {"title": "Đáp án chuẩn", "text": "The quantum approximate optimization algorithm was developed in a similar context to address hard optimization problems [5, 17–19]."}, {"title": "Bài", "text": "Barren plateaus in quantum neural network training landscapes"}, {"title": "Đoạn gốc (trang 1)", "text": "and high ﬂexibility with respect to coherence time and\ngate requirements make them especially attractive for\nNISQ implementations [3, 9–11].\nThe ﬁrst implementation of such algorithms was developed in the context of quantum simulation with the\nvariational quantum eigensolver [2, 3]. This algorithm\nhas been successfully demonstrated on a number of experimental setups with extensions to excited states and\nother forms of incoherent error mitigation [2, 9, 12–16].\nSince then, the quantum approximate optimization algorithm was developed in a similar context to address hard\noptimization problems [5, 17–19].\nThis algorithm has\nalso been demonstrated on quantum devices [20]. These\napproaches have even been extended to both quantum\nmachine learning and error correction [6, 7, 20–23].\nWhile the precise formulation of these methods and\ntheir domains of applicability diﬀer considerably, they"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q004", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "In 2009, who introduced the LWE algorithm and how is it correlated with the SVP problem?"}, {"title": "Đáp án chuẩn", "text": "In 2009, Micciancio et al. [154] introduced the LWE, correlating it with the SVP problem."}, {"title": "Bài", "text": "A_Comprehensive_Survey_on_Pre_Versus_Post_Quantum_Security_Schemes_for_5G-Enabled_IoT_Applications"}, {"title": "Đoạn gốc (trang 16)", "text": "of LWE relies on the determination to be provably reducible\nto solving the SVP [150]. As a result, while NTRU offers\nless security, it is actually much more flexible and efficient\nin its implementation. In contrast, LWE provably immune to\nquantum attacks, but because of their relative inefficiency,\nmany researchers have developed various effective schemes\n(for example, over rings, as in Ring-LWE) [150].\n1) LEARNING WITH ERROR (LWE)\nIn 2009, Micciancio et al. [154] introduced the LWE, correlating it with the SVP problem. LWE algorithm distinguishes\nthe set of vectors that are generated from an erroneous set of\nvectors derived from linear equations. LWE is a formulation\nto hide the secret within a set of erroneous equations.\nChoudhary et al. [155] proposed a classification of solutions\nbased on Ring LWE and Fully Homomorphic Encryption\n(FHE).\nSaeed [156] presented an integrated approach involving\nLSTM based anomaly detection, SHA-256 based integrity"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q005", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the significance level used by Xiaoming et al. in their hypothesis-testing approach to detect photon-number splitting (PNS) attacks?"}, {"title": "Đáp án chuẩn", "text": "They use a 5% significance level (|z| > 1.96)."}, {"title": "Bài", "text": "QUANTUM KEY DISTRIBUTION - Bridging Theoretical Security Proofs, Practical Attacks, and Error Correction"}, {"title": "Đoạn gốc (trang 10)", "text": "(ii) Xiaoming et al. [39] propose a hypothesis-testing approach to detect photon-number splitting (PNS) attacks\nin decoy-state MDI-QKD. They formulate the null hypothesis H0,– “no PNS attack” – and derive a test\nstatistic z assuming Gaussian fluctuations. At the 5% significance level (|z| > 1.96), they reject H0 and\ndiscard affected pulses; otherwise, they accept H0 and retain them. Using realistic experimental parameters,\nthey obtain z = 0.236, yielding a Type I error probability below 5% and thus no attack detected under H0.\nHowever, this test is effective only against PNS attacks that significantly alter detection rates; subtler PNS\nstrategies that leave overall statistics nearly unchanged may evade its detection.\n(iii) Shang et al. [40] propose two joint-PNS attacks on semi-quantum QKD (SQKD), where a fully quantum\nAlice communicates with a classical Bob [41]. In both attacks, Eve exploits bidirectional channels to siphon"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q006", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the probability of measuring a particular bitstring x corresponding to an image in Quantum Circuit Born Machines for Image Generation?"}, {"title": "Đáp án chuẩn", "text": "The probability of measuring a particular bitstring x corresponding to an image is given by p(x) = |⟨x|U(θ)|0⟩|2, (16)"}, {"title": "Bài", "text": "A Survey of Quantum Generative Adversarial Networks"}, {"title": "Đoạn gốc (trang 7)", "text": "fewer qubits but with deeper circuits.\n4 Application Domains\n4.1 Image Generation and Processing\nImage generation represents the most common application domain for QGANs, mirroring the trend in classical GANs where image synthesis was the first major application.\nQGAN approaches to image generation include: Quantum Circuit Born Machines for\nImage Generation use quantum circuits to generate probability distributions corresponding to image data. The quantum state amplitudes are mapped to pixel values,\nallowing the generation of images through quantum sampling. The probability of\nmeasuring a particular bitstring x corresponding to an image is given by\np(x) = |⟨x|U(θ)|0⟩|2,\n(16)\n7"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q007", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What method did Google use in its CECPQ1 experiment to integrate post-quantum cryptography with TLS 1.2?"}, {"title": "Đáp án chuẩn", "text": "Google’s CECPQ1 experiment integrated X25519 ECDH with NewHope key exchange in the TLS 1.2 handshake."}, {"title": "Bài", "text": "Post-Quantum_Blockchain_Security_for_the_Internet_of_Things_Survey_and_Research_Directions"}, {"title": "Đoạn gốc (trang 16)", "text": "authentication when receiving Quorum Key Manager (QKM)\nrequests [160]. TLS can also be used by services, like Oraclize,\nwhich allows smart contracts to access and interact with other\nblockchains and the Internet to fetch data. Furthermore, to protect the transmission of data between nodes in the LACChain\nblockchain, it can generate post-quantum X.509 certiﬁcates\nby modifying a version of libSSL, making post-quantum TLS\nconnections between nodes using these certiﬁcates [161].\nThe ﬁrst industry experiments on quantum-secure TLS were\nlaunched in 2016, with Google’s CECPQ1 experiment [162]\nintegrating X25519 ECDH [163] with NewHope key exchange\nin the TLS 1.2 handshake [69]. Currently, post-quantum TLS\nis being implemented in some ways for TLS 1.2 and 1.3. For\nexample, Microsoft is working with the Open Quantum Safe\n(OQS) [164] project to incorporate post-quantum cryptography\nthrough modiﬁcations in the OpenSSL library. Additionally,\nvarious efforts have been made to present post-quantum"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q008", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What did Ricardo et al. [80] compare and what were the accuracy improvements shown over classical methods?"}, {"title": "Đáp án chuẩn", "text": "Ricardo et al. [80] compared QSVM and QNN, showing 3-7% improvements in accuracy over classical methods."}, {"title": "Bài", "text": "A Survey of Quantum Machine Learning - Foundations,Algorithms, Frameworks, Data and Applications"}, {"title": "Đoạn gốc (trang 27)", "text": "A Survey of QML: Foundations, Algorithms, Frameworks, Data and Applications\n91:27\nMarco et al. [111] highlighted hybrid quantum-photonic networks for classification, achieving\nhigh accuracy with minimal parameters. Gong et al. [37] demonstrated that QCNN outperforms\nCNN in computationally intensive tasks such as MNIST, with advantages in convergence and\naccuracy.\nSeveral studies evaluate the performance of hybrid models. Ricardo et al. [80] compared QSVM\nand QNN, showing 3-7% improvements in accuracy over classical methods. Sierra-Sosa et al. [110]\ninvestigated the impact of quantum state preparation on hybrid models, highlighting the advantages\nof amplitude encoding over angle encoding.\nChen et al. [23] explored variational circuits in reinforcement learning, achieving results comparable to classical methods. Andrés et al. [4] evaluated dimensionality reduction strategies in\nreinforcement learning, achieving greater cumulative rewards with compact quantum models."}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q009", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What method did Geethanjali et al. use to ensure secure data hiding, and what technique did they integrate with LSB steganography?"}, {"title": "Đáp án chuẩn", "text": "Geethanjali et al. integrated ECC with LSB steganography."}, {"title": "Bài", "text": "A_Comprehensive_Survey_on_Pre_Versus_Post_Quantum_Security_Schemes_for_5G-Enabled_IoT_Applications"}, {"title": "Đoạn gốc (trang 13)", "text": "generated using the linear congruential method, ensuring\nstronger randomness. For secure data hiding, Geethanjali\net al. [124] integrated ECC with LSB steganography. Their\nfour-phase approach combines encryption, steganographic\ninsertion and extraction, and decryption to protect confidential IoT data.\nIn the context of fine-grained access control, Cheng\net al. [125] developed a CP-ABE scheme based on ECC,\nreplacing bilinear pairings with scalar multiplications to\nreduce overhead. Their model incorporates temporal and\nspatial attributes and distributes workloads across multiple\nservers to eliminate bottlenecks.\nYao et al. [78] addressed the security needs of IoMT by\nproposing an ECC-based scheme enhanced with Physically\nUnclonable Functions (PUFs). The scheme is evaluated using\nBAN logic and found to be efficient in both communication\nand computational aspects. Zhou et al. [79] introduced\nRAKI, a robust ECC-based three-party authentication and"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q010", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What was the explicit goal of Google's roadmap for achieving fault-tolerant quantum computation through QEC?"}, {"title": "Đáp án chuẩn", "text": "Google has articulated a roadmap targeting around one million physical qubits by 2029, with the explicit goal of achieving fault-tolerant quantum computation through QEC."}, {"title": "Bài", "text": "Practical Challenges in Executing Shor’s Algorithm"}, {"title": "Đoạn gốc (trang 13)", "text": "developing specialized quantum systems. Table 4 illustrates selected quantum computing roadmaps\nannounced by industrial players, grouped by qubit technology.\nHardware architectures\nSuperconducting-qubit efforts, led by IBM, Google and others, emphasize scaling and fault tolerance through surface-code-like QEC. IBM was the first to surpass\n1,000 qubits on a single chip and continues to pursue large scale architectures with a recent focus\non modularity. Google has articulated a roadmap targeting around one million physical qubits by\n2029, with the explicit goal of achieving fault-tolerant quantum computation through QEC.\nTrapped-ion providers such as IonQ and Quantinuum focus on saller but higher-fidelity systems.\nIn 2024, Quantinuum introduced a 56-qubit system that uses ion shuttling across a chip to perform\noperations pushing system level benchmarks such as quantum volume (QV) [34, 35] to new record"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q011", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What method did Chevignard, Fouque, and Schrottenloher (CFS) develop in 2024 to compute approximate modular exponentiations?"}, {"title": "Đáp án chuẩn", "text": "They found a way to compute approximate modular exponentiations using only small intermediate values, destroying the anecdotal n qubit arithmetic bottleneck."}, {"title": "Bài", "text": "How to factor 2048 bit RSA integers with less than a million noisy qubits"}, {"title": "Đoạn gốc (trang 3)", "text": "qubits [Zal06; Bea03; HRS16; Gid17]. Anecdotally, it was widely assumed that n was the minimum\npossible because doing arithmetic modulo an n bit number “required” an n qubit register. May\nand Schlieper had shown in 2019 that in principle only a single output qubit was needed [MS22],\nbut there was no known way to prepare a relevant output that didn’t involve intermediate values spanning n qubits. In 2024, Chevignard and Fouque and Schrottenloher (CFS) solved this\nproblem [CFS24]. They found a way to compute approximate modular exponentiations using only\nsmall intermediate values, destroying the anecdotal n qubit arithmetic bottleneck. However, their\nmethod is incompatible with “qubit recycling” [PP00; ME99], reviving an old bottleneck on the\nnumber of input qubits. Shor’s original algorithm used 2n input qubits [Sho94], but Ekerå and\nHåstad proved in 2017 that (0.5 + ϵ)n input qubits was sufficient for RSA integers [EH17]. So, by"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q012", "title": "multi-hop", "blocks": [{"title": "Câu hỏi", "text": "How do the MPC-in-the-Head approaches in constructing post-quantum signature schemes relate to the security concerns in quantum key distribution networks, particularly regarding the potential for new quantum algorithms to compromise security guarantees?"}, {"title": "Đáp án chuẩn", "text": "The MPC-in-the-Head paradigm provides a flexible approach to constructing post-quantum signature schemes by leveraging zero-knowledge proof techniques and well-studied symmetric primitives, aiming to offer security guarantees. However, this approach, like other PQC concepts, faces the risk of being compromised by new quantum algorithms, similar to the security concerns in quantum key distribution networks where existing cryptographic mechanisms might be threatened by the development of advanced quantum algorithms."}, {"title": "Bài A", "text": "Post-Quantum Cryptography and Quantum-Safe Security"}, {"title": "Đoạn của bài A", "text": "The episode highlights a broader lesson for PQC: security guarantees rest on unproven hardness\nassumptions that may conceal subtle weaknesses until uncovered by future advances.\n3.6\nMPC-in-the-Head Approaches\nThe MPC-in-the-Head paradigm represents an innovative and mathematically sophisticated approach to constructing post-quantum signature schemes through zero-knowledge proof techniques\nthat transform arbitrary symmetric cryptographic primitives into quantum-resistant signature\nschemes while providing exceptional flexibility in underlying security assumptions [72]. This framework enables cryptographic constructions based on well-studied symmetric primitives such as\nblock ciphers and hash functions, potentially offering security guarantees that inherit the strength\nof these thoroughly analyzed building blocks."}, {"title": "Bài B", "text": "Quantum Key Distribution Networks -- Key Management - A Survey"}, {"title": "Đoạn của bài B", "text": "Quantum Key Distribution Networks – Key Management: A Survey\nA PREPRINT\nactions. Already-designed quantum algorithms pose a significant threat to public-key cryptosystems [3]. It’s just that\nthere isn’t a large-scale quantum computer to run them, at least not for practical applications.\nOver the last two decades, tremendous efforts have been made to develop new cryptographic, quantum-secure mechanisms that will eventually replace the existing ones. They have resulted in two frameworks for secure communication in\nthe post-quantum world: Post-Quantum Cryptography (PQC) and Quantum Cryptography. PQC concepts are based on\na similar approach to classical algorithms: complex mathematical problems that cannot be solved in practical time by\nboth classical and quantum computers [4]. However, there is always the possibility that new quantum algorithms will be\ndiscovered in the near future, compromising their security. In contrast, quantum cryptography is based on the principles"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q013", "title": "multi-hop", "blocks": [{"title": "Câu hỏi", "text": "What are the initial PQC algorithms selected by NIST for standardization, and how do they compare to the concepts of Crypto-Agility and CBOM discussed in the first paper?"}, {"title": "Đáp án chuẩn", "text": "NIST selected Kyber, Dilithium, Falcon, and SPHINCS+ for standardization. These algorithms are part of PQC, which is discussed in the context of Crypto-Agility and CBOM in the first paper. Crypto-Agility and CBOM are about embedding cryptographic flexibility and a bill of materials today to ensure long-term resilience, while the selected PQC algorithms are specific implementations designed to withstand quantum attacks."}, {"title": "Bài A", "text": "The-Quantum-Security-Deadline"}, {"title": "Đoạn của bài A", "text": "escalating cryptographic complexity; and enforcing PQC compliance across the digital supply \nchain. By embedding crypto-agility today, enterprises can fortify their digital infrastructure and \nensure long-term resilience in the approaching quantum era. \nKeywords: \nPost-Quantum \nCryptography \n(PQC), \nCrypto-Agility, \nQuantum \nSecurity, \nCryptographically Relevant Quantum Computers (CRQC), Harvest Now Decrypt Later (HNDL), \nHybrid Cryptography, Cryptographic Bill of Materials (CBOM), Certificate Lifecycle \nManagement (CLM), PQC Compliance, Quantum-Resilient Systems. \n \n \nINTRODUCTION \n \nBackground and Motivation \nIn recent years, quantum computing has advanced from experimental physics into a practical \ntechnological frontier, promising to revolutionize computation but simultaneously threatening the"}, {"title": "Bài B", "text": "A Comparative Study of Classical and Post-Quantum Cryptographic Algorithms in the Era of Quantum Computing"}, {"title": "Đoạn của bài B", "text": "Post-quantum cryptography (PQC) encompasses cryptographic methods designed to withstand attacks from quantum computers. Unlike Quantum Key\nDistribution (QKD), which necessitates specialized hardware and quantum channels, PQC algorithms can be implemented on classical computing platforms and\nintegrated into existing internet protocols seamlessly.\n3.1\nHistorical Context and Progress\nIn 2016, the U.S. National Institute of Standards and Technology (NIST) launched\na global competition to identify and standardize quantum-resistant public-key\ncryptographic algorithms. This marked a significant milestone in the coordinated international effort to prepare for the advent of quantum computing.\nAfter years of evaluation, by July 2022, NIST announced its initial selections\nfor standardization. Among the chosen algorithms were Kyber, a lattice-based\nkey encapsulation mechanism, and three digital signature schemes: Dilithium,\nFalcon, and SPHINCS+."}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q014", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "How many complex numbers are required to describe the state of a quantum system with n components, each having two states?"}, {"title": "Đáp án chuẩn", "text": "In quantum physics, a complete description of the state of this system requires 2n −1 complex numbers."}, {"title": "Bài", "text": "Polynomial-Time Algorithms for Prime Factorization and Discrete Logarithms on a Quantum Computer"}, {"title": "Đoạn gốc (trang 5)", "text": "the various models of quantum cellular automata, but it has not yet been proved. This\ngives evidence that the class of functions computable in quantum polynomial time with\na small probability of error is robust, in that it does not depend on the exact architecture\nof a quantum computer. By analogy with the classical class BPP, this class is called\nBQP.\nConsider a system with n components, each of which can have two states. Whereas\nin classical physics, a complete description of the state of this system requires only n\nbits, in quantum physics, a complete description of the state of this system requires\n2n −1 complex numbers. To be more precise, the state of the quantum system is a\npoint in a 2n-dimensional vector space. For each of the 2n possible classical positions\nof the components, there is a basis state of this vector space which we represent, for\nexample, by |011 · · ·0⟩meaning that the ﬁrst bit is 0, the second bit is 1, and so on."}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q015", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What recent development has been observed in the implementation of Shor’s algorithm in the past two years?"}, {"title": "Đáp án chuẩn", "text": "Recent work has lowered qubit counts [17, 18, 19] and improved asymptotic runtime [20], particularly by leveraging advances in quantum error correction."}, {"title": "Bài", "text": "Practical Challenges in Executing Shor’s Algorithm"}, {"title": "Đoạn gốc (trang 5)", "text": "coin flipping than genuine quantum factoring. This underscores the importance of benchmarking\nimplementations that preserve the true complexity of order-finding.\nIn parallel, classical simulations of Shor’s algorithm on large-scale high-performance computing\nsystems have advanced significantly. Recent work [15] reached 39 bits RSA key length on GPU\nclusters, validating the algorithmic structure and resource trends in a controlled environment.\nNevertheless, the current (public) record is still held by classical algorithms such as the “Generalized\nNumber Field-Sieve” (GNFS) which has reached 829 bits of key length [16].\nOn the algorithmic side, the past two years have seen the first notable developments in the\n30 years since Shor’s discovery in 1994. Recent work has lowered qubit counts [17, 18, 19] and\nimproved asymptotic runtime [20], particularly by leveraging advances in quantum error correction"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q016", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is a critical task in 6G that can be enhanced by quantum machine learning for digital twins, holographic telepresence, semantic communications, and large-scale orchestration?"}, {"title": "Đáp án chuẩn", "text": "clustering"}, {"title": "Bài", "text": "Quantum Machine Learning for 6G Network"}, {"title": "Đoạn gốc (trang 2)", "text": "classical ML in tasks like factorization, cryptographic random\ngeneration, and clustering, enabling exponential speedups in\nsearch and optimization. This suggests that QML can deliver\nsuperior performance when properly deﬁned for speciﬁc tasks.\nIn 6G, clustering is a critical task that enhances the processing of massive, dynamic data, crucial for digital twins, holographic telepresence, semantic communications, and largescale orchestration. Quantum computing and QML can enhance these 6G applications by improving resource allocation, service load prediction, and system optimization for\ngreater efﬁciency. There are ongoing efforts in standardizing\nQML for AI and 6G, such as IEEE P3117, ETSI ISG-QKD,\nand ISO/IEC JTC 1/SC 42, which explores AI in quantum\ncomputing contexts or QKD [1]. Additionally, initiatives like\nthe Quantum Internet Blueprint by ITU-T and NIST’s PostQuantum Cryptography Standardization provide insights into"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q017", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the time complexity of the HHL algorithm for matrix inversion, and how does it compare to classical methods?"}, {"title": "Đáp án chuẩn", "text": "The HHL algorithm runs in time O(log N), an exponential speedup relative to classical matrix inversion (for fixed error and for fixed sparsity and condition number of A)."}, {"title": "Bài", "text": "Quantum Computing in the NISQ era and beyond"}, {"title": "Đoạn gốc (trang 11)", "text": "6.6\nQuantum matrix inversion\nQRAM has further implications for quantum algorithms. In particular, the task of matrix\ninversion admits an exponential quantum speedup, which could have many applications.\nThe algorithm we call HHL [40] (after the three authors who ﬁrst discussed it nine years\nago) takes as input a succinct representation of a very large N×N matrix A, which has\nto be suﬃciently sparse and well conditioned, and also as input an N-component vector\n|b⟩, encoded in QRAM as a quantum state of log N qubits. The output of the quantum\nalgorithm is (with a small error) the quantum state |A−1b⟩, the result of applying the\ninverse of the matrix A to the input vector |b⟩. This quantum algorithm runs in time\nO(log N), an exponential speedup relative to classical matrix inversion (for ﬁxed error and\nfor ﬁxed sparsity and condition number of A).\nHowever, aside from the caveat that the matrix A must be sparse and well conditioned,"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q018", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What does the equation ⟨∂kE⟩= Z dUp(U)∂k ⟨0| U(⃗θ)†HU(⃗θ) |0⟩ represent in the context of the paper?"}, {"title": "Đáp án chuẩn", "text": "that leads to the value we are interested in, namely ⟨∂kE⟩= Z dUp(U)∂k ⟨0| U(⃗θ)†HU(⃗θ) |0⟩, where p(U) is the probability distribution function of U."}, {"title": "Bài", "text": "Barren plateaus in quantum neural network training landscapes"}, {"title": "Đoạn gốc (trang 3)", "text": "3\nthat led to that point. We will use a practical deﬁnition\nthat leads to the value we are interested in, namely\n⟨∂kE⟩=\nZ\ndUp(U)∂k ⟨0| U(⃗θ)†HU(⃗θ) |0⟩\n(6)\nwhere p(U) is the probability distribution function of U.\nA review on the properties of products of independent\nrandom matrices can be found in Ref. [45]. The assumptions of independence and at least one of U−or U+ forming a 1-design in our RPQCs implies that ⟨∂kE⟩= 0, as\nshown in the appendix.\nLevy’s lemma informs our intuition about the the expected variance of this quantity through simple geometric arguments. In particular, Haar random unitaries on\nn qubits will output states uniformly in the D = 2n −1\ndimensional hypersphere.\nThe derivative with respect\nto the parameters θ is Lipschitz continuous with some\nparameter η that depends on the operator H.\nLevy’s\nlemma then implies that the variance of measurements\nwill decrease exponentially in the number of qubits. This"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q019", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the scaling time for estimating a single gradient component in random quantum circuits compared to classical implementations?"}, {"title": "Đáp án chuẩn", "text": "The estimation of even a single gradient component will scale as O(1/ϵα) for some small power α in the quantum case, as opposed to O(log(1/ϵ)) time in classical implementations."}, {"title": "Bài", "text": "Barren plateaus in quantum neural network training landscapes"}, {"title": "Đoạn gốc (trang 1)", "text": "One might also expect, based on recent experimental designs for “quantum supremacy”, that random quantum\ncircuits are a powerful tool for such a task [31]. Also, despite concerns about gradient-based methods in classical\ndeep neural networks [32–34], they are successful [24],\neven if using random initialization [33, 35].\nHowever,\nin the quantum case one must remember that the estimation of even a single gradient component will scale\nas O(1/ϵα) for some small power α [36] as opposed to\nclassical implementations where the same is achieved in\nO(log(1/ϵ)) time.\nWe will present results related to random quantum\ncircuits in the context of the exponential dimension\nof Hilbert space and gradient based hybrid quantumclassical algorithms. A cartoon depiction of this is given\narXiv:1803.11173v1 [quant-ph] 29 Mar 2018"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q020", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What method does the implementation use for modular addition in the Cuccaro-style ripple-carry adder?"}, {"title": "Đáp án chuẩn", "text": "a two’s-complement overflow/comparator method for modular addition [27]"}, {"title": "Bài", "text": "Practical Challenges in Executing Shor’s Algorithm"}, {"title": "Đoạn gốc (trang 7)", "text": "CNOT-like primitive). The Readout Error (RO) quantifies the probability of misclassifying the\nfinal measurement outcome (|0⟩↔|1]⟩). These values reflect native, physical error rates without\nQEC; lower values permit deeper and wider circuits before noise dominates.\nCode\nOur implementation is based on standard constructions for reversible arithmetic. We employ a Cuccaro-style ripple-carry adder [26] and a two’s-complement overflow/comparator method\nfor modular addition [27], avoiding QFT-space adders [28]. Controlled powers of a are implemented\nvia precomputed exponents a2k mod N within a textbook QPE order-finding scaffold [29, 30] and\nwe target Qiskit Runtime Sampler V2 [31].\nImplementation Approaches\nWe derived an implementation of order-finding via Quantum\nPhase Estimation (QPE) that avoids the ad-hoc modular exponentiation tailored to a specific\nN. Instead of hard-coding multiply-by-a mod N for a fixed N, we programmatically assemble a"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q021", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What mechanism does Proof-of-Coverage (PoCo) use to confirm that hotspot devices are truly located where they claim to be?"}, {"title": "Đáp án chuẩn", "text": "The mechanism performs this by utilizing radio waves to confirm that a hotspot indeed offers authentic wireless services."}, {"title": "Bài", "text": "Post-Quantum_Blockchain_Security_for_the_Internet_of_Things_Survey_and_Research_Directions"}, {"title": "Đoạn gốc (trang 10)", "text": "distributed ledger. Proof-of-Coverage (PoCo) relies on hotspot\ndevices working in the network. Validator nodes (miners)\ncan conﬁrm that hotspot devices are truly located where\nthey claim to be using a unique consensus process called\nproof-of-coverage [106]. The mechanism performs this by\nutilizing radio waves to conﬁrm that a hotspot indeed offers\nauthentic wireless services. Once established, new blocks are\nadded, new jobs are completed, and miners are rewarded.\nThe success of the Helium blockchain network depends on\nAuthorized licensed use limited to: Hanoi University of Science & Technology. Downloaded on May 14,2026 at 04:34:57 UTC from IEEE Xplore. Restrictions apply."}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q022", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "Which post-quantum signature algorithm is mentioned as being more vulnerable to side-channel attacks due to its use of Fast Fourier Transform over floating-point numbers?"}, {"title": "Đáp án chuẩn", "text": "FALCON post-quantum signature"}, {"title": "Bài", "text": "Post-Quantum_Blockchain_Security_for_the_Internet_of_Things_Survey_and_Research_Directions"}, {"title": "Đoạn gốc (trang 21)", "text": "1) Side-Channel Attacks: Side-channel attacks are a sort of\nsecurity vulnerability that seeks to observe or take advantage\nof the unintended consequences of a system or its hardware\nto acquire data or modify the program execution of a system.\nPost-quantum algorithms are still being developed and have\nnot been extensively tested in the real world. Therefore, the\npost-quantum-based IoT network will potentially be affected\nby this attack because IoT devices are widely available\nand need to be aware of side-channel attack risks. Latticebased cryptography algorithms have been demonstrated to\nbe susceptible to side-channel attacks due to their structural\nweaknesses [203], [204], [205]. For instance, although the\nFALCON post-quantum signature exhibits good performance\nfor use in IoT environments, it uses the less popular Fast\nFourier Transform (FFT) over ﬂoating-point numbers rather\nthan the more common NTTs, making it more vulnerable to"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q023", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "How much extra resource does the proposed protected design consume compared to the unprotected Kyber implementation?"}, {"title": "Đáp án chuẩn", "text": "the proposed protected design only consumes an extra resource of 260 Slices."}, {"title": "Bài", "text": "A Hardware-Friendly Shuffling Countermeasure Against Side-Channel Attacks for Kyber"}, {"title": "Đoạn gốc (trang 5)", "text": "with huge permutation space can significantly improve the\nside-channel security of Kyber’s hardware implementation. It\nshould be pointed out that we have omitted the CPA results of\nmodular reduction and subtraction here for simplicity as they\nadopt the same defense countermeasure and have the similar\nconclusions.\nB. Comparisons on Area and Performance\nTable II shows the experiment results and comparison\nof Kyber’s hardware implementations with different hiding\nschemes, including the area and time performance. Compared\nto the unprotected Kyber implementation [11], the proposed\nprotected design only consumes an extra resource of 260\nSlices. The numbers of DSPs and BRAMs both are the same.\nCompared with the unprotected design, the ATP (also area) of\nthe proposed version is increased by only 8.7%.\nWe also make comparisons with previous protected Kyber\nhardware implementations. It can be seen that the hiding"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q024", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the role of the quantum generator in QuGANs?"}, {"title": "Đáp án chuẩn", "text": "The generator mimics real quantum data."}, {"title": "Bài", "text": "Quantum Machine Learning for 6G Network"}, {"title": "Đoạn gốc (trang 5)", "text": "perturbations to attack. Accordingly, the iterative training\nprocess involves training the model on both clean and adversarially modiﬁed data, optimizing for improved robustness.\nThe idea is to mitigate the impact of adversarial attacks by\nencouraging models to generalize data patterns and recognize\nmalicious samples more effectively [7]. As an example in\nSection IV and Fig. 5(b), the QML model is trained on both\nbenign and perturbed states to recognize and correctly classify\nbenign and perturbed data. Adversarial training can sustain\nperformance levels comparable to the no-attack scenario, even\nwhen adversarial attacks are present.\nQuantum defense-GANs (QuGANs). The QuGAN model\ncomprises a quantum generator and discriminator, both as variational quantum circuits. The generator mimics real quantum\ndata, while the discriminator distinguishes between generated\nand real states. The training follows an adversarial minimax"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q025", "title": "multi-hop", "blocks": [{"title": "Câu hỏi", "text": "How does the St-HQCNN model, which combines quantum and classical neural networks, potentially enhance quantum key distribution (QKD) security compared to the Quantum Convolutional Neural Network (QCNN) architecture discussed in the context of image classification?"}, {"title": "Đáp án chuẩn", "text": "The St-HQCNN model, a quantum-classical hybrid neural network, can be used in quantum-enhanced cryptographic security, which is an improvement over the QCNN architecture that focuses on image classification. Specifically, St-HQCNN can offer advantages in QKD, such as eavesdropping detection, error and noise reduction, and improved scalability, whereas QCNN addresses the issue of the barren plateau phenomenon in quantum convolutional architectures."}, {"title": "Bài A", "text": "Beyond Barren Plateaus - A Scalable Quantum Convolutional Architecture for High-Fidelity Image Classification"}, {"title": "Đoạn của bài A", "text": "resilience to global phase damping and bit-flip\ncascading compared to highly entangled global\nprojectors.\nThrough this rigorous software pipeline, utilizing advanced tensor network approximations\ncombined with exact quantum gradient descent,\nour framework isolates the exact variables responsible for quantum advantage in computer vision tasks. The consequent numerical results extracted from this framework are analyzed comprehensively in the following section.\n4\nEmpirical Results and Discussion\nThe theoretical propositions established in the\npreceding sections mathematically guarantee that\nour Quantum Convolutional Neural Network\n(QCNN) architecture circumvents the barren\nplateau phenomenon via localized cost functions\nand Tensor Network Initialization (TNI). However, theoretical trainability does not automatically translate to empirical dominance, especially when benchmarking against highly optimized classical algorithms on datasets as complex\nas MNIST."}, {"title": "Bài B", "text": "Quantum key distribution through quantum machine learning - a research review"}, {"title": "Đoạn của bài B", "text": "robust\nsolutions.\nAmong\nthese,\nPSO,\na\nnature-inspired\nmetaheuristic algorithm, stands out due to its fewer control\nparameters,\nfaster\nsearch\nrate,\nand\nlower\ncomputational\ncomplexity. It has proven highly effective in addressing various\nengineering\nand\nAI\noptimization\nchallenges,\nparticularly\nin\nidentifying optimal solutions across a wide range of applications\n(Gong C. et al., 2024; She et al., 2025) discuss quantum-classical\nhybrid neural network model—St-HQCNN which can be used in\nquantum-enhanced cryptographic security, anomaly detection, and\nQKD protocols optimization (Gong L. et al., 2024). discusses the\nQuantum K-Nearest Neighbor (QKNN) classiﬁcation algorithm,\nutilizing a divide-and-conquer strategy, which offers several\nadvantages in QKD, including eavesdropping detection, error and\nnoise reduction, and improved scalability. The advancement of\nQKD\nincludes\na\nproposed\nstrategy\nfor\nmeasurement-free"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q026", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the value of the integer c′ in equation (6.19)?"}, {"title": "Đáp án chuẩn", "text": "c′ = c(p −1) −{c(p −1)}q / q"}, {"title": "Bài", "text": "Polynomial-Time Algorithms for Prime Factorization and Discrete Logarithms on a Quantum Computer"}, {"title": "Đoạn gốc (trang 22)", "text": "q + r\n\u0012c(p −1) −{c(p −1)}q\n(p −1)q\n\u0013\n≤1\n2q\n(mod 1),\n(6.18)\nwhere this equation was obtained from condition (6.10) by dividing by q. The ﬁrst thing\nto notice is that the multiplier on r is a fraction with denominator p −1, since q evenly\ndivides c(p −1) −{c(p −1)}q. Thus, we need only round d/q oﬀto the nearest multiple\nof 1/(p −1) and divide (mod p −1) by the integer\nc′ = c(p −1) −{c(p −1)}q\nq\n(6.19)\nto ﬁnd a candidate r. To show that the quantum calculation need only be repeated a\npolynomial number of times to ﬁnd the correct r requires only a few more details. The\nproblem is that we cannot divide by a number c′ which is not relatively prime to p −1.\nFor the discrete log algorithm, we do not know that all possible values of c′ are\ngenerated with reasonable likelihood; we only know this about one-twelfth of them.\nThis additional diﬃculty makes the next step harder than the corresponding step in the"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q027", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What percentage of attacks were successful with five traces on a fifth-order masked implementation using cyclic rotations?"}, {"title": "Đáp án chuẩn", "text": "87.085%"}, {"title": "Bài", "text": "Investigating CRYSTALS-Kyber Vulnerabilities - Attack Analysis and Mitigation"}, {"title": "Đoạn gốc (trang 9)", "text": "on a fifth-order masked implementation employing cyclic rotations, 54.53% with three\ntraces, and 87.085% with five traces.\nIn terms of hardware, it may resemble a smart card in certain ways, but it differs\ngreatly from high-end gadgets like desktop PCs, servers, and cell phones. Even with simply\nintegrated 1 GHz CPUs, simple power analysis side-channel assaults are far more difficult\nto execute, needing tens of thousands of traces with a high-end oscilloscope placed in close\nproximity to the processor. This type of physical access to a server offers far better attack\nvectors; all you need to do is connect the oscilloscope to the memory bus.\nPower-side channel assaults are generally regarded as unfeasible, with the exception\nof extremely sensitive applications. However, throttling may occasionally cause an exceptionally strong power side-channel assault to become a distant timing attack when the\nplanets align. To be clear, this attack is not even close to what is happening."}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q028", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What were the key parameters compared in the computational efficiency benchmark for classical and post-quantum cryptographic algorithms?"}, {"title": "Đáp án chuẩn", "text": "The benchmark compared the average key generation, encryption, and decryption/signing times across classical algorithms (RSA-2048, ECC-P256) and post-quantum candidates (Kyber-512, Dilithium-II, Falcon512)."}, {"title": "Bài", "text": "A Comparative Study of Classical and Post-Quantum Cryptographic Algorithms in the Era of Quantum Computing"}, {"title": "Đoạn gốc (trang 9)", "text": "5\nEmpirical Comparative Analysis and Practical Implications\nTo fully understand the impact of the transition from classical to post-quantum\ncryptographic algorithms, it is essential to analyze their practical performance,\nresource requirements, and resistance against both classical and quantum threats.\nThis section provides a comparative evaluation based on three axes: computational efficiency, key and ciphertext sizes, and security assumptions.\n5.1\nComputational Efficiency Across Platforms\nA practical benchmark was conducted to compare the average key generation,\nencryption, and decryption/signing times across classical algorithms (RSA-2048,\nECC-P256) and post-quantum candidates (Kyber-512, Dilithium-II, Falcon512), using standardized NIST test vectors and implementations optimized in C.\nTests were performed on a 2.4 GHz Intel CPU with 16 GB RAM under Linux."}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q029", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the performance gap between classical CNNs and naive QCNN implementations on the MNIST benchmark?"}, {"title": "Đáp án chuẩn", "text": "classical CNNs routinely achieve accuracies exceeding 99% on standard benchmarks like MNIST, whereas naive QCNN implementations languish in the 50%–60% range."}, {"title": "Bài", "text": "Beyond Barren Plateaus - A Scalable Quantum Convolutional Architecture for High-Fidelity Image Classification"}, {"title": "Đoạn gốc (trang 1)", "text": "However, transitioning from theoretical constructs to empirical dominance has proven exceptionally difficult. Initial studies, including our\npreliminary investigations, revealed a stark performance gap: classical CNNs routinely achieve\naccuracies exceeding 99% on standard benchmarks like MNIST, whereas naive QCNN implementations languish in the 50%–60% range. This\ndiscrepancy is not merely an artifact of immature\nquantum hardware; rather, it is deeply rooted in\nthe mathematical geometry of the variational loss\nlandscape. The editorial board of Quantum correctly highlights that variational quantum algorithms are plagued by scalability issues, most notably the barren plateau phenomenon, which often strips QCNNs of any potential quantum advantage [1].\nIn this paper, we directly confront the barren\nplateau problem in QCNNs. We argue that correctness in circuit design is insufficient for accep1\narXiv:2603.11131v1 [cs.LG] 11 Mar 2026"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q030", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "How many CCZ states are required for the largest lookups during loop1?"}, {"title": "Đáp án chuẩn", "text": "These lookups need at least 26 −6−1 = 57 CCZ states, and at least 63 layers of lattice surgery [Bab+18]."}, {"title": "Bài", "text": "How to factor 2048 bit RSA integers with less than a million noisy qubits"}, {"title": "Đoạn gốc (trang 20)", "text": "computing its output but it still needs to uncompute one of its inputs. This is strictly simpler,\nnot requiring any CCZ states, so the whole adder will take at most 800 · 2 = 1600 microseconds.\nI round this up to 2 milliseconds to leave slack for things like rearranging qubits at the beginning\nand end of the operation. See Appendix A.2 for a more detailed mock-up of the addition operation.\nThe largest lookups that occur are the w1 = 6 address qubit lookups during loop1. These\nlookups need at least 26 −6−1 = 57 CCZ states, and at least 63 layers of lattice surgery [Bab+18].\nThis will take at least 63 · 25 = 1575 microseconds. I again round this up to 2 milliseconds for\nslack. See Appendix A.4 for a more detailed mock-up of the lookup operation.\nThe largest phaseup operations also use 6 qubit addresses. This requires 8 CCZ states (instead\nof the 64 used by a 6 qubit lookup), and the amount of lattice surgery required is similarly more"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q031", "title": "multi-hop", "blocks": [{"title": "Câu hỏi", "text": "How might the hypothesis-testing approach proposed by Xiaoming et al. [39] for detecting PNS attacks in decoy-state MDI-QKD be affected by twin-field QKD schemes, particularly in terms of its effectiveness against PNS attacks that leave overall statistics nearly unchanged?"}, {"title": "Đáp án chuẩn", "text": "The hypothesis-testing approach by Xiaoming et al. [39] is effective against PNS attacks that significantly alter detection rates but may be evaded by subtler PNS strategies that leave overall statistics nearly unchanged. Twin-field QKD schemes, such as entanglement-based MDI-QKD and prepare-and-measure MDI-QKD, involve complex setups with bidirectional channels and entanglement swapping, which could potentially allow for more sophisticated PNS attacks that might not be detected by Xiaoming et al.'s method."}, {"title": "Bài A", "text": "QUANTUM KEY DISTRIBUTION - Bridging Theoretical Security Proofs, Practical Attacks, and Error Correction"}, {"title": "Đoạn của bài A", "text": "(ii) Xiaoming et al. [39] propose a hypothesis-testing approach to detect photon-number splitting (PNS) attacks\nin decoy-state MDI-QKD. They formulate the null hypothesis H0,– “no PNS attack” – and derive a test\nstatistic z assuming Gaussian fluctuations. At the 5% significance level (|z| > 1.96), they reject H0 and\ndiscard affected pulses; otherwise, they accept H0 and retain them. Using realistic experimental parameters,\nthey obtain z = 0.236, yielding a Type I error probability below 5% and thus no attack detected under H0.\nHowever, this test is effective only against PNS attacks that significantly alter detection rates; subtler PNS\nstrategies that leave overall statistics nearly unchanged may evade its detection.\n(iii) Shang et al. [40] propose two joint-PNS attacks on semi-quantum QKD (SQKD), where a fully quantum\nAlice communicates with a classical Bob [41]. In both attacks, Eve exploits bidirectional channels to siphon"}, {"title": "Bài B", "text": "Post-Quantum Cryptography and Quantum-Safe Security"}, {"title": "Đoạn của bài B", "text": "Post-Quantum Cryptography and Quantum-Safe Security: A Comprehensive Survey\n21\nFig. 6. Illustration of twin-field QKD schemes that overcome the PLOB bound. (a) Entanglement-based\nMDI-QKD with single-photon Bell state measurement (BSM): Carl and James each prepare a single-photon\nBell state, while Charlie performs entanglement swapping. 𝑀denotes the measurement basis (e.g., Z, X, or\nY), which Carl and James apply after Charlie’s BSM. (b) Prepare-and-measure MDI-QKD: Carl and James\ndirectly prepare qubits as superpositions of vacuum and one-photon states, performing 𝑀before Charlie\nexecutes the single-photon BSM. (c) Effective TF-QKD: indistinguishable photons from single-photon and\nlaser sources enable long-distance interference. The single-photon source provides Z-basis encoding, while the\nlaser source supports phase encodings (X and Y bases). Stable phase references are required for long-distance\nlaser interference."}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q032", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What type of quantum device is the D-Wave 2000Q machine and how many qubits does it have?"}, {"title": "Đáp án chuẩn", "text": "The D-Wave 2000Q machine is a quantum annealer and it has 2000 qubits."}, {"title": "Bài", "text": "Quantum Computing in the NISQ era and beyond"}, {"title": "Đoạn gốc (trang 8)", "text": "work. That might happen in particular for the quantum optimization algorithms we’re\nplanning to test.\nBut I emphasize again that the imperfect gates in NISQ systems will severely limit\ntheir computational power, because circuits with many gates will be too noisy to give\nuseful results.\nNear-term experiments will explore what we can do with of order 100\nqubits, and with circuit depth (number of time steps) less than 100, maybe much less. A\nvibrant discussion between quantum algorithm designers and application users might point\nthose experiments in promising directions; I hope that this article can help to facilitate\nand inspire that discussion.\n6.3\nQuantum annealing\nI have emphasized 50 to 100 qubits as a coming milestone for quantum technology, but in\nfact we have a 2000-qubit quantum device now, the D-Wave 2000Q machine. This machine\nis not a circuit-based quantum computer. Rather it is what we call a quantum annealer; it\nAccepted in Quantum 2018-07-30, click title to verify\n8"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q033", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What did Bellavista et al. develop as a secure way for the interoperability of blockchains?"}, {"title": "Đáp án chuẩn", "text": "a trusted execution environment-based relay system"}, {"title": "Bài", "text": "Post-Quantum_Blockchain_Security_for_the_Internet_of_Things_Survey_and_Research_Directions"}, {"title": "Đoạn gốc (trang 14)", "text": "decentralized data trading platform based on blockchain that\nincorporates double and side chains as well as smart contracts.\nOn the collaborative production, Bellavista et al. [128] also\nnoted that there are numerous blockchain-based solutions,\nbut they are incompatible with one another. Therefore, the\nresearcher developed a trusted execution environment-based\nrelay system as a secure way for the interoperability of\nblockchains. Another area of IIoT that can use blockchain is\nthe production traceability system. To trace and monitor the\nownership data of the parts and components from the equipment producer to the supplier and customers, Hasan et al. [129]\nbuilt a spare part inventory system. The proposed solution\ndescribes the speciﬁcs of smart contracts, such as trigger\nevents and functions. Product Lifecycle Management (PLM)\nand energy trading are two other aspects of IIoT, for which\nresearchers use blockchains to solve the problem of centralized\nentities in these areas [134], [135]."}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q034", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What methods does the northbound interface provide for managing services?"}, {"title": "Đáp án chuẩn", "text": "The interface provides three simple methods for creating, modifying, and deleting services."}, {"title": "Bài", "text": "Quantum Key Distribution Networks -- Key Management - A Survey"}, {"title": "Đoạn gốc (trang 18)", "text": "a topology module collects and stores information about the QKD network topology and nodes, whereas a resource\nmodule deals with more dynamic data, gathering and storing real-time secret key rates of QKD links. Multiple clients\nrequest secret-key rate (SKR) settings from the QKD infrastructure via the northbound interface, which is realized as a\nREST-based API using the HTTP protocol. The interface provides three simple methods for creating, modifying, and\ndeleting services. According to the requirements, a centralized control layer allocates available SKR on each QKD link\nalong a path to fulfill service requests from multiple clients.\nThe same authors proposed the Multi-Tenant Key Algorithm (MTKA) in a 2019 study [74]. It adheres to the same\nprinciples as SDQaaS in providing a centralized and detailed view of the QKD network infrastructure and its resources.\nEfficient secret key resource usage can be achieved by maximizing the Matching Degree (MD) function, a sum of"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q035", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "Which cryptographic libraries have moved aggressively to implement NIST’s post-quantum algorithms according to the analysis?"}, {"title": "Đáp án chuẩn", "text": "Libraries like wolfSSL, Bouncy Castle and Botan have moved aggressively to implement NIST’s postquantum algorithms, providing developers with ready-to-use"}, {"title": "Bài", "text": "A Survey of Post-Quantum Cryptography Support in Cryptographic Libraries"}, {"title": "Đoạn gốc (trang 11)", "text": "Preprint – A Survey of Post-Quantum Cryptography Support in Cryptographic Libraries\n11\n• Cryptographic library maintainers should treat PQC\nsupport as a high priority in their roadmaps over the\nnext 1 to 2 years, given that NIST has finalized the first\nPQC standards.\nThe “day when quantum computers arrive” is uncertain, but the\nresponse of the open-source crypto community, as evidenced\nby this analysis, is well underway. By continuing on this path,\nand addressing the gaps identified, we can achieve a state where\nwidely used crypto libraries provide drop-in quantum resilience,\nenabling the secure systems of today to protect against the threats\nof tomorrow.\n7\nConclusion\nThe analysis of these nine cryptographic libraries reveals a landscape of uneven progress toward post-quantum cryptography\nsupport. On one end, libraries like wolfSSL, Bouncy Castle\nand Botan have moved aggressively to implement NIST’s postquantum algorithms, providing developers with ready-to-use"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q036", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What method does Gisin et al. use to analyze the back-scattered signal in their Trojan-horse attack on QKD?"}, {"title": "Đáp án chuẩn", "text": "Gisin et al. use both Optical Time-Domain Reflectometry (OTDR) and Optical Frequency-Domain Reflectometry (OFDR) to analyze the back-scattered signal."}, {"title": "Bài", "text": "QUANTUM KEY DISTRIBUTION - Bridging Theoretical Security Proofs, Practical Attacks, and Error Correction"}, {"title": "Đoạn gốc (trang 12)", "text": "(i) Gisin et al. [45] experimentally demonstrate Trojan-horse attacks on QKD by injecting weak light pulses\nand analyzing the back-scattered signal using both Optical Time-Domain Reflectometry (OTDR) and Optical\nFrequency-Domain Reflectometry (OFDR). They find that allowing just 0.1 back-scattered photons enables\nEve to gain up to 0.135 bits per qubit, and that randomizing Alice’s phase settings reduces Eve’s information by\na factor of approximately 1.44—thereby lowering the required privacy amplification. Their analysis, however,\nassumes auxiliary detectors can instantly flag anomalous intensities and proposes “optical fuses” that, while\ntheoretically sound, are not yet practical with today’s technology.\n(ii) Yang et al. [16] propose a Trojan-horse attack on the BKM07 semi-quantum key distribution protocol, targeting\nits classical Bob implementation. After Alice sends qubits prepared in the X or Z basis, Eve intercepts"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q037", "title": "multi-hop", "blocks": [{"title": "Câu hỏi", "text": "How does the HHL algorithm, discussed in the survey of quantum machine learning, relate to the quantum linear systems problem addressed in variational quantum algorithms for solving linear equations?"}, {"title": "Đáp án chuẩn", "text": "The HHL algorithm, a quantum algorithm for solving linear systems of equations, provides a theoretical foundation for the quantum linear systems problem (QLSP) mentioned in variational quantum algorithms. While variational quantum algorithms aim to achieve heuristic scalings compatible with the NISQ era, the HHL algorithm offers a provable quantum speedup for the same problem, highlighting the potential for quantum machine learning to enhance classical methods in solving linear systems."}, {"title": "Bài A", "text": "Variational quantum algorithms"}, {"title": "Đoạn của bài A", "text": "C.\nMathematical applications\nSeveral VQAs have been proposed to tackle relevant\nmathematical problems such as solving linear systems of\nequations or integer factorization. Since in many cases\nthere exist quantum algorithms for the fault-tolerant era\naimed for these tasks, the goal of VQAs is to have heuristical scalings comparable to the provable scaling of these\nnon-near-term algorithms while keeping the algorithm requirements compatible with the NISQ era.\n1.\nLinear systems\nSolving systems of linear equations has wide-ranging\napplications in science and engineering. Quantum computers oﬀer the possibility of exponential speedup for this\ntask. Speciﬁcally, for an N × N linear system Ax = b\n(with A an N × N matrix, and b an N × 1 column vector deﬁned from the linear systems problem), one considers the Quantum Linear Systems Problem (QLSP)\nwhere the task is to prepare a normalized state |x⟩such"}, {"title": "Bài B", "text": "A Survey of Quantum Machine Learning - Foundations,Algorithms, Frameworks, Data and Applications"}, {"title": "Đoạn của bài B", "text": "for future research, suggesting potential intersections with quantum-enhanced methods.\nIn the optimization domain, [36] provides a detailed review of quantum metaheuristic algorithms,\nexploring their integration of quantum computing principles to enhance global optimization\ncapabilities. It highlights the benefits of quantum computing in improving convergence rates and\nbalancing exploration and exploitation in search spaces.\n2.3\nAlgorithm-focused Surveys\nThe authors in [32] provide an in-depth examination of the Harrow-Hassidim-Lloyd (HHL) algorithm for solving linear systems of equations. The survey discusses the theoretical foundations of the\nHHL algorithm and its applications in QML, such as regression analysis and principal component\nanalysis. It offers valuable insights for readers with a strong background in quantum computing\nbut with high technical complexity.\nZhang et al. [116] explore the development of quantum neural networks, specifically, architectures,"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q038", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the main goal of the roadmap presented in the paper?"}, {"title": "Đáp án chuẩn", "text": "To present a practical roadmap for implementing crypto-agility using CBOM analysis, hybrid encryption deployment, and automated CLM integration."}, {"title": "Bài", "text": "The-Quantum-Security-Deadline"}, {"title": "Đoạn gốc (trang 3)", "text": "2. To present a practical roadmap for implementing crypto-agility using CBOM analysis, \nhybrid encryption deployment, and automated CLM integration. \n3. To recommend policy and compliance measures ensuring PQC readiness across digital \nsupply chains. \n \nBy integrating cryptographic inventorying, automation, and governance, organizations can create \nadaptive systems that maintain operational security before, during, and after the quantum transition \n(Marchesi et al., 2025). The findings contribute to ongoing research in PQC deployment strategies \nand provide actionable guidance for cybersecurity leaders navigating this unprecedented paradigm \nshift."}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q039", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the cost function used in the non-weighted subspace VQE and what does minimizing it achieve?"}, {"title": "Đáp án chuẩn", "text": "The non-weighted subspace VQE makes use of the cost function C1(θ) = Pm_i=0⟨ϕi|U †(θ)HU(θ)|ϕi⟩. Minimizing C1 again gives the subspace of lowest eigenstates."}, {"title": "Bài", "text": "Variational quantum algorithms"}, {"title": "Đoạn gốc (trang 9)", "text": "9\nThe non-weighted subspace VQE makes use of the cost\nfunction C1(θ) = Pm\ni=0⟨ϕi|U †(θ)HU(θ)|ϕi⟩. Minimizing C1 again gives the subspace of lowest eigenstates.\nAs each state U(θ∗)|ϕi⟩is in a superposition of the\neigenstates, one needs to further optimize a second cost\nC2(θ∗, φ) = ⟨ϕi|V †(φ)U †(θ∗)HU(θ∗)V (φ)|ϕi⟩over parameters φ to rotate each state U(θ∗)V (φ)|ϕi⟩to an\neigenstate.\n5.\nMultistate contracted VQE\nThe multistate contracted VQE [56] can be regarded\nas a midway point between subspace expansion and\nsubspace VQE. It ﬁrst obtains the lowest energy subspace {U(θ∗)|ϕi⟩}m\ni=0 by optimizing C1(θ) as in the nonweighted subspace VQE. Instead of optimizing an additional unitary, the multistate contracted VQE approximates each eigenstate as |E⟩= P\ni αiU(θ∗)|ϕi⟩with coeﬃcients αi which are obtained by solving a generalised\neigenvalue problem similar to subspace expansion with\nS = 1.\n6.\nAdiabatically assisted VQE"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q040", "title": "multi-hop", "blocks": [{"title": "Câu hỏi", "text": "How might quantum games contribute to the development of quantum machine learning methods, and what role could they play in preparing enterprises for quantum-safe cybersecurity according to the two passages?"}, {"title": "Đáp án chuẩn", "text": "Quantum games could help develop a new generation's understanding of quantum phenomena, potentially benefiting quantum machine learning methods. Meanwhile, enterprises need to stay informed about the advancements in post-quantum cryptography (PQC) and other cybersecurity measures to prepare for the challenges posed by quantum computing, including the development of quantum-resistant architectures and techniques for migrating to more secure cryptographic systems."}, {"title": "Bài A", "text": "Quantum Computing in the NISQ era and beyond"}, {"title": "Đoạn của bài A", "text": "of quantum technology, we should not overlook the potential power of analog quantum\nsimulators.\n6.11\nQuantum games\nAdvances in classical computing launched a new world of digital games, touching the lives\nof millions and generating billions in revenue. Could quantum computers do the same?\nPhysicists often say that the quantum world is counter-intuitive because it is so foreign\nto ordinary experience. That’s true now, but might it be diﬀerent in the future? Perhaps\nkids who grow up playing quantum games will acquire a visceral understanding of quantum\nphenomena that our generation lacks. Furthermore, quantum games could open a niche for\nquantum machine learning methods, which might seize the opportunity to improve game\nplay in situations where quantum entanglement has an essential role.\n7\nThe daunting climb to scalability\nI’ve already emphasized repeatedly that it will probably be a long time before we have"}, {"title": "Bài B", "text": "Are Enterprises Ready for Quantum-Safe Cybersecurity"}, {"title": "Đoạn của bài B", "text": "including the development of more efficient PQC algorithms, techniques for easing migrations\n(like automated code translation for crypto), and maybe even quantum-resistant architectures\nfor things like blockchain and digital identity. Enterprise leaders should keep abreast of these\ndevelopments and remain adaptable. In the ever-evolving chess match of cybersecurity, the\nadvent of quantum computing is a major new move – but with foresight and collective action,\nwe can counter it and even harness its benefits securely, ensuring that the foundations of digital\ntrust remain intact in the quantum age."}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q041", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "How many basemul calls are selected for the CPA attack in the proposed trial-and-error lattice attack method?"}, {"title": "Đáp án chuẩn", "text": "We select 60 basemul calls for the CPA attack and use 38/39 of them as inputs for the lattice attack."}, {"title": "Bài", "text": "An Improved Two-Step Attack on Lattice-Based Cryptography - A Case Study of Kyber"}, {"title": "Đoạn gốc (trang 3)", "text": "8 if( guess_sk == [result[j] for j in index]:\n9\nreturn result\n10 else: for i in count:\n11\nupdata_index(index)\n12\nupdata_sk(guess_sk)\n13\nresult = Lattice_attack(index,guess_sk)\n14\nresult = (M @ result)\n15\nresult_target = result[j] for j in index\n16\nif(guess_sk == result_target):\n17\nreturn result\n18\nbreak\nWe elaborate on the theoretical foundation of lattice attacks,\nwhich can tolerate error coefficients of recovered key and still\nsuccessfully retrieve all 128 key. Leveraging this method, we\npropose a more flexible and versatile approach for its application. The proposed trial-and-error lattice attack is shown in\nListing 2, where n represents the number of CPA, and M and\ncount denote the NTT linear matrix form of Kyber and the\nnumber o
