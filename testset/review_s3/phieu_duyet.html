f trials, respectively. In our method, we select 60\nbasemul calls for the CPA attack and use 38/39 of them as\ninputs for the lattice attack. If the attack fails, the smallest input is replaced with another CPA result. This process continues"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q042", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "How many physical qubits are used by the hot storage and compute region combined?"}, {"title": "Đáp án chuẩn", "text": "The remaining 3f + 2ℓ+ len m = 131 logical qubits are in hot storage, and so cover 131 · 1352 = 177112 physical qubits. Finally, the compute region will use a 7x18 region of hot patches (170352 physical qubits). Combined, they use 177112 + 170352 = 347464 physical qubits."}, {"title": "Bài", "text": "How to factor 2048 bit RSA integers with less than a million noisy qubits"}, {"title": "Đoạn gốc (trang 18)", "text": "reach a per-patch per-round logical error rate of 10−15. So my hot patches will use 2·(25+1)2 = 1352\nphysical qubits per logical qubit. For the cold storage, again referring to Figure 6, yoking with\na 2D parity check code reaches a logical error rate of 10−15 when using 430 physical qubits per\nlogical qubit. So cold logical qubits will be roughly triple the density of hot logical qubits.\nThe n = 2048 row of Table 5 specifies s = 8, ℓ= 21, w1 = 6, w3 = 3, w4 = 5, f = 33, and\nm = 1280. Plugging these values into Table 4, the maximum logical qubit count occurs during\nloop4 when there are m + 3f + 2ℓ+ len m = 1409 logical qubits active. The m = 1280 input\nlogical qubits are in cold storage, and so cover 1280 · 430 = 550400 physical qubits. The remaining\n3f + 2ℓ+ len m = 131 logical qubits are in hot storage, and so cover 131 · 1352 = 177112 physical\nqubits. Finally, the compute region will use a 7x18 region of hot patches (170352 physical qubits)."}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q043", "title": "multi-hop", "blocks": [{"title": "Câu hỏi", "text": "How does the UCC ansatz, a problem-inspired ansatz strategy for variational quantum algorithms, compare to the use of unsupervised learning and advanced optimization algorithms in quantum machine learning for reducing computational overhead and resource usage in quantum key distribution through quantum machine learning?"}, {"title": "Đáp án chuẩn", "text": "The UCC ansatz is a problem-inspired ansatz strategy used in variational quantum algorithms to restrict the space explored by the ansatz during optimization, while unsupervised learning and advanced optimization algorithms such as PSO and simulated annealing are used in quantum machine learning to reduce resource usage and computational overhead. Both approaches aim to improve the efficiency of quantum algorithms, but they operate in different contexts: the UCC ansatz in variational quantum algorithms and unsupervised learning and optimization algorithms in quantum machine learning for quantum key distribution."}, {"title": "Bài A", "text": "Variational quantum algorithms"}, {"title": "Đoạn của bài A", "text": "networks.\n• Ansatz strategies.\nAnother strategy for preventing BPs is using structured ansatzes which are\nproblem-inspired. The goal here is to restrict the\nspace explored by the ansatz during the optimization. As discussed in the section on ansatzes, the\nUCC ansatz for VQE of the quantum alternating operator ansatz [23, 24] for optimization are\nproblem-inspired ansatzes which are usually trainable even when randomly initialized. Other ansatz\nstrategies include the proposals in Ref. [209] to\nlearning a mixed state, where one leverages knowledge of the target Hamiltonian to create a Hamiltonian variational ansatz. In addition, Refs. [60, 61]\npresented an approach where the ansatz for the solution is |ψ ({cµ})⟩= P\nµ cµ|ψµ⟩, for a ﬁxed set of\nstates {|ψµ⟩} determined by the problem at hand.\nHere the optimization over the coeﬃcients {cµ}\ncan be solved using a quadratically constrained\nquadratic program.\nFinally, we remark that along with ansatz strategies"}, {"title": "Bài B", "text": "Quantum key distribution through quantum machine learning - a research review"}, {"title": "Đoạn của bài B", "text": "Networks (GANs) help overcome hardware constraints by\nrequiring\nfewer\nQubits\nand\nenabling\nparallel\nprocessing.\nUnsupervised learning minimizes resource usage, reduces noise,\nlowers computational overhead, and facilitates adaptive quantum\nencoding\nand\ncompression—critical\nfor\nreal-time\nproblem\nanalysis. Additionally, advanced optimization algorithms such\nas\nant\ncolony\noptimization,\nbat\noptimization,\nsimulated\nannealing, genetic optimization, fruit ﬂy optimization, particle\nswarm\noptimization\n(PSO),\nand\nthe\ngravitational\nsearch\nmethod,\nwhen\ncombined\nwith\neffective\npreprocessing\ntechniques,\noffer\nmore\nrobust\nand\nefﬁcient\nsolutions.\nAdditionally, QSDC protocols are well-suited for a wide range\nof cryptographic applications, and several advanced protocols\nextending beyond QSDC have been developed. Unlike the QKD\nfamily of protocols, which focuses solely on secret key negotiation,\nQSDC\nenables\nsecure\ncommunication\nwithout\nrequiring\ncryptographic keys for encryption and decryption."}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q044", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the quantum entropy measure for community detection and how is it defined?"}, {"title": "Đáp án chuẩn", "text": "Quantum Entropy Measure for Community Detection: S(Q) = -Tr[ρ2 log(ρ2)] S(Q) is the von Neumann entropy. ρ is the density matrix. Tr denotes the trace operation. log denotes the matrix logarithm."}, {"title": "Bài", "text": "Quantum_Machine_Learning_A_Survey"}, {"title": "Đoạn gốc (trang 8)", "text": "social network analysis in machine learning. \nUse Cases: Social media analytics, network analysis, and recommender systems. \nFields of Use: Computer science, sociology, and social sciences. \nCommunity detection in networks often involves partitioning nodes into groups based on their connections. \nQuantum algorithms might use measures of node similarity and the concept of quantum entropy to define \ncommunities. \nExample: \nQuantum Entropy Measure for Community Detection: \nS(Q) = -Tr[ρ2 log(ρ2)] \nS(Q) is the von Neumann entropy. \nρ is the density matrix. \nTr denotes the trace operation. \nlog denotes the matrix logarithm. \nQuantum Recommendation Systems for Sequential Data: \nDescription: Quantum algorithms for recommendation systems that handle sequential data, providing \npersonalized suggestions over time. \nUse Cases: Personalized shopping, content recommendation, and user experience enhancement. \nFields of Use: E-commerce, entertainment, and digital advertising."}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q045", "title": "multi-hop", "blocks": [{"title": "Câu hỏi", "text": "How does the quantum analog of a Boltzmann machine, specifically a Quantum Boltzmann Machine (QBM), differ from a Quantum Circuit Born Machine (QCBM) in terms of their underlying principles and applications?"}, {"title": "Đáp án chuẩn", "text": "A Quantum Boltzmann Machine (QBM) is a quantum version of a classical Boltzmann machine, using quantum Hamiltonians to define energy functions, while a Quantum Circuit Born Machine (QCBM) is designed to generate samples from a probability distribution encoded in the amplitudes of a quantum state. QBM leverages quantum effects for potentially more efficient sampling, whereas QCBM focuses on minimizing the distance between the generated distribution and the target distribution for training purposes."}, {"title": "Bài A", "text": "Quantum Computing in the NISQ era and beyond"}, {"title": "Đoạn của bài A", "text": "Boltzmann machine. This may be regarded as a spin system in thermal equilibrium at a\nlow but nonzero temperature, with many hidden layers of spins separating the input and\noutput. (The word “restricted” means that there are no couplings among spins within a\ngiven layer; instead only spins in successive layers are coupled.) The system may have\nmillions of coupling parameters, which are optimized during a training phase to achieve\na desired joint probability distribution for input and output. The training may be supervised, for example the network might be taught to recognize a labeled set of photos, or\nunsupervised, in which case the goal is to identify patterns in an unlabeled training set of\ndata. The quantum analog of such a machine could have a similar structure and function,\nbut where the spins are qubits rather than classical bits. It may be that quantum deep\nlearning networks have advantages over classical ones; for example they might be easier to"}, {"title": "Bài B", "text": "A Survey of Quantum Generative Adversarial Networks"}, {"title": "Đoạn của bài B", "text": "Quantum Circuit Born Machines (QCBMs) are quantum circuits designed to\ngenerate samples from a probability distribution encoded in the amplitudes of a\nquantum state. The probability of measuring a particular bitstring x is given by\np(x) = |⟨x|U(θ)|0⟩|2.\n(5)\nQCBMs can be trained to approximate target probability distributions by minimizing\nthe distance between the generated distribution and the target distribution [10, 11].\nQuantum Boltzmann Machines (QBMs) are quantum versions of classical Boltzmann machines, leveraging quantum effects for potentially more efficient sampling.\nQBMs use quantum Hamiltonians to define energy functions\nH(θ) =\nX\ni\nhi(θ)Zi +\nX\ni,j\nJij(θ)ZiZj + . . . ,\n(6)\nwhere Zi represents the Pauli-Z operator acting on qubit i [12].\nQuantum Convolutional Networks (QCNs) are quantum analogues of classical\nconvolutional neural networks, particularly used for image-related tasks. QCNs apply"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q046", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What technique is used to solve the low-dimension LWE problem in this attack on Kyber?"}, {"title": "Đáp án chuẩn", "text": "We use Kannan’s embedding technique to solve this problem [12],"}, {"title": "Bài", "text": "An Improved Two-Step Attack on Lattice-Based Cryptography - A Case Study of Kyber"}, {"title": "Đoạn gốc (trang 3)", "text": "key coefficients ˆsi, while the remaining 128 −sr coefficients\nare unsuccessfully recovered. Let Ia = (a0, . . . , asr−1) denote\nthe recovered coefficients indices, and Ib = (b0, . . . , b127−sr)\nrepresent the indices of coefficients that have failed to be\nrecovered, i.e., the unknown coefficients. INTT(ˆsi) = Nˆsi =\nsi mod q can be rewritten as NAˆsiA + NBˆsiB = si mod\nq [8], where matrix NA = [na0, . . . , nasr−1] consists of\ncolumns in matrix N corresponding to the indices Ic, while\nˆsiA = [ˆsa0, . . . ,ˆsasr−1]⊤represents the vector composed of\nsuccessfully recovered coefficients. Similarly, NB and ˆsiB are\nobtained in the same manner.\nIn the above formulas, both NA and ˆsiA are known. Let t =\nNAˆsiA, A = −NB, and s′ = ˆsiB. Then, we obtain t = A ·\ns′+si mod q. This conveniently forms a low-dimension LWE\nproblem, which is simpler compared to the original problem\nin Kyber because the rank of A is smaller. We use Kannan’s\nembedding technique to solve this problem [12], where the"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q047", "title": "multi-hop", "blocks": [{"title": "Câu hỏi", "text": "How might quantum entropy measure for community detection in networks be applied in a quantum recommendation system for sequential data, and what advantage could this offer over classical methods according to the literature?"}, {"title": "Đáp án chuẩn", "text": "Quantum entropy measure for community detection in networks could be applied in a quantum recommendation system for sequential data by leveraging the von Neumann entropy and density matrix to define communities, which could provide personalized suggestions over time. This approach might offer advantages over classical methods, as quantum algorithms have been shown to achieve a significantly higher capacity in machine learning applications and potentially provide exponentially better ability to generalize when trained to solve deep learning problems, as mentioned in the literature."}, {"title": "Bài A", "text": "Quantum_Machine_Learning_A_Survey"}, {"title": "Đoạn của bài A", "text": "social network analysis in machine learning. \nUse Cases: Social media analytics, network analysis, and recommender systems. \nFields of Use: Computer science, sociology, and social sciences. \nCommunity detection in networks often involves partitioning nodes into groups based on their connections. \nQuantum algorithms might use measures of node similarity and the concept of quantum entropy to define \ncommunities. \nExample: \nQuantum Entropy Measure for Community Detection: \nS(Q) = -Tr[ρ2 log(ρ2)] \nS(Q) is the von Neumann entropy. \nρ is the density matrix. \nTr denotes the trace operation. \nlog denotes the matrix logarithm. \nQuantum Recommendation Systems for Sequential Data: \nDescription: Quantum algorithms for recommendation systems that handle sequential data, providing \npersonalized suggestions over time. \nUse Cases: Personalized shopping, content recommendation, and user experience enhancement. \nFields of Use: E-commerce, entertainment, and digital advertising."}, {"title": "Bài B", "text": "Variational quantum algorithms"}, {"title": "Đoạn của bài B", "text": "and optimization [204]. Similarly to quantum chemistry,\nlarge scale experiments of QAOA have already been implemented [286].\n2.\nMachine Learning\nIn the past few decades, the use of machine learning\nhas become common in most, if not all, areas of science.\nAlthough the problem of loading classical data\non quantum computers is still an active topic of research, there has been signiﬁcant eﬀorts put forward to\nuse quantum algorithms for machine learning applications [154, 157, 174, 287]. For instance, it has been shown\nthat quantum neural networks can achieve a signiﬁcantly\nhigher capacity, as measured by the eﬀective dimension,\nthan comparable classical neural networks [77], implying\nthat the former can express a broader class of functions\nthan the latter. Moreover, it has also been pointed out\nthat quantum algorithms can outperform classical ones\nin deep learning problems [288], potentially provide exponentially better ability to generalize when trained to"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q048", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the cost function used in the VQA approach for the time-independent non-linear Schrödinger equation?"}, {"title": "Đáp án chuẩn", "text": "The cost function is the total energy (sum of potential, kinetic, and interaction energies)."}, {"title": "Bài", "text": "Variational quantum algorithms"}, {"title": "Đoạn gốc (trang 11)", "text": "one can lower bound the ﬁdelity to the exact solution\nas |⟨ψ(θ∗)|x⟩|2 ≥1 −⟨ψ(θ∗)|HM|ψ(θ∗)⟩, thus verify the\nsolution’s correctness whenever the cost function is small.\n3.\nNon-linear equations\nNon-linear equations are important to various ﬁelds,\nespecially in the form of non-linear partial diﬀerential\nequations. However, mapping such equations onto quantum computers requires careful thought since the underlying mathematics of quantum mechanics is linear. To\naddress this, a VQA for such non-linear problems was\nproposed in Ref. [143].\nThe approach was illustrated\nfor the time-independent non-linear Schrödinger equation, where the cost function is the total energy (sum of\npotential, kinetic, and interaction energies), and where\nthe space was discretized into a ﬁnite grid.\nBy using multiple copies of variational quantum states in the\ncost-evaluation circuit, this VQA can compute non-linear\nfunctions."}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q049", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the formula for the phase transition probability in quantum phase transition algorithms?"}, {"title": "Đáp án chuẩn", "text": "Phase transition probability: P(x)=exp(−BJ(x)), where (J(x)) is the magnetization"}, {"title": "Bài", "text": "Quantum_Machine_Learning_A_Survey"}, {"title": "Đoạn gốc (trang 7)", "text": "J. Electrical Systems 20-6s (2024): 971-981 \n977 \n(A) is the covariance matrix of the data. \n(V) is the matrix of principal components. \nKey Points: Can achieve significant speedup compared to classical PCA, making it suitable for large datasets. \nQuantum Phase Transitions Algorithms \nDescription: Quantum phase transition algorithms study the quantum analogue of thermal phase transitions, \nwhich can provide insights into the learning dynamics of quantum systems. \nUse Cases: Used in the study of quantum systems to understand their thermodynamic properties and learning \nmechanisms. \nFields of Use: Applied in quantum information theory and quantum neuroscience. \nQPTAs use quantum states to study phase transitions in quantum systems. \nPhase transition probability: P(x)=exp(−BJ(x)), where (J(x)) is the magnetization \nQuantum Gaussian Mixture Models (QGMMS) \nDescription: Quantum Gaussian Mixture Models are quantum extensions of classical Gaussian mixture models,"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q050", "title": "multi-hop", "blocks": [{"title": "Câu hỏi", "text": "How does the hybrid quantum-classical model proposed by F. Rodríguez-Díaz et al. compare to the random circuit approach discussed by McClean et al., in terms of their effectiveness and challenges in noisy data scenarios and high-dimensional Hilbert spaces?"}, {"title": "Đáp án chuẩn", "text": "F. Rodríguez-Díaz et al. proposed a hybrid model that combines classical preprocessing with a variational quantum layer, achieving 99.58% accuracy and demonstrating enhanced robustness on noisy data. In contrast, McClean et al. discuss the challenges of using random circuits in hybrid quantum-classical algorithms, highlighting the issue of barren plateaus in high-dimensional Hilbert spaces, which can make training inefficient for more than a few qubits."}, {"title": "Bài A", "text": "A Survey of Quantum Machine Learning - Foundations,Algorithms, Frameworks, Data and Applications"}, {"title": "Đoạn của bài A", "text": "91:22\nF. Rodríguez-Díaz et al.\nclassical preprocessing with a variational quantum layer and mini-batch training. Their model\nachieved 99.58% accuracy, outperforming its classical counterpart and demonstrating enhanced\nrobustness on noisy data.\n𝑄𝐶models use quantum circuits as feature extractors, followed by classical layers that perform\nprediction. In this setup, quantum expectation values serve as intermediate representations, which\nare passed to classical neural networks or classifiers. This architecture balances quantum expressiveness with classical stability and has proven effective in various domains. For example, Dou\net al. [31] proposed a hybrid convolutional structure where parameterized quantum circuits act as\nsliding kernels, achieving strong performance on subsets of MNIST. Xiang et al. [125] integrated\nquantum layers into CNNs for breast cancer diagnosis, showing improved generalization across"}, {"title": "Bài B", "text": "Barren plateaus in quantum neural network training landscapes"}, {"title": "Đoạn của bài B", "text": "Barren plateaus in quantum neural network training landscapes\nJarrod R. McClean,1, ∗Sergio Boixo,1, † Vadim N. Smelyanskiy,1, ‡ Ryan Babbush,1 and Hartmut Neven1\n1Google Inc., 340 Main Street, Venice, CA 90291, USA\n(Dated: March 30, 2018)\nMany experimental proposals for noisy intermediate scale quantum devices involve training a\nparameterized quantum circuit with a classical optimization loop. Such hybrid quantum-classical\nalgorithms are popular for applications in quantum simulation, optimization, and machine learning.\nDue to its simplicity and hardware eﬃciency, random circuits are often proposed as initial guesses\nfor exploring the space of quantum states. We show that the exponential dimension of Hilbert space\nand the gradient estimation complexity make this choice unsuitable for hybrid quantum-classical\nalgorithms run on more than a few qubits. Speciﬁcally, we show that for a wide class of reasonable"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q051", "title": "multi-hop", "blocks": [{"title": "Câu hỏi", "text": "What potential trade-off might arise when making a quantum circuit more noise resilient in the context of quantum machine learning, and how does this relate to the development of quantum deep learning according to the surveys?"}, {"title": "Đáp án chuẩn", "text": "When making a quantum circuit more noise resilient, there might be a trade-off that makes it easier to simulate classically. This relates to quantum deep learning, as the potential of combining machine learning with quantum technology is discussed, particularly in the context of restricted Boltzmann machines, which can be seen as spin systems in thermal equilibrium."}, {"title": "Bài A", "text": "A Survey of Quantum Machine Learning - Foundations,Algorithms, Frameworks, Data and Applications"}, {"title": "Đoạn của bài A", "text": "A Survey of Quantum Machine Learning: Foundations,\nAlgorithms, Frameworks, Data and Applications\nFRANCESC RODRÍGUEZ-DÍAZ, Data Science and Big Data Lab, Universidad Pablo de Olavide, Seville,\nSpain\nDAVID GUTIÉRREZ-AVILÉS, Department of Computer Science, University of Seville, Seville, Spain\nALICIA TRONCOSO, Data Science and Big Data Lab, Universidad Pablo de Olavide, Sevilla, Spain\nFRANCISCO MARTÍNEZ-ÁLVAREZ, Data Science and Big Data Lab, Universidad Pablo de Olavide,\nSevilla, Spain\nQuantum machine learning combines quantum computing with machine learning to solve complex computational problems more efficiently than classical approaches. This survey provides an introduction to the\nfoundations, algorithms, frameworks, data and applications of quantum machine learning, serving as a resource\nfor researchers and practitioners. We begin by reviewing existing surveys to identify gaps that this work"}, {"title": "Bài B", "text": "Quantum Computing in the NISQ era and beyond"}, {"title": "Đoạn của bài B", "text": "and so extend the computational reach of NISQ technology. We should be wary, though,\nof a potential tradeoﬀ— making a quantum circuit more noise resilient may also make it\neasier to simulate classically.\n6.5\nQuantum deep learning\nMachine learning is transforming technology and having a big impact on science as well, so\nit is natural to wonder about the potential of combining machine learning with quantum\ntechnology. There are a variety of diﬀerent notions of “quantum machine learning.” Much\nof the literature on the subject builds on quantum algorithms that speed up linear algebra\nand related tasks [37, 38], and I’ll address such applications in the ensuing subsections.\nFirst, though, I’ll comment on the potential of quantum deep learning [39]. Deep learning itself has become a broad subject [27], but to be concrete let us contemplate a restricted\nBoltzmann machine. This may be regarded as a spin system in thermal equilibrium at a"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q052", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the name of the curated open repository introduced in the paper for the post-quantum cryptography community?"}, {"title": "Đáp án chuẩn", "text": "awesome-pqc1"}, {"title": "Bài", "text": "Post-Quantum Cryptography and Quantum-Safe Security"}, {"title": "Đoạn gốc (trang 3)", "text": "Post-Quantum Cryptography and Quantum-Safe Security: A Comprehensive Survey\n3\nchallenges, including performance optimization, side-channel resistance, and integration into\nresource-constrained or high-assurance environments [23, 27]. Third, we synthesize open research\ndirections, particularly in hybrid deployments, crypto-agility frameworks, and the interaction of\nPQC with complementary technologies such as Quantum Key Distribution (QKD) [35, 36]. Finally,\nto promote accessibility and continuous learning, we introduce awesome-pqc1, a curated open\nrepository that compiles state-of-the-art resources, research papers, libraries, and tools for the\npost-quantum cryptography community. This living repository serves as a practical companion\nto this survey and a long-term reference point for researchers and practitioners navigating the\nevolving landscape of quantum-safe cryptography.\nThe remainder of this paper is structured as follows. Section 2 introduces the taxonomy and"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q053", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What method is used to quantify signal quality in the experiments with N > 30?"}, {"title": "Đáp án chuẩn", "text": "Signal quality is quantified by windowed hit-rate versus the uniform baseline."}, {"title": "Bài", "text": "Practical Challenges in Executing Shor’s Algorithm"}, {"title": "Đoạn gốc (trang 8)", "text": "exploit vectorized sampling, and (iii) apply a uniform multi-peak histogram analysis pipeline based\non acceptance windows and binomial tests. In a fault-tolerant setting, either variant remains viable;\nour choice is driven by hardware constraints, not complexity.\nThe same circuit runs unchanged on Aer or IBM Runtime (SamplerV2).\nSignal quality is\nquantified by windowed hit-rate versus the uniform baseline. For larger N (N > 30), the convenient\nand generic dense permutation can be replaced by structured modular-arithmetic circuits without\nchanging the interface, preserving the generic pipeline while improving scalability.\n4.C\nResults (N=15, 21, 35)\nThe following histograms illustrate the measured results after performing quantum phase estimation\nrepeatedly. In all figures, the x-axis represents the binary bitstrings of the first eight qubits used in\nthe measured outcome, corresponding to the quantum states after executing the quantum circuit."}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q054", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What are the two sources of yield Yn for n ≥1 in the decoy state method?"}, {"title": "Đáp án chuẩn", "text": "For n ≥1, yield Yn comes from i) the detection of signal photons ηn, and ii) the background event pdark."}, {"title": "Bài", "text": "Decoy State Quantum Key Distribution"}, {"title": "Đoạn gốc (trang 2)", "text": "to avoid being detected, the eavesdropper, Eve, has very\nlimited options in her eavesdropping attack. In summary,\nthe ability for Alice and Bob to verify experimentally the\nvalues of Yn and en’s in the decoy state method greatly\nstrengthens their power in detecting eavesdropping, thus\nleading to a dramatic improvement in the performance\nof their QKD system.\nThe decoy state method allows Alice and Bob to detect\ndeviations from the normal behavior due to eavesdropping attacks. Therefore, in what follows, we will consider\nnormal behavior (i.e., the case of no eavesdropping). Details of QKD set-up model can be seen in [17].\nYield\nLet us discuss the yields, Yn’s, in a realistic\nset-up.\n(a) The case n = 0.\nIn the absence of eavesdropping, Y0 is simply given by\nthe background detection event rate pdark of the system.\n(b) The case n ≥1. For n ≥1, yield Yn comes from\ntwo sources, i) the detection of signal photons ηn, and\nii) the background event pdark. The combination gives,"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q055", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What type of quantum neural network showed improved accuracy and sensitivity in medical imaging applications for detecting abnormalities?"}, {"title": "Đáp án chuẩn", "text": "QCNNs"}, {"title": "Bài", "text": "Quantum_Machine_Learning_A_Survey"}, {"title": "Đoạn gốc (trang 9)", "text": "compared to classical methods. \n \nFig 4 Quantum Adversarial Attacks and Defences \nMedical imaging applications, such as chest X-ray classification, showed improved accuracy and sensitivity in \ndetecting abnormalities with QCNNs. These results suggest that QCNNs are a promising tool for early disease \ndiagnosis in healthcare. \nTime series prediction, specifically stock price forecasting, exhibited improvements with QRNNs over classical \nRNNs. The enhanced forecasting accuracy indicates that QRNNs could be a valuable addition to financial \nmodeling. \nTraining a QGAN model on the Fashion MNIST dataset resulted in high-quality and diverse synthetic images. \nThese results demonstrate the capabilities of QGANs in generating synthetic data, which could be beneficial for \nvarious applications, including data augmentation and creative design. \nFor dimensionality reduction in high-dimensional datasets, such as gene expression data, QPCA algorithms"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q056", "title": "multi-hop", "blocks": [{"title": "Câu hỏi", "text": "How does the implementation of modular arithmetic in the quantum circuit design for Shor’s algorithm differ from the requirement for quantum gate arrays in terms of handling the modulus N?"}, {"title": "Đáp án chuẩn", "text": "In Shor’s algorithm, the modulus N and related parameters are embedded directly into the gate patterns as constants, leading to distinct circuits for each pair (N, a). In contrast, for quantum gate arrays, the modulus N and related parameters must be treated as data, requiring the use of n-qubit modulus registers and specific types of adders and multipliers to ensure the entries in the unitary matrices are computable numbers."}, {"title": "Bài A", "text": "Practical Challenges in Executing Shor’s Algorithm"}, {"title": "Đoạn của bài A", "text": "5\nLimitations and Challenges\nLimitations with Circuit Design for Each N\nOur implementation is semi-generic: a single generator produces the QPE scaffold and reversible\narithmetic for any target bit-width n and base a, but the modulus N and derived constants (e.g.,\n¯N = 2n −N and ki = c 2i mod N) are embedded directly into the gate patterns. As a result, each\npair (N, a) yields a distinct circuit that must be transpiled.\nTo achieve genericity at fixed width, the arithmetic would need to treat N and related parameters as data rather than as compile-time structure. This would entail allocating an n-qubit\nmodulus register NREG (and addend/multiplier registers as needed), replace constant-injection\nadders with register–register Cuccaro adders plus a reversible subtract-and-borrow comparator\nagainst NREG, and implement modular multiplication as a variable shift-and-add with reductions"}, {"title": "Bài B", "text": "Polynomial-Time Algorithms for Prime Factorization and Discrete Logarithms on a Quantum Computer"}, {"title": "Đoạn của bài B", "text": "gates. To make quantum gate arrays uniform, we must add two things to the deﬁnition\nof gate arrays. The ﬁrst is the standard requirement that the design of the gate array\nbe produced by a polynomial-time (classical) computation.\nThe second requirement\nshould be a standard part of the deﬁnition of analog complexity classes, although since\nanalog complexity classes have not been widely studied, this requirement is much less\nwidely known. This requirement is that the entries in the unitary matrices describing\nthe gates must be computable numbers. Speciﬁcally, the ﬁrst log n bits of each entry\nshould be classically computable in time polynomial in n [Solovay 1995]. This keeps\nnon-computable (or hard to compute) information from being hidden in the bits of the\namplitudes of the quantum gates.\n3\nReversible logic and modular exponentiation\nThe deﬁnition of quantum gate arrays gives rise to completely reversible computation."}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q057", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What framework was introduced to enhance channel prediction accuracy in MIMO-OFDM systems and how does it combine quantum and classical elements?"}, {"title": "Đáp án chuẩn", "text": "A hybrid quantum deep convolutional generative adversarial network (HQDCGAN) framework, referred to as HQDCGAN-MIMO-OFDM, was introduced for enhancing channel prediction accuracy and addressing performance bottlenecks such"}, {"title": "Bài", "text": "A Survey of Quantum Generative Adversarial Networks"}, {"title": "Đoạn gốc (trang 19)", "text": "layers manage the encoding and decoding processes to interface with the quantum\ndomain. The model effectively mitigates quantum collapse effects and supports processing of 128 × 128 HSIs. Experimental results show that HyperKING outperforms\nclassical methods in hyperspectral tensor completion, mixed noise removal (achieving\n≈3 dB PSNR gain), and blind source separation, marking a significant advancement\nin quantum-enhanced image restoration for real-world SRS applications.\nAccurate channel prediction is essential for optimal performance in large-scale\nmultiple-input multiple-output orthogonal frequency division multiplexing (MIMOOFDM) systems. A hybrid quantum deep convolutional generative adversarial network\n(HQDCGAN) framework, referred to as HQDCGAN-MIMO-OFDM, was introduced for\nenhancing channel prediction accuracy and addressing performance bottlenecks such\n19"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q058", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the formula for the variance of the gradient Var[∂kE] when U− is a 2-design but not U+?"}, {"title": "Đáp án chuẩn", "text": "Var[∂kE] = 2Tr(ρ2) N 2 Tr⟨H2 uV 2 -(HuV )2⟩U+ = -Tr(ρ2) 22n Tr⟨[V, Hu]2⟩U+"}, {"title": "Bài", "text": "Barren plateaus in quantum neural network training landscapes"}, {"title": "Đoạn gốc (trang 7)", "text": "of the number of layers to a ﬁxed value determined by the\nnumber of qubits.\nAn advantage of the explicit polynomial formulas are\nthat they allow an analytic calculation of the variance as\nwell, which allows precise speciﬁcation of the coeﬃcient\nin Levy’s lemma. In cases where the integrals depend on\nup to two powers of elements of U and U ∗, one may make\nuse of the elementwise formula [51]\nZ\ndµ(U)Ui1j1Ui2j2U ∗\ni′\n1j′\n1U ∗\ni′\n2j′\n2 =\nδi1i′\n1δi2i′\n2δj1j′\n1δj2j′\n2 + δi1i′\n2δi2i′\n1δj1j′\n2δj2j′\n1\nN 2 −1\n−\nδi1i′\n1δi2i′\n2δj1j′\n2δj2j′\n1 + δi1i′\n2δi2i′\n1δj1j′\n1δj2j′\n2\nN(N 2 −1)\n(14)\nThe variance of the gradient is deﬁned by\nVar[∂kE] = ⟨(∂kE)2⟩\n(15)\nas we have seen above that ⟨∂kE⟩= 0.\nThrough use\nof the above formula for integration up to the second\nmoment of the Haar distribution, one may evaluate this\nexpression in 3 separate cases. In the case where U−is a\n2-design but not U+,\nVar[∂kE] = 2Tr(ρ2)\nN 2\nTr⟨H2\nuV 2 −(HuV )2⟩U+\n= −Tr(ρ2)\n22n\nTr⟨[V, Hu]2⟩U+\n(16)"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q059", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the status of hybrid schemes combining pre and post quantum cryptography in terms of standardization?"}, {"title": "Đáp án chuẩn", "text": "'Hybrid schemes combining both pre and post quantum cryptography for efficient implementation and backward compatibility is yet to be standardised.'"}, {"title": "Bài", "text": "A_Comprehensive_Survey_on_Pre_Versus_Post_Quantum_Security_Schemes_for_5G-Enabled_IoT_Applications"}, {"title": "Đoạn gốc (trang 3)", "text": "B. Choudhury et al.: Comprehensive Survey on Pre Versus Post Quantum Security Schemes\nTABLE 1. List of abbreviations.\n• Hybrid Schemes: Hybrid schemes combining both pre\nand post quantum cryptography for efficient implementation and backward compatibility is yet to be\nstandardised.\n• Risk Assessment Frameworks and Mitigation Measures: Thorough risk analysis and proactive steps to\nguarantee the resilience and reliability of 5G IoT\nsecurity structures should be the default requirement of\nany solution.\n• AI Integration: Although AI is being integrated in a\nbig way, but several challenges still remain such as\nthe availability of 5G Specific dataset, model security,\ntransparency through XAI and use of pretrained model.\n• Real Time Requirements: Many applications and core\noperations of 5G IoT have real time constraints. Design\nof PQC algorithms with complex computations running\non resource constrained IoT devices for real time\napplications is hard to achieve."}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q060", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What cryptographic methods are quantum-resistant?"}, {"title": "Đáp án chuẩn", "text": "Post-Quantum Cryptography (PQC) methods, including lattice-based, multivariate-based, and code-based cryptosystems, are designed to be"}, {"title": "Bài", "text": "Next-Generation Quantum Security - The Impact of Quantum Computing on Cybersecurity—Threats, Mitigations, and Solutions"}, {"title": "Đoạn gốc (trang 4)", "text": "S. Ali et al.\nTable 2\nQuestions and solutions addressed in the review paper.\n Research questions\nProposed solutions\n \n How will quantum computing impact \nexisting cryptographic systems?\nQuantum computers, using Shor’s algorithm, can efficiently solve integer \nfactorization and discrete logarithm problems, undermining the security of \nRSA and ECC.\n \n What are the potential threats to symmetric \nencryption?\nGrover’s algorithm poses a threat by offering a quadratic speedup for \nbrute-force attacks, reducing the effective security of symmetric encryption \nlike AES.\n \n How can we secure communication against \nquantum attacks?\nQuantum Key Distribution (QKD), using protocols like BB84, provides \nsecure key exchange leveraging quantum mechanics, ensuring that \ncommunication is immune to eavesdropping.\n \n What cryptographic methods are \nquantum-resistant?\nPost-Quantum Cryptography (PQC) methods, including lattice-based, \nmultivariate-based, and code-based cryptosystems, are designed to be"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q061", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the urgent need highlighted by Marengo et al. [14] regarding cryptography in infrastructures?"}, {"title": "Đáp án chuẩn", "text": "migration toward post-quantum cryptography is urgent for infrastructures that rely on classical encryption."}, {"title": "Bài", "text": "Quantum Machine Learning for Cybersecurity"}, {"title": "Đoạn gốc (trang 12)", "text": "provide hard-to-counter mechanisms. Marengoet al. [14]\nshow that migration toward post-quantum cryptography is\nurgent for infrastructures that rely on classical encryption. If\ncryptography is not simultaneously migrated from classical\nto quantum architectures, it can expose sensitive data to\nfuture quantum-based attacks. Thus, QML adoption must be\naccompanied with broader resilience strategies.\nF. High cost & access barriers\nTo implement QML pipelines at operational scale, teams\nmust manage high costs, limited quantum hardware availability,\nand complex toolchains. Studies like [16] and [25] show\nthat such demands benefit only well-funded organizations,\nleaving smaller ones and low-resource regions at a disadvantage,\nrestricting broader participation and creating a divide in\ncybersecurity.\nG. Lack of regulatory frameworks\nCurrent cybersecurity regulations are insufficient to support\nresponsible QML deployment, and limit its safe adoption. As"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q062", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the mathematical representation of the ansatz in the context of variational optimization, and how does it transform the default state?"}, {"title": "Đáp án chuẩn", "text": "An ansatz is mathematically represented as 𝑈𝐴(𝜃)|0⟩. This ansatz combines a reference state with a variational form to transform the default state |0⟩ into the target state |𝜓(𝜃)⟩."}, {"title": "Bài", "text": "A Survey of Quantum Machine Learning - Foundations,Algorithms, Frameworks, Data and Applications"}, {"title": "Đoạn gốc (trang 13)", "text": "reference state. This transformation is achieved by applying a reference operator 𝑈𝑅to the default\nstate, such that 𝑈𝑅|0⟩= |𝜌⟩.\nThe second step of the process involves preparing the ansatz, which is an essential initial\nconfiguration for variational optimization. An ansatz is a parameterized quantum circuit designed to\nexplore a subset of quantum states that may approximate the solution. This ansatz is mathematically\nrepresented as 𝑈𝐴(𝜃)|0⟩. This step begins by defining a variational form 𝑈𝑉(𝜃), representing a\ncollection of parameterized states that the variational algorithm will explore. The ansatz combines\na reference state with this variational form to create a parameterized quantum circuit. Specifically,\nthe ansatz transforms the default state |0⟩into the target state |𝜓(𝜃)⟩by applying a variational form\nACM Comput. Surv., Vol. 58, No. 4, Article 91. Publication date: October 2025."}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q063", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What method does the paper propose to extend the distance of secure QKD, and how does it differ from Koashi's method?"}, {"title": "Đáp án chuẩn", "text": "By using decoy states, we are considering a theoretical extension of BB84, rather than standard BB84. It will be interesting to apply the work of M. Curty, M. Lewenstein, and N. L¨utkenhaus. However, our method and results diﬀer substantially from those of Koashi."}, {"title": "Bài", "text": "Decoy State Quantum Key Distribution"}, {"title": "Đoạn gốc (trang 4)", "text": "Alice and Bob use the same basis.\n[8] H. Inamori, N. L¨utkenhaus, & D. Mayers, available at\nhttp://arxiv.org/abs/quant-ph/0107017\n[9] N. Gisin, G. Ribordy, W. Tittel, & H. Zbinden, Rev.\nMod. Phys. 74, 145 (2002).\n[10] Prior art methods to extend the unconditionally secure\ndistance of QKD usually require either single-photon\nsources, low-loss ﬁbers or new types of single-photon detectors. Unfortunately, those prior art solutions require\ndaunting experimental developments.\n[11] Incidentally,\nKoashi\n[M.\nKoashi,\navailable\nat\nhttp://arxiv.org/abs/quant-ph/0403131 ] has recently\nproposed an alternative method to extend the distance\nof secure QKD. However, our method and results diﬀer\nsubstantially from those of Koashi.\n[12] W.-Y. Hwang, Phys. Rev. Lett. 91, 057901 (2003).\n[13] By using decoy states, we are considering a theoretical\nextension of BB84, rather than standard BB84. It will be\ninteresting to apply the work of M. Curty, M. Lewenstein,"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q064", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What are the main challenges of using quantum dots as qubits?"}, {"title": "Đáp án chuẩn", "text": "Their main challenges include short coherence times, tight fabrication tolerances, and complex control requirements. The availability of ultra-pure silicon-28 as raw material can provide further limitations."}, {"title": "Bài", "text": "Practical Challenges in Executing Shor’s Algorithm"}, {"title": "Đoạn gốc (trang 2)", "text": "performance characteristics.\n2.A\nQuantum Computers with Synthetic Qubits\nSuperconducting qubits, widely used by companies such as IBM, Google, and Rigetti, encode information in oscillating electrical currents in superconducting circuits cooled to millikelvin temperatures. They offer fast gate operations and benefit from mature microwave control and fabrication\necosystems. However, they suffer from relatively short coherence times, variability across the chip,\nand significant sensitivity to noise, all of which increase the burden on error mitigation and QEC.\nQuantum dots, which confine electrons in semiconductor nanostructures, are attractive due\nto their compatiblity with existing semiconductor technology and their potential for high-density\nintegration. Their main challenges include short coherence times, tight fabrication tolerances, and\ncomplex control requirements. The availability of ultra-pure silicon-28 as raw material can provide\nfurther limitations."}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q065", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the pseudocode for the first stage of building the reversible gate array for computing bc (mod n)?"}, {"title": "Đáp án chuẩn", "text": "result := 0\nfor i = 0 to l −1\nif ( bi == 1 ) then\nresult := result + 2ic (mod n)\nendif\nendfor"}, {"title": "Bài", "text": "Polynomial-Time Algorithms for Prime Factorization and Discrete Logarithms on a Quantum Computer"}, {"title": "Đoạn gốc (trang 11)", "text": "need to use a fairly complicated gate array as a subroutine. Recall that x2i (mod n)\ncan be computed classically and then built into the structure of the gate array. Thus,\nto implement this line, we need a reversible gate array that takes b as input and gives\nbc (mod n) as output, where the structure of the gate array can depend on c and n.\nOf course, this step can only be reversible if gcd(c, n) = 1, i.e., if c and n have no\ncommon factors, as otherwise two distinct values of b will be mapped to the same value\nof bc (mod n); this case is fortunately all we need for the factoring algorithm. We will\nshow how to build this gate array in two stages. The ﬁrst stage is directly analogous\nto exponentiation by repeated multiplication; we obtain multiplication from repeated\naddition (mod n). Pseudocode for this stage is as follows.\nresult := 0\nfor i = 0 to l −1\nif ( bi == 1 ) then\nresult := result + 2ic\n(mod n)\nendif\nendfor"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q066", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What error-correction scheme distance is mentioned as necessary for QuANet to achieve break-even logical-qubit coherence?"}, {"title": "Đáp án chuẩn", "text": "surface-code distance d ≥3"}, {"title": "Bài", "text": "QUANTUM KEY DISTRIBUTION - Bridging Theoretical Security Proofs, Practical Attacks, and Error Correction"}, {"title": "Đoạn gốc (trang 31)", "text": "a QuANet, where the quantum channel may share a single fiber with classical data (via wavelength-division\nmultiplexing), crosstalk and channel uncertainty can increase error rates beyond those seen in dedicated\nQKD links. Hence, choosing an error-correction scheme with a sufficiently large distance (e.g., surface-code\ndistance d ≥3) and integrating fault-tolerant syndrome extraction will be mandatory to reach “break-even”\nlogical-qubit coherence. Moreover, recent demonstrations of dissipation and machine-learning-aided parameter\ntuning can ensure that QuANet nodes adaptively optimize their error-correcting circuitry to several ambient\nnoise.\n4. From a network-architecture perspective, the review’s survey of security proofs under arbitrarily varying\nchannels and the characterization of symmetrizability (i.e., whether a jammer can force I(X; B | s) =\nI(X; B | s′) for two different states s, s′) directly inform QuANet routing and coding policies. For instance,"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q067", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What happens if Alice attempts to cheat in step 1 by sending a mixture of rectilinear and diagonal photons, or photons which are polarized neither rectilinearly or diagonally?"}, {"title": "Đáp án chuẩn", "text": "In this case she will not be able to agree with either of Bob's tables in step 3, since both tables will record the results of probabilistic behavior not under her control."}, {"title": "Bài", "text": "Quantum Cryptography - Public Key Distribution and Coin Tossing"}, {"title": "Đoạn gốc (trang 6)", "text": "It is easy to see that things are even worse \nfor Alice if she attempts to cheat in step 1, by \nsending a mixture of rectilinear and diagonal pho­\ntons, or photons which are polarized neither rectil­\ninearly or diagonally. \nIn this case she will not be \nable to agree with either of Bob's tables in step 3, \nsince both tables will record the results of proba­\nbilistic behavior not under her control. \nIn order to say how Alice cNn cheat using \nquantum mechanics it is necessary to describe the \nEinstein-Podolsky-Rosen (EPR) effect [Bo,AGR), often \ncalled a paradox because it contradicts the common­\nsense notion that for two individually random events \nhappening at distance from one another to be corre­\nlated, some physical influence must have propagated \nfrom the earlier event to the later, or else from \nsome c0111111on random cause to both events. \nThe EPR effect occurs when certain .types of \natom or molecule decay with the emission of two pho­"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q068", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What are the probabilities of a photon polarized at angle a becoming horizontal and vertical when subjected to a measurement of vertical-vs.-horizontal polarization?"}, {"title": "Đáp án chuẩn", "text": "such a photon in effect chooses to become horizontal with probability cos2a and vertical with probability sin2a."}, {"title": "Bài", "text": "Quantum Cryptography - Public Key Distribution and Coin Tossing"}, {"title": "Đoạn gốc (trang 3)", "text": "The Hilbert space for a single polarized pho­\nton is 2-dimensional; thus the state of a photon may \nbe completely described as a linear combination of, \nfor example, the two unit vectors r1 • (1,0) and \nr2 = (0,1), representing respectively horizontal and \nvertical polarization. \nIn particular, a photon po­\nlarized at angle \na to the horizontal is described \nby the state vector \n(cosa, sina). \nWhen subjected \nto a n,easureƊent of vertical-vs.-horizontal polari­\nzation, such a photon in effect chooses to become \nhorizontal with probability cos2a and vertical with \nprobability sin2a. \nThe two orthogonal vectors r1 \nand r \nthus a e;;:emplify the resolution of a 2dimenƋional Hilbert space into'2 orthogonal 1dimensional subspaces; henceforth r1 aƌ r2 will be \nsaid to comprise the 'rectilinear' basis for the \nHilbert space. \nAn alteƍnative basis for the same Hilbf>rt \nspace is provided by the two 'diagonal' basis vec­\ntors d1 • (0. 707 ,0.'707), \nrepresenting a 45-degree"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q069", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the key generation rate for practical protocols in terms of Qµ, Q1, f(Eµ), and H2(e1)?"}, {"title": "Đáp án chuẩn", "text": "S ≥q{−Qµf(Eµ)H2(Eµ) + Q1[1 −H2(e1)]}, where q depends on the implementation (1/2 for the BB84 protocol, and q ≈1 for the efficient BB84 protocol [23])."}, {"title": "Bài", "text": "Decoy State Quantum Key Distribution"}, {"title": "Đoạn gốc (trang 3)", "text": "gain of the signal state, Qµ = P∞\nk=0 Yke−µ \u0000µk/k!\n\u0001\n, [This\ncomes directly from Eq. (2).] and the fraction of Bob’s\ndetection events that have originated from single-photon\nsignals emitted by Alice is given by:\nΩ= Q1\nQµ\n,\n(9)\nwhere\nQ1 = Y1 · µe−µ\n(10)\nis the gain for the single photon state.\nThe derivation of Eq. (1) assumes that error correction\nprotocols can achieve the fundamental (Shannon) limit.\nHowever, practical error correction protocols are generally ineﬃcient. As noted in [22], a simple way to take\nthis ineﬃciency into account is to introduce a function,\nf(e) > 1, of the QBER, e. By doing so, we ﬁnd that the\nkey generation rate for practical protocols is given by:\nS ≥q{−Qµf(Eµ)H2(Eµ) + Q1[1 −H2(e1)]},\n(11)\nwhere q depends on the implementation (1/2 for the\nBB84 protocol, because half the time Alice and Bob bases\nare not compatible, and if we use the eﬃcient BB84 protocol [23], we can have q ≈1. For simplicity, we will take"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q070", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What implementation of Kyber was suggested as a good fit for MbedTLS due to its simplicity and memory safety verification?"}, {"title": "Đáp án chuẩn", "text": "\"mlkem-native\" (a C90 implementation of Kyber by the PQC Alliance)"}, {"title": "Bài", "text": "A Survey of Post-Quantum Cryptography Support in Cryptographic Libraries"}, {"title": "Đoạn gốc (trang 6)", "text": "a future quantum adversary. However, LMS is not suitable for\nhigh-frequency use (stateful, one-time use per signature), and\nnot used in TLS, so it does not solve the handshake problem or\ngeneral public-key encryption. Thus, MbedTLS still needs to\nimplement the NIST finalists to be broadly quantum-safe. They\nhave not given a specific version or date for when Kyber will\nland, but the email conversation suggests perhaps 2025 releases\nmight start including [39]. The project might incorporate external code or new code for Kyber. Interestingly, a reply to an\nemail in January 2025 pointed out an implementation called\n“mlkem-native” (a C90 implementation of Kyber by the PQC\nAlliance) as a good fit for MbedTLS due to its simplicity and\nmemory safety verification [39]. This suggests that there are\nalready sources of Kyber code that MbedTLS could adopt with\nconfidence. That might accelerate their development."}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q071", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What method did Dubrova et al. use to increase the bits' leakiness in the attack on Kyber’s first-order masking?"}, {"title": "Đáp án chuẩn", "text": "employing a new kind of deep learning and rotations on the intercepted message to raise the bits’ leakiness and, thus, the likelihood of a successful attack"}, {"title": "Bài", "text": "Investigating CRYSTALS-Kyber Vulnerabilities - Attack Analysis and Mitigation"}, {"title": "Đoạn gốc (trang 8)", "text": "employing a new kind of deep learning and rotations on the intercepted message to raise\nthe bits’ leakiness and, thus, the likelihood of a successful attack, Dubrova et al. were able\nto overcome this challenge [50]. The attack was initially presented by Dubrova et al. on a\nC version of Kyber’s first-order masking, whereby masked_poly_frommsg() is extended\nto include higher-order masking. The power consumption of this method, which is called\nKyber’s re-encryption phase, will be the subject of discussion.\nThey go after the stage of decapsulation. Following the extraction of the shared key,\nit is re-encapsulated in the decapsulation process and checked for tampering against the\noriginal ciphertext. The secret, or the predecessor of the shared key, is bit-by-bit stored\ninto a polynomial for this re-encryption process. More specifically, the 256-bit secret must\nbe transformed into a polynomial modulo q = 3329 with 256 coefficients, where the i-th"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q072", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "Which cryptographic algorithms are evaluated in the study for their security against quantum attacks?"}, {"title": "Đáp án chuẩn", "text": "Kyber, Dilithium, and Falcon."}, {"title": "Bài", "text": "A Comparative Study of Classical and Post-Quantum Cryptographic Algorithms in the Era of Quantum Computing"}, {"title": "Đoạn gốc (trang 1)", "text": "the mathematical foundations of quantum attacks, and evaluate the security, performance, and implementation feasibility of quantum-resistant\nalternatives such as Kyber, Dilithium, and Falcon. [25]. Additionally, we\nassess the hybrid approaches currently being explored by institutions and\ntech companies to enable a smooth transition to post-quantum cryptography. [23]. By providing an in-depth comparison, this study aims to guide\nresearchers, developers, and policymakers in understanding the critical\nimplications of quantum computing on cryptographic infrastructures and\nthe necessary steps for securing communications in the quantum era. [16].\n1\nIntroduction"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q073", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What are some potential benefits for banks that implement PQC ahead of regulatory mandates?"}, {"title": "Đáp án chuẩn", "text": "banks that implement PQC ahead of regulatory mandates could advertise enhanced security for client data, potentially gaining a competitive edge (especially in sectors like finance or healthcare where customers are sensitive about long-term confidentiality, or government contracting where quantum-safe capabilities might become a procurement criterion)."}, {"title": "Bài", "text": "Are Enterprises Ready for Quantum-Safe Cybersecurity"}, {"title": "Đoạn gốc (trang 17)", "text": "for being forward-thinking. For instance, banks that implement PQC ahead of regulatory\nmandates could advertise enhanced security for client data, potentially gaining a competitive edge (especially in sectors like finance or healthcare where customers are sensitive\nabout long-term confidentiality, or government contracting where quantum-safe capabilities might become a procurement criterion). There’s also an opportunity for funding\nand support: government initiatives (like grants for quantum readiness, or tax incentives\nfor upgrading critical infrastructure security) may become available. Already, national\ninitiatives such as the U.S. National Quantum Initiative and EU’s Quantum Flagship,\nwhile primarily research-focused, create ecosystems that companies can join, sometimes\nbenefiting from shared pilot projects or testbeds [5]. Inter-industry collaboration is an\nopportunity – enterprises can join consortiums or working groups to share knowledge"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q074", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the approach to training an approximate restricted Boltzmann machine (RBM) representation of the desired quantum state using partial tomography?"}, {"title": "Đáp án chuẩn", "text": "A different approach using partial tomography is to train an approximate restricted Boltzmann machine (RBM) representation of the desired quantum state [227]. This RBM is fitted using measurements of the Pauli operators that are needed to directly estimate a given operator’s expectation value, and so does not inherently reduce the number of operators to measure."}, {"title": "Bài", "text": "Variational quantum algorithms"}, {"title": "Đoạn gốc (trang 18)", "text": "chosen strings so that a partial tomography of the state\nis completed. Combining the measurements in this way,\neach shot contributes to the estimation of each Pauli operator expectation value, resulting in a number of measurements that scales logarithmically with n. As with\ndirect measurement approaches discussed above, this approach can also be further optimized by tuning the probability distribution for the Pauli operators that deﬁne the\nmeasurements to match the properties of the operator\nand state [226].\n4.\nNeural network tomography\nA diﬀerent approach using partial tomography is\nto train an approximate restricted Boltzmann machine\n(RBM) representation of the desired quantum state [227].\nThis RBM is ﬁtted using measurements of the Pauli operators that are needed to directly estimate a given operator’s expectation value, and so does not inherently reduce\nthe number of operators to measure. However, by computing the expectation value on an approximate RBM"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q075", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the size of the matrix used to represent each image in the baseline MNIST dataset, and how is it flattened into a vector?"}, {"title": "Đáp án chuẩn", "text": "Each image in the baseline MNIST dataset is characterized by a 28 × 28 matrix of grayscale intensities. Flattening the 28 × 28 image yields a vector x ∈ R784."}, {"title": "Bài", "text": "Beyond Barren Plateaus - A Scalable Quantum Convolutional Architecture for High-Fidelity Image Classification"}, {"title": "Đoạn gốc (trang 8)", "text": "Furthermore, to actualize the Tensor Network\nInitialization (TNI) protocol outlined in Algorithm 1, we rely on the TensorNetwork library\n[10]. This section delineates the exact data preprocessing mapping, the programmatic instantiation of the quantum layers, the hyperparameter\noptimization boundaries, and the execution of the\nTNI warm-start procedure that definitively prevents the model from stalling in a barren plateau.\n3.1\nData Preprocessing and Qubit Allocation\nThe baseline MNIST dataset consists of 60, 000\ntraining and 10, 000 testing images, each characterized by a 28 × 28 matrix of grayscale intensities. Directly embedding this classical data into\na quantum state without spatial downsampling\nis critical to preserving the intricate morphological features of the digits. Flattening the 28 × 28\nimage yields a vector x ∈R784.\nTo utilize amplitude encoding efficiently, the\nvector dimension must be padded to the nearest\npower of two.\nWe pad x with zeros to extend"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q076", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What did Ayaz et al. propose to ensure security and privacy in a blockchain-aided vehicular network?"}, {"title": "Đáp án chuẩn", "text": "Ayaz et al. proposed an integrated approach of blockchain and PLS to ensure security and privacy."}, {"title": "Bài", "text": "Post-Quantum_Blockchain_Security_for_the_Internet_of_Things_Survey_and_Research_Directions"}, {"title": "Đoạn gốc (trang 20)", "text": "and massive MIMO. Researchers have worked on blockchain\nintegration in this area. Ayaz et al. [179] investigated the\nPLS impact on a blockchain-aided vehicular network with two\ntypes of attacks related to the physical layer, and proposed an\nintegrated approach of blockchain and PLS to ensure security\nand privacy.\nFurthermore, a lack of attention to the presence of eavesdroppers and a focus on resource or channel allocation during\nthe integration of Device-2-Device (D2D) and Fog Computing\n(FC) motivated Gupta et al. [180] to propose a blockchainbased cooperative D2D-assisted FC scheme that improves\nperformance in terms of delay, security, and privacy, while\neliminating the risk of eavesdroppers. To the best of our\nknowledge, no study has been conducted on applying postquantum blockchains to other IoT layers. However, owing\nto the longer computation times in PQB, it poses challenges\nfor low-power devices in future low-latency and real-time"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q077", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the cycle time for the QEC cycle mentioned in the study?"}, {"title": "Đáp án chuẩn", "text": "Achieve a fast QEC cycle time of 1.1µs."}, {"title": "Bài", "text": "QUANTUM KEY DISTRIBUTION - Bridging Theoretical Security Proofs, Practical Attacks, and Error Correction"}, {"title": "Đoạn gốc (trang 28)", "text": "• Achieve a fast QEC cycle time of 1.1µs.\n• Detect and mitigate errors, including leakage errors, using high-fidelity readout and minimum-weight\nperfect matching for syndrome decoding.\nThe study demonstrates logical state preservation through repeated QEC cycles and analyzes the logical fidelity\nand error rates. The study setup can be described as follows,\n• Logical State Encoding: The logical qubit is encoded using nine physical data qubits. The logical basis\nstates are defined as:\n|0L⟩=\n1\n√\n2\n\u0010\n|000⟩+ |111⟩\n\u0011\n,\n|1L⟩=\n1\n√\n2\n\u0010\n|000⟩−|111⟩\n\u0011\n.\n(106)\nThese states span the logical subspace protected by the surface code.\n• Stabilizer Formalism: The stabilizer generators for the surface code are defined to constrain the logical\nstate and detect errors. For a distance-three surface code, the stabilizers include:\nS(1)\nX = X1X2,\nS(2)\nX = X2X3,\nS(3)\nX = X3X4,\n(107)\nS(1)\nZ\n= Z1Z2,\nS(2)\nZ\n= Z2Z3,\nS(3)\nZ\n= Z3Z4.\n(108)"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q078", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is a potential downside of terminating encryption at the edge to reduce cryptographic latency?"}, {"title": "Đáp án chuẩn", "text": "This may compromise end-to-end quantum resistance unless the edge is treated as part of the trust boundary."}, {"title": "Bài", "text": "A_Comprehensive_Survey_on_Pre_Versus_Post_Quantum_Security_Schemes_for_5G-Enabled_IoT_Applications"}, {"title": "Đoạn gốc (trang 22)", "text": "schemes produce public keys, signatures, or ciphertexts in\nthe kilobyte range, which in some cases exceed the path\nmaximum transmission unit, leading to fragmentation [188].\nOn wireless links, fragmentation increases retransmission\nprobability, which negatively impacts reliability and latency.\nArchitectural features such as network slicing and multiaccess edge computing influence deployment choices: terminating encryption at the edge can reduce cryptographic\nlatency, but this may compromise end-to-end quantum\nresistance unless the edge is treated as part of the trust\nboundary.\nA deployment offering complete post-quantum protection\nat all layers maximises security against a future quantum\nadversary but introduces measurable costs in terms of bandwidth, latency, and energy. Hybrid key exchange, for example\ncombining a classical elliptic curve Diffie–Hellman with a\nPQC key encapsulation mechanism, provides security against\nboth classical and quantum threats but increases handshake"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q079", "title": "multi-hop", "blocks": [{"title": "Câu hỏi", "text": "How does the exponential speedup provided by the quantum recommendation system relate to the issue of barren plateaus in NISQ algorithms? Specifically, explain why the quantum recommendation system might be more resilient to the problem of barren plateaus compared to other hybrid quantum-classical algorithms in the NISQ regime."}, {"title": "Đáp án chuẩn", "text": "The quantum recommendation system provides an exponential speedup over classical algorithms for a useful task, which could potentially make it more resilient to the issue of barren plateaus. In contrast, many hybrid quantum-classical algorithms in the NISQ regime rely on optimization of a parameterized quantum circuit, which can suffer from the problem of barren plateaus where the gradient vanishes exponentially fast as the number of qubits increases. The quantum recommendation system, however, operates on a simplified version of the problem with a low-rank preference matrix, which might help mitigate the issue of barren plateaus."}, {"title": "Bài A", "text": "Quantum Computing in the NISQ era and beyond"}, {"title": "Đoạn của bài A", "text": "by a quantum computer which doesn’t use error correction.\n6.7\nQuantum recommendation systems\nAnother recently proposed quantum algorithm [44] provides an exponential speedup over\nthe best currently known classical algorithm for a useful task: making high-value recommendations. The goal is to recommend a product to a customer that the customer will\nprobably like, based on limited knowledge of the preferences of that customer and other\ncustomers.\nTo formulate a simpliﬁed version of the problem, consider m customers and n products,\nand let P be a binary m×n preference matrix such that Pai = 1 if customer a likes product\ni and Pai = 0 if customer a dislikes product i. In practice we might have m ≈108 users and\nn ≈106 products, but the rank k of the matrix is relatively small, perhaps k ≈100. This\nsmall rank indicates that there are only a limited number of customer types; therefore,\nonce we know a few of the preferences of a new customer, we can accurately recommend"}, {"title": "Bài B", "text": "Barren plateaus in quantum neural network training landscapes"}, {"title": "Đoạn của bài B", "text": "algorithms run on more than a few qubits. Speciﬁcally, we show that for a wide class of reasonable\nparameterized quantum circuits, the probability that the gradient along any reasonable direction is\nnon-zero to some ﬁxed precision is exponentially small as a function of the number of qubits. We\nargue that this is related to the 2-design characteristic of random circuits, and that solutions to this\nproblem must be studied.\nRapid developments in quantum hardware have motivated advances in algorithms to run in the so-called noisy\nintermediate scale quantum (NISQ) regime [1]. Many of\nthe most promising application-oriented approaches are\nhybrid quantum-classical algorithms that rely on optimization of a parameterized quantum circuit [2–8]. The\nresilience of these approaches to certain types of errors\nand high ﬂexibility with respect to coherence time and\ngate requirements make them especially attractive for\nNISQ implementations [3, 9–11]."}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q080", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "Does Qiskit's implementation of Shor’s algorithm scale to realistically large integers or serve as a drop-in attack tool on current NISQ devices?"}, {"title": "Đáp án chuẩn", "text": "Qiskit includes a built-in pedagogical implementation of Shor’s algorithm, but it is not designed to scale to realistically large integers or to serve as a drop-in attack tool on current NISQ devices."}, {"title": "Bài", "text": "Practical Challenges in Executing Shor’s Algorithm"}, {"title": "Đoạn gốc (trang 11)", "text": "which lies beyond the scope of this work. Moreover, while Qiskit includes a built-in pedagogical\nimplementation of Shor’s algorithm, it is not designed to scale to realistically large integers or to\nserve as a drop-in attack tool on current NISQ devices.\nTaken together, these observations suggest that there is currently no practical, platform-agnostic\n“Shor package” capable of factoring even moderately larger integers beyond standard textbook\nexamples such as 15 or 21. The combination of algorithmic complexity, qubit noise, limited connectivity, and immature transpilation tooling remains a major hurdle.\n5https://aws.amazon.com/braket/\n6https://quantum.microsoft.com/\n11"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q081", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What mechanism in classical TLS ensures forward secrecy?"}, {"title": "Đáp án chuẩn", "text": "ECDH (ephemeral) uses temporary keys that are discarded after each session."}, {"title": "Bài", "text": "harvest-now-decrypt-later-pqc-threat-model"}, {"title": "Đoạn gốc (trang 39)", "text": "• 2025-2028: Hybrid dominant (both classical and PQC in use)\n• 2028-2032: Transition period (mixed environments)\n• 2032-2035: PQC transition (gradual classical phase-out)\n• Post-2035: PQC dominant (classical deprecated)\nRisk During Transition:\n• Downgrade Attacks: If not carefully implemented, an attacker might force fallback to\nclassical-only cryptography. Mitigation: Cryptographic bindings and protocol design\nprevent downgrade attacks.\n• Incomplete Deployments: Organizations that don’t migrate to hybrid will eventually\nbecome isolated. Regulatory and vendor pressure creates incentives for migration.\n11.4 Forward Secrecy in the Post-Quantum Era\nForward secrecy refers to the property that compromise of long-term keys does not compromise\nsession keys from past sessions. Forward secrecy is critical for long-term confidentiality:\nForward Secrecy in Classical TLS:\n• ECDH (ephemeral) uses temporary keys that are discarded after each session"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q082", "title": "multi-hop", "blocks": [{"title": "Câu hỏi", "text": "How does the TLS 1.3 hybrid handshake ensure quantum-resistant security while maintaining backward compatibility, and what are the key components of a hybrid cryptographic system according to S. Ali et al.?"}, {"title": "Đáp án chuẩn", "text": "The TLS 1.3 hybrid handshake merges traditional ECDHE with Kyber key exchanges to secure session keys that are quantum-resistant while preserving backward compatibility (Thales Group, 2024). According to S. Ali et al., a hybrid cryptographic system combines classical cryptography, such as RSA or ECC, with quantum-resistant methods like multivariate and lattice-based schemes, including Kyber or NTRU, to establish multiple protection layers against both current and future quantum security threats."}, {"title": "Bài A", "text": "The-Quantum-Security-Deadline"}, {"title": "Đoạn của bài A", "text": "Systems with higher RPI values should be migrated first to ensure maximal quantum risk \nreduction. \n \nHybrid Cryptography \n \n1. Classical and Quantum-Safe Coexistence \nHybrid cryptography enables the coexistence of classical algorithms (like RSA or ECC) with \nquantum-resistant algorithms (like CRYSTALS-Kyber or SABER) during the migration phase \n(Entrust, 2025). By combining both key establishment methods, hybrid encryption maintains \ninteroperability with legacy systems while ensuring that future decryption attempts by CRQCs \nremain infeasible. \nThe TLS 1.3 hybrid handshake is a notable example—merging traditional ECDHE with Kyber \nkey exchanges—to secure session keys that are quantum-resistant while preserving backward \ncompatibility (Thales Group, 2024). \n \n2. Transition Mechanisms and Interoperability \nHybrid mechanisms must ensure cryptographic interoperability across endpoints, certificates, and \ntransport layers. The transition strategy typically follows three phases:"}, {"title": "Bài B", "text": "Next-Generation Quantum Security - The Impact of Quantum Computing on Cybersecurity—Threats, Mitigations, and Solutions"}, {"title": "Đoạn của bài B", "text": "S. Ali et al.\n5.7. Hybrid systems and quantum-resistant protocols\nHybrid cryptographic systems serve as a vital approach during the pre-implementation period before all organizations adopt fully \nquantum-resistant cryptographic standards because they protect information [197]. These systems combine classical cryptography \nwith quantum-resistant methods to establish multiple protection layers that integrate fundamental quantum and classical features \nfor improved security. A hybrid system implements classical cryptographic elements, starting with RSA or ECC, alongside quantumresistant algorithms including multivariate and lattice-based schemes that form a combination of protection against existing and \nfuture quantum security threats [188].\nThe hybrid system can implement ECC-based digital signature and encryption methods targeted at the elliptic curve discrete \nlogarithm problem, and combine them with lattice-based Kyber or NTRU schemes based on the Learning With Errors problem."}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q083", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What are the key responsibilities of the key manager in terms of key storage and formatting for Quantum Key Distribution Networks?"}, {"title": "Đáp án chuẩn", "text": "The key manager is required to effectively manage cryptographic keys, which includes key storage and formatting. Key storage should allow for efficient key addition and retrieval, while key formatting should be supported and performed efficiently on demand."}, {"title": "Bài", "text": "Quantum Key D
