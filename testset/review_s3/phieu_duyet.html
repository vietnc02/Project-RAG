grammatically assemble a\npermutation operator on the 2n-dimensional space that maps x →(a·x) mod N for x < N and acts\nas identity otherwise, preserving unitarity. Controlled powers U2k are constructed from (N, a, t),\nand we implement a manual inverse QFT followed by bit-order swaps, ensuring that the measured\nbitstrings are consistently interpreted across Qiskit versions.\nWe implement the parallel (non-iterative) phase-estimation variant of Shor’s order-finding rather\nthan Kitaev’s iterative version [29]. Both are algorithmically equivalent: the dominant cost is the\ncontrolled modular exponentiation Ua, which scales as ˜O(n3) gates for n = ⌈log2 N⌉with standard\nreversible adders and modular reduction, while the inverse QFT contributes O(t2) gates for t phase\nbits. The choice is therefore an engineering trade-off. Parallel QPE uses t control qubits and a single"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q148", "title": "multi-hop", "blocks": [{"title": "Câu hỏi", "text": "How does the efficiency of error correction impact the key generation rate in decoy state quantum key distribution, and what is the role of quantum error correction in maintaining the fidelity of the shared state in quantum key distribution systems?"}, {"title": "Đáp án chuẩn", "text": "In decoy state quantum key distribution, the efficiency of error correction is crucial as it affects the key generation rate, which is given by S ≥q{−Qµf(Eµ)H2(Eµ) + Q1[1 −H2(e1)]}, where f(e) > 1 is a function of the QBER. On the other hand, in maintaining the fidelity of the shared state in quantum key distribution systems, quantum error correction, specifically using CSS codes, plays a vital role in reducing bit and phase errors, ensuring that the fidelity of the corrected state is bounded as F ≥1 −ϵ."}, {"title": "Bài A", "text": "Decoy State Quantum Key Distribution"}, {"title": "Đoạn của bài A", "text": "gain of the signal state, Qµ = P∞\nk=0 Yke−µ \u0000µk/k!\n\u0001\n, [This\ncomes directly from Eq. (2).] and the fraction of Bob’s\ndetection events that have originated from single-photon\nsignals emitted by Alice is given by:\nΩ= Q1\nQµ\n,\n(9)\nwhere\nQ1 = Y1 · µe−µ\n(10)\nis the gain for the single photon state.\nThe derivation of Eq. (1) assumes that error correction\nprotocols can achieve the fundamental (Shannon) limit.\nHowever, practical error correction protocols are generally ineﬃcient. As noted in [22], a simple way to take\nthis ineﬃciency into account is to introduce a function,\nf(e) > 1, of the QBER, e. By doing so, we ﬁnd that the\nkey generation rate for practical protocols is given by:\nS ≥q{−Qµf(Eµ)H2(Eµ) + Q1[1 −H2(e1)]},\n(11)\nwhere q depends on the implementation (1/2 for the\nBB84 protocol, because half the time Alice and Bob bases\nare not compatible, and if we use the eﬃcient BB84 protocol [23], we can have q ≈1. For simplicity, we will take"}, {"title": "Bài B", "text": "QUANTUM KEY DISTRIBUTION - Bridging Theoretical Security Proofs, Practical Attacks, and Error Correction"}, {"title": "Đoạn của bài B", "text": "A PREPRINT - NOVEMBER 26, 2025\nand sends one qubit to Bob through a noisy quantum channel. Due to errors caused by noise or Eve’s\ninterference, the shared state deviates from |Φ+⟩, and Alice and Bob aim to recover the entanglement using\nquantum error correction.\nTo ensure security, Alice and Bob perform error correction and privacy amplification. Error correction reduces\nthe bit error rate eb, which measures the probability of errors in the Z-basis:\neb = Number of bit errors\nN\n.\n(54)\nThey also estimate the phase error rate ep, corresponding to errors in the X-basis:\nep = Number of phase errors\nN\n.\n(55)\nThe key insight of the Shor-Preskill proof is that quantum error correction codes, specifically CalderbankShor-Steane (CSS) codes, can simultaneously correct bit errors and phase errors. Alice and Bob effectively\ndistill near-perfect entanglement from the noisy shared state by performing error correction. The fidelity of the\ncorrected state to the ideal |Φ+⟩is bounded as,\nF ≥1 −ϵ,\n(56)"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q149", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What are the two applications of quantum coding described in the paper?"}, {"title": "Đáp án chuẩn", "text": "making money that is in principle impossible to counterfeit, and multiplexing."}, {"title": "Bài", "text": "Quantum Cryptography - Public Key Distribution and Coin Tossing"}, {"title": "Đoạn gốc (trang 2)", "text": "principle of quantum physics. \nIn conventional in­\nfor11ation theory and cryptography,· it is taken for \ngranted that digital communications in principle can \nalways be passively monitored or copied, even by \nsomeone ignorant of their noeaning. \nHowever, when \ninformation iř encoded in non-orthogonal quantum \nstates, such as single photons with polarization \ndirections 0, 45, 90, and 135 degrees, one obtains a \nconununications channel whose transmissions in prin­\nciple cannot be read or copied reliably by an eaves­\ndropper ignorant of certain key information used in \nforming the transmission. \nThe eavesdropper cannot \neven gain partial information about such a trans11is­\nsion without altering it a random and uncontrollable \nway likely to be detected by the channel's legiti­\nmate users. \nQuantum coding was first described in (W), \nalong with two applications: ..aking 110ney that is in \nprinciple impossible to counterfeit, and multiplex­"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q150", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What are the typical system architectures and quantum data-encoding methods discussed in the review?"}, {"title": "Đáp án chuẩn", "text": "It summarises findings from previous real-world and experimental QML deployments. It also identifies and explains the typical system architectures and quantum data-encoding methods."}, {"title": "Bài", "text": "Quantum Machine Learning for Cybersecurity"}, {"title": "Đoạn gốc (trang 2)", "text": "and large-scale IoT tiers, especially when there is a limited\nbudget, and allocation needs to be done in a resource-aware\nmanner [7] [8]. The taxonomy of QML algorithms for the\ndomain of cybersecuerity have been summarized in Figure 1.\nThe combined capabilities highlighted above show how\nQML plays a key role in future advancements in cybersecurity.\nThis review aims to critically evaluate the real-world\nimpacts of QML in closing gaps in cyber-threat detection,\nincident response, and system resilience, covering supervised,\nunsupervised, as well as hybrid quantum-classical modes. It\nsummarises findings from previous real-world and experimental\nQML deployments. It also identifies and explains the typical\nsystem architectures and quantum data-encoding methods. This\nreview also discusses practical limitations that arise from\nthings such as noise and scaling issues in current quantum\nhardware, the overhead caused by feature-mapping processes,"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q151", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What are the Shor code and the Steane code used for in the context of quantum error correction?"}, {"title": "Đáp án chuẩn", "text": "The Shor code and the Steane code function as quantum error correction schemes because they encode quantum information into several qubits through entangled states."}, {"title": "Bài", "text": "Next-Generation Quantum Security - The Impact of Quantum Computing on Cybersecurity—Threats, Mitigations, and Solutions"}, {"title": "Đoạn gốc (trang 21)", "text": "(18)\nThe execution of research aims to address crucial operational problems such as quantum error correction because this mechanism \nsafeguards quantum state transmission, as states lost during transmission lead to decoherence, which weakens quantum Internet \nsecurity and dependability [106]. The Shor code and the Steane code function as quantum error correction schemes because they \nencode quantum information into several qubits through entangled states.\nProtected communication on the quantum Internet is based on its quantum signature features of entanglement and teleportation \nto detect intercept attempts, making them easily detectable according to [245]. A technological system which derives its security \nfrom quantum mechanics, along with entanglement theory, the no-cloning theorem, and quantum error correction protocols, protects \ndata during transmission. A quantum Internet seems possible for futuristic global communication systems because it provides"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q152", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What can be used to expand a short random seed to a much longer string of certifiably random bits even if one distrusts the equipment used for this purpose?"}, {"title": "Đáp án chuẩn", "text": "it suﬃces to assume that spacelike separated parties are unable to communicate with one another [19], or to make suitable assumptions about (quantum) computational hardness [20]."}, {"title": "Bài", "text": "Quantum Computing in the NISQ era and beyond"}, {"title": "Đoạn gốc (trang 6)", "text": "Remarkably, this feature of quantum\nphysics can be exploited to expand a short random seed to a much longer string of\ncertiﬁably random bits, even if one distrusts the equipment used for this purpose —\nit suﬃces to assume that spacelike separated parties are unable to communicate with\none another [19], or to make suitable assumptions about (quantum) computational\nhardness [20]. Certiﬁable randomness has many potential applications, for example\nto secure communication protocols, unbiased statistical sampling, and Monte Carlo\nsimulations.\n(4) Quantum sensing. Quantum technology has advantages for some kinds of sensing.\nQuantum systems can sense weak forces with better sensitivity and higher spatial\nresolution than other sensing technologies [21]; thus quantum sensing could have\nrelatively near-term high-impact applications, to medicine for example.\nQuantum communication, networking, randomness expansion, and sensing cannot be"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q153", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What specific timing attack was discovered affecting multiple implementations of Kyber KEM in late 2023?"}, {"title": "Đáp án chuẩn", "text": "\"KyberSlash\" timing attacks"}, {"title": "Bài", "text": "A Survey of Post-Quantum Cryptography Support in Cryptographic Libraries"}, {"title": "Đoạn gốc (trang 5)", "text": "Preprint – A Survey of Post-Quantum Cryptography Support in Cryptographic Libraries\n5\ning it implemented correctly and securely. Post-quantum algorithms are complex, and early implementations have already hit\nsome snags. For instance, in late 2023 researchers discovered\n“KyberSlash” timing attacks affecting multiple implementations\nof Kyber KEM. The attack exploited non-constant-time arithmetic in decapsulation, allowing an attacker with precise timing\nmeasurements to recover a Kyber private key if they could trigger many decryptions on the same key [32,33]. The KyberSlash\nvulnerabilities were reported and patched in the official reference\ncode by December 2023, but this incident shows that PQC implementations need rigorous side-channel resistance and auditing.\nIt’s not enough to rely on the algorithm’s hardness; the code\nmust be written with the same care as modern crypto (avoiding\nleaks via timing, memory access patterns, etc.). Some libraries"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q154", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "How many new read addresses and write addresses are used to replace the read and write addresses of the RAMs and ROM in the proposed architecture of the address controller?"}, {"title": "Đáp án chuẩn", "text": "four new read addresses (raddr’ x) and two new write addresses (waddr’ x) are used to replace the read and write addresses of the RAMs and ROM."}, {"title": "Bài", "text": "A Hardware-Friendly Shuffling Countermeasure Against Side-Channel Attacks for Kyber"}, {"title": "Đoạn gốc (trang 4)", "text": "mode and we get the target random address permutation.\nThe protection will not increase the consumption of total\ntime of Kyber since RPG is conducted in parallel with Kyber,\ncosts much fewer cycles, and has shorter critical path.\nB. Address Controller\nAs shown in Fig. 3, the proposed architecture of the address\ncontroller (ADDR) is divided into four parts. In part (a), four\nnew read addresses (raddr’ x) and two new write addresses\n(waddr’ x) are used to replace the read and write addresses of\nthe RAMs and ROM. Six 2-to-1 MUXs are used to determine\nthe data sources of these new addresses. When there is no need\nfor shuffling, the original addresses are directly connected.\nWhen shuffling is required, addr0 ∼addr5 are selected.\nThe generation of the control signals repl0 ∼repl5 for these\nFig. 4. The CPA results of the unprotected scheme with 4 × 103 EM traces\n(a) and the protected scheme with 1 × 105 EM traces (b). The TVLA results"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q155", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What frameworks and tools are discussed for developing hybrid quantum-classical models in the practical implementation of QML on quantum hardware?"}, {"title": "Đáp án chuẩn", "text": "The passage mentions that frameworks and tools such as Qiskit and TensorFlow Quantum are discussed for developing hybrid quantum-classical models, as reviewed in [96] and [65]."}, {"title": "Bài", "text": "A Survey of Quantum Machine Learning - Foundations,Algorithms, Frameworks, Data and Applications"}, {"title": "Đoạn gốc (trang 25)", "text": "frameworks for blind QML, guaranteeing privacy in ML task delegation.\nThe practical implementation of QML on quantum hardware is an area of intense development. [96] and [65] reviewed quantum platforms such as IBM Q, IonQ and D-Wave, discussing\narchitectures and tools such as Qiskit and TensorFlow Quantum for developing hybrid quantumclassical models. Koshka [60] and Alchieri et al. [2] discussed the differences between adiabatic and\ngate-based quantum computing, emphasizing the role of NISQ devices in the execution of QML\nalgorithms and the need for robust techniques to handle noise and decoherence.\nDespite advances, QML faces several challenges that must be addressed for widespread adoption.\n[74] and [112] highlighted the current limitations of quantum hardware, such as qubit stability\nand high data input costs, as well as the need for more efficient and robust algorithms in the face\nof noise. In addition, Abbas et al. [1] pointed out that, although quantum ensembles of classifiers"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q156", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the basis of ML-KEM's cryptographic operations and what problem does it rely on for security guarantees?"}, {"title": "Đáp án chuẩn", "text": "ML-KEM, achieving standardization as FIPS 203, demonstrates the practical viability of lattice-based cryptography through computational efficiency that often surpasses classical alternatives while maintaining strong security guarantees rooted in worst-case lattice problems [21]."}, {"title": "Bài", "text": "Post-Quantum Cryptography and Quantum-Safe Security"}, {"title": "Đoạn gốc (trang 7)", "text": "post-quantum standardization through their exceptional synthesis of theoretical rigor, practical\nefficiency, and implementation versatility. The mathematical foundations rest upon the rich structure of lattices in high-dimensional spaces, where the discrete nature of lattice points creates\ncomputational problems that remain intractable even for quantum adversaries while enabling\nefficient cryptographic operations through carefully designed algorithms. Figure 2 illustrates a\ntwo-dimensional lattice, where lattice vectors generate a discrete set of points and shortest vector\nproblems emerge naturally from its geometry.\nML-KEM, achieving standardization as FIPS 203, demonstrates the practical viability of latticebased cryptography through computational efficiency that often surpasses classical alternatives\nwhile maintaining strong security guarantees rooted in worst-case lattice problems [21]. The\nalgorithm operates over polynomial rings with meticulously chosen parameters that balance"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q157", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the critical step in ensuring the security of quantum communication channels after keys are successfully generated in QKD?"}, {"title": "Đáp án chuẩn", "text": "detecting eavesdropping"}, {"title": "Bài", "text": "Quantum key distribution through quantum machine learning - a research review"}, {"title": "Đoạn gốc (trang 5)", "text": "signiﬁcantly\nenhance\nthe\nperformance of quantum cryptographic systems. Once keys are\nsuccessfully generated in QKD, detecting eavesdropping becomes\na critical step in ensuring the security of quantum communication\nchannels. Strengthening QKD protocols remains a vital frontier,\nrepresenting the convergence of quantum communication and\nquantum computing.\nThe Table 1 provides a summary of recent QML protocols\napplied in QKD, highlighting current research gaps and potential\nfuture directions.\n4 Discussion\nThis article discusses advancements in QML for quantum\ncryptography, especially with a focus on QKD, eavesdropping\ndetection, and security analysis. Recent studies are reviewed,\nand their prospects and constraints are summarized in a tabular\nformat. Key research gaps include optimization challenges due to\nthe lack of dedicated QML models, practical implementation and\nreal-time testing limitations, hybrid quantum-classical tradeoffs,"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q158", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What does the term 'harvest-now, decrypt-later' (HNDL) refer to in the context of cybersecurity?"}, {"title": "Đáp án chuẩn", "text": "HNDL refers to the strategy where attackers can harvest encrypted traffic today and defer decryption until future computational breakthroughs render current schemes obsolete."}, {"title": "Bài", "text": "Harvest-Now, Decrypt-Later - A Temporal Cybersecurity Risk in the Quantum Transition"}, {"title": "Đoạn gốc (trang 1)", "text": "quantum-safe cryptography; hybrid TLS; telecom security\n1. Introduction\nEncryption underpins the trustworthiness of modern communications, but confidentiality guarantees are only as strong as the adversary’s horizon. In practice, attackers can\nharvest encrypted traffic today and defer decryption until future computational breakthroughs render current schemes obsolete [1,2]. This “harvest-now, decrypt-later” (HNDL)\nstrategy converts long-lived ciphertext into a temporal cyberweapon, threatening not\nonly cryptographic primitives but also the infrastructures and archives that depend on\nthem [3,4].\nThe phrase HNDL has circulated in industry and policy discourse since the mid-2010s,\noften attributed to practitioners such as Andersen Cheng, yet it has remained largely\ninformal in the academic literature [5]. Existing studies are piecemeal: for example, recent\nstudies forecasts the feasibility of post-quantum cryptography (PQC) adoption under"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q159", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the key difference between reading a classical book and a quantum book in terms of information retrieval?"}, {"title": "Đáp án chuẩn", "text": "For a classical book, reading each page sequentially reveals more information until the entire content is known. In contrast, a quantum book's information is encoded in the entanglement between pages, making it inaccessible by reading pages individually; collective observation on multiple pages is required to understand the content."}, {"title": "Bài", "text": "Quantum Computing in the NISQ era and beyond"}, {"title": "Đoạn gốc (trang 2)", "text": "diﬀerent from the correlations we encounter in everyday life. To understand the concept of\nentanglement, imagine a system with many parts, for example a book which is 100 pages\nlong. For an ordinary classical 100-page book, every time you read another page you learn\nanother 1% of the content of the book, and after you have read all of the pages one by\none you know everything that’s in the book. But now suppose instead that it’s a quantum\nbook, where the pages are very highly entangled with one another. Then when you look\nat the pages one at a time you see only random gibberish, and after you have read all the\npages one by one you know very little about the content of the book. That’s because the\ninformation in the quantum book is not imprinted on the individual pages; it is encoded\nalmost entirely in how the pages are correlated with one another. If you want to read the\nbook you have to make a collective observation on many pages at once. That’s quantum"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q160", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the vulnerability of Dilithium in the context of the Point-Wise Multiplication (PWM) stage mentioned in the paper?"}, {"title": "Đáp án chuẩn", "text": "Dilithium employs the single-point PWM and is more vulnerable to similar attacks."}, {"title": "Bài", "text": "An Improved Two-Step Attack on Lattice-Based Cryptography - A Case Study of Kyber"}, {"title": "Đoạn gốc (trang 1)", "text": "the Point-Wise Multiplication (PWM) stage apply to several\nother lattice-based PQC. Dilithium employs the single-point\nPWM and is more vulnerable to similar attacks. The PWM\nof Falcon works with floating-point numbers, but significant\nside-channel leakage remains due to secret key and message\nmultiplication [9].\nII. PRELIMINARIES\nA. Kyber and Number Theoretic Transform in Kyber\nKyber consists of three stages: key generation, encryption,\nand decryption. In the key generation stage, the public key\npk is constructed as As + e. During the encryption stage, the\nmessage m is encrypted into ciphertext c. In the decryption\narXiv:2407.06942v3 [cs.CR] 13 Mar 2025"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q161", "title": "multi-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the impact of the Rand Basis algorithm on the size of keys and signatures in the lattice-based signature method proposed by [149], and how does this compare to the security of lattice-based cryptography based on the Learning with Errors (LWE) problem as used in the Kyber key exchange process?"}, {"title": "Đáp án chuẩn", "text": "The lattice-based signature method proposed by [149] uses the Rand Basis algorithm to reduce the size of private and public keys but increases the size of the signature compared to previous schemes. In contrast, the Kyber key exchange process, which is based on the LWE problem, relies on the hardness of finding short vectors in high-dimensional lattices, providing a quantum-resistant solution to ensure security against quantum-capable attackers."}, {"title": "Bài A", "text": "Post-Quantum_Blockchain_Security_for_the_Internet_of_Things_Survey_and_Research_Directions"}, {"title": "Đoạn của bài A", "text": "framework to verify transactions and provide a quantumsecure cryptocurrency scheme. A novel lattice-based signature\nmethod has been proposed by [149] that uses the Rand Basis\nalgorithm to generate public and private keys from the root\nkeys for a post-quantum blockchain. Although this design\nwas able to reduce the size of the private and public keys in\ncomparison to prior peer schemes, the size of the signature\nincreased in contrast to previous cryptocurrency schemes [11].\nAnother study [150] takes the privacy of blockchains into\nconsideration, and provides a blind signature that can meet the\nblindness and other unforgeability criteria. It is a blind signature system with a post-quantum lattice-based technique that\nAuthorized licensed use limited to: Hanoi University of Science & Technology. Downloaded on May 14,2026 at 04:34:57 UTC from IEEE Xplore. Restrictions apply."}, {"title": "Bài B", "text": "Next-Generation Quantum Security - The Impact of Quantum Computing on Cybersecurity—Threats, Mitigations, and Solutions"}, {"title": "Đoạn của bài B", "text": "blockchain systems.\nTo mitigate these risks, quantum-resistant cryptography should be integrated into blockchain protocols to ensure security even \nagainst quantum-capable attackers [218]. Lattice-based cryptography, particularly schemes based on the Learning with Errors (LWE) \nproblem, offers a promising solution. For instance, Kyber (for key exchange) and FrodoKEM (for encryption) leverage LWE’s quantum \nresistance, as quantum algorithms fail to achieve significant speedups in solving lattice problems [77,219]. The Kyber key exchange \nprocess can be mathematically represented as: \n𝐀𝐬+ 𝐞= 𝐛\n(12)\nHere, 𝐀 is a public matrix, 𝐬 is the secret message, 𝐞 is a noise vector, and 𝐛 is the encrypted output. The security of lattice-based \ncryptography relies on the hardness of finding short vectors in high-dimensional lattices, a problem resistant to both classical and"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q162", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What does the fidelity F of a gate represent in the context of quantum computing, and how is it mathematically defined?"}, {"title": "Đáp án chuẩn", "text": "The fidelity F of a gate is defined as: 𝐹= |||⟨𝜓target|𝑈actual|𝜓input⟩|||<sup>2<\/sup>, where 𝑈actual represents the implemented gate operation, and 𝜓input and 𝜓target denote the initial and target quantum states, respectively."}, {"title": "Bài", "text": "Next-Generation Quantum Security - The Impact of Quantum Computing on Cybersecurity—Threats, Mitigations, and Solutions"}, {"title": "Đoạn gốc (trang 11)", "text": "system–environment interactions.\nGate Fidget and Control Precision: Quantum gate fidelity measures how closely an implemented quantum gate operation \nmatches the desired operation [121]. The physical implementation of gates in superconducting qubits and trapped ion systems is \nchallenging, relying on complex control protocols; thus, achieving high gate fidelity is crucial for successful quantum algorithm \nexecution [109,110]. The fidelity 𝐹 of a gate is defined as: \n𝐹= |||⟨𝜓target|𝑈actual|𝜓input⟩|||\n2\n(6)\nwhere 𝑈actual represents the implemented gate operation, and 𝜓input and 𝜓target denote the initial and target quantum states, \nrespectively. High gate fidelity requires minimizing errors from control signal imperfections and reducing environmental noise \neffects.\nComputers and Electrical Engineering 128 (2025) 110649 \n11"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q163", "title": "multi-hop", "blocks": [{"title": "Câu hỏi", "text": "How do PQC and QKD complement each other in mitigating the temporal cybersecurity risk in the quantum transition, according to the discussions in both papers?"}, {"title": "Đáp án chuẩn", "text": "PQC offers durable protection against future quantum attacks, while QKD provides physical-layer guarantees for specific, sensitive communication scenarios. Together, they form a hybrid solution that bridges the transition period, with PQC securing the future and QKD mitigating legacy risks in specialized contexts."}, {"title": "Bài A", "text": "Harvest-Now, Decrypt-Later - A Temporal Cybersecurity Risk in the Quantum Transition"}, {"title": "Đoạn của bài A", "text": "dashed links highlight complementary relationships. Effectiveness indicators and the\nimplementation timeline emphasize the need for synchronized deployment.\n4.7. Discussion\nNo single countermeasure can neutralize HNDL. PQC offers durable protection but\nmigration delays preserve a window of exposure [17]. Hybrids provide transitional security\nyet do not remediate harvested ciphertext. Forward-secure lifecycles reduce archival\nrisk but remain difficult to enforce under regulatory and operational constraints. QKD\ncontributes physical-layer guarantees, but its high cost and limited scalability restrict\nadoption. These defenses are therefore complementary: PQC secures the future, hybrids\nbridge the transition, and forward-secure designs mitigate legacy risk, with governance\ndetermining how consistently these measures are deployed [28,33].\nThe systemic implication is that HNDL is not only a cryptographic problem but a"}, {"title": "Bài B", "text": "Are Enterprises Ready for Quantum-Safe Cybersecurity"}, {"title": "Đoạn của bài B", "text": "solution for specialized scenarios. PQC can be deployed in software on existing infrastructure\nand provides broad protection (e.g., one can upgrade web browsers, servers, VPNs, and IoT\ndevices with PQC algorithms). By contrast, QKD might be justified for securing certain fiberoptic links that carry extremely sensitive data (like between data centers or between a bank’s\nheadquarters and a backup site), where the added security is worth the cost and where the\ndistance is within feasible limits [5]. In such cases, QKD would typically be used alongside\nclassical encryption (often referred to as a “hybrid” solution: keys from QKD feed a symmetric\ncipher like AES, while classical PQC or pre-shared keys ensure authentication).\nNotably, research continues to push QKD forward: efforts are underway to integrate QKD"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q164", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the Crypto-Agility Mandate and why is it important for quantum resilience and long-term digital trust?"}, {"title": "Đáp án chuẩn", "text": "The Crypto-Agility Mandate is a shift from static, algorithm-specific cryptography toward adaptive architectures capable of rapidly integrating new cryptographic primitives. It is a strategic necessity for quantum resilience and long-term digital trust."}, {"title": "Bài", "text": "The-Quantum-Security-Deadline"}, {"title": "Đoạn gốc (trang 2)", "text": "are actively investing in quantum technologies, making the timeline to cryptographic vulnerability \nincreasingly compressed (Mosca & Piani, 2021). The urgency lies not only in the eventual arrival \nof large-scale quantum computers but in the data being secured today—information that must \nremain confidential for years or decades. Once broken, retrospective decryption could compromise \nsensitive assets, from defense communications to financial transactions and critical infrastructure \ntelemetry (Keyfactor, 2024). \n \nThis reality has driven the Crypto-Agility Mandate—a shift from static, algorithm-specific \ncryptography toward adaptive architectures capable of rapidly integrating new cryptographic \nprimitives. Crypto-agility is no longer an optional best practice; it is a strategic necessity for \nquantum resilience and long-term digital trust. \n \nThe Quantum Threat Landscape \nThe quantum threat landscape is defined by the dual trajectory of technological progress and"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q165", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What accuracy did the model using variational quantum layer and mini-batch training achieve, and how did it compare to its classical counterpart?"}, {"title": "Đáp án chuẩn", "text": "Their model achieved 99.58% accuracy, outperforming its classical counterpart and demonstrating enhanced robustness on noisy data."}, {"title": "Bài", "text": "A Survey of Quantum Machine Learning - Foundations,Algorithms, Frameworks, Data and Applications"}, {"title": "Đoạn gốc (trang 22)", "text": "91:22\nF. Rodríguez-Díaz et al.\nclassical preprocessing with a variational quantum layer and mini-batch training. Their model\nachieved 99.58% accuracy, outperforming its classical counterpart and demonstrating enhanced\nrobustness on noisy data.\n𝑄𝐶models use quantum circuits as feature extractors, followed by classical layers that perform\nprediction. In this setup, quantum expectation values serve as intermediate representations, which\nare passed to classical neural networks or classifiers. This architecture balances quantum expressiveness with classical stability and has proven effective in various domains. For example, Dou\net al. [31] proposed a hybrid convolutional structure where parameterized quantum circuits act as\nsliding kernels, achieving strong performance on subsets of MNIST. Xiang et al. [125] integrated\nquantum layers into CNNs for breast cancer diagnosis, showing improved generalization across"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q166", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "How can QGANs be integrated within a framework to detect attack sequences at the protocol level?"}, {"title": "Đáp án chuẩn", "text": "By integrating QGANs within a framework such as IBM’s Qiskit, the system can model and detect attack sequences at the protocol level using quantum-enhanced pattern recognition."}, {"title": "Bài", "text": "A Survey of Quantum Generative Adversarial Networks"}, {"title": "Đoạn gốc (trang 13)", "text": "systems (IDS). One proposed approach leverages quantum generative adversarial\nnetworks (QGANs) to identify malicious network activity by learning atypical traffic\npatterns that are difficult to capture using classical models [61]. By integrating QGANs\nwithin a framework such as IBM’s Qiskit, the system can model and detect attack\nsequences at the protocol level using quantum-enhanced pattern recognition. Unlike\nclassical intrusion detection systems that may suffer from high training costs or reduced\naccuracy on large datasets, the quantum approach offers an alternative path toward\nscalable anomaly detection with potential computational advantages. This application\nunderscores the utility of QGANs in domains where dynamic threat landscapes require\nmodels capable of learning complex, high-dimensional behaviors.\nA promising application of QGANs has emerged in the context of de novo drug"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q167", "title": "multi-hop", "blocks": [{"title": "Câu hỏi", "text": "How does the modified Fujisaki–Okamoto transform in CRYSTALS-Kyber ensure security, and what previous attack method is used to recover 60% of the secret key in Kyber-512 with 1619 power traces, according to the passages?"}, {"title": "Đáp án chuẩn", "text": "The modified Fujisaki–Okamoto transform in CRYSTALS-Kyber ensures security by generating random secret and error values legally and verifying them during the decryption procedure. Ueno et al. [5] proposed a side-channel leakage in re-encryption as a PC oracle, utilizing 3072 power traces to recover the key, and the work in [6] uses the CPA attack twice to recover 60% of the secret key of Kyber-512 with 1619 power traces."}, {"title": "Bài A", "text": "Investigating CRYSTALS-Kyber Vulnerabilities - Attack Analysis and Mitigation"}, {"title": "Đoạn của bài A", "text": "on the assessment of the potentially maliciously created ciphertext (c).\nA change is made to the input r for CPAPKE.Enc. It is now the result of a hash of the\nmessage and public key rather than an arbitrary value. Improved security is the goal of\nthis modification.\nError-based learning schemes are prone to decryption failures, such as the ones found\nin Kyber. Adversaries may take advantage of these mistakes to learn personal values.\nFailures in decryption are more likely to happen if an attacker creates secret vectors and\nerror values that go beyond what is allowed in the CPAPKE.Enc procedure.\nBy using a modified version of the Fujisaki–Okamoto transform, the Kyber.Encaps\nand Kyber.Decaps procedures make sure that random secret and error values are generated\nlegally and are verified during the decryption procedure.\nThe CRYSTALS-Kyber algorithm uses the Fujisaki–Okamoto (FO) transformation to\nprovide CCA2 security. It starts by decrypting the ciphertext using CPA. Next, ciphertext"}, {"title": "Bài B", "text": "An Improved Two-Step Attack on Lattice-Based Cryptography - A Case Study of Kyber"}, {"title": "Đoạn của bài B", "text": "(FO) transform for the first time. Then for correlation power\nThis work was supported in part by the Natural Science Foundation\nof Jiangsu Province of China under Grant BK20243038, in part by the\nKey Research Plan of Jiangsu Province of China under Grant BE2022098,\nand in part by the Young Elite Scientists Sponsorship Program by the\nChina Association for Science and Technology under Grant 2023QNRC001.\n(Corresponding author: Jing Tian.)\nThe authors are with the School of Integrated Circuits, Nanjing University,\nSuzhou, 215163, China (e-mail: tianjing@nju.edu.cn).\nanalysis (CPA), Ueno et al. [5] proposed the side-channel\nleakage in re-encryption as a PC oracle, utilizing 3072 power\ntraces to recover the key. The work in [6] deals with imperfect\nPC oracle SCAs by using the CPA attack twice to recover 60%\nsecret key of Kyber-512 at the cost of about 1619 power traces,\nbut there are still 40% error coefficients. Contrast to previous"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q168", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What mathematical expression represents the lower bound of the decoy state quantum key distribution (QKD) system's security parameter S?"}, {"title": "Đáp án chuẩn", "text": "S ≥Qµ{−H2(Eµ) + Ω[1 −H2(e1)]}"}, {"title": "Bài", "text": "Decoy State Quantum Key Distribution"}, {"title": "Đoạn gốc (trang 1)", "text": "emitted by Alice) can be shown to be given by:\nS ≥Qµ{−H2(Eµ) + Ω[1 −H2(e1)]}\n(1)\nwhere Qµ and Eµ are respectively the gain and quantum\nbit error rate (QBER) of the signal state [7], Ωand e1 are\nrespectively the fraction and QBER of detection events\nby Bob that have originated from single-photon signals\nemitted by Alice and H2 is the binary Shannon entropy.\nIt is a priori very hard to obtain a good lower bound\non Ωand a good upper bound on e1. Therefore, prior\nart methods (as in GLLP [6]) make the most pessimistic\nassumption that all multi-photon signals emitted by Alice\nwill be received by Bob. For this reason, until now, it has\nbeen widely believed that the demand for unconditional\nsecurity will severely reduce the performance of QKD\nsystems [6, 8, 9, 10, 11].\nIn this paper, we present a simple method that will provide very good bounds to Ωand e1. Consequently, our\nmethod for the ﬁrst time makes most of the long distance"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q169", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What can an adversary do to disrupt a QKD channel and potentially cause a Denial-of-Service (DoS) attack?"}, {"title": "Đáp án chuẩn", "text": "An adversary could intentionally induce conditions such as shining light into the fiber to block the quantum communication."}, {"title": "Bài", "text": "Are Enterprises Ready for Quantum-Safe Cybersecurity"}, {"title": "Đoạn gốc (trang 7)", "text": "conditions – the same sensitivity that detects an eavesdropper also means QKD links can\nbe easily disrupted by normal disturbances, raising the risk of Denial-of-Service (DoS) [53].\nA QKD channel might drop whenever a spurious event happens on the line (for instance,\nextra noise in the fiber), and an adversary could intentionally induce such conditions (by\nshining light into the fiber, etc.) to block the quantum communication. Thus, while QKD\ncan alert to eavesdropping, it also makes communications fragile: an attacker doesn’t even\nneed to break the encryption; simply jamming the QKD channel can force the system to\nfall back (or fail) [54].\n• High Cost and Operational Complexity: Deploying QKD is expensive. It often requires\ndedicated dark fibers or at least using existing fiber with careful multiplexing and filtering to separate quantum signals from classical ones [5]. Running a QKD network may\nentail hiring specialized quantum engineers for maintenance. Furthermore, most use cases"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q170", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What are the performance trade-offs that organizations adopting PQC must contend with?"}, {"title": "Đáp án chuẩn", "text": "Consequently, organizations adopting PQC must contend with performance trade-offs, including slower transaction speeds, higher storage requirements, and increased power consumption."}, {"title": "Bài", "text": "Next-Generation Quantum Security - The Impact of Quantum Computing on Cybersecurity—Threats, Mitigations, and Solutions"}, {"title": "Đoạn gốc (trang 16)", "text": "problematic for Internet of Things (IoT) devices and other constrained environments [79,192].\nThe increased size of cryptographic data structures in PQC solutions leads to greater bandwidth consumption and noticeably \nslower encryption and decryption times. As noted in [193], this results in lower efficiency compared to traditional elliptic curve \nor RSA-based systems. Consequently, organizations adopting PQC must contend with performance trade-offs, including slower \ntransaction speeds, higher storage requirements, and increased power consumption.\nBeyond performance limitations, the maturity of PQC algorithms remains a critical factor. Many of the proposed solutions \nare still in early developmental phases. Although the National Institute of Standards and Technology (NIST) is actively leading \nstandardization efforts, these algorithms have not yet been fully validated for long-term security and resilience against evolving"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q171", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the main reason for the PCC computation being faster than the Kendall’s tau calculation in the implemented methods?"}, {"title": "Đáp án chuẩn", "text": "The main reason is that the Kendall’s tau calculation must compute a large full permutation."}, {"title": "Bài", "text": "An Improved Two-Step Attack on Lattice-Based Cryptography - A Case Study of Kyber"}, {"title": "Đoạn gốc (trang 2)", "text": "x and y data sets, respectively.\nWe have separately implemented the two methods in software and found that the PCC computation is much faster than\nthe Kendall’s tau calculation. The main reason is that the\nListing 1 Base multiplication in Kyber.\n1 void basemul(int16_t r[2],\n2\nint16_t zeta,\n3\nconst int16_t s[2],\n4\nconst int16_t u[2])\n5 {\nr[0]\n= fqmul(s[1], u[1]);\n6\nr[0]\n= fqmul(r[0], zeta);\n7\nr[0] += fqmul(s[0], u[0]);\n8\nr[1]\n= fqmul(s[0], u[1]);\n9\nr[1] += fqmul(s[1], u[0]);}\nlatter must compute a large full permutation. Luckily, when\nwe combined the two methods together, the efficiency and\nreliability both were enhanced. More details will be shown in\nthe following section.\nIII. PROPOSED IMPROVED TWO-STEP ATTACK\nIt should be remarked that the proposed improved two-step\nattack is illustrated in Fig. 1. We assume that an attacker has\naccess l Intelligence in Quantum Communications (Mahmud and Abdelhadi, 2025)?"}, {"title": "Đáp án chuẩn", "text": "For quantum key distribution (QKD) and simulation, QSVM and QNN techniques are utilized, enabling fast and efficient key generation."}, {"title": "Bài", "text": "Quantum key distribution through quantum machine learning - a research review"}, {"title": "Đoạn gốc (trang 3)", "text": "platforms like IBM’s will be essential for\nadvancing quantum-enhanced cybersecurity\nsolutions\nArtiﬁcial Intelligence in Quantum\nCommunications (Mahmud and Abdelhadi,\n2025)\nIn this article, the applications of various\nmachine learning algorithms in quantum\ncommunication (QC) are discussed. For\nquantum key distribution (QKD) and\nsimulation, QSVM and QNN techniques are\nutilized, enabling fast and efﬁcient key\ngeneration\nMajor constraints include coherence issues in\nQNN, which lead to errors and training\nchallenges, as well as hardware limitations in\nQSVM. To mitigate these issues, advanced\nqubit technologies, optimized algorithms,\nhybrid AI models, and error correction\ntechniques must be employed\nQuantum Machine learning\nin eavesdropping detection\nQKD as a QML task (Decker et al., 2024)\nDescribes a novel perspective to Optimize\neavesdropping with robust security measures.\nThe BB84 protocol is analyzed in this article\nEthical and security constraints"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q175", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the bound on the size of f given by the equation f = O(log log N)?"}, {"title": "Đáp án chuẩn", "text": "f = O(log log N)"}, {"title": "Bài", "text": "How to factor 2048 bit RSA integers with less than a million noisy qubits"}, {"title": "Đoạn gốc (trang 7)", "text": "|P|·ℓ·2−f = O(1) after expanding terms using Equation 3, Equation 4, Equation 6, and Equation 8\ngives a bound on the size of f:\nf = O(log log N)\n(23)\nSee Figure 3 for working Python code that computes eV ≈ge mod N using this method.\n2.2\nApproximate Period Finding\nShor’s algorithm, as usually described, performs period finding against a periodic function f(x).\nIt relies crucially on the fact that f(x) is exactly periodic, with f(x + P) = f(x) for all values\nof x. In this paper I’m computing an approximation ef ≈f, so I can only guarantee approximate\nperiodicity:\n∀x, y ∈Z : ∆N\n\u0010\nef(x + yP) −ef(x)\n\u0011\n≤ϵ.\n(24)\nExact period finding will fail if used on a function that only guarantees approximate periodicity,\nbecause the error in the approximation can make the function aperiodic. To fix this, we must\navoid measuring the error. For example, instead of measuring the entire output of ef(x) you could\nmeasure a truncated output ef(x)//(100Nϵ).\nThis could work, but causes two problems.\nThe"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q176", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What quantum-resistant problem does Kyber rely on for key exchange?"}, {"title": "Đáp án chuẩn", "text": "Kyber relies on the quantum-resistant Learning With Errors (LWE) problem."}, {"title": "Bài", "text": "Next-Generation Quantum Security - The Impact of Quantum Computing on Cybersecurity—Threats, Mitigations, and Solutions"}, {"title": "Đoạn gốc (trang 20)", "text": "measurement outcomes.\nThe main problem in IoT and edge computing environments is related to the limited resources of IoT devices, which have low \nmemory, power, and computational capabilities [234]. The resources on these devices are insufficient to directly perform standard \nQKD protocols, yet standard QKD systems require a precise optical setup and significant processing capabilities to deal with the \nqubit state. Integrated hybrid quantum–classical systems are being investigated as a solution, where the quantum layer handles key \nexchange, while the classical layer is responsible for data encryption using post-quantum algorithms, such as lattice-based encryption \nschemes (e.g., Kyber for key exchange or NTRU for encryption) [235]. As an example, Kyber relies on the quantum-resistant Learning \nWith Errors (LWE) problem and achieves competitive key sizes and low computational overhead."}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q177", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "How many searches are required to recover the secret key for the clean and m4 schemes of CRYSTALS-Kyber?"}, {"title": "Đáp án chuẩn", "text": "The secret key could be recovered with just four and eight searches, respectively, for clean and m4 schemes."}, {"title": "Bài", "text": "Investigating CRYSTALS-Kyber Vulnerabilities - Attack Analysis and Mitigation"}, {"title": "Đoạn gốc (trang 6)", "text": "Cryptography 2024, 8, 15\n6 of 13\nsignals generated during cryptographic operations, researchers employed vertical sidechannel leakage detection to examine CRYSTALS-Kyber’s decryption mechanism.\nThere are flaws in KYBER-512 that allow an attacker to know the contents of decrypted\ncommunications and fully recover the key with some simple queries [38]. They concentrated on elements of the clean and m4 schemes, such as message encoding and the inverse\nNumber Theoretic Transform (NTT). The term “m4 scheme” describes an enhanced application of the Kyber cryptographic algorithm running on an ARM Cortex-M4 embedded CPU,\nwhich is a very effective processor. This implementation is included in the library and is\ncalled pqm4. Notably, for clean and m4, the secret key could be recovered with just four and\neight searches, respectively. Additionally, they suggested methods for message recovery\nthat included cyclic messa ffer from the use of quantum convolution layers in Quantum Machine Learning, and what are the limitations of current quantum hardware in supporting these techniques?"}, {"title": "Đáp án chuẩn", "text": "The implementation of Quantum Phase Estimation (QPE) in Shor’s algorithm avoids hard-coding modular exponentiation for a specific N, using a programmatically assembled method. In contrast, quantum convolution layers in Quantum Machine Learning can reduce computational requirements and improve accuracy, but current quantum hardware may not fully support their potential due to limitations. Quantum Autoencoders, a use case of Quantum Machine Learning, are used for tasks like clustering and classification, but their effectiveness is constrained by the current state of quantum hardware."}, {"title": "Bài A", "text": "Practical Challenges in Executing Shor’s Algorithm"}, {"title": "Đoạn của bài A", "text": "CNOT-like primitive). The Readout Error (RO) quantifies the probability of misclassifying the\nfinal measurement outcome (|0⟩↔|1]⟩). These values reflect native, physical error rates without\nQEC; lower values permit deeper and wider circuits before noise dominates.\nCode\nOur implementation is based on standard constructions for reversible arithmetic. We employ a Cuccaro-style ripple-carry adder [26] and a two’s-complement overflow/comparator method\nfor modular addition [27], avoiding QFT-space adders [28]. Controlled powers of a are implemented\nvia precomputed exponents a2k mod N within a textbook QPE order-finding scaffold [29, 30] and\nwe target Qiskit Runtime Sampler V2 [31].\nImplementation Approaches\nWe derived an implementation of order-finding via Quantum\nPhase Estimation (QPE) that avoids the ad-hoc modular exponentiation tailored to a specific\nN. Instead of hard-coding multiply-by-a mod N for a fixed N, we programmatically assemble a"}, {"title": "Bài B", "text": "Quantum_Machine_Learning_A_Survey"}, {"title": "Đoạn của bài B", "text": "Convolution formula: Cij = ∑k=1N aik bkj \nWhere: \n(Cij) is the output element at position (i, j). \n(aik}) and (bkj) are the input elements. \nThe sum ranges over (N) elements. \nKey Points: Quantum convolution layers can reduce computational requirements and improve accuracy. \nLimitations: Current quantum hardware may not support the full potential of quantum convolution layers. \nQRNN’s incorporate quantum gates for sequence processing, similar to classical RNNs. \nRecurrence formula: (ht = f(ht-1, xt)) \nWhere: \n(ht) is the hidden state at time (t). \n(f) is the activation function. \n(ht-1) is the previous hidden state. \n(xt) is the current input. \nQuantum Autoencoders \nDescription: Quantum versions of autoencoders, used for dimensionality reduction and feature extraction in \nmachine learning. \nUse Cases: Enhance the performance of clustering and classification tasks. \nFields of Use: Applied in data compression, anomaly detection, and feature engineering."}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q180", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What modification was made to the Fisher-Yates shuffle to make it more hardware-friendly?"}, {"title": "Đáp án chuẩn", "text": "We modify the Fisher-Yates shuffle to make it more hardware-friendly."}, {"title": "Bài", "text": "A Hardware-Friendly Shuffling Countermeasure Against Side-Channel Attacks for Kyber"}, {"title": "Đoạn gốc (trang 1)", "text": "IEEE TRANSACTIONS ON CIRCUITS AND SYSTEMS—II: EXPRESS BRIEFS\n1\nA Hardware-Friendly Shuffling Countermeasure\nAgainst Side-Channel Attacks for Kyber\nDejun Xu\nID , Kai Wang\nID , and Jing Tian\nID , Member, IEEE\nAbstract—CRYSTALS-Kyber has been standardized as the\nonly key-encapsulation mechanism (KEM) scheme by NIST to\nwithstand attacks by large-scale quantum computers. However,\nthe side-channel attacks (SCAs) on its implementation are still\nneeded to be well considered for the upcoming migration. In\nthis brief, we propose a secure and efficient hardware implementation for Kyber by incorporating a novel compact shuffling\narchitecture. First of all, we modify the Fisher-Yates shuffle to\nmake it more hardware-friendly. We then design an optimized\nshuffling architecture for the well-known open-source Kyber\nhardware implementation to enhance the security of all known\nand potential side-channel leakage points. Finally, we implement\nthe modified Kyber design on FPGA and evaluate its security and"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q181", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the baseline estimate for the time until quantum computers can compromise the data (Ha)?"}, {"title": "Đáp án chuẩn", "text": "Baseline estimate: Ha ≈Tqday +3–5 years."}, {"title": "Bài", "text": "harvest-now-decrypt-later-pqc-threat-model"}, {"title": "Đoạn gốc (trang 18)", "text": "exactly Q-Day—there’s lag:\nHa = T_qday + O(years for operational deployment and refinement)\nWhy the delay?\n1. Early quantum computers will be rare and expensive: Governments get them first.\nThen well-funded organizations. Commercial availability lags by years.\n2. Algorithmic refinement: First Shor implementations on real hardware will be messy.\nOptimization takes time.\n3. Scaling: Early machines have limited capacity. Adversaries will prioritize their highestvalue targets.\nBaseline estimate: Ha ≈Tqday +3–5 years.\n6.3 Compromise Condition: Ld > Ha\nThe vulnerability math is simple:\nData is compromised if Ld > Ha\nIf your data needs protection longer than it takes attackers to build quantum computers, you’re\nexposed. Retroactive decryption is coming.\nData is protected if Ld ≤Ha\nFor data encrypted today (2024-2025):\n• Ld for long-lived data: 2050-2130+\n• Baseline Ha: rprise’s preparedness level against quantum threats: 𝑅(𝑡) = 𝛼× 𝐴(𝑡) + 𝛽× 𝑀(𝑡)"}, {"title": "Bài", "text": "The-Quantum-Security-Deadline"}, {"title": "Đoạn gốc (trang 8)", "text": "replace, and manage those algorithms efficiently across dynamic environments (Entrust, 2025; \nKampanakis, 2024). \n \nIn essence, PQC answers “What to use?” whereas crypto-agility answers “How to adapt?”. The \ncombined framework can be modeled as a resilience function that measures an enterprise’s \npreparedness level against quantum threats: \n𝑅(𝑡) = 𝛼× 𝐴(𝑡) + 𝛽× 𝑀(𝑡) \n \nWhere: \n \nR(t) = Resilience Index at time t, \n \nA(t)= Algorithmic Agility (ability to switch cryptographic primitives), \n \nM(t))= Migration Readiness (degree of PQC deployment), \n \nα,β = weighting coefficients representing policy and technical influence."}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q185", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What quantum algorithm breaks RSA, DSA, and DH by factoring large integers efficiently, rendering these schemes insecure against quantum attacks?"}, {"title": "Đáp án chuẩn", "text": "Shor’s algorithm [89] breaks RSA, DSA, and DH by factoring large integers efficiently, rendering these schemes insecure against quantum attacks."}, {"title": "Bài", "text": "Next-Generation Quantum Security - The Impact of Quantum Computing on Cybersecurity—Threats, Mitigations, and Solutions"}, {"title": "Đoạn gốc (trang 10)", "text": "S. Ali et al.\nTable 5\nKey quantum algorithms and their impact on cryptography.\n Quantum algorithm\nClassical counterpart\nImpact on cryptography\n \n Shor’s algorithm [89]\nClassical integer factorization \nalgorithms\nBreaks RSA, DSA, and DH by factoring large \nintegers efficiently, rendering these schemes \ninsecure against quantum attacks.\n \n Grover’s algorithm [90]\nClassical brute-force search\nHalves the effective key length of symmetric \nencryption (e.g., AES), requiring longer keys to \nmaintain security.\n \n Quantum Fourier \nTransform (QFT) [91]\nClassical Fourier transform\nEnables period finding, fundamental to Shor’s \nalgorithm; indirectly threatens cryptographic \nsystems based on periodicity.\n \n Quantum Phase Estimation \n(QPE) [92]\nClassical estimation algorithms\nAids algorithms like Shor’s and may impact \nschemes based on eigenvalue or modular \narithmetic problems.\n \n Quantum simulations [93]\nClassical simulation algorithms\nCould improve cryptanalysis and aid in evaluating"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q186", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What does the algorithm check to determine if the ciphertext is equal to the re-encrypted ciphertext?"}, {"title": "Đáp án chuẩn", "text": "The algorithm determines if c′ and the public ciphertext c are equal."}, {"title": "Bài", "text": "Investigating CRYSTALS-Kyber Vulnerabilities - Attack Analysis and Mitigation"}, {"title": "Đoạn gốc (trang 5)", "text": "provide CCA2 security. It starts by decrypting the ciphertext using CPA. Next, ciphertext\nc′ is produced when the message is “re-encrypted” using CPA encryption. The program\nthen determines if c′ and the public ciphertext c are equal. The algorithm becomes True\nif c = c′ and False otherwise. The generation of the session key K is contingent upon the\nBoolean outcome. The FO transform is carried out to check for any modifications made by\nan adversary.\nEssentially, this Kyber mechanism guards against adversaries trying to take advantage\nof holes in the encryption and decryption processes by addressing potential weaknesses\nassociated with decryption failures in Learning with Errors schemes.\n3. Side-Channel Attacks\nBecause of the difficulty of the underlying mathematics, a cryptographic system may\nappear to be resistant to mathematical assaults, yet it may still be susceptible to side-channel\nattacks. Side-channel attacks, first identified by Paul Kocher in 1996, make use of data that"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q187", "title": "multi-hop", "blocks": [{"title": "Câu hỏi", "text": "How does the qubit technology used by IBM and Google in their quantum computing systems compare in terms of processing speed and qubit connectivity, and what is the potential computational advantage of a 105-qubit quantum computer compared to classical supercomputers?"}, {"title": "Đáp án chuẩn", "text": "IBM and Google use superconducting circuits and trapped-ion qubits, respectively, which have fast processing speeds but low qubit connectivity. In contrast, a 105-qubit quantum computer, as demonstrated by Google, can solve a problem in five minutes that would take the world’s fastest supercomputers 10 septillion years, highlighting the significant computational advantage of quantum computers in handling complex problems."}, {"title": "Bài A", "text": "Practical Challenges in Executing Shor’s Algorithm"}, {"title": "Đoạn của bài A", "text": "Table 1: Quantum computing with different qubit technologies and their characteristics.\nSynthetic Qubits\nNatural Qubits\nAtom-based\nLight-based\nType\nSuperconducting circuits*,\nQuantum dots, Topological\nqubits, NV centers in\ndiamonds\nTrapped-Ion*, Neutral\nAtom*\nPhoton\nExamples of\nCommercial\nProviders\nIBM, Google, Rigetti, IQM,\nMicrosoft, Intel, Diraq,\nQuantum Brilliance\nIonQ, Quantinuum, AQT,\nQuEra, Pasqal, planqc,\nAtom Computing,\nInfleqtion\nXanadu, PsiQuantum,\nQuandela\nOverall Processing\nSpeed\nFast\nSlow\nFast\nQubit\nConnectivity\nLow\nHigh\nLow\nCoherence Times\nLow\nHigh\nHigh\nCooling\nRequirement\nExtreme cryogenics (∼10\nmK)\nRoom temperature but\noften standard cryogenics\n(∼4 K)\nRoom temperature with\ndetectors requiring\nstandard cryogenics (4 K)\nMain Advantages\nCircuits can be designed\nwith the desired topology;\nhighly scalable in some\napproaches\nHigh accuracy and stability;\nqubits identical by nature;\nvery long coherence times\nEnergy efficient; builds on\nsome telecom-industry\nmatured photonic"}, {"title": "Bài B", "text": "Quantum Machine Learning for 6G Network"}, {"title": "Đoạn của bài B", "text": "research directions.\nII. A GLANCE OF QML FOR 6G NETWORK INTELLIGENCE\nAND STANDARDIZATION EFFORTS\nThe key insight of quantum computing lies in its exploitation of quantum parallelism, a fundamental property where\nfour qubits (|0⟩, |1⟩, |+⟩, |−⟩) can exist in a superposition of\nstates, enabling simultaneous computation of multiple possibilities. Quantum computers use superposition qubits to encode\ndata, which can hold more information than binary bits.\nTheoretically, a classical computer with N bits handles up\nto N calculations at once, while a quantum computer can\nprocess up to 2N calculations simultaneously. For instance,\na quantum computer with 32 qubits can store and process\nan amount of information roughly equivalent to 232 bits (512\nmegabytes of classical data) simulationally. In December 2024,\nGoogle has introduced a 105-qubit chip that it claims can\nsolve a problem in ﬁve minutes, which would take the world’s\nfastest supercomputers 10 septillion years to complete [8]."}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q188", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "How many evaluations are required by Grover’s algorithm compared to classical methods for a search over a set of N unstructured data elements?"}, {"title": "Đáp án chuẩn", "text": "Grover’s algorithm solves this problem with quadratic speedup, requiring only √𝑁 evaluations, compared to N."}, {"title": "Bài", "text": "A Survey of Quantum Machine Learning - Foundations,Algorithms, Frameworks, Data and Applications"}, {"title": "Đoạn gốc (trang 10)", "text": "achieve significant computational speedups. This subsection explores some of the most prominent\nfundamental quantum algorithms.\n4.1.1\nGrover’s Algorithm. This is one of the most fundamental algorithms in quantum computing.\nThis algorithm fully exploits the concept of superposition to perform a search over a set of N\nunstructured data elements. Any search problem can be expressed as a function 𝑓(𝑥), where x is\nan element of the set to be searched. If the element 𝑥is a solution, then 𝑓(𝑥) = 1; otherwise, if 𝑥is\nnot a solution, 𝑓(𝑥) = 0. Classically, in the worst-case scenario, we would have to evaluate 𝑓(𝑥)\na total of 𝑁−1 times, where 𝑁= 2𝑛. This approach involves testing all possibilities. In contrast,\nGrover’s algorithm solves this problem with quadratic speedup, requiring only √𝑁evaluations,\ncompared to N.\nACM Comput. Surv., Vol. 58, No. 4, Article 91. Publication date: October 2025."}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q189", "title": "multi-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the timeline for transitioning to quantum-resistant cryptography according to the White House's NSM-10, and how does this relate to NIST's PQC initiative in terms of their goals and deadlines?"}, {"title": "Đáp án chuẩn", "text": "The White House's NSM-10 declared that the United States must prioritize the timely and equitable transition of cryptographic systems to quantum-resistant cryptography, with the goal of mitigating as much of the quantum risk as feasible by 2035. NIST initiated the Post-Quantum Cryptography Standardization Initiative (NIST PQC) in 2016 to provide strong cryptographic algorithm standards that can withstand attacks from quantum computers, aiming to secure sensitive data in the post-quantum computing age. Both initiatives aim to address the quantum risk, with NSM-10 setting a specific deadline of 2035, while NIST PQC focuses on developing and standardizing quantum-resistant algorithms."}, {"title": "Bài A", "text": "A Survey of Post-Quantum Cryptography Support in Cryptographic Libraries"}, {"title": "Đoạn của bài A", "text": "Other US government agencies have been preparing for this\ntransition in parallel to NIST’s technical work. In May 2022,\nthe White House issued National Security Memorandum 10\n(NSM-10), which declared that “the United States must prioritize the timely and equitable transition of cryptographic systems\nto quantum-resistant cryptography, with the goal of mitigating\nas much of the quantum risk as feasible by 2035” [21,22]. NSM10 tasked agencies to inventory their cryptographic systems and\nplan for PQC. Subsequently, the US Office of Management and\nBudget (OMB) released Memorandum M-23-02 (18 Nov. 2022),\ndirecting federal agencies (except national security systems) to\ndevelop a comprehensive inventory of cryptography in use by"}, {"title": "Bài B", "text": "Investigating CRYSTALS-Kyber Vulnerabilities - Attack Analysis and Mitigation"}, {"title": "Đoạn của bài B", "text": "Cryptography 2024, 8, 15\n2 of 13\nAware of this difficulty, post-quantum cryptosystems that can safely and successfully\nwithstand quantum attacks must be developed and put into use [4,5]. With the development\nof quantum computing, conventional asymmetric methods like RSA could not be adequate\nto protect private data. The way that quantum technology is developing has prompted an\nongoing endeavor to design resilient post-quantum systems [6].\nThe National Institute of Standards and Technology (NIST) initiated the Post-Quantum\nCryptography Standardization Initiative (NIST PQC) in 2016 in response to the changing\nthreat scenario provided by quantum computers. NIST PQC’s main objective is to provide\nstrong cryptographic algorithm standards that can withstand attacks from quantum computers. The goal of the project is to secure sensitive data in the post-quantum computing age\nby requesting, assessing, and standardizing quantum-resistant cryptographic algorithms."}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q190", "title": "multi-hop", "blocks": [{"title": "Câu hỏi", "text": "How does the Hilbert space representation differ between the quantum cryptography and quantum computing contexts described in the two passages, particularly in terms of the number of basis vectors and the state description?"}, {"title": "Đáp án chuẩn", "text": "In the quantum cryptography context, the Hilbert space for a pair of photons is 4-dimensional, spanned by four orthogonal basis vectors, while in the quantum computing context, the Hilbert space for a system with 2n qubits is 2n-dimensional, spanned by 2n basis vectors. The state of a compound system in cryptography is described by a unit vector in the tensor product of the Hilbert spaces of its components, whereas in quantum computing, the state is described by a superposition of basis states with complex amplitudes, requiring 2n-1 complex numbers to fully describe the state."}, {"title": "Bài A", "text": "Quantum Cryptography - Public Key Distribution and Coin Tossing"}, {"title": "Đoạn của bài A", "text": "and c2 • (0.707i,0.70\"1); \nbut \nthe rectilinear and diagonal bases are all that will \nbe needed for the cryptographic Əpplications in this \npaper. \nThe Hilbert space for a compound system is \nconstructƐƑ by taking the tensor product of the Hil­\nbert spaces of its components; thus the state of a \npair of pht>t:t>ns is characterized by a-unit vector in \nthe 4-dimƒnsional Hjlbert space spanned by the or­\nthogonal 6asis vectors r1r1, r1r2, r2r1, and r2r2. \nThis formalism Ɠntails that the state of a compound \nsystem is not generally expressible as the cartesian \nproduct of the states of its parts: e.g. the \n·Einstei'n-Podolsky-Rosen state of two photons, \n0.7071(r1r2-r2r1), \nto be discussed later, is not \nequivalent to . any product of one-photon states. \nlll. Quantum Public Key Distribution \nIn traditional public-key cryptography, trap­\ndoor functions arc used to conceal the nteaning of \nmessages between two users from a passive eavesdrop­"}, {"title": "Bài B", "text": "Polynomial-Time Algorithms for Prime Factorization and Discrete Logarithms on a Quantum Computer"}, {"title": "Đoạn của bài B", "text": "6\nP. W. SHOR\nnot be discussed in this paper, and thus we do not deﬁne them; see a quantum theory\nbook such as Peres [1993] for this deﬁnition.) The Hilbert space associated with this\nquantum system is the complex vector space with these 2n states as basis vectors, and\nthe state of the system at any time is represented by a unit-length vector in this Hilbert\nspace. As multiplying this state vector by a unit-length complex phase does not change\nany behavior of the state, we need only 2n −1 complex numbers to completely describe\nthe state. We represent this superposition of states as\n2n−1\nX\ni=0\nai |Si⟩,\n(2.1)\nwhere the amplitudes ai are complex numbers such that P\ni |ai|2 = 1 and each |Si⟩\nis a basis vector of the Hilbert space.\nIf the machine is measured (with respect to\nthis basis) at any particular step, the probability of seeing basis state |Si⟩is |ai|2;\nhowever, measuring the state of the machine projects this state to the observed basis"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q191", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "How does the gradient in a classical deep neural network compare to that in a quantum circuit in terms of exponential scaling?"}, {"title": "Đáp án chuẩn", "text": "The gradient in a classical deep neural network can vanish exponentially in the number of layers, while in the quantum circuit, it is exponentially small in the number of qubits."}, {"title": "Bài", "text": "Barren plateaus in quantum neural network training landscapes"}, {"title": "Đoạn gốc (trang 4)", "text": "exploding) gradient problem of classical deep neural networks [32–34, 47]. At least two key diﬀerences are present\nin the quantum case: (i) the diﬀerent scaling of the vanishing gradient and (ii) the complexity of computing expected values.\nThe gradient in a classical deep neural network can\nvanish exponentially in the number of layers [32, 33],\nwhile in the a quantum circuit is exponentially small in\nthe number of qubits, as shown above. Therefore, the\nlater will generally be exponentially smaller than the former. In the classical case, the gradient for a weight in\na neuron depends on the sum of all the paths connecting that neuron to the output, and when the weights are\ninitialized with random values the paths have random\nsigns which cancels the signal [32]. The number of paths\nis exponential in the number of layers. In the quantum\ncase, the number of paths is exponential in the number\nof gates, and also have random signs [31]."}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q192", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the name of the lattice-based signature algorithm that was formerly known as CRYSTALS-Dilithium?"}, {"title": "Đáp án chuẩn", "text": "The ML-DSA (see Figure 3), formerly known as CRYSTALS-Dilithium, is a lattice-based signature."}, {"title": "Bài", "text": "Post-Quantum Cryptography and Quantum-Safe Security"}, {"title": "Đoạn gốc (trang 11)", "text": "systems. To this end, NIST has endorsed three signature families for widespread adoption-ML-DSA\n(Dilithium), SLH-DSA (SPHINCS+), and the lattice-based Falcon under a parallel track-highlighting\na balance between performance efficiency and conservative security across lattice- and hash-based\nparadigms [4, 70, 71].\nThese post-quantum signature mechanisms mark a decisive move away from traditional RSA\nand elliptic curve digital signature algorithm (ECDSA), grounding security in problems that remain\nintractable even with quantum computation [57]. The selected algorithms-CRYSTALS-Dilithium\n(ML-DSA), Falcon (FN-DSA), and SPHINCS+ (SLH-DSA)-each bring unique trade-offs in efficiency,\nkey and signature sizes, and assurance levels, ensuring flexibility for varied deployment requirements in the emerging quantum era [23].\n4.1\nCRYSTALS-Dilithium (ML-DSA)\nThe ML-DSA (see Figure 3), formerly known as CRYSTALS-Dilithium, is a lattice-based signature"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q193", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What mechanism ensures that a single corrupted key can be dropped and a new one used instead in the context of key management for quantum key distribution networks?"}, {"title": "Đáp án chuẩn", "text": "A few corrupted bits do not have catastrophic consequences because a single corrupted key can be dropped and a new one used instead."}, {"title": "Bài", "text": "Quantum Key Distribution Networks -- Key Management - A Survey"}, {"title": "Đoạn gốc (trang 12)", "text": "polarization recovery and compensation, and channel timing alignment. The FIFO multiplexing manager creates and\nmaintains an independent key stream for each connected application. It spawns the FIFO interface for each FIFO\nqueue so that the application can access the stream of bits; b) Application programmable interface functions to define\ncommunication between applications and NIST’s FIFO multiplexing manager.\nThe paper [58] emphasizes keeping secret key stores and queues in sync across sites. A few corrupted bits do not have\ncatastrophic consequences because a single corrupted key can be dropped and a new one used instead. On the contrary,\na few dropped bits result in the loss of synchronization and the inability to use any further keys in the store or queue.\nThis is due to the manner in which key material is stored. Each byte of generated key material is assigned a unique"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q194", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What approach can offer additional flexibility by including device-level parameters in the definition of the ansatz, and how does it connect to quantum optimal control?"}, {"title": "Đáp án chuẩn", "text": "Hence, one can include these device-level parameters in the definition of the ansatz, as this can offer additional flexibility [43]. This approach also establishes a connection to the idea of quantum optimal control, which is often used to determine the translation from logical to physical device parameters, and which is especially applicable for quantum simulations [44, 45]."}, {"title": "Bài", "text": "Variational quantum algorithms"}, {"title": "Đoạn gốc (trang 4)", "text": "VQA applications.\nComplementary approaches based\non exploring diﬀerent ansatz variants simultaneously as\nan evolving cohort have also shown promising performance [42].\n6.\nSub-logical ansatz and quantum optimal control\nThe parameters θ are often speciﬁed at the logical circuit level (such as rotation angle), however sometimes\nthey have a direct translation to device-level parameters\nbelow the logical level.\nHence, one can include these\ndevice-level parameters in the deﬁnition of the ansatz, as\nthis can oﬀer additional ﬂexibility [43]. This approach\nalso establishes a connection to the idea of quantum\noptimal control, which is often
