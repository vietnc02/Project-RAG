<\/sup> P(L(i)<sub>d<\/sub> > Ha | data_type<sub>i<\/sub>)×(data_value<sub>i<\/sub> ×impact<sub>i<\/sub>)"}, {"title": "Bài", "text": "harvest-now-decrypt-later-pqc-threat-model"}, {"title": "Đoạn gốc (trang 65)", "text": "Notation\nDefinition\nHNDL\nHarvest Now, Decrypt Later attack model\ninvolving deferred cryptographic decryption\nHNDL Model Extensions\nExtension 1: Multi-Party Risk Aggregation\nFor organizations managing multiple data types with different confidentiality lifetimes:\nRiskorg =\nn\n∑\ni=1\nP(L(i)\nd > Ha | data_typei)×(data_valuei ×impacti)\nWhere aggregation sums risk across all data types.\nExtension 2: Supply Chain Propagation\nFor organizations with supply chain dependencies:\nRiskcustomer = Riskdirect +Riskvendor1 ×P(vendor1_compromise)\n+Riskvendor2 ×P(vendor2_compromise)+...\nDemonstrates how supply chain risks propagate.\nExtension 3: Probabilistic Timeline Modeling\nFor modeling uncertainty in Q-Day:\nP(decrypt | data,t) = P(Ha ≤t)×P(Ld ≥t | data_type)\n×P(attacker_targets | threat_actor)\nEnables scenario analysis across multiple Q-Day assumptions.\nSupplementary Tables\nTable A1: Quantum Algorithm Threat Timeline\nDate\nQuantum Capability\nImpact on\nCryptography\nMitigation Status\n2024"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q236", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the estimated success rate of the deployment?"}, {"title": "Đáp án chuẩn", "text": "99.8%+ success rate."}, {"title": "Bài", "text": "harvest-now-decrypt-later-pqc-threat-model"}, {"title": "Đoạn gốc (trang 33)", "text": "• Open-sourced: BoringSSL fork, Go crypto, quic-go\n• Performance: X25519+Kyber indistinguishable from X25519-only\nThe Hard Parts:\n• Fragmented ClientHello: Kyber keyshares (~1,200 bytes) split across packets. Some\nmiddleboxes and load balancers choked. Solution: coordinated with browser vendors,\nupgraded infrastructure.\n• QUIC issues: Initial packets with random IDs caused routing failures. Fix: load balancer\nfirmware updates.\n• Legacy devices: Rejected unknown TLS extensions. Mitigation: GREASE protocol\nprevents ossification.\nOutcome: 99.8%+ success rate. <2% latency increase. ~17x handshake size (manageable).\nIdentified and fixed 12+ compatibility issues through public beta.\nKey Lesson: Issues only emerge at Internet scale. Deploy early, monitor extensively, coordinate\nwith ecosystem.\n10.3 Case Study: Google Chrome Post-Quantum TLS\nOrganization: Google Chrome\nTimeline: August 2023 (Beta) →Q1 2024 (Full rollout)\nScale: 3.2+ billion users (65% browser market share)\nStatus: Live"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q237", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What type of machine learning models have shown to be faster, more efficient, and more robust in cybersecurity applications compared to traditional methods?"}, {"title": "Đáp án chuẩn", "text": "QSVMs, QNNs, VQCs, and QGANs have shown to be much faster, efficient, and robust as compared to their classical counterparts."}, {"title": "Bài", "text": "Quantum Machine Learning for Cybersecurity"}, {"title": "Đoạn gốc (trang 5)", "text": "Performance\ndeclines\nwith\nincreasing\ndata\ncomplexity.\nQuantum-enhanced\nscaling\nsupports\nlarge,\ndynamic digital ecosystems [15].\nApplication domains\nUsed for IDS, malware detection, and threat\nmonitoring [6].\nExtends to cybersecurity, finance, healthcare, and\nclimate modelling [13], [15].\nIt also describes what each of these implies for cybersecurity\napplications.\nV. APPLICATIONS\nThe applications of QML in the domain of cybersecurity\nare multifarious, such as adversarial detection and defence,\nhealthcare data security, malware and botnet identification\nand telecommunication protection. Every domain presents\nunique challenges. Due to the growing complexity of digital\ninfrastructures along with the rapid evolution of cyber threats,\ntraditional machine learning and rule-based systems have been\npushed to their limits. In each of these domains, QML models\nsuch as QSVMs, QNNs, VQCs, and QGANs, have shown\nto be much faster, efficient, and robust as compared to their"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q238", "title": "multi-hop", "blocks": [{"title": "Câu hỏi", "text": "How does the gradient variance of the localized cost function in the QCNN architecture compare to the variance of the gradient for the Haar distributed unitaries in quantum neural networks, and what are the implications for the number of qubits in each case?"}, {"title": "Đáp án chuẩn", "text": "The gradient variance of the localized cost function (CL) in the QCNN architecture transitions to a polynomial decay curve (O(1/poly(n))), preserving gradient signals even at higher qubit counts. In contrast, the variance of the gradient for Haar distributed unitaries in quantum neural networks, as given by the formula in Paper A, exhibits an exponential decay characteristic of barren plateaus (O(2^(-n))), which can lead to vanishing gradients as the number of qubits increases."}, {"title": "Bài A", "text": "Barren plateaus in quantum neural network training landscapes"}, {"title": "Đoạn của bài A", "text": "of the number of layers to a ﬁxed value determined by the\nnumber of qubits.\nAn advantage of the explicit polynomial formulas are\nthat they allow an analytic calculation of the variance as\nwell, which allows precise speciﬁcation of the coeﬃcient\nin Levy’s lemma. In cases where the integrals depend on\nup to two powers of elements of U and U ∗, one may make\nuse of the elementwise formula [51]\nZ\ndµ(U)Ui1j1Ui2j2U ∗\ni′\n1j′\n1U ∗\ni′\n2j′\n2 =\nδi1i′\n1δi2i′\n2δj1j′\n1δj2j′\n2 + δi1i′\n2δi2i′\n1δj1j′\n2δj2j′\n1\nN 2 −1\n−\nδi1i′\n1δi2i′\n2δj1j′\n2δj2j′\n1 + δi1i′\n2δi2i′\n1δj1j′\n1δj2j′\n2\nN(N 2 −1)\n(14)\nThe variance of the gradient is deﬁned by\nVar[∂kE] = ⟨(∂kE)2⟩\n(15)\nas we have seen above that ⟨∂kE⟩= 0.\nThrough use\nof the above formula for integration up to the second\nmoment of the Haar distribution, one may evaluate this\nexpression in 3 separate cases. In the case where U−is a\n2-design but not U+,\nVar[∂kE] = 2Tr(ρ2)\nN 2\nTr⟨H2\nuV 2 −(HuV )2⟩U+\n= −Tr(ρ2)\n22n\nTr⟨[V, Hu]2⟩U+\n(16)"}, {"title": "Bài B", "text": "Beyond Barren Plateaus - A Scalable Quantum Convolutional Architecture for High-Fidelity Image Classification"}, {"title": "Đoạn của bài B", "text": "Var[∂C/∂θµ], for a randomly selected parameter\nθµ located in the first convolutional layer.\nWe simulated the QCNN framework for varying input dimensions, spanning from n = 4 to\nn = 14 qubits. For each n, we instantiated 500 independent circuits with parameters sampled uniformly from [0, 2π] and computed the analytical\ngradient via the parameter-shift rule. We compared our Localized Cost Function (CL) against\nthe standard Global Cost Function (CG).\n4\n6\n8\n10\n12\n14\n10−5\n10−4\n10−3\n10−2\nNumber of Qubits (n)\nGradient Variance Var[∂C/∂θµ]\nGradient Variance vs. System Size\nGlobal Cost (CG) - Exponential\nLocal Cost (CL) - Polynomial\nFigure 5: Empirical scaling of the gradient variance. The\nglobal cost function exhibits the hallmark exponential\ndecay characteristic of barren plateaus (O(2−n)). Conversely, the localized cost function integrated into our\nQCNN architecture transitions to a polynomial decay\ncurve (Ω(1/poly(n))), preserving gradient signals even\nat higher qubit counts."}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q239", "title": "multi-hop", "blocks": [{"title": "Câu hỏi", "text": "What are the potential consequences of not migrating to post-quantum cryptography (PQC) during the retention period as required by GDPR, and how does this relate to the pre-compromised status of encrypted data discussed in The Quantum Security Deadline paper?"}, {"title": "Đáp án chuẩn", "text": "Not migrating to PQC during the retention period could constitute a breach of appropriate security measures under GDPR, potentially leading to regulator enforcement action for negligence. According to The Quantum Security Deadline paper, any encrypted data transmitted or stored today without quantum resistance is effectively 'pre-compromised,' which could undermine national security, erode public trust, and violate data protection regulations such as GDPR and FISMA."}, {"title": "Bài A", "text": "harvest-now-decrypt-later-pqc-threat-model"}, {"title": "Đoạn của bài A", "text": "• Data controllers must ensure confidentiality of personal data for the “retention period”\n• Retention periods extend from 3 years (some tax records) to indefinite (some healthcare\ndata, trade secrets)\n• Confidentiality obligation extends throughout retention period\nQuantum Risk Implications:\n• Data encrypted today with classical cryptography faces quantum decryption risk during\nretention period\n• Failure to migrate to PQC during retention period could constitute breach of “appropriate\nsecurity measures”\n• Regulator enforcement action could allege negligence in failing to adopt “state of the art”\nPQC\nGDPR Compliance Action Required:\n• Organizations should conduct Data Protection Impact Assessments (DPIAs) addressing\nquantum threats\n• Organizations should incorporate quantum-safe migration into cryptographic policies\n• Organizations should document risk assessment and mitigation strategy\n15.3 NIS2, DORA, and Cyber Resilience Act"}, {"title": "Bài B", "text": "The-Quantum-Security-Deadline"}, {"title": "Đoạn của bài B", "text": "European Journal of Computer Science and Information Technology, 13(52),35-52, 2025 \n \n \n Print ISSN: 2054-0957 (Print) \n Online ISSN: 2054-0965 (Online) \n Website: https://www.eajournals.org/ \n Publication of the European Centre for Research Training and Development -UK \n41 \n \nThe longevity of encryption thus becomes a critical factor in determining exposure risk. Even if \nCRQCs capable of breaking RSA-2048 or ECC-256 are a decade away, any encrypted dataset \ntransmitted or stored today without quantum resistance is effectively “pre-compromised” under \nthe HNDL model (Kampanakis, 2024; HashiCorp, 2025). Once decrypted, these records could \nundermine national security, erode public trust, and violate data protection regulations such as the \nGeneral Data Protection Regulation (GDPR) and U.S. Federal Information Security Modernization \nAct (FISMA) (NIST, 2024; CISA, 2024). \n \nMitigating this risk requires immediate adoption of quantum-safe key management practices,"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q240", "title": "multi-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the probability that a random good c′ is divisible by a prime power over 18, and how does this relate to the expected time for finding a set of small primes satisfying a specific condition in the RSA factorization algorithm?"}, {"title": "Đáp án chuẩn", "text": "The probability that a random good c′ is divisible by a prime power over 18 is at most 12/pαi i. This relates to the expected time for finding a set of small primes satisfying a specific condition in the RSA factorization algorithm, as the conjecture in Paper B suggests that a set of small primes can be found in polynomial time with high probability, assuming the deviation ∆N(L) is below 2−f, which grows logarithmically with the problem size."}, {"title": "Bài A", "text": "Polynomial-Time Algorithms for Prime Factorization and Discrete Logarithms on a Quantum Computer"}, {"title": "Đoạn của bài A", "text": "i\ndividing p −1, a random good c′ is unlikely to\ncontain pi. If we are willing to accept a large constant for our algorithm, we can just\nignore the prime powers under 18; if we know r modulo all prime powers over 18, we can\ntry all possible residues for primes under 18 with only a (large) constant factor increase\nin running time. Because at least one twelfth of the c’s were in a good (c, d) pair, at\nleast one twelfth of the c′’s are good. Thus, for a prime power pαi\ni , a random good c′ is\ndivisible by pαi\ni\nwith probability at most 12/pαi\ni . If we have t good c′’s, the probability\nof having a prime power over 18 that divides all of them is therefore at most\nX\n18 < p\nαi\ni\n\f\f(p−1)\n\u0012 12\npαi\ni\n\u0013t\n,\n(6.20)\nwhere a|b means that a evenly divides b, so the sum is over all prime powers greater\nthan 18 that divide p −1. This sum (over all integers > 18) converges for t = 2, and\ngoes down by at least a factor of 2/3 for each further increase of t by 1; thus for some"}, {"title": "Bài B", "text": "How to factor 2048 bit RSA integers with less than a million noisy qubits"}, {"title": "Đoạn của bài B", "text": "L mod N uniformly distributed over the range [1, N). In cases I’ve tested, I’m consistently able to\nfind an L with deviation below 2−f with high probability by randomly sampling O(2f) sets of small\nprimes. I conjecture this is true in general (see Assumption 1). I’ll show later in Equation 23 that\nthe required value of f grows logarithmically with the problem size len N. Assuming the conjecture\nand the promise that f will grow like O(log log N), an L with sufficiently small deviation can be\nfound in polynomial time:\n∆N(L) < 2−f\n(by brute force random search for a satisfying P)\n(17)\nAssumption 1 (random search for small modular deviations is efficient): A set P of small\nprimes satisfying (Q P) ≥N m and ∆N(Q P) < 2−f can be found in O(2f · poly(m · len N))\nexpected time by randomly varying the primes included in P.\nAs an example, here’s a set of 25000 primes I found in ten seconds using a 128 core machine."}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q241", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What specific quantum algorithm is mentioned to improve quantum key distribution (QKD)?"}, {"title": "Đáp án chuẩn", "text": "Dimensionality reduction using quantum algorithms improves QKD."}, {"title": "Bài", "text": "Quantum key distribution through quantum machine learning - a research review"}, {"title": "Đoạn gốc (trang 4)", "text": "in quantum key distribution, Dimensionality reduction using\nquantum\nalgorithms, Hybrid quantum-classical\nconvolutional\nneural networks, Kernal-based QML, quantum neural networks\nwith machine learning principles, Quantum convoluted neural\nnetworks\n(QCNN),\nQuantum\nParticle\nSwarm\nOptimization\n(QPSO)\nimproves\nQKD,\nRandom\nnumber\ngeneration,\nside\nchannel attack mitigation, Adaptive protocols, post-quantum\ncryptography,\nanomaly\ndetection\nessential\nfor\nquantum-safe\ncommunication\nand\ndata\nprotection\ntechniques.\nThe\nrapid\ngrowth of developments of QML algorithms to maximize the\nefﬁciency\nof\nQuantum\ncryptography\nresearch\nlike\nQKD,\neavesdropping detection, and security analysis of QKD protocols\nis demonstrated in Figure 1a, which represents the number of\narticles published in this ﬁeld from 1990 to 2025 as per research\ndata collected google scholar and web of science. Figure 1b illustrates\nkey aspects of both QML and Quantum Cryptography (QC),\nhighlighting how advancements in quantum mechanics and"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q242", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "Which survey discusses important topics in quantum computing and communications relevant to the development of QML?"}, {"title": "Đáp án chuẩn", "text": "The survey [131] discusses important topics in quantum computing and communications that are relevant to the development of QML."}, {"title": "Bài", "text": "A Survey of Quantum Machine Learning - Foundations,Algorithms, Frameworks, Data and Applications"}, {"title": "Đoạn gốc (trang 5)", "text": "challenges, and some discussions may be speculative rather than offering actionable guidance.\nHowever, it is one of the most prominent surveys in this field and should be read by any novel\nresearcher.\nThe work in [55] offers an extensive review of various QML algorithms and quantum deep\nlearning techniques. Theoretical developments and practical challenges are addressed, discussing\nalgorithmic efficiency, hardware considerations, and potential applications across different domains.\nAlthough the survey is comprehensive, the breadth of topics covered might be overwhelming to\nsome readers, and a prior understanding of quantum computing principles may be necessary to\nfully appreciate the content.\nFinally, the survey [131] discusses important topics in quantum computing and communications\nthat are relevant to the development of QML. Provides context on how QML fits within the broader\nlandscape of quantum technologies, addressing foundational concepts, infrastructure challenges,"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q243", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What are the advantages of the technique mentioned over masking?"}, {"title": "Đáp án chuẩn", "text": "zero clock cycle overhead, immunity to glitches, universal coverage, and higher resilience to repetition assaults."}, {"title": "Bài", "text": "Investigating CRYSTALS-Kyber Vulnerabilities - Attack Analysis and Mitigation"}, {"title": "Đoạn gốc (trang 10)", "text": "receive identical input data. Such a technique has the following advantages over masking:\nzero clock cycle overhead, immunity to glitches, universal coverage, and higher resilience\nto repetition assaults.\n8. Conclusions\nThe suggested key encapsulation system, CRYSTALS-Kyber, is confronting increasing\ndifficulties due to advanced side-channel attacks. Current studies reveal weaknesses even\nin cases with strong security, necessitating ongoing defensive enhancements. Masking\nand shuffling are two countermeasures that are essential to strengthening cryptographic\nsystems. The need to assess algorithms for both mathematical strength and resilience to\noutside attacks increases as we approach the post-quantum era.\nInstead of totally undermining a new wave of encryption, AI is a useful tool for\nhandling noisy data and identifying their flaws. A power side-channel assault and a\nstraight cryptography breach are very different from one another. Surprisingly, few traces"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q244", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What does a higher R(t) indicate in terms of enterprise quantum resilience?"}, {"title": "Đáp án chuẩn", "text": "A higher R(t) indicates greater enterprise quantum resilience, reflecting superior agility, automation, and cryptographic readiness against quantum-era threats."}, {"title": "Bài", "text": "The-Quantum-Security-Deadline"}, {"title": "Đoạn gốc (trang 9)", "text": "European Journal of Computer Science and Information Technology, 13(52),35-52, 2025 \n \n \n Print ISSN: 2054-0957 (Print) \n Online ISSN: 2054-0965 (Online) \n Website: https://www.eajournals.org/ \n Publication of the European Centre for Research Training and Development -UK \n43 \n \nA higher R(t) indicates greater quantum resilience. In practical terms, enterprises should target an \nR(t)>0. (on a 0–1 scale) before the estimated Cryptographically Relevant Quantum Computer \n(CRQC) horizon—currently projected around 2032 (Mosca, 2021; NIST, 2024). \nThe Quantum-Resilience Index, R(t), serves as a key performance metric for enterprise \nadaptability in post-quantum environments. A higher R(t) indicates greater enterprise quantum \nresilience, reflecting superior agility, automation, and cryptographic readiness against quantumera threats. \n \nBUILDING THE FOUNDATION FOR QUANTUM-RESILIENT SECURITY \nQuantum resilience requires a holistic, enterprise-wide approach that integrates discovery,"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q245", "title": "multi-hop", "blocks": [{"title": "Câu hỏi", "text": "How might the preparation of a thermal state in semidefinite programs relate to quantum annealing algorithms discussed in Quantum_Machine_Learning_A_Survey? Specifically, explain the potential connection between the Gibbs state preparation and the annealing schedule in Quantum Annealing Algorithms."}, {"title": "Đáp án chuẩn", "text": "The preparation of a thermal state in semidefinite programs, as discussed in 'Quantum Computing in the NISQ era and beyond', might relate to quantum annealing algorithms by suggesting that the thermalization stage of the algorithm could be executed by quantum annealing, as mentioned in 'Quantum_Machine_Learning_A_Survey'. The Gibbs state preparation, which is crucial for achieving an exponential speedup in certain semidefinite programs, could be analogous to the annealing schedule in Quantum Annealing Algorithms, where the temperature (T(t)) is adjusted over time to find the global minimum of a function."}, {"title": "Bài A", "text": "Quantum_Machine_Learning_A_Survey"}, {"title": "Đoạn của bài A", "text": "J. Electrical Systems 20-6s (2024): 971-981 \n976 \nSampling probability: P(x)= (exp(−E(x)))/Z \nWhere: \n(E(x)) is the energy of the state corresponding to data (x). \n(Z) is the partition function. \nKey Points: Offers exponential speedup over classical sampling algorithms for certain distributions. \nQuantum Annealing Algorithms \nDescription: Used for finding the global minimum of a function, crucial in optimization tasks within machine \nlearning. \nUse Cases: Optimization problems in logistics, scheduling, and game theory [1]. \nFields \nof \nUse: \nApplied \nin \noperations \nresearch, \nfinance, \nand \ngame \ntheory. \nQAA uses quantum states to find optimal solutions to optimization problems. \nAnnealing schedule: (T(t) = T0 + (Tf – T0)(1 – e-kt)) \nWhere: \n(T(t)) is the temperature at time (t). \n(T0) is the initial temperature. \n(Tf) is the final temperature. \n(k) is a constant. \n \nFig 2. Quantum Annealing Algorithms \nQuantum Principal Component Analysis Algorithms"}, {"title": "Bài B", "text": "Quantum Computing in the NISQ era and beyond"}, {"title": "Đoạn của bài B", "text": "For semideﬁnite programs with the right structure, the eﬃcient preparation of the\nGibbs state is possible, and therefore the exponential speedup really is feasible. In particular, the quantum algorithm achieves an exponential speedup if all the input matrices\nfor the semideﬁnite program have low rank, or if the corresponding Hamiltonian system\nthermalizes rapidly. It is not yet clear to what extent these properties apply to semidefinite programs of practical interest; clarifying that issue is an important goal for further\nresearch.\nIt is intriguing that the crucial step in the quantum algorithm is the preparation of\na thermal state at a nonzero temperature.\nThat may suggest that the algorithm has\nsome intrinsic robustness against thermal noise, or that the thermalization stage of the\nalgorithm could be executed by quantum annealing. Conceivably, then, a quantum solver"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câ , UAV trajectory planning, and space-ground communications. Investigating the\nvariations of attacks on these learning models represents a\nvaluable point for research. For example, in service ofﬂoading,\nQRL models rely on quantum state encoding to represent\ndynamic tasks, network resources, and congestion conditions.\nAdversaries can introduce signal perturbations that mislead\ntask prioritization and resource allocation, resulting in suboptimal ofﬂoading decisions. In spectrum sharing and beam\nsteering, QRL models rely on quantum states for channel\nestimation and spatial conﬁgurations, making them vulnerable\nto subtle manipulations. This can mislead decision-making,\ncausing improper spectrum allocation or beam misdirection,\nrequiring quantum-speciﬁc adversarial defenses. The topic of\nQML in these 6G applications is still in its early stages of research, leaving signiﬁcant opportunities for further exploration\nand development."}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q248", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the typical range of signature sizes for Dilithium in kilobytes?"}, {"title": "Đáp án chuẩn", "text": "Signature sizes typically range from 2 to 3 kilobytes."}, {"title": "Bài", "text": "A Comparative Study of Classical and Post-Quantum Cryptographic Algorithms in the Era of Quantum Computing"}, {"title": "Đoạn gốc (trang 6)", "text": "3.3\nDilithium (Module-LWE Signature)\nDilithium is another lattice-based algorithm that also relies on the hardness of\nthe MLWE problem, in combination with the Module Short Integer Solution\n(SIS) problem. It is tailored for digital signatures and designed to balance security with performance and implementation simplicity. Dilithium offers strong\nprotection against side-channel attacks and is relatively straightforward to implement.\nSignature sizes typically kage Points in Kyber\nKyber is a CCA-secure protocol whose security is based on\nthe module learning with errors (MLWE) problem. The core"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q250", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What technique has been successful in breaching higher-order masked implementations of CRYSTALS-Kyber on a first-order masked and shuffled implementation of Saber on a hardware ARM Cortex-M4?"}, {"title": "Đáp án chuẩn", "text": "Superior side-channel analysis techniques, especially those grounded in deep learning, have been successful in breaching higher-order masked implementations, first-order masked and shuffled software implementations of CRYSTALSKyber on a first-order masked and shuffled implementation of Saber on a hardware ARM Cortex-M4."}, {"title": "Bài", "text": "Investigating CRYSTALS-Kyber Vulnerabilities - Attack Analysis and Mitigation"}, {"title": "Đoạn gốc (trang 2)", "text": "despite their theoretical security. Superior side-channel analysis techniques, especially\nthose grounded in deep learning, have been successful in breaching higher-order masked\nimplementations, first-order masked and shuffled software implementations of CRYSTALSKyber on a first-order masked and shuffled implementation of Saber on a hardware ARM\nCortex-M4. As a result of the discovery of these vulnerabilities, better defenses against\nside-channel attacks have been created, and CRYSTALS-Kyber implementations after them\nhave improved.\nEvaluating the resilience of CRYSTALS-Kyber implementations against side-channel\nattacks is crucial in light of the vulnerabilities that have been proven. Side-channel attacks\ntake advantage of data gathered via non-primary, physically observable channels, including the timing or power usage of the device executing the application. The security of\ncryptographic implementations is seriously threatened by these assaults."}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q251", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the key exchange time in milliseconds for the Hybrid (ECDHE + Kyber-768) method?"}, {"title": "Đáp án chuẩn", "text": "3.5"}, {"title": "Bài", "text": "The-Quantum-Security-Deadline"}, {"title": "Đoạn gốc (trang 13)", "text": "European Journal of Computer Science and Information Technology, 13(52),35-52, 2025 \n \n \n Print ISSN: 2054-0957 (Print) \n Online ISSN: 2054-0965 (Online) \n Website: https://www.eajournals.org/ \n Publication of the European Centre for Research Training and Development -UK \n47 \n \nHybrid testing ensures that PQC algorithms such as CRYSTALS-Kyber (key exchange) and \nDilithium (signatures) integrate seamlessly with existing TLS, SSH, and VPN infrastructures. \nA sample Hybrid Pilot Evaluation Table is shown below: \n \n \n \n \nParameter \nClassical \nRSA-2048 \nHybrid (ECDHE + \nKyber-768) \nFull PQC \n(Kyber-1024) \nKey Exchange Time \n(ms) \n2.1 \n2.7 \n3.5 \nHandshake Size \n(KB) \n1.2 \n1.6 \n2.3 \nSecurity Level (bits) \n112 \n192 \n256 \nBackward \nCompatibility \nHigh \nHigh \nModerate \n \nResults typically show minor increases in handshake size and latency, offset by significantly \nenhanced forward-security guarantees. Once validated, hybrid cryptography is extended to"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q252", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What does the Privacy Condition limit in the context of QKD?"}, {"title": "Đáp án chuẩn", "text": "Limits Eve’s knowledge about the key using the trace distance bound."}, {"title": "Bài", "text": "QUANTUM KEY DISTRIBUTION - Bridging Theoretical Security Proofs, Practical Attacks, and Error Correction"}, {"title": "Đoạn gốc (trang 19)", "text": "A PREPRINT - NOVEMBER 26, 2025\n• Equality-and-Uniformity: The shared key is both identical and uniformly random:\nX\nm\nPr(M = m)∥p(m)\nideal −p(m)\nqkd ∥1 ≤µ1.\n(47)\n• Privacy Condition: Limits Eve’s knowledge about the key using the trace distance bound.\nThe authors further use the singlet fidelity F to bound the difference between the real and ideal key states,\n1\n2\n\r\rρqkd −ρideal\n\r\r\n1 ≤\n√\n1 −F.\n(48)\nThe framework establishes that protocols like BB84 satisfy composable security, ensuring that the generated\nkeys remain secure and usable, even in adversarial scenarios or when combined with other cryptographic\nsystems. This provides a rigorous and general mathematical foundation for QKD security. Finally, to\naddress implementation side-channels (e.g., detector control, LO tampering) that ideal proofs do not model,\nmeasurement-device-independent and device-independent variants certify secrecy from either an untrusted"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q253", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What type of errors are caused by incorrectly applied gates in a quantum system?"}, {"title": "Đáp án chuẩn", "text": "Coherent quantum errors: In simpler words, these errors refer to errors that occur because of incorrectly applied gates."}, {"title": "Bài", "text": "QUANTUM KEY DISTRIBUTION - Bridging Theoretical Security Proofs, Practical Attacks, and Error Correction"}, {"title": "Đoạn gốc (trang 22)", "text": "A PREPRINT - NOVEMBER 26, 2025\n5\nQuantum Error Correction Codes\nQuantum error correction (QEC) is mainly based on classical coding theory; however, several important things must be\nconsidered to make it quantum analogous. The discussion of QEC requires a brief outline of the sources of erro y a number of layers. Each layer consists of a parallel application of single qubit rotations to all qubits, given by RP (θ) where\nP ∈{X, Y, Z} is chosen with uniform probability and\nθ ∈[0, 2π) is also chosen uniformly.\nThis layer is followed by a layer of 1D nearest neighbor controlled phase\ngates, as in Figure 2. Thus, the number of angles is the\nnumber of qubits times the number of layers.\nThe objective operator H is chosen to be a single"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q255", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What vulnerability was found in the reference implementation of Kyber512, and what can be compromised by employing the selected ciphertext?"}, {"title": "Đáp án chuẩn", "text": "The reference implementation of Kyber512 is susceptible to side-channel attacks, and additional functions can be compromised by employing the selected ciphertext, allowing real-time recovery of the entire secret key."}, {"title": "Bài", "text": "Investigating CRYSTALS-Kyber Vulnerabilities - Attack Analysis and Mitigation"}, {"title": "Đoạn gốc (trang 1)", "text": "Abstract: Significant advancements have been achieved in the field of quantum computing in recent\nyears. If somebody ever creates a sufficiently strong quantum computer, many of the public-key\ncryptosystems in use today might be compromised. Kyber is a post-quantum encryption technique\nthat depends on lattice problem hardness, and it was recently standardized. Despite extensive\ntesting by the National Institute of Standards and Technology (NIST), new investigations have\ndemonstrated the effectiveness of CRYSTALS-Kyber attacks and their applicability in non-controlled\nenvironments. We investigated CRYSTALS-Kyber’s susceptibility to side-channel attacks. In the\nreference implementation of Kyber512, additional functions can be compromised by employing const save = () => { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} };

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [a, v] of Object.entries(attrs)) {
    if (a === "class") e.className = v; else if (a.startsWith("on")) e.addEventListener(a.slice(2), v); else e.setAttribute(a, v);
  }
  for (const x of kids) e.append(x);
  return e;
}
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 2200); }
function caseStatus(code) {
  const its = items.filter(i => i.code === code);
  const done = its.filter(i => state.labels[k(i.code, i.key)] !== undefined).length;
  return done === its.length ? "done" : done ? "partial" : "";
}
function progress() {
  const done = items.filter(i => state.labels[k(i.code, i.key)] !== undefined).length;
  document.getElementById("bar").style.width = (100 * done / items.length) + "%";
  document.getElementById("ptext").textContent =
    `${done}/${items.length} ô · ${DATA.cases.filter(c => caseStatus(c.code) === "done").length}/${DATA.cases.length} mục xong`;
}
function renderNav() {
  const ol = document.getElementById("nav"); ol.replaceChildren();
  DATA.cases.forEach((c, i) => ol.append(el("li", {}, el("button", {
    class: [caseStatus(c.code), i === state.current ? "current" : ""].join(" "),
    "aria-current": i === state.current ? "true" : "false", onclick: () => go(i)}, c.code))));
}
function labelRow(code, it) {
  const key = k(code, it.key), v = state.labels[key];
  const box = el("div", {class: "label" + (v !== undefined ? " set" : "")});
  const note = el("input", {type: "text", placeholder: "Ghi chú (không bắt buộc)", value: state.notes[key] || ""});
  note.addEventListener("change", () => { state.notes[key] = note.value; save(); });
  box.append(el("span", {class: "q"}, it.prompt),
    ...it.options.map(([val, txt, cls]) => el("button", {class: cls || "", "aria-pressed": String(v === val),
      onclick: () => { state.labels[key] = val; save(); refresh(); }}, txt)), note);
  return box;
}
function renderCase() {
  const c = DATA.cases[state.current], root = document.getElementById("case"), y = window.scrollY;
  root.replaceChildren(el("div", {class: "card"}, el("div", {class: "qhead"}, el("h2", {}, c.code + (c.title ? " · " + c.title : "")),
    el("span", {class: "hint"}, `Mục ${state.current + 1}/${DATA.cases.length}`))));
  let card = null, group = null;
  for (const it of c.blocks) {
    if (!it.key) {
      root.append(el("div", {class: "card" + (it.kind ? " " + it.kind : "")}, el("h2", {}, it.title), el("p", {}, it.text)));
      card = null; continue;
    }
    if (!card || it.group !== group) {
      group = it.group; card = el("div", {class: "card"}, ...(group ? [el("h2", {}, group)] : [])); root.append(card);
    }
    if (it.text) card.append(el("p", {class: "claim"}, it.text));
    card.append(labelRow(c.code, it));
  }
  window.scrollTo(0, y);
}
function refresh() { renderNav(); progress(); renderCase(); }
function go(i) { state.current = Math.max(0, Math.min(DATA.cases.length - 1, i)); save(); refresh(); window.scrollTo(0, 0); }
document.getElementById("prev").onclick = () => go(state.current - 1);
document.getElementById("next").onclick = () => go(state.current + 1);
document.getElementById("next-todo").onclick = () => {
  const n = DATA.cases.length;
  for (let s = 1; s <= n; s++) { const i = (state.current + s) % n; if (caseStatus(DATA.cases[i].code) !== "done") return go(i); }
  if (caseStatus(DATA.cases[state.current].code) !== "done") return go(state.current);
  toast("Đã chấm xong toàn bộ, hãy bấm Xuất JSON.");
};
document.getElementById("export").onclick = () => {
  const labels = items.map(i => ({code: i.code, key: i.key, label: state.labels[k(i.code, i.key)] ?? null,
                                  note: state.notes[k(i.code, i.key)] || ""}));
  const done = labels.filter(l => l.label !== null).length;
  if (done < labels.length && !confirm(`Còn ${labels.length - done} ô chưa chấm. Vẫn xuất (để lưu tạm)?`)) return;
  const out = {sheet_id: DATA.sheet_id, exported_at: new Date().toISOString(), n_total: labels.length, n_done: done, labels};
  const a = el("a", {href: URL.createObjectURL(new Blob([JSON.stringify(out, null, 1)], {type: "application/json"})),
                     download: DATA.file || "human_labels.json"});
  document.body.append(a); a.click(); a.remove();
  toast(`Đã xuất ${done}/${labels.length} ô`);
};
document.getElementById("import").onchange = async (ev) => {
  const f = ev.target.files[0]; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (d.sheet_id !== DATA.sheet_id) { toast("File JSON không khớp phiếu này (sheet_id khác)."); return; }
    const valid = new Map(items.map(i => [k(i.code, i.key), new Set(i.options.map(o => o[0]))]));
    for (const l of d.labels) { const key = k(l.code, l.key);
      if (valid.get(key)?.has(l.label)) state.labels[key] = l.label; if (l.note) state.notes[key] = l.note; }
    save(); refresh(); toast(`Đã nhập ${d.labels.filter(l => l.label !== null).length} ô.`);
  } catch (e) { toast("Không đọc được file JSON."); }
  ev.target.value = "";
};
document.getElementById("guide-list").append(...DATA.guide.flatMap(([t, d]) => [el("dt", {}, t), el("dd", {}, d)]));
if (!Object.keys(state.labels).length) document.getElementById("guide").open = true;
refresh();
</script>
</body>
</html>
