istribution Networks -- Key Management - A Survey"}, {"title": "Đoạn gốc (trang 26)", "text": "Quantum Key Distribution Networks – Key Management: A Survey\nA PREPRINT\n• Effective key storage approaches: The key manager is required to effectively manage cryptographic keys,\nwhich includes key storage and formatting. It is critical that keys are stored in a manner that allows for efficient\nkey addition and retrieval. Key formatting should also be supported and performed efficiently on demand\nbecause the application in critical infrastructures requires a minimum delay in key supply. There are no\nstudies analyzing the effectiveness of key storage designs, nor are there detailed approaches to effective key\nformatting.\n• Effective resource sharing and quality of service support: With the growing push for enterprise integration\nof QKD networks, it’s anticipated that a large number of users, i.e., cryptographic applications, will need to\nshare limited key resources. The key manager must prioritize applications of varying backgrounds and even"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q084", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What does the UK National Cyber Security Centre (NCSC) advise regarding PQ/T hybrid schemes during the migration to fully post-quantum infrastructures?"}, {"title": "Đáp án chuẩn", "text": "\"PQ/T hybrid\" schemes should serve as temporary safeguards on the path to fully post-quantum infrastructures."}, {"title": "Bài", "text": "Harvest-Now, Decrypt-Later - A Temporal Cybersecurity Risk in the Quantum Transition"}, {"title": "Đoạn gốc (trang 5)", "text": "transition planning, and long-term security governance [27].\n2.4. PQC Implementation, Hybrid Encryption, and Key Management in Practice\nTranslating PQC from theory into deployed systems presents practical and architectural challenges. A leading mitigation is the adoption of hybrid encryption, which combines\nclassical and quantum-resistant algorithms to achieve transitional resilience. In such deployments, a TLS handshake or X.509 certificate includes both ECC and PQC public keys,\nensuring that an adversary must compromise both algorithms to decrypt traffic [19,28].\nThis dual-layer approach provides immediate protection against zero-day vulnerabilities\nin emerging PQC primitives while standards mature.\nMultiple agencies recommend hybrid or crypto-agile deployment during migration.\nThe UK National Cyber Security Centre (NCSC) advises that “PQ/T hybrid” schemes\nshould serve as temporary safeguards on the path to fully post-quantum infrastructures [14]."}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q085", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is Quantum Machine Learning (QML) and how is it expected to impact various sectors?"}, {"title": "Đáp án chuẩn", "text": "Quantum Machine Learning (QML) represents a cutting-edge fusion of quantum computing and machine learning, promising to revolutionize various sectors by leveraging the unique properties of quantum mechanics."}, {"title": "Bài", "text": "Quantum_Machine_Learning_A_Survey"}, {"title": "Đoạn gốc (trang 2)", "text": "transitions more efficiently and accurately. Clustering and classification remain key aspects of data analysis, with \ntraditional methods often insufficient to handle the complexities of multidimensional datasets. Optimizing the \nperformance and resource utilization of quantum circuits is another area of interest, with the inherent fragility and \ncomplexity of quantum systems necessitating efficient utilization of quantum resources. Quantum machine \nlearning techniques are being explored to address these challenges, integrating quantum computing mechanisms \ninto supervised machine learning models. \nII. LITERATURE SURVVEY \nQuantum Machine Learning (QML) represents a cutting-edge fusion of quantum computing and machine learning, \npromising to revolutionize various sectors by leveraging the unique properties of quantum mechanics. Recent \nsurveys in this field have highlighted the rapid advancements and potential applications of QML across diverse"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q086", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the complementary false positive of the key coefficient 2280 in the context of the attack on Kyber, and what is its value?"}, {"title": "Đáp án chuẩn", "text": "The complementary false positive of the key coefficient 2280 is 1049 (equal to 3329−2280)."}, {"title": "Bài", "text": "An Improved Two-Step Attack on Lattice-Based Cryptography - A Case Study of Kyber"}, {"title": "Đoạn gốc (trang 4)", "text": "key 2280 and its complementary false positive 1049 (equal to\n3329−2280), which is a general phenomenon. In addition, as\nthe number of power traces decreases, the attacker would run\ninto some problems because both the correct coefficient s0 and\nits complementary value q−s0 would have high and close PCC\nvalues, as the HW(s0) and HW(q −s0) are highly correlated.\nTo escape such false positive, we have modified the leakage\nmodel as described in Section III-A. The correspondence\nbetween the PCC values of the correct key coefficient and the\nfalse positive one is shown in Fig. 2 (d). It is observed that the\npositive peak value corresponds to the correct key coefficient\nand the negative peak value of PCC corresponds to the false\npositive one. Consequently, to avoid the false positive being\nselected, we should focus solely on the positive peak value of\nPCC. We briefly explain this phenomenon as follows: Let s0 be\nthe correct one, and s′\n0 = 3329 −s0 be the coy state idea proposed by Hwang?"}, {"title": "Đáp án chuẩn", "text": "The key point of the decoy state idea is that Alice prepares a set of additional states—decoy states, in addition to standard BB84 states. Those decoy states are used for the purpose of detecting eavesdropping attacks only, whereas the standard BB84 states are used for key generation only."}, {"title": "Bài", "text": "Decoy State Quantum Key Distribution"}, {"title": "Đoạn gốc (trang 1)", "text": "method for the ﬁrst time makes most of the long distance\nQKD experiments reported in the literature unconditionally secure. Our method has the advantage that it can be\nimplemented with essentially the current hardware. So,\nunlike prior art solutions based on single-photon sources,\nour method does not require daunting experimental developments. Our method is based on the decoy state idea\nﬁrst proposed by Hwang [12]. While the idea of Hwang\nwas highly innovative, his security analysis was heuristic. The key point of the decoy state idea is that Alice\nprepares a set of additional states—decoy states, in addition to standard BB84 states. Those decoy states are\nused for the purpose of detecting eavesdropping attacks\nonly, whereas the standard BB84 states are used for key\ngeneration only. The only diﬀerence between the decoy\nstate and the standard BB84 states is their intensities\n(i.e., their photon number distributions).\nBy measuring the yields and QBER of decoy states, we"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q089", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the key size disadvantage of code-based cryptosystems and why does it make them challenging to implement in resource-constrained IoT devices?"}, {"title": "Đáp án chuẩn", "text": "Code-based cryptosystems have a significant key size disadvantage, which makes them challenging to implement in resource-constrained IoT devices."}, {"title": "Bài", "text": "Post-Quantum_Blockchain_Security_for_the_Internet_of_Things_Survey_and_Research_Directions"}, {"title": "Đoạn gốc (trang 4)", "text": "it resistant to these computers. It has been well studied and\nanalyzed over the last 40 years, which attests to the excellent\nsecurity of this type of cryptosystem. However, code-based\ncryptosystems have a signiﬁcant key size disadvantage, which\nmakes them challenging to implement in resource-constrained\nIoT devices. Therefore, various plans have been proposed to\nreduce the key length in code-based cryptosystems. For example, Niederreiter [38], as a McEliece variant, was proposed to\nalleviate the key length problem to some extent.\n2) Hash-Based Cryptosystems: The hash-based cryptosystem, which was initially described by Lamport in the 1970s,\nis a speciﬁc kind of post-quantum cryptosystem that is used\nonly for digital signatures [39]. The Merkle Signature Scheme\n(MSS) [40] is another well-known hash-based scheme that\ncombines one-time signature schemes using a tree structure.\nThe security of hash-based schemes, unlike other cryptosystems that are based on certain mathematical problems,"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q090", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the role of Quantum Key Distribution (QKD) in providing security?"}, {"title": "Đáp án chuẩn", "text": "Quantum Key Distribution (QKD) utilizes quantum mechanics to provide information-theoretic security [7, 8]."}, {"title": "Bài", "text": "QUANTUM KEY DISTRIBUTION - Bridging Theoretical Security Proofs, Practical Attacks, and Error Correction"}, {"title": "Đoạn gốc (trang 3)", "text": "via QECCs is the only practical path to long-distance, high-fidelity entanglement and the low logical error\nthresholds these protocols demand.\nThroughout this review, we will explore some of the experiments conducted in recent times that focus on several attacks\nthat compromise both the security and quality of transmission. We also review fundamental formulation and recent\nworks on QECCs, as these are integral to the discussion of secure transmission in a noisy quantum channel, as also\ndiscussed in [15].\n2\nQuantum Key Distribution\nQuantum Key Distribution (QKD) utilizes quantum mechanics to provide information-theoretic security [7, 8]. Alice\nand Bob exchange quantum states over an unauthenticated channel and then use an authenticated classical channel\nto reconcile their measurements. Any attempt by Eve to intercept these states inevitably disturbs them, raising the\nobserved error rate; if it exceeds a threshold, the key is discarded and the protocol restarts. Because QKD’s security"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q091", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What percentage of companies have a quantum-safe crypto strategy according to the research?"}, {"title": "Đáp án chuẩn", "text": "Key indicators like the proportion of companies with a quantum-safe crypto strategy (5%) [56]"}, {"title": "Bài", "text": "Are Enterprises Ready for Quantum-Safe Cybersecurity"}, {"title": "Đoạn gốc (trang 19)", "text": "tools. In other words, the technology has (or shortly will) reach enterprise-grade maturity, but\nenterprise utilization is lagging.\nFrom the enterprise readiness perspective, our research indicates that most organizations are\nnot ready if a sudden quantum threat were to materialize. Key indicators like the proportion of\ncompanies with a quantum-safe crypto strategy ( 5%) [56] or those planning budget in the next\n1–2 years ( 20–40% among early adopters in best-case sectors [59]) show that preparedness is\nmore the exception than the norm. Many enterprises are in a state of quantum complacency,\nconsciously or unconsciously betting that they can afford to wait. This is a precarious position,\nespecially for organizations holding long-lived sensitive data (which might already be targeted\nby adversaries). The enterprise segment that is relatively more ready – e.g., some big banks,\ntelecoms, government contractors – demonstrates that readiness is achievable with top-down"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q092", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What phenomenon makes high-dimensional data in quantum machine learning applications particularly sensitive to minor perturbations?"}, {"title": "Đáp án chuẩn", "text": "This issue relates to the concentration of measure phenomenon, where high-dimensional data clusters tightly in a small region, increasing sensitivity to minor perturbations."}, {"title": "Bài", "text": "Quantum Machine Learning for 6G Network"}, {"title": "Đoạn gốc (trang 6)", "text": "could quantify how robustness enhancements affect quantum\nmodels’ generalization in tasks like state discrimination and\nprocess learning. Understanding this trade-off is crucial for\ndesigning balanced quantum learning algorithms and ensuring\ntheir feasibility in real-world applications. This line of investigation could provide fundamental insights into the limitations\nand possibilities of quantum adversarial learning, shaping\nfuture research and applications.\nChallenge 3: Quantum state discrimination and the concentration of measure phenomenon. Adversarial examples\nappear to be a fundamental challenge in quantum machine\nlearning applications involving high-dimensional spaces. This\nissue relates to the concentration of measure phenomenon,\nwhere high-dimensional data clusters tightly in a small region,\nincreasing sensitivity to minor perturbations. Co  nature of quantum technologies, have also been raised."}, {"title": "Bài", "text": "Quantum Machine Learning for Cybersecurity"}, {"title": "Đoạn gốc (trang 11)", "text": "cost, and robustness. A summary of future directions of research\ndiscussed above have been provided in Figure 5.\nVIII. LIMITATIONS\nWhile QML is promising for cybersecurity, its deployment in\nthe real world is hindered by several practical and fundamental\nobstacles. As per current works, the technology is still\nin a formative stage. This is true for both the quantum\nhardware as well as the algorithmic frameworks around it,\nhindering its scalability, dependability and adoption. The testing\nin operational environments has been very limited. Noisy\nIntermediate-Scale Quantum (NISQ) hardware restrictions\nand training inefficiencies introduce further complications.\nSome additional concern,s such as lack of interpretability,\nhigh costs, unclear regulatory standards, and the dual-use\nnature of quantum technologies, have also been raised in\nthe course of shifting from research prototypes to full-scale\ndeployments. These limitations have been discussed in detail\nin the subsections that follow."}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q096", "title": "multi-hop", "blocks": [{"title": "Câu hỏi", "text": "How does SPHINCS+ compare to X25519 in terms of public key size and computational efficiency, and what is the impact of increasing key size on traditional cryptographic algorithms like RSA according to the passages?"}, {"title": "Đáp án chuẩn", "text": "SPHINCS+ has a minimal public key size of just 32 bytes, making it appealing for certain use cases, while X25519 is a classical cryptographic mechanism. Increasing the key size from 1024 bit to 2048 bit and 4096 bit in traditional cryptographic algorithms like RSA has an adverse effect on computation cost and results in significant overhead, as mentioned in the passage from Paper B."}, {"title": "Bài A", "text": "A Comparative Study of Classical and Post-Quantum Cryptographic Algorithms in the Era of Quantum Computing"}, {"title": "Đoạn của bài A", "text": "8 to 30 kilobytes, and the scheme is computationally intensive, both for key\ngeneration and signing. However, its minimal public key size of just 32 bytes\nmakes it appealing for certain use cases. SPHINCS+ is particularly attractive\nwhere trust in hash-based security is prioritized above computational efficiency.\n3.6\nHybrid and Migration Strategies\nGiven the uncertainty surrounding the timeline for the development of largescale quantum computers, the adoption of hybrid cryptographic approaches\nhas gained momentum. These strategies combine classical and post-quantum\nmechanisms to maintain backward compatibility while introducing resistance\nto quantum threats. Real-world experiments, such as Google’s CECPQ2 and\nCloudflare’s deployments of post-quantum TLS, have already demonstrated the\nfeasibility of using hybrid key exchanges. Notably, combinations like X25519"}, {"title": "Bài B", "text": "A_Comprehensive_Survey_on_Pre_Versus_Post_Quantum_Security_Schemes_for_5G-Enabled_IoT_Applications"}, {"title": "Đoạn của bài B", "text": "with lightweight operations, error correction, identity-based\nencryption, and physical-layer implementations—offering\nscalable, secure communication solutions for increasingly\ninterconnected IoT ecosystems.\nTable 9 summarizes the advances in Secret Sharing\nSchemes.\nVII. POST-QUANTUM PUBLIC KEY CRYPTOGRAPHY\nPublic key cryptography is an essential aspect of computer,\nnetwork, and IoT security. However, recent advancements in\ncomputing technology pose threats to traditional cryptography. For instance, in 2010, the 1024 bit RSA implementation\nwas broken [144]. This has necessitated a substantial increase\nin the key size from 1024 bit to 2048 bit and 4096 bit [145].\nIncreasing the key size has an adverse effect on the\ncomputation cost and results in significant overhead.\nThe advent of super-fast quantum computers further\nchallenged security measures. A quantum computer can now\nsolve factorization problems that take classical computers"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q097", "title": "multi-hop", "blocks": [{"title": "Câu hỏi", "text": "How can post-quantum cryptography in federated learning mitigate the vulnerabilities introduced by quantum superposition and parallelism in quantum federated learning, and what are the implications for secure 6G network services?"}, {"title": "Đáp án chuẩn", "text": "Post-quantum cryptography, such as homomorphic encryption and PQ encryption, can be used in federated setups to mitigate the vulnerabilities introduced by quantum superposition and parallelism in quantum federated learning. These cryptographic techniques ensure secure model aggregation and protect against attacks during training or channel inference, which are crucial for reliable distributed services in 6G networks. However, the use of quantum techniques in forensics and cybersecurity must also consider the potential new risks, such as the sensitivity of quantum states to environmental noise."}, {"title": "Bài A", "text": "Next-Generation Quantum Security - The Impact of Quantum Computing on Cybersecurity—Threats, Mitigations, and Solutions"}, {"title": "Đoạn của bài A", "text": "quantum algorithms.\nUse quantum-resilient \ncommunication protocols.\nWhat trade-offs exist between PQ \nsecurity and performance?\n \n Autonomous systems\nEncrypted V2X/drone channels at \nrisk from quantum decryption.\nAdopt PQ encryption for real-time \nvehicle communication.\nCan PQ crypto ensure low-latency \nsecure operation?\n \n Federated learning\nModel aggregation may be \nattacked via quantum means.\nUse homomorphic and PQ \nencryption in federated setups.\nWhat makes PQ federated \nlearning scalable and efficient?\n \n Forensic tools\nQuantum tools may compromise \nencrypted evidence.\nSecure tools using PQ techniques \nto protect investigations.\nHow can forensics use quantum \nsafely without new risks?\n \n National frameworks\nQuantum power in adversarial \nnations risks global crypto.\nPromote global PQ cryptography \nstandards and cooperation.\nHow to create ethical quantum \ngovernance frameworks?\n \n Distributed quantum \nsystems\nIncreased quantum power could \naid offense/defense."}, {"title": "Bài B", "text": "Quantum Machine Learning for 6G Network"}, {"title": "Đoạn của bài B", "text": "vulnerability transitioning from classical federated learning\nto quantum federated learning introduces new attack vectors\nthat exploit quantum superposition and parallelism. Identifying\nvulnerabilities and developing secure collaborative learning\nmechanisms are crucial for reliable distributed services. Key\nareas include post-quantum blockchain, distributed ledgers,\nand quantum physical unclonable functions for end-to-end\ndevices.\n3. Exploring vulnerabilities and defenses in quantum\nsemantic communications. Quantum semantic communications, which leverage quantum mechanics to enhance the\ntransmission and interpretation of meaning in data, present\na new method to meet the demands of 6G networks. A key\nvulnerability is quantum states’ sensitivity to environmental\nnoise in entanglement and superposition during qubit encoding\n(as illustrated in Fig. 6). Semantic encoding in QML models\nis vulnerable to attacks during training or channel inference."}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q098", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What cryptographic systems are discussed for ensuring cloud security in the context of quantum-resistant solutions?"}, {"title": "Đáp án chuẩn", "text": "Post-quantum encryption for cloud data is mentioned as a tailored quantum-resistant solution for cloud security."}, {"title": "Bài", "text": "Next-Generation Quantum Security - The Impact of Quantum Computing on Cybersecurity—Threats, Mitigations, and Solutions"}, {"title": "Đoạn gốc (trang 4)", "text": "signatures (e.g., XMSS). Our discussion includes their mathematical foundations, security guarantees, and practical implementation challenges.\n• Quantum Key Distribution (QKD) and Hybrid Systems: We evaluate QKD as a secure key exchange mechanism leveraging \nquantum mechanics, emphasizing its resistance to eavesdropping. Additionally, we propose hybrid cryptographic systems that \ncombine classical and quantum-resistant algorithms to facilitate a seamless transition to post-quantum security.\n• Application-Specific Solutions: We address the impact of quantum computing on critical domains such as cloud security, blockchain, IoT, and edge computing. For each domain, we outline tailored quantum-resistant solutions, including \npost-quantum encryption for cloud data, quantum-safe blockchain protocols, and lightweight PQC algorithms for resourceconstrained IoT devices.\n• Future Directions and Challenges: We identify open research questions and practical hurdles in deploying quantum-resistant"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q099", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the bit length of primes in P according to the prime number theorem?"}, {"title": "Đáp án chuẩn", "text": "ℓ= Θ(log log L)"}, {"title": "Bài", "text": "How to factor 2048 bit RSA integers with less than a million noisy qubits"}, {"title": "Đoạn gốc (trang 4)", "text": "ab\n(a ≫b) mod 2\nAccess bit (or qubit) b within integer (or quint) a.\na & b\nP\nk akbk ≪k\nBitwise AND of a and b.\nMultiplicativeInversea(b)\nb−1 (mod a)\nMultiplicative inverse of b modulo a.\nTable 1: Various bits of mostly-Python-inspired notation used in this paper.\n∀p ∈P : (len p = ℓ) ∧IsPrime(p)\n(2)\nA simple way to do arithmetic on a value modulo L is to store the value as a 2s complement\ninteger in a len L bit register, and when operating on this register add or subtract multiples of L\nas appropriate to keep it in the range [0, L). This requires Ω(log L) bits of storage.\nResidue arithmetic performs addition and multiplication modulo L by separately performing\nthe operations modulo each of the primes from P. The final result can then be recovered using the\nChinese remainder theorem. By the prime number theorem, P can be chosen so that the bit length\nof primes in P is ℓ= Θ(log log L). Therefore, using residue arithmetic introduces the possibility of"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q100", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What are the two possible preparations in the post-measurement phase of CV-QKD, and how does sifting help in this process?"}, {"title": "Đáp án chuẩn", "text": "There are two possible preparations: choosing the basis for the construction of the protocol (similar to BB84). This requires sifting as it eliminates any uncorrelated qubits. In some forms of CV-QKD, both Alice and Bob use both bases simultaneously, which removes the need for sifting [28]."}, {"title": "Bài", "text": "QUANTUM KEY DISTRIBUTION - Bridging Theoretical Security Proofs, Practical Attacks, and Error Correction"}, {"title": "Đoạn gốc (trang 6)", "text": "component randomly at a time or can measure both quadrature components simultaneously (“no-switching\nprotocol\") [29]. Bob can use either of the measurement techniques (homodyne or heterodyne) to measure the\neigenvalue of either or both quadrature operators.\n(iii) Post-Measurement:\n• Sifting: There are two possible preparations: choosing the basis for the construction of the protocol\n(similar to BB84). This requires sifting as it eliminates any uncorrelated qubits. In some forms of\nCV-QKD, both Alice and Bob use both bases simultaneously, which removes the need for sifting [28].\n• Parameter Estimation: After sifting, Alice and Bob share a subsection of the data that was sent to Bob\nand their corresponding measurements. This helps them estimate the amount of noise in the channel,\nwhich also helps to compute the mutual information, IAB, and a bound on the eavesdropper’s information,\nχ [28]."}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q101", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the probability of obtaining r using the described states?"}, {"title": "Đáp án chuẩn", "text": "Since each of these states occurs with probability at least 1/3r2, we obtain r with probability at least φ(r)/3r."}, {"title": "Bài", "text": "Polynomial-Time Algorithms for Prime Factorization and Discrete Logarithms on a Quantum Computer"}, {"title": "Đoạn gốc (trang 19)", "text": "to r, where φ is Euler’s totient function [Knuth 1981, Hardy and Wright 1979, §5.5].\nEach of these fractions d/r is close to one fraction c/q with |c/q −d/r| ≤1/2q. There\nare also r possible values for xk, since r is the order of x. Thus, there are rφ(r) states\n\f\fc, xk (mod n)\n\u000b\nwhich would enable us to obtain r. Since each of these states occurs\nwith probability at least 1/3r2, we obtain r with probability at least φ(r)/3r. Using\nthe theorem that φ(r)/r > δ/ log log r for some constant δ [Hardy and Wright 1979,\nTheorem 328], this shows that we ﬁnd r at least a δ/ log log r fraction of the time, so by\nrepeating this experiment only O(log log r) times, we are assured of a high probability\nof success.\nIn practice, assuming that quantum computation is more expensive than classical\ncomputation, it would be worthwhile to alter the above algorithm so as to perform less\nquantum computation and more postprocessing. First, if the observed state is |c⟩, it"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q102", "title": "multi-hop", "blocks": [{"title": "Câu hỏi", "text": "How does the cryptanalytic attack on SIKE, which utilizes advanced genus theory and the 'glue-and-split' theorem, compare to the threat posed by Shor’s algorithm to classical public-key systems like RSA and ECC, in terms of the computational resources required for each to break the respective cryptographic schemes?"}, {"title": "Đáp án chuẩn", "text": "The cryptanalytic attack on SIKE, which leverages advanced mathematical techniques, required approximately one hour on standard hardware to break the scheme. In contrast, Shor’s algorithm, which can efficiently solve the problems underlying RSA, ECC, and Diffie–Hellman, poses a more severe threat as it can break these classical public-key systems with a sufficiently powerful Cryptographically Relevant Quantum Computer (CRQC), potentially rendering current encryption and digital signature schemes obsolete."}, {"title": "Bài A", "text": "Post-Quantum Cryptography and Quantum-Safe Security"}, {"title": "Đoạn của bài A", "text": "in approximately one hour on standard hardware through mathematical techniques that do not\nrequire quantum computation.\nSIKE initially appeared to be a highly promising PQC candidate because of its exceptionally\nsmall key sizes, with public keys remaining under 600 bytes even at strong security levels [68]. Its\nefficiency in bandwidth consumption, coupled with security assumptions rooted in the hardness\nof computing isogenies between supersingular elliptic curves, positioned it as one of the leading\ncontenders during the NIST post-quantum standardization process.\nThe eventual cryptanalytic attack on SIKE showcased striking mathematical depth, drawing on\nadvanced genus theory and the little-known \"glue-and-split\" theorem [92]. This result underscored\nhow powerful breakthroughs can arise from unexpected areas of mathematics, revealing vulnerabilities that had not been captured in the original security analysis of isogeny-based cryptography."}, {"title": "Bài B", "text": "The-Quantum-Security-Deadline"}, {"title": "Đoạn của bài B", "text": "European Journal of Computer Science and Information Technology, 13(52),35-52, 2025 \n \n \n Print ISSN: 2054-0957 (Print) \n Online ISSN: 2054-0965 (Online) \n Website: https://www.eajournals.org/ \n Publication of the European Centre for Research Training and Development -UK \n36 \n \nfoundation of modern cryptography. Classical public-key systems—such as RSA, ECC, and \nDiffie–Hellman—depend on the computational hardness of integer factorization and discrete \nlogarithms. \nHowever, \nShor’s \nalgorithm \ndemonstrates \nthat \na \nsufficiently \npowerful \nCryptographically Relevant Quantum Computer (CRQC) can efficiently solve these problems, \nrendering most current encryption and digital signature schemes obsolete (Mosca, 2021; NIST, \n2022). \n \nThe risk is not hypothetical. Intelligence agencies, research institutions, and adversarial state actors \nare actively investing in quantum technologies, making the timeline to cryptographic vulnerability"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q103", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the potential impact of the intersection of quantum computing and machine learning on sectors like medical imaging and quantum cryptography?"}, {"title": "Đáp án chuẩn", "text": "The intersection of quantum computing and machine learning has the potential to revolutionize various sectors, including medical imaging and quantum cryptography."}, {"title": "Bài", "text": "Quantum_Machine_Learning_A_Survey"}, {"title": "Đoạn gốc (trang 1)", "text": "Machine learning plays a crucial role in the Information Age, where data has become a valuable asset. With the \nability to process and analyze vast amounts of information, machine learning algorithms have transformed \nindustries by enabling predictive analytics, automated decision-making, and personalized user experiences. Deep \nlearning, a subset of machine learning, has taken this a step further by enabling systems to autonomously learn \ncomplex patterns, leading to advancements in areas like image recognition, natural language processing, and \nautonomous vehicles. The influence of machine learning is far-reaching, driving innovation and shaping the future \nof technology and society. \nThe intersection of quantum computing and machine learning has the potential to revolutionize various sectors, \nincluding medical imaging and quantum cryptography. Quantum Neural Networks (QNNs) are a testament to this,"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q104", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What technology is already being used to bolster cryptographic systems by providing truly unpredictable keys?"}, {"title": "Đáp án chuẩn", "text": "Quantum Random Number Generators (QRNGs) – a related technology – are already being used to bolster cryptographic systems by providing truly unpredictable keys."}, {"title": "Bài", "text": "Are Enterprises Ready for Quantum-Safe Cybersecurity"}, {"title": "Đoạn gốc (trang 7)", "text": "Notably, research continues to push QKD forward: efforts are underway to integrate QKD\nwith telecom networks (e.g., using wavelength-division multiplexing to send quantum and classical signals in the same fiber) [5], to improve distances via quantum repeaters (not yet practical,\nbut quantum memory and entanglement swapping might extend range without trusted nodes in\nthe future), and to develop standardized QKD protocols and certification criteria. Also, Quantum Random Number Generators (QRNGs) – a related technology – are already being used to\nbolster cryptographic systems by providing truly unpredictable keys, an example of quantum\ntechnology immediately useful within classical cryptography frameworks.\nIn summary, the technologist perspective finds that quantum-safe solutions are emerging\nfrom concept to reality. Post-quantum cryptography is at the forefront, with multiple algorithms\n7"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q105", "title": "multi-hop", "blocks": [{"title": "Câu hỏi", "text": "What are the gaps in the current security analyses of QKD protocols, and how do they relate to the evolution of key management approaches in QKD networks as discussed in the surveys?"}, {"title": "Đáp án chuẩn", "text": "The review in Paper B highlights significant limitations in existing QKD security analyses, particularly regarding the security proofs and practical attacks on quantum networks. Meanwhile, Paper A discusses the lack of a comprehensive system-view engineering perspective on QKD key management and the evolution of key manager approaches. These gaps in security analyses could be crucial for the development of more robust key management systems in QKD networks."}, {"title": "Bài A", "text": "Quantum Key Distribution Networks -- Key Management - A Survey"}, {"title": "Đoạn của bài A", "text": "fundamentals of QKD protocols and networking, discusses the integration of QKD in optical networks, and\nbriefly touches on standardization efforts.\nBased on the selected surveys, the narrowed list of research objectives discussed includes:\n• Analyzing QKD protocols and their implementations.\n• Examining the state-of-the-art advancements in QKD technology and network deployments.\n• Exploring real-world applications of QKD networks.\n• Summarizing standardization efforts related to QKD protocols and networks.\nA thorough examination of the literature, however, reveals the lack of a comprehensive system-view engineering\nperspective on QKD key management. To our knowledge, no references in the available literature thoroughly investigate\nthe approaches to addressing key management issues. Consequently, this survey offers a chronological overview of\nexisting approaches to the realization of key managers, unveiling the evolution of their functionality. This evolution"}, {"title": "Bài B", "text": "QUANTUM KEY DISTRIBUTION - Bridging Theoretical Security Proofs, Practical Attacks, and Error Correction"}, {"title": "Đoạn của bài B", "text": "not review the security proofs for the continuous-variable QKD protocol. Apart from this, the review work was done in\n2020, and there have been significant developments regarding different attacks on quantum networks. In another study,\nHorace et al., [11] explored the core information-theoretic security guarantees of cryptosystems and revealed significant\nlimitations in existing QKD security analyses. This work, too, does not explore experimental updates regarding the\nsecurity of QKD protocols. The main focus of this review is to fill this gap in some significant review works regarding\nthe security of QKD protocols, experimental works on attacks on QKD protocols, and error correction codes.\nThe focus of this review lies in both the theoretical and practical implementations, which are extremely necessary for\nthe development of global-scale quantum networks.\n1. There has been groundbreaking theoretical work on the security of quantum networks. However, most security"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q106", "title": "multi-hop", "blocks": [{"title": "Câu hỏi", "text": "What are the names of the three algorithms standardized by NIST in August 2024, and how do they compare to the conventional RSA method in terms of quantum resistance according to the passages?"}, {"title": "Đáp án chuẩn", "text": "NIST standardized three algorithms (designated FIPS 203, 204, 205) covering one key encapsulation mechanism (KEM) and two digital signature schemes in August 2024. These post-quantum algorithms are designed to be secure against quantum attacks, unlike the conventional RSA method, which could not be adequate to protect private data against quantum attacks according to the second passage."}, {"title": "Bài A", "text": "Are Enterprises Ready for Quantum-Safe Cybersecurity"}, {"title": "Đoạn của bài A", "text": "implementations like QKD. Key questions include: Have viable standards emerged? Are these\nsolutions commercially available and easily integrable?\nWhat technical limitations or open\nchallenges remain?\n2.1\nPost-Quantum Cryptography Standards and Performance\nThe most significant progress in quantum-resistant security has come from post-quantum cryptography [14]. Unlike quantum cryptography, PQC does not require exotic hardware; it consists\nof classical algorithms (for encryption, key exchange, and digital signatures) designed to be secure against quantum attacks [15, 16]. After a worldwide call and competition lasting since\n2016, NIST selected its first cohort of PQC algorithms for standardization in July 2022 [17]. By\nAugust 2024, NIST released the finalized standards for three algorithms (designated FIPS 203,\n204, 205) covering one key encapsulation mechanism (KEM) and two digital signature schemes.\nThe standardized algorithms are:"}, {"title": "Bài B", "text": "Investigating CRYSTALS-Kyber Vulnerabilities - Attack Analysis and Mitigation"}, {"title": "Đoạn của bài B", "text": "Cryptography 2024, 8, 15\n2 of 13\nAware of this difficulty, post-quantum cryptosystems that can safely and successfully\nwithstand quantum attacks must be developed and put into use [4,5]. With the development\nof quantum computing, conventional asymmetric methods like RSA could not be adequate\nto protect private data. The way that quantum technology is developing has prompted an\nongoing endeavor to design resilient post-quantum systems [6].\nThe National Institute of Standards and Technology (NIST) initiated the Post-Quantum\nCryptography Standardization Initiative (NIST PQC) in 2016 in response to the changing\nthreat scenario provided by quantum computers. NIST PQC’s main objective is to provide\nstrong cryptographic algorithm standards that can withstand attacks from quantum computers. The goal of the project is to secure sensitive data in the post-quantum computing age\nby requesting, assessing, and standardizing quantum-resistant cryptographic algorithms."}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q107", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What protocols developed by Gong et al. (2023) represent an advancement in quantum cryptography?"}, {"title": "Đáp án chuẩn", "text": "Multi-party semi-quantum private comparison (MQPC) protocols developed by Gong et al. (2023) represent an advancement in quantum cryptography in which the use of decoherence-free states (DFS) against collective noise multiparty can communicate in the presence of collective-dephasing noise and collective-rotation noise which affects the integrity of quantum communication."}, {"title": "Bài", "text": "Quantum key distribution through quantum machine learning - a research review"}, {"title": "Đoạn gốc (trang 5)", "text": "network\nchannels\nto\nﬁnd\nmany\napplications\nin\nquantum\ncommunication\nnetworks.\nMulti-party\nsemi-quantum\nprivate\ncomparison (MQPC) protocols developed by Gong et al. (2023)\nrepresent an advancement in quantum cryptography in which the\nuse of decoherence-free states (DFS) against collective noise\nmultiparty can communicate in the presence of collectivedephasing noise and collective-rotation noise which affects the\nintegrity of quantum communication.\n3 Quantum machine learning in\naugmenting quantum cryptography\nWith the integration of quantum computing into classical\nmachine learning, QML emerges as a powerful approach to\nenhance computational performance. Various classical machine\nlearning\nalgorithms,\nincluding\nsupervised\nand\nunsupervised\nlearning, beneﬁt from quantum principles, leading to improved\nefﬁciency and scalability. Unsupervised learning, particularly in\nprocessing large real-time data, has gained popularity with the\ndevelopment of quantum generative models. Several variants of"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q108", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What type of QRNG reduces reliance on device trust assumptions while maintaining verifiable security guarantees?"}, {"title": "Đáp án chuẩn", "text": "Recent advances include semi-device-independent QRNGs (semi-DI QRNGs), which reduce reliance on device trust assumptions while maintaining verifiable security guarantees [56, 97]."}, {"title": "Bài", "text": "Post-Quantum Cryptography and Quantum-Safe Security"}, {"title": "Đoạn gốc (trang 22)", "text": "22\nChhetri et al.\n8.3\nQuantum Random Number Generators (QRNGs)\nHigh-quality randomness is essential for secure cryptographic primitives. Quantum Random Number Generators (QRNGs) exploit the inherent unpredictability of quantum processes, such as photon\nemission or phase fluctuations, to produce entropy that is provably resistant to prediction and\nreplication [49, 75]. Unlike classical pseudo-random generators, QRNGs provide true randomness\nrooted in physical laws, ensuring robustness against adversaries with full knowledge of initial\nsystem states [49, 75]. Recent advances include semi-device-independent QRNGs (semi-DI QRNGs),\nwhich reduce reliance on device trust assumptions while maintaining verifiable security guarantees\n[56, 97]. Similarly, source-independent QRNGs validate entropy independently of the quantum\nstate source, thereby enhancing robustness against hardware imperfections [56, 98]. Together, these"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q109", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What does Grover’s algorithm show about symmetric cryptography?"}, {"title": "Đáp án chuẩn", "text": "Grover’s algorithm shows that symmetric cryptography, though more resilient, also demands doubled key sizes to maintain equivalent margins."}, {"title": "Bài", "text": "Harvest-Now, Decrypt-Later - A Temporal Cybersecurity Risk in the Quantum Transition"}, {"title": "Đoạn gốc (trang 19)", "text": "in transit and do not remediate ciphertext already collected.\n(c)\nForward-secure lifecycles: Another line of defense targets persistence rather than\ntransit. Rotating keys, ephemeral encryption, and controlled data expiration reduce\nthe long-term value of harvested ciphertext [25]. Such measures limit retrospective compromise but are difficult to enforce in regulated contexts where retention\nis mandatory.\n(d)\nGovernance and policy: Technical measures succeed only if adopted in time. Guidance\nsuch as the U.S. NSA CNSA 2.0 sets deadlines for migration [22], while ETSI and\nthe ENISA provide sectoral strategies and highlight operational challenges [4,48].\nGlobal PKI, which anchors TLS, VPNs, and code signing, remains a bottleneck where\nfragmented adoption risks leaving archives vulnerable for decades. At the same\ntime, Grover’s algorithm shows that symmetric cryptography, though more resilient,\nalso demands doubled key sizes to maintain equivalent margins [13]. The broader"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q110", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "By what year do the U.S. White House and the European Telecommunications Standards Institute (ETSI) Quantum-Safe group aim to be mostly quantum-safe?"}, {"title": "Đáp án chuẩn", "text": "reflects an aim to be mostly quantum-safe by around 2035."}, {"title": "Bài", "text": "Are Enterprises Ready for Quantum-Safe Cybersecurity"}, {"title": "Đoạn gốc (trang 13)", "text": "reflects an aim to be mostly quantum-safe by around 2035. Similarly, the U.S. White House\nNSM-10 set 2035 as a goal to mitigate most quantum risk [3]. These timelines implicitly indicate\na belief that a CRQC is unlikely much before then, but not so late as 2050 – essentially hedging\nfor mid-2030s. The European Telecommunications Standards Institute (ETSI) Quantum-Safe\ngroup and other international bodies likewise often mention “10–15 years” as an estimation,\nthough always with a caveat that progress is not entirely predictable.\nCrucially, adversaries will not announce when they have a cryptographic-breaking quantum\ncomputer – if a nation-state achieves it, it would almost certainly be a closely guarded secret\ninitially.\nHowever, it is also widely argued that building such a machine in secret without\ntipping off the scientific community would be extraordinarily difficult [3]. Quantum computing\nresearch is global and involves hundreds of researchers; breakthroughs (and even incremental"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q111", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the basis of the FALCON signature algorithm and how does it generate keys and sign messages?"}, {"title": "Đáp án chuẩn", "text": "FALCON is a postquantum cryptographic signature algorithm based on the lattice chosen by NIST. For key generation, the modulus prime q and monic polynomial φ are used as inputs. Messages are signed with the secret key sk, and signatures are verified with the public key h."}, {"title": "Bài", "text": "Post-Quantum_Blockchain_Security_for_the_Internet_of_Things_Survey_and_Research_Directions"}, {"title": "Đoạn gốc (trang 7)", "text": "1754\nIEEE COMMUNICATIONS SURVEYS & TUTORIALS, VOL. 26, NO. 3, THIRD QUARTER 2024\nTABLE III\nPERFORMANCE EVALUATION OF NIST STANDARD POST-QUANTUM SIGNATURES [51], [65]\n3) FALCON: This signature algorithm is another postquantum cryptographic signature based on the lattice chosen\nby NIST as a post-quantum standard [66]. FALCON is an\nacronym for “FAst Fourier Lattice-based COmpact Signatures\nover NTRU.” It uses a trapdoor sampler called “rapid Fourier\nsampling” to instantiate the framework over the NTRU lattices.\nAdditionally, the Short Integer Solution (SIS) problem over\nNTRU, which is a quantum-resistant hard problem, is at the\nheart of FALCON. For the key generation procedure, the\nmodulus prime q and monic polynomial φ serve as the key\ngeneration algorithm inputs. It signs messages with secret\nkey sk and veriﬁes the signatures with public key h. The\ncoefﬁcients of the polynomials f and g ∈z[x] are chosen at\nrandom from a discrete Gaussian distribution, after which it"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q112", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "Which stateful hash-based signatures are mentioned as being added to wolfSSL to address post-quantum cryptography for code signing use cases?"}, {"title": "Đáp án chuẩn", "text": "LMS and XMSS"}, {"title": "Bài", "text": "A Survey of Post-Quantum Cryptography Support in Cryptographic Libraries"}, {"title": "Đoạn gốc (trang 7)", "text": "stateful hash-based signatures LMS and XMSS (these are used\nfor long-term signature needs, such as firmware signing). In\nfact, wolfSSL documentation mentions that LMS/XMSS were\nrecently added to address PQC for code signing use cases [46].\nThese are not NIST’s “competition” algorithms (they were standardized separately), but show the comprehensive approach of\nwolfSSL. wolfSSL announcements do not discuss SPHINCS+,\nlikely due to its slower performance as a stateless hash signature scheme. Currently, wolfSSL has chosen to incorporate\nLMS/XMSS, which are stateful options. No code-based KEM\n(McEliece) is supported either, presumably due to key size constraints in embedded. wolfSSL says that it is “post-quantum\nready” for both encryption and signatures with the above algorithms. The focus on embedded efficiency makes it stand out:\nwolfSSL has effectively demonstrated that PQC is not just for\nbig servers; it can run on microcontrollers and even bare-metal"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q113", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "When did NIST launch the public competition to develop and standardize PQC algorithms?"}, {"title": "Đáp án chuẩn", "text": "NIST launched a public competition in 2016 to develop and standardize PQC algorithms [6]."}, {"title": "Bài", "text": "A Survey of Post-Quantum Cryptography Support in Cryptographic Libraries"}, {"title": "Đoạn gốc (trang 2)", "text": "of educating decision-makers and developers of the landscape\nin 2025. Before diving into the library analysis, we provide\nbackground on the quantum threat to modern cryptography and\nthe efforts by NIST and government agencies to facilitate a\ntransition to quantum-safe security.\n3\nBackground and Related Work\n3.1\nNIST PQC Standardization Process\nMotivation and the NIST Competition\nRecognizing the\nquantum threat, NIST launched a public competition in 2016\nto develop and standardize PQC algorithms [6]. This process\nmirrored the earlier AES and SHA competitions in openness\nand rigor. Cryptographers worldwide submitted candidates in\nvarious categories (encryption/KEM and digital signatures). The\ncompetition had multiple elimination rounds: Round 1 (69 submissions) in 2017, Round 2 narrowed the field in 2019, and\nRound 3 (2020–2022) featured the finalists. Evaluation criteria\nincluded security (resistance to cryptanalysis by both classical"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q114", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "How many times is the filled permutation cyclically shifted to the right in the proposed architecture of RPG?"}, {"title": "Đáp án chuẩn", "text": "6 times"}, {"title": "Bài", "text": "A Hardware-Friendly Shuffling Countermeasure Against Side-Channel Attacks for Kyber"}, {"title": "Đoạn gốc (trang 3)", "text": "IEEE TRANSACTIONS ON CIRCUITS AND SYSTEMS—II: EXPRESS BRIEFS\n3\n···\nidx’\n(a)\n(b)\n(d)\nFIFO\nREG\nMUX1\nMUX0\nBUF\n1\n6\nLFSR\nseed\nenb\nidx/addr\n0x28\nidx_0\nidx_1\nrest\nCNTR\nCOMP\nCOMP\nidx\n(c)\nMUX2\nCTRL\nena\nsel_0\nsel_1\nrst\nfinish\nstart\nena\nsel_0\nsel_1\n(e)\nrst_l\n···\nDEMUX\nFig. 2. The proposed architecture of RPG.\nthe leftmost of per b successively. This stage is to protect\nfrom errors. In the second stage of shuffling, the rest random\naddresses are selected from the remaining 52 elements of\nper a and per b. After finishing all the selections, the filled\npermutation is cyclically shifted to the right 6 times and output\nas the final random address permutation, as shown in Fig. 1(b).\nBased on the above analysis, the proposed architecture\nof RPG is shown in Fig. 2, divided into five parts. Part\n(a) contains one 64-to-1 MUX named MUX0, one 1-to-64\nDEMUX, and one register group named REG with data width\nof 6 and depth of 64. REG stores the designed address"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q115", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What hardware acceleration designs are mentioned for FALCON?"}, {"title": "Đáp án chuẩn", "text": "FPGA and GPU designs for ML-DSA, FFT and discrete Gaussian co-designs for FALCON, and compact accelerators for SPHINCS+"}, {"title": "Bài", "text": "Post-Quantum Cryptography and Quantum-Safe Security"}, {"title": "Đoạn gốc (trang 17)", "text": "libraries to include network resiliency, operational playbooks, and auditability [8, 14, 26, 76].\nImplementation security further reinforces this system-level view. Most real-world vulnerabilities\nstem from leakage or fault behavior rather than cryptanalysis. Side-channel hardening for lattice\nschemes requires attention to discrete Gaussian sampling, masking, and constant-time polynomial\narithmetic. Prior work has categorized leakage classes, built countermeasures, and shown that\nnaive optimizations can reintroduce risk [46, 59, 96]. Hardware acceleration bridges performance\ngaps while maintaining constant-time guarantees, with FPGA and GPU designs for ML-DSA, FFT\nand discrete Gaussian co-designs for FALCON, and compact accelerators for SPHINCS+ [7, 28,\n33, 48, 54, 84, 88]. Secure deployment requires coupling such accelerators with compiler fences,\nmicroarchitectural isolation, and continuous test harnesses for fault injection, power, and EM\nanalysis, and randomized protocol paths."}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q116", "title": "multi-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the impact of multi-photon signals on the secure key generation rate in the BB84 protocol, and how does this relate to Eve's ability to perform a photon splitting attack as described in the Decoy State Quantum Key Distribution method?"}, {"title": "Đáp án chuẩn", "text": "In the BB84 protocol, multi-photon signals can be exploited by Eve through a photon splitting attack, where she measures the photon number and selectively suppresses single-photon signals while keeping one copy for herself. This compromises the unconditional security of the protocol. The secure key generation rate (S) can be calculated as S ≥ Qµ{−H2(Eµ) + Ω[1 −H2(e1)]}, where Qµ and Eµ are the gain and quantum efficiency of the system, respectively. This formula shows that the secure key generation rate is directly affected by the presence of multi-photon signals, as Eve can use them to gain an identical copy of Bob's possession, thereby reducing the secure key generation rate."}, {"title": "Bài A", "text": "Decoy State Quantum Key Distribution"}, {"title": "Đoạn của bài A", "text": "as sources. But, these sources sometimes produce signals\nthat contain more than one photons. Those multi-photon\nsignals open the door to powerful new eavesdropping attacks including photon splitting attack.\nFor example,\nEve can, in principle, measure the photon number of each\nsignal emitted by Alice and selectively suppress singlephoton signals. She splits multi-photon signals, keeping\none copy for herself and sending one copy to Bob. Now,\nsince Eve has an identical copy of what Bob possesses,\nthe unconditional security of QKD (in, for example, standard BB84 protocol[5]) is completely compromised.\nIn summary, in standard BB84 protocol, only signals\noriginated from single photon pulses emitted by Alice\nare guaranteed to be secure. Consequently, paraphrasing\nGLLP [6], the secure key generation rate (per signal state\nemitted by Alice) can be shown to be given by:\nS ≥Qµ{−H2(Eµ) + Ω[1 −H2(e1)]}\n(1)\nwhere Qµ and Eµ are respectively the gain and quantum"}, {"title": "Bài B", "text": "harvest-now-decrypt-later-pqc-threat-model"}, {"title": "Đoạn của bài B", "text": "of quantum mechanics (quantum no-cloning theorem, quantum indistinguishability) to provide\nsecurity guarantees that are provably secure against any adversary with any technology.\nHow QKD Works:\n1. Alice and Bob establish a quantum communication channel (single-photon transmission\npath)\n2. Alice encodes random bits in quantum states (polarization, phase, or basis)\n3. Bob randomly chooses measurement bases and measures incoming photons\n4. Alice and Bob publicly compare bases (without revealing bits)\n5. Bits measured in matching bases form the shared secret key\n6. Quantum eavesdropping detects any measurement attempts, alerting legitimate parties\nPopular QKD Protocols:\n• BB84: Earliest protocol, uses two bases for encoding\n• E91: Entanglement-based protocol, stronger security guarantees\n• Measurement-Device-Independent (MDI-QKD): Closes detector vulnerabilities\n12.2 Security Model and Physical Assumptions"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q117", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "How many power traces were required by Yang et al. to recover two coefficients of the secret key in their random ciphertext CPA attack on Kyber-512?"}, {"title": "Đáp án chuẩn", "text": "they successfully recovering two coefficients of secret key using 20 or more power traces."}, {"title": "Bài", "text": "An Improved Two-Step Attack on Lattice-Based Cryptography - A Case Study of Kyber"}, {"title": "Đoạn gốc (trang 1)", "text": "secret key of Kyber-512 at the cost of about 1619 power traces,\nbut there are still 40% error coefficients. Contrast to previous\nworks, in [7], Yang et al. tried to carry out a random ciphertext\nCPA attack on the reference implementation of Kyber-512,\nsuccessfully recovering two coefficients of secret key using\n20 or more power traces. Nevertheless, they had to repeat the\nattack 256 times to recover the entire secret key of Kyber-512.\nSo, they at least need 5120 power traces for a key. In [8],\nYen-Ting Kuo and Atsushi Takayasu presented a two-step\nattack on Kyber by integrating the random ciphertext CPA\nattack with the lattice attack. They adopted the CPA attack\nto recover part of the coefficients of a key and then directly\nsolved the rest coefficients by using a low-dimension equation\nof the M-LWE problem. The correctness was verified by using\ncomputer simulations. In this brief, we take the idea of [8]\nas the starting point and develop an improved two-step attack"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q118", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What was the first nuclear application demonstrated using VQE?"}, {"title": "Đáp án chuẩn", "text": "The first demonstrated application was computing the deuteron (2H) binding energy."}, {"title": "Bài", "text": "Variational quantum algorithms"}, {"title": "Đoạn gốc (trang 21)", "text": "circuit depth by using smart initializations [267], or by\noptimizing the circuit structure itself [31, 32].\nB.\nNuclear and particle physics\n1.\nNuclear physics\nSimilar to the chemistry applications discussed above,\nVQAs have the potential to convey a quantum advantage in studying nuclear structure and dynamics. The\nmost studied potential contribution is the utility of the\nVQE method to ﬁnd nuclear ground states.\nThis was\nﬁrst demonstrated for computing the deuteron (2H) binding energy [268], and has been extended to other light\nnuclei such as the triton (3H), 3He, and an alpha particle (4He) [269].\nAdditionally, using VQE to prepare\nthe ground state of a triton has been an initial step\nas a demonstration of simulating neutrino-nucleon scattering [270]. Considering these low-energy applications\nalong with the general progress towards studying higher\nenergy nuclear interactions (quantum chromodynamics)"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q119", "title": "multi-hop", "blocks": [{"title": "Câu hỏi", "text": "How does the use of XMSS in the Quantum-Resistance Ledger (QRL) relate to the support of LMS and XMSS in wolfSSL for code signing, and what are the implications for post-quantum security in embedded systems and blockchains?"}, {"title": "Đáp án chuẩn", "text": "The Quantum-Resistance Ledger (QRL) uses the XMSS signature scheme, which is a stateful hash-based signature used for long-term signature needs, such as firmware signing. Similarly, wolfSSL has chosen to incorporate LMS and XMSS, which are stateful options, to address post-quantum cryptography (PQC) for code signing use cases. This indicates that both QRL and wolfSSL recognize the importance of XMSS and LMS for post-quantum security, with QRL implementing it in an industrial setting and wolfSSL supporting it for embedded systems. The use of these stateful signatures in both contexts highlights the growing importance of PQC in both blockchain and embedded systems to resist quantum adversaries."}, {"title": "Bài A", "text": "A Survey of Post-Quantum Cryptography Support in Cryptographic Libraries"}, {"title": "Đoạn của bài A", "text": "stateful hash-based signatures LMS and XMSS (these are used\nfor long-term signature needs, such as firmware signing). In\nfact, wolfSSL documentation mentions that LMS/XMSS were\nrecently added to address PQC for code signing use cases [46].\nThese are not NIST’s “competition” algorithms (they were standardized separately), but show the comprehensive approach of\nwolfSSL. wolfSSL announcements do not discuss SPHINCS+,\nlikely due to its slower performance as a stateless hash signature scheme. Currently, wolfSSL has chosen to incorporate\nLMS/XMSS, which are stateful options. No code-based KEM\n(McEliece) is supported either, presumably due to key size constraints in embedded. wolfSSL says that it is “post-quantum\nready” for both encryption and signatures with the above algorithms. The focus on embedded efficiency makes it stand out:\nwolfSSL has effectively demonstrated that PQC is not just for\nbig servers; it can run on microcontrollers and even bare-metal"}, {"title": "Bài B", "text": "Post-Quantum_Blockchain_Security_for_the_Internet_of_Things_Survey_and_Research_Directions"}, {"title": "Đoạn của bài B", "text": "preparing for the quantum computing era to resist quantum\nadversaries.\nHowever, several post-quantum blockchain platforms are\ncurrently operational, each with a different purpose. For\ninstance, the hash-based XMSS signature scheme is being\nused in an industrial setting by the Quantum-Resistance\nLedger (QRL) [13]. NIST approved this signature as a\nquantum-secure signature [140] which is forward-secure with\nfew security assumptions and reusable addresses. The QRL\nincludes tools, documentation, and an API that provides\nvarious ways to interact with the private and public postquantum secure blockchains used in the main protocol.\nMoreover, Komodo [141] claimed it adopted a slightly\nmodiﬁed Dilithium signature in its blockchain. One of its modiﬁcations is introducing a quantum-secure address generation\noption. Thus, quantum security is a plug-in option that is\naccessible to all projects built on Komodo’s blockchain."}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q120", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the mathematical formula for zero-noise extrapolation and what does it involve?"}, {"title": "Đáp án chuẩn", "text": "The zero-noise extrapolation is given by the formula E(θ, 0) ≈ ×\ni=0 ciE(θ, λi), where ci are coefficients determined by the extrapolation method [48, 49]. It involves running the circuit at different noise levels and extrapolating to the zero-noise limit."}, {"title": "Bài", "text": "A Survey of Quantum Generative Adversarial Networks"}, {"title": "Đoạn gốc (trang 10)", "text": "There are many Common techniques include Zero-Noise Extrapolation, which involves\nrunning the circuit at different noise levels and extrapolating to the zero-noise limit.\nMathematically, if E(θ, λ) is the expectation value of a circuit with parameters θ at\nnoise level λ, then the zero-noise extrapolation is\nE(θ, 0) ≈\nn\nX\ni=0\nciE(θ, λi),\n(17)\nwhere ci are coefficients determined by the extrapolation method [48, 49].\nProbabilistic Error Cancellation involves characterizing the noise and then applying\nits inverse through a probabilistic decomposition\nE−1(ρ) =\nX\ni\nγiPi(ρ),\n(18)\nwhere E is the noise channel, Pi are implementable operations, and γi are coefficients [49].\nMoreover, Noise-Resilient Circuit Designs are quantum circuit architectures specifically designed to be robust against common noise sources. These designs often involve\nshorter circuit depths to minimize the accumulation of errors, redundant encoding of"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q121", "title": "multi-hop", "blocks": [{"title": "Câu hỏi", "text": "What are the key differences in the mathematical representation of the reconstructed state in QGANs between the two papers, and how do these differences impact their applications in medical imaging and virtual reality according to the surveys?"}, {"title": "Đáp án chuẩn", "text": "In Paper A, the reconstructed state is represented by the equation ∣ϕ′′⟩=Ud∣ϕ′⟩, where Ud is the unitary matrix for decoding. In Paper B, QGANs are described as combining quantum computing and adversarial training for efficient and expressive generative modeling, with applications in medical imaging and virtual reality. The use of quantum circuits in Paper A for generating new data instances, as mentioned in the generator formula G(z), can provide more realistic synthetic samples compared to classical GANs, which could be particularly beneficial in medical imaging for creating realistic patient data. The integration of QGANs with domain-specific techniques in Paper B, such as optimization heuristics and variational circuits, further enhances their applicability in virtual reality and medical data generation."}, {"title": "Bài A", "text": "Quantum_Machine_Learning_A_Survey"}, {"title": "Đoạn của bài A", "text": "J. Electrical Systems 20-6s (2024): 971-981 \n974 \n∣ϕ′′⟩=Ud∣ϕ′⟩ \nWhere: \nUe and Ud are the unitary matrices for encoding and decoding. \n∣ϕ⟩ is the input state. \n∣ϕ′⟩ is the encoded state. \n∣ϕ′′⟩ is the reconstructed state. \nQuantum Generative Adversarial Networks (QGANs) \nDescription: Quantum versions of GANs for generating synthetic data that closely matches real data distributions. \nUse Cases: Data augmentation, anomaly detection, and creating realistic synthetic samples for machine learning \n[1]. \nFields of Use: Applied in medical imaging, virtual reality, and autonomous driving. \nQGANs use quantum circuits to generate new data instances. \nGenerator formula: G(z) \nDiscriminator formula: \nD(x) \nWhere: \nG is the generator function mapping from latent space to data space. \nD is the discriminator function mapping from data space to a binary class label. \nz represents the input to the generator. \nx represents the input to the discriminator."}, {"title": "Bài B", "text": "A Survey of Quantum Generative Adversarial Networks"}, {"title": "Đoạn của bài B", "text": "Kosuyolu Sit., No:9E/3 Kadikoy, City, 610101, Istanbul, T¨urkiye.\n*Corresponding author(s). E-mail(s): mansursahgmail.com;\nAbstract\nQuantum Generative Adversarial Networks (QGANs) have emerged as a promising direction in quantum machine learning, combining the strengths of quantum\ncomputing and adversarial training to enable efficient and expressive generative\nmodeling. This survey provides a comprehensive overview of QGAN models, highlighting key advances from theoretical proposals to experimental realizations. We\ncategorize existing QGAN architectures based on their quantum-classical hybrid\nstructures and summarize their applications in fields such as image synthesis,\nmedical data generation, channel prediction, software defect detection, and educational tools. Special attention is given to the integration of QGANs with\ndomain-specific techniques, such as optimization heuristics, Wasserstein distance,\nvariational circuits, and large language models. We also review experimental"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q122", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the runtime complexity of the quantum algorithm in the context of the recommendation system?"}, {"title": "Đáp án chuẩn", "text": "The quantum runtime is O(poly(k)polylog(mn))."}, {"title": "Bài", "text": "Quantum Computing in the NISQ era and beyond"}, {"title": "Đoạn gốc (trang 12)", "text": "stage, performed online, a new customer reveals some preferences, and the system outputs a\nrecommendation which that customer will like with high probability. It is this second online\nstage that admits a quantum speedup. The quantum runtime is O(poly(k)polylog(mn)),\nwhile the best classical algorithm known requires time poly(mn) to return a high-value\nrecommendation. Crucially, the quantum algorithm, in contrast to the classical one, does\nnot attempt to reconstruct the full recommendation matrix, which would take too long.\nInstead it samples eﬃciently from the low-rank approximation to P.\nThis is a signiﬁcant quantum speedup for a real-world application of machine learning,\nencouraging the hope that other such speedups will be discovered. However, we don’t currently have a convincing theoretical argument indicating that the task performed by quantum recommendation systems (returning a high-quality recommendation in polylog(mn)"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q123", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What symmetric cryptographic parameters should be adjusted to strengthen security against Grover’s algorithm and prepare for quantum-resilient symmetric encryption and hashing?"}, {"title": "Đáp án chuẩn", "text": "Replacing AES-128 and SHA-256 with AES-256 and SHA-512 strengthens security against Grover’s algorithm and prepares infrastructure for quantum-resilient symmetric encryption and hashing."}, {"title": "Bài", "text": "A Comparative Study of Classical and Post-Quantum Cryptographic Algorithms in the Era of Quantum Computing"}, {"title": "Đoạn gốc (trang 13)", "text": "Falcon, and SPHINCS+—ensures long-term support, broad interoperability,\nand alignment with global efforts in standardization. Fourth, symmetric cryptographic parameters should be adjusted where feasible. Replacing AES-128\nand SHA-256 with AES-256 and SHA-512 strengthens security against Grover’s\nalgorithm and prepares infrastructure for quantum-resilient symmetric encryption and hashing. Fifth, organizations must evaluate the infrastructure impact\nof implementing PQC. This includes benchmarking new algorithms in terms\nof processing load, latency, certificate size, and bandwidth consumption, especially in performance-critical environments. Sixth, there must be continuous\nmonitoring of standardization developments. Staying informed about evolving\nspecifications, parameter sets, and formats from organizations like NIST, the Internet Engineering Task Force (IETF), and the European Telecommunications"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q124", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What effect does a barren plateau (BP) have on the landscape of the cost function in a variational quantum algorithm (VQA)?"}, {"title": "Đáp án chuẩn", "text": "this has the eçect of the landscape being essentially flat."}, {"title": "Bài", "text": "Variational quantum algorithms"}, {"title": "Đoạn gốc (trang 15)", "text": "given cost function C(θ) exhibits a BP, the magnitude of\nits partial derivatives will be, on average, exponentially\nvanishing with the system size [194]. As shown in Fig. 6\nthis has the eﬀect of the landscape being essentially ﬂat.\nHence, in a BP one needs an exponentially large precision\nto resolve against ﬁnite sampling noise and determine a\ncost-minimizing direction, with this being valid independently of using a gradient-based [84] or gradient-free optimization method [195]. The exponential scaling in the\nprecision due to BPs could erase a potential quantum\nadvantage with a VQA, as its complexity would be comparable to the exponential scaling typically associated\nwith classical algorithms. Hence, analyzing the existence\nof BPs in a given VQA is fundamental to preserve the\nhope of using it to achieve a quantum advantage."}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q125", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What type of attack is described in the paper that aims to replace the deployed model with a malicious one during deployment in 6G applications?"}, {"title": "Đáp án chuẩn", "text": "The QML compromise attacks aim to replace the deployed model with a malicious one during the deployment (Type 3⃝in Fig. 3)."}, {"title": "Bài", "text": "Quantum Machine Learning for 6G Network"}, {"title": "Đoạn gốc (trang 4)", "text": "during aggregation to corrupt the model’s learning process.\nThe QML compromise attacks aim to replace the deployed\nmodel with a malicious one during the deployment (Type\n3⃝in Fig. 3). In 6G applications, such as digital twins,\nmodel poisoning can lead to the digital replica making incorrect predictions, severely impacting real-world processes like\nmanufacturing or autonomous steering. Further, an attacker\ncould poison the training data of a smart grid, causing it\nto mismanage energy distribution and lead to blackouts. In\nindustrial digital twin applications, altered models could lead\nto incorrect machinery operations, resulting in safety hazards.\nIV. EXAMPLE OF ADVERSARIAL ATTACKS AGAINST\nQML-BASED 6G RESOURCE ALLOCATION\nFig. 4 illustrates a white-box adversarial perturbation attack targeting QML-based 6G resource allocation models,\nimplemented on open-source quantum-inspired real-time optimization techniques for 6G networks [1]. Accordingly, the"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q126", "title": "multi-hop", "blocks": [{"title": "Câu hỏi", "text": "How does the quantum noise in 6G networks affect QML-based applications, and what potential improvement can QML offer in cybersecurity for detecting zero-day attacks compared to classical models?"}, {"title": "Đáp án chuẩn", "text": "Quantum noise can corrupt QML-based applications in 6G networks, such as digital twin services, which rely on real-time data encoded in qubits. In cybersecurity, QML can significantly improve the detection of zero-day attacks; for instance, a QSVM achieved an F1 score of 0.94 for zero-day attack detection, compared to 0.87% for classical models."}, {"title": "Bài A", "text": "Quantum Machine Learning for 6G Network"}, {"title": "Đoạn của bài A", "text": "Quantum switches\nWireless\nQuantum routers\nTier 2 \nDigital twin services\nTier 1\nRemote controllers\n6G core network \nfunctions\nQuantum switches\nCloud\nQuantum-resistant algorithms \nwith AES/classical cryptos\nQuantum key distribution\n(QKD) protocol\nQuantum \nsensors\nTransmitter\nSematic\ndata\nReceiver\nQubit\ndecoding\nQubit\nencoding\nQuantum channel\n(optical fiber, free\nspace)\nPhoton\ndetector\nQuantum data\nVirtual\nfactory\nVirtual \ncity\nCommunication channel\nQML-based\n6G applications\nCommunication channel\nSource \ndata\n< 2km\n2-100km\nTrigger\ngate\nAdversarial signal \nperturbation/noise\nPoisoning\nWrong qubit measurement\n→Failed prototype generation\nQML-assisted communication functions\nAttack results\n1\n2\n3\n4\n4\nFig. 6: An illustration of 6G and the position of adversarial threats against QML-assisted communication functions.\nunreliable predictions. For instance, a digital twin of an energy\ngrid might use QML to optimize load balancing based on\nreal-time data encoded in qubits. Quantum noise can corrupt"}, {"title": "Bài B", "text": "Quantum Machine Learning for Cybersecurity"}, {"title": "Đoạn của bài B", "text": "frameworks. Their quantum-assisted intrusion detection system,\nbased on QNNs, achieved 96.8% accuracy, whereas the classical\napproaches scored only achieved only 92.3%. Their QSVM\nwas able to achieve an F1 score of 0.94 for zero-day attack\ndetection, whereas classical models achieved just 0.87%. Also,\nthe detection latency got reduced from 320 ms to 110 ms\nwith quantum processing, which is a critical improvement in\nthis domain. Still, the authors noted that hardware noise and\nlimitations, interoperability issues, and cost remain hindrances\nto the adoption of this technology.\nQuantum hardware is not used only in defence, but also as\nan offensive weapon. Thus, QML is instrumental in not just\
