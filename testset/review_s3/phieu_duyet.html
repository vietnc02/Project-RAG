 used to determine the\ntranslation from logical to physical device parameters,\nand which is especially applicable for quantum simulations [44, 45]. Refs. [46, 47] have explored using VQAs\nthe construction of optimal control sequences. Although"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q195", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is an example of a blockchain being used in IoT applications?"}, {"title": "Đáp án chuẩn", "text": "Helium blockchain provides a long-range wireless network for users."}, {"title": "Bài", "text": "Post-Quantum_Blockchain_Security_for_the_Internet_of_Things_Survey_and_Research_Directions"}, {"title": "Đoạn gốc (trang 1)", "text": "to cloud servers through the Internet. The cloud provides\na centralized approach that has some advantages, such as\nresource availability and affordability. Although this approach\nmay work for now, security concerns regarding centralized\ntechniques such as single-point failure and many-to-one trafﬁc\ndemonstrate that decentralized concepts will be required in the\nfuture [4].\nBlockchain [5] and other distributed ledger technologies are\ninnovative approaches that can potentially address many security concerns of cloud-based IoT systems. Such technologies\nprovide a decentralized, immutable, and shared ledger that\nmaintains asset and transaction records over a Peer-to-Peer\n(P2P) network [6]. Blockchain was ﬁrst successfully used in\nBitcoin to send and receive digital currencies. It can also be\nused to power many IoT applications. Helium blockchain [7],\nfor instance, provides a long-range wireless network for users"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q196", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What mechanism allows hybrid systems to validate authenticity using both classical and post-quantum credentials according to NIST PQC guidelines?"}, {"title": "Đáp án chuẩn", "text": "The dual-signature and dual-key encapsulation mechanisms allow hybrid systems to validate authenticity using both classical and post-quantum credentials, ensuring smooth operational continuity throughout the transition."}, {"title": "Bài", "text": "The-Quantum-Security-Deadline"}, {"title": "Đoạn gốc (trang 11)", "text": "European Journal of Computer Science and Information Technology, 13(52),35-52, 2025 \n \n \n Print ISSN: 2054-0957 (Print) \n Online ISSN: 2054-0965 (Online) \n Website: https://www.eajournals.org/ \n Publication of the European Centre for Research Training and Development -UK \n45 \n \nThe dual-signature and dual-key encapsulation mechanisms (as recommended by NIST PQC \nguidelines) allow hybrid systems to validate authenticity using both classical and post-quantum \ncredentials, ensuring smooth operational continuity throughout the transition (Kampanakis & \nVassilev, 2023). \n \nCertificate Lifecycle Management (CLM) \n \n1. Automation and Scalability \nManaging millions of digital certificates manually is infeasible, especially as PQC migration \nintroduces new algorithmic and key-size complexities. Automated Certificate Lifecycle \nManagement (CLM) platforms streamline issuance, renewal, and revocation through REST APIs \nand policy engines (Keyfactor, 2024)."}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q197", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the role of the key sharing and allocation mechanism in a QKD network?"}, {"title": "Đáp án chuẩn", "text": "The key sharing and allocation mechanism allows for a fair and effective supply of keys to multiple applications. Two functional elements, a key sharing manager and a key allocation manager, are implemented within the global key management function to generate and distribute global keys."}, {"title": "Bài", "text": "Quantum Key Distribution Networks -- Key Management - A Survey"}, {"title": "Đoạn gốc (trang 16)", "text": "connected clients is calculated and key rates are assigned accordingly. The sum of key rates assigned does not exceed\nthe global key sharing speed.\nThe application directory function enables QKD service nodes to translate application IP addresses to the service nodes\nthey connect.5 This function is implemented within the registry manager of a global key management function. An\napplication directory record is created and stored on a server running on a specific service node. The remaining service\nnodes within the QKD network contain clients that submit and request translations from that server.\nThe key sharing and allocation mechanism allows for a fair and effective supply of keys to multiple applications. As a\nresult, two functional elements are implemented within the global key management function: a key sharing manager\nand a key allocation manager. The key sharing manager generates random bit sequences – global keys, which are then"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q198", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the tradeoff explored in the QR-UOV variant?"}, {"title": "Đáp án chuẩn", "text": "UOV variant with quasi-random structure, explores tradeoffs in key size and verification"}, {"title": "Bài", "text": "Post-Quantum Cryptography and Quantum-Safe Security"}, {"title": "Đoạn gốc (trang 14)", "text": "MPCitH design focusing on round and memory complexity\nSDitH [4, 66]\nMPC-in-the-Head\nSymmetric-primitive based MPCitH signature; fault and\nside-channel considerations under active attacks\nMQOM [10]\nMultivariate\n“MQ on my Mind,” non-structured MQ with MPC-style\ntechniques for practical signatures\nUOV [4, 15]\nMultivariate\nUOV-style constructions and modern cryptanalysis inform conservative parameter choices\nMAYO [4, 9]\nMultivariate\nRecent optimizations and implementation-security evaluation under physical attack models\nQR-UOV [4]\nMultivariate\nUOV variant with quasi-random structure, explores tradeoffs in key size and verification\nSNOVA [4]\nMultivariate\nStructured MQ approach aiming for smaller signatures\nand faster verification\nFAEST [4]\nSymmetric-based\nVOLE-in-the-Head signatures from symmetric primitives,\navoids algebraic structure\nSQIsign [4, 20, 92]\nIsogeny\nIsogeny-based signatures pursuing very compact artifacts,\nconsidered with caution given recent breaks in related\nprimitives\n5"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q199", "title": "multi-hop", "blocks": [{"title": "Câu hỏi", "text": "How might the integration of quantum machine learning (QML) with quantum key distribution (QKD) enhance the security of communication systems, and what challenges do researchers face in making QML more interpretable and transparent for practical applications in quantum cryptography?"}, {"title": "Đáp án chuẩn", "text": "The integration of QML with QKD can significantly enhance the performance and security of quantum cryptographic systems by improving eavesdropping detection. However, researchers face challenges in making QML more interpretable and transparent, which complicates its practical utility in quantum cryptography, as highlighted by the need to identify specific domains and conditions where quantum models outperform classical methods."}, {"title": "Bài A", "text": "Quantum key distribution through quantum machine learning - a research review"}, {"title": "Đoạn của bài A", "text": "participants’ private data. This protocol relies on unitary operations\nand a pre-shared key, while entanglement swapping remains\noptional (Gong et al., 2025). Two prominent ﬁelds of quantum\ntechnology, QML and quantum cryptography (QC) hold immense\npotential for future advancements. While research at the intersection\nof QML and QC is still in its early stages, the outlook is promising as\nboth areas continue to evolve. The integration of QML and QC\ncould pave the way for more secure communication systems in the\nquantum\nera,\nas\nhardware\ncapabilities\nand\npractical\napplications progress.\n3.1 Prospects and constraints of quantum\nmachine learning in QKD, eavesdropping\ndetection and security analysis of\nQKD protocols\nQKD is a fundamental aspect of quantum cryptography, and\nintegrating\nQML\nwith\nQKD\ncan\nsigniﬁcantly\nenhance\nthe\nperformance of quantum cryptographic systems. Once keys are\nsuccessfully generated in QKD, detecting eavesdropping becomes"}, {"title": "Bài B", "text": "A Survey of Quantum Machine Learning - Foundations,Algorithms, Frameworks, Data and Applications"}, {"title": "Đoạn của bài B", "text": "A Survey of QML: Foundations, Algorithms, Frameworks, Data and Applications\n91:29\nCurrently, many QML approaches lack interpretability and transparency, complicating their practical utility. Research in [45] experimentally demonstrated quantum advantage in certain supervised\nlearning tasks, emphasizing the importance of identifying specific domains and conditions under\nwhich quantum models outperform classical methods. Future directions should systematically\nidentify and experimentally validate these niche applications, providing clear interpretability and\nmeasurable quantum advantage criteria.\nThe ethical dimensions of quantum technology, including fairness, accountability, and security\nimplications, remain underexplored in QML research. A promising direction highlighted by recent\nexperiments in quantum-safe cryptography, such as the post-quantum cryptographic protocols\nexperimentally validated by NIST competitions [82], illustrates the necessity of incorporating"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q200", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the ETSI 004 application interface designed to facilitate?"}, {"title": "Đáp án chuẩn", "text": "The ETSI 004 application interface is designed to facilitate communication among key managers at various hierarchical levels."}, {"title": "Bài", "text": "Quantum Key Distribution Networks -- Key Management - A Survey"}, {"title": "Đoạn gốc (trang 21)", "text": "between various QKD module manufacturers and key managers. The ETSI 004 application interface is designed\nto facilitate communication among key managers at various hierarchical levels. As a result, it is possible to keep a\ncollection of proprietary QKD modules and key managers while installing a hierarchically superior key manager from\nany manufacturer that collects keys through the interface. However, the ETSI 004 application interface is not widely\nused in practice due to QoS features which are yet difficult to support. In addition, a QKD module manufacturer may\nnot implement its own key manager solution. As a result, the standardized interface for delivering keys from QKD\nmodules to key managers is critical to achieving interoperability.\nThis requirement was first highlighted during the SECOQC project (Section 3.2), when it was critical to allow different\nimplementations of QKD protocols to deliver keys to the Q3P modules. But the interface was never explained in detail,"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q201", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the specific form of the Vpool unitary used in the architecture, and how is it constructed?"}, {"title": "Đáp án chuẩn", "text": "The specific Vpool unitary is designed to conditionally rotate the surviving qubit based on the state of the discarded qubit. It is constructed as a controlled unitary: Vpool(θ) = CNOTj→k (I ⊗Ry(θ)) CNOTj→k, where qubit j acts as the control."}, {"title": "Bài", "text": "Beyond Barren Plateaus - A Scalable Quantum Convolutional Architecture for High-Fidelity Image Classification"}, {"title": "Đoạn gốc (trang 6)", "text": "Consider a pooling operation acting on a state\ndefined by density matrix ρ. We apply a parameterized unitary Vpool(θ) to qubits j and k. The\noperation targets qubit k to absorb information\nfrom qubit j.\nThe post-pooling state ρ′ is obtained by tracing out qubit j:\nρ′ = Trj\nh\nVpool(θ)ρV †\npool(θ)\ni\n.\n(6)\nOur specific Vpool unitary is designed to conditionally rotate the surviving qubit based on the\nstate of the discarded qubit. It is constructed as\na controlled unitary:\nVpool(θ) = CNOTj→k (I ⊗Ry(θ)) CNOTj→k,\n(7)\nwhere qubit j acts as the control. After this\noperation, qubit j is traced out, halving the system dimension for the subsequent layer. A visual\nrepresentation of the alternating convolution and\npooling blocks is provided in Figure 3.\n2.4\nThe Geometry of the Global Cost Function\nTo understand why the proposed architecture\nachieves 98.7% accuracy while prior iterations\nfailed, we must dissect the cost function.\nLet\nW(θ) represent the entirely of the parameterized"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q202", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the block size parameter set to in the BKZ reduction during the trial-and-error lattice attack?"}, {"title": "Đáp án chuẩn", "text": "The parameter of the block size in the BKZ reduction is set to 50."}, {"title": "Bài", "text": "An Improved Two-Step Attack on Lattice-Based Cryptography - A Case Study of Kyber"}, {"title": "Đoạn gốc (trang 4)", "text": "the correct key 564 can almost not be recognized. We can\npick out the final correct candidate from those four candidates\naccording to the results of the summations of their two kinds\nof corrections. Note that if we continue reducing the number\nof power traces, we may not be able to figure it out anymore.\nStep2: Trial-and-Error Lattice Attack\nWe conduct the trial-and-error lattice attack for a 128-value\ngroup of s (hereinafter referred to as SK-128) using 16 threads\non a Xeon Gold 6342 @ 2.8 GHz. The parameter of the\nblock size in the BKZ reduction is set to 50 and the value of\nmax loops to 8. We collect the CPA results of the first sixty\nbasemuls calls. Fig. 4 shows the relationships between the\nsuccess rate/time and the number of power traces represented\nin the blue curve and groups of histograms, respectively.\nThe success rate is evaluated by repeatedly conducting the\nproposed attack many times and counting the success times.\nIt can be seen that when the number of power traces is"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q203", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What specific QGAN framework is mentioned to improve fault tolerance during image generation tasks by addressing readout errors in quantum circuits?"}, {"title": "Đáp án chuẩn", "text": "A QGAN framework incorporating a bit-flip averaging (BFA) strategy has been proposed for enhanced fault tolerance during image generation tasks [69]."}, {"title": "Bài", "text": "A Survey of Quantum Generative Adversarial Networks"}, {"title": "Đoạn gốc (trang 15)", "text": "using just four qubits. Through layered training and ensemble learning techniques,\nReCon achieves improved sample quality and diversity. Empirical evaluations using\nbenchmark image datasets show a 33% improvement in Frechet Inception Distance\n(FID) over prior state-of-the-art superconducting-based QGANs, in particular MosaiQ [60]. Notably, ReCon is also validated on real hardware via AWS Braket using\nthe QuEra Aquila device, showcasing its practical feasibility. This work illustrates the\npotential of alternative quantum hardware platforms in pushing QGAN capabilities\nforward, particularly under noisy and resource-constrained conditions.\nTo address the persistent challenge of readout errors in quantum circuits, a QGAN\nframework incorporating a bit-flip averaging (BFA) strategy has been proposed for\nenhanced fault tolerance during image generation tasks [69]. This method simplifies\nthe error mitigation process by pre-averaging qubit measurements across random"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q204", "title": "multi-hop", "blocks": [{"title": "Câu hỏi", "text": "How does the space complexity of modular exponentiation on a quantum computer compare to the gate array for integer multiplication, and what implications does this have for the security of RSA cryptography as discussed in the context of quantum computing?"}, {"title": "Đáp án chuẩn", "text": "Modular exponentiation can be performed in O(l2 log l log log l) time and O(l log l log log l) space, which is more efficient than the O(l log l log log l) gates required for the Schönhage–Strassen algorithm to multiply two l-bit numbers. This efficiency suggests that RSA cryptography, which relies on the difficulty of prime factorization, could be vulnerable to quantum attacks, as evidenced by Google researchers estimating that factoring a 2048-bit RSA modulus could be achieved with about one million noisy qubits and a week of runtime."}, {"title": "Bài A", "text": "Polynomial-Time Algorithms for Prime Factorization and Discrete Logarithms on a Quantum Computer"}, {"title": "Đoạn của bài A", "text": "to get xr (mod n).\nIf we are working with l-bit numbers, this requires O(l) squarings and multiplications of l-bit numbers (mod n).\nAsymptotically, the best classical result for gate arrays for multiplication is the Sch¨onhage–Strassen algorithm\n[Sch¨onhage and Strassen 1971, Knuth 1981, Sch¨onhage 1982]. This gives a gate array\nfor integer multiplication that uses O(l log l log log l) gates to multiply two l-bit numbers.\nThus, asymptotically, modular exponentiation requires O(l2 log l log log l) time. Making\nthis reversible would na¨ıvely cost the same amount in space; however, one can reuse the\nspace used in the repeated squaring part of the algorithm, and thus reduce the amount\nof space needed to essentially that required for multiplying two l-bit numbers; one simple\nmethod for reducing this space (although not the most versatile one) will be given later\nin this section. Thus, modular exponentiation can be done in O(l2 log l log log l) time\nand O(l log l log log l) space."}, {"title": "Bài B", "text": "Harvest-Now, Decrypt-Later - A Temporal Cybersecurity Risk in the Quantum Transition"}, {"title": "Đoạn của bài B", "text": "computation of discrete logarithms on a quantum computer, implying that both RSA and\nelliptic-curve cryptography (ECC) would collapse once scalable quantum hardware becomes available [1,2]. Recent advances in quantum resource estimation have accelerated\nthis timeline. Notably, Google researchers reported that factoring a 2048-bit RSA modulus\ncould require only about one million noisy qubits and a week of runtime. This is a dramatic\nreduction from earlier twenty-million–qubit projections [12].\nSymmetric cryptography remains comparatively resilient, yet Grover’s algorithm\noffers a quadratic speed-up for brute-force key search, effectively halving the security\nmargin of symmetric ciphers [13]. To compensate, doubling key lengths such as upgrading\nAES-128 to AES-256, preserves equivalent post-quantum strength [14]. These foundational\nbreakthroughs underpin the HNDL paradigm: adversaries can capture encrypted data"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q205", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What was the accuracy drop of the HQCNN when fed with Q-Poison attacks?"}, {"title": "Đáp án chuẩn", "text": "Their HQCNN was able to achieve an accuracy of 78.5% on clean data, but sees a 1.44x drop to just 54.6% when fed with the attacks."}, {"title": "Bài", "text": "Quantum Machine Learning for Cybersecurity"}, {"title": "Đoạn gốc (trang 8)", "text": "deep models suffered more than 85% attack success, while\nthe quantum-based methods reduced the vulnerability by\nup to 60%. Similarly, Ergu et al. [27] explored 6G\ninterference classification by integrating QML with Open\nRadio Access Network architectures. They proposed a Hybrid\nQuantum–Classical Neural Network (HQ-CNN). They used\nResNet-18 for deep feature extraction and Principal Component\nAnalysis for dimensionality reduction. By using Q-Poison\nattacks, they manipulate network state classifications. Their\nHQCNN was able to achieve an accuracy of 78.5% on clean\ndata, but sees a 1.44x drop to just 54.6% when fed with the\nattacks. Thus, defences against adversarial threats that exploit\nquantum coherence need to be strengthened further.\nFigure 3 illustrates the range of QML applications in\ncybersecurity.\nVI. ML TECHNIQUES-BASED CLASSIFICATION\nMachine Learning serves as the foundation for both classical\nand quantum approaches in cybersecurity. ML enables learning"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q206", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "By what year must software/firmware signing and TLS for web and cloud services use quantum-resistant algorithms according to NSA’s mandate?"}, {"title": "Đáp án chuẩn", "text": "by 2025"}, {"title": "Bài", "text": "A Survey of Post-Quantum Cryptography Support in Cryptographic Libraries"}, {"title": "Đoạn gốc (trang 3)", "text": "NSA mandated that certain applications adopt post-quantum\nalgorithms as early as 2025. For example, by 2025, NSS use\nof software/firmware signing and TLS for web, cloud services\nmust employ quantum-resistant algorithms, and by 2026 the\nmandate extends to traditional network equipment. NSA’s full\nguidance calls for all NSS to transition to approved PQC by\n2035, in accordance with national policy [24,25]. Civilian agencies are under similar pressure via the OMB and the Department\nof Homeland Security (DHS). DHS published a roadmap for the\ntransition to PQC that urges critical infrastructure and industry\nto start planning inventories and risk assessments now [26,27].\nIn summary, there is a clear timeline from the top: basic standards by 2024, initial deployments by 2025–2026 in critical\nareas, and a complete transition by 2035 for US federal systems, with strong encouragement that industry follows a similar\nschedule [24]. This geopolitical push increases the urgency for"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q207", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What classical optimization method is used to update the parameters θ in the TNI algorithm for QCNN?"}, {"title": "Đáp án chuẩn", "text": "Update θ via classical Adam optimizer"}, {"title": "Bài", "text": "Beyond Barren Plateaus - A Scalable Quantum Convolutional Architecture for High-Fidelity Image Classification"}, {"title": "Đoạn gốc (trang 4)", "text": "Algorithm1\nTensor\nNetwork\nInitialization\n(TNI) for QCNN\nRequire: Dataset D = {(xi, yi)}, Bond dimension χ, Initial random parameters θ0\nEnsure: Optimized parameter seeds θseed for\nQCNN\n1: Define Matrix Product State (MPS) representation of input xi →|ψ(xi)⟩MPS\n2: Map QCNN architecture to a Tree Tensor\nNetwork (TTN) operator T (θ)\n3: Initialize θ ←θ0\n4: while Classical optimization not converged\ndo\n5:\nContract TTN with MPS: P(yi|xi) =\n⟨ψ(xi)|T †(θ)HlocalT (θ)|ψ(xi)⟩\n6:\nCompute\npseudo-loss\nLTTN(θ)\nusing\ncross-entropy\n7:\nUpdate θ via classical Adam optimizer\n8:\nTruncate tensors exceeding bond dimension χ via SVD\n9: end while\n10: return θseed ←θ\n1.3\nFormalizing the Quantum Advantage\nTo rigorously evaluate whether our proposed\nmodel provides a tangible advantage over both\nbaseline quantum algorithms and classical deep\nlearning, we must benchmark it across three dimensions:\nmodel complexity, trainability, and\nterminal accuracy. Table 1 synthesizes these comparative metrics."}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q208", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the basic unit of computation in QNNs, and how does it operate?"}, {"title": "Đáp án chuẩn", "text": "The basic unit of computation in QNNs is the quantum neuron, which applies a set of gates to its input. Formula for a single-qubit gate: |ψ′⟩=U|ψ⟩, where U is the unitary matrix representing the quantum gate, and |ψ⟩ is the initial state of the qubit."}, {"title": "Bài", "text": "Quantum_Machine_Learning_A_Survey"}, {"title": "Đoạn gốc (trang 3)", "text": "J. Electrical Systems 20-6s (2024): 971-981 \n973 \nFields of Use: QNN’s are applied in machine learning, quantum chemistry, and cryptography. QCNN’s are applied \nin image processing, medical imaging, and autonomous vehicle navigation. QRNN’s are applied in financial \nforecasting, weather prediction, and bioinformatics. \nQNN’s are built upon classical neural networks with quantum gates. The basic unit of computation in QNNs is \nthe quantum neuron, which applies a set of gates to its input. \nFormula for a single-qubit gate: ∣ψ ′ ⟩=U∣ψ⟩ \nU is the unitary matrix representing the quantum gate. \n∣ψ⟩ is the initial state of the qubit. \n∣ψ ′⟩ is the final state after applying the gate. \nKey Points: Demonstrated potential for enhancing learning performance and optimization capabilities [0]. \nQCNN’s use quantum gates to perform convolution operations, which are essential for image processing. \nConvolution formula: Cij = ∑k=1N aik bkj \nWhere: \n(Cij) is the output element at position (i, j)."}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q209", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What open-source platform is mentioned to support hybrid quantum-classical algorithm design?"}, {"title": "Đáp án chuẩn", "text": "the open-source PennyLane platform"}, {"title": "Bài", "text": "Practical Challenges in Executing Shor’s Algorithm"}, {"title": "Đoạn gốc (trang 14)", "text": "the open-source PennyLane platform to support hybrid quantum-classical algorithm design.\nSystem scale, error rates and error correction\nFor context, earlier resource estimates suggest that factoring a 2048-bit RSA modulus using a relatively direct implementation of Shor’s\nalgorithm would require on the order of 8.4 million physical qubits [40], assuming that they can be\noperated with sufficiently low error rates and long coherence times. More recent analyses, which\nincorporate algorithmic improvements and more efficient QEC pipelines, reduce this requirement\nbut still call for very large, high-quality devices [21, 22, 23].\nIt is important to emphasize that qubit count alone is an incomplete measure of progress. For\nShor’s algorithm and many other applications, critical parameters include gate and measurement\nerror rates, clock speed, qubit connectivity, and the overhead of the chosen QEC code."}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q210", "title": "multi-hop", "blocks": [{"title": "Câu hỏi", "text": "How does the challenge of crypto-agility and migration pathways in Post-Quantum Cryptography relate to the broader challenge of securing asymmetric infrastructures and refreshing symmetric protocols discussed in the context of Harvest-Now, Decrypt-Later? Provide examples from both passages."}, {"title": "Đáp án chuẩn", "text": "The challenge of crypto-agility and migration pathways in Post-Quantum Cryptography, as highlighted by NIST and industry groups, requires phased deployment strategies and hybrid solutions. Similarly, the broader challenge in Harvest-Now, Decrypt-Later involves securing asymmetric infrastructures and refreshing symmetric protocols, which is complicated by the need for harmonized international policy and coordinated trust anchor management across heterogeneous stacks. Both passages emphasize the importance of strategic planning and phased rollouts to avoid fragmented deployments and ensure the security and efficiency of cryptographic systems."}, {"title": "Bài A", "text": "Harvest-Now, Decrypt-Later - A Temporal Cybersecurity Risk in the Quantum Transition"}, {"title": "Đoạn của bài A", "text": "also demands doubled key sizes to maintain equivalent margins [13]. The broader\nchallenge is therefore twofold: securing asymmetric infrastructures and refreshing\nsymmetric protocols. Without harmonized international policy, adoption will remain\nfragmented and long-lived data will remain exposed to deferred decryption.\nIn practice, migration bottlenecks concentrate in global PKI that anchor TLS, VPNs, and\ncode signing. Coordinating trust anchors, certificate profiles, and validation logic across\nheterogeneous stacks is organizationally harder than deploying new algorithms [3,40].\nENISA highlights planning, inventory, and staged rollouts to avoid fractured deployments\nacross critical services [4,25].\nEffective policy therefore couples cryptographic modernization with governance of\nkey lifecycles, inventories of cryptographic dependencies, and procurement levers that\nenforce algorithm agility. Without such measures, institutional inertia risks extending the"}, {"title": "Bài B", "text": "Post-Quantum Cryptography and Quantum-Safe Security"}, {"title": "Đoạn của bài B", "text": "including multivariate and isogeny-based cryptography, have already experienced major setbacks\nafter high-profile breaks [16, 20, 85], underscoring the importance of deeper theoretical analysis\nand diversification beyond a narrow set of assumptions. Second, side-channel resistance and implementation security remain critical gaps. Even standardized schemes such as Dilithium have been\nshown to be vulnerable to sophisticated side-channel and fault-injection attacks under improper\ndeployment conditions [59, 96]. The design of lightweight, provably secure countermeasures that\npreserve efficiency is particularly pressing for hardware accelerators and embedded systems. Third,\nthe challenge of crypto-agility and migration pathways is unresolved. As emphasized by NIST\nand industry groups [69, 95], replacing classical algorithms in large-scale infrastructures such as\nTLS, PKI, and financial systems will require phased deployment strategies, hybrid solutions, and"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q211", "title": "multi-hop", "blocks": [{"title": "Câu hỏi", "text": "How does the non-profiled CPA attack on Kyber perform in terms of power trace requirements, and which Kyber implementation is suitable for KEM in terms of power consumption and execution time according to the survey?"}, {"title": "Đáp án chuẩn", "text": "The non-profiled CPA attack on Kyber requires a total number of power traces between 660 and 900. According to the survey, the Kyber implementation is suitable for KEM if power consumption or execution time is an issue."}, {"title": "Bài A", "text": "An Improved Two-Step Attack on Lattice-Based Cryptography - A Case Study of Kyber"}, {"title": "Đoạn của bài A", "text": "for the slight increase in time taken at the high security level\nis the high parallelism of Step1 and the duration of Step2\nfluctuates around 5 minutes. It is worth noting that reducing\nthe parallelism will increase the time required for Kyber-768\nand Kyber-1024, but the success rate remains unaffected.\nTable II shows the comparison results of SCAs on Kyber\nto recover SK-128. The attack types include the profiled\nSPA [13], profiled TA [14], non-profiled SPA [15], and nonprofiled CPA [7], [8]. Our method belongs to the non-profiled\nCPA, which does not cost extra training step. Moreover, we\nonly adopt random ciphertext, and thus we do not need extra\neffort like the oracle-based assistance to apply to the KEM\nscheme [2]. The restriction ciphertext CPA requires oraclebased assistance to be applied to the KEM scheme. For the\nperformance, as shown in the table, the total number of\nrequired power traces of ours is [11, 15] × 60 = [660, 900],"}, {"title": "Bài B", "text": "Post-Quantum_Blockchain_Security_for_the_Internet_of_Things_Survey_and_Research_Directions"}, {"title": "Đoạn của bài B", "text": "that the Kyber and NewHope implementations are suitable for\nKEM if power consumption or execution time is an issue,\nwhereas the Kyber and ThreeBears algorithms are the best\noptions if memory utilization is the main issue. When it came\nto signature algorithms, the target device’s RAM limitations\nwere exceeded by the majority of post-quantum signature\nschemes. Hence, they were unable to benchmark any of the\nalgorithms.\nEven though Kyber stands out as a strong candidate for use\nin KEM according to NIST standards and the experimental\nﬁndings presented in this section, it might not currently even\nbe required to use KEMs to make the entire PKI quantum\nsecure in many cases. Quantum attackers are more likely\nto target widely used certiﬁcates, such as root or server\ncertiﬁcates, than speciﬁc client certiﬁcates, mainly due to the\nhigh costs associated with quantum computing, particularly\nin its early stages. Consequently, a hybrid PKI approach"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q212", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What type of algorithms are included in the NIST's first cohort of post-quantum cryptography algorithms for standardization?"}, {"title": "Đáp án chuẩn", "text": "The standardized algorithms are: one key encapsulation mechanism (KEM) and two digital signature schemes."}, {"title": "Bài", "text": "Are Enterprises Ready for Quantum-Safe Cybersecurity"}, {"title": "Đoạn gốc (trang 3)", "text": "implementations like QKD. Key questions include: Have viable standards emerged? Are these\nsolutions commercially available and easily integrable?\nWhat technical limitations or open\nchallenges remain?\n2.1\nPost-Quantum Cryptography Standards and Performance\nThe most significant progress in quantum-resistant security has come from post-quantum cryptography [14]. Unlike quantum cryptography, PQC does not require exotic hardware; it consists\nof classical algorithms (for encryption, key exchange, and digital signatures) designed to be secure against quantum attacks [15, 16]. After a worldwide call and competition lasting since\n2016, NIST selected its first cohort of PQC algorithms for standardization in July 2022 [17]. By\nAugust 2024, NIST released the finalized standards for three algorithms (designated FIPS 203,\n204, 205) covering one key encapsulation mechanism (KEM) and two digital signature schemes.\nThe standardized algorithms are:"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q213", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What quantum machine learning (QML) classifier is used by Liao et al. (2025) to improve the secret key rate and system performance in the High-rate Discretely Modulated CV-QKD protocol?"}, {"title": "Đáp án chuẩn", "text": "QKNN classiﬁer is used to improve secret key rate and system performance"}, {"title": "Bài", "text": "Quantum key distribution through quantum machine learning - a research review"}, {"title": "Đoạn gốc (trang 4)", "text": "protocols\nHigh-rate Discretely Modulated CV-QKD\nUsing QML)\nLiao et al. (2025)\nQKNN classiﬁer is used to improve secret key\nrate and system performance\nQkNN-based CVQKD not only enhances the\nCVQKD protocol but also introduces a novel\napproach for integrating other quantum\nmachine learning techniques into the CVQKD\ndomain\nResource requirements and security issues are\ncritical constraints\nThe proposed QkNN is not the only effective\nquantum classiﬁer that can be used to enhance\nCVQKD when integrated with the proposed\nprocessing architecture\nMachine-learning-based anomaly detection\n(Corli et al., 2024)\nApplying supervised, unsupervised, and\nreinforcement learning, advancements in\nmachine learning enhance anomaly detection\nA clear comparison with classical algorithms is\nessential\nEmpirical Risk-aware Machine Learning on\nTrojan-Horse Detection for Trusted QKD\nNetworks (Chou et al., 2024)\nAdvancements in QML enhance the detection\nof various attacks, further improving the"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q214", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the optimization formula used in QVA, and what do the symbols represent?"}, {"title": "Đáp án chuẩn", "text": "Optimization formula : min U ⟨Ψ∣H∣Ψ⟩ Where: H is the Hamiltonian operator. |Ψ⟩ is the trial wavefunction. U is the unitary operator representing quantum state."}, {"title": "Bài", "text": "Quantum_Machine_Learning_A_Survey"}, {"title": "Đoạn gốc (trang 5)", "text": "J. Electrical Systems 20-6s (2024): 971-981 \n975 \nDescription: Quantum versions of variational algorithms, such as the Variational Quantum Eigensolver (VQE), \nused for solving optimization problems and quantum chemistry simulations. \nUse Cases: Solving complex optimization problems and quantum chemistry simulations. \nFields of Use: Applied in optimization, logistics, and quantum chemistry. \nQVA uses quantum states to optimize a cost function. \nOptimization formula : min U ⟨Ψ∣H∣Ψ⟩ \nWhere: \nH is the Hamiltonian operator. \n∣Ψ⟩ is the trial wavefunction. \nU is the unitary operator representing quantum state. \n \nFig 1. Quantum Variational Circuits \nQuantum Boltzmann Machine Algorithms \nDescription: Quantum versions of Boltzmann machines, used for unsupervised learning of hidden variables and \nenergy landscapes. \nUse Cases: Unsupervised learning, clustering, and pattern recognition. \nFields of Use: Applied in quantum chemistry, data mining, image segmentation, and anomaly detection."}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q215", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What specific attack demonstrated a full key recovery on the SIDH protocol in 2022?"}, {"title": "Đáp án chuẩn", "text": "The 2022 attack on the SIDH protocol [186] demonstrated a full key recovery using a novel application of Kani’s reducibility criterion."}, {"title": "Bài", "text": "A_Comprehensive_Survey_on_Pre_Versus_Post_Quantum_Security_Schemes_for_5G-Enabled_IoT_Applications"}, {"title": "Đoạn gốc (trang 21)", "text": "to understand due to the complexity of the mathematical\nproblems they rely on. The 2022 attack on the SIDH\nprotocol [186] demonstrated a full key recovery using a\nnovel application of Kani’s reducibility criterion. This attack\nexploited structural weaknesses in SIDH, specifically the\npublic exposure of torsion point images and the use of starting\nelliptic curves with known endomorphism rings. It broke\nall known SIDH parameter sets—including SIKEp434,\na NIST Level 1 candidate—in under 10 minutes on a single\ncore. As a result, SIDH and its instantiation SIKE were\nwithdrawn from post-quantum standardization efforts. This\nvulnerability reshapes the narrative around ‘‘quantum safety’’\nby highlighting that post-quantum cryptographic systems,\nVOLUME 13, 2025\n159325"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q216", "title": "multi-hop", "blocks": [{"title": "Câu hỏi", "text": "How does the performance of Shor’s algorithm on NISQ hardware compare to the theoretical requirements for factoring larger numbers, according to the challenges faced by variational quantum algorithms on NISQ devices?"}, {"title": "Đáp án chuẩn", "text": "Shor’s algorithm on NISQ hardware, as demonstrated on a public IBM quantum device, could only factor small integers like 15 and 21, despite the theoretical potential for exponential speedup in factoring numbers. The current state-of-the-art NISQ devices, with 50 to 100 qubits, are not yet capable of achieving the quantum advantage required for practical applications, indicating that significant engineering and algorithmic advances are still needed."}, {"title": "Bài A", "text": "Practical Challenges in Executing Shor’s Algorithm"}, {"title": "Đoạn của bài A", "text": "modulus in about 8 hours would require approximately 20 million physical qubits, assuming a 1 µs\nsurface-code cycle time. More recent work [22] explores improved qubit architectures and decoding\napproaches that might reduce both qubit counts and runtime. At the same time, experimental QEC\ndemonstrations such as [43] show that current decoding times can be significantly longer (70 µs)\nthan qubit coherence times, indicating that substantial engineering and algorithmic advances are\nstill needed before these estimates can be realized in practice.\n7\nConclusion\nWe evaluated the practical performance of Shor’s algorithm on noisy intermediate-scale quantum\n(NISQ) hardware using a public IBM quantum device. Despite significant increases in available\nqubits, our experiments were only able to factor very small integers such as 15 and 21 – the same\nnumbers that were demonstrated on much smaller quantum systems over two decades ago."}, {"title": "Bài B", "text": "Variational quantum algorithms"}, {"title": "Đoạn của bài B", "text": "build the necessary physical hardware. For example, with\nan exponential speedup over classical methods, quantum\nalgorithms could factor numbers [1], simulate quantum\nsystems [2], or solve linear systems of equations [3].\nIn 2016, access to the ﬁrst cloud-based quantum computer [4] became available, but noise and qubit limitations prevented serious implementations of the aforementioned quantum algorithms [5]. However, excitement\ngrew as to what could be done with these new devices,\nwhich have been called Noisy Intermediate-Scale Quantum (NISQ) computers [6]. Current state-of-the-art device size ranges from 50 to 100 qubits which allows one\nto achieve ‘quantum supremacy’: outperforming the best\nclassical supercomputer, for certain contrived mathematical tasks [7, 8].\nNevertheless, the true promise of quantum computers,\nspeedup for practical applications, which is often called\nquantum advantage, has yet to be realized. Moreover, the"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q217", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the task of simulating a many-particle quantum system considered by physicists as a place to look for problems that are classically hard and quantumly easy?"}, {"title": "Đáp án chuẩn", "text": "For a physicist seeking problems which are classically hard and quantumly easy, the natural place to look is the task of simulating a many-particle quantum system."}, {"title": "Bài", "text": "Quantum Computing in the NISQ era and beyond"}, {"title": "Đoạn gốc (trang 3)", "text": "problems we probably can’t do much better than exhaustively searching for a solution.\nQuantum computers can speed up exhaustive search [6], but only modestly [7], so NPhard problems are likely to be quantumly hard as well as classically hard.\nFor a physicist seeking problems which are classically hard and quantumly easy, the\nnatural place to look is the task of simulating a many-particle quantum system. As two\ngreat physicists, Bob Laughlin and David Pines, put it some years ago [8], we have a “theory of everything that is relevant to ordinary life.” We have high conﬁdence this theory\nis correct, and we can write down the equations precisely — they are the equations that\ndescribe how atomic nuclei and electrons interact electromagnetically. But we can’t solve\nthose equations. And so as Laughlin and Pines put it: “We have a theory of everything only\nto discover that it has revealed exactly nothing about many things of great importance.”"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q218", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What hybrid learning framework is explored in the study by Ref. [11] for intelligent firewall with QML?"}, {"title": "Đáp án chuẩn", "text": "Hybrid behavioral analysis + QML + GNNs"}, {"title": "Bài", "text": "Quantum Machine Learning for Cybersecurity"}, {"title": "Đoạn gốc (trang 3)", "text": "3\nTable I: Comparison of related surveys on Quantum Machine Learning (QML) in Cybersecurity\nRef.\nPrimary Focus\nKey Contributions\nLimitations\nHybrid\nTax.\nApps.\nBench.\n[9]\nML\napplications\nof\nQuantum\nComputing\nSystematic survey of 32 studies\nintegrating QC with ML; covers\nQSVM, QNN, QCNN, and\nhybrid learning frameworks\nBroad and theoretical;\nlimited domain-specific\nfocus on cybersecurity\nor benchmark analysis\n×\n◦\n◦\n×\n[12]\nQML\nfor\nMalicious URL\nDetection\nComparative\nstudy\nof\nQSVM/QCNN vs. SVM/CNN\non\nphishing\nand\nURL\ndatasets;\nhighlights\nearly\nQML feasibility\nSingle-task\nfocus;\nlacks\nscalability,\ntaxonomy, and broader\ncybersecurity coverage\n×\n×\n◦\n✓\n[10]\nQML\nfor\nCybersecurity\nAudits\nExplores QNN, QSVM, and\nQPCA for anomaly detection;\nconceptual hybrid designs\nTheoretical orientation;\nlacks\nreal-world\nvalidation\nand\ncross-domain\nintegration\n✓\n◦\n×\n×\n[11]\nIntelligent\nFirewall\nwith\nQML\nHybrid\nbehavioral\nanalysis\n+ QML + GNNs; improved\nmalware detection\nApplication-specific;\nlimited taxonomy and"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q219", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What quantum components are integrated into the generator and discriminator networks of HQ-DCGAN for ECG signal generation?"}, {"title": "Đáp án chuẩn", "text": "The model integrates quantum convolutional layers and parameterized quantum circuits into both generator and discriminator networks."}, {"title": "Bài", "text": "A Survey of Quantum Generative Adversarial Networks"}, {"title": "Đoạn gốc (trang 18)", "text": "a quantum fully connected layer to enhance model expressivity. Additionally, a binary\nsearch strategy integrated into QAE boosts computational efficiency by narrowing\namplitude search space. Simulation results based on the EU Emissions Trading System\nshow that this framework significantly improves both accuracy and performance\nover classical methods, positioning it as a promising approach for quantum-enhanced\nfinancial risk analysis.\nTo address class imbalance in ECG datasets-a common barrier in developing\nrobust diagnostic tools-HQ-DCGAN introduces a hybrid quantum-classical GAN\narchitecture tailored for synthetic ECG signal generation [82]. The model integrates\nquantum convolutional layers and parameterized quantum circuits into both generator\nand discriminator networks, enhancing feature extraction and leveraging quantum\nresources efficiently. It maintains the expressive power and scalability of classical deep"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q220", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "Which major technologies now have beta support for Post-Quantum Cryptography (PQC)?"}, {"title": "Đáp án chuẩn", "text": "major VPN vendors and TLS libraries now have beta support for PQC."}, {"title": "Bài", "text": "Are Enterprises Ready for Quantum-Safe Cybersecurity"}, {"title": "Đoạn gốc (trang 11)", "text": "is improving: major VPN vendors and TLS libraries now have beta support for PQC. The\necosystem is catching up – e.g., OpenSSL 3.0+ includes support for certain PQC algorithms, and\nnew versions of programming languages and libraries are starting to bundle in PQC as optional\n[27,69]. Still, early adopters often have to do extra integration testing, and enterprises that lack\nstrong R&D divisions may prefer to wait for more off-the-shelf solutions. A report noted that\nmany organizations plan to rely on their vendors to “bake in” quantum safety once it’s ready;\nin other words, they expect cloud service providers, software vendors (databases, operating\nsystems), and network appliance vendors to handle the heavy lifting, delivering updates that\nthe enterprise can then just apply [70]. This expectation is reasonable to a degree – indeed,\ncloud and software vendors are working on it – but the timeline is uncertain. If all users wait for"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q221", "title": "multi-hop", "blocks": [{"title": "Câu hỏi", "text": "How can Quantum Machine Learning (QML) algorithms, such as those used in quantum key distribution (QKD), contribute to improving the efficiency and security of quantum communication networks, and what are some potential applications of QML in high-frequency trading strategies as mentioned in the surveys?"}, {"title": "Đáp án chuẩn", "text": "QML algorithms can improve the efficiency and security of quantum communication networks by enhancing the key generation process in QKD, identifying trends in errors, and applying corrections. On the other hand, QML, with its ability to handle complex, high-dimensional data, shows potential advantages in high-frequency trading strategies, particularly in real-time market data analysis, compared to traditional approaches."}, {"title": "Bài A", "text": "Quantum key distribution through quantum machine learning - a research review"}, {"title": "Đoạn của bài A", "text": "beyond QKD, quantum random number generation, Quantum Secure MultiParty Computation (QSMPC), Quantum Homomorphic Encryption (QHE), and\nprivacy-preserving computation. QML algorithms improve the key generation of\nQKD, by improving quantum state selection and reducing measurements. This\nalso allows them to increase efﬁciency because it identiﬁes trends in errors and\napplies corrections, making quantum cryptography a more dependable option.\nWith intelligent processing machine learning is excellent at handling complex,\nhigh-dimensional data-this may provide a viable strategy for enhancing QKD\nperformance and increasingly real-world secure quantum communication\nnetworks.\nThis\nreview\nwill\nexplore\ncurrent\nresearch\ngaps\nand\nfuture\ndevelopments in QKD, security analysis of QKD protocols, and eavesdropping\ndetection by leveraging various QML algorithms.\nKEYWORDS\nquantum\ncryptography\n(QC),\nquantum\nmachine\nlearning\n(QML),\nquantum\nkey"}, {"title": "Bài B", "text": "Quantum_Machine_Learning_A_Survey"}, {"title": "Đoạn của bài B", "text": "environments. \nHigh-frequency trading strategies based on real-time market data showed potential advantages of quantum \nfinancial algorithms compared to traditional approaches. \nV. CONCLUSION \nThe study of Quantum Machine Learning (QML) is poised to revolutionize the field of machine learning, \nleveraging the power of quantum mechanics to enhance computational capabilities and solve complex problems \nmore efficiently. The selection of specific quantum algorithms, such as Grover's Algorithm, Quantum Walks, \nHarrow-Hassidim-Lloyd Algorithm, Variational Quantum Eigen solver (VQE), Quantum Annealing Algorithms, \nQuantum Variational Circuit, and Amplitude Amplification Algorithms, reflects the cutting-edge nature of QML \nand its potential to address the limitations of classical computing systems. \nIn conclusion, the research aims to demonstrate the feasibility and benefits of using quantum algorithms in"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q222", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What function is used to return the required amount of key material requested for a specific KSID?"}, {"title": "Đáp án chuẩn", "text": "The GET_KEY function returns the required amount of key material requested for specific KSID."}, {"title": "Bài", "text": "Quantum Key Distribution Networks -- Key Management - A Survey"}, {"title": "Đoạn gốc (trang 8)", "text": "destination KM and QoS available in the path of multiple KMs. This, however, is outside the scope of ETSI QKD 004.\nOnce the key stream session is established or permitted, the calling SAE, for example, SAE-A, is granted a Key Stream\nIDentifier (KSID) used in subsequent key requests. To maintain the promised level of service, KM is responsible for\nmanaging and reserving keys for active key stream sessions. The QoS parameters that can be agreed upon are key size,\nmaximum and minimum (requesting) key rate in bits per second (bps), jitter of key delivery, and priority level. The\nGET_KEY function returns the required amount of key material requested for specific KSID while the CLOSE function\nallows SAEs to end and terminate key stream sessions.\nAnother interesting notion discussed in ETSI QKD 004 is the organization of the key management layer. Each QKD\nmodule has its own key management unit, and a higher-level Key Server communicates with multiple QKD modules"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q223", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What are the challenges faced by neutral atom platforms in executing Shor’s Algorithm?"}, {"title": "Đáp án chuẩn", "text": "These systems promise high scalability, as atoms, like ions, are identical and can be arranged in dense arrays. At the same time, comparably weak trapping restricts interactions to nearest neighbors, requiring time-consuming qubit rearrangements, and makes these systems highly sensitive to losses from collisions with background gas. Precise control over large arrays remains a challenge because of the need for very high laser powers for optical trapping, combined with complex optical setups for rearrangements."}, {"title": "Bài", "text": "Practical Challenges in Executing Shor’s Algorithm"}, {"title": "Đoạn gốc (trang 4)", "text": "are relatively slow, and scaling brings challenges due to the complexity trap architectures and laser\ndelivery.\nNeutral atom platforms trap individual atoms in optical potentials generated by tightly focused\nlaser beams or optical latices.\nThese systems promise high scalability, as atoms, like ions, are\nidentical and can be arranged in dense arrays.\nAt the same time, comparably weak trapping\nrestricts interactions to nearest neighbors, requiring time-consuming qubit rearrangements, and\nmakes these systems highly sensitive to losses from collisions with background gas. Precise control\nover large arrays remains a challenge because of the need for very high laser powers for optical\ntrapping, combined with complex optical setups for rearrangements.\nPhotonic quantum computing systems use the quantum properties of light to encode qubits."}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q224", "title": "multi-hop", "blocks": [{"title": "Câu hỏi", "text": "How does the Steane QEC method improve logical fidelities compared to flag-based QEC, and what is the significance of the 'below threshold' error rates in the context of quantum error correction?"}, {"title": "Đáp án chuẩn", "text": "The Steane QEC method improves logical fidelities for bit-flip and phase-flip repetition codes of distances 3 and 5, as well as for the 7-qubit color code, outperforming flag-based QEC approaches under similar conditions, particularly for logical input states |0⟩L. The 'below threshold' error rates indicate that quantum error correction begins to suppress errors rather than amplifying them, which is significant for the practical implementation of fault-tolerant quantum computation."}, {"title": "Bài A", "text": "QUANTUM KEY DISTRIBUTION - Bridging Theoretical Security Proofs, Practical Attacks, and Error Correction"}, {"title": "Đoạn của bài A", "text": "fault-tolerant quantum computation. The transversal CNOT operation copies errors onto the auxiliary logical\nqubit,\nCNOT\n\u0000Xdata\ni\n⊗I\n\u0001\n|ψ⟩L ⊗|+⟩L =\nXdata\ni\n|ψ⟩L ⊗Xaux\ni\n|+⟩L.\n(115)\nLogical fidelities are evaluated as probabilities of recovering the encoded state within the correction capabilities\nof the code. This work is one of the initial works exploring the experimental implementation of experimental\napplication of Steane syndrome extraction for error correction. This method should reduce errors introduced\nby the coupling mechanism and simplify syndrome extraction by using projective measurements.\nThe implementation demonstrated improvements in logical fidelities for bit-flip and phase-flip repetition codes\nof distances 3 and 5, as well as for the 7-qubit color code. The Steane QEC outperformed flag-based QEC\napproaches under similar conditions, particularly for logical input states |0⟩L The advantage of Steane QEC"}, {"title": "Bài B", "text": "harvest-now-decrypt-later-pqc-threat-model"}, {"title": "Đoạn của bài B", "text": "“below threshold” error rates, where quantum error correction begins to suppress errors\nrather than amplifying them.\n• Qubit Scaling: All major quantum hardware approaches (superconducting qubits, trapped\nions, photonic systems, topological qubits) report steady improvement in qubit counts and\ncoherence times.\n• Industry Roadmaps: IBM, Google, IonQ, PsiQuantum, Rigetti, and other vendors have\npublished specific roadmaps targeting small fault-tolerant quantum computers (tens to\nhundreds of logical qubits) by 2027-2030 25, 26.\n25 Google AI Quantum. (2023). “Suppressing quantum errors by scaling a surface code logical qubit.” Nature,\n614(7949), 676-681. DOI: 10.1038/s41586-022-05434-1\n26 Rigetti Computing. (2024). “Rigetti Quantum Cloud Services.” Available: https://www.rigetti.com/\n9"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q225", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What type of attack could increase the harvestable ciphertext vulnerability by forcing the use of weaker algorithms?"}, {"title": "Đáp án chuẩn", "text": "Protocol downgrade attacks: Adversaries forcing use of weaker algorithms (e.g., TLS 1.2 instead of TLS 1.3) could increase harvestable ciphertext vulnerability."}, {"title": "Bài", "text": "Harvest-Now, Decrypt-Later - A Temporal Cybersecurity Risk in the Quantum Transition"}, {"title": "Đoạn gốc (trang 18)", "text": "also be influenced by:\n•\nSide-channel vulnerabilities: Implementation flaws in current PQC algorithms could\naccelerate compromise timelines independent of quantum hardware development.\n•\nKey management failures: Inadequate key rotation, weak random number generation,\nor compromised key storage could enable decryption without quantum capabilities.\n•\nProtocol downgrade attacks: Adversaries forcing use of weaker algorithms (e.g., TLS\n1.2 instead of TLS 1.3) could increase harvestable ciphertext vulnerability.\n•\nHybrid implementation flaws: Incorrect hybrid key exchange implementations might\ncreate attack vectors that bypass one protection layer.\nThese factors could reduce effective Ha(t) values below the theoretical quantum\nbreaking timeline, emphasizing the need for defense-in-depth approaches that combine\nalgorithm migration with implementation security and protocol hardening."}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q226", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the size range of signatures for SPHINCS+ and what is a notable characteristic of this scheme?"}, {"title": "Đáp án chuẩn", "text": "Signature sizes for SPHINCS+ vary widely, from 8 to 30 kilobytes, and the scheme is computationally intensive, both for key generation and signature generation."}, {"title": "Bài", "text": "A Comparative Study of Classical and Post-Quantum Cryptographic Algorithms in the Era of Quantum Computing"}, {"title": "Đoạn gốc (trang 6)", "text": "advantage lies in the compact size of its cryptographic elements: signatures are\nas small as 666 bytes and public keys are about 897 bytes. Despite these benefits,\nFalcon’s mathematical complexity and sensitivity to implementation subtleties\nmake it a more challenging option for developers. Nonetheless, it stands out\nas one of the most space-efficient quantum-safe signature schemes and was also\nselected by NIST for future standardization.\n3.5\nSPHINCS+ (Hash-Based Signature)\nSPHINCS+ represents a fundamentally different approach. As a stateless, hashbased digital signature scheme, it relies on well-established cryptographic hash\nfunctions and avoids mathematical structures like lattices altogether. This approach ensures security even in the face of quantum computing advancements,\nthough it comes at the cost of performance. Signature sizes vary widely, from\n8 to 30 kilobytes, and the scheme is computationally intensive, both for key"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q227", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What did Deutsch define in order to study the question of whether using quantum mechanics in a computer allows one to obtain more computational power?"}, {"title": "Đáp án chuẩn", "text": "Deutsch defined both quantum Turing machines and quantum circuits and investigated some of their properties."}, {"title": "Bài", "text": "Polynomial-Time Algorithms for Prime Factorization and Discrete Logarithms on a Quantum Computer"}, {"title": "Đoạn gốc (trang 4)", "text": "quantum mechanical principles to avoid this problem, thus implicitly asking the converse\nquestion: by using quantum mechanics in a computer can you compute more eﬃciently\nthan on a classical computer? Deutsch [1985, 1989] was the ﬁrst to ask this question\nexplicitly. In order to study this question, he deﬁned both quantum Turing machines\nand quantum circuits and investigated some of their properties.\nThe question of whether using quantum mechanics in a computer allows one to\nobtain more computational power was more recently addressed by Deutsch and Jozsa\n[1992] and Berthiaume and Brassard [1992a, 1992b]. These papers showed that there\nare problems which quantum computers can quickly solve exactly, but that classical\ncomputers can only solve quickly with high probability and the aid of a random number\ngenerator. However, these papers did not show how to solve any problem in quantum\npolynomial time that was not already known to be solvable in polynomial time with"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q228", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the principle of adversarial training between two neural networks in classical GANs?"}, {"title": "Đáp án chuẩn", "text": "Classical GANs operate on the principle of adversarial training between two neural networks."}, {"title": "Bài", "text": "A Survey of Quantum Generative Adversarial Networks"}, {"title": "Đoạn gốc (trang 2)", "text": "future exploration in this rapidly evolving field. We explore the theoretical foundations\nof QGANs, examine various implementation approaches, survey application domains,\nanalyze technical challenges and solutions, identify research trends, and discuss promising future directions. Our analysis reveals a field that has gained significant momentum\nsince its foundation in 2018, with research evolving from theoretical foundations to\npractical implementations across diverse application domains. While image generation\nremains the dominant application, significant attention is also given to drug discovery,\nfinancial applications, and scientific simulations. The field faces unique challenges,\nincluding quantum noise, barren plateaus, and hardware limitations, but researchers\nare developing innovative solutions to address these issues.\n2 Theoretical Foundations of QGANs\n2.1 From Classical to Quantum GANs\nClassical GANs operate on the principle of adversarial training between two neural"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q229", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the key generation rate in the new method proposed in the paper, and how does it compare to the prior art methods for secure QKD?"}, {"title": "Đáp án chuẩn", "text": "The key generation rate in the new method is O(η) where η is the overall transmission probability of the channel. In comparison, in prior art methods for secure QKD, µ is chosen to be of order O(η), thus giving a net key generation rate of O(η2)."}, {"title": "Bài", "text": "Decoy State Quantum Key Distribution"}, {"title": "Đoạn gốc (trang 3)", "text": "(11)) with the\nprior art GLLP result (given in Eq. (12)), we see that\nthe main diﬀerence is that in our result, a much better\nlower bound on Ωand a much better upper bound on e1\ncan be obtained.\nImplication of our result\nWe obtain substantially\nhigher key generation rate than in [6]. In more detail,\nnote that, from Eq. (6), Yn for n > 2 is of similar order\nto Y1. Therefore, from Eq. (11) it is now advantageous\nfor Alice to pick the average photon number in her signal\nstate to be µ = O(1). Therefore, the key generation rate\nin our new method is O(η) where η is the overall transmission probability of the channel.\nIn comparison, in\nprior art methods for secure QKD, µ is chosen to be of order O(η), thus giving a net key generation rate of O(η2).\nIn summary, we have achieved a substantial increase in\nnet key generation rate from O(η2) to O(η). Moreover, as\nwill be discussed below, our decoy state method allows\nsecure QKD at much longer distances than previously\nthought possible."}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q230", "title": "multi-hop", "blocks": [{"title": "Câu hỏi", "text": "What challenges do controlled operations between qubits pose for the deployment of a QCNN on hardware with non-nearest-neighbor connectivity, and how do these challenges compare to the difficulties encountered when running Shor’s algorithm on non-IBM quantum hardware platforms?"}, {"title": "Đáp án chuẩn", "text": "Controlled operations between qubits in a QCNN can become physically distant as intermediate qubits are traced out or measured mid-circuit, requiring dynamic SWAP routing during transpilation to preserve the shallow depth of the model. This challenge is similar to the difficulties encountered when running Shor’s algorithm on non-IBM quantum hardware platforms, where generic transpilation pipelines do not succeed due to hardware-specific constraints such as different qubit topologies and native gates, necessitating hardware-specific circuit design and optimization."}, {"title": "Bài A", "text": "Beyond Barren Plateaus - A Scalable Quantum Convolutional Architecture for High-Fidelity Image Classification"}, {"title": "Đoạn của bài A", "text": "Cirq and TensorFlow Quantum to actual quantum processing units (QPUs) introduces strict\nhardware constraints.\n5.1\nHardware Topology and Circuit Transpilation\nThe primary challenge in physical deployment is\nthe geometric mapping of the QCNN’s tree-like\ntensor structure onto a two-dimensional physical\nlattice. Architectures such as the heavy-hex lattices commonly utilized in modern superconducting processors (e.g., IBM Quantum hardware)\nstrictly limit multi-qubit interactions to nearestneighbor connectivity.\nThe pooling operations Vpool defined in our architecture require controlled operations between\nqubits that may become physically distant as\nintermediate qubits are traced out or measured\nmid-circuit. To compile this algorithm for physical execution, dynamic SWAP routing must be\nimplemented during transpilation.\nFigure 8 illustrates the required deployment pipeline, emphasizing the hardware-aware compilation phase\nnecessary to preserve the shallow depth of the\nmodel.\nLogical QCNN"}, {"title": "Bài B", "text": "Practical Challenges in Executing Shor’s Algorithm"}, {"title": "Đoạn của bài B", "text": "possibly due to limits on depths or native gate sets.\nA similar attempt was made with Microsoft Azure Quantum6, which provides access to IonQ,\nQuantinuum (trapped ions), and Rigetti (superconducting circuits). Using the Q# interface, we ran\nour Qiskit-based Shor’s algorithm, but as with Braket, circuit transpilation to physical hardware did\nnot succeed, preventing us from evaluating the algorithm on non-superconducting circuit platforms.\nThese attempts highlight the difficulty of porting non-trivial quantum algorithms across heterogeneous hardware platforms using generic transpilation pipelines. Publicly available code that\nruns successfully on IBM hardware does not automatically translate to devices with different qubit\ntopologies, native gates, and other constraints. In practice, achieving reliable transpilation and execution on non-IBM platforms appears to require hardware-specific circuit design and optimization,"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q231", "title": "multi-hop", "blocks": [{"title": "Câu hỏi", "text": "How might a quantum network be advantageous in controlling a complex quantum system compared to a classical network, and what architectural feature of QCNNs could potentially enable similar efficiency gains in classical data classification tasks like image recognition, according to the passages?"}, {"title": "Đáp án chuẩn", "text": "Quantum networks could have advantages over classical ones when used to control complex quantum systems due to their ability to process quantum states. Similarly, QCNNs, which leverage quantum superposition and entanglement to achieve logarithmic depth scaling, could potentially enable efficiency gains in classical data classification tasks like image recognition, mirroring the advantages of quantum networks in quantum state control."}, {"title": "Bài A", "text": "Quantum Computing in the NISQ era and beyond"}, {"title": "Đoạn của bài A", "text": "quantum network is itself a quantum state; to get useful information we need to measure\nthe state, and we can acquire no more than log N bits of classical information in a singleshot measurement of log N qubits.\nThese bottlenecks arise when we try to train a quantum network to learn about correlations in classical data. Perhaps it is more natural to think about quantum machine\nlearning in a setting where both the input and the output are quantum states. Hence we\nmight expect a quantum network to have advantages over a classical one when used, for\nexample, to control a complex quantum system. More broadly, it seems plausible that\nquantum deep learning would be more powerful than its classical counterpart when trying\nto learn probability distributions for which quantum entanglement has a signiﬁcant role.\nThat is, quantum deep learning networks might be very well suited for quantum tasks, but\nfor applications of deep learning that are widely pursued today it is unclear why quantum"}, {"title": "Bài B", "text": "Beyond Barren Plateaus - A Scalable Quantum Convolutional Architecture for High-Fidelity Image Classification"}, {"title": "Đoạn của bài B", "text": "The intersection of quantum computing and artificial intelligence has birthed Quantum Machine\nLearning (QML), a discipline that promises to\nprocess high-dimensional datasets with efficiencies that theoretically outpace classical architectures [2].\nAmong the most promising of these\narchitectures is the Quantum Convolutional Neural Network (QCNN). Originally conceptualized\nto recognize quantum phase transitions, QCNNs\nhave since been adapted for classical data classification tasks, including image recognition and object detection [3]. By translating the translationinvariance and hierarchical feature extraction of\nclassical Convolutional Neural Networks (CNNs)\ninto the language of unitary operators and quantum circuits, QCNNs aim to leverage quantum\nsuperposition and entanglement to achieve logarithmic depth scaling with respect to input size.\nHowever, transitioning from theoretical constructs to empirical dominance has proven exceptionally difficult. Initial studies, including our"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q232", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the quantum operation complexity for breaking AES-256 using Grover’s algorithm?"}, {"title": "Đáp án chuẩn", "text": "Grover’s algorithm reduces this to approximately 2ˆ128 quantum operations, effectively halving the security strength of the key."}, {"title": "Bài", "text": "harvest-now-decrypt-later-pqc-threat-model"}, {"title": "Đoạn gốc (trang 8)", "text": "3.3.2 Grover’s Algorithm and Symmetric Key Security\nWhile Shor’s algorithm poses an\nexistential threat to asymmetric cryptography, Grover’s algorithm (published in 1996) poses a\ndifferent threat to symmetric encryption and cryptographic hash functions 23, 24.\nGrover’s algorithm solves the “unstructured search problem”: given an unsorted database or\nsearch space and an oracle function f that returns 1 for correct answers and 0 otherwise, find an\nelement for which f returns 1. Classically, this requires O(N) queries to the oracle. Grover’s\nalgorithm solves it in O(\n√\nN) queries, a quadratic speedup.\nImplications for Symmetric Encryption: Symmetric encryption (e.g., AES-256) derives\nsecurity from the difficulty of guessing the encryption key through brute force. Classically,\nbreaking AES-256 requires trying 2ˆ256 keys in the worst case. Grover’s algorithm reduces this\nto approximately 2ˆ128 quantum operations, effectively halving the security strength of the key."}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q233", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is one way adversaries can manipulate quantum-enhanced variational quantum algorithms (VQAs) to cause misclassification of data?"}, {"title": "Đáp án chuẩn", "text": "adversaries can manipulate noise or perturb circuit parameters, steering optimization toward suboptimal solutions [12]."}, {"title": "Bài", "text": "Quantum Machine Learning for 6G Network"}, {"title": "Đoạn gốc (trang 3)", "text": "key to leveraging quantum computers for solving optimization problems. However, the algorithms are susceptible to\nunique vulnerabilities due to the inherent nature of the hybrid quantum-classical optimization process. One signiﬁcant\nvulnerability is the susceptibility to adversarial perturbations\nin the parameter landscape. In quantum-enhanced versions\nof variational quantum algorithms (VQAs), adversaries can\nmanipulate noise or perturb circuit parameters, steering optimization toward suboptimal solutions [12]. As illustrated in\nFig. 2, slight modiﬁcations to the input data—crafted in QML\nmodel—could cause the algorithm to misclassify data, even\nif the perturbations are imperceptible in classical terms. Like\nin computer vision, adversaries can implant backdoor triggers\nin QML models via adversarial samples, embedding environmental patterns (e.g., metal surface gloss and temperature)\nin quantum states. With a hidden backdoor, the QML model"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q234", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the formula for calculating entanglement entropy, and what does it measure?"}, {"title": "Đáp án chuẩn", "text": "The entanglement entropy, given by S(ρA) = −Tr(ρA log ρA), can be used to quantify the amount of entanglement in the quantum state [27]."}, {"title": "Bài", "text": "A Survey of Quantum Generative Adversarial Networks"}, {"title": "Đoạn gốc (trang 6)", "text": "that might be difficult to capture with classical approaches. The entanglement entropy,\ngiven by\nS(ρA) = −Tr(ρA log ρA),\n(15)\nwhere ρA is the reduced density matrix of subsystem A, can be used to quantify the\namount of entanglement in the quantum state [27]. Additional works demonstrated\nproof-of-concept fully quantum implementations on small-scale quantum devices or\nsimulators, showing promise for future development as quantum hardware advances [4,\n28].\n3.2 Hybrid Quantum-Classical Approaches\nHybrid quantum-classical approaches represent a pragmatic middle ground, leveraging\nquantum components where they might offer advantages while using classical computation for other aspects. These approaches are particularly relevant for near-term\nquantum devices with limited qubit counts and coherence times. Common hybrid\narchitectures include:\nQuantum Generator with Classical Discriminator: In this approach, a quantum"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q235", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the formula for calculating Riskorg in the HNDL Model Extension 1?"}, {"title": "Đáp án chuẩn", "text": "Riskorg = ∑<sub>i=1<\/sub><sup>n
