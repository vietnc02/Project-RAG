nsafeguarding against classical threats, but quantum-enhanced\nones. In their work, Oyebode et al. [17] report that as quantum\nhardware advances, QML is expected to become central\nto securing telecommunication infrastructures against both\nclassical and quantum-enabled threats. QML can use quantum"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q127", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "How many different random permutations are generated in the RPG module, and what are their ranges?"}, {"title": "Đáp án chuẩn", "text": "There are five different random permutations to be generated, which are 00 ∼3f, 40 ∼7f, 00 ∼7f, 80 ∼bf, and c0 ∼ff."}, {"title": "Bài", "text": "A Hardware-Friendly Shuffling Countermeasure Against Side-Channel Attacks for Kyber"}, {"title": "Đoạn gốc (trang 2)", "text": "A. Random Permutation Generator\nRPG is a module that generates random permutations from\nan ordered one. There are five different random permutations\nto be generated, which are 00 ∼3f, 40 ∼7f, 00 ∼7f,\n80 ∼bf, and c0 ∼ff. Since there is a correspondence\nbetween these permutations, it is only necessary to generate\nthe permutation 00 ∼3f, and the other permutations can be\nobtained by extending it.\nBefore introducing the hardware architecture, it is necessary\nto explain that due to the existence of overlapping addresses,\nit is necessary to impose restrictions on the first six and last\nsix elements of the randomly generated permutations to avoid\naddress conflicts. The key idea is to specially introduce a fixed\nintermediate permutation and generate the random one in two\nstages. The comparison of the shuffling methods without and\nwith adjustment are shown in Fig. 1. As explained above, if we\ndirectly use the random address permutation, there may exist"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q128", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What year does the UK NCSC mandate PQC migration by?"}, {"title": "Đáp án chuẩn", "text": "2035"}, {"title": "Bài", "text": "harvest-now-decrypt-later-pqc-threat-model"}, {"title": "Đoạn gốc (trang 55)", "text": "National Mandates 54, 55:\n• UK: NCSC mandates PQC migration by 2035\n• US: Federal mandate (OMB, NSM-10, HR 7535) requires PQC by 2030-2035\n• Germany: BSI recommends PQC adoption by 2025-2030\n• Netherlands, Austria, and other EU members: Equivalent requirements\n15.4 Liability Risks of Delayed Migration\nOrganizations delaying PQC migration face increasing liability risks:\nRegulatory Liability:\n• GDPR enforcement actions for inadequate “state of the art” encryption\n• Fines for confidentiality breaches attributable to delayed PQC migration\n• Mandatory security audits and breach notifications\nLitigation Risk 56:\n• Shareholder litigation if breaches occur from known quantum risks\n• Customer class-action litigation for privacy violations\n• Third-party litigation (e.g., hospitals for medical data breaches)\nReputational Risk:\n• Public disclosure of quantum-related breaches causes severe reputational damage\n• Loss of customer trust\n• Media coverage and public perception of recklessness"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q129", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What must be true for a VQA to be implementable in NISQ hardware?"}, {"title": "Đáp án chuẩn", "text": "The quantum circuits used to estimate C(θ) must keep the circuit depth and ancilla requirements small."}, {"title": "Bài", "text": "Variational quantum algorithms"}, {"title": "Đoạn gốc (trang 3)", "text": "3\nthat the minimum of C(θ) corresponds to the solution\nof the problem. Second, one must be able to ‘eﬃciently\nestimate’ C(θ) by performing measurements on a quantum computer and possibly performing classical postprocessing. An implicit assumption here is that the cost\nshould not be eﬃciently computable with a classical computer, as this would imply that no quantum advantage\ncan be achieved with the VQA. In addition, it is also\nuseful for C(θ) to be ‘operationally meaningful’, so that\nsmaller cost values indicate a better solution quality. Finally, the cost must be ‘trainable’, which means that it\nshould be possible to eﬃciently optimize the parameters\nθ. We will later discuss in more detail the issue of trainability for VQAs.\nFor a given VQA to be implementable in NISQ hardware, the quantum circuits used to estimate C(θ) must\nkeep the circuit depth and ancilla requirements small.\nThis is due to the fact that NISQ devices are prone to"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q130", "title": "multi-hop", "blocks": [{"title": "Câu hỏi", "text": "How do quantum machine learning algorithms, such as quantum generative models, enhance the integrity of quantum communication in the presence of collective noise, according to the methods developed by Gong et al. (2023) and the applications of QML in cybersecurity mentioned in the taxonomy by Siva Sai et al.?"}, {"title": "Đáp án chuẩn", "text": "Quantum machine learning algorithms, such as quantum generative models, can enhance the integrity of quantum communication by using decoherence-free states (DFS) against collective noise, as developed by Gong et al. (2023) in the context of multi-party semi-quantum private comparison (MQPC) protocols. In the field of cybersecurity, these algorithms can be applied to better encode and process high-dimensional structures, as discussed in the taxonomy by Siva Sai et al., potentially improving the detection and prevention of cyber threats."}, {"title": "Bài A", "text": "Quantum key distribution through quantum machine learning - a research review"}, {"title": "Đoạn của bài A", "text": "network\nchannels\nto\nﬁnd\nmany\napplications\nin\nquantum\ncommunication\nnetworks.\nMulti-party\nsemi-quantum\nprivate\ncomparison (MQPC) protocols developed by Gong et al. (2023)\nrepresent an advancement in quantum cryptography in which the\nuse of decoherence-free states (DFS) against collective noise\nmultiparty can communicate in the presence of collectivedephasing noise and collective-rotation noise which affects the\nintegrity of quantum communication.\n3 Quantum machine learning in\naugmenting quantum cryptography\nWith the integration of quantum computing into classical\nmachine learning, QML emerges as a powerful approach to\nenhance computational performance. Various classical machine\nlearning\nalgorithms,\nincluding\nsupervised\nand\nunsupervised\nlearning, beneﬁt from quantum principles, leading to improved\nefﬁciency and scalability. Unsupervised learning, particularly in\nprocessing large real-time data, has gained popularity with the\ndevelopment of quantum generative models. Several variants of"}, {"title": "Bài B", "text": "Quantum Machine Learning for Cybersecurity"}, {"title": "Đoạn của bài B", "text": "1\nQuantum Machine Learning for Cybersecurity: A\nTaxonomy and Future Directions\nSiva Sai, Ishika Goyal, Shubham Sharma, Sri Harshita Manuri,\nVinay Chamola Senior Member, IEEE, Rajkumar Buyya Fellow, IEEE\nAbstract—The increasing number of cyber threats and rapidly\nevolving tactics, as well as the high volume of data in recent\nyears, have caused classical machine learning, rules, and\nsignature-based defence strategies to fail, rendering them unable\nto keep up. An alternative, Quantum Machine Learning (QML),\nhas recently emerged, making use of computations based on\nquantum mechanics. It offers better encoding and processing of\nhigh-dimensional structures for certain problems. This survey\nprovides a comprehensive overview of QML techniques relevant\nto the domain of security, such as Quantum Neural Networks\n(QNNs), Quantum Support Vector Machines (QSVMs), Variational\nQuantum Circuits (VQCs), and Quantum Generative Adversarial\nNetworks (QGANs), and discusses the contributions of this"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q131", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the key management approach discussed in the paper aimed at facilitating?"}, {"title": "Đáp án chuẩn", "text": "to facilitate the identification of potential strategies and accelerate the future development of QKD networks"}, {"title": "Bài", "text": "Quantum Key Distribution Networks -- Key Management - A Survey"}, {"title": "Đoạn gốc (trang 1)", "text": "resources are limited, integrating QKD network services into critical infrastructures necessitates\neffective key management. As a result, this paper provides a comprehensive review of QKD network\nkey management approaches. They are analyzed to facilitate the identification of potential strategies\nand accelerate the future development of QKD networks.\nKeywords Quantum Key Distribution · Network Security · Key management · Survey\n1\nIntroduction\nSecure means of communication are becoming increasingly important as data traffic in communication networks\ngrows and more services emerge due to their integration [1]. Sustaining widespread security mechanisms based on\ncomplex mathematical problems is proving challenging. Significant advances in computing and mathematics make it\nmore challenging to ensure their security [2]. As a result, security experts have begun developing new cryptographic"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q132", "title": "multi-hop", "blocks": [{"title": "Câu hỏi", "text": "How does the suppression gain parameter in the surface code patch affect the projected costs of factoring a 2048-bit RSA integer, and how does this compare to the computational complexity trade-offs in the lattice-based cryptography attack on Kyber, particularly for different key group sizes?"}, {"title": "Đáp án chuẩn", "text": "The suppression gain parameter in the surface code patch is set to 3.5 instead of 4, making the curves more pessimistic, which affects the projected costs of factoring a 2048-bit RSA integer with less than a million noisy qubits. In contrast, for the lattice-based cryptography attack on Kyber, using 60 CPA results provides similar success to using 128, and the computational complexity increases with the dimension of the lattice problem, with 38/39 results being sufficient for a key group size of 384 but needing more for a group size of 256."}, {"title": "Bài A", "text": "How to factor 2048 bit RSA integers with less than a million noisy qubits"}, {"title": "Đoạn của bài A", "text": "dimensional parity check code (“cold storage” in this paper). The d, m, n labels indicate the surface code patch\ndiameter (d), the number of used surface code patches per yoked code instance (n), and the number yoked\ncode instances sharing lattice surgery workspace (m). This is a variant of supplementary figure 2 of [Gid+25],\nwith fit parameters rounded to one-and-a-half sig figs instead of one sig fig. I’m using this variation because I\nwas worried that the projected costs with one sig fig were too optimistic, due to rounding up the fit constants.\nSpecifically: in this figure the dimension=0 suppression gain parameter is 3.5 instead of 4, and the dimension=2\nsuppression gain parameter is 150 instead of 200, making the curves more pessimistic.\n19"}, {"title": "Bài B", "text": "An Improved Two-Step Attack on Lattice-Based Cryptography - A Case Study of Kyber"}, {"title": "Đoạn của bài B", "text": "inputs for the lattice attack. If the attack fails, the smallest input is replaced with another CPA result. This process continues\nuntil the attack succeeds or all 60 results are used, representing\na trade-off between computational complexity and success\nrate. After extensive experimentation, we found that using\n60 results provides similar success to using 128. It is also\nimportant to note that as the dimension of the lattice problem\nincreases, the computational complexity grows. For Kyber,\n38/39 results are sufficient to handle the 128 coefficients of a\nkey group. However, for Dilithium with a group size of 256,\nboth the lattice dimension and the required number of CPA\nresults will need to increase.\nIV. EXPERIMENTS\nWe run the reference implementations of Kyber-512, -768,\nand -1024 from the pqm4 library [11] with -o compilation\noptimization on a STM32F407-DISCOVERY target board at\n48 MHz. The power traces are captured using a PicoScope"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q133", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What competitive advantage can an enterprise gain by acting early in securing quantum-savvy talent?"}, {"title": "Đáp án chuẩn", "text": "acting early could also be a competitive advantage in hiring – once everyone is scrambling, talent will be scarce and expensive."}, {"title": "Bài", "text": "Are Enterprises Ready for Quantum-Safe Cybersecurity"}, {"title": "Đoạn gốc (trang 21)", "text": "industry findings, the window to secure quantum-savvy talent is closing as demand will\nsurge [59]. So acting early could also be a competitive advantage in hiring – once everyone\nis scrambling, talent will be scarce and expensive. Also collaborate with industry groups\nor join pilot projects (some sectors have cross-company quantum readiness projects where\nyou can send delegates to learn and contribute). By developing internal skills, the enterprise not only addresses the current migration but also positions itself to handle future\ndevelopments (like if new algorithms emerge or new threats like quantum attacks on other\nsystems appear).\n• Monitor Threat Intelligence and Progress in Quantum Computing: Stay informed about\nadvancements in quantum computing that could alter the risk timeline. This means moni21"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q134", "title": "multi-hop", "blocks": [{"title": "Câu hỏi", "text": "What are the key differences in detection rates between the quantum machine learning approach for cybersecurity and the post-quantum cryptographic algorithms in terms of their resistance against attacks, and how do their computational efficiencies compare in practical benchmarks?"}, {"title": "Đáp án chuẩn", "text": "The quantum machine learning approach achieved a 96.4% detection rate for zero-day attacks and 99.7% for known ones, indicating high real-time detection capabilities. In contrast, the post-quantum cryptographic algorithms were benchmarked for computational efficiency, with key generation, encryption, and decryption/signing times measured on a standard hardware setup. These benchmarks help in understanding the practical performance and resource requirements of post-quantum algorithms compared to classical ones, but do not directly provide detection rates."}, {"title": "Bài A", "text": "Quantum Machine Learning for Cybersecurity"}, {"title": "Đoạn của bài A", "text": "of examining up to 220 potential attack vectors in parallel.\nThey benchmarked it against classical IDS systems for\ncomparison. Their methodology involved measuring detection\naccuracy, latency, and false-positive rates across known and\nzero-day attack scenarios under identical conditions. Thus,\nthey were able to perform a direct performance assessment\nbetween quantum and classical approaches. They found a\n96.4% detection rate for zero-day attacks and 99.7% for the\nknown ones. The false positive rate also was just 0.03%.\nThese results indicate potential for real-time detection and\nresponse at enterprise scale. Karamchand et al. [18] proposed\na mixed approach of quantum and classical detection in\ntheir framework targeting high-security deployments. In their\napproach, classical pre-processing was used to transform\ninputs into a high-dimensional feature space in which weak\nthreat patterns become more distinguishable. The transformed"}, {"title": "Bài B", "text": "A Comparative Study of Classical and Post-Quantum Cryptographic Algorithms in the Era of Quantum Computing"}, {"title": "Đoạn của bài B", "text": "5\nEmpirical Comparative Analysis and Practical Implications\nTo fully understand the impact of the transition from classical to post-quantum\ncryptographic algorithms, it is essential to analyze their practical performance,\nresource requirements, and resistance against both classical and quantum threats.\nThis section provides a comparative evaluation based on three axes: computational efficiency, key and ciphertext sizes, and security assumptions.\n5.1\nComputational Efficiency Across Platforms\nA practical benchmark was conducted to compare the average key generation,\nencryption, and decryption/signing times across classical algorithms (RSA-2048,\nECC-P256) and post-quantum candidates (Kyber-512, Dilithium-II, Falcon512), using standardized NIST test vectors and implementations optimized in C.\nTests were performed on a 2.4 GHz Intel CPU with 16 GB RAM under Linux."}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q135", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What optimization is described to replace modular multiplications with modular additions in the example code?"}, {"title": "Đáp án chuẩn", "text": "The first optimization is to replace modular multiplications with modular additions, by classically precomputing short discrete logarithms."}, {"title": "Bài", "text": "How to factor 2048 bit RSA integers with less than a million noisy qubits"}, {"title": "Đoạn gốc (trang 14)", "text": "the number of primes in the residue system which then reduces the total amount of work that\nneeds to be done. This compounded benefit notably improves the spacetime tradeoff of increasing\ns. For example, using s = 3 results in a computation that is both smaller and faster than using\ns = 1 despite the overhead of taking additional shots.\n2.4\nArithmetic Optimizations\nThe example code I showed in Figure 3 is simple, but inefficient. In this subsection, I describe\noptimizations that reduce its cost by orders of magnitude.\nThe first optimization is to replace modular multiplications with modular additions, by classically precomputing short discrete logarithms. This optimization was introduced in [CFS24], but I\ndescribe it here for completeness.\nRecall that, for each prime p in the residue system, we need to quantum compute a controlled\nproduct to get p’s residue Vp = V mod p:\nVp =\nm−1\nY\nk=0\nM ek\nk\n(mod p)\n(47)"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q136", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is a key difference between classical computers and quantum computers in terms of reversibility and energy dissipation?"}, {"title": "Đáp án chuẩn", "text": "Classical computers get around the fact that the laws of physics appear to be completely reversible by dissipating energy and thus making their computations thermodynamically irreversible. This appears impossible to do for quantum computers because superpositions of quantum states need to be maintained throughout the computation. Thus, quantum computers necessarily have to use reversible computation."}, {"title": "Bài", "text": "Polynomial-Time Algorithms for Prime Factorization and Discrete Logarithms on a Quantum Computer"}, {"title": "Đoạn gốc (trang 8)", "text": "3\nReversible logic and modular exponentiation\nThe deﬁnition of quantum gate arrays gives rise to completely reversible computation.\nThat is, knowing the quantum state on the wires leading out of a gate tells uniquely\nwhat the quantum state must have been on the wires leading into that gate. This is a\nreﬂection of the fact that, despite the macroscopic arrow of time, the laws of physics appear to be completely reversible. This would seem to imply that anything built with the\nlaws of physics must be completely reversible; however, classical computers get around\nthis fact by dissipating energy and thus making their computations thermodynamically\nirreversible. This appears impossible to do for quantum computers because superpositions of quantum states need to be maintained throughout the computation. Thus,\nquantum computers necessarily have to use reversible computation. This imposes extra costs when doing classical computations on a quantum computer, as is sometimes"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q137", "title": "multi-hop", "blocks": [{"title": "Câu hỏi", "text": "What specific PQC method did Apple iMessage implement to address the HNDL risk, and how does this compare to the PQC primitives discussed in the Telecom 2025 study for maintaining confidentiality against HNDL threats in large-scale deployments?"}, {"title": "Đáp án chuẩn", "text": "Apple iMessage implemented Falcon for addressing the HNDL risk, while the Telecom 2025 study discussed the use of CRYSTALS-Kyber and Dilithium. Both methods aim to ensure confidentiality, but Falcon is noted for its smaller key size, making it more suitable for devices with limited computational resources, whereas CRYSTALS-Kyber and Dilithium are mentioned as having larger key sizes, which could be a challenge for IoT and embedded systems."}, {"title": "Bài A", "text": "harvest-now-decrypt-later-pqc-threat-model"}, {"title": "Đoạn của bài A", "text": "Backup\nKEM\nFalcon\nEvaluation Lattice\n(NTRU)\n897 B\n666 B\nExcellent\nMedium\nHigh-perf\nsigning\n10. Real-World Case Studies: PQC Migration in Practice\nTheoretical analysis provides essential foundations, but practical deployment experience offers\ncritical validation. Leading organizations—major technology companies, governments, and\ninfrastructure providers—have initiated PQC implementations. The following case studies\ndocument their findings and lessons learned.\n10.1 Case Study: Apple iMessage PQ3 Protocol\nOrganization: Apple Inc.\nLaunched: February 2024\nScale: 2+ billion devices worldwide Status: Fully operational\nThe Challenge: iMessage launched in 2011 with end-to-end encryption by default. Great for\n2011. Problem? Users keep message histories for years, sometimes decades. Those archives\nface HNDL risk. With 2+ billion users, Apple couldn’t wait.\n31"}, {"title": "Bài B", "text": "Harvest-Now, Decrypt-Later - A Temporal Cybersecurity Risk in the Quantum Transition"}, {"title": "Đoạn của bài B", "text": "Telecom 2025, 6, 100\n6 of 23\nEarly performance evaluations confirm that PQC integration is feasible within existing\ncommunication stacks. Experiments embedding CRYSTALS-Kyber and Dilithium into TLS\nand VPN frameworks report manageable overheads and acceptable handshake latency,\nthough larger key sizes remain a challenge for IoT and embedded systems [17,19,30]. The\nprevailing best practice emphasizes comprehensive cryptographic inventory, incremental\nalgorithm updates, and synchronized migration aligned with national and international\nstandards [23,25]. By combining multiple layers such as PQC primitives, hybrid modes,\nagile key management, and forward-secure lifecycles, recent research delineates a viable\npathway for maintaining communications confidentiality against the HNDL threat [18,28].\n2.5. Research Gap and Novelty\nDespite growing awareness of the HNDL threat, existing research remains fragmented."}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q138", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What does the HNDL threat model quantify as a function of data confidentiality lifetime (Ld), attacker decryption horizon (Ha), and compromise probability?"}, {"title": "Đáp án chuẩn", "text": "This research introduces a mathematical framework quantifying HNDL risk as a function of data confidentiality lifetime (Ld), attacker decryption horizon (Ha), and compromise probability."}, {"title": "Bài", "text": "harvest-now-decrypt-later-pqc-threat-model"}, {"title": "Đoạn gốc (trang 6)", "text": "1. Formal Time-Dependent HNDL Threat Model. This research introduces a mathematical\nframework quantifying HNDL risk as a function of data confidentiality lifetime (Ld), attacker\ndecryption horizon (Ha), and compromise probability. This model enables organizations to\noperationalize quantum risk assessment by mapping data assets to their sensitivity timelines and\ncomparing against credible Q-Day scenarios. The model is both practical for risk prioritization\nand theoretically grounded in cryptographic and probabilistic reasoning.\n2. Sector-Level Exposure Quantification. Rather than treating quantum threat as generic, this\nstudy conducts granular analysis of how HNDL risk manifests differently across healthcare,\nfinancial services, government, critical infrastructure, and cloud environments. For each sector,\nthe analysis identifies the types of data, retention requirements, regulatory obligations, and"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q139", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What are the two novel QRL-based algorithms introduced in the QNN-QRL approach by Behera et al., 2025, and how do they enhance QKD?"}, {"title": "Đáp án chuẩn", "text": "In this approach, two novel QRL-based algorithms are introduced and integrated with a QNN implemented on BB84 and B92 protocols. This integration enhances security, optimizes key management, improves adaptability, reduces noise, and optimizes resource utilization."}, {"title": "Bài", "text": "Quantum key distribution through quantum machine learning - a research review"}, {"title": "Đoạn gốc (trang 3)", "text": "TABLE 1 Recent advancements in QML algorithms for QKD highlight current research gaps and future directions.\nQML in QKD\nProposed algorithm\nProspects\nConstraints\nQuantum machine learning\nin Quantum key distribution\nQNN-QRL: (Behera et al., 2025)\nIn this approach, two novel QRL-based\nalgorithms are introduced and integrated with\na QNN implemented on BB84 and\nB92 protocols. This integration enhances\nsecurity, optimizes key management,\nimproves adaptability, reduces noise, and\noptimizes resource utilization\nIntegration QNN-QRL with the classical\nsystem is challenging\nReinforcement learning in a quantum\nenvironment creates instability\nMany hardware constraints with the real-time\nimplementation of QNN-QRL\nOptimal parameter prediction for secure\nQKD using QML models (Bhargavi and\nSubramanya, 2020)\nOptimization of parameters enhances the key\nrate, and scalability, and reduces noise\nReliability, Standardization, Computational\noverload, and Training data dependency are\nmajor constraints"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q140", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "Which cryptographic libraries are mentioned as adding support for LMS specifically for post-quantum cryptography use?"}, {"title": "Đáp án chuẩn", "text": "wolfSSL and MbedTLS adding LMS specifically for this use [38,52]."}, {"title": "Bài", "text": "A Survey of Post-Quantum Cryptography Support in Cryptographic Libraries"}, {"title": "Đoạn gốc (trang 9)", "text": "is software/firmware signing for military equipment: a fighter\njet or satellite launched in 2025 may be in service until 2050,\nso its software updates must use signatures (like Dilithium or\nLMS) that a quantum computer in 2040 cannot forge. We see libraries responding: wolfSSL and MbedTLS adding LMS specifically for this use [38,52]. Government secure communications\n(e.g., VPNs between agencies) are also being tested with PQC.\nOpenVPN and SSL/TLS/IPsec stacks in government use (often OpenSSL) are expected to adopt hybrid key exchanges as\nsoon as OpenSSL supports them [19]. In addition, governmentregulated critical infrastructure (energy grids, transportation)\nis being advised by agencies such as Cybersecurity and Infrastructure Security Agency (CISA) to inventory and upgrade\ncrypto [30]. These often use libraries like OpenSSL/MbedTLS\nin their control systems, so the readiness of those libraries directly impacts these sectors. For instance, a power grid sensor"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q141", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "Which two lattice-based algorithms have been selected by NIST as standard recommendations for quantum-resistant cryptographic primitives?"}, {"title": "Đáp án chuẩn", "text": "Kyber and Dilithium stand out for achieving a favorable balance across security, performance, and ease of implementation. These lattice-based algorithms have been selected by NIST as standard recommendations for quantum-resistant cryptographic primitives."}, {"title": "Bài", "text": "A Comparative Study of Classical and Post-Quantum Cryptographic Algorithms in the Era of Quantum Computing"}, {"title": "Đoạn gốc (trang 12)", "text": "SHA-3, exhibit a higher degree of resilience. Although Grover’s algorithm offers\na quadratic speed-up in brute-force attacks against these primitives, the impact\ncan be mitigated by increasing key and output lengths. AES-256 and SHA512, for example, provide sufficient security margins in a post-quantum context,\npreserving the viability of symmetric and hash-based systems under quantum\nthreat models.\nAmong the post-quantum candidates, Kyber and Dilithium\nstand out for achieving a favorable balance across security, performance, and\nease of implementation. These lattice-based algorithms have been selected by\nNIST as standard recommendations for quantum-resistant cryptographic primitives. Their efficiency, relative simplicity, and strong theoretical underpinnings\nmake them suitable for widespread deployment. Further specificity is observed\nin the comparison of Falcon and SPHINCS+. Falcon produces compact and\nefficient digital signatures, which is advantageous for bandwidth-constrained"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q142", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What technique is used in CRYSTAL-Kyber and CRYSTAL-Dilithium to speed up polynomial multiplication?"}, {"title": "Đáp án chuẩn", "text": "The technique used is the creation of fast hardware designs for polynomial multiplication based on the Number Theoretic Transform (NTT) utilizing Digital Signal Processing (DSP) approaches."}, {"title": "Bài", "text": "Investigating CRYSTALS-Kyber Vulnerabilities - Attack Analysis and Mitigation"}, {"title": "Đoạn gốc (trang 7)", "text": "have been developed by researchers to speed up polynomial operations and modular\narithmetic, which are essential elements of the Kyber algorithm [45].\nOne noteworthy breakthrough is the creation of fast hardware designs for polynomial\nmultiplication based on the Number Theoretic Transform (NTT) in CRYSTAL-Kyber and\nCRYSTAL-Dilithium, utilizing Digital Signal Processing (DSP) approaches [46]. With the\ndedicated DSP units for modular multiplication, butterfly operations, and Point-Wise\nMultiplication (PWM) found in these designs, critical route delays are significantly reduced,\nand area and performance are improved.\nFurthermore, efforts have been made to improve the efficiency of Kyber implementations through the investigation of compact instruction set extensions and improved\nmodular multiplication approaches [47]. Kyber may be executed efficiently on devices\nwith limited resources thanks to these strategies, which seek to maximize speed while\nminimizing the use of hardware resources."}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q143", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the parameter efficiency of the proposed local-cost QCNN architecture in terms of trainable parameters scaling?"}, {"title": "Đáp án chuẩn", "text": "This parameter efficiency (O(log n) scaling) points toward a tangible quantum advantage in the domain of training latency and memory overhead."}, {"title": "Bài", "text": "Beyond Barren Plateaus - A Scalable Quantum Convolutional Architecture for High-Fidelity Image Classification"}, {"title": "Đoạn gốc (trang 14)", "text": "learning frameworks, while requiring exponentially fewer trainable parameters.\nThis parameter efficiency (O(log n) scaling)\npoints toward a tangible quantum advantage\nin the domain of training latency and memory\noverhead, particularly as dataset dimensionality\nscales beyond the reach of classical GPUs. Future physical deployment of this specific localcost QCNN architecture on trapped-ion or superconducting NISQ topologies will serve as the\nultimate validation of this scalable framework.\n5\nConclusion and Physical NISQ Deployment Considerations\nThe fundamental proposition of this research\nwas to demonstrate that Quantum Convolutional\nNeural Networks (QCNNs) can transition from\nmathematical curiosities to scalable, high-fidelity\nclassifiers.\nBy systematically dismantling the\nroot causes of the barren plateau phenomenon,\nour architecture resolves the primary scalability\nbottleneck that has historically crippled variational quantum algorithms.\nThe integration of"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q144", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the value of d in terms of p and q after the post-processing step?"}, {"title": "Đáp án chuẩn", "text": "With high probability it will be the case that d = p + q −2, where p, q are the prime factors."}, {"title": "Bài", "text": "How to factor 2048 bit RSA integers with less than a million noisy qubits"}, {"title": "Đoạn gốc (trang 14)", "text": "Ekerå-Håstad-style period finding works as follows. The algorithm is given a positive integer\nparameter (s). A classical value g is chosen, uniformly at random, from Z∗\nN (the multiplicative\ngroup modulo N). A second classical value h = gN−1 mod N is derived from g and N. An n/2 +\n⌈n/(2s)⌉qubit register (x) is prepared into a uniform superposition. An ⌈n/(2s)⌉qubit register (y)\nis similarly prepared into a uniform superposition. The value gxhy (mod N) is computed under\nsuperposition, and discarded. Then x and y are measured in the frequency basis, producing a\ndata point (x′, y′). This is repeated at least s + 1 times. Post-processing then recovers, with high\nprobability, d = dlogg (mod N)(h) from the list of recorded points. With high probability it will be\nthe case that d = p + q −2, where p, q are the prime factors, because\ngd mod N = h mod N\n= gN−1 mod N\n= gpq−1 mod N\n= g(p−1)(q−1)+p+q−2 mod N\n= gp+q−2 mod N\n(46)"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q145", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the QML-IDS system and what components does it integrate according to Figure 2?"}, {"title": "Đáp án chuẩn", "text": "Figure 2 shows the working of the QML-IDS system, which integrates classical and quantum components including network monitoring, quantum circuit optimization, QML model execution (VQC, QSVM, QCNN), and classical post-processing for threat detection and evaluation."}, {"title": "Bài", "text": "Quantum Machine Learning for Cybersecurity"}, {"title": "Đoạn gốc (trang 7)", "text": "7\nNetwork Monitoring\nFeature Extraction\nClassical preprocessing\nClassical Optimization\nClassical SVM\nClassical Optimization\nClassical Ouput\nNetwork Alerts\nMetrics and System\nEvaluation\nFeature Map\nCircuit\nTranspilation\nCircuit\nOptimization\nAnsatz\nQuantum Kernel\nQCNN Network\nClassical Data Input\nQuantum Pre-processing\nQML Models \nClassical Learning\nPost-processing\nVQC\nQVSM\nQCNN\nFigure 2: Operational flowchart of QML-IDS showing end-to-end integration of classical and quantum components, including\nnetwork monitoring, quantum circuit optimization, QML model execution (VQC, QSVM, QCNN), and classical post-processing\nfor threat detection and evaluation.\nclassical methods in all aspects, they were equal to or superior\nto traditional methods. Figure 2 shows the working of the\nQML-IDS system.\nD. Malware\nQML has been recently explored in the domain of malware\ndetection and containment. Malware evolves rapidly, and QML\ncan offer adaptive detection, improving detection accuracy that"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code": "Q146", "title": "single-hop", "blocks": [{"title": "Câu hỏi", "text": "What is the form of the loss function in a Quantum Neural Network (QNN) and what do the symbols in the equation represent?"}, {"title": "Đáp án chuẩn", "text": "The minimized loss function in a QNN is typically defined as the expected value of an observable 𝑂and is shown by Equation (27). 𝐿(𝜃) = ⟨𝜓(𝜃)|𝑂|𝜓(𝜃)⟩, where |𝜓(𝜃)⟩ is the QNN state defined in Equation (26), and 𝑂 is a Hermitian operator corresponding to the measurement observable related to the classification or regression task."}, {"title": "Bài", "text": "A Survey of Quantum Machine Learning - Foundations,Algorithms, Frameworks, Data and Applications"}, {"title": "Đoạn gốc (trang 16)", "text": "measurement correspond to expectation values of certain observables, which are used to compute a\nloss function. This loss is then minimized using a classical optimization routine, typically executed\non a classical computer as part of a hybrid quantum-classical loop. The nature of the measurement\nalso introduces statistical noise due to the probabilistic nature of quantum mechanics, so multiple\nrepetitions (shots) are required to obtain reliable estimates. Managing this noise is a key practical\nchallenge in current implementations.\nThe minimized loss function in a QNN is typically defined as the expected value of an observable\n𝑂and is shown by Equation (27).\n𝐿(𝜃) = ⟨𝜓(𝜃)|𝑂|𝜓(𝜃)⟩,\n(27)\nwhere |𝜓(𝜃)⟩is the QNN state defined in Equation (26), and 𝑂is a Hermitian operator corresponding\nto the measurement observable related to the classification or regression task.\nCompared to classical neural networks, QNNs offer several potential advantages. First, quantum"}, {"key": "keep", "group": "Kết quả duyệt", "prompt": "Câu này:", "options": [[1, "Giữ (1)", "y"], [2, "Giữ, cần sửa (2)", ""], [0, "Loại (0)", "n"]]}]}, {"code":
